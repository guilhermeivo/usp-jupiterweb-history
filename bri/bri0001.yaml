courses:
  activation: 01/01/2015
  assessment: 'A avaliação da disciplina BRI0001 é feita mediante análise de dois
    ensaios

    apresentados pelos alunos, contendo a síntese dos seminários realizados e uma

    apreciação crítica do conteúdo da palestra. Por este motivo, não cabe a

    realização de prova de recuperação nesta disciplina.'
  bibliography: Será indicada em função dos temas das conferências.
  course: 'A disciplina oferece ao aluno no segundo semestre letivo um tema estruturante
    e relevante para as relações internacionais na perspectiva brasileira. Cada tema
    é desenvolvido por meio de uma abordagem conceitual e de encontros com profissionais
    de reconhecido talento e competência que têm se destacado no campo das relações
    internacionais. A origem institucional diversificada dos expositores convidados
    permitirá ao aluno o contato com uma diversidade de referências de tempo e valores.
    Para registro, os temas abordados nos anos anteriores foram: O Brasil e a Cooperação
    Internacional (2011), O Brasil na América do Sul (2012) e Relações Internacionais
    nos Estados e Municípios Brasileiros (2013). Relações Internacionais e  Empresas
    Transnacionais (2014).'
  course_name: 'BRI0001 - Temas e Prática em Relações Internacionais

    Themes and Pratice in International Relations'
  deactivation: ''
  instructors: '31440 - Jacques Marcovitch

    1518253 - Pedro Bohomoletz de Abreu Dallari'
  lecture_credits: '2'
  objectives: A disciplina consiste num projeto acadêmico sobre temas relacionados
    às Relações Internacionais oferecendo ao aluno possibilidades de aplicação dos
    conhecimentos adquiridos no curso. Além disso, a disciplina "Temas e Prática em
    Relações Internacionais" esta estruturada para induzir o aluno a pensar no seu
    projeto de vida como cidadão e profissional. Como cidadão, acompanhando com maior
    profundidade e posicionando-se criticamente quanto à evolução das relações internacionais.
    A percepção de um mesmo fato sob perspectivas distintas, às vezes opostas, desenvolve
    este posicionamento crítico.  Como futuro profissional identificando, no convívio
    com o outro, suas próprias habilidades e atitudes a serem valorizadas, assim como
    as competências a serem desenvolvidas à luz de sua visão de futuro.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
