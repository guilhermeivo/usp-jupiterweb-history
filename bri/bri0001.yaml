  course: 'A disciplina ministrada no segundo semestre letivo analisa um tema estruturante
    e relevante para as relações internacionais na perspectiva brasileira. Cada tema
    é desenvolvido por meio de uma abordagem conceitual e de encontros com profissionais
    de reconhecida competência que têm se destacado no campo das relações internacionais.
    A origem institucional diversificada dos expositores convidados permite ao aluno
    o contato com uma diversidade de referências de tempo e valores. Os temas abordados
    em anos anteriores foram: O Brasil e a Cooperação Internacional (2011); O Brasil
    na América do Sul (2012); Relações Internacionais nos Estados e Municípios Brasileiros
    (2013); e “Relações Internacionais e Empresas Transnacionais” (2014). Relações
    internacionais e organizações não-governamentais (2015); Entidades Multilaterais
    e Relações Internacionais (2016); Tendências e Riscos Globais (2017); Desafios
    e tendências no mundo em transformação (2018,2021); Tendências Globais: rupturas
    e desafios (2019). Relações Internacionais na construção da nova era (2020) Relações
    Internacionais no mundo em transformação (2022,2023) Desafios geopolíticos rumo
    a nova era em construção (2024).

    Instrumentos e Critérios de Avaliação'
  course_name: 'BRI0001 - Temas e Prática em Relações Internacionais

    Themes and Pratice in International Relations'
  deactivation: ''
  instructors: '31440 - Jacques Marcovitch

    1518253 - Pedro Bohomoletz de Abreu Dallari'
  lecture_credits: '2'
  objectives: '"Temas e Prática em Relações Internacionais" consiste num projeto acadêmico
    sobre a prática das Relações Internacionais. A disciplina tem por objetivo apresentar
    e discutir uma análise das tendências mundiais que marcam o contexto internacional.
    Em seguida, oferece aos estudantes alternativas de aplicação dos conhecimentos
    adquiridos para induzir o pensar no seu projeto de vida como cidadão e profissional.
    Como cidadão, acompanhando com maior profundidade e posicionando-se criticamente
    quanto à evolução das relações internacionais. A percepção de um mesmo fato sob
    perspectivas distintas, às vezes opostas, desenvolve este posicionamento crítico.
    Como futuro profissional, identificando, no convívio com o outro, suas próprias
    habilidades e atitudes a serem valorizadas, assim como as competências a serem
    desenvolvidas à luz de sua visão de futuro.'
