  course: "AULA 1\nOs conceitos de nação, Estado e Estado-nação\n-\tTeorias e elementos\
    \ do Estado, Poder Nacional e seus componentes\n-\tConceitos de Geopolítica e\
    \ Geoestratégia\nAULA 2\nConceitos-chave de segurança\n-\tSegurança Nacional\n\
    -\tSegurança Regional\n-\tSegurança Abrangente\n-\tSegurança Comum\nAULA 3\nGuerra\n\
    -\tTeorias e causas da guerra.\n-\tPrincípios da guerra\n-\tGuerra contemporânea:Guerra\
    \ Convencional na Era Nuclear, Guerra Limitada, Guerra Revolucionária, Guerrilha,\
    \ Insurgência e Contra-Insurgência.\nAULA 4"
  course_name: 'BRI0093 - Segurança e Defesa

    Security and Defense'
  deactivation: ''
  instructors: 3230041 - Leandro Piquet Carneiro
  lecture_credits: '4'
  objectives: "da Segurança Nacional\n-\tValores e Interesses Nacionais\n-\tNão Alinhamento,\
    \ Equilíbrio de Poder e Segurança Coletiva\n-\tFormas de Poder e suas transformações\n\
    AULA 5\nPolíticas de Defesa e Segurança\n-\tPrincípios, formulação, objetivos\
    \ e processo decisório\n-\tOrganizações Nacionais de Segurança\n-\tOrganizações\
    \ Para-militares e defesa civil\n-\tRelações Civis-Militares\nAULA  6\nDissuasão\
    \ e Détente: Conceito, Teorias da dissuasão nuclear e suas correntes\n-\tCorrida\
    \ Armamentista, Comércio e Proliferação de Armas\n-\tProliferação Nuclear e tratados\
    \ internacionais\n-\tComplexo Militar Industrial.\n-\tAlianças e pactos militares,\
    \ tratados de paz, cooperação em matéria de defesa,\nAULA 7\nO sistema de governança\
    \ dos direitos humanos\n-\tDireitos Humanos e Conflitos Armados\n-\tO problema\
    \ dos Conflitos armados internos\n-\tTribunal Penal Internacional e o Estatuto\
    \ de Roma\n-\tO problema dos refugiados: causas da migração  e populações em áreas\
    \ fronteiriças e segurança de fronteira\n-\tO Sistema Interamericano de Defesa\
    \ dos Direitos Humanos\nAula 8\nTerrorismo\n-\tConceito e tipos (nacional, internacional\
    \ e transfronteiriço).\n-\tIdeologias Conflitantes: Militarismo, Nacionalismo,\
    \ Fundamentalismo e Separatismo\nAULA 9\nFim da guerra fria e surgimento de nova\
    \ ordem mundial.\n-      Reestruturação da ONU\n-\tQuestões ambientais globais:\
    \ aquecimento global, desertificação e  desmatamento\n-\tCibersegurança e Biossegurança\n\
    AULA 10\nSegurança Doméstica e Crime Organizado\n-\tO processo de transnacionalização\
    \ do crime organizado\n-\tLavagem de dinheiro, narcotráfico, biopirataria e tráfico\
    \ humano\n-\tCooperação jurídica internacional em matéria criminal\n-\tA convergência\
    \ crime-terror"
