  assessment: 'A recuperação será realizada até uma semana antes do término do período
    de retificação de matrícula, e consta de duas provas, sendo uma teórica e outra
    prática, realizadas no mesmo dia. A média final será dada pela fórmula: Média
    = média da avaliação final + média da recuperação /2.'
