  course: 'Abordagem ao Raciocínio Clínico

    Princípios de Fluidoterapia

    Cuidados com neonatos e filhotes de cães e gatos

    Particularidades no tratamento de felinos

    Principais doenças infecciosas

    Principais doenças dermatológicas

    Principais doenças endócrinas

    Principais doenças do sistema urinário

    Principais doenças cardíacas

    Principais doenças respiratórias

    Instrumentos e Critérios de Avaliação'
  course_name: 'VCM4201 - Clínica Médica de Pequenos Animais

    Small Animal Internal Medicine'
  deactivation: ''
  instructors: '407831 - Archivaldo Reche Junior

    233956 - Denise Saretta Schwartz'
  lecture_credits: '6'
  objectives: A disciplina compreende a verificação do histórico e dos sintomas associadas
    às alterações funcionais e/ou metabólicas que acometem os pequenos animais, principalmente
    cães e gatos. O intuito será de desenvolver metodologia para o raciocínio que
    irá relacionar os achados clínico-laboratoriais com as principais doenças que
    possam estar envolvidas. O curso teórico e prático permitirá, com base nas informações
    referidas, a determinação quanto a etiologia, diagnóstico provável, prognóstico,tratamento
    e profilaxia.
  practical_credits: '0'
  total_workload: 90 h
  type: Semestral
