  assessment: 'Uma prova teórica e uma prova teórico-prática de recuperação serão
    realizadas em data previamente agendada, sendo a nota final de recuperação igual
    à média aritmética das duas provas (teórica e

    prática). E a média final da disciplina será calculada pela média aritmética da
    média obtida no semestre letivo e a média das provas de recuperação.'
