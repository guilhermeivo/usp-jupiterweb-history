  course: '- Enfermidades do sistema respiratório: tosse, traqueites, bronquites e
    bronquiolites, pneumonias,

    -pleurisia e edema pulmonar.

    -Enfermidades do sistema circulatório: valvulopatias, miocardiopatias, arritmias,
    insuficiência cardíaca.

    - Enfermidades do sistema digestório: síndrome icterícia, insuficiência hepática,
    diarreia.

    - Enfermidades do sangue e do sistema hematopoético: estados hemorrágicos, estados
    anêmicos,

    neoplasias hematopoéticas.

    - Enfermidades do sistema urinário: síndromes nefrótico e urêmico. Insuficiência
    renal.

    - Sistema nervoso: paralisia, ataxia. Distúrbios convulsivos.

    - Síndromes e desequilíbrios: febre, poliúria e polidipsia, endotoxemia, distúrbios
    eletrolíticos.

    Instrumentos e Critérios de Avaliação'
