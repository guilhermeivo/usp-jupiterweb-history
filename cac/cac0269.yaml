  bibliography: 'BENJAMIM, W. Textos Escolhidos. Que é o Teatro Épico? São Paulo:
    Editora Abril Cultural, 1975.

    BERRY, C. Voice and the Actor. Londres: Harrap London, 1973.

    GAYOTTO, L. H. Voz: Partitura da Ação.São Paulo: Summus Editorial, 1997.

    GOLDSTEIN, N.  Versos, Sons, Ritmos. São Paulo: Editora Ática, 1985.

    GROTOWSKI, J.  Ordem Externo, Intimidad Interna. In MÁSCARA. Cuadernos Latinoamericanos
    de Reflexión sobre Escenologia. Páginas 189 a 201. Ano 2. Nº 4/5. México, abril
    de 1991.

    ROSENFELD, A. O Teatro Épico. São Paulo: Editora Perspectiva, 1985.

    SEIDEN, S.: Voz y Movimiento. In MÁSCARA. Cuadernos Latinoamericanos de Reflexión
    sobre Escenologia. Páginas 145 a158. Ano 2. Nº 4/5. México, abril de 1991.'
  course: "1.\tPreparação, ação e sustentação: criação de rotina coletiva.\n2.\tPotenciais\
    \ da voz: respiração, intensidade, flexibilidade tonal, ressonância, articulação,\
    \ dicção, volume, projeção, duração, pausas, velocidade e ritmo.\n3.\tSonoridade\
    \ das palavras e sua relação com os significados, as imagens e as ações da fala\
    \ poética.\n4.\tO sujeito lírico. O tempo em suspensão.  Atmosfera e imagens.\n\
    5.\tImproviso vocal dentro do universo lírico, utilizando-se os potenciais da\
    \ voz.\n6.\tO sujeito épico. Ação do narrador.\n7.\tImproviso vocal dentro do\
    \ universo épico, utilizando-se os potenciais da voz.\n8.\tO sujeito dramático.\
    \ O ator como síntese das polaridades lírica e épica, associadas ao cantor e ao\
    \ narrador.\n9.\tImproviso vocal dentro do universo dramático, utilizando-se os\
    \ potenciais da voz.\n10.\tEstratégias de apropriação do texto dramático.\n11.\t\
    Ação do corpo-voz no campo do jogo dramático.\n12.\tEncenação da voz."
  course_name: 'CAC0269 - Poéticas da Voz III

    Voice Poetics III'
  deactivation: 30/01/2023
  lecture_credits: '2'
  objectives: "1.\tLevar o aluno a desenvolver um processo autônomo de construção\
    \ e desempenho da palavra cênica, síntese de clareza e fluência.\n2.\tEstimular\
    \ a ação dos potenciais criativos da voz e da palavra, no âmbito das imagens e\
    \ da ações da voz.\n3.\tPesquisar e provocar poéticas com a fala criativa, nos\
    \ campos do sujeito lírico, épico e dramático."
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
