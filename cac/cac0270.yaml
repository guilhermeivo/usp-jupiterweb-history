  course: 'a) Técnicas de: relaxamento,

    respiração,

    impulso,

    direção,

    apoio,

    articulação,

    ressonância.

    b) Funcionamento do aparelho vocal.

    c) Classificação vocal.

    d) Percepção e análise melódicas: altura, pulso, tempo, ritmo,frases, andamento,
    silêncios, cesuras e respirações, ataques,legato/staccato,dinâmicas, ornamentos.

    d) Repertório: música coral,

    música de câmara,

    música popular,

    música para teatro.

    e) Uso de microfone e aparelhagem de som.

    f) Aspectos pedagógicos do Canto para o Ator.'
  course_name: 'CAC0270 - Canto Para o Ator

    Singing for the actor'
  deactivation: 30/01/2023
  lecture_credits: '4'
  objectives: 'Transmitir os princípios básicos de técnica vocal e interpretação musical,
    propondo ao aluno: l.Executar o respertório vocal de peças teatrais; 2.Aprender
    a estudar as peças requeridas; 3.Praticar uma higiene vocal adequada; 4.Adequar
    as relações entre texto musical  e cena;5.Desenvolver competências para a criação
    de novas relações; 6. Adequar  expressiva e fisicamente a relação música/canto/palavra/movimento.'
