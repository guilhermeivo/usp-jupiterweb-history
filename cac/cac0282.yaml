  course: '-Audição e Escuta: o repertório sonoro e suas relações; paisagem sonora.

    -A música: parte da paisagem .

    -Relações: ruídos, som, corpo,voz.

    -Parâmetros sonoros : altura, intensidade, timbre,duração:articulação, estruturação,
    organização .

    -Pulso: a idéia de tempo.

    -Silêncio.

    -Mousiké e cronotopo artístico.

    -Improvisação musical e improvisação teatral: interseções.

    -Composição musical da cena.

    - Aspectos pedagógicos das relações entre música e ritmo.'
  course_name: 'CAC0282 - Música e Ritmo

    Music and Rhythm'
  deactivation: 30/01/2023
  lecture_credits: '4'
  objectives: 'Estabelecer bases teórico-práticas para a compreensão dos aspectos
    musicais que servem de arcabouço à cena, enfatizando a temporalidade e o ritmo.

    Desenvolver competências e habilidades musicais do ator como ferramentas para
    a resolução de problemas cênicos.'
