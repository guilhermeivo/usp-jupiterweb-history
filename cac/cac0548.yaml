  course: '1. Apresentação do curso, bibliografia. Aspectos pedagógicos da História
    das Artes Cênicas.

    2. A origem da cultura e do imaginário humano; A narrativa e a expressão da temporalidade
    humana

    3. As narrativas estéticas e o princípio da Arte.

    4. Panorama da civilização grega. O teatro grego: origens e desenvolvimento

    5. A evolução da tragédia: Os autores e os teóricos.

    6. A evolução da comédia. O drama satírico, autores. As formas do teatro popular.

    7. O espetáculo: as Dionisíacas. Organização e realização. O espaço cênico. A
    cenografia. A indumentária. As máscaras.

    8. O teatro romano. A origem. Formas teatrais. Os autores

    9. Narrativas e vida social: tempo, espaço, palco e platéia.

    10. As diversas instâncias da percepção estética

    11. Idade Média: O teatro religioso.

    12. Idade Média: O teatro profano.

    13. O aspecto pedagógico do teatro medieval

    14. O nascimento do teatro em língua portuguesa.'
  course_name: 'CAC0548 - História das Artes Cênicas I

    Scenic Arts History I'
  deactivation: ''
  instructors: 33122 - Clóvis Garcia
  lecture_credits: '4'
  objectives: "Oferecer uma introdução à História das Artes Cênicas, desde suas origens\
    \ ocidentais até a Idade Média européia. O curso abrange as formas espetaculares\
    \ da manifestação teatral \x96 texto e cena - e busca situar estas manifestações\
    \ no contexto sócio cultural de cada uma das épocas enfocadas, analisando a expressão\
    \ teatral como uma das formas pelas quais o homem expressa sua experiência com\
    \ a realidade, através de uma manifestação estética. Assim, procura-se trabalhar\
    \ a especificidade da expressão teatral do mundo antigo e moderno ocidental."
  practical_credits: '4'
  total_workload: '180 h

    (

