  course: "1.\tPalavra, Poder e Memória: as Musas, Palavras-cantadas.\n2.\tEstado\
    \ de escuta: silêncio e relaxamento; observação de si, do outro e do espaço; descoberta\
    \ e construção da percepção do som e do silêncio.\n3.\tEstado de música: cantos\
    \ coletivos. Criatividade vocal. Paisagens sonoras.\n4.\tPotenciais da Voz: conexões\
    \ acústicas e fisiológicas.\n5.\tAtitude postural: articulações, eixo e vetores\
    \ corporais. Posição ?: silêncio. Saúde Vocal.\n6.\tPulso, andamento e ritmo.\
    \ Preparação, ação e sustentação do silêncio e do som. Os sete passos: pés, joelhos,\
    \ pélvis, coluna, ombros, cotovelos, mãos.\n7.\tVozes da Cidade: pesquisa sonora\
    \ a partir de uma escuta urbana.\n8.\tAções da respiração: ossos e músculos. Fases,\
    \ salas, ritmos e modos respiratórios. Palavras no ar.\n9.\tPescoço e estruturas\
    \ orofaciais: flexibilização.\n10.\tPotenciais da Voz: ações da laringe, pescoço,\
    \ língua e boca.  Sonoridade e sentido das palavras.\n11.\tFormação e ressonância\
    \ dos fonemas.\n12.\tRotina pessoal de treinamento.\n13.\tAspectos Pedagógicos\
    \ das Poéticas da Voz.\n14.\tAbordagem de Stanislavski.\n15.\tAbordagem de Grotowski."
  course_name: 'CAC0410 - Poéticas da Voz I

    Voice Poetics I'
  deactivation: 11/03/2014
  lecture_credits: '4'
  objectives: "1.\tLevar o aluno a descobrir e construir seus potenciais vocais, com\
    \ ênfase na descoberta, nos campos do silêncio e do ruído, do som e do sentido.\n\
    2.\tEstimular a percepção e amplificação dos espaços interiores da voz.\n3.\t\
    Proporcionar experiências da voz entendida como pulsação corporal no espaço e\
    \ no tempo."
