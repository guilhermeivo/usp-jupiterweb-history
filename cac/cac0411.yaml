  course: '1.Relações entre requisitos e potenciais da voz.

    2.Criatividade e improviso vocal: a palavra.

    3.Sustentação das salas de ar: superior, média e inferior.

    4.Impulso respiratório: costo-diafragmático-abdominal.

    5.Ações da respiração: elástica, frenagem e impulso.

    6.Preparação, ação e sustentação da palavra.Flexibilidade tonal.

    7.Relações entre articulação e ressonância. Clareza e fluência.

    8.Tempo e ritmo: correspondência entre pulso e altura, nos campos dos pés, das
    mãos e da voz. Velocidades e pausas.

    9.Potenciais da voz: intensidade, volume e projeção. Ênfase.

    10.Aspectos Pedagógicos das Poéticas da Voz.

    11.Dimensões do sujeito, nos contextos lírico, dramático e épico: o eu, a pessoa
    e o cidadão.

    12.A dicção lírica: conexões musicais.

    13.Abordagem de Artaud.

    14.A dicção épica: fluência narrativa.

    15.Abordagem de Brecht.'
  course_name: 'CAC0411 - Poéticas da Voz II

    Voice Poetics II'
  deactivation: 11/03/2014
  lecture_credits: '4'
  objectives: '1.Levar o aluno a construir seus potenciais vocais, nos campos do silêncio
    e do ruído, do som e do sentido: da palavra.

    2.Estimular a amplificação e a sustentação dos espaços interiores da voz.'
