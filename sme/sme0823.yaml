  bibliography: 'Complementar:

    - McCullagh, P. and Nelder, J.A. (1989). Generalized linear models, second Edition.
    London: Chapman and Hall.

    - Collet, D. (2002). Modelling binary data. 2nd Edition, London: Chapman and Hall.

    - Demetrio, C. G. B. (2002). Modelos Lineares Generalizados em Experimentação
    Agronômica. ESALQ/USP.'
  course: 'Modelos Lineares Generalizados: Definição. Função desvio. Métodos de Estimação.Teste
    de hipóteses. Técnicas de diagnóstico. Aplicações. Regressão Logística: Métodos
    clássicos. Regressão Logística linear. Modelos de dose-resposta. Técnicas de diagnóstico.
    Seleção de modelos. Regressão logística condicional. Aplicações. Regressão de
    Poisson: Métodos clássicos. Modelos log-lineares. Classificação de modelos. Relação
    com modelos multinomiais. Aplicações. Modelos de Quase-Verrossimilhança: Definição.
    Estimação e Testes. Aplicações

    Generalized linear models: Definition. Deviance function. Methods of estimation.
    Hypothesis testing. Diagnostic techniques. Applications. Logistic Regression:
    Classical methods. Linear Logistic regression. Dose-response models. Diagnostic
    techniques. Model selection. Conditional Logistic Regression. Applications. Poisson
    regression: Classical methods. Log-linear Models. Model classification. Relation
    with multinomial models. Applications. Quasi-likelihood methods: Definition. Estimation
    and tests. Applications.'
  course_name: 'SME0823 - Modelos Lineares Generalizados

    Generalized Linear Models'
  deactivation: 31/12/2018
  instructors: 3455521 - Cibele Maria Russo Novelli
  lecture_credits: '4'
  objectives: 'Apresentar conceitos introdutórios de modelos lineares generalizados
    em um enfoque computacional.

    Present introductory concepts of generalized linear models in a computational
    approach.'
  practical_credits: '0'
  total_workload: 60 h
