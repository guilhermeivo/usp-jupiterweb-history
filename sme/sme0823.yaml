  bibliography: 'Complementar:

    - McCullagh, P. and Nelder, J.A. (1989). Generalized linear models, second Edition.
    London: Chapman and Hall.

    - Collet, D. (2002). Modelling binary data. 2nd Edition, London: Chapman and Hall.

    - Demetrio, C. G. B. (2002). Modelos Lineares Generalizados em Experimentação
    Agronômica. ESALQ/USP.'
  course: 'Aprendizado Supervisionado versus Aprendizado Não-Supervisionado. Modelos
    Lineares Generalizados: Definição. Função desvio. Métodos de Estimação. Teste
    de hipóteses. Técnicas de diagnóstico. Aplicações: Modelos Lineares Generalizados
    versus Classificação. Regressão Logística: Métodos clássicos. Regressão Logística
    linear. Modelos de dose-resposta. Técnicas de diagnóstico. Seleção de modelos.
    Aplicações. Regressão de Poisson: Métodos clássicos. Modelos log-lineares. Classificação
    de modelos. Regressão Logística Múltipla. Aplicações. Modelos de Quase-Verrossimilhança:
    Definição. Estimação e Testes. Aplicações. Avaliação da capacidade preditiva dos
    modelos. Compromisso entre viés e variância.

    Supervised versus Unsupervised Learning. Generalized linear models: Definition.
    Deviance function. Methods of estimation. Hypothesis testing. Diagnostic techniques.
    Applications: Generalized linear models versus Classification. Logistic Regression:
    Classical methods. Linear Logistic regression. Dose-response models. Diagnostic
    techniques. Selection model. Applications. Poisson regression: Classical methods.
    Log-linear Models. Classification of Models. Multiple Logistic Regression. Applications.
    Quasi-likelihood methods: Definition. Estimation and tests. Applications. Evaluation
    of the predictive capacity of the models. Bias-variance trade-off.'
  course_name: 'SME0823 - Modelos de Regressão e Aprendizado  Supervisionado II

    Regression Models and Supervised Learning II'
  deactivation: ''
  instructors: 3455521 - Cibele Maria Russo Novelli
  lecture_credits: '4'
  objectives: 'Apresentar conceitos introdutórios de modelos lineares generalizados
    em um enfoque computacional.

    Present introductory concepts of generalized linear models in a computational
    approach.'
