  course: '1. Fundamentação teórica das práticas em aprendizagem ativa: teorias de
    aprendizagem e desenvolvimento humano

    2. Reflexão e análise de situações reais, seus desafios e modos de superação ou
    adaptação

    3. Flipped Classroom (Sala de Aula Invertida)

    4. Os Métodos Scale-up e Peer Instruction (Instrução pelos Colegas)

    5. As Estratégias do TBL (Team-Based Learning)

    6. Metodologias ativas em salas de aula numerosas

    7. Metodologias ativas e os documentos oficiais'
  course_name: 'PRG0036 - Metodologias Ativas e Referenciais Pedagógicos de Co-aprendizagem
    para Ciências da Natureza

    Active Methodologies and Pedagogical References for co-learning for Natural Sciences'
  deactivation: ''
  instructors: 1451711 - Marcelo Alves Barros
  lecture_credits: '2'
  objectives: Fornecer subsídios teórico-práticos para os professores organizarem
    situações de aprendizagem centradas nos estudantes e vivenciarem uma imersão nas
    metodologias ativas de aprendizagem, aprendendo seus fundamentos, sua importância,
    as fontes de implementação em sala de aula e os critérios de avaliação da aprendizagem.
  practical_credits: '0'
  total_workload: 30 h
