  course: "Os temas serão adaptados a cada oferta de acordo com a formação e as linhas\
    \ de pesquisa dos professores responsáveis por ministrar o curso. Entretanto,\
    \ em termos gerais, algumas temáticas previstas são:\nMudanças climáticas e impactos\
    \ nos mundos natural, social, político e econômico\nEfeitos de Tecnologias disruptivas\
    \ nas forma de vida em sociedade\nEcologia, sustentabilidade e cidadania planetária\n\
    Biotecnologia, nanotecnologia: solução de velhos problemas e criação de novos\n\
    Relações entre ciência e sociedade (Fake News, negacionismo científico, limites\
    \ daq racionalidade científica, multiculturalismo, decolonidade).\nPermacrises1\
    \ (na agricultura, na saúde pública, nas questões socioambientais e tecnocientíficas)\n\
    Bioética e o futuro da ciência\nEste curso será desenvolvido mediante três momentos:\n\
    1. Diálogos teóricos interdisciplinares: Referente à fundamentação conceitual\
    \ necessária para a abordagem abrangente das temáticas que estruturam o curso,\
    \ mapeamentos e revisões de literatura.\n2. Aprofundamento em questões específicas\
    \ sobre cada um dos temas contemporâneos selecionados para estudo durante o semestre,\
    \ por meio de vivências colaborativas ou outras alternativas didáticas, inter\
    \ e transdisciplinares que promovam debates e articulação entre as diferentes\
    \ áreas do conhecimento.\n3. Metodologias para o desenho, implementação e avaliação\
    \ de propostas educacionais para o ensino de temas contemporâneos em educação\
    \ científica com foco na Educação Básica.\nThe topics will be adapted for each\
    \ programme according to the training and lines of research of the teachers responsible\
    \ for teaching the course. However, in general terms, some of the themes envisaged\
    \ are:\nClimate change and its impact on the natural, social, political and economic\
    \ worlds\nEffects of disruptive technologies on the way we live in society\nEcology,\
    \ sustainability and planetary citizenship\nBiotechnology, nanotechnology: solving\
    \ old problems and creating new ones\nRelations between science and society (Fake\
    \ News, scientific denialism, limits of scientific rationality, multiculturalism,\
    \ decolonisation).\nPermacrises  (in agriculture, public health, socio-environmental\
    \ and techno-scientific issues)\nBioethics and the future of science\nThis course\
    \ will be developed in three stages:\n1.\tInterdisciplinary theoretical dialogues:\
    \ This refers to the conceptual foundation necessary for a comprehensive approach\
    \ to the themes that structure the course, mapping and literature reviews.\n2.\t\
    In-depth study of specific issues on each of the contemporary themes selected\
    \ for study during the semester, through collaborative experiences or other didactic,\
    \ inter- and transdisciplinary alternatives that promote debate and articulation\
    \ between the different areas of knowledge.\n3.    Methodologies for the design,\
    \ implementation and evaluation of educational proposals for the teaching of contemporary\
    \ themes in science education with a focus on Basic Education."
  course_name: 'PRG0045 - Temas Contemporâneos em Educação Científica

    Contemporary Issues in Science Education'
  deactivation: ''
  instructors: 2104163 - Mauricio Pietrocola Pinto de Oliveira
  lecture_credits: '2'
  objectives: 'da atividade

    Partindo do princípio da indissociabilidade entre ensino, pesquisa e extensão,
    as ações extensionistas no âmbito desse componente curricular têm, como objetivo
    geral, contribuir para a ampliação da relação Universidade e Sociedade.

    Este processo ocorre em diversas dimensões, abrangendo desde a esfera educacional
    até a dimensão curricular da área de ciências da natureza. As iniciativas do Componente
    Curricular visam fomentar experiências variadas de aprendizagens e troca de saberes,
    por meio do envolvimento em atividades realizadas em instituições e espaços comunitários
    que, submetido a reflexões e debates, podem ampliar a formação docente.

    Based on the principle of inseparability between teaching, research and extension,
    the general objective of extension activities within this curricular component
    is to contribute to broadening the relationship between university and society.

    This process takes place in various dimensions, ranging from the educational sphere
    to the curricular dimension of the natural sciences area. The Curricular Component''s
    initiatives are aimed at fostering varied learning experiences and the exchange
    of knowledge, through involvement in activities carried out in institutions and
    community spaces which, subject to reflection and debate, can broaden teacher
    training.

    Descrição da atividade

    Leitura e discussão de textos; participação em atividades voltadas à comunidade,
    por meio de visitas, estudos do meio, acompanhamento, co-criação e/ou implementação
    de propostas; discussões e avaliação sobre experiências ocorridas nos momentos
    de integração; apresentação de registros e relatos críticos sobre as experiências.

    Reading and discussion of texts; participation in activities aimed at the community,
    through visits, environmental studies, monitoring, co-creation and/or implementation
    of proposals; discussions and evaluation of experiences during integration moments;
    presentation of records and critical reports on experiences.

    Indicadores de avaliação da atividade

    Engajamento com as propostas e posicionamento crítico frente às atividades.

    Engagement with the proposals and critical positioning in relation to the activities.'
  practical_credits: '1'
