  assessment: Em virtude do modelo adota para as aulas não será possível aplicar recuperação.
  bibliography: 'Gestão de Negócios: Visões e dimensões empresariais da Organização.
    Autores: Cruz Jr, J.B., Rocha, J.A.O. e Tachizawa, T. Editora: ATLAS Gestão Empresarial
    - de Taylor aos nossos dias Autores: Pereira, M. I. Autor: Ferreira, A. A. e Reis,
    A.C. F Editora: THOMSON PIONEIRA Gestão da inovação: a economia da tecnologia
    no Brasil Autor: Tigre, P. B. Editora: Elsevier

    Textos disponibilizados pelos professores da disciplina

    Artigos extraídos de revistas especializadas na área de gestão e inovação.'
  course: 'O que leva algumas organizações a terem necessidade de gerenciar a inovação;
    quais são os principais fatores que impulsionam a inovação e como ocorre o processo
    de difusão. Quais são os principais tipos de inovação que precisam ser considerados;
    Quais são as principais estratégias para implantar uma de inovação no mercado;
    Como e de que maneira as empresas procuram obter ideias inovadoras; Quais e como
    diferentes fatores influenciam a maneira como os gerentes priorizam as escolhas
    de inovação; Quais os principais desafios para colocar as inovações em prática;
    De que forma os gestores podem construir uma organização focada na inovação como
    estratégia de mercado; quais os principais sistemas de avaliação de sucessos de
    uma ideia inovadora; Gestão de recursos e programas de inovação em uma empresa.

    Which leads some organizations to have the necessity to manage the innovation;
    what are the main factors driving innovation and how does the diffusion process
    occur. What are the main types of innovation that need to be considered; What
    are the main strategies to implement one of innovation in the market; what and
    how companies seek innovative ideas; What and how different factors influence
    the way managers to prioritize innovation choices; What are the key challenges
    in putting innovations into practice? How managers can build an organization focused
    on innovation as a market strategy; what are the main success evaluation systems
    of an innovative idea; Resource management and innovative programs in a company.'
  course_name: 'PRG0029 - Projetos Especiais em Gestão da Inovação

    Special Projects in Innovation Management'
  deactivation: ''
  instructors: '92313 - Fernando Josepetti Fonseca

    849935 - Humberto Felipe da Silva

    5857892 - José Carlos de Melo Vieira Júnior'
  lecture_credits: '2'
  objectives: 'Levar os alunos a entender as principais questões da gestão da inovação,
    suas características e pontos críticos para obter o sucesso, por meio de problemas
    reais de empresas. As atividades serão realizadas em equipe e serão focadas no
    desenvolvimento das competências necessárias para gerenciar com sucesso todo o
    processo de inovação, de sua concepção até colocar o produto no mercado.

    Lead students to understand the key innovation management issues, their characteristics,
    and critical points for success, through real business problems. The activities
    will be carried out as a team and will focus on the development of the necessary
    skills to successfully manage the entire innovation process, from its conception
    to placing the product on the market'
  practical_credits: '2'
  total_workload: 90 h
  type: Semestral
