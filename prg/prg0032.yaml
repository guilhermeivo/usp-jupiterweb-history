  course: 'Cada vez que a disciplina é oferecida, o conteúdo oferecerá novas temáticas
    e autores irlandeses para atender os interesses dos alunos, mantendo sempre a
    ementa e objetivos da disciplina. Exemplo de tópicos sobre Irlanda: história,
    cultura e arte; mudnças na percepção de nação; nacionalismo, hibridismo e multiculturalismo
    na Iranda e América Latina; questões de identidade – etnicidade, raça, classe
    e gênero; literaturas pós-coloniais e decolonização.

    Every time the seminar is offered, it will tackle new Irish themes and authors
    to attend the expectation of the students, keeping unaltered the abstract and
    aims of the subject. Examples of Irish topics: history, culture and arts; changing
    perceptions of the nation; nationalism, hybridity and Irish and Latin American
    multiculturalism; questions of identity – ethnicity, race, class and gender; post-colonial
    literatures and decolonization.

    Instrumentos e Critérios de Avaliação'
  course_name: 'PRG0032 - Estudos Irlandeses em Diálogo

    Irish Studies in Dialogue'
  deactivation: ''
  instructors: 2800271 - Laura Patricia Zuntini de Izarra
  lecture_credits: '2'
  objectives: '- Participar no curso internacional Latino-americano sobre estudos
    irlandeses.

    - Estudar as características dos textos literários em língua inglesa a partir
    das teorias dos próprios

    escritores.

    - Analisar vários gêneros literários que marcaram diferentes período e correntes
    estéticas de

    forma interdisciplinar.

    - Estimular conexões interdisciplinares entre história, literatura, sociologia,
    tradução e outras

    artes.

    - Refletir temas de literatura e língua no centro e na periferia, no contexto
    das mudanças que

    acontecem na Irlanda contemporânea com relação a sua tradição e às relações com
    América

    Latina.

    - Interagir de forma sincrônica com professores e estudantes das universidades
    latino-americanas:

    Universidade Nacional Autónoma de México (UNAM) e Universidad Nacional de La Pampa
    (UNLPam).

    - To participate in na international Latin American Seminar.

    - To study characteristics of literary texts in English from the authors’ theoretical
    viewpoints.

    - To analyse various literary genres that became landmarks of diferente periods
    and aesthetic trends from an interdisciplinary perspective ;

    - To study interdisciplinary connections between literature, history, sociology,
    translation and other arts.

    - To reconsider issues of literature and language at the centre and periphery,
    in the contemporary context of Ireland’s changing relationship with its tradition
    and Latin America.

    - To interact with professors and students from Latin American Universities: Universidad
    Nacional de México and Universidad Nacional de La Pampa.'
  practical_credits: '2'
  total_workload: 90 h
  type: Semestral
