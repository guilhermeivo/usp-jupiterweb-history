  course: 'O Programa terá como eixo a análise dos direitos sociais no Brasil, desenvolvendo
    os

    seguintes conteúdos:

    1. Direitos, Políticas Públicas e Estado;

    2. Linhas gerais do processo histórico do desenvolvimento de políticas sociais
    no Brasil:

    Objeto e objetivos da Educação, da Saúde Pública e da Assistência Social enquanto
    áreas de conhecimento e campos de intervenção; Justiça Social e Financiamento
    das áreas sociais.

    3. Administração e composição do Estado Federativo no Brasil: Política Sociais
    e organização sistêmica; Arquitetura das políticas de Educação, Saúde e Assistência
    Social no Brasil e respectivos sistemas nacionais.

    4. Territórios e Políticas: a organização dos serviços de atendimento.

    5. Organização matricial das políticas sociais: limites e possibilidades.

    6. Experiências de ações matriciais em território, envolvendo a unidade escolar
    e os serviços/equipamentos do Sistema Único de Saúde e do Sistema Único de Assistência
    Social.

    7. Mecanismos de participação e controle popular em cada uma dessas três políticas
    e sistemas.

    8. Metodologias de pesquisa-ação como estratégia propositiva de participação e
    controle popular na realização da gestão democrática dessas políticas.'
  course_name: 'PRG0021 - Educação, Saúde e Assistência Social: Redes Complementares
    na Proteção Social Básica

    Education, Health and Social Assistance: Complementary Networks in Basic Social
    Protection'
  deactivation: 14/07/2022
  instructors: '461311 - Anna Luiza de Fatima Pinho Lins Gryschek

    460053 - Claudia Maria Bógus

    85941 - Cleide Lavieri Martins

    79349 - Lisete Regina Gomes Arellaro

    2089809 - Maria Victoria de Mesquita Benevides Soares

    5057761 - Marilia Cristina Prado Louvison

    84853 - Sonia Maria Portella Kruppa

    1975500 - Zilda Pereira da Silva'
  lecture_credits: '4'
  objectives: '1. Analisar expressões na vida cotidiana do processo histórico das
    políticas sociais brasileiras.

    2. Analisar o desenho das políticas sociais de Educação, Saúde e Assistência Social
    no Brasil e seus respectivos sistemas nacionais;

    3. Analisar os limites e as possibilidades de experiências matriciais em território,
    envolvendo a unidade escolar e os serviços/equipamentos do Sistema Único de Saúde
    e do Sistema Único de Assistência Social;

    4. Analisar a efetividade do direito em cada uma dessas políticas: gestão democrática,
    participação e controle popular.'
  practical_credits: '2'
