  course: '• Cuidado Interprofissional, Colaborativo e Centrado na Pessoa;

    • Epidemiologia e Fisiologia da dor;

    • Prevalência e Manejo da dor na APS;

    • Avaliação da dor;

    • Dor Aguda: características principais e manejo (trauma e dor no pós-operatório);

    • Dor crônica: características principais e manejo (dor musculoesquelética, cefaleia,
    fibromialgia, dor orofacial nas disfunções temporomandibulares...);

    • Manejo farmacológico da dor;

    • Manejo funcional da dor;

    • Manejo psicossocial da dor;

    • Dinâmica de trabalho em equipe interprofissional.'
  course_name: 'PRG0019 - Educação Interprofissional em Saúde: Abordagem da Dor

    Interprofessional Health Education: approach to pain management'
  deactivation: ''
  instructors: '5298878 - Ana Carolina Basso Schmitt

    4856875 - Ana Claudia Camargo Gonçalves Germani

    5571466 - Lilia de Souza Nogueira

    2219592 - Marina de Góes Salvetti'
  lecture_credits: '1'
  objectives: 'específicos:

    ● Compreender a natureza multidimensional da dor e seus componentes, bem como
    suas implicações para o paciente e suas famílias e sua relação com as intervenções
    da equipe de saúde.

    ● Reconhecer ações específicas e comuns entre os profissionais de saúde envolvidos
    no manejo da dor para o cuidado centrado nos pacientes/famílias no contexto da
    Atenção Primária à Saúde (APS) – (simulação).

    ● Elaborar em equipe um plano de cuidado para o manejo da dor centrado no paciente/família
    considerando a realidade do sistema de saúde brasileiro.'
  practical_credits: '1'
  total_workload: 45 h
  type: Semestral
