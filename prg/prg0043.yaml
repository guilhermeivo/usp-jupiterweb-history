  lecture_credits: '2'
  objectives: 'específicos:

    a) Possibilitar a participação nas aulas de modo qualificado, ou seja, lendo os
    textos das disciplinas, compreendendo as explanações, elaborando questionamentos
    pertinentes, dialogando com professores e colegas.

    b) Preparar para exposições orais e apresentação de trabalho acadêmico em português.

    c) Apoiar na escrita de reflexão sobre temas importantes da área de conhecimento
    do aluno.

    d) Fornecer conhecimentos linguísticos e culturais para compreender a cultura
    e sua relação com o universo acadêmico.'
