  course: '- Características da língua e da cultura do Brasil;

    - Aspectos formais da língua portuguesa: o sistemático e o normativo;

    - Relação entre oralidade e escrita;

    - Práticas culturais de leitura: enfoque na universidade;

    - Coesão e coerência na escrita; reconhecimento e construção da argumentação em
    textos orais e escritos; as relações entre produção textual e as características
    do suporte;

    - Textos institucionais da USP (e-mails, boletins, convites, informes, editais,
    avisos, etc);

    - A circulação na USP (estrutura organizacional, nomes, siglas, endereços, transporte
    e pedidos de informações);

    - Alimentação - ambientes, valores, culinária;

    - Manifestações culturais brasileiras;

    - Espaços e fontes de pesquisa;

    - Sistemas de Avaliação (prova, teste, trabalhos, seminários, etc);

    - Produção de trabalhos acadêmicos;

    - Circulação pela cidade de São Paulo;

    - As regiões brasileiras e suas especificidades (linguística, geográfica, etc).

    Instrumentos e Critérios de Avaliação'
  course_name: 'PRG0043 - Língua e Cultura Brasileiras para Intercambistas Internacionais
    na USP

    Brazilian Language and Culture for Exchange Students'
  deactivation: ''
