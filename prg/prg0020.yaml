  course: '1. Definição de escopo nos ODS (2 Semanas)

    Organização dos grupos: grupo multiáreas.

    Produção discente: um estudo sobre o ODS escolhido e suas metas, segundo as seguintes

    atividades propostas:

    a. Definir o ODS alvo e até 3 metas de interesse;

    b. Dissecar os ODS e as metas escolhidas em termos de áreas do saber, conceitos,

    princípios e informações científicas relevantes para sua consecução;

    c. Identificar atitudes no plano dos indivíduos e das instituições que sejam importantes

    para a consecução e para o alinhamento da conduta ao ODS.

    2. Conteúdos para Salas Desafio (4 Semanas)

    Organização dos grupos: grupo multiáreas.

    Produção discente: a partir do estudo na etapa 1, criar três desafios dos seguintes
    tipos:

    “Fake news”; “O que tem na USP pra mim” e “Quero ser…” (detalhados abaixo). Em

    cada desafio, serão indicadas as relações conceituais entre os desafios e o escopo
    nos

    ODS, delineado na etapa 1. Serão também explicitadas informações suficientes para

    resolver os desafios, e que constem dos recursos disponíveis na universidade em
    suas

    bases de informação relacionadas aos grupos de pesquisa, cursos de graduação e

    atividades voltadas para a sociedade (AGUIA, agência USP etc.).

    Atividades para cada desafio:

    a. Desafio Fake news: identificar uma fake news ou peça de desinformação que

    atrapalhe a consecução de uma ou mais metas do ODS escolhido. O seguinte

    percurso é sugerido:

    I. Analisar a fake news: linguagem, princípios e informações;

    II. Identificar conceitos e princípios científicos correlatos;

    III. Confrontar ciência x fake news;

    IV. Transpor o confronto para o campo ético, por meio das consequências para

    o bem comum em se adotar e espalhar fake news.

    b. Desafio “O que tem na USP para mim?”: identificar como as pessoas podem

    usufruir do que a USP oferece para a sociedade, para melhor alinhar decisões

    cotidianas com as metas do ODS escolhido.

    c. Desafio “Quero ser…”: identificar cursos de graduação que oferecem percursos

    formativos que contribuam de alguma forma com as metas do ODS escolhido, ao:

    I. produzir conhecimento científico: IC e PG

    II. realizar estágios curriculares e atividades de extensão

    III. atuar como profissional formado.

    3. Produção de objetos de aprendizagem (OA) em H5P (7 Semanas)

    a. Maquete em arquivo PPT: análise conceitual e de conteúdo digital (4 Semanas).

    I. Mapa geral de navegação intra- e inter- Salas Desafio, em que suas tarefas

    adquiram formato de questões de múltipla escolha, cujas alternativas gerem

    feedbacks a serem alimentados por objetos de aprendizagem criados a partir

    do material coletado na etapa anterior;

    II. Exame, análise e escolha de tipos de conteúdo interativo H5P;

    II. Produção de cada sala e cada um de seus desafios: textos, busca de links e

    imagens, criação de demandas para editoração específica (vídeo, imagem,

    imagens panópticas para fotografias 360 graus);

    III. Articulação entre as salas por meio de links entre slides;

    IV. Testar a experiência de jogo: autoavaliação das salas dos colegas - cada um

    deve fazer um parecer das salas desafio de outras duas equipes: conteúdo,

    dificuldade, clareza, coerência entre o desafio e as informações indicadas

    para resolvê-lo;

    V. Finalizar as maquetes com base nos feedbacks dos colegas e da equipe

    docente.

    b. Versão 1.0: produção OA em H5P (3 Semanas).

    I. Fazer: transposição do conteúdo das maquetes para OA em H5P;

    II. Testar e ajustar: tal qual na maquete, avaliação por pares das salas dos

    colegas, a partir do que ajustes são implementados para uma versão final.

    4. Jogo e Portal: (2 Semanas)

    a. Articulação de OA H5P na interface de Jogo Escape Room;

    b. Testar nos mesmos moldes dos produtos previstos na etapa 3, porém, com ênfase

    na revisão de percurso para a disciplina.

    5. Lançamento do site do jogo (1 Semana)

    Em grupo de discussão, planejar perfis para divulgação do jogo em mídias sociais.
    A

    seguir, em conjunto com os bolsistas de pós-graduação e graduação, criar esses
    perfis.

    6. Avaliação da disciplina (1 Semana)

    a. Formulário (tipo Likert) de autoavaliação individual e do grupo;

    b. Foro de discussão com toda a equipe para balanço final, críticas e sugestões
    para os

    próximos oferecimentos da disciplina;

    c. Elaboração de um documento ata do foro pela coordenação da disciplina.

