  course_name: 'PRG0020 - Game ON: Ciência, Fake News e Sustentabilidade

    Game ON: Science, Fake News and Sustainable Development'
  deactivation: ''
  instructors: '2220890 - Fernando Rodrigues de Moraes Abdulkader

    863003 - Guilherme Andrade Marson'
  lecture_credits: '6'
  objectives: 'A disciplina objetiva levar estudantes de diferentes cursos da USP
    à compreensão de que problemas complexos requerem soluções complexas e, por conseguinte,
    inter- e multidisciplinares. No caso, os problemas complexos a serem trabalhados
    por equipes multiáreas de estudantes estão relacionados aos Objetivos para o Desenvolvimento
    Sustentável (ODS) da ONU. A disciplina será online, optativa-livre e oferecida
    no período noturno a estudantes da USP de qualquer curso, daí a pertinência de
    ficar sediada na Pró-Reitoria de Graduação.

    O produto final do trabalho das equipes é o desenvolvimento de módulos interativos
    digitais produzidos com o aplicativo H5P para a plataforma Wordpress que estejam
    interligados entre si numa estratégia de "escape game" e deverão necessariamente
    conter discussões sobre "fake news" relacionadas ao ODS (sua linguagem, aparente
    embasamento intelectual/científico etc), bem como apresentar iniciativas desenvolvidas
    na USP e percursos formativos em nível de graduação que podem contribuir para
    a consecução dos ODS. Aos estudantes, portanto, caberá um segundo objetivo educacional,
    de análise crítica e curadoria de informações para seleção de sites que sejam
    incorporados aos módulos do "escape game" que será composto ao final. Dessa forma,
    ao longo dos anos, à plataforma gerada devem ir se

    agregando módulos relacionados aos demais ODS, constituindo um rico produto que,
    esperamos,

    seja disponibilizado nos sites da USP como material de apoio a professores do
    Ensino Médio, bem como de suporte ao programa "A USP e as Profissões" na divulgação
    da Universidade para potenciais candidatos a estudantes.

