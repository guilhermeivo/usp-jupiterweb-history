  course: '1. Tipos de variáveis aleatórias. Noções de métodos de amostragem (aleatória
    simples, estratificada, sistemática, por conglomerados).

    2. Medidas de tendência central e de dispersão. Gráficos e tabelas.

    3. Noções de probabilidade.

    4. Distribuição binomial.

    5. Distribuição normal.

    6. Estimação da média populacional (cálculo do tamanho de amostra).

    7. Estimação da proporção populacional (cálculo do tamanho de amostra)

    8. Noções de testes de hipóteses.

    9. Teste de hipóteses para uma média.

    10. Outros testes de hipóteses como testes T e ANOVA para comparação de médias,
    testes qui-quadrado e noções de testes não paramétricos.

    Instrumentos e Critérios de Avaliação'
  course_name: 'MAE0110 - Noções de Estatística

    Elements of Statistics'
