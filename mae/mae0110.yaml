    4. G. E. Noether, INTRODUÇÃO À ESTATÍSTICA: UMA ABORDAGEM NÃO-PARAMÉTRICA. 2ed.
    Rio de Janeiro, Guanabara Dois, 1983.

    5. J. F. Soares, A. L. Siqueira, INTRODUÇÃO À ESTATÍSTICA MÉDICA. 1ed. Departamento
    de Estatística, UFMG, 1999.

    6. W.Mendenhall, J. E. Reinmuth, STATISTICS FOR MANAGEMENT AND ECONOMICS. 3rd
    edition, North Scituate, Duxburry Press, 1978.

    7. T. H. Wonnacott, R. J. Wonnaccot, INTRODUÇÃO À ESTATÍSTICA, Rio de Janeiro:
