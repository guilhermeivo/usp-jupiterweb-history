  course: '1. Contagem: princípio multiplicativo, permutações, combinações.

    2. Espaço de probabilidade.

    3. Probabilidade condicional e independência.

    4. Variáveis e vetores aleatórios: definição, caracterizações e propriedades.

    5. Esperança matemática, funções geradoras de probabilidade e de momentos e suas
    propriedades.

    6. Principais distribuições de probabilidade (univariadas e multivariadas): uniforme
    discreta, Bernoulli, binomial, geométrica, Poisson, binomial negativa, hipergeométrica,
    multinomial, exponencial, normal, Cauchy e uniforme contínua.

    7. Transformações de variáveis: caso univariado, caso multivariado especificamente
    para distribuição da soma, produto e quociente de variáveis aleatórias.

    8. Estatísticas de ordem, distribuições t-Student, F-Snedecor, qui-quadrado,gama,beta
    e suas relações.

    9. Distribuição normal multivariada e propriedades.

    10. Lei dos grandes números.

    11. Teorema limite central.'
  course_name: 'MAE0222 - Probabilidade

