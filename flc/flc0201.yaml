  course_name: 'FLC0201 - Literatura Brasileira II

    Brazilian Literature II'
  deactivation: ''
  instructors: '221657 - Eliane Robert Moraes

    728648 - Jaime Ginzburg

    54028 - Luiz Dagobert de Aguirra Roncari

    1847153 - Yudith Rosenbaum'
  lecture_credits: '4'
  objectives: A disciplina tem como objetivo o estudo da literatura brasileira do
    segundo momento do século XX, com base no exame de obras, autores, gêneros e questões
    significativas da produção literária no período. Este estudo busca considerar
    tanto a consolidação e expansão do projeto modernista, bem como as especificidades
    de um novo contexto cultural que se desdobra em manifestações contemporâneas.
    A disciplina desenvolve habilidades necessárias para a formação do professor de
    Letras, como a interpretação de textos fragmentários, a reflexão filosófica e
    social sobre a linguagem, a compreensão das relações entre tradição e modernidade,
    a pesquisa bibliográfica, o aperfeiçoamento da capacidade de leitura de textos
    complexos e da expressão escrita.
  practical_credits: '2'
