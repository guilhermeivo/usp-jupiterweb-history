  objectives: Como indica o título, o objetivo da disciplina é abordar e analisar
    textos da prosa latina, de maneira minuciosa e aprofundada, com a aplicação prática
    dos conhecimentos literários e gramaticais anteriormente adquiridos pelos alunos.
