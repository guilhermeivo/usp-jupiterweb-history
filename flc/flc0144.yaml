  assessment: Conforme norma vigente, terá direito a recuperação o aluno que alcançar
    a média mínima 3,0 (e abaixo de 5,0) no período letivo normal. A recuperação se
    fará mediante trabalho e/ou prova escrita (e/ou outros instrumentos, equivalentes
    aos utilizados no período letivo) em torno do programa desenvolvido durante o
    semestre. A média final do aluno será o resultado de uma média ponderada, em que
    a nota anterior terá peso 1 e a nota obtida na recuperação terá peso 3, isto é,
    a nota inicial corresponde a 25 % da média final.
