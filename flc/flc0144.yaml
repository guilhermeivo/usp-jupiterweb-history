  course: 'Leitura de textos da prosa latina no original, a serem selecionados pelo
    professor ministrante, dentre os seguintes gêneros e autores:

    a) historiografia (Júlio César, Salústio, Tito Lívio, Tácito);

    b) oratória (Cícero, Tácito);

    c) tratados filosóficos (Cícero, Sêneca) e didáticos (Catão, Varrão, Vitrúvio);

    d) epistolografia (Cícero, Sêneca, Plínio, o Jovem).'
  course_name: 'FLC0144 - Prosa Latina: Leitura e Comentário'
