  objectives: "Fornecer aos estudantes -em linhas gerais \x96 noções introdutórias\
    \ básicas a respeito das instituições jurídicas básicas e seu funcionamento.Capacitar\
    \ o estudante a compreender a lógica do funcionamento do sistema jurídico e a\
    \ desenvolver-posteriormente- estudo de áreas específicas relacionados à sua área\
    \ de atuação. Visa-se também propiciar aos estudantes a familiarização com a linguagem\
    \ característica do Direito positivo."
