  course: '1.Noções Gerais e Conceitos e documentos básicos do Direito Positivo

    1.1 Ato e fato jurídicos

    1.2 Norma, ordenamento e fontes do Direito

    1.3 Declaração Universal dos Direitos Humanos (1948)  e Constituições Federal
    do Brasil (1988)

    1.4 Direito como dogma e o problema da decidibilidade de conflitos

    2 Direito e Justiça em ação

    2.1 O Tribunal de Nuremberg

    2.2  A Justiça Brasileira: o caso da justiça criminal

    2.3  Análise dos votos de um julgamento fictício

    2.4  Argumentação e retórica na aplicação do Direito

    3. Direito e as possibilidades de um diálogo interdisciplinar em um mundo globalizado'
