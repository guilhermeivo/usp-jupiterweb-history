  course: 'para a FEA - curso de Ciências Contábeis e Administração de Empresas

    01. Noções de direito: direito e justiça.

    02. Divisão do direito: ramos do direito público.

    03. Divisão do direito: ramos do direito privado.

    04. Normas jurídicas: conceito e classificação: vigência e eficácia; irretroatividade
    e interpretação.

    05. Constituição. Conceito. Espécies. Rigidez. Emenda constitucional.

    06. Estado. Conceito. Elementos. Fins, Personalidade jurídica.

    07. Formas de Estado e de Governo. Regimes governamentais. República como princípio
    básico do direito brasileiro. Estado de Direito.

    08. Garantias do regime republicano-representativo. O princípio da divisão dos
    poderes.

    09. Instrumentos e condições da República. Órgão do Estado.

    10. Premissas do regime republicano, no direito positivo brasileiro. os direito
    humanos.

    11. Constituição econômica.

    12. Poder de polícia.

    13. Pessoa física.

    14. Pessoa jurídica.

    15. Bens. Conceito. Classificações.

    16. Negocio jurídico: existência (categorias do N.J.): validade (requisitos de
    validade) e eficácia do N.J. (fatores de eficácia ou ineficácia tais como prescrição,
    decadência, condições, termo).

    17. Direitos personalíssimos e patrimoniais; reais e obrigacionais.

    18. Propriedade, direitos reais sobre coisas alheias.

    19. Ato do comércio.

    20. Comerciante. Conceito, Registro. Firmas. Deveres.

    21. Sociedade comercial - Conceitos e Espécies.

    22. A sociedade anônima.

    23. Títulos de crédito.

    24. Conceito jurídico de empresa.

    25. Noções de Direito falimentar.

    26. Mercado de Capitais'
