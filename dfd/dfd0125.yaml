  course_name: 'DFD0125 - Instituições de Direito

    Institutions of Law'
  deactivation: ''
  lecture_credits: '4'
  objectives: Este curso tem como objetivo introduzir o aluno no estudo da Ciên.cia
    do Direito, partindo de noções elementares e conceitos fundantes para estabelecer
    relações sobre o funcionatnento da ordem juridica, O curso está organizado de
    modo a contribuir para a visão critica do fenômeno jurjdico, na medida em que
    habilita o aluno a postular sobre os fundamentos, os valores e as decisões que
    circulam nesta órbita; técnica e instrumental do fenômeno .Juridico, na medida
    em que tornece noções e elenlentos indispensáveis para a compreensão, leitura
    e abordagem do fenômeno jurídico. Encontra-se, assim, dentro da proposta do (~urso
    de Relações Internacionais, como meio introdutório de conhecimento do Direito,
    algo pensávet para devida formação em relações internacionais.
