  course: '1. Aulas Teóricas: 1.1. Conceito de soluções aquosas; 1.2. Equilíbrio químico;
    1.3. Atividade iônica; 1.4. pH de soluções aquosas; 1.5. Solubilidade e produto
    de solubilidade; 1.6. Complexos e quelatos; 1.7. Oxidação e redução. 2. Aulas
    Práticas: 2.1. Unidades de concentração de soluções; 2.2. Introdução à Química
    Analítica; 2.3. Gravimetria. Aplicações; 2.4. Métodos volumétricos de análise
    química; 2.4.1. Volumetria de neutralização; 2.4.2. Quelatometria. Aplicações;
    2.4.3. Volumetria de oxi-redução. Aplicações; 2.5. Métodos instrumentais de análise
    química; 2.5.1. Colorimetria. Aplicações; 2.5.2. Fotometria de chama de emissão.
    Aplicações; 2.5.3. Espectrofotometria de absorção atômica. Aplicações; 2.5.4.
    Potenciometria. Aplicações.'
