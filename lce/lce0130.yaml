  course: '1. Teoria dos Conjuntos: Definições básicas; Operações com conjuntos; Conjuntos
    numéricos; 2. Relações e Funções: Domínio, contradomínio e conjunto imagem de
    funções; Gráfico de funções; Funções sobrejetoras, injetoras e bijetoras. 3. Estudo
    das principais funções: Função linear e quadrática; Função modular; Funções trigonométricas;
    Funções logarítmicas e exponenciais; 4. Estudo de limites e continuidade de funções:
    Noções básicas; 5. Estudo da derivada de funções: Noções básicas e aplicações.
    6. Estudo da integração de funções: Noções básicas e aplicações.'
  course_name: 'LCE0130 - Cálculo Diferencial e Integral

    Differential and Integral Calculus'
  deactivation: ''
  instructors: '5542817 - Cristian Marcelo Villegas Lobos

    7023989 - Taciana Villela Savian'
  lecture_credits: '4'
  objectives: Contribuir para a formação matemática do Biólogo, do Cientista de Alimentos
    e do Gestor Ambiental. Capacitar os alunos no desenvolvimento de métodos matemáticos
    relacionados a Derivação, Diferenciação e Integração no contexto de funções a
    uma variável independente. Aplicar os conceitos de Cálculo Diferencial e Integral
    na fundamentação e resolução de áreas e volumes, teoria da otimização.
