  course: 'Inteligência Artificial (IA): conceito, algoritmos: Rain Forest, Support
    Vector Machine, NaiveBayes, E Clasification e RegressionTree. Aplicações em gestão,
    engenharia, biologia, ambiência, economia, gestão de negócios e pesquisa.Aprendizado
    de máquina e redes neurais, comparação de resultados com métodos estatísticos
    convencionais, linguagens R, Python, SAS e outras. Noções introdutórias: Regressão
    Logística, MANOVA, NPMANOVA, Funções Canônicas, DiscriminanteNP. Aplicação de
    IA,Big Data VsSmall Data, trade off,  Big Data (petabytes, noções de Ferramentas:
    Inteligência Artificial, Machine Learning, Redes Neurais, HDFS, YARN, Hadoop,
    MAP REDUCE, etc. para desenvolver produtos hipercompetitivos) Small Data (terabytes,
    noções de Ferramentas: Inteligência Artificial, Machine Learning, Redes Neurais,
    testes de hipóteses, métodos robustos, multivariados, univariados, paramétricos,
    etc., para decisões internas das organizações, acabamento dos produtos hipercompetitivos,
    etc.)  e Tecnologias de Gestão  (como LeanSartup_Amazom, TQM_Toyota-Porsche-GE,
    ISO-9001-14001-22000-27000-17025,etc.GlobalGAP, BSC, PNQ,PPQ, EQA,  6 Sigma, Malcolm
    Baldrige, Deming Prize,LeanCanvas, QFD, FMEA/FTA, RCA,   etc.)  na Industria,
    Serviços Marketing e Fazenda  4.0 Visando Hipercompetitividade.'
  course_name: 'LCE1270 - Inteligência Artificial, Big-Small Data e Gestão para Indústria,
