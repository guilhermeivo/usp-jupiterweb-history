  course: 'A) Conceituação, tipos e aplicações da Inteligência Artificial (IA), RA
    (Robótica Aplicada) e CDR (Ciência de Dados Robusta): indutiva, supervisionada
    para classificação, para predição e não supervisionada B) Algoritmos para inteligência
    artificial indutiva e dedutiva, implementações em Python (IDEs: Jupyter, VS Code,
    Pycharm e Spyder Python IDE), SAS, R, Weka, RapidMiner e JMP, os alunos aprenderão
    a utilizar Weka, programa exclusivamente de IA, visual, amigo do usuário, SAS
    o mais importante para empregabilidade, linguagem de quarta geração. Também R,
    Python (a linguagem de terceira geração mais importante para IA e RA) e Excel
    Avançado. Serão apresentadas linguagens de computação de alto e baixo nível, de
    primeira até quinta geração. Os algoritmos de IA Indutiva, Machine Learning que
    serão ensinadas são: Redes Neurais (Multilayer Perceptron) com diferente número
    de camadas de neurônios, hiper parâmetros e funções de inicialização, Random Forest,
    Suport Vector Machine, Naives Bayes, CART, Deep Learning, Função Logística, Analise
    Discriminante Linear, Quadrático, Bayesiano e Robusto, Funções Canônicas 1D, 2D
    e 3D (redução de dimensão), PCA e Biplot, Cluster Analysis, Factor Analysis Exploratório,
    Confirmatório e Equação de Modelos Estruturais. Visual Analytics. C) Parâmetros
    da IA, hiper parâmetros e funções de inicialização, learning rate, momentum etc.
    Parâmetros provenientes da Matriz de Confusão: Taxa de Acerto-Acuracy, Erro Tipo
    I e II, Taxa de Falsos Positivos e Negativos, Especificidade, Sensibilidade (recall),
    Taxa de Omissão, Precisão, F1Score, FDR, Predição Negativa, tamanho ótimo de amostra
    para IA Indutiva, Índice de Generalização, Overfiting etc. Publicações dos professores
    da disciplina utilizando os conceitos na ESALQ e CENA.  D) CDR univarida, multivariada,
    conjoint analysis (fatoriais fracionários), interação dupla e tríplice, regressão
    robusta e polinomial, uniformidade e capacidade de processos uniformidade e capacidade
    de processos, U de Mann Witney, Wilcoxon, NPANOVA, NPMANOVA, Correlações Canônicas,  Robust
    Multivariate Regression, Gráfico de Uniformidade-Controle para a Mediana, Cusum,
    MMEP, Gráficos de Capacidade de Processos Robustos, uni e multivariados, Proficiência
    de Organizações, Metrologia, métodos robustos, Power BI, Power BI Desktop, SAP
    Lumira, Tableau e Data-Driven Documents, edição vetorial de gráficos: Gimp e InkScape.
    E) Robótica Aplicada, conceito de robô (ISO 8373), tipos de robôs, tipos de inteligência
    artificial embarcada num robô: Dedutiva, Indutiva-Supervisionada para Classificação
    e para Predição e Não Supervisionada. Etapas do desenvolvimento dos robôs: analise,
    projeto, prototipação, codificação, testes e documentação de robôs e aplicativos
    para pc, tablet e celular linguagens Python e C, comparação em custo, desempenho
    e segurança de aplicativos e robôs, bots financeiros e para Blockchain. Digrama
    de Nassi Schneiderman, Diagrama Hierárquico de Blocos, DFD, Diagrama Entidade
    Relacionamento, simulação computacional, Bootstrapping e Jackknife, Monte Carlo,
    . Robôs elaborados pela equipe de IA-CDR e RA da ESALQ e CENA. F) IA – RA e CDR
    para Segurança da Informação, Família ISO 27.000 (ISO 27001 a 27018), 5 Pilares
    da Segurança da Informação: Integridade, Confidencialidade, Disponibilidade, Autenticidade
    e Irretratabilidade, Sistema Integrado de Certificação ISO 9001, 27001 e 14001.
    IA-RA e CDR para Prevenir Sequestro de Informação, Ransomware  .G) Bancos de Dados
    SQL, relacionais e não relacionais (Oracle, My SQL, SAS, Access, Livre Office
    etc.), Não SQL: Redis, Cassandra, Amazon Dynamodb e Mondodb. Fermentas para implementação,
    pesquisa e análise de Bancos de Dados. H) Big Data, Small Data, Machine Learning,
    Text Mining (Iramutec-R), interpretação de linguagem natural (Python) e RA para
    armazenamento e processamento de dados distribuídos, rede de supercomputadores
    da Google, Oracle e SAS. I) Trade off IA-CDR e RA, funcionamento para Small e
    Big Data. J) IA-RA e CDR para FEMEA/FTA, Shewhart, RCA, QFD, 7 Ferramentas da
    Gestão de Kaoru Ishikawa e 7 Ferramentas da Gestão, Inbound Marketing, implementações
    em Weka, Python, Rapidminer, Planer. K) Elaboração de Site, blog e GitHub, Blogger,
    Sites Google e Logical Awesome LLC, linkagem de imagenes, vídeos e áudios, edição
    de vídeos: Blender e HitFilm. L) IA-CDR e RA para sistemas de gestão: Toyota,
    Toyota 4.0, Porsche, Mercedes Benz, BSC (MIT e Harvard), OKR (Microsoft e Intel),
    BS 25.999 (plano de continuidade do negócio e informação), Lean Six Sigma (GE),
    Lean Startup (Uber, Amazon e Facebook) e Lean Canvas. Macroprocessos e mais de
    90 ferramentas de gestão. Testes de proficiência em organizações. Sistemas implantados
    pelos professores da disciplina, Biblioteca Central da ESALQ, LRi/CENA e outras
    organizações, projetos com mais de 28 anos de funcionamento ininterrupto. M) Organizações
    com Gestão 4.0 e 5.0 e Projetos Data Driven. M) Hierinovação Disruptiva e Radical
    e Hipercopetitividade.'
