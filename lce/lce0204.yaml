  course: "1. Estatística descritiva: gráficos e tabelas, medidas de posição e de\
    \ dispersão. 2. Noções de Probabilidade. 3. Amostragem. 4. Variáveis aleatórias\
    \ discretas \x96 distribuições Binomial e de Poisson. 5. Variáveis aleatórias\
    \ contínuas \x96 distribuição normal. 6. Amostragem. Distribuição amostral da\
    \ média. 7. Intervalo de confiança. 8. Teste de hipóteses para a média de uma\
    \ população. Comparação de duas populações. 9. Teste de Qui-quadrado \x96 tabelas\
    \ de contingência."
