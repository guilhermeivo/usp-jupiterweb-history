  course: 'Aulas Teóricas: 1. Importância da Química Ambiental. Componentes do Meio
    Ambiente: Hidrosfera (Água), Atmosfera (Ar), Litosfera (Solo) e Biosfera (Ser
    Vivo). 2. Água: Importância e suas Propriedades Físico-Químicas. Água como solvente.
    Soluções Aquosas. Concentração e Expressão de Unidades das Espécies Químicas na
    Água, no Solo, nos Vegetais e no Ar. Exercícios. 3. Atmosfera - Composição e Principais
    Contaminantes. 4. Atividade iônica; 5. Equilíbrio químico. 6. Interação de Produtos
    Químicos no Ambiente. 7. Conceitos de ácidos e bases. 8. Equilíbrio ácido-base
    no ambiente. Exercícios. 9. pH de soluções aquosas de acordo com Bronsted-Lowry.
    10. A importância de reações de alcalinização e acidificação no ambiente. 11.
    Equilíbrio de solubilidade e precipitação no ambiente. Exercícios. A formação
    do precipitado. A importância de reações de precipitação no ambiente. 12. Equilíbrio
    de complexação no ambiente. Exercícios. A importância de reações de complexação
    no ambiente. 13. Equilíbrio de oxi-redução no ambiente. Exercícios. A importância
    de reações de redox no ambiente.'
  course_name: 'LCE0180 - Química Ambiental

