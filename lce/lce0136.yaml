  course: 'A) Conceituação, tipos e aplicações da Inteligência Artificial (IA), RA
    (Robótica Aplicada) e CDR (Ciência de Dados Robusta): indutiva, supervisionada
    para classificação, para predição e não supervisionada. Aplicações em conservação
    de biodiversidade, sequestro de carbono, biomimética, utilização de biomonitores
    de contaminação etc. B) Algoritmos para inteligência artificial indutiva e dedutiva,
    implementações em Python (IDEs: Jupyter, VS Code, Pycharm e Spyder Python IDE),
    SAS, R, Weka, RapidMiner e JMP, comparação e exemplos práticos, ênfase em SAS,
    R e Weka. Redes Neurais (Multilayer Perceptron) com diferente número de camadas
    de neurônios, hiper parâmetros e funções de inicialização, Random Forest, Suport
    Vector Machine, Naives Bayes, CART, Deep Learning, Função Logística, Analise Discriminante
    Linear, Quadrático, Bayesiano e Robusto, Funções Canônicas 1D, 2D e 3D (redução
    de dimensão), PCA e Biplot, Cluster Analysis, Factor Analysis Exploratório, Confirmatório
    e Equação de Modelos Estruturais. Visual Analytics. C) Parâmetros da IA, hiper
    parâmetros e funções de inicialização, learning rate, momentum etc. Parâmetros
    provenientes da Matriz de Confusão: Taxa de Acerto-Acuracy, Erro Tipo I e II,
    Taxa de Falsos Positivos e Negativos, Especificidade, Sensibilidade (recall),
    Taxa de Omissão, Precisão, F1Score, FDR, Predição Negativa, tamanho ótimo de amostra
    para IA Indutiva, Índice de Generalização, Overfiting etc. Publicações dos professores
    da disciplina utilizando os conceitos na ESALQ e CENA.  D) CDR univarida, multivariada,
    uniformidade e capacidade de processos, U de Mann Witney, Wilcoxon, NPANOVA, NPMANOVA,
    Correlaçoes Canônicas,  Robust Multivariate Regression, interação dupla e tríplice,
    regressão polonomial. Gráfico de Uniformidade-Controle para a Mediana, Cusum,
    MMEP, Gráficos de Capacidade de Processos Robustos, uni e multivariados, Proficiência
    de Organizações, Metrologia, métodos robustos. E) Robótica Aplicada, analise,
    projeto, prototipação, codificação, testes e documentação de robôs e aplicativos
    para pc, tablet e celular linguagens Python e C, comparação em custo, desempenho
    e segurança, Digrama de Nassi Schneiderman, Diagrama Hierárquico de Blocos, DFD,
    Diagrama Entidade Relacionamento, simulação computacional, Bootstrapping e Jackknife,
    Monte Carlo, do desempenho de aplicativos e robôs, . F) IA – RA e CDR para Segurança
    da Informação, Família ISO 27.000 (ISO 27001 a 27018), 5 Pilares da Segurança
    da Informação: Integridade, Confidencialidade, Disponibilidade, Autenticidade
    e Irretratabilidade, Sistema Integrado de Certificação ISO 9001, 27001 e 14001.
    IA-RA e CDR para Prevenir Sequestro de Informação, Ransomware  .G) Bancos de Dados
    SQL, relacionais e não relacionais (Oracle, My SQL, Access, Livre Office etc.),
    Não SQL: Redis, Cassandra, Amazon Dynamodb e Mondodb. Fermentas para implementação,
    pesquisa e análise de Bancos de Dados. H) Big Data, Machine Learning, Text Mining
    (Iramutec) e RA para armazenamento e processamento de dados distribuídos, rede
    de supercomputadores da Google. I) ) Bioinformática, Trade off IA-CDR e RA, funcionamento
    para Small e Big Data, . J) Elaboração de Site, blog e GitHub. K) IA-CDR e RA
    para gerenciamento de projetos: Sistemas PMBOK, Toyota, CCPM, e Scrum. L) IA-CDR
    e RA para gerenciamento de organizações biológicas, Sistemas ISO 14001 e 17025,
    Testes de Proficiência Laboratoriais (Metrologia), ISO 35, FSC, BSC, PNQ, PPQ,
    Toyota etc. Aplicações para implantar, gerenciar e fiscalizar normas como: Novo
    Código Florestal Brasileiro e Leis Ambientais, Artigo 225 da CB-1988.  Projetos
    dos professores da disciplina com mais de 28 anos de funcionamento ininterrupto,
    Biblioteca Central da ESALQ, LRi/CENA e outras organizações, projetos com mais
    de 28 anos de funcionamento ininterrupto.'
