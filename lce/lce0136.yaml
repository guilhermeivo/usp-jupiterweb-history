  course: 'Bancos de dados: relacionais e não relacionais. Data: Crunching, Analysis,
    Mining. Uso de Macros. Linguagem computacional em nuvem para data mining, SAS
    on demand.  Ciência de Dados:  alia big-small data, inteligência artificial (machine
    learning, redes neurais, etc.), estatística, economia, matemática, computação,
    administração, contabilidade gerencial, controladoria, atuarial, engenharia, bancos
    de dados, análise de agrupamentos, algoritmos e aplicações em gestão, engenharia,
    biologia, economia, e pesquisa, transformação de dados brutos em insights de negócios
    e descobertas científicas. A CD como a principal habilidade de mercado inespecífica
    (independentemente da profissão) do mundo, seu impacto na empregabilidade inespecífica,
    dados de 2018.  A CD   na Gestão Empresarial e Biologia  em ambientes de  Hipercompetitividade
    e Hiperinovação. Impactos das tecnologias abordadas no índice de sucesso do empreendedorismo
    e articulação com métodos modernos de gestão como Lean Startup _Amazon  e TQM_Toyota-Porsche
    –GE, Lean Canvas, 6 Sigma, ISO, GlobalGAP,  PNQ, EQA, BSC, Etc. Estrutura dos
    principais sistemas mundiais de gestão e de certificação internacional da qualidade.'
  course_name: 'LCE0136 - Ciência de Dados e Gestão para Empregabilidade, Empreendedorismo
    e Inovação

    Data Science and Management for Employability, Entrepreneurship and Innovation'
