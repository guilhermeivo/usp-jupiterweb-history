  activation: 01/01/2021
  assessment: Será feita sob a forma de uma prova com duas horas de duração, aplicada
    após o término das aulas, em época determinada pela USP. A média final será a
    média aritmética entre a nota desta prova e a média obtida no semestre.
  bibliography: 'Literatura Básica:

    J.C. Kotz, P.M. Treichel, G.C. Weaver. Química Geral e Reações Químicas, vol.
    1 e 2. 6ª Ed, 2009.

    Literatura Complementar:

    S.S. Zumdahl, D.J. Decoste. Introdução à Química. Fundamentos, 8ª Ed., 2015.

    R. Chang, Química Geral, 4ª Ed., 2010.

    D.C. Harris – Química Analítica Quantitativa, Editora LTC, 2011.

    D. A. Skoog, Fundamentos de Química Analítica, Editora CENGAGE, 2006.'
  course: Concentração de soluções. Equilíbrio químico. Ácidos e bases. Precipitação
    e dissolução. Complexos e quelatos. Quelatometria. Óxido-redução.
