  course: 'Bancos de dados relacionais e não relacionais: campos, registros, filtros,
    consistência, listas de verificação, pesquisa e réplicas. Data crunching, data
    analysis, conceito de data mining, funções logicas: união, interseção, complemento,
    etc. gráficos: bi e tridimensionais, cálculos, funções estatísticas, macros. Computação
    em nuvem, para data mining e SQL. Inteligência Artificial: conceito, algoritmos:
    Random Forest, Support Vector Machine, Naive Bayes, E Clasification e Regression
    Tree. Aplicações em economia e gestão de negócios de inteligência artificial,
    aprendizado de maquina e redes neurais, comparação de resultados com métodos estatísticos
    convencionais, linguagens R, Python, SAS e outras. Inteligência organizacional,
    estratégica (kaikaku), tática e organizacional (kaizen). Sistemas informatizados
    de inteligência empresarial e rastreabilidade (DSS, ERP, MRP, CRM, Benchmarking,
    QFD, etc.). Sistemas de Informação para certificação internacional da qualidade(
    ISO- 9001-14001-22000-27000, GlobalGAP, FSC, etc.) e sistemas mundiais de gestão
    (TQM-Toyota-Porsche-GM, BSC, Lean Startup, 6 Sigma, PNQ, EQA, etc.) . Ferramentas
    para elaborar mapas de processos, para posterior informatização. Ferramentas para
    análise e projeto de sistemas. Elaboração de sites e blogs. Aplicações dos conceitos
    adquiridos em ambientes de hipercometitividade, com dispositivos eletrônicos'
  course_name: 'LCE0105 - Computação, Inteligência Artificial e Organizacional para
    Economia Visando Hipercompetitividade

