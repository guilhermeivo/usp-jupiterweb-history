  course: 'A) Inteligência Artificial (IA): conceito, algoritmos e aplicações em gestão,
    engenharia, biologia, economia, ambiência e pesquisa. Aprendizado de máquina e
    redes neurais, comparação de resultados com métodos estatísticos convencionais.
    Conceituação, tipos e aplicações da Inteligência Artificial (IA), RA (Robótica
    Aplicada) e CDR (Ciência de Dados Robusta): indutiva, supervisionada para classificação,
    para predição e não supervisionada B) Algoritmos para inteligência artificial
    indutiva e dedutiva, implementações em Python (IDEs: Jupyter, VS Code, Pycharm
    e Spyder Python IDE), SAS, R, Weka, RapidMiner e JMP, os alunos aprenderão a utilizar
    Weka, programa exclusivamente de IA, visual, amigo do usuário, SAS o mais importante
    para empregabilidade, linguagem de quarta geração e Excel Avançado. Serão apresentadas
    linguagens de computação de alto e baixo nível, de primeira até quinta geração.
    Os algoritmos de IA Indutiva, Machine Learning que serão ensinadas são: Redes
    Neurais (Multilayer Perceptron) com diferente número de camadas de neurônios,
    hiper parâmetros e funções de inicialização, Random Forest, Suport Vector Machine,
    Naives Bayes, CART, Deep Learning, Função Logística, Analise Discriminante Linear,
    Quadrático, Bayesiano e Robusto, Funções Canônicas 1D, 2D e 3D (redução de dimensão),
    PCA e Biplot, Cluster Analysis, Factor Analysis Exploratório, Confirmatório e
    Equação de Modelos Estruturais. Visual Analytics. C) Parâmetros da IA, hiper parâmetros
    e funções de inicialização, learning rate, momentum etc. Parâmetros provenientes
    da Matriz de Confusão: Taxa de Acerto-Acuracy, Erro Tipo I e II, Taxa de Falsos
    Positivos e Negativos, Especificidade, Sensibilidade (recall), Taxa de Omissão,
    Precisão, F1Score, FDR, Predição Negativa, tamanho ótimo de amostra para IA Indutiva,
    Índice de Generalização, Overfiting etc. Publicações dos professores da disciplina
    utilizando os conceitos na ESALQ e CENA.  D) CDR univarida, multivariada, conjoint
    analysis (fatoriais fracionários), interação dupla e tríplice, regressão robusta
    e polinomial, uniformidade e capacidade de processos uniformidade e capacidade
    de processos, U de Mann Witney, Wilcoxon, NPANOVA, NPMANOVA, Correlações Canônicas,  Robust
    Multivariate Regression, Gráfico de Uniformidade-Controle para a Mediana, Cusum,
    MMEP, Gráficos de Capacidade de Processos Robustos, uni e multivariados, Proficiência
    de Organizações, Metrologia, métodos robustos. E) Robótica Aplicada, analise,
    projeto, prototipação, codificação, testes e documentação de robôs e aplicativos
    para pc, tablet e celular linguagens Python e C, comparação em custo, desempenho
    e segurança, Digrama de Nassi Schneiderman, Diagrama Hierárquico de Blocos, DFD,
    Diagrama Entidade Relacionamento, simulação computacional, Bootstrapping e Jackknife,
    Monte Carlo, do desempenho de aplicativos e robôs. F) Métodos estatísticos para
    Data Mining. G) Métodos de gestão e certificação internacional da qualidade. O
    NIT Qualidade e Metrologia na Agropecuária USP/EMBRAPA/CNPq/Indústria. Aplicação
    de IA e Data Mining na Gestão da Inovação em ambientes de Hipercometitividade.
    H) Organizações e Projetos Data Driven, conceito, sistemas e ferramentas de gestão,
    IA-CDR e RA.'
  course_name: 'LCE0137 - Inteligência Artificial, Ciência de Dados e Robótica Aplicada
    para Gestão de Organizações e Projetos Data Driven

    Artificial Intelligence, Data Mining and Management for Innovation and Hypercompetitiveness'
  deactivation: ''
  instructors: '5542817 - Cristian Marcelo Villegas Lobos

    2553644 - Edwin Moises Marcos Ortega

    2688982 - Gabriel Adrian Sarries'
  lecture_credits: '2'
  objectives: Inteligência Artificial (IA), Ciência de Dados Robusta (CDR) e Robótica
    Aplicada (RA) para Gestão de Organizações e Projetos Data Driven. Desenvolver
    no aluno senso crítico e habilidades em Inteligência Artificial, Ciência de Dados
    e Robótica Aplicada para Gestão de Organizações e Projetos Data Driven. Com aplicações
    em Data Mining, Big Data e Gestão – Sistemas Mundiais de Gestão- para Inovação
    e hipercompetitividade. O conhecimento será útil em sua vida acadêmica e principalmente
    no mercado de trabalho, aumentando significativamente a empregabilidade e competitividade
    do egresso.
  practical_credits: '0'
  total_workload: 30 h
