  course: 'Inteligência Artificial (IA): conceito, algoritmos: Rain Forest, Support
    Vector Machine, Naive Bayes, E Clasification e Regression Tree . Aplicações em
    gestão, engenharia, biologia, ambiência, economia, e pesquisa. Aprendizado de
    máquina e redes neurais, comparação de resultados com métodos estatísticos convencionais,
    linguagens R, Python, SAS e outras. Noções introdutórias: Regressão Logística,
    NPMANOVA, DiscriminanteNP.  Métodos estatísticos para Data Minig: univariados,
    multivariados, paramétricos e robustos. Métodos de gestão como Lean Startup-Amazon,
    TQM-Toyota- Porsche-GM, ISO-9000-14000-22000-27000, GlobalGAP, FSC, BSC, PNQ,
    EQA,  6 Sigma, Malcolm Baldrige,  etc. O Núcleo de Inovação Tecnológica Qualidade
    e Metrologia na Agropecuária USP/EMBRAPA/CNPq/Indústria, coordenado pelo CENA
    e ESALQ USP.  Aplicação de IA,   Data Mining e Gestão em ambientes de Hipercometitividade
    e hiperinovação.'
  course_name: 'LCE0137 - Inteligência Artificial, Data Mining e Gestão para  Inovação
    e Hipercompetitividade

