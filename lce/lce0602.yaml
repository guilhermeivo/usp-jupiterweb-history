    216p.

    BIBLIOGRAFIA COMPLEMENTAR

    COCHRAN, W.G. e G.M. COX.   Experimental Design. 2ª edição. Nova York. John Wiley,1992.
    611p.

    DIAS,C.T.S.  Estatística Básica por meio do SAS para Windows, Material Didático-nacional,
    Piracicaba, 2015, ISBN 978-8586481-3 CDD 519.50285 D 5412.

