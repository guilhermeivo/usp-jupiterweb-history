  course: '1. Introdução à Informática: 1.1. Uso do processador de texto: formatação,
    tabelas, geradores de índices, fórmulas. 1.2. Uso da planilha eletrônica: confecção
    de planilhas, funções estatísticas, gráficos; macros. 1.3. Pacotes Estatísticos
    para microcomputadores. 2. Variação do acaso. Modelo matemático. 3. Medidas de
    posição e medidas de dispersão: média, variância, desvio padrão, erro padrão da
    média e coeficiente de variação. 4. Etapas para o planejamento de experimentos:
    escolha de fatores e seus níveis. Unidade experimental. Definição do delineamento
    experimental. 5. Princípios básicos de experimentação: repetição, casualização
    e controle local. 6. Experimentos inteiramente ao acaso. 7. Métodos de comparações
    múltiplas (Tukey, Duncan, Schefeé, Dunnett). 8. Análise de regressão. Modelo polinomial.
    9. Exigências do modelo matemático. Transformações de dados. 10. Experimentos
    em blocos casualizados. 11. Experimentos em blocos casualizados com parcelas perdidas.
    12. Experimentos em quadrados latinos. 13. Experimentos fatoriais. 14. Experimentos
    fatoriais: deslocamento das somas de quadrados. 15. Experimentos fatoriais: confundimento.
    16. Experimentos em parcelas subdivididas. 17. Experimentos em faixas. 18. Análise
    de grupos de experimentos: delineamentos inteiramente ao acaso e em blocos casualizados.'
  course_name: 'LCE0602 - Estatística Experimental

    Experimental Statistics'
  deactivation: ''
  instructors: 93551 - Sônia Maria De Stefano Piedade
  lecture_credits: '4'
  objectives: A disciplina Estatística Experimental tem como objetivo principal estimular
    o senso crítico do estudante com relação à experimentação, de tal modo que, recebendo
    informações a respeito da pesquisa, o estudante seja capaz de planejar e conduzir
    um experimento, analisar os dados e interpretar os resultados.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
