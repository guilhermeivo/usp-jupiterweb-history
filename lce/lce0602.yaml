    MONTGOMERY, Douglas C. Design and Analysis of Experiments. 8th edition. 2012.

    NOGUEIRA, M.C.S. Experimentação Agronômica I. Conceitos, Planejamento e Análise
    Estatística. Piracicaba:  Ed. MCSNogueira, 2007. 494p.

    PIMENTEL GOMES, F.; GARCIA, C.H. Estatística Aplicada a Experimentos Agronômicos
    e Florestais. Piracicaba: Fealq, 2002. 307p.

    VENABLES, W.N.; RIPLEY. B.D.  Modern applied statistics with S. New York: Springer,
