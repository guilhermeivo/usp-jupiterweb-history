  course: '1. Integração indefinida: Definição, propriedades, integração básica. 1.1
    Técnicas de integração: Integral por substituição, Integral  por partes, Integral
    de funções racionais e irracionais. 2. Integração definida: Definição, propriedades,
    Teorema fundamental do cálculo. Aplicações da integral definida: área, comprimento
    de arco, volume de sólido de revolução. 3. Integrais impróprias, funções gama
    e beta. 4. Funções de várias variáveis: 4.1. Definição de funções de várias variáveis.
    Diferenciação parcial:  definição de derivadas parciais, regra da cadeia, derivadas
    direcionais, planos tangentes e retas normais, extremos de funções de várias variáveis,
    multiplicadores de Lagrange. 5. Integrais Múltiplas: Integrais duplas num domínio
    retangular, Integrais duplas num domínio qualquer. Área e volume. 6. Equações
    Diferenciais: definição. Equações Diferenciais Separáveis e homogêneas.   Aplicações
    de Equações Diferenciais.'
  course_name: 'LCE0220 - Cálculo II

    Calculus II'
  deactivation: ''
  instructors: '2146622 - Idemauro Antonio Rodrigues de Lara

    7107996 - Marcelo Andrade da Silva

    58832 - Silvio Sandoval Zocchi'
  lecture_credits: '4'
  objectives: Contribuir para a formação matemática do Engenheiro Agrônomo e Florestal.
    Capacitar os alunos no desenvolvimento de métodos matemáticos relacionados a Derivação,
    Diferenciação e Integração no contexto de funções a uma ou mais variáveis independentes.
    Aplicar os conceitos de Cálculo Diferencial e Integral na fundamentação e resolução
    de áreas e volumes, teoria da otimização e na solução de Equações Diferenciais,
    com condições iniciais e de contorno.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
