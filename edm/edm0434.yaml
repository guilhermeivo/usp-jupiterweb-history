    Atividades de Extensão

    Grupo social alvo da atividade

    Estudantes, professores, educadores de espaços não formais, além das comunidades
    escolares da educação básica e dos espaços não formais em ações voltadas ao ensino
    e à aprendizagem de biologia e ciências em geral.'
  course: "1.Orientações e projetos para realização de estágio.\n2. A situação da\
    \ Biologia no currículo escolar.\n3. Planejamento curricular no ensino de Biologia.\n\
    4. Avaliação.\n5. O ambiente - atividades e segurança no laboratório e no campo.\n\
    6. Estrutura do conhecimento nas Ciências Biológicas.\n7. Pesquisas em ensino\
    \ e aprendizagem de Biologia.\n8. O tratamento pedagógico de tópicos especiais\
    \ de Biologia, entre outros, genética, Fisiologia, Ecologia, Educação Ambiental\
    \ e Biotecnologia.\nNas aulas da disciplina serão utilizadas modalidades didáticas\
    \ tais como exposições dialogadas, práticas de laboratório e de campo, exercícios\
    \ simulados, jogos, etc. Parte fundamental da disciplina corresponde \x91as atividades\
    \ realizadas durante os estágios; tais atividades serão acompanhadas ao longo\
    \ das aulas, documentadas pelos alunos e constituirão um relatório.\nInstrumentos\
    \ e Critérios de Avaliação"
  course_name: 'EDM0434 - Metodologia do Ensino de Ciências Biológicas II

    Biological Sciences Teaching Methodologies II'
  deactivation: ''
  instructors: '2987179 - Martha Marandino

    5128439 - Rena de Paula Orofino Silva'
  lecture_credits: '4'
  objectives: 'da atividade

    Partindo do princípio da indissociabilidade entre ensino, pesquisa e extensão,
    as ações extensionistas no âmbito das disciplinas das Licenciaturas têm, como
    objetivo geral, contribuir para a ampliação da inserção social da FEUSP. Do ponto
    de vista das/dos discentes, as iniciativas visam possibilitar-lhes experiências
    formativas por meio do envolvimento em atividades realizadas em instituições e
    espaços educativos formais e não formais. Do ponto de vista dos grupos sociais
    envolvidos, as ações buscam promover impacto social decorrente da construção de
    conhecimentos advindos da relação universidade-sociedade no enfrentamento de problemas
    sociais, sobretudo aqueles relacionados à vida escolar e demais espaços educativos.

    Descrição da atividade

    Leitura e discussão de textos; participação em atividades de ensino e divulgação
    voltadas à comunidade escolar e não escolar, por meio de acompanhamento, planejamento
    e implementação de propostas; discussões e avaliação sobre experiências ocorridas
    nos momentos de estágio; apresentação de registros e relatos críticos sobre as
    experiências.

    Formas de acompanhamento das atividades desenvolvidas pelos estudantes: O acompanhamento
    acontecerá a partir de relatos e registros produzidos de modo oral, escrito e
    digital, pelos estagiários e em discussões estabelecidas em sala de aula e em
    momentos de supervisão com os docentes responsáveis e estagiários de pós-graduação.

    Indicadores de avaliação da atividade

    Engajamento com as propostas e posicionamento crítico frente às atividades.'
