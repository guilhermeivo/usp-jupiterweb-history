  course_name: 'EDM0409 - Metodologia do Ensino de Inglês I

    English Teaching Methodologies I'
  deactivation: ''
  instructors: '5237560 - Ana Paula Martinez Duboc

    742505 - Livia de Araujo Donnini Rodrigues'
  lecture_credits: '4'
  objectives: 'da atividade

    Partindo do princípio da indissociabilidade entre ensino, pesquisa e extensão,
    as ações extensionistas no âmbito das disciplinas das Licenciaturas têm, como
    objetivo geral, contribuir para a ampliação da inserção social da FEUSP. Do ponto
    de vista das/dos discentes, as iniciativas visam possibilitar-lhes experiências
    formativas por meio do envolvimento em atividades realizadas em instituições e
    espaços educativos formais e não formais. Do ponto de vista dos grupos sociais
    envolvidos, as ações buscam promover impacto social decorrente da construção de
    conhecimentos advindos da relação universidade-sociedade no enfrentamento de problemas
    sociais, sobretudo aqueles relacionados à vida escolar e demais espaços educativos.

    Descrição da atividade

    As 20h previstas de atividades extensionistas serão dedicadas da seguinte forma:
    mapeamento das ações em curso no contexto educacional; desenvolvimento de um plano
    de trabalho focalizando a ação escolhida; colaboração e engajamento; avaliação
    dos resultados. São exemplos de atividades mostras e feiras culturais, feiras
    de ciências, projetos no âmbito do componente curricular Língua Inglesa, projetos
    interdisciplinares, ações comunitárias já em curso na escola.

    Indicadores de avaliação da atividade

    ao final da ação desenvolvida, os estudantes deverão coletar dados junto ao grupo
    social desenvolvendo instrumento(s) avaliativo(s) baseado(s) nos seguintes indicadores:
    a) alcance; b) relevância; c) impacto. Os critérios para cada um dos indicadores
    serão acordados com a docente responsável pela disciplina. Para a geração de dados,
    poderão ser utilizados questionários, checklists, enquetes, entrevistas abertas
    ou estruturadas, narrativas orais ou escritas, seja em meios impressos ou digitais.

    Formas de acompanhamento das atividades desenvolvidas pelos estudantes: as ações
    serão acompanhadas por meio de entrega de registros parciais ao longo do processo
    e de espaço dedicado no âmbito da disciplina para relatos de prática e partilha
    de experiências. Reuniões individuais também poderão ser realizadas para um acompanhamento
    mais qualificado das ações.'
