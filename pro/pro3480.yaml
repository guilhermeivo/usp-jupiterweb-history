  course_name: 'PRO3480 - Gestão Integrada de Cidades Inteligentes

    Smart Cities Integrated Manangement'
  deactivation: ''
  instructors: '41198 - Jose Joaquim do Amaral Ferreira

    1119720 - Leandro Alves Patah

    47506 - Marcelo Schneck de Paula Pessoa'
  lecture_credits: '3'
  objectives: 'Motivação

    Hoje mais da metade da população global já vive em cidades e, segundo estimativas
    da ONU, este número chegará a 70% em 2050. Muitos grandes centros urbanos já têm
    sua infraestrutura deficitária, sendo necessário buscar soluções urgentes para
    responder de forma adequada às demandas do crescente aumento das populações urbanas.

    objetivos da disciplina

    O conceito de cidades inteligentes surge do esforço consciente em usar tecnologias
    da informação e comunicação para modificar a vida e o trabalho das pessoas nos
    territórios urbanos de forma significativa, melhorando a vida dos cidadãos que
    neles habitam.

    Esta disciplina trata dos diversos componentes de uma cidade inteligente e de
    como integrar estes componentes objetivando o bem estar da população. Serão tratados
    especificamente cada um dos temas e, ao final, os mesmos serão abordados conjuntamente
    com o foco da gestão.

    Motivation

    Nowadays, more than 50% of the global population lives in urban aglomaerations
    and, according to UN estimates, this number will reach 70% by 2050. Many large
    urban centers already have their infrastructure deficit, and urgent solutions
    are needed to respond adequately to the demands of the Increasing urban populations.

    Discipline objectives

    The concept of smart cities arises from the conscious effort to use information
    technology to modify people´s work and life in urban areas in a meaningful way
    with the objective to improve citizens´ life quality. This discipline deals with
    the various smart cities components and how to integrate these components aimingpopulation
    well being. Each of the themes will be specifically studied and, in the end, they
    will be addressed together with management focus.'
