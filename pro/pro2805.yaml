  course: "Não se trata de disciplina com conteúdo específico pré-definido. Este conteúdo\
    \ dependerá, a cada vez que for ministrada, dos temas em aprofundamento. No entendo,\
    \ a metodologia de abordagem pode ser assim descrita:\n1. Exercícios de formulação\
    \ dos problemas a serem tratados.\n\x95\tProduzir as questões relevantes (Por\
    \ que? Como?)\n\x95\tIdentificar os grupos de interesse e sua capacidade de intervenção\
    \ no problema\n\x95\tIdentificar a história do problema (sob que condições se\
    \ decide, hoje, a respeito do problema)\n2. Exercícios de aprofundamento da compreensão\
    \ do problema\n\x95\tPesquisar respostas na literatura e/ou outras fontes (pessoas,\
    \ por exemplo)\n\x95\tIdentificar similaridades e diferenças com outros cenários\
    \ (por exemplo, em problemas urbanos, comparar outras cidades).\n3. Exercício\
    \ de desenvolvimento de solução (soluções) que devem ser viáveis, sujeitas a restrições.\n\
    4. Debates do material produzido entre os alunos e com convidados especialistas\
    \ no assunto.\n5. Oficinas de finalização de um dossiê a respeito do problema\
    \ (relatório final).\nDois temas por semestre, na mesma turma.\nThis is not a\
    \ discipline with specific pre-defined content. The effective content depends,\
    \ every time the discipline is offered, on the themes chosen for the work. Nevertheless,\
    \ the methodology can be described as follows:\n1.\tExercises: formulation of\
    \ problems to be treated.\na.\tElaborate the relevant questions (Why, How?)\n\
    b.\tIdentify stakeholders and their ablity to intervene in the problem\nc.\tIdentify\
    \ the history of the problem (under which conditions decisions are taken today\
    \ about the problem)\n2.\tExercises of deepening the understanding of the problem\n\
    a.\tResearch about answers of questions in the literature an/or other sources\
    \ (interviews)\nb.\tIdentify similarities and differences with other sceneries\
    \ (e.g. in urban problems, compare with other cities)\n3.\tExercises: development\
    \ of solution (solutions) which shall be viable, considering restrictions\n4.\t\
    Debating the produced material with students and invited specialists.\n5.\tWorkshops\
    \ of finalization of a dossier of the problem (final report)."
  course_name: 'PRO2805 - Engenharia de Projetos Complexos do Desenvolvimento Brasileiro

    Engineering of  Brazilian Complex Design Problems'
  deactivation: ''
  instructors: '93123 - Mauro Zilbovicius

    91761 - Roberto Marx'
  lecture_credits: '2'
  objectives: 'Desenvolver a capacidade de compreender e abordar problemas amplos,
    em torno de temas atuais da sociedade e da economia brasileiras, identificando
    suas múltiplas determinações, em geral técnicas, econômicas, políticas, sociais,
    etc. Exercitar a capacidade de crítica para a formulação de soluções para problemas
    de grande escala, expondo estas soluções à análise de especialistas, buscando
    distanciamento tanto da abordagem ideológica como da abordagem jornalística dos
    problemas, mas considerando essas abordagens, e outras, como parte do equacionamento
    dos problemas analisados.

    To develop the ability to understand and tackle wide problems, around contemporary
    themes of society and economy in Brazil. To identify its multiple determinations,
    generally a mix of technical, rconomic, political and social aspects. To exercise
    the ability of critic for the formulation of solutions adequate to large scale
    problems. These solution should be offered to the analysis of specialists, looking
    for a an equidistant approach from ideology and journalism, but considering these
    to approaches, as others, as part of the formulation of the analysed problems.'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
