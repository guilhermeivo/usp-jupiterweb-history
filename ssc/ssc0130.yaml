    - FAIRLEY,R.E. Software Engineering Concepts, New York, McGraw-Hill, 1987 (364p).

    Atividades de Extensão

    Grupo social alvo da atividade

    Entidades sociais que possam se beneficiar de projetos de engenharia de software.'
  course: 'Introdução e objetivos da Engenharia de Software. Processo de Desenvolvimento
    de Software. Modelos de Processo: do linear aos interativos e ágeis. Métodos e
    Técnicas de Análise e Especificação de Requisitos: características, problemas,
    conceitos básicos.  Visão Geral das Fases de Análise e Projeto de Software. Gerenciamento
    de Projetos de Software: planejamento, métricas e estimativas. Gerenciamento de
    Configuração de Software. Qualidade de Software: qualidade de produto e de processo.
    Métodos e Técnicas para Verificação e Validação de Software: inspeção e teste.
    Manutenção de Software.

    Introduction and goals of Software Engineering. Software Development Process.
    Process Models: from linear to interactive and agile. Methods and Techniques to
    Analysis and Specification of Requirements: characteristics, problems and basic
    concepts. Overview of Software Analysis and Design Phases. Software Project Management:
    planning, metrics and estimates. Software Configuration Management. Software Quality:
    quality process and quality product. Methods and Techniques for Software Verification
    and Validation: inspection and testing. Software Maintenance.

    Instrumentos e Critérios de Avaliação'
  course_name: 'SSC0130 - Engenharia de Software

