  bibliography: 'Complementar:

    - PFLEEGER, SHARI L. "Engenharia de Software - Teoria e Prática", 2ª Edição, Makron
    Books, 2004.

    - FOWLER, M.; SCOTT, K.; UML Essencial, Bookman, 2000.

    - PRESSMAN,R.S. Engenharia de Software, Makron Books, 2000.

    - RUMBAUGH, J.; JACOBSON, I.; BOOCH, G.; The Unified Modeling Language Reference
