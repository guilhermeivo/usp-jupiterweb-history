  course: 'Introdução e objetivos da Engenharia de Software. Processo de Desenvolvimento
    de Software. Modelos de Processos: do linear aos interativos e ágeis. Planejamento
    e Gestão de Projetos. Técnicas e Métodos de Análise e Especificação de requisitos:
    características, problemas, conceitos básicos. Métricas e Estimativas de software.
    Gerenciamento de Configuração de Software. Visão Geral das Fases de Análise e
    Projeto de Software. Visão Geral de Qualidade de Software, (qualidade de produto
    e qualidade de processo (CMMI, MPS-BR, ISO 12207, IS 9126)). Métodos e Critérios
    para verificação e validação: inspeção e teste de software. Manutenção de software.
    Aulas práticas para a utilização de ferramentas de apoio às atividades de desenvolvimento
    de software.

    Introduction and goals of Software Engineering. Software Development Process.
    Process Models: from linear to interactive and agile. Methods and Techniques to
    Analysis and Specification of Requirements: characteristics, problems and basic
    concepts. Overview of Software Analysis and Design Phases. Software Project Management:
    planning, metrics and estimates. Software Configuration Management. Software Quality:
    quality process and quality product. Methods and Techniques for Software Verification
    and Validation: inspection and testing. Software Maintenance.'
  course_name: 'SSC0130 - Engenharia de Software

    Software Engineering'
  instructors: 235343 - Alexandre Cláudio Botazzo Delbem
  lecture_credits: '4'
  objectives: 'Oferecer uma visão geral do processo de desenvolvimento de Software
    e dos problemas que a engenharia de software tem por objetivo resolver.

    Provide an overview of the software development process as well as the methods
    and  techniques that can be used during the software development.'
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
