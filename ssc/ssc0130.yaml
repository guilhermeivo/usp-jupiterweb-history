  objectives: 'da atividade

    Promover a interação entre a universidade e sociedade, com a participação dos
    alunos, buscando resolver problemas que possam envolver soluções computacionais

    Descrição da atividade

    Aplicação de técnicas de engenharia de software vistas em sala de aula a problemas
    relatados na indústria, oferencendo  soluções que ficam documentadas e disponíveis
    para uso pelas empresas ou por outros alunos como forma de aprendizagem baseada
    em problemas.

    Indicadores de avaliação da atividade'
