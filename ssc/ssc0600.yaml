  course: 'Conceitos básicos sobre computadores: hardware, software, sistema operacional,
    compiladores, representação interna de dados e linguagem de programação. Resolução
    de problemas e desenvolvimento de algoritmos: análise e solução de problemas,
    representação e documentação. Estruturas de programas: decisão e repetição. Tipos
    de dados simples. Modularização de programas: procedimentos, funções e passagem
    de parâmetros. Tipos de dados compostos: vetores, matrizes, cadeias de caracteres,
    registros, conjuntos e estruturas dinâmicas (ponteiros). Arquivos. Depuração de
    programas. Programação em linguagem estruturada.

    Programming structures: decision and repetition. Simple data types. Modularization:
    procedures, functions and argument passing. Composite data types: arrays, matrices,
    strings, register/structures, sets and dynamic structures (pointers). Files. Debugging.
    Structured programming language'
  course_name: 'SSC0600 - Introdução à Ciência de Computação I

    Introduction to Computer Science I'
  deactivation: ''
  instructors: 235343 - Alexandre Cláudio Botazzo Delbem
  lecture_credits: '4'
  objectives: 'Apresentar os conceitos básicos para o desenvolvimento de programas,
    utilizando uma linguagem de programação como apoio.

    Present the basic concepts of computational thinking applied to problem solving.
    Develop skills to write small programs using a programming language.

    Basic concepts about computers and computing. Problem solving and algorithm design.
    Programming structures. Simple data types. Modularization. Composite data types.
    Files. Debugging. Structured programming language.'
  practical_credits: '1'
  total_workload: 90 h
