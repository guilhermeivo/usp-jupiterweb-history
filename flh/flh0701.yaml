  course: 'Conteúdo:

    1- O Congresso de Viena e a tentativa de restauração da nova/velha ordem conservadora
    1815-1830.

    2- O auge do poderio europeu (1830-1870): desenvolvimentos constitucionais, sistemas
    de alianças e equilíbrio de poder.

    3- Imperialismo e neocolonialismo (1870-11914)

    4- A Primeira Guerra Mundial e o Tratado de Versalhes (1914-1919)

    5- O período entre-guerras: comunismo, fascismo, e crises econômicas (1919-1939).

    6- A Segunda Guerra Mundial (1939-1945) e a bipolarização do mundo.

    7- Descolonização e Terceiro Mundo

    8- A Guerra Fria

    9- O colapso do bloco socialista

    10-  O mundo atual: desequilíbrio de poder e globalização'
  course_name: 'FLH0701 - História das Relações Internacionais na Idade Contemporânea

    History of International Relations in the Contemporary Era'
