  course: 'Conteúdo:

    1- O Renascimento e o Estado Moderno: a revolução na arte da guerra e o surgimento
    da diplomacia.

    2- As Reformas (protestante e católica) e as guerras de religião - surgimento
    do princípio da tolerância.

    3- A Guerra dos Trinta Anos (1618-1648) e o equilíbrio europeu

    4- A vitória do absolutismo:  a derrota das insurreições autonomistas e a supremacia
    da França (1648-1688)

    5- A importância da República das Províncias Unidas no século XVII: centro de
    refúgio, de resistência (ao absolutismo) e de liberdade religiosa e política.

    6- A vitória do liberalismo: as Revoluções inglesas do século e a ascensão da
    Grã-Bretanha (1688-1713)

    7- O Antigo Regime no século XVIII: guerras, diplomacia, neutralidade e direito
    internacional.

    8- O iluminismo, o despotismo esclarecido e a emergência das potências do leste:
    Prussia e Rússia.

    9- A Revolução francesa (1789-1799) e os dois novos princípios fundamentais do
    nacionalismo e da democracia.

    10- A Era napolêonica (1799-1814): a nova ordem revolucionária e a subversão do
    equilíbrio europeu.'
  course_name: 'FLH0700 - História das Relações Internacionais na Idade Moderna

    History of International Relations in the Modern Era'
  deactivation: ''
  lecture_credits: '4'
  objectives: O curso tem por objetivo examinar a formação e o desenvolvimento da
    diplomacia e do equilíbrio entre os Estados europeus a partir do Renascimento,
    nos séculos XV e XVI, até a Revolução francesa e Napoleão, no final do século
    XVIII e início do XIX.
