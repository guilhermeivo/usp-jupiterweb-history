  course: 'Conteúdo:

    1. Projetos emancipacionistas e lutas pela Independência na América.

    2. Formação e consolidação dos Estados Nacionais na América.

    3. A Guerra Civil Americana e a expansão territorial dos Estados Unidos no séc.
    XIX.

    4. Guerras e definições de fronteiras na América Latina do século XIX.

    5. A América e suas relações internacionais no séc. XIX.

    6. Da Doutrina Monroe à Política do "Big Stick": itinerários das relações entre
    América Latina e Estados Unidos.

    7. América Latina e Estados Unidos no século XX: conflitos e negociações.

    8. Projetos e movimentos antiimperialistas na América Latina do séc. XX.

    9. A hegemonia dos Estados Unidos pós Segunda Guerra Mundial e a Guerra Fria.

    10. Blocos Econômicos e política internacional das Américas no final do século
    XX.'
  course_name: 'FLH0702 - América Independente: Formação e Relações Internacionais

    Independent America: Formation and International Relations'
  deactivation: ''
  lecture_credits: '4'
  objectives: A disciplina discute os processos de independência política, formação
    e consolidação dos Estados Nacionais da América, identificando os projetos de
    fragmentação ou unificação política e as formas negociadas ou conflagradas de
    delimitação territorial. Busca também, analisar mecanismos e formas de relacionamento
    internacional utilizados pelos Estados após sua plena configuração.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
