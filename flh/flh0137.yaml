  course: '1-Estratégias de leitura: identificação de conceitos-chave, categorias
    de análise, argumentos, hipóteses e teses (recapitulação do módulo I).

    2-Práticas de escrita: fichamento e relatório de leitura

    3-Práticas de escrita: resenha crítica

    4-Práticas de escrita: ensaio bibliográfico

    5-Práticas de escrita: projeto de pesquisa

    6-Outros gêneros de textos científicos: artigo, dissertação e tese'
  course_name: 'FLH0137 - Prática de Leitura e Escrita Historiográfica II [7- Ensino
    de História e Pesquisa]

    Academic reading and writing in teacher education II'
  deactivation: ''
  instructors: '307878 - Eduardo Natalino dos Santos

    1648922 - Marcos Francisco Napolitano de Eugênio

    1963793 - Rodrigo Monteferrante Ricupero'
  lecture_credits: '4'
  objectives: '- Prosseguir com as práticas de leitura iniciadas no módulo I desta
    disciplina;

    - Desenvolver habilidades de escrita acadêmica com base na precisão redacional,
    na articulação de referências bibliográficas e no desenvolvimento de hipóteses
    e construção de estratégias argumentativas coesas e coerentes.

    - Propiciar práticas dirigidas de leitura e escrita que explicitem as diferenças
    entre os vários tipos de textos acadêmicos: fichamentos, resenhas, ensaios bibliográficos,
    artigos, textos de divulgação, textos didáticos e projetos de pesquisa.'
  practical_credits: '2'
  total_workload: '120 h

    (

    Práticas como Componentes Curriculares =  20 h

    )'
  type: Semestral
