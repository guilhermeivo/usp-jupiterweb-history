courses:
  activation: 01/01/2020
  assessment: Apresentação de um trabalho para nota final do curso.
  bibliography: A disciplina não possui bibliografia inicial, por conta da especificidade
    do tema proposto, que almeja explicitar recursos metodológicos mínimos de leitura
    e escrita necessários para acompanhar dos cursos oferecidos.
  course: '1. Especificidade dos textos acadêmicos.

    2. Procedimentos para leitura e fixação conceitual: resumo e fichamento.

    3. Modelo de dissertação com base em problemas conceituais específicos dos textos.

    4. Resenha como exposição de uma compreensão global e de uma tomada de posição
    sobre os textos.

    5. Reconstrução e avaliação da argumentação dos textos.'
  course_name: 'FLH0137 - Leitura e escrita acadêmica na formação de professores II

    Academic reading and writing in teacher education II'
  deactivation: ''
  instructors: '371954 - Adone Agnolin

    129383 - Daniel Strum

    954874 - Francisco Assis de Queiroz

    6580513 - Jose Antonio Vasconcelos

    7310217 - Maria Cristina Correia Leandro Pereira'
  lecture_credits: '4'
  objectives: O curso almeja oferecer situações de leitura e escrita voltadas para
    a formação do pesquisador e do futuro professor de História. Em particular, as
    dificuldades básicas de compreensão e fixação conceitual de textos teóricos serão
    tematizadas por docentes, que apresentarão métodos para o exame de textos históricos
    com diferentes temas, enfoques e tipos textuais.
  practical_credits: '2'
  total_workload: '120 h

    (

    Práticas como Componentes Curriculares =  20 h

    ,

    Atividades Acadêmicos-Científico-Culturais =  20 h

    )'
  type: Semestral
