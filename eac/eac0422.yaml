courses:
  activation: 01/01/2025
  assessment: 'a) O aluno poderá participar do processo de reavaliação (recuperação)
    na disciplina caso obtenha

    nota média final maior ou igual a 3,0 (três) e menor que 5,0 (cinco) e frequência
    igual ou superior a 70% (setenta por cento).

    b) A média para aprovação com reavaliação será obtida por meio da média aritmética
    simples da

    média final + nota obtida na reavaliação, que deverá ser igual ou superior a 5,0
    (cinco).'
  bibliography: 'Básica

    BIBLIOGRAFIA BÁSICA:

    DICKSON, D.C.M; HARDY, M. R; WATERS, H.R. (2013). Actuarial Mathematics for Life
    Contingent Risks. Second Edition.

    JORDAN, C. W. (1991). Society of Actuaries’ Textbook on Life Contingencies. The
    Society of

    Actuaries, 2. ed. 349 p.

    BIBLIOGRAFIA COMPLEMENTAR:

    BOWERS, N. L.; GERBER, H. U; HICKMAN, J. C.; JONES, D. A.; NESBITT, C. J. (1997).

    ACTUARIAL MATHEMATICS. The Society of Actuaries, 2. ed. 753 p.'
  course: '1. Revisão de anuidades financeiras antecipadas, postecipadas e contínuas;

    2. Modelos de sobrevivência: a variável aleatória tempo de vida de um recém-nascido
    e tempo de vida para um indivíduo que já completou x anos de idade. Funções densidade
    de probabilidade, acumulada, de sobrevida e força de mortalidade.

    3. Função tábua de sobreviventes, probabilidades de morte/sobrevivência, expectativa
    de vida e seu desvio-padrão;

    4. Idades Fracionadas: hipótese da distribuição uniforme de mortes e da força
    de mortalidade constante;

    5. O modelo de Gompertz-Makeham;

    6. Modelos de precificação de seguros de vida inteira, diferidos e temporários,
    em tempo discreto e contínuo: estimação de prêmio estatístico e prêmio puro;

    7. Modelos de precificação de dotais puros e mistos: estimação de prêmio estatístico
    e prêmio puro;

    8. Modelos de precificação de anuidades atuariais antecipadas, postecipadas e
    contínuas: estimação de prêmio estatístico e prêmio puro;

    9. Estimação de prêmio puro nivelado para produtos securitários de vida: uma introdução.
    Definição da variável aleatória que captura a perda futura e sua relação com o
    princípio de equivalência;

    10. Estimação da provisão matemática de benefícios a conceder e de benefícios
    concedidos por meio da variável aleatória que captura a perda futura;

    11. Comutações para seguros de vida, dotais e anuidades atuariais.

    Instrumentos e Critérios de Avaliação'
  course_name: 'EAC0422 - Matemática Atuarial Vida I

    Actuarial Mathematics I - Life'
  deactivation: ''
  instructors: '4894284 - João Vinícius de França Carvalho

    2112537 - Ricardo Pacheco

    5664682 - Roberto Bomgiovani Cazzari'
  lecture_credits: '4'
  objectives: Apresentar os conceitos e teorias básicas que regem a precificação de
    seguros de vida, dotais e anuidades atuariais. Complementarmente, espera-se que
    o aluno desenvolva o arcabouço matemático para estimar as provisões matemáticas
    associadas a estes produtos.
  practical_credits: '0'
