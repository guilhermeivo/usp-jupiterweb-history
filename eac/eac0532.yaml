  course: '1. FUNDAMENTOS GERAIS DO RISCO SOB A ÓTICA ATUARIAL

    1.1 Características e classificação

    1.2 Risco e Seguro

    1.3 Tipologia dos riscos

    2. OPERAÇÕES, CONTRATOS E APREÇAMENTO DE SEGUROS GERAIS

    2.1 Gerenciamento de riscos: processos, técnicas, e avaliação de alternativas

    2.2 O mecanismo do seguro: fundamentos, contribuições econômicas e elementos do
    risco segurável

    2.3 Formação de preço: conceituação e tipos de prêmios

    2.4 Avaliação do equilíbrio econômico-financeiro: capital de solvência e probabilidade
    de ruína

    2.5 Organização setorial e efeitos econômicos do seguro

    3. OPERAÇÕES, CONTRATOS E APREÇAMENTO DE SEGUROS DE VIDA E PREVIDÊNCIA

    3.1 Visão geral da Previdência Social

    3.2 Entidades Abertas e Fechadas de Previdência Complementar

    3.3 Modalidades de planos de benefícios

    3.4 Regimes de financiamento

    3.5 Formação de preços: aspectos demográficos, financeiros e prêmios atuarialmente
    justos de seguros de vida e planos de previdência complementar

    4. ASPECTOS ATUARIAIS E CONTÁBEIS DAS PROVISÕES TÉCNICAS

    4.1 Definição das provisões técnicas e reservas patrimoniais

    4.2 Importância do correto dimensionamento e impactos dos erros de dimensionamento

    4.3 Tipos de provisões técnicas e visão geral da contabilização

    4.4 Regras de alocação dos ativos garantidores das provisões técnicas'
