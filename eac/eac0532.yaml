  lecture_credits: '2'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina busca apresentar aos alunos de Ciências Contábeis conceitos teóricos
    sobre as operações de produtos que possuem o risco como elemento fundamental.
    Abordam-se os principais aspectos de gerenciamento de risco e a sua relação com
    a atividade seguradora. Para além de articular os conceitos teóricos, procura-se
    dar um caráter prático no processo de apreçamento dos riscos incorridos por seguradoras
    e entidades de previdência por meio de resolução de exercícios.

    OBJETIVOS DE APRENDIZAGEM:

    A disciplina oferece uma visão holística, com viés quantitativo, dos principais
    temas relacionados às operações de seguros. Os temas estudados serão tratados
    de maneira conceitual e prática. Ao final do curso, espera-se que os alunos estejam
    aptos a:

    1. Reconhecer e descrever os principais fontes e fatores de riscos inerentes à
    atividade seguradora;

    2. Organizar o raciocínio matricial nas dimensões relevantes de classificação
    de riscos;

    3. Entender e aplicar ferramentas para gerenciamento da postura perante o risco;

    3. Conhecer a organização formal dos setores relevantes (Seguros, Previdência,
    Saúde), seus ambientes regulatórios e suas idiossincrasias;

    4. Mensurar as obrigações assumidas junto às contrapartes;

    5. Dimensionar a necessidade de capital para manter o equilíbrio econômico-financeiro
    das operações securitárias;

    6. Computar medidas probabilísticas que sinalizem insuficiência de recursos de
    maneira antecipada; e

    7. Avaliar a alocação prudencial das provisões técnicas.'
