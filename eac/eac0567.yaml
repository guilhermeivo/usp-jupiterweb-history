  assessment: 'a) O aluno poderá participar do processo de reavaliação (recuperação)
    na disciplina caso obtenha nota média final maior ou igual a 3,0 (três) e menor
    que 5,0 (cinco) e frequência igual ou superior a 70%.

    b) A média para aprovação com reavaliação será obtida por meio da média aritmética
    simples da média final + nota obtida na reavaliação, que deverá ser igual ou superior
    a 5,0 (cinco).'
  bibliography: 'BIBLIOGRAFIA PRINCIPAL

    Curso Essencial de Vba; Alexandre Alvaro, Joel João da Silva, Ricardo Argenton
    Ramos;

    Editora: Digerati Books; 2002.

    BIBLIOGRAFIA COMPLEMENTAR

    VBA e Macros para Microsoft Office Excel 2007; Bill Jelen, Tracy Syrstad; Editora:
    Pearson - Prentice Hall; 2009.'
  course: '1. Variáveis: inteiras, longas, ponto flutuante;

    2. Como implementar e percorrer matrizes;

    3. Aspectos lógicos e indutivos de processos iterativos;

    4. Exemplos e aplicações de Do While;

    5. Exemplos e aplicações de Repeat Until;

    6. Exemplos e aplicações de While;

    7. Exemplos e aplicações de For next;

    8. Exemplos e aplicações de IF e testes condicionais;

    9. Sintaxe básica da linguagem VBA e do ambiente de programação para implementar
    algoritmos números típicos de Atuária e Finanças;

    10. Modelos matemáticos em atuária e finanças que demandam lógica de programação.'
