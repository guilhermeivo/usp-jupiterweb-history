  lecture_credits: '2'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    Esta disciplina tem por objetivo discutir o papel das escolas de negócios e as
    principais agendas mundiais para o desenvolvimento sustentável, com destaque para
    a Agenda 2030 da Organização das Nações Unidas (ONU) e os seus 17 objetivos do
    desenvolvimento sustentável (ODS).

    OBJETIVOS DE APRENDIZAGEM:

    Ao final da disciplina espera-se que os alunos desenvolvam capacidade crítica
    e construtiva para tratar dos grandes desafios deste século, como: pobreza, fome,
    bem-estar, educação, gênero, água e saneamento, energia, trabalho, inovação, consumo
    sustentável, águas mares e oceanos, mudanças climáticas, ecossistemas, sociedades
    pacíficas e parcerias para o desenvolvimento sustentável.'
