  course: '1. ESTUDOS SEMINAIS

    1.1 Decisões financeiras e a função objetivo da empresa

    1.2 As proposições de Modigliani e Miller

    2. PRINCIPAIS TEORIAS DE ESTRUTURA CAPITAL

    2.1 Teoria de trade-off e conflitos de agência

    2.2. Modelos baseados na assimetria de informação e teoria de pecking order

    2.3 Teoria de market timing e suas implicações

    2.4 Outras abordagens teóricas e empíricas sobre estrutura de capital

    3. DETERMINANTES DA ESTRUTURA DE CAPITAL DAS EMPRESAS

    3.1 Fatores determinantes das decisões de estrutura de capital das empresas no
    Brasil e no exterior

    3.2 Fatores determinantes do custo de capital próprio

    3.3 Fatores determinantes do custo de capital de terceiros

    4. FINANCIAMENTO DAS EMPRESAS NO BRASIL

    4.1 Mercado de capitais brasileiro

    4.2 Panorama da estrutura de financiamento das empresas no Brasil'
  course_name: 'EAC0166 - Tópicos Avançados em Estrutura de Capital

    Advanced Topics on Capital Structure'
  deactivation: ''
  instructors: 3696531 - Tatiana Albanez
  lecture_credits: '2'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina busca apresentar as principais correntes teóricas que fundamentam
    as decisões de estrutura de capital tomadas pelas empresas. Também são discutidas
    as principais fontes de financiamento para as empresas no Brasil e aspectos intrínsecos
    do nosso mercado, como fatores macroeconômicos e institucionais, e seus impactos
    sobre o processo decisório no âmbito empresarial. Além de discutidos os conceitos
    presentes nos principais papers da literatura de estrutura de capital, procura-se
    refletir sobre as implicações práticas destas teorias por meio da análise crítica
    de estudos empíricos nacionais e internacionais sobre o tema, bem como pela participação
    de profissionais de mercado por meio de palestras e debates durante a disciplina.

    OBJETIVOS DE APRENDIZAGEM:

    Espera-se que, ao final do curso, os alunos estejam aptos a:

    1. Identificar e descrever os argumentos básicos das teorias de estrutura de capital,
    desde os trabalhos seminais até os trabalhos mais recentes da literatura;

    2. Compreender as hipóteses da teoria de Trade-Off e suas implicações;

    3. Compreender as hipóteses da teoria de Pecking Order e suas implicações;

    4. Compreender as hipóteses da teoria de Market Timing e suas implicações;

    5. Analisar criticamente as implicações das teorias no processo decisório das
    empresas;

    6. Identificar os determinantes das decisões de estrutura de capital das empresas
    no Brasil e no exterior;

    7. Identificar os principais determinantes do custo de capital próprio e de terceiros
    das empresas;

    8. Discutir criticamente os modelos e limitações dos trabalhos empíricos realizados
    sob as principais vertentes da literatura de estrutura de capital; e

    9. Entender a estrutura de financiamento das companhias no Brasil.'
