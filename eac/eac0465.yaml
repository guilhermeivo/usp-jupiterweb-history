courses:
  activation: 01/01/2025
  assessment: 'a) O aluno poderá participar do processo de reavaliação (recuperação)
    na disciplina caso obtenha

    nota média final maior ou igual a 3,0 (três) e menor que 5,0 (cinco) e frequência
    igual ou superior a

    70%.

    b) A média para aprovação com reavaliação será obtida por meio da média aritmética
    simples da

    média final + nota obtida na reavaliação, que deverá ser igual ou superior a 5,0
    (cinco).'
  bibliography: 'Básica

    BIBLIOGRAFIA BÁSICA:

    BOWERS, N. L.; GERBER, H. U.; HICKMAN, J. C.; JONES, D. A.; NESBITT, C. J. (1997).
    Actuarial Mathematics. The Society of Actuaries, 2nd. ed. 753 p.

    KAAS, R.; GOOVAERTS, M.; DHAENE, J.; DENUIT, M. (2008). Modern Actuarial Risk
    Theory. 6th ed. Kluwer Academic Publishers.

    BIBLIOGRAFIA COMPLEMENTAR:

    PACHECO, R. (2014). Matemática Atuarial de Seguros de Danos. São Paulo: Atlas.

    KLUGMAN S. A; PANJER, H.; WILLMOT, G. E. (2012). Loss Models: From Data to Decisions.
    4th ed. John Wiley and Sons.'
  course: '1. Fundamentos básicos da Teoria das probabilidades presentes nos diversos
    cálculos atuariais.

    2. Principais modelos probabilísticos de frequência de sinistros.

    3. Principais modelos probabilísticos de severidade de sinistros.

    4. Teoria do risco coletivo aplicada a seguros.

    5. Racionalidade da oferta e Princípios de prêmios de seguros

    6. Modificações nas distribuições de probabilidade e seus impactos na distribuição
    do Sinistro

    Agregado.

    7. Métodos de aproximação de sinistros agregados.

    Instrumentos e Critérios de Avaliação'
  course_name: 'EAC0465 - Matemática Atuarial Não-Vida I

    Actuarial Mathematics I  Non-Life'
  deactivation: ''
  instructors: 4894284 - João Vinícius de França Carvalho
  lecture_credits: '4'
  objectives: Esta disciplina visa desenvolver os modelos probabilísticos mais comuns
    para cálculo de frequência e severidade de sinistros. Articular a Teoria das Probabilidades
    no cálculo de prêmios de seguros, resseguros, prêmio estatístico, prêmio puro,
    carregamento, ruína, tarifação. Entender como distribuições de probabilidade,
    adequadamente escolhidas, são instrumentos de estimação e gestão de carteiras
    de seguros.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
