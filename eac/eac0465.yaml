courses:
  activation: 01/01/2018
  assessment: 'a) O aluno poderá participar do processo de reavaliação (recuperação)
    na disciplina caso obtenha

    nota média final maior ou igual a 3,0 (três) e menor que 5,0 (cinco) e frequência
    igual ou superior a

    70%.

    b) A média para aprovação com reavaliação será obtida por meio da média aritmética
    simples da

    média final + nota obtida na reavaliação, que deverá ser igual ou superior a 5,0
    (cinco).'
  bibliography: 'BIBLIOGRAFIA BÁSICA:

    Klugman S. A; Panjer, H.; Willmot, G.E. (2012). Loss Models: From Data to Decisions.
    John

    Wiley and Sons.

    Pacheco, R.. Matemática Atuarial de seguros de danos. Atlas, 2014.

    BIBLIOGRAFIA COMPLEMENTAR:

    Dickson, D. C.M., Insurance Risk and Ruin (International Series on Actuarial Science),
    Cambridge,

    2010.

    BOWERS, N. L.; GERBER, H. U; HICKMAN, J. C.; JONES, D. A.; NESBITT, C. J. (1997).

    ACTUARIAL MATHEMATICS. The Society of Actuaries, 2. ed. 753 p.'
  course: '1. Fundamentos básicos da Teoria das probabilidades presentes nos diversos
    cálculos atuariais.

    2. Principais modelos probabilísticos de frequência de sinistros.

    3. Principais modelos probabilísticos de severidade de sinistros.

    4. Teoria do risco coletivo aplicada a seguros.

    5. Modificações nas distribuições de probabilidade e seus impactos na distribuição
    do Sinistro

    Agregado.

    6. Métodos de aproximação de sinistros agregados.'
  course_name: 'EAC0465 - Matemática Atuarial Não-Vida I

    Actuarial Mathematics I  Non-Life'
  deactivation: 31/12/2024
  instructors: '4894284 - João Vinícius de França Carvalho

    1064696 - Luiz Jurandir Simões de Araujo

    2112537 - Ricardo Pacheco'
  lecture_credits: '4'
  objectives: 'Esta disciplina visa desenvolver os modelos probabilísticos mais comuns
    para cálculo de frequência

    e severidade de sinistros. Articular a Teoria de Probabilidade no cálculo de prêmios
    de seguros,

    resseguros, prêmio estatístico, prêmio puro, carregamento, ruína, tarifação. Entender
    como

    distribuições de probabilidade, adequadamente escolhidas, são instrumentos de
    estimação e gestão

    de carteiras de sinistros.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
