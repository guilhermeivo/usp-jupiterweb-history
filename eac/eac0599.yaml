  objectives: 'da atividade

    Dentre os objetivos, destacam-se:

    - Fomentar a interação entre universidade e sociedade, promovendo a troca de conhecimentos
    entre as organizações e os estudantes da graduação em ciências contábeis.

    - Consolidar os conhecimentos desenvolvidos na disciplina de Controladoria, por
    meio do aprofundamento em um contexto real, em torno da abordagem PBL (Problem-based
    Learning).

    - Estimular o desenvolvimento de competências (soft-skills nos graduandos de ciências
    contábeis), particularmente, comunicação oral e escrita, trabalho em grupo, capacidade
    crítica e de solução de problemas.

    - Transferir reflexões relevantes aos gestores e às organizações em relação aos
    temas da disciplina de Controladoria, temas importantes para as organizações.

    Descrição da atividade

    Descrição da atividade:

    A atividade consiste no desenvolvimento de um caso prático relacionado a cada
    um dos temas da disciplina, sejam: (1) Introdução à controladoria e controle gerencial
    nas organizações; (2) Sistema de avaliação de desempenho, estrutura descentralizada
    e artefatos; e (3) Tópicos especiais em controladoria. Os alunos são divididos
    em grupos, sendo um atribuído para cada tema.

    O desenvolvimento da atividade de extensão (caso prático) consiste nas seguintes
    etapas:

    (1) Identificação e contato com professionais da área de finanças e controladoria
    na organização;

    (3) Elaboração da carta de anuência para realização da atividade de extensão junto
    à organização;

    (4) Realização de uma ou mais entrevistas com profissionais da organização, seguindo
    o roteiro de solução base de cada caso (disponibilizado pelo docente e adaptado
    pelo grupo), que abrange questionamentos gerais sobre o contexto da organização
    e da área, e perguntas específicas de aprofundamento de cada tema.

    (5) Consolidação e análise das informações fornecidas pelo(s) gestor(es) da organização,
    à luz da abordagem de Problem Based Learning (PBL). Portanto, seguindo-se a estrutura:
    delimitação do contexto, definição do problema real, identificação das hipóteses
    (causas do problema) e as recomendações de solução, ancoradas na literatura.

    (6) Apresentação do caso prático em grupo, em sala de aula, e recepção das críticas
    e comentários do(s) professor(es) e estudantes.

    (7) Elaboração de um relatório executivo (em formato de texto ou vídeo) e envio
    deste conteúdo para o participante da organização. O objetivo desse relatório
    é elucidar os pontos críticos observados durante o desenvolvimento do caso prático
    e proporcionar reflexões e recomendações de melhoria (e referências que permitam
    fundamentá-las). O formato e tipo do relatório serão acordados diretamente com
    a organização.

    Indicadores de avaliação da atividade

    Como indicadores para avaliação da atividade serão consideradas a qualidade da
    apresentação e a qualidade do relatório escrito ou por meio de vídeo, enviado
    ao gestor participante da atividade. Dentre as competências avaliadas, destacamos
    (mas não restritas a elas): conteúdo, fundamentação, comunicação oral e escrita,
    capacidade crítica, dentre outras competências. As avaliações serão realizadas
    pelo(s) docente(s) responsável(is) pela disciplina.'
