  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    Essa disciplina tem como objetivo a discussão e o aprofundamento dos conhecimentos
    dos alunos no que se refere às demonstrações em moeda constante. Inflação e variações
    cambiais podem distorcer de forma bastante relevante o real significado das informações
    que são apresentadas nas demonstrações contábeis.

    OBJETIVOS DE APRENDIZAGEM:

    Apresentar e demonstrar aos participantes da disciplina os reflexos dos efeitos
    que tanto a inflação quanto as variações cambiais podem provocar nas diversas
    demonstrações contábeis. Ao aluno será oferecida a oportunidade de identificar
    e, principalmente, compreender que, mesmo com taxas de inflação, ou variações
    cambiais, que possam ser consideradas baixas por muitos, ainda assim no médio
    e longo prazos seus efeitos são bastante perniciosos para o bom entendimento das
    demonstrações contábeis.

    Espera-se que, ao final da disciplina, os alunos estejam aptos a:

    1. Entender os efeitos da perda de poder aquisitivo da moeda.

    2. Identificar as diferenças entre variações nominais e variações reais.

    3. Avaliar e distinguir o que são despesas financeiras reais.

    4. Avaliar e distinguir o que são receitas financeiras reais.

    5. Compreender o que são ganhos e perdas em ativos e passivos monetários.

    7. Identificar e entender o que significa capital monetário e capital físico.

    8. Elaborar demonstrações contábeis em moeda de poder aquisitivo constante.

    9. Entender a diferença entre moeda funcional, moeda local e moeda de apresentação.

    10. Reconhecer e mensurar transações em moeda estrangeira e participações societárias
    no exterior.

    11. Realizar o processo de conversão das demonstrações contábeis.

    12. Entender o que são ganhos e perdas na conversão das demonstrações contábeis.

    13. Avaliar de forma consistente as diferenças de resultado em moeda nacional
    e moeda estrangeira.'
