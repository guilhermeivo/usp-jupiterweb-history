  objectives: "APRESENTAÇÃO DA DISCIPLINA:\nO trabalho de asseguração, em termos gerais,\
    \ é o trabalho no qual o auditor independente visa obter evidências apropriadas\
    \ e suficientes para expressar sua conclusão, na forma de emissão de uma “opinião\
    \ técnica-profissional”, de forma a aumentar o grau de confiança dos usuários\
    \ previstos sobre o resultado da mensuração ou avaliação do objeto, elaboradas\
    \ de acordo com os critérios que sejam aplicáveis (normas contábeis) e sob a responsabilidade\
    \ da Administração. O trabalho do auditor independente com o objetivo de emitir\
    \ tal opinião consiste fundamentalmente em avaliar – e relatar – se as demonstrações\
    \ financeiras examinadas estão – ou não – em conformidade com as normas contábeis.\n\
    O foco desta disciplina é o trabalho de auditoria independente de demonstrações\
    \ financeiras realizado em consonância com as Normas de Auditoria e que visam\
    \ fornecer asseguração razoável. No trabalho de asseguração razoável, o auditor\
    \ independente reduz o risco do trabalho para um nível aceitavelmente baixo nas\
    \ circunstâncias do trabalho como base para a sua conclusão. A conclusão do auditor\
    \ independente é expressa no Relatório dos Auditores Independente, onde os auditores\
    \ transmitem a sua opinião sobre o resultado da mensuração ou avaliação das demonstrações\
    \ financeiras de acordo com as Normas Contábeis.\nOBJETIVOS DE APRENDIZAGEM:\n\
    Espera-se que, ao final da disciplina, as(os) estudantes estejam aptos a:\n1.\t\
    Entender o conceito de auditoria e asseguração e as funções de auditoria, governança\
    \ corporativa, incluindo ética e conduta profissional.\n2.\tDemonstrar como o\
    \ auditor obtém e aceita trabalhos de auditoria, obter compreensão da entidade\
    \ e de seu ambiente, avaliar o risco de distorção relevante (seja decorrente de\
    \ deficiências nos controles internos ou outras distorções) e planejar a extensão,\
    \ época e tipos de exames de uma auditoria das demonstrações contábeis\n3.\tDescrever\
    \ e avaliar controles internos, técnicas e testes de auditoria, incluindo sistemas\
    \ de tecnologia da informação para identificar e comunicar os riscos de controle\
    \ e suas consequências potenciais, fazendo recomendações apropriadas. Descrever\
    \ o escopo, papel e função da auditoria interna e julgar em que circunstâncias\
    \ seus trabalhos servem como evidência para a asseguração.\n4.\tIdentificar e\
    \ descrever o trabalho e as evidências obtidas pelo auditor e outros necessários\
    \ para atender aos objetivos dos trabalhos de auditoria e a aplicação das Normas\
    \ de Auditoria.\n5.\tPlanejar o escopo e extensão dos trabalhos a serem realizados\
    \ por especialistas (Impostos, Cybersecurity, Avaliações econômicas, etc.)\n6.\t\
    Aplicar técnicas de auditoria assistidas por computador (CAATs – Computer Assisted\
    \ Audit Techniques) na realização de testes de controles\n7.\tAplicar métodos\
    \ quantitativos como ferramentas de apoio à realização dos exames de auditoria\
    \ (e.g. revisão analítica, determinação de materialidade, amostragem, determinação\
    \ de efeitos sobre uma população)"
