  course: "1.\tESTRUTURA CONCEITUAL DOS TRABALHOS DE ASSEGURAÇÃO E REGULAÇÃO\n1.1\t\
    Definição e tipos de trabalhos de asseguração\n1.2\tElementos de trabalhos de\
    \ asseguração\n1.3\tAsseguração razoável e asseguração limitada sobre demonstrações\
    \ financeiras\n1.4\tAuditoria e governança corporativa: comunicação dos auditores\
    \ com os responsáveis pela Governança\n1.5\tPrincípios éticos e conduta profissional\
    \ em trabalhos de asseguração\n2.\tPLANEJAMENTO E ANÁLISE DE RISCOS\n2.1\tObtenção,\
    \ aceitação (ou retenção) de clientes\n2.2\tObjetivos e princípios do planejamento\
    \ de trabalhos de asseguração de demonstrações contábeis\n2.3\tAfirmações das\
    \ Demonstrações Contábeis\n2.4\tRiscos de Auditoria, Riscos Inerentes, Riscos\
    \ de Controle e Riscos Residuais\n2.5\tMaterialidade: conceito e prática\n2.6\t\
    Entendimento da entidade e de seu ambiente de negócios\n2.7\tAnálise de riscos\
    \ de auditoria\n2.8\tFraude, leis e regulação\n2.9\tDocumentação do planejamento\n\
    2.10\tUtilização de especialistas: plano, extensão e formato das conclusões como\
    \ evidência de auditoria\n3.\tCONTROLES INTERNOS\n3.1\tSistema de Controles Internos,\
    \ objetivos e conceitos\n3.2\tEstrutura conceitual de controles internos (e.g.\
    \ COSO)\n3.3\tO uso de controles internos na auditoria de demonstrações contábeis\n\
    3.4\tAvaliação de desenho de controles internos\n3.5\tAvaliação de eficácia de\
    \ controles internos\n3.6\tAmostragem\n3.7\tTestes de controles com CAATs\n3.8\t\
    Diferenciação dos trabalhos dos auditores externos e internos e interação com\
    \ trabalhos de auditores internos\n3.9\tDeterminação do risco residual\n3.10\t\
    Comunicações sobre controles internos"
