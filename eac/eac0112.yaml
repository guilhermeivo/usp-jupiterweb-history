  course_name: 'EAC0112 - Introdução à Atuaria

    Introduction to Actuarial Science'
  deactivation: ''
  instructors: '8760796 - Ana Carolina Maia

    904700 - Luis Eduardo Afonso

    1064696 - Luiz Jurandir Simões de Araujo

    2112537 - Ricardo Pacheco

    1967693 - Wanderlei Lima de Paulo'
  lecture_credits: '2'
  objectives: Esta é uma disciplina de caráter introdutório. Seu objetivo é apresentar
    aos alunos ingressantes as principais áreas das Ciências Atuariais e o campo de
    atuação do atuário. Na parte inicial é feita a apresentação de conceitos básicos
    referentes à questão do risco. Essa é a base para que sejam estudados o gerenciamento
    de riscos e os seguros. Posteriormente, é feita uma série de palestras de atuários,
    estatísticos e profissionais das áreas em que atuários atuam. O cronograma das
    palestras é definido de forma que no início sejam abordados temas mais gerais
    e, à medida que a disciplina evolui, sejam expostos temas de caráter mais específico.
    Espera-se que ao final da disciplina, os ingressantes tenham uma compreensão mais
    precisa sobre as atribuições e as perspectivas profissionais e acadêmicas do atuário
    no Brasil e em outros países.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
