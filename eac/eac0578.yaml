  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina visa propiciar aos participantes o entendimento do uso de informação
    financeira e não financeira para planejamento e controle orçamentário, compreendendo
    as etapas do planejamento orçamentário e elaboração do orçamento e seu uso como
    mecanismo de controle gerencial.

    Espera-se que, com isso, que os alunos percebam e valorizem o planejamento e o
    controle financeiro ou de resultados com as funções de Administração e Contabilidade.
    Adicionalmente, objetiva introduzir aspectos específicos do planejamento e orçamento
    nas entidades governamentais do setor público brasileiro.

    OBJETIVOS DE APRENDIZAGEM:

    Espera-se que ao final deste curso, os estudantes possam ser capazes de:

    1. Descrever e analisar as principais etapas de um processo orçamentário;

    2. Compreender as principais escolhas a serem feitas no desenho de processos orçamentários;

    3. Perceber as dificuldades enfrentadas no ambiente de planejamento e controle;

    4. Avaliar as principais implicações comportamentais associadas ao processo orçamentário;
    e

    5. Identificar características das entidades governamentais do setor público brasileiro
    que implicam em especificidades quanto ao planejamento e orçamento.'
