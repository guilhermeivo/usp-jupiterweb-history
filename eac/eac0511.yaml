    3696531 - Tatiana Albanez'
  lecture_credits: '4'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina busca apresentar e discutir os conceitos teóricos e questões práticas
    que envolvem as decisões financeiras tomadas pelas empresas no processo de gestão
    de recursos, abordando os principais aspectos relacionados às decisões de financiamento,
    investimento e gestão do capital de giro. Para tanto, além de apresentados os
    conceitos teóricos, procura-se demonstrar a sua aplicação prática no processo
    decisório das empresas por meio de exercícios e estudos de caso.

    OBJETIVOS DE APRENDIZAGEM:

    A disciplina oferece uma visão quantitativa abrangente e moderna dos principais
    temas relacionados às finanças corporativas. Os temas estudados serão tratados
    de maneira conceitual e prática. Assim, espera-se que, ao final do curso, os alunos
    estejam aptos a:

    1. Distinguir e descrever as principais decisões financeiras;

    2. Distinguir as formas de eficiência de mercado e avaliar suas implicações para
    a precificação de ativos financeiros;

    3. Descrever e aplicar a teoria financeira clássica de risco e retorno;

    4. Computar medidas de risco e retorno esperados de ativos individuais, bem como
    de carteiras de investimento;

    5. Conhecer e aplicar ferramentas para gestão do capital de giro da empresa;

    6. Descrever, comparar e aplicar os principais métodos de avaliação econômica
    de projetos de investimento;

    7. Computar medidas de custo de capital próprio e custo de capital de terceiros;

    8. Aplicar os conceitos de retorno exigido e risco à avaliação de projetos de
    investimento e à avaliação de fluxos de caixa;

    9. Comparar as diferentes fontes de financiamento disponíveis para as firmas e
    tomar decisões de estrutura de capital;

    10. Entender a relação entre custo de oportunidade e geração de valor; e

    11. Identificar e descrever os argumentos básicos das teorias de estrutura de
    capital e de políticas de dividendos.'
