  course: '1. FUNDAMENTOS DE ADMINISTRAÇÃO FINANCEIRA

    1.1 As principais decisões financeiras e a função objetivo da empresa

    1.2 Gestão Baseada no Valor

    1.3 Separação entre propriedade e controle e princípios de governança corporativa

    2. RISCO, RETORNO E CUSTO DE OPORTUNIDADE

    2.1 Mercados eficientes: conceitos fundamentais, tipos de eficiência e suas implicações

    2.2 Risco, retorno e o mercado de capitais

    2.3 Teoria do portfólio (Markowitz)

    2.4 Modelo de Precificação de Ativos Financeiros (CAPM) e custo de oportunidade

    3. DECISÕES FINANCEIRAS DE LONGO PRAZO

    3.1 Decisões de investimento e dimensionamento dos fluxos de caixa

    3.2 Métodos de avaliação econômica de projetos

    3.3 Decisões de Investimento em Condições de Risco

    3.4 Custo de capital e criação de valor

    3.5 Fontes de financiamento a longo prazo no Brasil e decisões de estrutura de
    capital

    3.6 Teorias de estrutura de capital e políticas de dividendos

    4. DECISÕES FINANCEIRAS DE CURTO PRAZO

    4.1 Ferramentas para gestão do capital de giro

    4.2 Investimento em capital de giro

    4.3 Financiamento do capital de giro'
  course_name: 'EAC0511 - Administração Financeira

    Financial Management'
  deactivation: ''
  instructors: '3079831 - Lucas Ayres Barreira de Campos Barros

