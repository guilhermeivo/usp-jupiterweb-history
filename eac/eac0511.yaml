  course: "1. As principais decisões financeiras e a função objetivo da empresa.\n\
    2. Separação entre propriedade e controle\n3. A decisão de investimento: critérios\
    \ tradicionais para a avaliação de projetos\n4. Avaliação de títulos de dívida\
    \ e ações\n5. Valor presente líquido e sua relação com o orçamento de capital\
    \ e a estratégia financeira\n6. Introdução ao risco: retornos e o mercado de capitais\n\
    7. Teoria das carteiras e o CAPM \x96 Capital Asset Price Model\n8. Risco, retorno\
    \ e orçamento de capital\n9. Mercados eficientes: conceitos fundamentais, tipos\
    \ de eficiência e suas implicações\n10. Teorias da estrutura de capital"
  course_name: 'EAC0511 - Administração Financeira

    Financial Management'
  deactivation: 31/12/2021
  instructors: '3079831 - Lucas Ayres Barreira de Campos Barros

    3132692 - Renê Coppe Pimentel

    3696531 - Tatiana Albanez'
  lecture_credits: '4'
  objectives: "Espera-se que, ao final do curso, os alunos estejam aptos a:\n1.\t\
    Distinguir e descrever as principais decisões financeiras\n2.\tDescrever, comparar\
    \ e aplicar os principais métodos de avaliação de projetos de investimento\n3.\t\
    Descrever e aplicar a teoria financeira básica de risco e retorno\n4.\tComputar\
    \ medidas de risco e retorno esperados de ativos individuais, bem como de carteiras\
    \ de ativos\n5.\tAplicar os conceitos de retorno exigido e risco sistemático à\
    \ avaliação de projetos de investimento e à avaliação de fluxos de caixa\n6.\t\
    Distinguir as formas de eficiência de mercado e avaliar suas implicações para\
    \ a precificação de ativos financeiros\n7.\tIdentificar e descrever os argumentos\
    \ básicos das teorias de estrutura de capital e de políticas de dividendos"
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
