  course_name: 'EAC0554 - Modelagem de Risco em Finanças e Atuária

    Risk Modelling in Finance and Actuarial Science'
  deactivation: ''
  instructors: 1064696 - Luiz Jurandir Simões de Araujo
  lecture_credits: '4'
  objectives: 'Apresentar como os modelos de ricos, em vários contextos, compartilham
    bases conceituais. Os principais contextos apresentados serão : risco de mercado,
    risco de crédito, risco operacional e os típicos riscos atuariais apresentados
    durante os anos de graduação. Será explorado a capacidade de generalização dos
    modelos de risco para diferentes contextos corporativos e estratégicos.'
