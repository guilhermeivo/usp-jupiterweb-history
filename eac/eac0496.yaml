  course: '1. Problemas fundamentais e Teoria do Método Científico

    2. O processo de pesquisa

    3. Ideias, questão de pesquisa e problema

    4. Marco teórico e pesquisa bibliográfica

    5. Coleta de Dados: Instrumento/Questionário

    6. Discussão sobre os projetos de TCC

    7. Ética

    8. Como ler um trabalho acadêmico?

    9. Forma e conteúdo

    10. Elaboração do relatório de pesquisa

    11. Normas, padronização e uso de gerenciadores de referências

    12. Fontes de dados e informações em Ciências Atuariais & Os dez mandamentos da
    pesquisa

    quantitativa'
  course_name: 'EAC0496 - Metodologia do Trabalho Científico

    Research Methodology'
  deactivation: ''
  instructors: 904700 - Luis Eduardo Afonso
  lecture_credits: '2'
  objectives: 'O objetivo da disciplina é preparar os alunos de Ciências Atuariais
    para o planejamento e a

    elaboração de artigos científicos, particularmente o Trabalho de Conclusão de
    Curso (TCC). Com

    este fim são expostas as principais etapas e motivações de um projeto de pesquisa.
    Por meio da

    leitura crítica de trabalhos acadêmicos (especialmente da área de Ciências Atuariais)
    e do

    aprendizado das técnicas de pesquisa, são apresentados fundamentos necessários
    à elaboração de

    trabalhos científicos.'
  practical_credits: '0'
  total_workload: 30 h
