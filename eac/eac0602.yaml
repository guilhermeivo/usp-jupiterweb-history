    Maclaren, V. (1996). Urban Sustainability Reporting. Journal of The American Planning
    Association, 62, 184-202.'
  course: '1 - Interligação de Dimensões da Sustentabilidade - relatórios de sustentabilidade
    eficazes não tratam as dimensões econômica, ambiental e social de maneira isolada,
    mas sim de forma integrada, mostrando como estas interagem e influenciam umas
    às outras nas operações da empresa (Lozano & Huisingh, 2011).

    2 - Processo de Relatório - o processo de elaboração de um relatório de sustentabilidade
    começa com a definição de objetivos de sustentabilidade, seguida pela escolha
    de um quadro conceitual e indicadores de sustentabilidade, culminando na análise
    e apresentação dos resultados (Maclaren, 1996).

    3 - Abordagem Metodológica Alternativa - há uma necessidade contínua de desenvolver
    e aplicar metodologias alternativas para avaliar a qualidade dos relatórios de
    sustentabilidade, que considerem tanto aspectos quantitativos quanto qualitativos
    dos esforços de sustentabilidade das empresas (Daub, 2007).

    4 - Significado da Divulgação – a divulgação de desempenho sustentável é crucial,
    pois além de informar sobre as práticas atuais, também guia as futuras ações das
    empresas e influencia a percepção e decisões dos investidores e outras partes
    interessadas (Choudhuri & Chakraborty, 2009).

    5 - Incorporação de Perspectivas dos Stakeholders - engajar stakeholders é essencial
    para realizar análises de materialidade, ajudando a identificar aspectos de sustentabilidade
    mais relevantes para a empresa e para suas partes interessadas (Bellantuono, Pontrandolfo,
    & Scozzi, 2016).

    6 – Análise dos diferentes formatos de relatórios de sustentabilidade existentes.'
  course_name: 'EAC0602 - Introdução aos Relatórios de Sustentabilidade

    Introduction to Corporate Sustainability'
  deactivation: ''
  lecture_credits: '2'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A introdução aos relatórios de sustentabilidade abrange uma série de princípios
    e práticas essenciais para que empresas relatem de forma eficaz seus progressos
    em direção à sustentabilidade no sentido amplo do termo.

    OBJETIVOS DE APRENDIZAGEM:

    a)Introduzir as razões pelas quais os relatórios de sustentabilidade vêm ganhando
    espaço nas divulgações corporativas;

    b) Apresentar diretrizes e formatos de reporte como: GRI, TCFD, CDP, dentre outros;

    c) Discutir o panorama regulatório relativo a exigência da publicação de relatórios
    de sustentabilidade.'
  practical_credits: '0'
  total_workload: 30 h
