  bibliography: 'Bellantuono, N., Pontrandolfo, P., & Scozzi, B. (2016). Capturing
    the Stakeholders’ View in Sustainability Reporting: A Novel Approach. Sustainability,
    8(4), 379.

    Choudhuri, A., & Chakraborty, J. (2009). An Insight into Sustainability Reporting.
