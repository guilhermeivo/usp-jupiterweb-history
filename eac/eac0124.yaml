  objectives: "APRESENTAÇÃO DA DISCIPLINA:\nProfissionais da área financeira são cada\
    \ vez mais demandados pelas organizações para assumirem papéis e tomarem decisões\
    \ que envolvem ambiente tecnológico e soluções digitais que se desenvolvem de\
    \ forma rápida em ambiente extremamente dinâmico. Nesta disciplina um olhar mais\
    \ dedicado é dado sobre os Sistemas de Informações Empresariais (ERP), seus usos\
    \ e integrações no ambiente corporativo, benefícios e desafios de projetos de\
    \ implantação e manutenção, bem como seu papel na elaboração de relatórios contábeis\
    \ em atendimento às demandas internas e externas. Aplicações práticas são exploradas,\
    \ com participação de convidados do mercado. Ambiente para fomentar o desenvolvimento\
    \ de atitude e postura positiva e apreciativa ao papel da tecnologia e dos sistemas\
    \ na profissão é claramente oferecido. A estratégia instrucional adotada esta\
    \ pautada em visão mais ampla sobre os temas e suas relações com as organizações\
    \ e o profissional da área financeira, prevendo  oportunidades para discussões\
    \ práticas e aplicações destes conceitos, conforme papel e visão mais atual dos\
    \ ERP nas organizações.\nOBJETIVOS DE APRENDIZAGEM:\nOs participantes que concluírem\
    \ exitosamente esta disciplina estarão aptos a:\n1.\tDiscutir conceitos, características\
    \ estruturação e funcionamento de Sistemas de Informações Empresariais (ERP)\n\
    2.\tDescrever os módulos e funcionalidades dos componentes de um sistema ERP\n\
    3.\tDemonstrar benefícios e desafios relacionados à implantação dos sistemas ERP,\
    \ bem como seus efeitos na organização\n4.\tComparar soluções tecnológicas comerciais\
    \ de ERP\n5.\tOperar módulos de sistemas ERP de soluções selecionadas\n6.\tPreparar\
    \ relatórios contábeis para fins de atendimento de demandas internas e externas\n\
    7.\tAdotar postura positiva e apreciativa em relação ao uso de tecnologias para\
    \ otimização de Sistemas ERP"
