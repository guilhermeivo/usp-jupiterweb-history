  course_name: 'EAC0153 - Contabilidade Aplicada ao Setor Público

    Public Sector Accounting'
  deactivation: 31/12/2024
  instructors: '3549898 - Patrícia Siqueira Varela

    1818911 - Valmor Slomski'
  lecture_credits: '4'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina objetiva propiciar aos participantes o aprendizado relativo aos conceitos,
    definições, ferramentas e técnicas destinados à geração de informações contábeis
    para fins de tomada de decisão e accountability no âmbito das entidades do setor
    público brasileiro.

    OBJETIVOS DE APRENDIZAGEM:

    Espera-se que, ao final da disciplina, os participantes estejam aptos a:

    1. Identificar características das entidades do setor público e das transações
    e eventos que a elas são típicos e que implicam em desafios quanto à normatização
    e implementação dos padrões contábeis.

    2. Aplicar princípios, fundamentos, conceitos e definições da Estrutura Conceitual
    para Elaboração e Divulgação de Informação Contábil de Propósito Geral pelas Entidades
    do Setor Público.

    3. Aplicar os padrões contábeis adotados no Brasil e as International Public Sector
    Accounting Standards (IPSAS) estudados nesta disciplina a determinadas transações
    e outros eventos.

    4. Elaborar demonstrações contábeis de acordo com as normas brasileiras de contabilidade
    aplicadas ao setor público e com as International Public Sector Accounting Standards
    (IPSAS): Balanço Orçamentário, Balanço Financeiro, Balanço Patrimonial, Demonstração
    das Variações Patrimoniais e Demonstração dos Fluxos de Caixa.'
