  course: '1. Conceitos e princípios fundamentais

    2. História da previdência social brasileira

    3. Conceitos, fontes de informações e dados sobre previdência social

    4. O Brasil e o mundo: análise comparada de sistemas previdenciários

    5. Previdência social e demografia

    6. Desenho e indicadores de desempenho de sistemas previdenciários

    7. Diagnósticos e reformas recentes no Brasil

    8. Regimes Próprios de Previdência Social

    9. Avaliação atuarial de regimes previdenciários

    10. Modelo multipilar'
  course_name: 'EAC0220 - Previdência Básica

    Social Security'
  deactivation: ''
  instructors: 904700 - Luis Eduardo Afonso
  lecture_credits: '4'
  objectives: 'A disciplina visa apresentar os tópicos mais relevantes referentes
    à previdência social. São

    estudados inicialmente os conceitos básicos da teoria previdenciária. A seguir
    são vistos a evolução

    histórica do sistema previdenciário brasileiro e as principais espécies de benefícios,
    formas de

    contribuição e dados referentes ao RGPS do INSS. Posteriormente apresenta-se uma
    comparação da

    previdência no Brasil e em outros países. O curso apresenta na sequência alguns
    tópicos como as

    mudanças demográficas, o desenho dos sistemas de previdência, as recentes reformas
    e a avaliação

    atuarial. Finalizando são apresentados os modelos multipilares.'
  practical_credits: '0'
  total_workload: 60 h
