  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina busca apresentar e discutir os conceitos teóricos e questões práticas
    que permitam entender o papel da controladoria e do controller no ambiente de
    negócios atual, abordando sobre as características do ambiente organizacional,
    o controle gerencial, o sistema de avaliação de desempenho considerando a estrutura
    organizacional descentralizada e os artefatos de gestão.

    OBJETIVOS DE APRENDIZAGEM:

    A disciplina oferece uma visão sistêmica, abrangente e moderna da controladoria.
    Os temas estudados serão tratados de maneira conceitual e prática. Assim, espera-se
    que, ao final do curso, os alunos estejam aptos a:

    1. Compreender a importância da controladoria no ambiente de negócios atual;

    2. Entender o papel, a estrutura e as responsabilidades da controladoria nas organizações;

    3. Conhecer o papel e o perfil do controller nas organizações;

    4. Distinguir os artefatos de controle gerencial utilizados pelas organizações
    para apoiar o processo decisório e mensurar e avaliar resultados e desempenhos
    no ambiente organizacional;

    5. Descrever o Sistema de Avaliação de Desempenho no contexto organizacional;

    6.  Conhecer e aplicar ferramentas de avaliação de desempenho considerando a estrutura
    organizacional descentralizada.

    7. Compreender os diferentes artefatos que apoiam o Sistema de Avaliação de Desempenho
    como indicadores de desempenho, Preços de Transferência, Balanced Scorecard e
    Modelo de Gestão Econômica;

    8. Refletir sobre as questões comportamentais e éticas que afetam a controladoria
    e as funções de controle gerencial;

    9. Conhecer a relação entre controladoria e a governança corporativa.'
