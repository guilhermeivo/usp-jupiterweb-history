  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina oferece uma visão descritiva e abrangente dos principais temas relacionados
    ao mercado financeiro, abordando aspectos teóricos e operacionais relacionados
    aos produtos de renda variável, renda fixa, derivativos e fundos de investimentos.

    OBJETIVOS DE APRENDIZAGEM:

    Os temas estudados serão tratados de maneira conceitual e prática, espera-se que
    ao final do curso, os alunos estejam aptos a:

    1. Distinguir e descrever as principais instituições componentes do Sistema Financeiro
    Nacional;

    2. Descrever o funcionamento básico do mercado de ações;

    3. Descrever o funcionamento básico dos produtos de renda fixa;

    4. Descrever os instrumentos derivativos e explicar sua utilidade (hedge);

    5. Descrever o funcionamento básico do mercado de fundos de investimentos; e

    6. Entender operações básicas com produtos de renda variável, renda fixa, derivativos
    e fundos.'
