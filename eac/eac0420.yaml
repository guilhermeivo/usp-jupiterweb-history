courses:
  activation: 01/01/2015
  assessment: 'a) O aluno poderá participar do processo de reavaliação (recuperação)
    na disciplina caso obtenha nota média final maior ou igual a 3,0 (três) e menor
    que 5,0 (cinco) e frequência igual ou superior a 70%.

    b) A média para aprovação com reavaliação será obtida por meio da média aritmética
    simples da média final + nota obtida na reavaliação, que deverá ser igual ou superior
    a 5,0 (cinco).'
  bibliography: 'BIBLIOGRAFIA PRINCIPAL:

    ASSAF NETO, A. Mercado Financeiro. São Paulo: 15a ed., Atlas, 2021.

    FIGUEIREDO, A. C. Introdução aos Derivativos, São Paulo, 3a. ed., Cengage Learning,
    2015.

    BIBLIOGRAFIA COMPLEMENTAR:

    BODIE, Z.; KANE, A.; MARCUS, A. J. Investimentos. 10. ed. Porto Alegre: McGraw-Hill,
    2015.

    OLIVEIRA FILHO, B. G. Gestão de Fundos de Investimentos: o seu Guia Para Gestão
    de Carteiras. 1. Ed. São Paulo: Saint Paul, 2019.

    LIMA, I. S.; LIMA, G. A. S. F.; PIMENTEL, R. C. (Org.). Curso de mercado financeiro:
    tópicos especiais. 2. ed. São Paulo: Atlas, 2012.

    TOP-CVM - Mercado de Valores Mobiliários Brasileiro;

    http://www.investidor.gov.br/publicacao/LivrosCVM.html#TOP

    TOP-CVM - Mercado de Derivativos no Brasil: Conceitos, Produtos e Operações http://www.investidor.gov.br/publicacao/LivrosCVM.html#TOP'
  course: '1. Trocas intertemporais e os fundamentos dos mercados financeiros

    2. O Sistema Financeiro Nacional (SFN)

    3. Mercado de ações e bolsas de valores

    4. Mercado de renda fixa

    5. Securitização

    6. Derivativos'
  course_name: 'EAC0420 - Mercado Financeiro

    Financial Market'
  deactivation: 31/12/2021
  instructors: '145440 - Alexsandro Broédel Lopes

    3079831 - Lucas Ayres Barreira de Campos Barros

    1064696 - Luiz Jurandir Simões de Araujo

    3132692 - Renê Coppe Pimentel

    1967693 - Wanderlei Lima de Paulo'
  lecture_credits: '4'
  objectives: 'A disciplina oferece uma visão descritiva, abrangente e moderna dos
    principais temas relacionados ao mercado financeiro. Os temas estudados serão
    tratados de maneira conceitual e espera-se que, ao final do curso, os alunos estejam
    aptos a:

    1. Explicar a lógica das trocas intertemporais que motivam a criação dos mercados
    financeiros;

    2. Distinguir e descrever as principais instituições componentes do Sistema Financeiro
    Nacional;

    3. Descrever o funcionamento básico das bolsas de valores;

    4. Descrever o funcionamento básico das operações de renda fixa e os mecanismos
    de captação interna e externa;

    5. Explicar o funcionamento das operações de securitização e suas motivações;

    6. Descrever os instrumentos derivativos básicos e explicar sua utilidade.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
