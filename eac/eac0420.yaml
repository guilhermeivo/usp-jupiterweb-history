    2. ed. São Paulo: Atlas, 2011.

    BODIE, Zvi; KANE, Alex; MARCUS, Alan J. Investments. 8. ed. Porto Alegre: McGraw-Hill,
    2010.

    GIANNETTI, Eduardo. O valor do amanhã: ensaio sobre a natureza dos juros. São
    Paulo: Companhia das Letras, 2005.

    OLIVEIRA, Virgínia; GALVÃO, Alexandre; RIBEIRO, Érico (Org.). Mercado financeiro.
