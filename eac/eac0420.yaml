  course: '1. Trocas intertemporais e os fundamentos dos mercados financeiros

    2. O Sistema Financeiro Nacional (SFN)

    3. Mercado de ações e bolsas de valores

    4. Mercado de renda fixa

    5. Securitização

    6. Derivativos'
  course_name: 'EAC0420 - Mercado Financeiro

    Financial Market'
  deactivation: ''
  instructors: '145440 - Alexsandro Broédel Lopes

    3454235 - Francisco Henrique Figueiredo de Castro Junior

    5021632 - Gerlando Augusto Sampaio Franco de Lima

    3079831 - Lucas Ayres Barreira de Campos Barros

    59962 - Luiz Nelson Guedes de Carvalho

    3696531 - Tatiana Albanez

    1967693 - Wanderlei Lima de Paulo'
  lecture_credits: '4'
  objectives: 'A disciplina oferece uma visão descritiva, abrangente e moderna dos
    principais temas relacionados ao mercado financeiro. Os temas estudados serão
    tratados de maneira conceitual e espera-se que, ao final do curso, os alunos estejam
    aptos a:

    1. Explicar a lógica das trocas intertemporais que motivam a criação dos mercados
    financeiros;

    2. Distinguir e descrever as principais instituições componentes do Sistema Financeiro
    Nacional;

    3. Descrever o funcionamento básico das bolsas de valores;

    4. Descrever o funcionamento básico das operações de renda fixa e os mecanismos
    de captação interna e externa;

    5. Explicar o funcionamento das operações de securitização e suas motivações;

    6. Descrever os instrumentos derivativos básicos e explicar sua utilidade.'
  practical_credits: '0'
  total_workload: 60 h
