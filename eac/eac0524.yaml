  course: 'Os Sistemas de Informações Empresariais e o Contador

    Introdução aos ERP''s;

    Influência dos ERP''s nos processos negociais e na Contabilidade e Controladoria;

    Efeitos dos ERP''s sobre a organização, cultura, valores, controle, gestão, métricas
    e resultados econômicos financeiros;

    Metodologia de implementação;

    Modelos de procedimentos;

    Parametrização do módulo Contábil, Econômico e Financeiro (inclusive custos);

    Configurações básicas;

    Controles Internos e Auditoria de Sistemas nos ERPs

    Realização de pesquisas sobre ERP''s.'
  course_name: 'EAC0524 - Sistemas de Informações Empresariais (erp)

    Enterprise Information Systems (ERP)'
  deactivation: ''
  instructors: 78286 - Edson Luiz Riccio
  lecture_credits: '2'
  objectives: 'Oferecer aos alunos conhecimento sobre o funcionamento geral dos Sistemas
    de Informações Empresariais (ERP''s - Enterprise Resource Planning), com ênfase
    na abordagem dos aspectos colaborativos e organizacionais necessários à sua implementação
    e funcionamento.

    O estudo do Sistema de Informações Empresarias requer abordagem transdisciplinar,
    pois emprega diversos ramos do conhecimento, sendo útil a todos que tenham interesse
    no estudo nas empresas e organizações de qualquer tipo.'
  practical_credits: '0'
  total_workload: 30 h
