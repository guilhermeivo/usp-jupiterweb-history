  course: "1. Ambiente da Contabilidade\n1.1 A empresa e seu meio ambiente. A empresa\
    \ como um sistema aberto. As interações da empresa com o mercado. As fontes de\
    \ financiamento e as possibilidades de aplicação de recursos das empresas. A função\
    \ da Contabilidade. A representação contábil da empresa. Os relatórios contábeis.\
    \ 1.2 A Contabilidade como linguagem padrão dos negócios e como instrumento de\
    \ gestão empresarial. \x95 A Contabilidade Societária e a Contabilidade Gerencial.\n\
    1.3 A nova estrutura contábil de acordo com as normas internacionais (IFRS) e\
    \ a Lei 11.638/07. Estrutura conceitual da Contabilidade.\n2. Demonstrações Contábeis\n\
    2.1 O Balanço Patrimonial \x96 conceito de Ativo, Passivo, PL.\n2.2 A Demonstração\
    \ do Resultado do Exercício \x96 conceitos de Receitas e Despesas.\n2.3 A Demonstração\
    \ das Mutações do Patrimônio Líquido \x96 destinação dos lucros.\n2.4 A Demonstração\
    \ dos Fluxos de Caixa \x96 método direto e indireto. DFC x DRE.\n2.5 A Demonstração\
    \ do Valor Adicionado \x96 conceito de riqueza medido pela Contabilidade."
