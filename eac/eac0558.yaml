  course: "1.\tDIÁLOGO E TESTES PARA IDENTIFICAR O NÍVEL DE CONHECIMENTO DOS ALUNOS\
    \ SOBRE CONCEITOS DE SUSTENTABILIDADE.\n•\tTeste inicial sobre conceitos de sustentabilidade\n\
    •\tTeste pegada ecológica\n•\tDiscussão dos resultados e reflexões sobre conceitos\
    \ de riscos empresariais\n•\tTaxas de riscos, custo de capital e os benefícios\
    \ na adoção de práticas sustentáveis\n2.\tABORDAGEM SOBRE OS ASPECTOS MULTIDISCIPLINARES\
    \ DA SUSTENTABILIDADE (ECONÔMICO-SOCIAL-AMBIENTAL-GOVERNANÇA).\n•\tBalanço Contábil\
    \ das Nações (BCN)\n•\tPrincipais agendas mundiais (17 Objetivos do Desenvolvimento\
    \ Sustentável (ODS), Encíclica Papal Laudatu Si, The Imperative to Act (Blue Planet\
    \ Price), Felicidade Interna Bruta (FIB), Carta da Terra, Stern Revies, EMCB,\
    \ Projeto Millenniun e outras.\n3.\tEVOLUÇÃO DOS RELATOS CORPORATIVOS, RELATÓRIOS\
    \ DE SUSTENTABILIDADE E PRINCIPAIS AÇÕES PARA TORNAR AS EMPRESAS SUSTENTÁVEIS\
    \ E COMPETITIVAS.\n•\tCrise de 1929, auditorias e controles internos, relatório\
    \ de administração, demonstração do valor adicionnado (DVA), formulários de referências,\
    \ relatórios de sustentabilidade, Balanço Social, NBTC-15, IBASE, Global Reporting\
    \ Initiative (GRI), índice de sustentabilidade empresarial (ISE/B3), índice de\
    \ carbono eficiente (ICO2/B3), Relate ou Explique Sustentabilidade (campanha 2012/B3),\
    \ protocolos de Kyoto e o acordo de Paris, Orçamento de Carbono Global, análise\
    \ de ciclo de vida (ACV), sistemas integrados de gestão (SIG), Relate ou explique\
    \ ODS (Campanha 2017/B3) e Integrated Reporting.\n4.\tFRAMEWORK 1.0 DO RELATO\
    \ INTEGRADO, SUAS ATUALIZAÇÕES E NORMAS DECORRENTES. PRINCÍPIOS, ELEMENTOS DE\
    \ CONTEÚDO, SEIS CAPITAIS, MODELO DE NEGÓCIO E PENSAMENTO INTEGRADO.\n•\tConceitos\
    \ fundamentais do relato integrado, geração de valor, seis capitais e novo modelo\
    \ de negócios\n•\tPrincípios básicos do relato integrado, foco estratégico e orientação\
    \ para o futuro, conectividade da informação e coerência, relações com partes\
    \ interessadas, materialidade, concisão, confiabilidade e completude, coerência\
    \ e comparabilidade.\n•\tElementos de conteúdo do relato integrado, visão geral\
    \ da organização e ambiente externo, governança, modelo de negócios, riscos e\
    \ oportunidades, estratégia e alocação de recursos, desempenho, perspectivas,\
    \ base para preparação.\n•\tMitos e verdades sobre relato integrado.\n5.\tEMPRESAS\
    \ QUE ADOTAM O RELATO INTEGRADO OU O ENVIRONMENTAL SOCIAL AND CORPORATE GOVERNANCE\
    \ (ESG).\n•\tEmpresas pioneiras\n•\tEmpresas voluntárias\n•\tEconomic Environmental\
    \ Social and Corporate Governance (EESG)\n•\tEmpresas de capital aberto e grandes\
    \ empresas\n•\tPequenas empresas e pessoas físicas.\n6.\tPRÁTICAS PARA ELABORAR,\
    \ ANALISAR OU AUDITAR OS RELATOS INTEGRADOS.\n•\tAnálise de casos práticos\n•\t\
    Adoção obrigatória ou voluntária do relato integrado\n•\tNormas e práticas em\
    \ desenvolvimento"
