  objectives: "APRESENTAÇÃO DA DISCIPLINA:\nEsta disciplina tem por objetivo abordar\
    \ conceitos de sustentabilidade e estudar a estrutura básica conceitual do Relato\
    \ Integrado, emitida pelo International Integrated Reporting Council (IIRC). Esta\
    \ normal internacional apresenta uma nova proposta de contabilidade e de comunicação\
    \ corporativa onde as empresas devem reportar de forma concisa sobre como a sua\
    \ estratégia, governança, desempenho e perspectivas futuras criam valor ao longo\
    \ do tempo.\nOBJETIVOS DE APRENDIZAGEM:\nAo final da disciplina, espera-se que\
    \ os alunos desenvolvam sua capacidade para:\n•\tEntender os princípios e elementos\
    \ de conteúdo do Relato Integrado, seu novo modelo de negócio e o que é pensamento\
    \ integrado.\n•\tUtilizar os conceitos de sustentabilidade nos relatórios e na\
    \ gestão corporativa.\n•\tImplementar ou auditorias do Relato Integrado.\n•\t\
    Aproveitar as janelas de oportunidades relacionadas com os relatórios corporativos,\
    \ assumindo o desafio de promover mudanças mentais e culturais nas organizações."
  practical_credits: '1'
  total_workload: 60 h
