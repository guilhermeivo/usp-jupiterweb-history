  course: '1. CUSTEIO E GESTÃO BASEADOS EM ATIVIDADES (ABC/ABM)

    1.1 Conceito e definições

    1.2 Atividades, processos e direcionadores de custos

    1.3 Para que serve e rol de decisões

    1.4 Operacionalização

    1.5 Relatórios

    2. GESTÃO E MENSURAÇÃO DOS CUSTOS E BENEFÍCIOS DA QUALIDADE

    2.1 Conceito e definições

    2.2 Categorias de custos da qualidade

    2.3 Para que serve e rol de decisões

    2.4 Operacionalização

    2.5 Relatórios

    3. GESTÃO DO CUSTO TOTAL PARA O CONSUMIDOR

    3.1 Conceito e definições

    3.2 Categorias de classificação dos custos totais para o consumidor

    3.3 Para que serve e rol de decisões

    3.4 Operacionalização

    3.5 Relatórios

    4. ANÁLISE DE CUSTOS DE CONCORRENTES

    4.1 Conceito e definições

    4.2 Identificação dos concorrentes relevantes

    4.3 Para que serve e rol de decisões

    4.4 Operacionalização

    4.5 Relatórios

    5. GESTÃO DO CUSTO ALVO

    5.1 Conceito e definições

    5.2 Custo máximo admissível, custo alvo, importância relativa, custo relativo
    e índice de valor

    5.3 Para que serve e rol de decisões

    5.4 Operacionalização

    5.5 Relatórios

    6. ANÁLISE DE CUSTOS DA CADEIA DE VALOR E GESTÃO DE CUSTOS INTEORGANIZACIONAIS
    (GCI)

    6.1 Conceito e definições

    6.2 Mecanismos e fatores condicionantes

    6.3 Para que serve e rol de decisões

    6.4 Operacionalização

    6.5 Relatórios'
  course_name: 'EAC0540 - Gestão Estratégica de Custos

    Strategic Cost Management'
  deactivation: ''
  instructors: '3767752 - Andson Braga de Aguiar

    3770882 - Marcio Luiz Borinelli

    85051 - Welington Rocha'
  lecture_credits: '2'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    Propiciar aos participantes o entendimento de questões relacionadas à gestão e
    mensuração de custos a partir de uma perspectiva estratégica, geralmente com foco
    nas entidades do ambiente próximo às organizações, com o objetivo de conquistar
    vantagem competitiva.

    OBJETIVOS DE APRENDIZAGEM:

    Espera-se que, ao final da disciplina, os alunos estejam aptos a:

    1. Identificar para que serve cada um dos artefatos discutidos na disciplina.

    2. Distinguir em que tipos de organizações cada artefato pode ser utilizado.

    3. Entender e aplicar o passo-a-passo para a implementação de cada artefato nas
    organizações do mundo real.

    4. Elaborar relatórios com informações de cada um dos artefatos.'
