  course: '1. INVESTIMENTOS

    1.1 Propriedades para investimento: conceitos básicos e critérios para reconhecimento
    e mensuração.

    1.2 Investimentos societários

    1.2.1 Tipos de investimentos societários: sem influência significativa, coligadas,
    negócios em conjunto (operações em conjunto e joint ventures) e controladas.

    1.2.2 Contabilização da aquisição de investimentos societários: valor patrimonial,
    mais valia de ativos e passivos, goodwill e ganho por compra vantajosa.

    1.2.3 Método da Equivalência Patrimonial.

    1.2.4 Transações de compra e venda entre empresas do mesmo grupo econômico: apuração
    de lucros não realizados e ajustes no cálculo do resultado de equivalência patrimonial.

    1.2.5 Exigências de divulgação em nota explicativa sobre os investimentos societários.

    2. CONSOLIDAÇÃO DAS DEMONSTRAÇÕES CONTÁBEIS

    2.1 Objetivo da elaboração das demonstrações contábeis consolidadas e conceitos
    iniciais.

    2.2 Obrigatoriedade de elaboração das demonstrações contábeis consolidadas.

    2.3 Conceito de controle e investimentos em controladas: Pronunciamento Técnico
    CPC 36 (R3) – Demonstrações Consolidadas.

    2.4 Procedimentos para elaboração das demonstrações contábeis consolidadas: principais
    ajustes e eliminações necessários.

    2.5 Efeitos das operações entre empresas do mesmo grupo econômico e da apuração
    de lucros não realizados na elaboração de demonstrações contábeis consolidadas.

    3. COMBINAÇÃO DE NEGÓCIOS

    3.1 Aspectos contábeis e legais.

    3.2 Reorganizações societárias: aquisição e alienação de participações societárias,
    incorporação de empresas, fusão de empresas e cisão (total ou parcial) de empresas.

    3.3 Combinação de negócios envolvendo entidades sob controle comum.

    3.4 Combinação de negócios entre partes independentes.

    3.5 Aplicação do método de aquisição previsto no Pronunciamento Técnico CPC 15
    (R1) – Combinação de Negócios.

    3.6 Relação de substituição de ações.

    4. ATIVO NÃO CIRCULANTE MANTIDO PARA VENDA E OPERAÇÃO DESCONTINUADA

    4.1 Ativo não circulante mantido para venda.

    4.1.1 Critérios para classificação de ativos não circulante como mantidos para
    venda.

    4.1.2 Critérios de mensuração.

    4.1.3 Critérios para apresentação e divulgação.

    4.2 Operação descontinuada.

    4.2.1 Conceitos iniciais e critérios para classificação como operações descontinuadas.

    4.2.2 Critérios de apresentação e divulgação das operações descontinuadas nas
    demonstrações contábeis e notas explicativas.

    5. DEMONSTRAÇÃO DO VALOR ADICIONADO (DVA)

    5.1 Balanço social e valor adicionado.

    5.2 Conceito de valor adicionado sob as perspectivas contábil e econômica.

    5.3 Diferenças entre a Demonstração do Resultado do Exercício (DRE) e a Demonstração
    do Valor Adicionado (DVA).

    5.4 Aspectos conceituais na elaboração da Demonstração do Valor Adicionado (DVA).

    5.5 Técnicas para elaboração da Demonstração do Valor Adicionado (DVA).

    5.6 DVA como um instrumento gerencial.

    Instrumentos e Critérios de Avaliação'
