  objectives: "APRESENTAÇÃO DA DISCIPLINA:\nA disciplina busca aprofundar os conhecimentos\
    \ dos alunos na área de contabilidade financeira abordando normas contábeis mais\
    \ específicas, por meio da discussão de conceitos teóricos e de casos práticos.\
    \ Especificamente, a disciplina aborda os principais conceitos e critérios contábeis\
    \ para reconhecimento, mensuração e divulgação de propriedades para investimentos,\
    \ de investimentos societários em outras entidades e de combinação de negócios,\
    \ bem como para elaboração das demonstrações contábeis consolidadas e da Demonstração\
    \ do Valor Adicionado (DVA), além dos critérios para classificação e mensuração\
    \ de ativos não circulantes mantidos para venda e operações descontinuadas. Adicionalmente,\
    \ objetiva introduzir aspectos específicos da Contabilidade Aplicada ao Setor\
    \ Público.\nOBJETIVOS DE APRENDIZAGEM:\nEspera-se que, ao final da disciplina,\
    \ os alunos estejam aptos a:\n1.\tIdentificar e utilizar o tratamento contábil\
    \ adequado para reconhecimento, mensuração e divulgação de Propriedades para Investimento\
    \ (PPI).\n2.\tDistinguir entre os diferentes tipos de investimentos societários\
    \ (coligadas, negócios em conjunto e controladas) e aplicar os procedimentos contábeis\
    \ necessários para reconhecimento, mensuração e divulgação de cada um desses tipos\
    \ de investimentos.\n3.\tAplicar o método de equivalência patrimonial para mensuração\
    \ dos investimentos societários e avaliar o efeito de transações entre empresas\
    \ do mesmo grupo econômico no cálculo do resultado de equivalência patrimonial.\n\
    4.\tIdentificar a existência de investimentos em controladas e entender a importância\
    \ da elaboração de demonstrações contábeis consolidadas.\n5.\tAvaliar os principais\
    \ ajustes e eliminações que são necessários para elaboração de demonstrações contábeis\
    \ consolidadas.\n6.\tDistinguir e descrever as principais formas de reorganização\
    \ societária (aquisição e alienação de participações societárias, incorporação,\
    \ fusão e cisão de empresas).\n7.\tEntender a diferença entre combinação de negócios\
    \ entre entidades sob controle comum e entre partes independentes, bem como identificar\
    \ as diferenças nos procedimentos contábeis requeridos.\n8.\tAplicar o Método\
    \ de Aquisição para contabilização de combinação de negócios entre partes independentes,\
    \ conforme previsto pelo Pronunciamento Técnico CPC 15 (R1) – Combinação de Negócios.\n\
    9.\tAvaliar os critérios para reconhecimento, mensuração e divulgação de ativos\
    \ não circulantes classificados como mantidos para venda.\n10.\tAvaliar os critérios\
    \ para reconhecimento, mensuração e divulgação de operações descontinuadas\n11.\t\
    Compreender o conceito de valor adicionado e distinguir entre as perspectivas\
    \ contábil e econômica.\n12.\tElaborar e interpretar a Demonstração do Valor Adicionado\
    \ (DVA).\n13.\tIdentificar características das entidades do setor público e das\
    \ transações e eventos que a elas são típicos e que implicam em especificidades\
    \ quanto ao escopo das informações contábeis, seus usos e usuários."
