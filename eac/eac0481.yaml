  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina busca aprofundar os conhecimentos dos alunos na área de contabilidade
    financeira abordando normas contábeis mais específicas, por meio da discussão
    de conceitos teóricos e de casos práticos. Especificamente, a disciplina aborda
    os principais conceitos e critérios contábeis para reconhecimento, mensuração
    e divulgação de propriedades para investimentos, de investimentos societários
    em outras entidades e de combinação de negócios, bem como para elaboração das
    demonstrações contábeis consolidadas e da Demonstração do Valor Adicionado (DVA),
    além dos critérios para classificação e mensuração de ativos não circulantes mantidos
    para venda e operações descontinuadas. Adicionalmente, objetiva introduzir aspectos
    específicos da Contabilidade Aplicada ao Setor Público.

    OBJETIVOS DE APRENDIZAGEM:

    Espera-se que, ao final da disciplina, os alunos estejam aptos a:

    1. Identificar e utilizar o tratamento contábil adequado para reconhecimento,
    mensuração e divulgação de Propriedades para Investimento (PPI).

    2. Distinguir entre os diferentes tipos de investimentos societários (coligadas,
    negócios em conjunto e controladas) e aplicar os procedimentos contábeis necessários
    para reconhecimento, mensuração e divulgação de cada um desses tipos de investimentos.

    3. Aplicar o método de equivalência patrimonial para mensuração dos investimentos
    societários e avaliar o efeito de transações entre empresas do mesmo grupo econômico
    no cálculo do resultado de equivalência patrimonial.

    4. Identificar a existência de investimentos em controladas e entender a importância
    da elaboração de demonstrações contábeis consolidadas.

    5. Avaliar os principais ajustes e eliminações que são necessários para elaboração
    de demonstrações contábeis consolidadas.

    6. Distinguir e descrever as principais formas de reorganização societária (aquisição
    e alienação de participações societárias, incorporação, fusão e cisão de empresas).

    7. Entender a diferença entre combinação de negócios entre entidades sob controle
    comum e entre partes independentes, bem como identificar as diferenças nos procedimentos
    contábeis requeridos.

    8. Aplicar o Método de Aquisição para contabilização de combinação de negócios
    entre partes independentes, conforme previsto pelo Pronunciamento Técnico CPC
    15 (R1) – Combinação de Negócios.

    9. Avaliar os critérios para reconhecimento, mensuração e divulgação de ativos
    não circulantes classificados como mantidos para venda.

    10. Avaliar os critérios para reconhecimento, mensuração e divulgação de operações
    descontinuadas

    11. Compreender o conceito de valor adicionado e distinguir entre as perspectivas
    contábil e econômica.

    12. Elaborar e interpretar a Demonstração do Valor Adicionado (DVA).'
