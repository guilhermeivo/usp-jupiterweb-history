    4.1 Adequação de capital

    4.2 Índices de imobilização e endividamento

    4.3 Direcionamento de crédito e crescimento de carteiras

    4.4 Conceitos fundamentais de asset-liability management (ALM)

    4.5 Conceitos de controles internos e compliance'
  course_name: 'EAC0546 - Banking: Contabilidade e Gestão de Instituições Financeiras

    Banking: Accounting and Management of Financial Institutions'
  deactivation: ''
  instructors: '3596283 - Joanilia Neide de Sales Cia

    3132692 - Renê Coppe Pimentel'
  lecture_credits: '4'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina tem como objetivo (1) caracterizar as instituições financeiras e
    suas atividades, (2) apresentar as demonstrações contábeis dessas instituições
    com vistas a analisar suas operações e principais critérios contábeis vigentes,
    bem como (3) apresentar os principais conceitos de adequação de capital, gestão
    de ativos, passivos e resultados. O enfoque principal é dado para as instituições
    e operações bancárias.

    OBJETIVOS DE APRENDIZAGEM:

    A disciplina oferece uma visão abrangente e inicial dos principais temas relacionados
    contabilidade e gestão de instituições financeiras. Os temas estudados serão tratados
    de maneira conceitual e prática. Assim, espera-se que, ao final do curso, os alunos
    estejam aptos a:

    1. Diferenciar os diversos tipos de instituições financeiras, bem como as principais
    atividades desempenhadas por essas instituições;

    2. Identificar e diferenciar as práticas contábeis segundo o Cosif e as IFRSs;

    3. Descrever e contabilizar as principais operações das instituições financeiras;

    4. Analisar a composição dos principais itens do ativo e passivo e o desempenho
    financeiro de um período; e

    5. Determinar, descrever e implementar os principais aspectos de adequação de
    capital e gestão de ativos e passivos.'
  practical_credits: '0'
  total_workload: 60 h
