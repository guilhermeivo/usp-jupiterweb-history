  course: '1. INSTITUIÇÕES FINANCEIRAS E SUAS ATIVIDADES

    1.1 Tipos de instituições financeiras

    1.2 O Sistema Financeiro Nacional

    1.3 Principais atividades das instituições bancárias

    1.4 Operações ativas, passivas e serviços

    2. A CONTABILIDADE DAS INSTITUIÇÕES FINANCEIRAS

    2.1 COSIF – Objetivos, estrutura e vantagens

