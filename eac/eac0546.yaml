  course: '1. Estatuto do Sistema Financeiro Nacional

    2. Controles Internos-Compliance/Riscos (Aspectos Gerais)/Acordo da Basiléia

    3. A Contabilidade das Instituições Financeiras

    3.1. COSIF

    - Origem e Objetivos

    - Vantagens obtidas com a consolidação dos planos de contas

    3.2. Riscos de descasamento de prazo, moeda e taxa

    3.3. Estudo de caso: balanço de instituições com características diferentes

    4. Tópicos Especiais

    4.1. A apropriação de receita

    4.2. A provisão para risco de crédito

    4.3. Cessão de Crédito

    4.4. A essência sobre a forma

    - operações compromissadas

    - operações de arrendamento mercantil

    4.5.Estudo de Caso: estudo comparativo dos balanços de uma instituição privada
    e de uma instituição estatal

    5. Limites Operacionais

    5.1. Índices de Imobilização

    5.2. Índices de Endividamento

    5.3. Limitação ao crescimento de carteiras

    5.4. Direcionamento de Crédito

    6. Seguros, Capitalização e Saúde - Contabilização das operações e elaboração/discussão
    das respectivas demonstrações contábeis

    7. Entidades de Previdência Privada (Abertas e Fechadas) - Operações e elaboração/discussão
    das respectivas demonstrações contábeis

    8. Administradoras de consórcios. Operações e elaboração/discussão das respectivas
    demonstrações contábeis

    9. Fundos de Investimento (Renda Variável e Renda Fixa) - Operações e Elaboração/discussão
    das respectivas demonstrações contábeis'
  course_name: 'EAC0546 - Contabilidade de Instituições Financeiras

