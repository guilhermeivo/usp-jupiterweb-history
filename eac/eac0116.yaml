  course: 'PROGRAM

    1.THEORIES  AND PRACTICES IN INTERNATIONAL BUSINESS

    1.1 World of Business – Why study International Management

    1.2 International Management Topics: International Business;

    1.3 Why companies go international; players in international business;

    1.4 International Operations and Control Systems in Multinational Companies; SWOT
    and PEST models

    2.BRAZIL -  HISTORICAL, ETHNIC AND ECONOMIC FORMATION

    2.1 Geo-Politics of Brazil

    2.2 Historical, Cultural and Ethnic formation of Brazil

    2.3 Business in Colonial Period, Slavery in Brazil, Brazilian Empire, Brazil Republic:
    Old Republic, New Republic

    2.4 Development cycles in Historic  timeline;

    2.5 The Brazilian People – Ethnic formation – Immigration and cultural heritage.

    3.CROSS-CULTURAL  THEORIES IN INTERNATIONAL BUSINESS– BRAZILIAN NATIONAL AND BUSINESS
    CULTURE

    3.1 Cultural Challenge and Cross cultural Management

    3.2 Cross-Cultural Theories and Models – Trompenaars, Hofstede, Global

    3.3 Brazilian National Culture – Hofstede in Brazil – Interpretation of cultural
    dimensions in Management.

    3.4 Cross-cultural Adjustment Model  - International Manager training process

    3.5 Research in Business using cross-cultural Models – Consumers and Business
    culture in Brazil

    4.JURIDICAL AND REGULATORY SYSTEMS – BRAZILIAN AND  INTERNATIONAL REGULATIONS
    IN SOCIAL,  BUSINESS AND ECONOMIC

    4.1 World juridical systems – Coded Law, Common Law, Muslim Law, Customary Law

    4.2 Regulatory Systems in Brazil – Civil, Social and juridical systems

    4.3 Brazilian System Economic regulation – Accounting and Financial regulation
    -  Actors of Regulation

    4.4 Inequality reduction and Social Programs in Brazil.

    4.5 Ethics, transparency and corruption control in Brazil

    4.6 Regulatory system in Labor, Health, Education and Retirement – Last developments.

    4.7 Privatization Model adopted in Brazil – Regulatory Agencies

    5.DOING BUSINESS IN BRAZIL - MERCOSUL

    5.1 Social/ Economic view of Latin America and Brazil - The Mercosul

    5.2 Brazilian Economic position in world economy – The G20

    5.3 Brazil natural resources; Sustainability and  Last Economic Developments

    5.4 Brazil as a world exporter in Industry, services and agro-business

    5.5 Transnational and Multinational Companies in Brazil – Foreign and Brazilian
    Multinationals

    5.6 Vision of Opportunities for investments and FDI

    5.7 Doing Business in Brazil – Tax and Fiscal systems – Major ongoing changes
    in deregulation

    5.8 Opening a company in Brazil - Types of Business presence.

    5.8 Field trips to Companies in the Sao Paulo region – According to the availability
    for each semester.

    5.9 Group Analysis and Presentation of top Brazilian international companies'
  course_name: EAC0116 - International Management and Business in Brazil
  deactivation: ''
  instructors: 78286 - Edson Luiz Riccio
  lecture_credits: '2'
  objectives: "COURSE PRESENTATION\nThis course is fully delivered in English language\
    \ and is part of the internationalization strategic actions developed by the EAC,\
    \ FEA and USP. To attend this course students must be fluent in English, writing\
    \ and speaking.\nThis course aims to develop the understanding of the International\
    \ Management concepts applied to the Brazilian Business scenario, its culture,\
    \ political structure, agents and business regulation through a comparative and\
    \ cross cultural approach. Why study International Management and Business in\
    \ Brazil? Living and working in a globalized society requires that every student\
    \ be aware of the main issues taking place in the international business scenario\
    \ and the world economy today.\nLEARNING OBJECTIVES\nThis course offers a comprehensive\
    \ vision of International Business and Management theories and practices in the\
    \ world and in Brazil.  At the end of the course students are expected to be prepared\
    \ to:\n1.\tUnderstand the current world of business, its players and major challenges.\n\
    2.\tUnderstand and describe the importance of Brazil as part of the BRICS countries\
    \ and as a founder member of Mercosul in both Geo-Political and Economic issues.\n\
    3.\tLearn about the strategy followed by companies when they go international.\n\
    4.\tDescribe and analyze the several types of Business Alliances: M&A, Joint Ventures.\n\
    5.\tUnderstand the importance of National Cultures in international Business –\
    \ Cross Cultural Theories applied to Brazilian Business.\n6.\tUnderstand the main\
    \ world regulations (national and international) that affect International and\
    \ local Business.\n7.\tUnderstand and describe Brazilian Regulatory System (Juridical\
    \ Economic, Social, Tributary) and its effects on local business and in the  attraction\
    \ of  international investors to Brazil (FDI)\n8.\tUnderstand the concepts of\
    \ Ethics and corruption in business for both local and international scenario.\n\
    9.\tUnderstand and describe the business drivers that lead the Brazilian companies\
    \ in exportation of products and services.\n10.\tLearn how to develop a business\
    \ plan for a Brazilian company going abroad and for a foreign company entering\
    \ in Brazil.\n11.\tLearn about the most important aspects of being a successful\
    \ manager in multicultural and transnational companies."
