  course_name: EAC0173 - Logic and Programming in Business
  deactivation: ''
  instructors: 73235 - Edgard Bruno Cornacchione Junior
  lecture_credits: '2'
  objectives: 'Course Brief

    In a world of ever increasing data and information overload, organizations cannot
    afford to bypass strong and legitimate computational solutions to boost quality
    decision-making. Big data, business analytics, data mining, cloud services, distributed
    processing, or business intelligence are just examples of current topics. The
    interface between technical computing and business acumen has long been object
    of study, with both extremes yielding sound payoffs. However, greater payoff tends
    to be achieved with a blended approach (usually as a result of well-formed teams).
    In order to perform at the optimal level, team members must step into the “other”
    area (out of comfort zone). This course is designed to help students with little
    or no prior knowledge in computer programming, who are interested in learning
    about logic and programming in the object-oriented paradigm, using Python (a current
    and relevant language) and C (a powerful and imperative computer language).

    Course Goals and Learning Objectives

    In this course students will learn basic concepts in computer programming with
    emphasis on business. The goal is to help students experience a sound learning
    environment to develop programming skills in C and Python interacting with databases,
    to better perform in business.

    Upon successful conclusion of this course, students will be able to:

    1. Develop an attitude towards decision, information, data, systems, and computers,
    based on a critical view of the new business environment and intensified knowledge
    economy;

    2. Comprehend how problem-solving and data analytics evolved throughout time;

    3. Discuss programming in a stimulating fashion, beyond its mechanics, aiming
    at attracting even more talented people to this track;

    4. Analyze problems in light of object-oriented programming;

    5.Comprehend C and Python languages, including variables, expressions, files,
    flow statements, loop statements, functions, classes, methods, and modules;

    6. Comprehend database concepts and integration, SQL servers/clients, SQL statements;

    7. Apply solutions, mostly in Python, to solve statistical and graphical representation
    of datasets;

    8. Apply solutions, mostly in Python, to selected business problems.'
