  course: "1.\tA empresa rural e seu meio ambiente. Ecologia da empresa: As características\
    \ do homem do campo e o estilo de administração. A natureza e o ciclo de vida\
    \ dos ativos: nascimento crescimento e morte.\n2.\tAtividades Rurais. Agricultura,\
    \ reflorestamento, pecuária, agroindustrias, cultura temporárias e perenes. Ativos\
    \ (animais e vegetais) utilizados na atividade operacional e para vendas.\n3.\t\
    Aspectos contábeis e legais das atividades rurais. Manual de plano de contas,\
    \ comentários das contas, fluxogramas contábeis. Transações e contas especiais\
    \ das atividades rurais. Imposto de renda e principais tributos. Cooperativas.\n\
    4.\tAspectos de custos e preços. Organograma funcional e plano de centros de custos.\
    \ Custos fixos e variáveis, refinamento do cálculo das depreciações, amortizações\
    \ e exaustões. Alavancagem operacional e ponto de equilíbrio. Planejamento de\
    \ lucros e simulações. Break even-point na atividade rural. Fluxo de caixa prospectivo\
    \ das atividades rurais.\n5.\tRelatórios contábeis e análises de balanços das\
    \ atividades rurais. Reclassificações necessárias, análises por meio de coeficientes,\
    \ quadro clínico de análises, custo de capital e taxas de retorno, EVA e MVA,\
    \ valor da empresa. Desvendando o termômetro de insolvência de Kanitz. Reflexões\
    \ sobre a análise das atividades rurais.\n6.\tAnálises de projetos agrícolas.\
    \ O valor da terra e investimento marginal. Taxa de atratividade, TIR, VPL e payback.\
    \ Modelos ajustados de análises (TIRM, VPLM) e conciliação com as medidas contábeis\
    \ (ROI, EVA). Casos da citricultura e da cafeicultura.\n7.\tTópicos especiais,\
    \ algumas funções do Excel."
  course_name: 'EAC0517 - Contabilidade Rural

    Agricultural Accounting'
  deactivation: 30/01/2023
  lecture_credits: '2'
  objectives: Abordar conceitos e técnicas de contabilidade gerencial aplicáveis às
    atividades rurais (agrícolas, pecuárias e agroindustriais), proporcionando ao
    aluno uma visão prática do tratamento contábil e do processo de gestão econômica
    dessas atividades.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
