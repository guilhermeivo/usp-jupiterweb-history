  course: '1. Tributos incidentes sobre a Receita

    1.1. ISS – Imposto sobre Serviços de Qualquer Natureza:

    - conceito, lógica de tributação, cálculo e registro contábil

    1.2. ICMS – Imposto sobre Circulação de Mercadorias e Serviços:

    - conceito, lógica de tributação, cálculo e registro contábil

    1.3. IPI – Imposto sobre Produtos Industrializados:

    - conceito, lógica de tributação, cálculo e registro contábil

    1.4. PIS/PASEP – Programa de Integração Social/Programa de Formação do Patrimônio
    do Servidor Púbico e COFINS – Contribuição para o Financiamento da Seguridade
    Social:

    - conceito, lógica de tributação, cálculo e registro contábil

    2. Tributos sobre o Comércio Exterior

    2.1. II – Impostos sobre Importação e IE – Imposto sobre Exportação

    - conceito, lógica de tributação, cálculo e registro contábil

    2.2. ICMS, IPI, PIS/PASEP e COFINS na importação

    - lógica de tributação, cálculo e registro contábil

    3. Tributos incidentes sobre a Remuneração do Trabalho

    3.1. FGTS – Fundo de Garantia por Tempo de Serviço:

    - conceito, lógica de tributação, cálculo e registro contábil

    3.2. Contribuições Previdenciárias:

    - conceito, lógica de tributação, cálculo e registro contábil

    4. Tributos incidentes sobre o Patrimônio

    4.1. IPVA – Imposto sobre a Propriedade de Veículos Automotores

    - conceito, lógica de tributação, cálculo e registro contábil

    4.2. IPTU – Imposto Predial e Territorial Urbano

    - conceito, lógica de tributação, cálculo e registro contábil

    4.3. ITR – Imposto Territorial Rural:

    - conceito, lógica de tributação, cálculo e registro contábil

    5. Imposto sobre Operações de Crédito, Câmbio e Seguro, ou relativas a Títulos
    e Valores Mobiliários

    5.1. IOF – Imposto sobre Operações Financeiras:

    - conceito, lógica de tributação, cálculo e registro contábil

    6. Tributos incidentes sobre Lucros

    6.1. IR – Imposto de Renda e CSLL – Contribuição Social sobre o Lucro Líquido:

    - Regimes de tributação (Lucro Real, Presumido ou Arbitrado)

    - Períodos de apuração (trimestral, anual)

    - Vinculação com os regimes de apuração do PIS/PASEP e COFINS

    - Comparação entre os regimes de tributação

    6.2. Lucro Real

    - Principais adições, exclusões e compensações

    - LALUR – Livro de Apuração do Lucro Real

    - Recolhimento por estimativa ou suspensão/redução

    7. Sistemas de Tributação Simplificada

    7.1. SIMPLES NACIONAL'
  course_name: 'EAC0309 - Gestão e Planejamento Tributário

    Management and Tax Planning'
  deactivation: 31/12/2024
  instructors: '145440 - Alexsandro Broédel Lopes

    214113 - Carlos Alberto Pereira

    3330157 - Gustavo Gonçalves Vettori

    47785 - Massanori Monobe'
  lecture_credits: '4'
  objectives: '- Propiciar conhecimentos sobre os principais tributos que incidem
    sobre as atividades empresariais, bem como o registro dos seus respectivos impactos
    financeiros, econômicos e patrimoniais.

    - Oferecer uma visão estruturada sobre o processo de gestão de tributos na organização,
    envolvendo a identificação, análise e seleção das principais alternativas de tributação
    disponíveis na legislação vigente.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
