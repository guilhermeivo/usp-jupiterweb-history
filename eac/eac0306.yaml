  course: '1. Aspectos introdutórios

    1.1 Conceito de planejamento tributário

    1.2 Carga tributária

    1.3 Elisão x evasão fiscal

    1.4 História dos tributos no Brasil

    2. Noções gerais de Direito Tributário

    2.1 Atividade financeira do Estado

    2.2 Sistema Tributário Nacional

    2.3 Fontes do direito

    2.4 Vigência, aplicação, interpretação e integração da legislação tributária

    2.5 Princípios constitucionais tributários

    2.6 Administração tributária

    2.7 Processo judicial tributário

    3. Obrigação tributária

    3.1 Conceito

    3.2 Elementos da obrigação tributária

    3.3 Sujeitos da obrigação tributária

    3.4 Crédito tributário

    3.5 Tipos de lançamento

    3.6 Suspensão, extinção e exclusão do crédito tributário

    3.7 Obrigações tributárias não pecuniárias

    3.8 Conceito de tributo e suas classificações quanto à espécie, função e relação
    com o patrimônio e a renda das pessoas

    4. Visão geral dos principais tributos

    4,1 Tributos federais

    4.2 Tributos estaduais

    4.3 Tributos municipais'
  course_name: 'EAC0306 - Contabilidade e Legislação Tributária

    Accounting and Tax Legislation'
