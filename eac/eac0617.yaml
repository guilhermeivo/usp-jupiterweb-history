    a) A supplementary exam is allowed for students with a final grade equal or higher
    than 3,0 (three) and lower than 5,0 (five) and attendance of 70% (seventy percent)
    or higher

    b) Final grade, including grading of the supplementary exam, will be calculated
    through simple arithmetic average between the final grade prior to the supplementary
    exam and the grade obtained on the supplementary exam.'
