  objectives: 'Course Presentation

    The goal of the course is to help students understand and apply tools and techniques
    to analyze financial statements of companies based on an integrated analysis methodology
    that takes into account the Brazilian business environment and strategy.

    Learning objectives

    Upon successful conclusion of this course, students will be able to:

    Analyze and interpret the financial statements, aiming to extract information
    regarding the performance and the financial situation of companies.

    Interpret an entity''s economic and financial indicators and compare them with
    those of other companies or sectors.

    Guide their decision-making process through the analysis of financial statements.'
