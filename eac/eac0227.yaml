  course: 'Program

    1. INTRODUCTION TO FINANCIAL STATEMENTS ANALYSIS

    1.1. Types of analysis

    1.2. The role of financial information in the capital market

    1.3. From financial statements to business analysis

    2. THEORETICAL AND PRACTICAL ASPECTS OF THE MAIN TECHNIQUES OF ANALYSIS OF FINANCIAL
    STATEMENTS

    2.1. Analysis of the statements (strategic, accounting and financial)

    2.2. Analysis of the auditors'' report and management reports

    2.3. Accounting choices and effects on financial position and results

    3. TOOLS AND TECHNIQUES FOR FINANCIAL STATEMENT ANALYSIS

    3.1. Traditional analysis

    3.1.1. Vertical and horizontal analysis

    3.1.2. Analysis using key figures

    3.1.2.1 Liquidity, solvency and capital structure

    3.1.2.2 Profitability, margin and turnover

    3.1.2.3 Average activity and terms

    3.1.3. Working capital needs

    3.1.4. Financial leverage

    3.1.4.1. ROE - Return on equity

    3.1.4.2. ROA - Return on assets

    3.1.5. Du Pont Model (Integrated business performance evaluation model)

    3.1.6 EVA'
