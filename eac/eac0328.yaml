  lecture_credits: '4'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina tem como objetivo capacitar os estudantes em temas avançados de contabilidade
    societária, finalizando o ciclo obrigatório de disciplinas de contabilidade societária.

    OBJETIVOS DE APRENDIZAGEM:

    Espera-se que, ao final da disciplina, os alunos estejam aptos a:

    1. Identificar as situações, transações e/ou eventos econômicos abrangidos no
    escopo das normas tratadas nesta disciplina.

    2. Reconhecer os requerimentos normativos mais importantes relativos aos temas
    abordados nesta disciplina no tocante ao reconhecimento, mensuração e apresentação/divulgação
    abrangidas por essas normas.

    3. Aplicar os principais requerimentos das normas estudadas nesta disciplina a
    situações práticas.

    4. Relacionar os requerimentos das normas de contabilidade societária com os princípios,
    fundamentos, conceitos e definições da Estrutura Conceitual das normas.'
