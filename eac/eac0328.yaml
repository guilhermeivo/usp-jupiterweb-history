  course: '1.INSTRUMENTOS FINANCEIROS

    1.1 Classificação e Mensuração

    1.2 Reconhecimento e Desreconhecimento

    1.3 Redução ao Valor Recuperável – Impairment

    1.4 Contabilidade de Cobertura (Hedge Accounting)

    1.5. Apresentação e Divulgação

    2. POLÍTICAS CONTÁBEIS, MUDANÇAS DE ESTIMATIVA E RETIFICAÇÃO DE ERRO

    2.1 Políticas contábeis

    2.2 Mudanças de estimativas contábeis

    2.3 Retificações de Erros

    3. EVENTOS SUBSEQUENTES

    3.1 Definição

    3.2 Reconhecimento e mensuração

    3.2.1. Eventos que geram ajustes retroativos

    3.2.2 Eventos que não geram ajustes retroativos

    3.3 Tratamento de dividendos e continuidade

    3.4 Divulgação

    4. EFEITOS DA INFLAÇÃO NAS DEMONSTRAÇÕES CONTÁBEIS

    4.1. Impactos da inflação na mensuração e apresentação das demonstrações contábeis

    4.2. Requerimentos das normas contábeis para o tratamento da inflação e hiperinflação

    4.2. Outras ferramentas para elaboração de demonstrações contábeis em moeda de
    poder aquisitivo constante

    5. RECEITA DE CONTRATOS COM CLIENTES

    5.1. Escopo da norma de receita de contratos com clientes

    5.2 Reconhecimento

    5.2.1 Identificação, combinação e modificações de contratos

    5.2.2. Identificação e satisfação de obrigações de performance

    5.3. Mensuração

    5.3.1. Determinação do preço da transação de venda

    5.3.2. Alocação do preço às obrigações de performance

    5.3.3 Modificações no preço da transação

    5.4. Custos do Contrato

    5.5. Apresentação e Divulgação

    6. ASPECTOS TEÓRICOS DE ATIVOS, PASSIVOS, PL, RECEITAS E DESPESAS

    6.1. Principais aspectos teóricos da identificação, reconhecimento e mensuração
    de elementos patrimoniais e de desempenho

    6.1.1. Definições dos elementos: ativo, passivo, PL, receitas e despesas

    6.1.2. Critérios de reconhecimento e desreconhecimento

    6.1.3. Fundamentos teóricos de Mensuração

    6.1.3.1. Valores de Entrada

    6.1.3.2. Valores de Saída

    6.2. Conexão com elementos da Estrutura Conceitual das normas contábeis

    6.2.1. Objetivo dos relatórios financeiro-contábeis de uso geral

    6.2.2. Usuários dos relatórios financeiro-contábeis

    6.2.3. Definições, conceitos e princípios de identificação, reconhecimento, mensuração
    e desreconhecimento

    6.2.4. Princípios de Apresentação e Divulgação.'
