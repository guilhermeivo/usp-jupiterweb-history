  course: '1. IMPORTÂNCIA E OBJETIVOS DO JOGO, NO SENTIDO DE DESENVOLVER AS HABILIDADES
    PARA TOMAR DECISÕES, ANALISAR E INTERPRETAR OS RELATÓRIOS CONTÁBEIS GERADOS NO
    SIMULADOR

    1.1 Conceitos

    1.2 Relevância para o mercado

    1.3 Relevância para a academia

    1.4 Reflexões acerca de jogo e experiências inerentes

    2. REGRAS DO JOGO

    2.1 Estratégia do negócio e segmento de atuação

    2.2 Concorrência

    2.3 Indicadores (volume de vendas, Market share, receitas, lucros, custos, qualidade
    do produto, Lucro por ação, rating de crédito, ROE, preço das ações, Imagem)

    2.4 Objetivos, metas e desempenho

    2.5 Relatórios da empresa

    3. DEFINIÇÃO DAS EQUIPES

    3.1 Atribuições e responsabilidades

    3.2 Desempenho

    4. PRÁTICA ENVOLVENDO SIMULAÇÃO DE UMA EMPRESA

    4.1 Variáveis internas e externas, tais como taxas de juros, índice de crescimento
    econômico, inflação, sazonalidade, demanda, motivação e produtividade dos empregados,
    disponibilidade de mão de obra, qualidade dos produtos ou serviços prestados,
    necessidades de instalações, custos de produção, estocagem e depreciação, empréstimos,
    financiamentos, aplicação de recursos, investimentos em marketing, contrato com
    celebridades, investimento em pesquisa e desenvolvimento, preço de venda dos produtos
    e serviços,  logística internacional, entre outros

    4.2 Análise de cenários econômicos e organizacionais e seus respectivos dados
    e consequências, incluindo informações dos concorrentes

    4.3 Síntese das ideias e criação de soluções

    4.4 Avaliação do impacto de decisões de negócios e ações coletivas na condução
    da organização, considerando o ambiente de simulação

    4.5 Valorização da importância do processo de tomada de decisões com foco estratégico,
    especialmente na dimensão coletiva de reflexões e ações'
  course_name: 'EAC0580 - Jogos de Empresas

    Business Game'
  deactivation: ''
  instructors: '3767752 - Andson Braga de Aguiar

    73235 - Edgard Bruno Cornacchione Junior

    5859376 - Luciane Reginato Cornacchione'
  lecture_credits: '4'
  objectives: "APRESENTAÇÃO DA DISCIPLINA:\nA disciplina busca proporcionar a simulação\
    \ dos conceitos e das práticas contábeis inerentes à gestão empresarial, em uma\
    \ abordagem sistêmica. Procura-se demonstrar a aplicação prática dos conceitos\
    \ adquiridos ao longo do curso, possibilitando ao estudante que desenvolva a sua\
    \ capacidade como gestor.\nOBJETIVOS DE APRENDIZAGEM:\n1.\tPropiciar o reforço\
    \ de conceitos acerca do caráter sistêmico da organização, integrando os conhecimentos\
    \ adquiridos no curso;\n2.\tIncluir as variáveis do ambiente externo nas análises\
    \ e decisões gerenciais;\n3.\tMostrar a importância dos jogos de empresas como\
    \ estratégia na aprendizagem da gestão organizacional;\n4.\tDesenvolver o espírito\
    \ crítico, vital na tomada de decisão;\n5.\tAnalisar e interpretar relatórios\
    \ contábeis para fins de tomada de decisões;\n6.\tPossibilitar a prática de um\
    \ tomador de decisão, considerando a análise dos ambientes interno e externo,\
    \ e respeitando as regras institucionais;\n7.\tAplicar as habilidades voltadas\
    \ ao trabalho em equipe, envolvendo engajamento, ética, integração e comunicação;\n\
    8.\tEstimular a transposição da aprendizagem para solucionar diferentes tipos\
    \ de problemas profissionais; e\n9.\tInteragir com um sistema de negócio."
  practical_credits: '0'
