  course: 'Parte 1 – Previdência social: panorama geral e temas relevantes

    1. Experiência internacional

    2. Visão dos organismos internacionais

    3. Avaliação de sistemas previdenciários e indicadores previdenciários

    4. Mudanças demográficas e transferências intergeracionais

    Parte 2 – Modelos teóricos e aplicações à previdência social

    5. Fundamentos teóricos

    6. Artigos clássicos

    7. Modelos de escolha ótima de sistemas previdenciários

    8. Modelos atuariais de previsão de longo prazo.'
  course_name: 'EAC0556 - Tópicos Complementares de Previdência Social

    Advanced topics in Social Security'
  deactivation: ''
  instructors: 904700 - Luis Eduardo Afonso
  lecture_credits: '2'
  objectives: 'Esta disciplina é uma complementação de EAC0220 – Previdência Básica,
    com foco nos tópicos

    referentes à previdência social. O objetivo é apresentar aos alunos algumas referências
    clássicas

    sobre o tema, bem como alguns temas específicos e o estado das artes da literatura
    sobre sistemas

    previdenciários. Na parte inicial da disciplina são abordadas a experiência internacional,
    a visão e as

    recomendações de política dos organismos internacionais, como o Banco Mundial
    e a International

    Social Security Association. A seguir é feita uma análise comparativa do sistema
    previdenciário de

    alguns países. Também são estudados os tópicos relativos às mudanças demográficas
    e às

    transferências intergeracionais. Na segunda parte do curso são abordadas as referências
    conceituais

    e teóricas mais relevantes sobre previdência social, bem como alguns artigos considerados
    clássicos

    na área. O tópico final aborda os modelos atuariais de previsão de longo prazo.'
  practical_credits: '0'
  total_workload: 30 h
