  course_name: 'EAC0610 - Introdução à Programação e Banco de Dados em Negócios

    Introduction to Programming and Database in Business'
  deactivation: ''
  lecture_credits: '2'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    Este curso foi desenvolvido para ajudar alunos com pouco ou nenhum conhecimento
    prévio em programação de computadores, que estejam interessados em aprender sobre
    lógica e programação usando a linguagem Python (uma linguagem atual e relevante).
    Este curso aborda os princípios elementares de programação no Python, bem como
    o uso de biblioteca para apoiar atividades de análise

    Ciência de Dados. A disciplina também explora os fundamentos de banco de dados
    e o uso da linguagem SQL para consultas e manipulação de dados.

    OBJETIVOS DE APRENDIZAGEM:

    Neste curso os discentes aprenderão conceitos básicos de programação de computadores
    com ênfase em negócios. O objetivo é ajudar os alunos a vivenciarem um ambiente
    de aprendizagem sólido para desenvolver habilidades de programação (em especial,
    usando a linguagem Python) interagindo com bancos de dados, para melhor desempenho
    nos negócios.

    Espera-se que, ao final da disciplina, os discentes sejam capazes de:

    1. Desenvolver uma atitude face à decisão, à informação, aos dados, aos sistemas
    e aos computadores, baseada numa visão crítica do novo ambiente de negócios e
    da intensificação da economia do conhecimento;

    2. Compreender como a resolução de problemas e a análise de dados evoluíram ao
    longo do tempo;

    3. Discutir a programação de forma estimulante, além de sua mecânica, visando
    atrair ainda mais pessoas talentosas para esta pista;

    4.Compreender os princípios da linguagem de programação Python, incluindo variáveis,
    expressões, instruções condicionais, instruções de loop, funções, bem como utilizar
    as diversas bibliotecas de ciência de dados para apoiar a análise de dados.

    6. Compreender conceitos de banco de dados e instruções SQL;

    7. Elaborar consultas, estruturação e manipulação de banco de dados por meio da
    linguagem SQL;

    8. Utilizar a linguagem Python para resolver representações estatísticas e gráficas
    de conjuntos de dados;'
