  course_name: 'EAC0616 - Gênero e Raça na Educação Superior - Interseccionalidades
    em Organizações Diversas

    Gender and Race in Higher Education - Intersectionalities in Diverse Organizations'
  deactivation: ''
  lecture_credits: '2'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    Este curso contribui na formação discente ao apresentar como os marcadores sociais
    da diferença (raça e etnia, gênero e sexualidade, geração, classe social e deficiências
    em todas as suas dimensões) se relacionam com os ambientes organizacionais. As
    discussões sobre diversidade, equidades, inclusão e pertencimento têm se tornado
    cada vez mais frequentes e relevantes em uma sociedade em constante transformação
    social, econômica e tecnológica. Pessoas com seus diversos marcadores sociais
    têm alcançado espaços, reivindicando seus direitos e provocando a hegemonia até
    então predominante. A proposta desta disciplina foi construída baseada nas propostas
    de cursos de pós-graduação oferecidos pela professora Rebecca Ropers, da University
    of Minnesota e pelo professor David Carter,  da University of Canberra.

    OBJETIVOS DE APRENDIZAGEM:

    O objetivo geral é compreender criticamente os marcadores sociais da diferença,
    elaborando coletivamente provocações sobre o acesso de grupos dissidentes nos
    ambientes organizacionais e avaliar como esses atravessamentos influenciam os
    espaços ocupados pelos sujeitos, desde a sociedade, passando pelas instituições
    de ensino superior até organizações diversas.

    Nossa intenção é criar um ambiente seguro para a construção de um conhecimento
    compartilhado que envolve as temáticas relacionadas à DEIP em organizações diversas,
    e que permita o questionamento do papel social da administração nesse processo.'
