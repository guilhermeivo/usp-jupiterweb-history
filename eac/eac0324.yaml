  course: '1. Risco: características e classificação

    2. Risco & seguro

    3. Gerenciamento de risco

    4. Histórico do mercado segurador brasileiro

    5. Grupos e ramos de seguros

    6. Operações de seguros: visão geral, marketing, subscrição e sinistros

    7. Contrato de seguro: instrumentos, elementos e classificação

    8. Demanda por seguro

    9. Assimetria informacional e o mercado segurador

    10. Aspectos microeconômicos do seguro: restrição orçamentária, preferências,
    escolha

    determinista, escolha da quantidade ótima de seguro e escolha intertemporal

    11. Formação de preços: cálculo de prêmios de seguros

    12. Microsseguro

    13. Resseguro

    14. Fraudes

    Instrumentos e Critérios de Avaliação'
  course_name: 'EAC0324 - Teoria Geral das Operações de Seguros

    General Theory of Insurance Operations'
  deactivation: ''
  instructors: '8760796 - Ana Carolina Maia

    904700 - Luis Eduardo Afonso'
  lecture_credits: '4'
  objectives: 'A disciplina tem como objetivo abordar o referencial teórico inerente
    às operações de seguros.

    Inicialmente é apresentada a questão do risco e sua relação com a atividade seguradora.
    A seguir é

    feito um breve histórico do mercado segurador no Brasil e no mundo. Posteriormente
    são estudados

    os grupos e ramos de seguros, bem como as principais operações de seguros. Logo
    após são tratados

    os tópicos relativos contratos de seguros, e à demanda por seguros. Faz-se então
    a fundamentação

    conceitual da atividade seguradora, com ênfase nos aspectos referentes à assimetria
    de informação e

    à escolha individual (determinista, sob incerteza e intertemporal). Na sequência
    são estudadas

    técnicas de formação de preços por parte das empresas seguradoras. Finalizando
    são apresentados

    temas complementares como microsseguro, resseguro e fraudes.'
  practical_credits: '0'
  total_workload: 60 h
