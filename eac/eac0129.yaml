  activation: 01/01/2022
  assessment: 'a) O aluno poderá participar do processo de reavaliação (recuperação)
    na disciplina caso obtenha nota média final maior ou igual a 3,0 (três) e menor
    que 5,0 (cinco) e frequência igual ou superior a 70%.

    b) A média para aprovação com reavaliação será obtida por meio da média aritmética
    simples da média final + nota obtida na reavaliação, que deverá ser igual ou superior
    a 5,0 (cinco).'
  bibliography: 'BIBLIOGRAFIA PRINCIPAL:

    Hitt, M. A., Ireland, R. D., & Hoskisson, R. E. (2008). Administração estratégica:
    competitividade e globalização. São Paulo: Cengage Learning.

    Kaplan, R. S., & Norton, D. P. (1997). A estratégia em ação: balanced scorecard.
    Gulf Professional Publishing.

    Brickley, J. A., C. W. Smith, and J. L. Zimmerman. Managerial economics and organizational
    architecture. 5th edition

    BIBLIOGRAFIA COMPLEMENTAR:

    Zimmerman, J. L. (2011). Accounting For Decision Making and Control Seventh Edition.
    McGraw-Hill.

    McWatters, C., & Zimmerman, J. L.; & Morse, D., 2008. Management Accounting: Analysis
    and Interpretation.

    Garrison, N., Noreen, E. W., & Brewer, P. C. (2010). Managerial Accounting. Mc.
    Grow Hill.

    Anthony, R. N., & Govindarajan, V. (2007). Management control systems.'
  course: '1. CONTABILIDADE GERENCIAL E GOVERNANÇA EMPRESARIAL

    1.1 Governança Empresarial e Sistemas de Gestão de Desempenho

    1.2 Informação de Contabilidade Gerencial para Planejamento e Controle

    2. FORMULANDO E COMUNICANDO ESTRATÉGIAS

    2.1 Análise Estratégica do Ambiente

    2.2 Sistema de Valores e Proposição de Valor

    2.3 Comunicando e Alinhando a Estratégia

    3. ARQUITETURA ORGANIZACIONAL

    3.1 Atribuição de Direitos de Decisão

    3.2 Mensuração e Avaliação de Desempenho Divisional

    3.3 Preço de Transferência

    3.4 Mensuração e Avaliação de Desempenho Individual

    3.5 Esquemas de Remuneração e Remuneração de Executivos

    4. TÓPICOS ADICIONAIS'
  course_name: 'EAC0129 - Tópicos Avançados de Contabilidade Gerencial

    Advanced Topics in Management Accounting'
  deactivation: 31/12/2024
  instructors: '3767752 - Andson Braga de Aguiar

    8091887 - Daniel Magalhães Mucci

    5859376 - Luciane Reginato Cornacchione'
  lecture_credits: '4'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    Desenvolver as competências dos participantes relacionadas ao uso de informação
    contábil-gerencial para fins de mensuração e avaliação de desempenho de unidades
    organizacionais e gestores no ambiente organizacional.

    OBJETIVOS DE APRENDIZAGEM:

    Os objetivos específicos deste curso são o de prepará-lo para:

    1. Contribuir para o desenvolvimento e execução de princípios de governança;

    2. Contribuir para o desenvolvimento, implementação e análise da estratégia;

    3. Mensurar e avaliar o desempenho de unidades organizacionais e de gestores;
    e

    4. Contribuir para o desenho de esquemas de remuneração.'
  practical_credits: '0'
  total_workload: 60 h
