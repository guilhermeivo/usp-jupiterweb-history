  lecture_credits: '4'
  objectives: "APRESENTAÇÃO DA DISCIPLINA:\nProfissionais da área financeira são cada\
    \ vez mais demandados pelas organizações para assumirem papéis e tomarem decisões\
    \ que envolvem ambiente tecnológico e soluções digitais que se desenvolvem de\
    \ forma rápida em ambiente extremamente dinâmico. Nesta disciplina um olhar mais\
    \ dedicado é dado sobre os Sistemas de Informações Contábeis, seus usos e integrações\
    \ no ambiente corporativo, benefícios e desafios de projetos de implantação e\
    \ manutenção, bem como seu papel na elaboração de relatórios contábeis em atendimento\
    \ às demandas internas e externas. Aplicações práticas são exploradas. Ambiente\
    \ para fomentar o desenvolvimento de atitude e postura positiva e apreciativa\
    \ ao papel da tecnologia e dos sistemas na profissão é claramente oferecido. A\
    \ estratégia instrucional adotada esta pautada em visão mais ampla sobre os temas\
    \ e suas relações com as organizações e o profissional da área financeira, prevendo\
    \  oportunidades para discussões práticas e aplicações destes conceitos.\nOBJETIVOS\
    \ DE APRENDIZAGEM:\nOs participantes que concluírem exitosamente esta disciplina\
    \ estarão aptos a:\n1.\tDiscutir conceitos, características estruturação e funcionamento\
    \ de Sistemas de Informações Contábeis (SIC);\n2.\tDescrever processos de integração\
    \ de Sistemas de Informações Contábeis (SIC) com os demais sistemas de informações\
    \ de uma organização;\n3.\tAdotar visão sistêmica ao analisar os componentes da\
    \ organização;\n4.\tDemonstrar benefícios e desafios relacionados operacionalização\
    \ de Sistemas de Informações Contábeis (SIC) com uso de softwares específicos\
    \ adotados pelas organizações;\n5.\tComparar soluções tecnológicas relacionadas\
    \ aos Sistemas de Informações Contábeis (SIC), incluindo, por exemplo, ERP, EPM,\
    \ CRM, SPM, SCM, GRC, BI e SPED;\n6.\tIlustrar o processo de preparação de relatórios\
    \ financeiros e não-financeiros em ambiente tecnológico;\n7.\tInterpretar soluções\
    \ de governança;\n8.\tDescrever o processo de gestão de riscos e compliance;\n\
    9.\tAdotar postura positiva e apreciativa em relação ao uso de tecnologias para\
    \ otimização de Sistemas de Informações Contábeis (SIC)."
