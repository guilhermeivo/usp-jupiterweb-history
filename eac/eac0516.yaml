  lecture_credits: '2'
  objectives: '1. Levar os alunos a identificar e compreender os conceitos e princípios
    fundamentais de planejamento em geral e do orçamento empresarial em particular.

    2. Capacitar os alunos a relacionar os processos de planejamento, orçamento e
    controle.

    3. Levar os alunos a perceberam e valorizarem o planejamento e o controle financeiro
    ou de resultados e sua relação com as funções de Administração e Contabilidade.'
