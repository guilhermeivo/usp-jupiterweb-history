  course: '1. INTRODUÇÃO À AUDITORIA DE SISTEMAS DE INFORMAÇÃO

    1.1 Visão geral da Auditoria de Sistemas de Informação

    1.2 Atividades de uma Auditoria de Sistemas de Informação

    2. GOVERNANÇA CORPORATIVA EM SISTEMAS E TECNOLOGIA DE INFORMAÇÃO

    2.1 Controles da Alta Administração; no Desenvolvimento de Sistemas; em Programação;
    na Gestão de Dados; na Segurança; em Operações (TI); em Quality Assurance

    3. ESTRUTURA DOS CONTROLES GERENCIAIS E OS CONTROLES EM SISTEMAS DE INFORMAÇÃO

    3.1 Normas Nacionais e Internacionais em Auditoria de Sistemas

    3.2 Principais Padrões para Auditoria - COBIT

    3.3 Metodologia de Auditoria de Sistemas conforme as normas internacionais ISACA/COBIT

    3.4 Papel do gestor, natureza das funções desempenhadas, importância, etc

    3.5 Controles e segurança em Sistemas - Planos de Contingência em TI

    3.6 Controles e auditoria em hardware e software

    4. GESTÃO DA FUNÇÃO DE AUDITORIA DE SISTEMAS DE INFORMAÇÃO

    4.1 Visão geral sobre desenvolvimento e gerenciamento de sistemas e programas

    4.2 Palestras por Executivos da área de Auditoria de Sistemas.

    4.3 Apresentações de Softwares para Auditoria de Sistemas'
  course_name: 'EAC0120 - Auditoria de Sistemas de Informação

    Auditing of Information Systems'
  deactivation: ''
  instructors: 78286 - Edson Luiz Riccio
  lecture_credits: '2'
  objectives: "APRESENTAÇÃO DA DISCIPLINA:\nFornecer aos alunos conhecimentos básicos\
    \ sobre Auditoria e Controles de Sistemas de Informação, enfocando a estruturação\
    \ e implementação de procedimentos de auditoria em ambientes informatizados segundo\
    \ as normas internacionais ISACA/COBIT.\nA necessidade do conhecimento das técnicas\
    \ de Auditoria em Sistemas de Informação é devida ao crescente potencial da Tecnologia\
    \ de Informação (TI) em provocar mudanças nas organizações e nas práticas de negócio.\
    \ Como consequência, há a necessidade do estudo sobre o projeto de implementação\
    \ de estruturas de controle interno e o desenvolvimento sistemático do processo\
    \ de auditoria em todos os aspectos dos Sistemas e da Tecnologia de Informação.\n\
    OBJETIVOS DE APRENDIZAGEM:\nEspera-se que, ao final da disciplina, as(os) estudantes\
    \ estejam aptos a:\n1.\tEstruturar e implementar de procedimentos de auditoria\
    \ em ambientes informatizados.\n2.\tCompreender e aplicar as normas internacionais\
    \ ISACA/COBIT.\n3.\tCompreender o processo de implementação de estruturas de controle\
    \ interno.\n4.\tAplicar o desenvolvimento sistemático do processo de auditoria\
    \ em todos os aspectos dos Sistemas e da Tecnologia de Informação"
  practical_credits: '0'
  total_workload: 30 h
