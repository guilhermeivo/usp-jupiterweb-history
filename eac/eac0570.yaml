  objectives: Compreender e aplicar diversos modelos de avaliação de empresas baseados
    em informações contábeis, com base em uma metodologia integrada de análise que
    leva em conta o ambiente e a estratégia empresarial, a análise da qualidade da
    informação contábil produzida e a análise financeira.
