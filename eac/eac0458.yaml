  course: '1. FUNDAMENTOS DE ADMINISTRAÇÃO FINANCEIRA

    1.1 As principais decisões financeiras e a função objetivo da empresa

    1.2 Gestão Baseada no Valor

    1.3 Separação entre propriedade e controle e princípios de governança corporativa

    2. DECISÕES FINANCEIRAS DE LONGO PRAZO

    2.1 Decisões de investimento e dimensionamento dos fluxos de caixa

    2.2 Métodos de avaliação econômica de projetos

    2.3 Decisões de Investimento em Condições de Risco

    2.4 Orçamento de Capital: identificação, avaliação e selecionação de investimentos
    de longo prazo

    2.5 Custo de capital e criação de valor

    2.6 Fontes de financiamento a longo prazo no Brasil e decisões de estrutura de
    capital

    2.7 Teorias de estrutura de capital e políticas de dividendos

    2.8 Análise dos diferentes formatos de tributação

    3. DECISÕES FINANCEIRAS DE CURTO PRAZO

    3.1 Ferramentas para gestão do capital de giro

    3.2 Investimento em capital de giro

    3.3 Financiamento do capital de giro

    4. TRIBUTAÇÃO

    4.1 Tributos incidentes sobre a Receita

    4.2 Tributos incidentes sobre o Patrimônio

    4.3 Imposto sobre Operações de Crédito, Câmbio e Seguro, ou relativas a Títulos
    e Valores Mobiliários

    4.4. Tributos incidentes sobre Lucros

    5. Valuation

    5.1. Análise das demonstrações financeiras

    5.2. Projeção de fluxos de caixa

    5.3. Cálculo do WACC.

    5.4. Modelo de múltiplos.'
  course_name: 'EAC0458 - Finanças Corporativas para Ciências Atuariais

    Corporate Finance for Actuarial Science'
  deactivation: ''
  instructors: '8476037 - Eduardo da Silva Flores

    3132692 - Renê Coppe Pimentel'
  lecture_credits: '2'
  objectives: A disciplina busca apresentar e discutir os conceitos teóricos e questões
    práticas que envolvem as decisões financeiras tomadas pelas empresas no processo
    de gestão, captação de recursos, bem como a gestão de riscos financeiros de curto
    e longo prazos. Além disso, aspectos de tributação e valuation também são abordados.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
