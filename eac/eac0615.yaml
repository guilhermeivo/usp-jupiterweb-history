  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina é voltada para alunos que já possuam conhecimentos em contabilidade
    tributária e busca aprofundar tais conhecimentos explorando tópicos avançados
    relacionados à tributação e contabilidade. Todos estes tópicos têm em comum, de
    um lado, as influências recíprocas entre os tratamentos contábil e tributário
    e, de outro, a necessidade de ajustes, para fins tributários, em relação aos registros
    feitos na contabilidade. Além disso, todos os tópicos envolvem condutas e estratégias
    complexas de planejamento tributário. Trazem, assim, problemas complexos cuja
    solução carece de ferramentas e habilidades avançadas a serem desenvolvidas. Cada
    um dos temas é estruturado de maneira didática para facilitar a sua compreensão,
    sendo que a sua aplicação se dará por meio de casos concretos a serem desenvolvidos
    ao longo do curso.

    OBJETIVOS DE APRENDIZAGEM:

    A disciplina realizará aprofundamento em temas avançados de tributação, oferecendo
    uma visão estruturada sobre cada um destes temas e trabalhando a sua aplicação
    a casos concretos complexos. Ao final do curso, espera-se que os alunos estejam
    aptos a:

    1. Lidar com questões contábeis complexas que geram relevantes impactos tributários,
    sendo capazes de realizar os ajustes necessários à realidade contábil, conforme
    as regras aplicáveis a cada um dos temas analisados.

    2. Identificar, mensurar e evidenciar de forma adequada os impactos patrimoniais
    de ajustes e posições tributárias relacionadas a cada um dos temas analisados.

    3. Aplicar estratégias e técnicas de planejamento tributário a situações complexas,
    sendo capaz de analisar alternativas, riscos e benefícios em cada uma das situações
    analisadas.

    4. Lidar com casos envolvendo questões contábeis e tributárias complexas, sendo
    capaz de desenvolver soluções e expô-las oralmente e por escrito.'
