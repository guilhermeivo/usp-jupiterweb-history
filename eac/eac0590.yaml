  course: "PARTE 1 – Fundamentação teórica\n1.\tRevisão de teoria do consumidor"
  course_name: 'EAC0590 - Tópicos de Economia Comportamental Aplicados à Atuária

    Topics of Behavioral Economics Applied to Actuarial Science'
  deactivation: ''
  instructors: 904700 - Luis Eduardo Afonso
  lecture_credits: '2'
  objectives: O objetivo da disciplina é apresentar as principais aplicações da Economia
    Comportamental às Ciências Atuariais. Desde a revolução gerada pelo trabalho fundamental
    de Kahneman & Tversky (1979), é consensual que as decisões dos indivíduos podem
    ser influenciadas por fatores cognitivos, emocionais e sociais. Isto se aplica
    particularmente às decisões em condições de risco, campo pertinente às Ciências
    Atuariais. Desta maneira, esta disciplina complementa a formação dos estudantes
    de Ciências Atuariais, ao fornecer as ferramentas para o estudo das decisões individuais.
    Visa-se aprimorar a compreensão dos determinantes da demanda e do processo de
    tomada de decisão em diversos mercados e contextos, incluindo previdência social
    e complementar, saúde e os produtos dos mercados segurador e financeiro. A disciplina
    também apresenta elementos ligados aos nudges, arquitetura de escolhas e aplicações
    às políticas públicas.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
