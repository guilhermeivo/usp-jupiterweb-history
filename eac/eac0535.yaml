  course: '- Principais Códigos no Brasil:CVM, BOVESPA/NOVO MERCADO e IBGC

    - Principais Códigos no exterior: IFAC, OECD e ISAR

    - O que divulgar: requisitos da Lei das S.A.e da SNC/SEP da CVM

    - Como divulgar: essência sobre forma, e o conceito de "true and fair view"

    - Fatores legais e culturais: "Common Law" x "Civil Law", impacto de sistemas
    educacionais e da organização do mundo corporativo

    - "Sites" de empresas brasileiras com ADR´s em negociação em NY - estudo de casos
    em formulários "20-F"'
  course_name: 'EAC0535 - Governança Corporativa

    Corporate Governance'
  deactivation: ''
  instructors: 59962 - Luiz Nelson Guedes de Carvalho
  lecture_credits: '2'
  objectives: '1) Fornecer subsídios ao entendimento do papel da Governança Corporativa
    no mundo empresarial atual, vendo-a como um "conjunto de mecanismos de incentivo
    e controle que visam harmonizar a relação entre acionistas e gestores pela redução
    dos custos de agência, numa situação de separação da propriedade e controle".

    2) Explicitar o "estado da arte" em termos de códigos ou normas de Governança
    Corporativa editados por entidades especializadas e de reputação nessa matéria
    - governamentais ou não - no Brasil e no mundo

    3) Ressaltar a percepção da relevância da comunicação e divulgação empresariais
    na redução do custo de capital da firma

    4) Destacar a importância e as técnicas em uso para divulgação de informações
    de natureza econômico-financeira e contábil, de desempenho operacional e das ações
    da empresa voltadas à responsabilidade social - conceito de "para quem, o que
    e como divulgar"'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
