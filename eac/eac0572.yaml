  objectives: "APRESENTAÇÃO DA DISCIPLINA:\nO curso é desenhado para auxiliar estudantes\
    \ com pouco ou nenhum conhecimento em História da Contabilidade, que tenham interesse\
    \ em aprender sobre momentos importantes e cruciais na História da Contabilidade\
    \ e seu papel na sociedade. Como metodologia de aprendizagem serão utilizados\
    \ vídeos, leitura de textos, testes (quizzes) e, eventualmente, o jogo DEBORAH.\
    \ Para aumentar o conhecimento na área, os participantes produzirão textos curtos\
    \ e irão avaliar textos de seus pares. Quando terminar esse curso terá uma visão\
    \ geral da História da Contabilidade para entender melhor como a Contabilidade\
    \ se desenvolveu ao longo do tempo e como chegou aos dias de hoje.\nOBJETIVOS\
    \ DE APRENDIZAGEM:\nO objetivo é que o estudante experimente ambiente educacional\
    \ apropriado para formação de opinião, com visão crítica, e aparelhamento técnico\
    \ para atuar de forma mais apropriada na área de contabilidade.\nCom a conclusão\
    \ exitosa do curso, os alunos serão capazes de\n•\tDesenvolver visão crítica sobre\
    \ a relação entre a contabilidade e a sociedade ao longo do tempo.\n•\tFavorecer\
    \ o aprendizado de como a Contabilidade se desenvolveu ao longo dos vários períodos\
    \ históricos.\n•\tApresentar a Contabilidade de forma estimulante, para além dos\
    \ seus aspectos mecânicos, visando atrair mais pessoas talentosas para essa carreira\
    \ profissional.\n•\tOferecer um contexto para o conteúdo técnico que os estudantes\
    \ costumam aprender em cursos de graduação, apresentando as situações em que se\
    \ desenvolveram conceitos utilizados atualmente na Contabilidade.\n•\tApresentar\
    \ uma visão introdutória da História da Contabilidade, visto que há pouco material\
    \ disponível na língua portuguesa a esse respeito."
