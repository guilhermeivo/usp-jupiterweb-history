  course: '1. INTRODUÇÃO À HISTÓRIA DA CONTABILIDADE OBJETIVOS EDUCACIONAIS

    Ao concluir as atividades de forma exitosa o participante será capaz de:

    -Reconhecer os quatro períodos históricos da Contabilidade segundo Melis.

    -Relacionar o papel do escriba com o de um contador na antiguidade.

    -Compreender a Contabilidade antes da existência de sistemas numéricos atuais
    e da escrita atual com base em alfabeto.

    -Descrever um processo de registro de transações de negócios, milênios antes de
    Cristo.

    -Demonstrar atitude positiva em relação ao estudo da História da Contabilidade.

    Sumário: Participantes serão apoiados para construção de contexto com a ambientação
    na Mesopotâmia (lugar, cidades, contribuição e contabilidade). Discussão sobre
    práticas administrativas em Uruk (3500 e 2900 AC) será estabelecida pelo Prof.
    Grof (convidado), assim como algumas referências para questões ligadas ao conceito
    de Estoques, naquela época. Discussão sobre empréstimos à época será estabelecida.
    Aspectos de troca e moeda assim como escambo serão objeto de reflexão. Por fim,
    participantes poderão ser convidados a jogarem a primeira fase do DEBORAH, atuando
    como um escriba na Mesopotâmia, referente aos temas estudados. Na segunda parte
    desta sessão, estudantes serão levados a reflexão sobre os sete elementos de Littleton
    e relações com as partidas dobradas. Ainda nesta sessão, teremos a participação
    especial do Prof. Schmidt (autor de tese pioneira sobre História da Contabilidade
    aqui no Brasil). Materiais de apoio e leitura serão indicados para complementar
    estudos.

    2. SISTEMA DE CONTABILIZAÇÃO POR CARGA E DESCARGA OBJETIVOS EDUCACIONAIS

    Ao concluir as atividades de forma exitosa o participantes será capaz de:

    -Reconhecer a existência do sistema de Carga e Descarga.

    -Discutir sobre a relação entre Contabilidade e Religião.

    -Listar 3 (três) características do sistema de contabilidade por carga e descarga.

    -Demonstrar atitude positiva em relação ao sistema de Carga e Descarga.

    Sumário: Será apresentado o método de carga e descarga, pouco conhecido entre
    os próprios contadores. As professoras Rodrigues e Gomes (de Portugal) farão participação
    especial compartilhando seus conhecimentos a respeito do tema, notadamente o sistema,
    suas características e regiões em que foi utilizado. Participantes poderão ser
    convidados a jogar outra fase do DEBORAH, com base em contabilidade por carga
    e descarga, que se passa em um monastério feminino português do final do século
    XVIII e início do XIX. O professor Oliveira participará como convidado destacando
    aspectos da ligação histórica entre Contabilidade e Organizações Religiosas Cristãs.
    Exemplos serão apresentados sobre este método. Materiais de apoio e leitura serão
    indicados para complementar estudos.

    3. AS PARTIDAS DOBRADAS (PRÉ-PACIOLI) OBJETIVOS EDUCACIONAIS

    Ao concluir as atividades de forma exitosa o participantes será capaz de:

    -Reconhecer a existência de outros sistemas contábeis, anteriores às Partidas
    Dobradas.

    -Discutir os aspectos do desenvolvimento das Partidas Dobradas na Roma Antiga,
    no Antigo Egito e China.

    -Discutir sobre a contribuição dos Templários para a Contabilidade.

    -Listar os sete elementos conforme propostos por Littleton.

    -Demonstrar atitude positiva em relação aos sistemas alternativos às Partidas
    Dobradas.

    Sumário: Sistemas alternativos às partidas dobradas serão discutidos. Aspectos
    sobre o desenvolvimento das partidas dobradas na Roma Antiga e no Antigo Egito
    serão expostos. Também será abordado o seu desenvolvimento em outras regiões,
    como Itália no período renascentista, China, além de comentários sobre a Índia.
    Reflexão sobre os Templários será feita. Tendo por base o artigo de Littleton
    (1927) – The antecedents of double-entry – serão retomados os sete elementos necessários
    para o surgimento das partidas dobradas. Participantes poderão ser convidados
    a jogar a fase do DEBORAH ambientada em Florença do século XIV, em que o objetivo
    do jogador é explorar o cenário da época tentando localizar os sete elementos
    mencionados no texto de Littleton. Ao final da sessão serão abordados desenvolvimentos
    na Milão, Gênova e Florença, assim como referência a Luca Pacioli e a Summa de
    Arithmetica, Geometria proportioni et propornalità. Materiais de apoio e leitura
    serão indicados para complementar estudos.

    4. LUCA PACIOLI E A SUMMA DE ARITHMETICA, GEOMETRIA PROPORTIONI ET PROPORNALITÀ

    Ao concluir as atividades de forma exitosa o participantes será capaz de:

    -Reconhecer o sistema de partidas dobradas como proposto por Pacioli.

    -Compreender o papel da da “Summa” para a Contabilidade.

    -Discutir a influência das Partidas Dobradas nos negócios.

    -Explicar a disseminação das Partidas Dobradas no Brasil, via Companhias Pombalinas.

    -Demonstrar atitude positiva em relação à contribuição de Luca Pacioli para a
    Contabilidade Moderna.

    Sumário: Atenção será dada a Luca Pacioli e a Summa de Arithmetica, Geometria
    proportioni et propornalità. Será estabelecida reflexão sobre como o registro
    da descrição do sistema contábil por partidas dobradas em um livro possibilitou
    a padronização de um modelo passível de ser reproduzido em vários países, colaborando
    para sua adoção por toda a Europa, até o século XIX. Será apresentado também tópico
    sobre as escolas de comércio em Portugal. A Professora Vasconcelos, doutoranda
    da FEA/USP, irá compartilhar o caso das Companhias Pombalinas e seu papel na disseminação
    das partidas dobradas no Brasil. Materiais de apoio e leitura serão indicados
    para complementar estudos.

    5. CONTABILIDADE CONTEMPORÂNEA

    Ao concluir as atividades de forma exitosa o participantes será capaz de:

    -Reconhecer a relação entre Contabilidade e avanços sociais como escrita e sistemas
    numéricos.

    -Interpretar o papel da Contabilidade no tocante à sua responsabilidade social.

    -Compreender a influência da Contabilidade no Capitalismo.

    -Definir a Contabilidade como Linguagem dos Negócios e como Alicerce de Confiança.

    -Demonstrar atitude positiva em relação às oportunidades para os profissionais
    da Contabilidade.

    Sumário: Trataremos da Contabilidade no mundo contemporâneo. Reflexões sobre a
    evolução do papel da contabilidade na sociedade, com ênfase para informação contábil,
    decisões, regulação, auditoria, riscos e consequências desejadas e indesejadas
    do estágio atual de desenvolvimento. Poderá ser disponibilizada aos participantes
    a fase do jogo digital Deborah Game que aborda o papel do contador na sociedade,
    ambientada na Austrália, e desenvolvida com base no artigo de Hines (1988) – Financial
    accounting: In communicating reality, we construct reality. Materiais de apoio
    e leitura serão indicados para complementar estudos.'
