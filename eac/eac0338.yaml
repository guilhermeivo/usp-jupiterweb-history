  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    No decorrer do estudo das normas internacionais de relatórios financeiros, alguns
    temas merecem atenção específica por basicamente duas razões: (i) serem conceitos
    verificáveis em mais de um normativo simultaneamente, portanto da necessidade
    de serem estudados de forma multidisciplinar; e (ii) se tratarem de assuntos mais
    avançados cujo conhecimento de temas básicos e intermediários facilitarão a sua
    compreensão.

    Nesse contexto, esta disciplina visa apresentar temas específicos avançados que
    possibilitarão uma compreensão mais ampla da contabilidade financeira.

    OBJETIVOS DE APRENDIZAGEM:

    Espera-se que, ao final da disciplina, os alunos estejam aptos a:

    1. Identificar as situações, transações e/ou eventos econômicos abrangidos no
    escopo das normas tratadas nesta disciplina.

    2. Reconhecer os requerimentos normativos mais importantes relativos aos temas
    abordados nesta disciplina no tocante ao reconhecimento, mensuração e apresentação/divulgação
    abrangidas por essas normas.

    3. Aplicar os principais requerimentos das normas estudadas nesta disciplina a
    situações práticas.'
