  course_name: 'EAC0413 - Gestão de Riscos, Governança e Compliance

    Risk Management, Governance, and Compliance'
  deactivation: ''
  instructors: '8476037 - Eduardo da Silva Flores

    1035522 - Guillermo Oscar Braunbeck

    3079831 - Lucas Ayres Barreira de Campos Barros

    3132692 - Renê Coppe Pimentel'
  lecture_credits: '4'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina oferece uma introdução à análise e gestão de riscos, incluindo sua
    interação com as estratégias e sistemas de governança das organizações. Também
    apresenta arcabouços modernos para a mensuração de riscos e para a implementação
    de sistemas voltados para controles internos e para o gerenciamento integrado
    de riscos empresariais.

    OBJETIVOS DE APRENDIZAGEM:

    Espera-se que, ao final do curso, os alunos estejam aptos a:

    1. Distinguir e descrever as diferentes abordagens para conceituar o risco e classificar
    as fontes de risco;

    2. Descrever o conceito moderno de gestão estratégica de riscos e os tipos fundamentais
    de risco;

    3. Explicar a lógica do Value-at-Risk (VaR) e suas implicações para a gestão de
    riscos;

    4. Resolver problemas básicos e intermediários aplicando o VaR a ativos individuais
    e a carteiras de ativos;

    5. Explicar o problema fundamental da governança corporativa;

    6. Distinguir e Descrever os principais mecanismos e modelos de governança corporativa
    e suas limitações;

    7. Descrever o arcabouço COSO para controles internos;

    8. Reconhecer e explicar as interações entre sistemas de governança e sistemas
    de gerenciamento de riscos;

    9. Explicar o conceito de gestão integrada de riscos; e

    10. Avaliar a adequação de diferentes sistemas de gerenciamento de riscos.'
