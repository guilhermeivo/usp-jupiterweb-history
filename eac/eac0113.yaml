  course: '1. Introdução.

    2. A contabilidade de seguradoras e de entidades abertas de previdência complementar
    (EAPC):

    planos de contas, procedimentos e práticas contábeis aceitas.

    • Plano de contas e a dinâmica contábil das entidades seguradoras e de previdência
    complementar

    aberta.

    • Registro dos principais eventos e transações contábeis das entidades seguradoras
    e de previdência

    complementar aberta.

    • A apuração do resultado das entidades seguradoras e de previdência complementar
    aberta.

    • Principais impostos incidentes sobre as operações das empresas seguradoras e
    de previdência

    complementar aberta: contabilização e registro.

    • Contabilização de cosseguro, resseguro e retrocessão.

    3. As provisões técnicas e as normas prudenciais.

    • O cálculo de capital mínimo e sua relação com o patrimônio líquido ajustado
    e Solvência II.

    • O cálculo do limite de retenção dos riscos e sua relação com os riscos que podem
    ser subscritos.

    • Contabilização das principais provisões técnicas.

    • Os ativos garantidores e suas principais regras.

    • Elaboração do teste de adequação de passivos (TAP).

    4. A contabilidade das entidades fechadas de previdência complementar (EFPC):
    planos de contas,

    procedimentos e práticas contábeis aceitas:.

    • Plano de contas e a dinâmica contábil das entidades fechadas de previdência
    complementar.

    • As demonstrações obrigatórias.

    • O conceito de patrimônio social.

    • As principais provisões técnicas e sua relação com o equilíbrio técnico das
    entidades fechadas de

    previdência complementar.

    • O ativo líquido e a gestão das obrigações atuariais e do patrimônio de cobertura.

    6. Principais técnicas para a avaliação econômica e financeira das entidades de
    seguro e de

    previdência complementar.'
  course_name: 'EAC0113 - Contabilidade de Instituições Seguradoras e de Previdência
    Complementar

    Insurance Accounting'
  deactivation: 31/12/2024
  instructors: '8476037 - Eduardo da Silva Flores

    3596283 - Joanilia Neide de Sales Cia

    1364179 - Mara Jane Contrera Malacrida'
  lecture_credits: '4'
  objectives: 'Fornecer ao aluno instrumental técnico e conceitual necessário para
    a contabilização e análise das

    demonstrações financeiras das instituições seguradoras e de previdência complementar.
    Ao final do

    curso, o aluno deverá conhecer as formas de contabilização e os principais indicadores
    econômicos,

    financeiros e atuariais relativos a essas instituições e que possibilitem uma
    análise mais adequada da

    situação econômica, financeira e atuarial dessas entidades.'
  practical_credits: '0'
  total_workload: 60 h
