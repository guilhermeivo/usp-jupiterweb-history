  course: "Os tópicos serão de certa maneira determinados pelas necessidades particulares\
    \ e interesses dos participantes; mas, incluirão trabalhar em:\n1.\tIDENTIFICANDO\
    \ E APLICANDO HABILIDADES DE LEITURA: PRATICANDO A LEITURA E INTERPRETAÇÃO DE\
    \ TEXTOS ACADÊMICOS\n2.\tIDENTIFICANDO E APLICANDO AS HABILIDADES DE ESCRITA:\
    \ EXERCITANDO A ESCRITA ACADÊMICA\n3.\tDESENVOLVENDO HABILIDADES DE PESQUISA E\
    \ DE RECUPERAÇÃO DE INFORMAÇÕES EM BASES DE DADOS E PESQUISA\n4.\tAPROFUNDANDO-SE\
    \ NA LEITURA E ANÁLISE DE TEXTOS CIENTÍFICOS\n4.1. Textos seminais\n4.2. Artigos\
    \ de revisão\n4.3. Ensaios teóricos\n4.4. Estudos teórico-empíricos\n5.\tELABORANDO\
    \ UMA PROPOSTA DE PESQUISA\n5.1. O que é pesquisa?\n5.2. Etapas de uma pesquisa.\n\
    5.2.1. Escolhendo um tema ou problema.\n5.2.2. Revisando a literatura.\n5.2.3.\
    \ Planejando a metodologia.\n5.2.4. Estruturando um cronograma de pesquisa\n6.\t\
    ABORDAGENS DE PESQUISA - CLASSIFICAÇÕES DAS PESQUISAS\n6.1. Abordagem qualitativa\n\
    6.2. Abordagem quantitative\n7.\tMETODOLOGIAS DE PESQUISA\n7.1. Pesquisa qualitativa\
    \ básica\n7.2. Pesquisa de Arquivo\n7.3. Pesquisa Documental\n7.4. Pesquisa de\
    \ Levantamento\n8.\tMÉTODOS DE PESQUISA\n8.1. Planejamento, realização e análise\
    \ de entrevistas\n8.2. Planejamento, elaboração, aplicação e análise de questionários\n\
    8.3. Planejamento, realização e análise de observações\n9.\tAPRESENTADO E AVALIANDO\
    \ UMA PROPOSTA DE PESQUISA\n9.1. Elaborando e apresentando um projeto de pesquisa,\
    \ de forma oral e escrita\n9.2. Avaliando e oferecendo sugestões em um projeto\
    \ de pesquisa"
