  objectives: "APRESENTAÇÃO DA DISCIPLINA:\nEste curso foi planejado e desenhado para\
    \ reforçar a competência e confiança dos/as participantes como aprendizes autônomos/as\
    \ e como produtores de conhecimento. Para isso, é construído a partir de percurso\
    \ composto por um conjunto de atividades de aprendizagem, em uma sequência lógica\
    \ e de complexidade crescente, relacionada com a competência de planejar, elaborar,\
    \ implementar projetos de pesquisa em temáticas relacionadas à contabilidade,\
    \ controladoria, finanças e educação e pesquisa em contabilidade. Portanto, inicialmente\
    \ a disciplina se desenvolve com foco no processo de pesquisa, mas visando a conclusão\
    \ desse projeto em produtos, como monografias e/ou artigos, que possam ser disseminados\
    \ em eventos e revistas acadêmicas, alimentando, dessa forma, o ciclo de geração\
    \ e construção de conhecimento científico.\nOBJETIVOS DE APRENDIZAGEM:\nA disciplina\
    \ tem como objetivos gerais:\n•\tCriar um ambiente seguro que nos permita compreender\
    \ como cada pessoa aprende;\n•\tApoiar cada participante a experimentar diferentes\
    \ enfoques e competências de aprendizagem;\n•\tIncentivar cada participante a\
    \ identificar e exercitar suas habilidades intelectuais de forma a aumentar sua\
    \ curiosidade acadêmica;\n•\tCapacitar os/as alunos/as a realizar reflexões críticas\
    \ acerca da produção científica na área de Ciências Contábeis;\n•\tCapacitar os/as\
    \ alunos/as a realizar estruturar, elaborar e propor projetos de pesquisa em contabilidade;\
    \ e\n•\tCapacitar os/as alunos/as a analisar, criticar e discutir projetos de\
    \ pesquisa em contabilidade de forma contributiva."
  practical_credits: '1'
  total_workload: 60 h
