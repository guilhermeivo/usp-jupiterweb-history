  assessment: 'REEVALUATION CRITERIA

    a) The student can make a reassessment exam in the course if he / she obtains
    a final average grade greater than or equal to 3.0 (three) and less than 5.0 (five)
    and frequency equal to or greater than 70%.

    b) The grade for approval with reassessment will be obtained through the simple
    arithmetic average of the final average + grade obtained in the reassessment,
    which must be equal to or greater than 5.0 (five).'
