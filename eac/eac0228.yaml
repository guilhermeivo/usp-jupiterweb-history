  objectives: 'COURE OVERVIEW:

    EAC0228 has been designed to develop your competencies in the area of Performance
    Management Systems. More broadly, this course has also been designed with the
    aim of preparing you for a career as a professional accountant.

    LEARNING OBJECTIVES:

    Performance management systems (PMSs) include performance evaluation and reward
    schemes used by organizations for motivating employees and achieving key objectives
    and goals. The specific objectives of this course are to prepare you to: (a) link
    strategic priorities to performance measurement, (b) measure and evaluate divisional,
    team and individual performance; and (c) contribute to the design of reward schemes.'
