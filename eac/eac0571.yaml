  objectives: "APRESENTAÇÃO DA DISCIPLINA:\nA disciplina tem por objetivo proporcionar\
    \ aos alunos uma experiência simulada (numa situação hipotética em que os papéis\
    \ são vividos pelos alunos, tal como na realidade) de aplicação de determinadas\
    \ normas contábeis brasileiras em vigor (convergentes com as IFRS’s emitidas pelo\
    \ IASB - International Accounting Standards Board), em situação de conflito ou\
    \ incerteza acerca de sua aplicabilidade, por meio das estratégias de ensino role\
    \ playing e PBL-Problem Based Learning, permitindo aos alunos compreender o comportamento\
    \ social nas organizações, o seu papel enquanto profissional contábil nas interações\
    \ sociais e formas de resolver problemas e conflitos de uma forma mais eficaz.\
    \ O cumprimento desses objetivos se dará por meio de estudos de caso nos quais\
    \ cada aluno assume um papel (Gerente Contábil ou Diretor Financeiro, por exemplo),\
    \ de forma que os alunos possam experimentar (de forma simulada) a resolução de\
    \ problemas contábeis envolvendo situações de conflito em temas multidisciplinares,\
    \ com as quais se pretende desenvolver habilidades cognitivas, afetivas e comportamentais.\
    \ O método de role playing permite induzir os participantes à compreensão rápida,\
    \ possibilita a troca de conhecimentos entre os alunos (intra e inter grupo) e\
    \ permite transformar conceitos teóricos em um formato experimental.\nOBJETIVOS\
    \ DE APRENDIZAGEM:\nObjetiva-se preparar os alunos a interpretar e aplicar normas\
    \ contábeis, em especial as normas internacionais de contabilidade já convertidas\
    \ em pronunciamentos do CPC – Comitê de Pronunciamentos Contábeis, bem como capacitar\
    \ os alunos na aplicação dessas normas em situações de conflito por meio das estratégias\
    \ de ensino role playing e PBL-Problem Based Learning, visando a proporcionar\
    \ aos alunos melhor compreensão sobre o seu papel enquanto profissional contábil\
    \ nas interações sociais  nas organizações e formas de resolver problemas e conflitos\
    \ de uma forma mais eficaz. Objetiva ainda desenvolver habilidades para organizarem\
    \ e sistematizarem a informação, desenvolver relações com os outros profissionais\
    \ e aperfeiçoar as suas próprias capacidades sociais e profissionais.\nEspera-se\
    \ que, ao final da disciplina, os alunos estejam melhor preparados para:\n1.\t\
    Interpretar e aplicar normas contábeis em situações de conflito, em especial determinadas\
    \ normas internacionais de contabilidade já convertidas em pronunciamentos do\
    \ CPC – Comitê de Pronunciamentos Contábeis cuja aplicabilidade a determinado\
    \ caso concreto (hipotético) não está clara ou requer análises não triviais;\n\
    2.\tCompreender o seu papel enquanto profissional contábil nas interações sociais\
    \ dentro das organizações e desenvolver relações com os outros profissionais,\
    \ visando aperfeiçoar suas próprias capacidades sociais e profissionais;\n3.\t\
    Organizar e sistematizar a informação contábil considerando usuários e/ou decisores\
    \ com diferentes visões e graus de conhecimentos em contabilidade; e\n4.\tBuscar\
    \ a resolução de problemas e conflitos contábeis de uma forma mais eficaz, entendendo\
    \ as consequências contábeis de cada solução aplicável ao caso."
