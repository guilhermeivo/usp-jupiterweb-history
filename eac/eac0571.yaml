  course: '1. INTRODUÇÃO À DISCIPLINA E PLANEJAMENTO DAS ATIVIDADES

    1.1. Introdução à Disciplina com a apresentação e discussão do programa.

    1.2. Apresentação das Estratégias de Ensino adotadas (Role Playing e PBL - Problem
    Based Learning).

    1.3. Apresentação dos temas contábeis a serem tratados nos casos de ensino e dos
    personagens que os alunos interpretarão.

    1.4. Discussão das regras de conduta.

    1.5. Levantamento das habilidades e perfis dos alunos para posterior formação
    dos grupos, distribuição dos casos para os grupos e designação dos papeis a cada
    aluno, pelo professor.

    2. DISTRIBUIÇÃO E DISCUSSÃO PRELIMINAR DOS CASOS

    2.1. Atribuição, pelo professor, de um caso para cada grupo.

    2.2. Breve relato dos casos designados (com a oferta de pistas acerca dos conflitos
    centrais e de pesquisas que serão necessárias (sobre a temática do caso, normas
    contábeis aplicáveis, possíveis soluções etc.)

    3. ATENDIMENTO AOS GRUPOS NO PERÍODO DE PESQUISA/RESOLUÇÃO DOS CASOS DE ENSINO

    3.1. Acompanhamento do andamento das pesquisas e desenvolvimento da resolução
    dos casos.

    3.2. Acompanhamento de como cada aluno vem atuando dentro do seu personagem.

    3.3. Atendimento dos grupos em sala de aula, buscando orientar os alunos a alcançarem
    por esforço próprio a solução mais apropriada ao caso, identificando potenciais
    consequências.

    4. RELATÓRIOS, DEBATES E DISCUSSÕES

    4.1. Definição dos grupos que atuarão como “auditor” do caso a ser apresentado;

    4.2. Coleta dos relatórios dos grupos (grupo do caso e grupo auditor designado
    ao caso) e planejamento das apresentações (pelo grupo do caso), debates (grupo
    que atuará como auditor após a apresentação e, depois pelo plenário de alunos
    enquanto participante interessado no caso, acerca situação simulada apresentada)
    e dos questionamentos e comentários do professor.

    4.3. Apresentações da solução de cada caso pelos grupos, seguidos dos debates
    (grupo auditor e plenário de alunos) e dos comentários do professor (pontos fortes
    e fracos na resolução construída, contrapondo os comentários do grupo auditor
    e demais alunos da sala).

    4.4. Discussão dos resultados da disciplina na visão dos alunos (feedback acerca
    da disciplina e das estratégias de ensino), das lições aprendidas e das habilidades
    desenvolvidas (habilidades cognitivas, afetivas e comportamentais)'
  course_name: 'EAC0571 - Tópicos de Contabilidade Societária

    Financial Accounting Topics'
