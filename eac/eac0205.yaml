  course: '1. Terminologia aplicada à custos: investimentos, despesas, custos, perdas,
    gastos e desembolsos.

    2. Classificação de custos e despesas quanto à sua relação com os produtos: custos
    e despesas diretos e indiretos

    3. Classificação de custos e despesas quanto à sua relação com o volume de produção
    e com a receita: custos e despesas fixos e variáveis

    4. Custeio por Absorção Parcial

    5. Custeio Pleno (Custeio Integral)

    6. Custeio Variável

    7. Margem de Contribuição

    8. Relações Custo-Volume-Lucro

    9. Custeio Baseado em Atividades (ABC) e Gestão Baseada em Atividades (ABM)

    10. Custo Padrão

    11. Formação de Preço de Venda'
  course_name: 'EAC0205 - Custos para Decisão e Controle

