  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina busca apresentar e discutir os conceitos teóricos e questões práticas
    que envolvem conceitos, ferramentas e técnicas de custos destinados à geração
    e utilização de informações de custos como instrumento de apoio gerencial ao processo
    de tomada de decisão, planejamento e controle nas organizações.

    OBJETIVOS DE APRENDIZAGEM:

    A disciplina oferece uma visão abrangente e prática dos principais temas relacionados
    à análise de custos. Os temas estudados serão tratados de maneira conceitual e
    prática. Assim, espera-se que, ao final do curso, os alunos estejam aptos a:

    1. Descrever, distinguir e comparar os principais métodos de custeio (custeio
    por absorção, custeio pleno e custeio variável);

    2. Aplicar os conceitos relacionados à cada método de custeio em casos e exercícios
    práticos;

    3. Compreender e aplicar o custeio direto no processo de tomada de decisões;

    4. Conhecer os conceitos e abordagens do Custeio Baseado em Atividades (ABC);

    5. Entender os conceitos de custeio variável e margem de contribuição e aplicá-los
    nas relações de custo-volume-lucro, particularmente o cálculo do ponto de equilíbrio,
    da margem de segurança e do grau de alavancagem operacional;

    6. Compreender o reflexo da teoria das restrições em decisões de custos a partir
    da aplicação do conceito de margem de contribuição por fator limitante;

    7. Distinguir as diferentes abordagens de definição de preços de venda e aplicar
    os conceitos markup em decisões de precificação de produtos/serviços;

    8. Compreender os conceitos de custo de oportunidade, custos afundados e custos
    relevantes, e aplicá-los em decisões de terceirização de atividades, aceitação
    de pedido especial e de (des)continuidade de operações;

    9. Descrever o conceito de custo-padrão e aplicar técnicas de análise de variação
    de custos (materiais, mão de obra de custos indiretos de fabricação) para o processo
    de planejamento e controle.'
