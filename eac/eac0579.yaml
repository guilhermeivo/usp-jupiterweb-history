  course: '1. BANCO DE DADOS: IMPORTÂNCIA DO TRATAMENTO E ANÁLISE

    1.1 Visão geral: tipos de variáveis e escalas de mensuração

    1.2 Estatística descritiva

    1.3 Distribuições de probabilidades

    2. TESTES DE HIPÓTESE E INTERVALOS DE CONFIANÇA

    2.1 Testes paramétricos

    2.2 Testes não paramétricos

    3. FERRAMENTAS DE ANÁLISE MULTIVARIADA PARA TOMADA DE DECISÃO

    3.1. TÉCNICAS DE INTERDEPENDÊNCIA

    3.1.1 Análise de clusters

    3.1.2 Análise de correspondência (ANACOR)

    3.1.3 Análise fatorial

    3.2 TÉCNICAS DE DEPENDÊNCIA

    3.2.1 Generalized linear models (GLM)

    3.2.2 Regressão linear e não-linear simples e múltipla

    3.2.3 Diagnósticos em modelos de regressão

    3.2.4 Regressão logística binária e multinomial

    3.2.5 Modelos de regressão para dados de contagem

    4. PESQUISA OPERACIONAL

    4.1 Programação linear e não linear

    4.2 Programação inteira e binária

    4.3 Modelos de otimização'
  course_name: 'EAC0579 - Análise de Dados para Tomada de Decisão

