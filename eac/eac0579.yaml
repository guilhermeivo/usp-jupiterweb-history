  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina tem como objetivo principal capacitar os alunos para o entendimento
    e compreensão de diversas técnicas exploratórias e confirmatórias de análise multivariada,
    com enfoque para suas aplicações e na geração de informação para tomada de decisões
    em contabilidade, atuária e finanças. O conteúdo a ser discutido considera aspectos
    relacionados à elaboração, tratamento e análise de bancos de dados. O intuito
    é que o aluno adquira conhecimentos e habilidades sobre gerenciamento e tratamento
    de dados, por meio de discussão de conceitos e análise de bancos de dados em sessões
    de laboratório com aplicação prática de softwares como SPSS, Stata, R, dentre
    outros.

    OBJETIVOS DE APRENDIZAGEM:

    Espera-se que, ao final do curso, os alunos estejam aptos a:

    1. Compreender os objetivos e aplicações das diversas técnicas exploratórias e
    confirmatórias de análise multivariada;

    2. Identificar situações favoráveis para o uso do instrumental quantitativo adquirido;

    3. Conhecer as premissas e limitações do uso das diversas técnicas;

    4. Elaborar, tratar e analisar diferentes tipos de bancos de dados;

    5. Extrair informação relevante para tomada de decisões financeiras a partir do
    tratamento e análise de bancos de dados; e

    6. Aplicar o instrumental quantitativo à análise de problemas gerenciais abordados
    pelos sistemas de informações empresariais, presentes no processo de planejamento,
    execução e controle das decisões nas empresas.'
