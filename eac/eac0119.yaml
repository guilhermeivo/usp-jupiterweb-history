  course: "1.\tVISÃO SISTÊMICA DA EMPRESA E DOS SUBSISTEMAS EMPRESARIAIS\n1.1.\tA\
    \ empresa como um sistema aberto e dinâmico\n1.2.\tEficiência, eficácia e continuidade\n\
    1.3.\tSubsistemas empresariais: institucional, social, organizacional, físico-operacional,\
    \ de gestão e informações\n2.\tCONCEITUAÇÃO DO RESULTADO ECONÔMICO\n2.1. Eficácia\
    \ e resultado econômico\n2.2. Mensuração econômica de ativos, passivos e patrimônio\
    \ líquido\n3.\tMISSÃO E FUNÇÕES DA CONTROLADORIA SOB A ÓTICA DA GESTÃO ECONÔMICA\n\
    3.1.\tMissão da controladoria\n3.2.\tFunções, atividades e responsabilidades\n\
    3.3.\tFilosofia de atuação\n4.\tPROCESSO DE GESTÃO EMPRESARIAL\n4.1.\tPlanejamento\
    \ estratégico\n4.2.\tPré-planejamento operacional\n4.3.\tPlanejamento operacional\
    \ de longo, médio e curto prazos\n4.4.\tExecução\n4.5.\tControle\n5.\tESTRUTURA\
    \ CONCEITUAL DO SISTEMA DE INFORMAÇÕES DE GESTÃO ECONÔMICA\n5.1.\tSistema de informações\
    \ sobre variáveis ambientais; sistema de simulação; sistema orçamentário; sistema\
    \ de mensuração do realizado; sistema de avaliação de desempenhos\n5.2.\tModelos\
    \ de decisão; mensuração; identificação e acumulação; informação\n6.\tMENSURAÇÃO\
    \ ECONÔMICA DO RESULTADO DE EVENTOS\n6.1.\tEventos pontuais e tempo-conjunturais\n\
    6.2.\tMargem operacional e margem financeira\n6.3.\tEventos de compras, estocagem,\
    \ produção, vendas etc.\n7.\tMENSURAÇÃO ECONÔMICA DE INVESTIMENTOS\n7.1.\tMargem\
    \ do investimento\n7.2.\tMargem da aquisição\n7.3.\tMargem do financiamento\n\
    8.\tAVALIAÇÃO DE DESEMPENHO ECONÔMICO\n8.1.\tModelo orçamentário: orçamento original,\
    \ orçamento corrigido, orçamento ajustado, realizado padrão e real\n8.2.\tAnálise\
    \ de variações: inflação, ajustes de planos, volume, eficiência e total"
