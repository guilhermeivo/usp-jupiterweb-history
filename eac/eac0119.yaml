  objectives: "APRESENTAÇÃO DA DISCIPLINA:\nA disciplina apresenta e discute conceitos\
    \ teóricos e questões práticas da gestão econômica e do processo de tomada de\
    \ decisões no âmbito empresarial, abordando os principais aspectos relacionados\
    \ à identificação, mensuração e geração de informações econômicas de eventos,\
    \ atividades, unidades de negócios e empresa. Além de apresentar e discutir conceitos\
    \ teóricos, procura-se demonstrar a sua aplicação prática ao processo decisório\
    \ das empresas por meio de exercícios e estudos de casos.\nOBJETIVOS DE APRENDIZAGEM:\n\
    A disciplina busca capacitar os alunos no que diz respeito à compreensão dos aspectos\
    \ conceituais da gestão econômica e sua aplicação ao processo de tomada de decisões\
    \ no âmbito empresarial. Para tanto, oferece uma visão abrangente sobre os principais\
    \ temas da gestão econômica, proporcionando qualificação conceitual e prática\
    \ no sentido do entendimento e desenvolvimento de sistemas de informações para\
    \ identificação, mensuração e geração de informações econômicas de eventos, atividades,\
    \ unidades de negócios e da empresa como um todo. Espera-se que, ao final do curso,\
    \ os alunos estejam aptos a:\n1.\tEntender e caracterizar a empresa e os subsistemas\
    \ empresariais sob a ótica sistêmica;\n2.\tEntender o conceito de resultado econômico\
    \ e os principais aspectos relacionados à sua mensuração;\n3.\tEntender o papel,\
    \ as funções e as principais atividades e responsabilidades da controladoria sob\
    \ o enfoque da gestão econômica;\n4.\tDescrever e caracterizar o processo de gestão\
    \ empresarial e cada uma das etapas que o compõem;\n5.\tEntender a estrutura conceitual\
    \ do sistema de informações de gestão econômica;\n6.\tAplicar os conceitos econômicos\
    \ na mensuração dos resultados de eventos, atividades, áreas de negócios e empresa;\n\
    7.\tAplicar os conceitos econômicos na mensuração dos resultados de investimentos;\n\
    8.\tAnalisar as variações orçamentárias no contexto da avaliação de desempenho\
    \ econômico."
