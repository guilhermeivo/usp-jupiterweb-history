  bibliography: 'Azapagic, A. (2003). Systems approach to corporate sustainability:
    a general management framework. Process Safety and Environmental Protection, 81,
    303-316.

    Dyllick, T., & Hockerts, K. (2002). Beyond the business case for corporate sustainability.
