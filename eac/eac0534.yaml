  course_name: 'EAC0534 - Controladoria e Governança na Gestão Pública

    Controller and Governance in Public Management'
  deactivation: ''
  instructors: 1818911 - Valmor Slomski
  lecture_credits: '2'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina introduzir os alunos em conhecimentos de controladoria aplicáveis
    à gestão de entidades públicas de direito público interno (União, Estados, Distrito
    Federal, Municípios, autarquias e as demais entidades públicas criadas por lei)
    e, bem assim, aquilo que couber, à gestão das entidades de direito privado (associações,
    fundações, organizações religiosas e partidos políticos).

    OBJETIVOS DE APRENDIZAGEM:

    Ter uma visão crítica diante demandas vigentes, no que refere a minimização da
    assimetria informacional entre o Estado e a sociedade.

    Espera-se que, ao final da disciplina, os alunos estejam aptos a:

    1. Compreender evolução da Contabilidade e da Contabilidade Pública brasileira.;

    2. Compreender o papel da Controladoria e do Controller na Administração Pública;

    3. Avaliar o papel da sociedade, do Estado e entender a teoria do agente na relação
    sociedade-estado;

    4. Reconhecer as entidades públicas, estudar os diversos tipos de externalidades
    existentes na relação sociedade-estado e compreender o problema do risco moral
    existente na relação sociedade-estado;

    5. Entender o processo de planejamento e reconhecer os principais instrumentos
    de utilizados nesse processo;

    6. Refletir sobre os recursos públicos existentes para o desenvolvimento da coisa
    pública;

    7. Compreender os conceitos de contabilidade de custos aplicados às entidades
    públicas;

    8. Entender o valor do serviço público;

    9. Observar a produção de valor gerada pela coisa pública;

    10. Compreender a importância da publicação do Balanço Social em entidades públicas;

    11. Discutir objetivos e princípios de governança na gestão pública.'
