  course_name: 'EAC0582 - Tópicos de Tecnologia nos Negócios

    Technology Topics in Business'
  deactivation: ''
  instructors: '73235 - Edgard Bruno Cornacchione Junior

    990725 - Joshua Onome Imoniana'
  lecture_credits: '4'
  objectives: "APRESENTAÇÃO DA DISCIPLINA:\nProfissionais da área financeira são cada\
    \ vez mais demandados pelas organizações para assumirem papéis e tomarem decisões\
    \ que envolvem ambiente tecnológico e soluções digitais que se desenvolvem de\
    \ forma rápida em ambiente extremamente dinâmico. Nesta disciplina um olhar mais\
    \ dedicado é dado sobre tópicos específicos e muito relevantes para o profissional\
    \ da área de negócios, como bancos de dados, segurança de dados, programação de\
    \ computadores, processos robotizados e cognitive computing. A estratégia instrucional\
    \ adotada esta pautada em visão mais ampla sobre os temas e suas relações com\
    \ as organizações e o profissional da área financeira, porém prevendo aplicações\
    \ destes conceitos.\nOBJETIVOS DE APRENDIZAGEM:\nOs participantes que concluírem\
    \ exitosamente esta disciplina estarão aptos a:\n1.\tDiscutir elementos de processos\
    \ de negócios à luz da transformação digital\n2.\tDiscutir elementos de segurança\
    \ de dados e criptografia\n3.\tDescrever processos de automação robótica (RPA)\n\
    4.\tDemonstrar o processo armazenamento e recuperação de dados apoiado em bancos\
    \ de dados\n5.\tComparar soluções tecnológicas de Cognitive Computing\n6.\tDemonstrar\
    \ o processo programação de computadores"
  practical_credits: '0'
  total_workload: 60 h
