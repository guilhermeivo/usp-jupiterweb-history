  course_name: 'EAC0577 - Planejamento, Orçamento e Controle Social na Gestão Pública

    Planning, Budget and Social Control in Public Management'
  deactivation: ''
  instructors: 3549898 - Patrícia Siqueira Varela
  lecture_credits: '4'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    O Plano Plurianual, a Lei de Diretrizes Orçamentárias e a Lei Orçamentária Anual,
    bem como a gestão de sua execução, são elementos centrais na consecução dos objetivos
    da gestão pública, assim como para a prestação de contas e responsabilização (accountability)
    dos gestores públicos e, consequentemente, para o controle social. Nesse sentido,
    um dos grandes desafios que se apresenta é como relacionar informações financeiras
    – orçamentárias ou não – e não financeiras para subsidiar as análises e julgamentos
    por diferentes usuários, inclusive os cidadãos, no exercício do controle social.
    Assim, esta disciplina, concebida no âmbito do Centro de Estudos em Contabilidade
    e Governo (ContGov), busca propiciar aos participantes instrumentais conceituais
    e técnicos sobre o processo de planejamento e orçamento e a administração financeira
    e orçamentária necessários à accountability, bem como o suporte para o desenvolvimento
    de soluções/tecnologias para o exercício do controle social.

    OBJETIVOS DE APRENDIZAGEM:

    Espera-se que, ao final da disciplina, os participantes estejam aptos a:

    1. Identificar características das entidades do setor público e das transações
    e eventos que a elas são típicos e que implicam em desafios quanto ao planejamento
    e orçamento, à gestão orçamentária e financeira e ao controle social.

    2. Identificar e caracterizar lacunas quanto ao exercício do controle social na
    gestão pública que envolvam aspectos orçamentários e financeiros.

    3. Analisar dados financeiros e não financeiros referentes ao planejamento e orçamento
    e à sua execução para fins de proposição de soluções/tecnologias para o controle
    social.

    2. Aplicar princípios, fundamentos, conceitos e definições da literatura sobre
    planejamento, orçamento e gestão orçamentária e financeira na proposição de soluções/tecnologias
    para o controle social.

    4. Elaborar um modelo conceitual de solução/tecnologia para o controle social
    que envolvam aspectos orçamentários e financeiros.'
