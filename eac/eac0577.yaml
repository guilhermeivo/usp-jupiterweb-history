  course_name: 'EAC0577 - Planejamento, Orçamento e Controle Social na Gestão Pública

    Planning, Budget and Social Control in Public Management'
  deactivation: ''
  instructors: 3549898 - Patrícia Siqueira Varela
  lecture_credits: '4'
  objectives: 'O objetivo central desta disciplina é propiciar aos participantes instrumentais
    conceituais e técnicos sobre o processo de planejamento e orçamento e execução
    orçamentária necessários à accountability e, consequentemente, ao controle social
    no contexto da gestão pública brasileira.

    Os instrumentos de planejamento e orçamento, bem como a gestão de sua execução,
    são elementos centrais na consecução dos objetivos da gestão pública, assim como
    para a prestação de contas e responsabilização (accountability) dos gestores públicos
    e, consequentemente, para o controle social. Neste sentido, um dos grandes desafios
    que se apresenta é como relacionar informações financeiras – orçamentárias ou
    não – e não financeiras para subsidiar as análises e julgamentos por diferentes
    usuários, inclusive os cidadãos, no exercício do controle social. Portanto, a
    relevância desta disciplina está em preparar os participantes para analisar criticamente
    as informações financeiras ou não financeiras decorrentes ou relacionadas à gestão
    orçamentária e financeira das entidades da gestão pública brasileira.'
