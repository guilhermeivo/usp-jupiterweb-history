    ministrante.
  course: A natureza da disciplina impede que se tenha um programa resumido definido
    previamente. A cada semestre de oferta o conteúdo será apresentado pelo professor
    ministrante.
  course_name: 'EAC0560 - Estudos Complementares III

    Complementary Studies III'
  deactivation: ''
  instructors: 3770882 - Marcio Luiz Borinelli
  lecture_credits: '2'
  objectives: 'Possibilitar ao estudante a prática de estudos e atividades independentes,
    transversais, opcionais de interdisciplinaridade, especialmente ligadas ao mundo
    do trabalho, e com ações de extensão junto à comunidade.

    Discutir conteúdos emergentes na área de formação do estudante, não contemplados
    nas disciplinas obrigatórias ou em disciplinas livres oferecidas pelo Departamento
    de Contabilidade e Atuária.'
