  course: '1 Introdução à Tecnologia no contexto da Auditoria e Assurance

    1.1 Conceitos Elementares e caraterísticas da Auditoria e Assurance

    1.2 Contexto de evolução tecnológica e sua aplicação em negócios

    1.3 Controles Internos, Avaliação dos procedimentos de Controle e Análise de Risco.

    1.4 Papel das Tecnologias da Informação no apoio às práticas de Auditoria e Assurance.

    1.5 Benefícios e desafios do emprego das tecnologias

    1.6 Competências Tecnológicas do profissional de auditoria

    2 Introdução às Técnicas de Auditoria Assistidas por Computador (TAAC)

    2.1 Definição das Técnicas de Auditoria Assistidas por computador

    2.2 Ferramentas de Apoio: Softwares Generalistas e Especializados de Auditoria
    (ex: ACL, IDEA, Galileo)

    2.4 Avaliação dos benefícios e desafios relacionados a aplicação das TAACs

    3. Análise de Dados em Auditoria

    3.1 Fundamentos e características da análise de dados em Auditoria

    3.2 Análise de dados para detecção de anomalias

    3.3 Estudos de caso de aplicação da análise nas práticas de auditoria

    4. Tecnologias Emergentes em Auditoria e Assurance

    4.1 Mapeamento das tecnologias emergentes e sua contribuição para as práticas
    de auditoria e Assurance

    4.1.1 Blockchain e Smart contracts

    4.1.2 Contribuição de Robotic Process Automation (RPA)

    4.1.3 Data Analytics e Big Data Analytics

    4.1.4 Inteligência Artificial e Machine Learning

    4.1.5 Computação em nuvem (cloud computing)

    4.1.3.5 Internet das Coisas (IoT)

    4.2 Benefício e desafios

    5 Normas e Diretrizes no uso de tecnologia em Auditoria e Assurance

    5.1 ISA (International Standards on Auditing)

    5.2 NBCs (Normas Brasileiras de Contabilidade)

    5.3 ISACA (nformation Systems Audit and Control Association)

    5.4 Aspectos éticos e regulatórios no uso das tecnologias

    6. Tendências na aplicação das tecnologias nas organizações

    6.1 Estudos de caso de empresas que atuam em Auditoria e Assurance'
  course_name: 'EAC0614 - Tecnologias Aplicadas em Auditoria e Assurance

    Technologies Applied in Audit and Assurance'
  deactivation: ''
  lecture_credits: '2'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    Esta disciplina visa fornecer uma compreensão prática do papel das tecnologias
    emergentes na auditoria e garantia de informações financeiras. No curso, os discentes
    explorarão os conceitos fundamentais de auditoria e assurance, o contexto de evolução
    tecnológica nos negócios e as técnicas de Auditoria Assistidas por Computador
    (TAAC). A disciplina também discute o papel da tecnologia para apoiar a análise
    de dados em auditoria, assim como a contribuição das tecnologias emergentes nas
    práticas da área. Adicionalmente, será abordada os benefícios e desafios da análise
    de dados e o emprego de tecnologias emergentes na auditoria e assurance, bem como
    o papel das normas e diretrizes relevantes para o uso ético e regulatório da tecnologia.
    Por fim, visando elencar aspectos da prática, serão analisados estudos de caso
    de empresas da área.

    OBJETIVOS DE APRENDIZAGEM:

    Espera-se que, ao final da disciplina, os discentes sejam capazes de:

    1. Avaliar as potenciais contribuições, benefícios e desafios do emprego das Tecnologias
    da Informação nas práticas de Auditoria e Assurance.

    2. Identificar e descrever as características das Técnicas de Auditoria Assistidas
    por Computador (TAACS);

    3. Compreender o impacto das tecnologias emergentes, como blockchain, inteligência
    artificial e computação em nuvem, nas práticas de auditoria e assurance.

    4. Discutir os benefícios e desafios regulatórios e éticos relacionados ao uso
    da tecnologia na auditoria.

    5. Analisar tendências atuais na aplicação das tecnologias nas organizações, por
    meio de estudos de caso de empresas que atuam em auditoria e assurance.'
