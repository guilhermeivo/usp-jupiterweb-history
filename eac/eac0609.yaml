    PROVOST, F.; FAWCETT, T. Data Science para negócios. Rio de Janeiro: Alta Books,
    2016.

    KNAFLIC, C. N. Storytelling com dados: um guia para visualização de dados para
    profissionais de negócios. Rio de Janeiro: Alta Books, 2019

    LAGO, K.; ALVES, L. Dominando o Power BI. 3.ed. São Paulo: DATAB Inteligência
    e Estratégia, 2020

    FRAGA, A. Microsoft Power BI: Gráficos, Banco de Dados e Configuração de Relatórios.
    Rio de Janeiro: Alta Books, 2019.

    CARVALHO, A.C.P.L.D; MENEZES, A.G.; BONIDIA, R. P. Ciência de Dados: Fundamentos
    e Aplicações. Rio de Janeiro: LTC, 2024

    BIBLIOGRAFIA COMPLEMENTAR:

    AMARAL, F. Introdução à Ciência de Dados: mineração de dados e Big Data. Rio de
    Janeiro: Alta Books, 2016.

    DAVENPORT, T. Big Data no Trabalho: Derrubando mitos e descobrindo oportunidades.
    Rio de Janeiro: Alta Books, 2017.

    DAVENPORT, T.; HARRIS, J. Competição Analítica: Vencendo através da nova ciência.
    Rio de Janeiro: Alta Books, 2018

    SIEGEL, E. Análise Preditiva: o poder de prever quem vai clicar, comprar, mentir
    ou morrer. Rio de Janeiro: Alta Books, 2017.

    SILVA, L. A.; PERES, S. M.; BOSCARIOLI, C. Introdução à mineração de dados: com
    aplicações em R. Rio de Janeiro: Elsevier, 2016.

    STAIR, R. M. et. al. Princípios de Sistemas de Informação. 4.ed. São Paulo: Cengage
