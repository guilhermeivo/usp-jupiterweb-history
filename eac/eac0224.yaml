  course_name: EAC0224 - Business environment in Brazil and global talent development
  deactivation: ''
  instructors: 73235 - Edgard Bruno Cornacchione Junior
  lecture_credits: '2'
  objectives: 'Course Brief

    The content to be discussed in this course aims at providing conditions for a
    better comprehension of main aspects related to business and organizations in
    a true global world, especially focusing on characteristics of Brazil and other
    economies. Not only aspects related to the markets (macro), but also aspects related
    to many elements in organizations (micro), with special focus on people and management,
    are all explored in this course. The ultimate goal is for students to experience
    a proper educational environment to support building critical opinion and technical
    tools for a more effective and efficient presence in a global business environment.

    Course Goals and Learning Objectives

    By successfully concluding the program, students will be able to analyze aspects
    of talent development focusing on a global market and the Brazilian business environment,
    illustrate Brazilian socioeconomic and cultural aspects and discuss the influence
    of Brazilian characteristics on the performance of individuals and organizations.
    It is anticipated an in-depth conceptual review, followed by weekly discussions
    about the course topics. Specific readings will assist students in constructing
    the main concepts and the discussions, with real world examples, will offer proper
    environment to reflect on the subjects.'
