  course_name: 'EAC0601 - Estágio Supervisionado I

    Supervised Internship I'
  deactivation: ''
  lecture_credits: '1'
  objectives: 'da atividade

    1. Viabilizar a interação entre a universidade e a sociedade, promovendo a troca
    de conhecimentos e a formação integral e humanista dos estudantes, conforme a
    Política Nacional de Extensão Universitária;

    2. Consolidar conhecimentos adquiridos ao longo da graduação por meio da aplicação
    prática em diversos tipos de organizações, de forma a promover as competências
    e habilidades técnicas esperadas para o egresso do curso.

    Descrição da atividade

    Atuação em Organizações industriais, comerciais e de serviços, públicas, privadas
    ou do terceiro setor, em diferentes áreas, cargos e funções.

    Indicadores de avaliação da atividade

    Análise de relatórios de atividades desenvolvidas pelo estagiário, pelo gestor
    (na empresa) e pelo coordenador de estágios (no EAC).'
  practical_credits: '3'
  total_workload: '105 h

    Carga Horária de Extensão:

    90 h'
