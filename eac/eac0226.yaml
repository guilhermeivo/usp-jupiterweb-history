  lecture_credits: '2'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    Decision making implications of accounting information provided to organization
    managers and to external stakeholders such as investors, creditors, customers,
    and regulators. Projects, together with a series of practical workshops, facilitate
    self-discovery of knowledge and development of a variety of professional skills
    and attitudes.

    OBJETIVOS DE APRENDIZAGEM:

    This course develops an understanding of the link between organizational mission
    and governance structures and accounting’s role in coordinating, controlling and
    managing organizations. By the end of the course, you should have gained an understanding
    of how accounting is influenced by and influences organizational mission, strategy,
    structure, and the resulting performance measurement and control systems. To help
    in the development of this understanding, we will discuss numerous examples of
    decision situations (often using cases), both hypothetical and real.'
  practical_credits: '2'
