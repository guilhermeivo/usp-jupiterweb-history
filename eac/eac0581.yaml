  course: "1.\tIMPORTÂNCIA DOS JOGOS COMO ESTRATÉGIA NA APRENDIZAGEM DE GESTÃO EMPRESARIAL\n\
    1.1\t Abordagem sobre o assunto jogos, a fim de apresentar a importância dessa\
    \ metodologia na reflexão e na criação de estratégias educacionais e empresariais\n\
    1.2\t Criatividade: conceitos, exemplos e desenvolvimento de habilidades\n1.3\t\
    Demanda de mercado Versus estudos acerca de habilidades profissionais de gestão\
    \ e da contabilidade\n2.\tOBJETIVOS E CLASSIFICAÇÕES DOS JOGOS\n2.1\tConceito,\
    \ origem\n2.2\tTeoria dos jogos\n2.3\tModelos\n2.4\tSerious Games, Gamification,\
    \ Game-based learning\n3.\tPESQUISAS E APLICAÇÕES EMPRESARIAIS\n3.1\tCenário Brasil\n\
    3.2\tBenefícios do uso de jogos nas empresas\n3.3\tCasos práticos em empresas\
    \ do mercado\n4.\tPLANEJAMENTO E DESENVOLVIMENTO DE PROJETOS\n4.1\tAtributos de\
    \ um jogo\n4.2\tElementos e estrutura geral de um projeto e suas aplicações\n\
    4.3 Apresentação de projetos"
  course_name: 'EAC0581 - Jogos de Empresas II

    Business Game II'
  deactivation: ''
  instructors: '73235 - Edgard Bruno Cornacchione Junior

    65625 - Joao Domiraci Paccez

    5859376 - Luciane Reginato Cornacchione'
  lecture_credits: '2'
  objectives: "APRESENTAÇÃO DA DISCIPLINA:\nCom base nos conhecimentos obtidos nas\
    \ disciplinas ao longo do curso, e levando-se em conta a importância de novas\
    \ tecnologias e ferramentas na educação e nas empresas,  objetiva-se desenvolver\
    \ um projeto de jogo considerando as regras de negócios em uma organização.\n\
    OBJETIVOS DE APRENDIZAGEM:\n1.\tRecuperar o caráter sistêmico da organização,\
    \ integrando os conhecimentos adquiridos no curso;\n2.\tIncluir novos recursos\
    \ nas preocupações gerenciais;\n3.\tDesenvolver o espírito crítico, vital na tomada\
    \ de decisões nas empresas;\n4.\tDesenvolver a criatividade, fundamental para\
    \ o profissional atual; e\n5.\tEstimular a transposição da aprendizagem para diferentes\
    \ tipos de problemas profissionais."
  practical_credits: '0'
  total_workload: 30 h
