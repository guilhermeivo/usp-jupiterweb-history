  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina objetiva introduzir os alunos no conhecimento fundamental da Contabilidade,
    formando a base conceitual necessária para a adequada formação contábil e demonstrando
    a representação dos efeitos dos diversos eventos realizados por uma entidade em
    sua estrutura patrimonial e performance financeira, a fim de proporcionar uma
    visão prática da ciência contábil. Para atingir esses objetivos, são apresentados
    os conceitos e fundamentos da Contabilidade e desenvolvidas as habilidades e atitudes
    necessárias para a elaboração e entendimento das demonstrações contábeis.

    OBJETIVOS DE APRENDIZAGEM:

    Espera-se que, ao final da disciplina, os alunos estejam aptos a:

    1. Aplicar princípios, fundamentos, conceitos e definições da Estrutura Conceitual
    da Contabilidade a determinadas transações e outros eventos de natureza introdutória.

    2. Aplicar os Padrões Contábeis adotados no Brasil e os Padrões Internacionais
    de Relatórios Financeiros (IFRS) estudados nesta disciplina a determinadas transações
    e outros eventos.

    3. Preparar as demonstrações financeiras individuais de acordo com Padrões Contábeis
    Geralmente Aceitos no Brasil e os Padrões Internacionais de Relatórios Financeiros
    (IFRS): Balanço Patrimonial, Demonstração do Resultado do Exercício e Demonstração
    das Mutações do Patrimônio Líquido.'
