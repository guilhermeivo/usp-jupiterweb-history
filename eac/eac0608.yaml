  course: '[01] Introdução ao Tema "Perícia Contábil"

    Importância. Lides. Conhecimento Técnico ou Científico. Revelar a Verdade. Prova.

    [02] Aspectos da Carreira de Perito Contábil

    Potencial. Responsabilidade. Judicial (Perito Judicial). Extra-Judicial (Assistente-Técnico).

    [03] Requisitos Profissionais

    Éticos. Técnicos. Especialidade. Destaque. Responsabilidade. Zelo. Diligência.

    [04] Habilitação Legal e Regularidade Profissional

    CRC (Exame de Suficiência), Exame de Qualificação Técnica (EQT), CNPC, EPC,

    Habilitação Técnica, Regularidade Profissional. Sanções e Penalidades.

    [05] Legislação Aplicável

    CF. CC. CPC. Específicas (por áreas)

    [06] Normas Profissionais e Técnicas (CFC)

    NBC PP, NBC TP, NBC TG

    [07] Organização da Justiça e o Processo Judicial

    Judiciário (Federal, Estadual, Trabalho). Juízo. Tribunais, Comarcas, Varas, Oficiais.

    Citações e Intimações. Prazos. Partes. Advogados. Lide. Autos. Petições. Decisões.

    [08] A Perícia e a Prova Judicial

    Prova. Elementos, Diligências, Métodos. CPC (Vistoria, Exame, Avaliação). NBC.

    [09] Nomeação (ou contratação)

    Cadastro nos Tribunais. Contato com Varas. Parceria com Escritórios. Contrato.

    [10] Quesitos de um Processo

    Relevância. Avaliação. Esclarecimentos. Respostas. Suplementares. Prejudicados.

    [11] Honorários Periciais e Plano de Trabalho

    AJG. Fundamentação. Proposta. Impugnação. Levantamento. Contrato (Assistente).

    [12] Início, Diligências, Elementos e Reuniões Técnicas

    Data de Início. Prazo. Solicitação de Elementos. Reuniões Técnicas. Imparcialidade.

    [13] Laudo Pericial (ou parecer técnico)

    Estrutura. Linguagem. Métodos. Fundamentação. Contestação. Impugnação. Homologação.

    [14] Audiência de Instrução

    Escopo. Participantes. Papel do Perito. Rito. Condições.

    [15] Jurimetria

    Antecedentes. Dados Processuais. Acesso. Algoritmos. Análises.

    [16] Tecnologia no Judiciário

    Evolução. Digitalização do Judiciário. Criptografia. Ritos Processuais. Sistemas.'
  course_name: 'EAC0608 - Perícia Contábil

    Forensic Accounting'
  deactivation: ''
  lecture_credits: '2'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    Profissionais da Contabilidade são cada vez mais demandados pela Justiça e por
    entidades para desempenharem papéis ligados à atividade de Perícia Contábil. O
    volume de processos no Brasil é muito elevado (vide monitoramento do CNJ) e temas
    ligados à Contabilidade são muito presentes.  Nesta disciplina, serão tratados
    tópicos específicos e muito relevantes para os interessados no tema Perícia Contábil
    (dimensões judicial e extra-judicial), envolvendo desde os requisitos éticos e
    profissionais, a carreira em perícia, fundamentação legal e normativos profissionais,
    organização da justiça, o processo judicial, o perito como auxiliar da justiça,
    prova pericial, quesitos, o rito do Processo Civil, o laudo pericial, a audiência
    de instrução, bem como aspectos de jurimetria e tecnologia no judiciário. Também
    serão tratados os aspectos ligados ao Assistente-Técnico e atividades da Perícia
    Contábil extra-judicial. A estratégia instrucional é centrada no estudante, e
    está pautada em discussões sobre os temas e suas relações com as entidades e o
    profissional da área, porém prevendo suas aplicações em situações reais.

    OBJETIVOS DE APRENDIZAGEM:

    Ao concluir de forma exitosa esse curso, os participantes estarão aptos à:

    1. Desenvolver atitude positiva, ética e profissional sobre o tema Perícia Contábil;

    2. Compreender os fundamentos legais e o papel da Perícia Judicial e Extra-Judicial;

    3. Discutir de forma estimulante a Perícia Contábil como eixo da carreira do Profissional
    de Contabilidade;

    4. Analisar temas centrais em torno de situações que ensejam Perícia Contábil;

    5. Compreender a organização da justiça e do processo judicial, os conceitos e
    as etapas previstas no Código Civil e no Código do Processo Civil e a importância
    da Perícia Judicial;

    6. Explicar os componentes do Plano de Trabalho do Perito Contábil;

    7. Explicar os passos e condições envolvendo a nomeação pela Justiça;

    8. Compreender os riscos e responsabilidades da atividade de Perícia Contábil;

    9. Aplicar conhecimentos na interpretação de Quesitos;

    10. Aplicar conhecimentos na elaboração do Laudo Pericial (parecer técnico);

    11. Discutir sobre Jurimetria e Avanços Tecnológicos no Judiciário.'
