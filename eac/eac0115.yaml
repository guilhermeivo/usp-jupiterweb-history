  course: "1. INTRODUÇÃO AO ESTUDO DA TEORIA DA CONTABILIDADE\n•\tO conhecimento científico\
    \ e o papel da teoria\n•\tConhecimento científico e suas especificidades; teoria,\
    \ modelos, hipóteses e conceitos\n•\tIntrodução à pesquisa e investigação científica\
    \ em contabilidade\nLeitura: MT, caps.2 e 3; LM, cap 1, FBC, Caps 1 e 3.\n2. MICRO\
    \ FUNDAMENTOS: OS CONCEITOS FUNDAMENTAIS PARA A TEORIA DA CONTABILIDADE\n•\tConflito\
    \ de agência, Governança Corporativa e Auditoria (SIL, NC/GOB 2, LM, cap. 2)\n\
    •\tAssimetria de informações (SW, cap. 14; LM, cap 2)\n•\tContabilidade como instrumento\
    \ de implementação e observância de contratos: teoria contratual da firma (Sunder,\
    \ cap.2; LM, cap. 2)\nLeitura: LM, cap 2; SW, cap. 14; Sunder, cap.2, SIL, NC/GOB\
    \ , LO, cap 3.\n3. ESTRUTURA CONCEITUAL DAS IFRS E O NÚCLEO FUNDAMENTAL DA TEORIA\
    \ NORMATIVA DA CONTABILIDADE\n•\tEstrutura conceitual da contabilidade nova:\n\
    o\tObjetivo da informação financeira;\no\tUsuários da informação financeira de\
    \ propósito geral;\no\tRegime de competência e o conteúdo informativo das 'accruals';\n\
    o\tCaracterísticas qualitativas da informação Elementos fundamentais da informação\
    \ financeira: Ativo; Passivo; Patrimônio Líquido; Receitas/ganhos, Despesas/perdas.\n\
    Leitura: Estrutura Conceitual IASB (EC); Bases para Conclusão da Estrutura Conceitual\
    \ IASB (EC BC); IUDÍCIBUS, Unidade II (O Núcleo Fundamental da Teoria Contábil:\
    \ ativo, passivo, receitas, despesas, perdas, ganhos e PL).\n4. COMPREENDENDO\
    \ A INFORMAÇÃO FINANCEIRA A PARTIR DA ESTRUTURA CONCEITUAL\n•\tEstudo de caso\
    \ Open Safari (WT)."
  course_name: 'EAC0115 - Teoria da Contabilidade Financeira

    Financial Accounting Theory'
  deactivation: ''
  instructors: '8476037 - Eduardo da Silva Flores

    1035522 - Guillermo Oscar Braunbeck

    59962 - Luiz Nelson Guedes de Carvalho'
  lecture_credits: '2'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    Apresentar os principais conceitos relacionados à Teoria da Contabilidade Financeira
    de modo a demonstrar suas aplicações em casos práticos e situações reais.

    OBJETIVOS DE APRENDIZAGEM:

    Espera-se que, ao final da disciplina, os alunos estejam aptos a:

    1. Discutir questões conceituais e práticas no campo do conhecimento e aplicação
    da Teoria da Contabilidade Financeira.

    2. Pensar criticamente sobre assuntos contábeis, reconhecendo as diversas opções
    metodológicas para o estudo da Contabilidade Financeira; e

    3. Aperfeiçoar as condições para a elaboração de projetos de pesquisa, em complemento
    às competências e habilidades adquiridas na disciplina de Metodologia da Pesquisa
    Aplicada à Contabilidade.'
