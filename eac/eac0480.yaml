  course: "1.\tDEMONSTRAÇÃO DOS FLUXOS DE CAIXA (DFC)\n1.1.\tObjetivo e importância\
    \ da DFC e sua relação com o Balanço Patrimonial e a Demonstração do Resultado\
    \ do Exercício\n1.2.\tConceito de Caixa e Equivalentes de Caixa\n1.3.\tAnálise\
    \ das Entradas e Saídas de Caixa a partir do Balanço Patrimonial e da Demonstração\
    \ do Resultado do Exercício\n1.4.\tEstrutura de Apresentação da DFC e classificação\
    \ das movimentações de caixa por atividade: atividades operacionais, atividades\
    \ de investimento e atividades de financiamento\n1.5.\tMétodos de Elaboração da\
    \ DFC: Direto e Indireto\n1.6.\tPontos polêmicos quanto à classificação (recebimento\
    \ e pagamento de juros e dividendos e transações de investimento e financiamento\
    \ que não envolvem caixa)\n1.7.\tFluxo de Caixa em Moeda Estrangeira\n2.\tTRATAMENTO\
    \ CONTÁBIL DE TRIBUTOS SOBRE A RECEITA\n2.1.\tICMS e IPI: contabilização do crédito\
    \ e da compensação no pagamento, em indústria e comércio\n2.2.\tPIS e COFINS:\
    \ diferença entre regime cumulativo e não cumulativo e seus impactos na contabilização\n\
    2.3.\tAnálise crítica da diferença de tratamento contábil adotado para o ICMS\
    \ e IPI e o tratamento contábil adotado para o PIS e COFINS\n2.4.\tISS: contabilização\
    \ em atividades de prestação de serviços\n3.\tTRATAMENTO CONTÁBIL DOS TRIBUTOS\
    \ SOBRE O LUCRO\n3.1.\tPassivos e Ativos Fiscais Correntes\n3.2.\tPassivos e Ativos\
    \ Fiscais Diferidos\n•\tDiferença Temporária Tributável\n•\tDiferença Temporária\
    \ Dedutível\n•\tPrejuízos e Créditos Fiscais\n3.3.\tContabilização e impactos\
    \ no Resultado e no Balanço Patrimonial\n4.\tDEMONSTRAÇÃO DO RESULTADO ABRANGENTE\
    \ (DRA)\n4.1.\tCaracterização de resultado abrangente e seus componentes\n4.2.\t\
    Exemplos de eventos que geram resultados abrangentes\n4.3.\tElaboração e formas\
    \ de apresentação da DRA\n5.\tPATRIMÔNIO LÍQUIDO\n5.1.\tConceitos gerais\n5.2.\t\
    Capital Social\n5.3.\tReservas de Capital e Reservas de Lucros\n5.4.\tAjustes\
    \ de avaliação patrimonial\n5.5.\tAções em Tesouraria\n5.6.\tDividendos: conceito,\
    \ critérios de cálculo e contabilização\n5.7.\tJuros sobre o Capital Próprio:\
    \ conceito, critérios de cálculo e contabilização"
