  course: "1.\tEVIDÊNCIA DE AUDITORIA E RISCOS RESIDUAIS\n1.1\tAvaliação do resultado\
    \ da análise de desenho e eficácia de controles\n1.2\tDeterminação de riscos residuais\
    \ e procedimentos substantivos para mitigação de riscos de auditoria\n1.3\tComunicação\
    \ de deficiências de controle interno\n1.4\tAuditoria de controles internos sobre\
    \ o processo de relato financeiro (auditoria integrada)\n2.\tPROCEDIMENTOS SUBSTANTIVOS\n\
    2.1\tProcedimentos Analíticos\n2.2\tConfirmações Externas\n2.3\tCut off\n2.4\t\
    Inventários Físicos\n2.5\tAnálise de reconciliações e outros exames documentais\n\
    2.6\tAmostragem em testes substantivos versus auditoria substantiva de toda a\
    \ população\n2.7\tData analytics e big data\n2.8\tAuditoria de julgamentos e estimativas\
    \ contábeis\n3.\tREVISÃO E RELATÓRIO DE AUDITORIA\n3.1\tEventos subsequentes\n\
    3.2\tPremissa da continuidade (going concern)\n3.3\tRepresentações Formais\n3.4\t\
    Finalização dos trabalhos: revisão geral, distorções identificadas vs. Materialidade\n\
    3.5\tRelatório dos Auditores Independentes\n4.\tAUDITORIA INTERNA E GESTÃO DE\
    \ RISCOS\n4.1\tGestão de Riscos Empresariais e Controle Interno: o modelo de três\
    \ linhas de defesa\n4.2\tO papel do gestor de riscos versus o papel da auditoria\
    \ interna\n4.3\tAuditoria de conformidade, investigação de fraudes, auditoria\
    \ ‘value for money’ e auditoria de gestão (operacional)\n5.\tAUDITORIA INDEPENDENTE\
    \ E GOVERNANÇA CORPORATIVA\n5.1\tResponsabilidades dos auditores com os responsáveis\
    \ pela governança\n5.2\tInteração com Assembleia Geral, Conselho de Administração,\
    \ Comitê de Auditoria e Conselho Fiscal e diferenças entre esses organismos\n\
    6.\tPERÍCIA CONTÁBIL\n6.1\tNormatização\n6.2\tAspectos fundamentais do planejamento,\
    \ execução e conclusão dos trabalhos de perícia contábil\n6.3\tA carreira do Perito\
    \ e esferas de atuação\n6.4\tMetodologia de Perícia Contábil e estrutura do conteúdo;\
    \ Características e Tipos de Quesitos\n6.5\tElaboração de Quesitos\n6.6\tLaudo\
    \ e Parecer Pericial"
