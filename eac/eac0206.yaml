  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina visa propiciar aos participantes o entendimento do funcionamento
    da Contabilidade de Custos, compreendendo os seus conceitos fundamentais, seu
    funcionamento como sistema de informação e sua integração com a Contabilidade
    Societária.

    OBJETIVOS DE APRENDIZAGEM:

    A disciplina oferece uma visão sistêmica abrangente e moderna da contabilidade
    de custos. Os temas estudados serão tratados de maneira conceitual e prática.
    Assim, espera-se que, ao final do curso, os alunos estejam aptos a:

    1. Entender a contextualização da contabilidade de custos relativamente às contabilidades
    societária, tributária e gerencial e entender a contabilidade de custos no contexto
    dos sistemas de informações empresariais.

    2. Dominar a terminologia contábil e classificações aplicadas na contabilidade
    de custos. Discriminar os conceitos de custo, despesa, investimento, perda, gasto
    e desembolso. Classificar os custos e despesas em relação às alterações dos volumes
    de atividades em fixos e variáveis. Classificar os custos e despesas em relação
    aos objetos de custeio em diretos e indiretos.

    3. Conhecer os conceitos fundamentais e os procedimentos sistêmicos do método
    de custeio por absorção. Aprender a elaboração do fluxo contábil do sistema, com
    a movimentação dos valores de custos pelas diferentes contas de estoques, desde
    o evento compras até a obtenção do CPV dos produtos. Conhecer o conteúdo do Pronunciamento
    CPC 16 – Estoques,

    4. Conceituar custo de material direto. Entender a classificação de material direto,
    a distinção entre material direto e indireto, a composição do custo de material
    direto, os critérios de avaliação de estoques, o tratamento contábil dos tributos
    incidentes sobre os materiais, o processo de apropriação do custos de materiais
    aos produtos e a contabilização dos materiais.

    5. Conceituar mão-de-obra direta, segregar mão-de-obra direta e indireta, mensurar
    o custo de mão-de-obra- direta, conhecer e tratar contabilmente os encargos incidentes
    sobre a mão-de-obra- direta, efetuar a apropriação de mão-de-obra- direta aos
    produtos e proceder à contabilização da mão-de-obra- direta.

    6. Conceituar custos indiretos de fabricação e classificar os elementos que compõem
    os custos indiretos de fabricação. Compreender o processo de alocação dos custos
    indiretos de fabricação aos produtos, envolvendo a classificação dos centros de
    custos de produção, o processo de departamentalização e a utilização das diferentes
    unidades de trabalho dos centros de custos produtivos. Conhecer a aplicação do
    conceito de taxas pré-determinadas de custos indiretos de fabricação.

    7. Conhecer as características do sistema de acumulação de custos por ordem de
    fabricação. Conhecer o processo de custeamento de ordens de fabricação, conhecer
    a integração do custeamento por ordem com a contabilidade societária, conhecer
    o tratamento contábil das ordens de produção de longo prazo de execução.

    8. Conhecer as características do sistema de acumulação de custos por processo.
    Conhecer o processo de custeamento dos processos de produção, conhecer conceito
    de grau de acabamento de unidades equivalentes de produção. Saber calcular o grau
    de acabamento. Conhecer a integração do custeamento por processo com a contabilidade
    societária.

    9. Conhecer as características do sistema de produção conjunta. Classificar os
    coprodutos, subprodutos e sucatas, classificar os custos na produção conjunta
    e efetuar a apropriação dos custos conjuntos aos coprodutos.'
