  course: '1. PBL: CONCEITOS FUNDAMENTAIS

    1.1. Histórico

    1.2. Por que usar PBL

    1.3. Elementos da abordagem

    2. CHA (CONHECIMENTOS, HABILIDADES E ATITUDES) NO APRENDIZADO

    2.1. Conceitos e relevância

    2.2. Contextualização e aplicação

    2.3. Visão contextual

    3. RESGATE DE CONHECIMENTOS ADQUIRIDOS EM OUTRAS DISCIPLINAS

    3.1. Conceitos já ministrados no curso

    3.2. Identificação dos conhecimentos e os problemas identificados

    4. ESTRUTURAÇÀO DE PROJETOS

    4.1. Identificação de projetos com vistas ao contexto individual

    4.2. Identificação de projetos com vistas ao contexto grupal

    4.3. Desenvolvimento de soluções para os problemas

    5. MECANISMOS ACESSÓRIOS

    5.1. Conceitos e aplicações para o action research

    5.2. Oportunidades para o canvas'
  course_name: 'EAC0557 - Solução de Problemas em Controle Gerencial

    Problem Solution in Management Control'
  deactivation: 31/12/2024
  instructors: 1106326 - Fabio Frezatti
  lecture_credits: '2'
  objectives: "APRESENTAÇÃO DA DISCIPLINA:\nMediante a utilização da abordagem Aprendizagem\
    \ Baseada em Problemas (ABP), conhecida como Problem-Based Learning (PBL), a disciplina\
    \ tem por objetivo geral de integrar competências (conhecimentos, habilidades\
    \ e atitudes) na solução de problemas das organizações nos temas de controle gerencial.\n\
    Suas características são:\n•\tÉ centrada no aluno;\n•\tA aprendizagem ocorre,\
    \ principalmente, nos pequenos grupos;\n•\tOs professores são facilitadores ou\
    \ guias ou gestor de grupos;\n•\tO contexto e experiência do aluno são valorizadas\
    \ no desenvolvimento das atividades;\n•\tA aprendizagem ocorre levando em conta\
    \ o conhecimento (prévio), a habilidade e a atitude;\n•\tAs atividades foram organizadas\
    \ em síncronas (discussões, esclarecimentos e algumas reuniões de grupos) e assíncronas\
    \ (vídeo aulas, trabalhos em grupos, estruturação de projetos e leituras de textos);\
    \ e\n•\tOs problemas são os “ganchos” para que os grupos desenvolvam as atividades.\n\
    OBJETIVOS DE APRENDIZAGEM:\nOs objetivos de aprendizagem da disciplina são:\n\
    1.\tSensibilizar os participantes sobre a importância dos conhecimentos, habilidades\
    \ e atitudes (CHA);\n2.\tDesenvolver habilidades e atitudes (algumas escolhidas);\n\
    3.\tEstimular resgate de conhecimentos;  e\n4.\tEstimular e monitorar a operacionalização\
    \ de aplicação das competências em organizações."
  practical_credits: '2'
  total_workload: 90 h
  type: Semestral
