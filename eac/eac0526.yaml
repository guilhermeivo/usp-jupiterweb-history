courses:
  activation: 01/01/2013
  assessment: 'a) O aluno poderá participar do processo de reavaliação (recuperação)
    na disciplina caso obtenha nota média final maior ou igual a 3,0 (três) e menor
    que 5,0 (cinco) e frequência igual ou superior a 70%.

    b) A média para aprovação com reavaliação será obtida por meio da média aritmética
    simples da média final + nota obtida na reavaliação, que deverá ser igual ou superior
    a 5,0 (cinco).'
  bibliography: 'BIBLIOGRAFIA PRINCIPAL:

    BODIE, Zvi, KANE, Alex, MARCUS, Alan J. Investments. 8. ed. Cidade? McGraw-Hill,
    2009.

    JORION, Philippe. Value at risk. São Paulo: BM&F, 2004.

    BIBLIOGRAFIA COMPLEMENTAR:

    BERNSTEIN, Peter L. Desafio aos deuses: a fascinante história do risco. São Paulo:
    Campus, 1997.

    DAMODARAN, Aswath. Gestão estratégica do risco. Porto Alegre: Bookman, 2009.

    JORION, Philippe. Financial risk manager handbook. New Jersey: Wiley, 2003.

    ROSS, Stephen A.; WESTERFIELD, Randolph W.; JAFFE, Jeffrey F. Administração financeira:
    corporate finance. 2. ed. São Paulo: Atlas, 2002.'
  course: '1. Conceito de risco e gestão estratégica de riscos

    2. Modelagem dos fatores de risco

    3. Métodos para mensurar riscos

    4. Medidas de performance ajustadas ao risco'
  course_name: 'EAC0526 - Gestão de Riscos e Investimentos

    Investment and Risk Management'
  deactivation: ''
  instructors: '145440 - Alexsandro Broédel Lopes

    3454235 - Francisco Henrique Figueiredo de Castro Junior

    5021632 - Gerlando Augusto Sampaio Franco de Lima

