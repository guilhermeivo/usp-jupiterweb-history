  lecture_credits: '2'
  objectives: 'Espera-se que, ao final do curso, os alunos estejam aptos a:

    1.Distinguir, descrever e aplicar as diferentes abordagens para conceituar o risco
    e classificar as fontes de risco

    2.Descrever o conceito moderno de gestão estratégica de riscos e os tipos fundamentais
    de risco aplicados a investimentos

    3.Identificar e explicar os pressupostos fundamentais utilizados para desenvolver
    as principais ferramentas de mensuração e gestão de riscos e investimentos'
