  course_name: 'EAC0410 - Ética Geral e Profissional

    General and Professional Ethics'
  deactivation: ''
  instructors: 84596 - Nahor Plácido Lisboa
  lecture_credits: '2'
  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    Tendo em vista que o mundo dos negócios é desenvolvido por seres humanos que estão,
    a todo momento, tomando decisões, das mais simples às mais complexas, muitas dessas
    decisões serão impactadas pelo comportamento e visão de mundo dos envolvidos.
    Assim, é importante que os atores do mundo dos negócios consigam reconhecer nas
    diversas situações onde há e onde não há presença de comportamentos éticos. O
    objetivo geral da disciplina é promover a conscientização sobre a importância
    da compreensão da ética.

    OBJETIVOS DE APRENDIZAGEM:

    Espera-se que, ao final da disciplina, os alunos estejam aptos a:

    1. Utilizar-se do embasamento teórico oferecido pela disciplina para aplicação
    da ética na carreira profissional, desmistificando o conceito popular sobre ética.

    2. Compreender, por meio de casos reais e hipotéticos, a importância de cada tomada
    de decisão que implique aspectos éticos.

    3. Entender as possíveis consequências, positivas e negativas, de modo quantitativo
    e qualitativo, de cada decisão tomada, eticamente ou não.'
  practical_credits: '0'
  total_workload: 30 h
