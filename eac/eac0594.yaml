  objectives: Discutir e abordar tópicos contemporâneos que impactam o mercado securitário,
    tanto numa perspectiva regulatória quanto teórica. Possibilitar que a disciplina
    seja um ambiente em que novas questões de pesquisa com relevado impacto social
    possam ser desenvolvidas para fins de pesquisas futuras.
