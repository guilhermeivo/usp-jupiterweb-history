  activation: 01/01/2025
  assessment: 'a) O aluno poderá participar do processo de reavaliação (recuperação)
    na disciplina caso obtenha

    nota média final maior ou igual a 3,0 (três) e menor que 5,0 (cinco) e frequência
    igual ou superior a

    70%.

    b) A média para aprovação com reavaliação será obtida por meio da média aritmética
    simples da

    média final + nota obtida na reavaliação, que deverá ser igual ou superior a 5,0
    (cinco).'
  bibliography: 'Básica

    BIBLIOGRAFIA BÁSICA:

    DICKSON, D.C.M; HARDY, M. R; WATERS, H.R. (2013). Actuarial Mathematics for Life
    Contingent Risks. Second Edition.

    JORDAN, C. W. (1991). Society of Actuaries’ Textbook on Life Contingencies. The
    Society of

    Actuaries, 2. ed. 349 p.

    BIBLIOGRAFIA COMPLEMENTAR:

    BOWERS, N. L.; GERBER, H. U; HICKMAN, J. C.; JONES, D. A.; NESBITT, C. J. (1997).

    ACTUARIAL MATHEMATICS. The Society of Actuaries, 2. ed. 753 p.'
  course: '1. Revisão de Matemática Atuarial Vida I;

    2. Comutações para seguros de vida, dotais e anuidades atuariais.

    3. Anuidades atuariais fracionadas. A aproximação de Woolhouse;

    4. A variável aleatória função de vida conjunta: probabilidades de morte e vida,
    expectativas de vida conjunta e seu desvio-padrão;

    5. A variável aleatória último sobrevivente: probabilidades de morte e vida, expectativas
    de vida do último sobrevivente e seu desvio-padrão;

    6. Modelos de precificação de seguros de vida aplicados sobre o contexto de múltiplas
    vidas: seguro de vida conjunta, seguro do último sobrevivente e seguro contingente.
    Estimação de prêmio estatístico e prêmio puro;

    7. Modelos de anuidades atuariais aplicadas sobre o contexto de múltiplas vidas:
    anuidade de vida conjunta, anuidade do último sobrevivente e anuidade reversível.
    Estimação de prêmio estatístico e prêmio puro;

    8. Uma introdução aos múltiplos decrementos e suas aplicações: construção de tábuas
    multi-decrementais e precificação de produtos como aposentadoria por invalidez;

    9. Tópicos complementares

    Instrumentos e Critérios de Avaliação'
  course_name: 'EAC0424 - Matemática Atuarial Vida II

    Actuarial Mathematics II - Life'
