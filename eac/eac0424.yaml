courses:
  activation: 01/01/2018
  assessment: 'a) O aluno poderá participar do processo de reavaliação (recuperação)
    na disciplina caso obtenha

    nota média final maior ou igual a 3,0 (três) e menor que 5,0 (cinco) e frequência
    igual ou superior a

    70%.

    b) A média para aprovação com reavaliação será obtida por meio da média aritmética
    simples da

    média final + nota obtida na reavaliação, que deverá ser igual ou superior a 5,0
    (cinco).'
  bibliography: 'BIBLIOGRAFIA BÁSICA:

    JORDAN, C. W. (1991). Society of Actuaries’ Textbook on Life Contingencies. The
    Society of

    Actuaries, 2. ed. 349 p.

    BOWERS, N. L.; GERBER, H. U; HICKMAN, J. C.; JONES, D. A.; NESBITT, C. J. (1997).

    ACTUARIAL MATHEMATICS. The Society of Actuaries, 2. ed. 753 p.

    BIBLIOGRAFIA COMPLEMENTAR:

    DICKSON, D.C.M; HARDY, M. R; WATERS, H.R. Actuarial Mathematics for Life Contingent

    Risks. Second Edition. 2013'
  course: '1. Probabilidades de morte/sobrevivência envolvendo mais de uma vida;

    2. Funções de vidas conjuntas;

    3. Seguros em casos gerais de vidas múltiplas e de último sobrevivente;

    4. Anuidades reversíveis e pensões;

    5. Introdução aos Multi-Decrementos;

    6. Tópicos Complementares.'
  course_name: 'EAC0424 - Matemática Atuarial Vida II

    Actuarial Mathematics II - Life'
  deactivation: ''
  instructors: '4894284 - João Vinícius de França Carvalho

    1064696 - Luiz Jurandir Simões de Araujo

    2112537 - Ricardo Pacheco'
  lecture_credits: '4'
  objectives: 'O curso tem como objetivo complementar os conhecimentos de seguros
    do ramo vida adquiridos no

    curso de Matemática Atuarial de Vida I, fundamentais aos alunos de ciências atuariais
    para o seu

    exercício profissional nas áreas de Vida e Previdência, bem como prepará-los com
    o conhecimento

    específico para o exame obrigatório de habilitação profissional. Inicialmente
    serão estendidos os

    resultados para múltiplas vidas. Por fim, serão abordados os casos mais gerais
    de previdência, além

    de alguns tópicos complementares.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
