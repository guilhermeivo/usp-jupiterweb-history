  course: 'A disciplina compreenderá os seguintes tópicos: Reprodução de anfíbios;
    Reprodução de Aves; Reprodução de Répteis e Reprodução de Mamíferos (tópico que
    será subdividido na infraclasse Marsupialia e nas ordens Rodentia, Pilosa, Cetacea,
    Artiodactyla, Carnivora e Chiroptera). Paralelamente, quando houver a disponibilidade,
    haverão visitas técnicas a grupos de pesquisa que empregam biotécnicas para o
    auxílio na reprodução de animais selvagens.

    Instrumentos e Critérios de Avaliação'
  course_name: 'VRA0443 - Reprodução em Animais Silvestres

    Wild Animal Reproduction'
  deactivation: ''
  instructors: 3399196 - Ricardo José Garcia Pereira
  lecture_credits: '3'
  objectives: Estudo da reprodução em animais silvestres, com ênfase na fisiologia
    reprodutiva de diferentes táxons. Debater as características fisiológicas e comportamentais
    nos diferentes classes (e ordens) de animais silvestres, procurando ressaltar
    os complexos mecanismos endócrinos envolvidos no controle da atividade reprodutiva,
    assim como, os aspectos evolutivos que moldaram as estratégias reprodutivas adotadas
    pelas mais variadas ordens.
  practical_credits: '0'
  total_workload: 45 h
  type: Semestral
