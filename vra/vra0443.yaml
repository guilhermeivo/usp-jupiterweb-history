  course: 'Curso Teórico – Características fisiológicas e comportamentais nas diferentes
    espécies silvestres, procurando enfatizar os mecanismos endócrinos de controle
    da função reprodutiva. A disciplina compreenderá os seguintes tópicos: Reprodução
    de anfíbios; Reprodução de Aves; Reprodução de Répteis e Reprodução de Mamíferos
    (tópico que será subdividido na infraclasse Marsupialia e nas ordens Rodentia,
    Pilosa, Primata Cetacea, Artiodactyla, Carnivora e Chiroptera).'
