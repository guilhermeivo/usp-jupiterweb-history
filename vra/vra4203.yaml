  course: Implicações do sofrimento fetal agudo no neonato.
  course_name: 'VRA4203 - Neonatologia Veterinária

    Veterinary Neonatology'
  deactivation: ''
  instructors: 486906 - Camila Infantosi Vannucchi
  lecture_credits: '2'
  objectives: '1) Estudar os mecanismos fisiológicos e patológicos dos recém-nascidos.

    2) Avaliar os meios de assistência intra-parto a neonatos hígidos e em situações
    críticas.

    3) Estudar os parâmetros de avaliação clínica disponíveis em Neonatologia Veterinária.'
