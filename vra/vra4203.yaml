  assessment: 'A recuperação constará de duas provas, cuja natureza ficará a cargo
    de cada disciplina, a serem realizadas até uma semana antes do término do período
    de retificação de matrícula (estabelecido anualmente pelo Calendário USP) A média
    da avaliação final da disciplina entrará no computo da recuperação, sendo: média
    = média da avaliação final + média da recuperação ÷ 2'
  bibliography: '1) Abitbol, M. M., Monheit, A. G., Stone, M. L. Aterial PO2, PCO2,
