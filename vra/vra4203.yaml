    e particularidades dos exames complementares, Transferência de imunidade passiva
    colostral, Semiologia neonatal, Terapêutica neonatal: vias de acesso e farmacologia,
    Reanimação, urgência e intensivismo neonatal, Tríade neonatal, Sepse Neonatal,
    Particularidades do neonato ruminante, Particularidades do neonato em animais
    selvagens, Particularidades do neonato felino, Particularidades do neonato equino.

    Conteúdo prático: Procedimentos de manejo neonatal, Procedimentos ambulatoriais
    no neonato, Técnicas de Reanimação neonatal.'
  course_name: 'VRA4203 - Neonatologia Veterinária

    Veterinary Neonatology'
  deactivation: ''
  instructors: 486906 - Camila Infantosi Vannucchi
  lecture_credits: '2'
  objectives: 'da atividade

    Realizar atendimento à comunidade junto ao Serviço de Ginecologia e Obstetrícia
    do HOVET e Laboratório de Perinatologia do Departamento de Reprodução Animal.

    Descrição da atividade

    Atendimento ambulatorial em neonatos de diferentes espécies animais (anamnese,
    exame físico, colheita de material biológico para exame, diagnóstico e tratamento)
    e assistência neonatal imediata ao nascimento em partos cirúrgicos.

    Indicadores de avaliação da atividade

    Relatórios dos atendimentos registrados no sistema hospitalar, verificados pelo
    docente responsável quanto à sua completude, conteúdo e sequência. Verificação
    junto ao público-alvo da qualidade de atendimento, resolução de problemas e indicação
    terapêutica.'
