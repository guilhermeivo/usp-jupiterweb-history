  objectives: Fornecer ao aluno do curso de Medicina Veterinária fundamentos e conceitos
    de Administração aplicada aos negócios e empreendimentos relacionados aos sistemas
    agroindústrias de produção animal, tais como gestão de fazendas, de empresas de
    insumos e serviços veterinários/zootécnicos; gestão de frigoríficos, laticínios
    e varejos.
