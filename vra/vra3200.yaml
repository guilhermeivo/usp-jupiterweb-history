    à produção animal;

    Ambiente institucional da indústria animal;

    Sistema agroindustrial da bovinocultura de corte e de leite;

    Sistema agroindustrial da avicultura de corte e de postura;

    Sistema agroindustrial de suínos;

    Sistema agroindustrial de pescados;

    Sistemas agroindustriais de outras espécies de interesse zootécnico;

    Gestão de fazendas agropecuárias;

    Gestão de Frigoríficos e laticínios

    Princípios de comércio internacional de produtos de origem animal; e

    Desafios e ameaças à indústria animal.'
