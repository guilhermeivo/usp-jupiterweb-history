  course: 'Introdução e histórico da piscicultura no Brasil. Importância da propagação
    de peixes. Estratégias e táticas reprodutivas. Fisiologia da reprodução, anatomia.
    Visita a CEPTA / ICMBio instalações de campo e laboratoriais. Manutenção de peixes
    em laboratório. Características dos gametas de peixes. Principais espécies de
    peixes nativos e desafios da reprodução. Propagação artificial de peixes. Fertilização
    in vitro e suas potencialidades na produção animal. Embriologia e larvicultura
    de peixes. Biotecnologia da reprodução de peixes.

    Instrumentos e Critérios de Avaliação'
  course_name: 'VRA3100 - Reprodução de peixes

    Fish reproduction'
  deactivation: ''
  instructors: 1463350 - Mayra Elena Ortiz D'Avila Assumpção
  lecture_credits: '3'
  objectives: Discutir os principais fatores bióticos e abióticos que afetam a reprodução
    de peixes, e os procedimentos práticos para a propagação artificial em larga escala.
    A disciplina visa capacitar alunos na área de reprodução de peixes, abordando
    aspectos teóricos e práticos para a produção de juvenis em larga escala, tanto
    para a produção quanto à conservação de espécies ameaçadas de extinção.
  practical_credits: '0'
