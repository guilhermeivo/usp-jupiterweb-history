  course: Aspectos da fisiologia e manejo reprodutivo em caprinos e ovinos; Patologias
    reprodutivas; Avaliação zootécnica de matrizes e reprodutores; Técnicas de indução
    do estro; Manipulação e criopreservação de sêmen de ambas as espécies; Inseminação
    artificial por diferentes técnicas; Diagnóstico de gestação e dinâmica do desenvolvimento
    fetal por ultrassonografia; Avaliação do genital masculino e dinâmica folicular
    ovariana por ultrassonografia; Produção, transferência e criopreservação de embriões
    produzidos in vivo e in vitro; Treinamento em laparoscopia e aspiração folicular
    visando a produção de embriões in vitro, clonagem e transgenia.
  course_name: 'VRA4102 - Biotecnologia da Reprodução de Pequenos Ruminantes

    Biotechnology of Small Ruminants'
  deactivation: 31/12/2024
  instructors: '92139 - Anneliese de Souza Traldi

    92463 - Ed Hoffmann Madureira'
  lecture_credits: '4'
  objectives: 'A disciplina tem como objetivo o estudo, treinamento e aplicação das
    diferentes Biotécnicas que

    otimizam o manejo reprodutivo de caprinos e ovinos, com destaque para o controle
    da reprodução estacional e inseminação artificial; o uso da ultrassonografia como
    ferramenta na avaliação reprodutiva de machos e fêmeas; produção, criopreservação
    e transferência de embriões produzidos in vivo e in vitro; treinamento de laparoscopia
    e aspiração folicular visando a produção de embriões in vitro, clonagem e  transgenia.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
