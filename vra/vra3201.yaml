  objectives: 'da atividade

    Produção vídeos desenvolvidos pelos próprios estudantes com uma linguagem simples
    e moderna para detalhar e desmistificar manejos reprodutivos geralmente feitos
    com animais domésticas para maximização de resultados. Os melhores vídeos de cada
    turma serão divulgados em mídias sociais para informar e instruir diferentes seguimentos
    da sociedade.

    Descrição da atividade

    Solicitaremos que os estudantes formem grupos (7-8 pessoas) e elaborem vídeos
    educativos de curta duração (2-3 minutos) ao longo do semestre explicando as necessidades,
    importância, vantagens e metodologia de certos manejos reprodutivos realizados
    nas diferentes espécies domésticas (1 vídeo por grupo). Os melhores vídeos serão
    veiculados em reuniões de produtores, cooperativas e empresas dos setores produtivo
    e veterinário. Também serão divulgados em redes sociais e mídias digitais para
    a educação do público leigo.

    Indicadores de avaliação da atividade

    Inicialmente, os vídeos serão avaliados pelos docentes responsáveis para críticas,
    melhorias e seleção dos melhores. Depois, os vídeos selecionados serão divulgados
    em reuniões de produtores, cooperativas e empresas dos setores produtivo e veterinário,
    e as instituições envolvidas darão aos docentes responsáveis uma devolutiva sobre
    as impressões dos produtores, profissionais e afins sobre os materiais. Adicionalmente,
    para aqueles vídeos que forem divulgados nas redes sociais da FMVZ e USP (p.e.
    Facebook, Instagram, Linkedln, etc.) e em mídias digitais (p.e. Youtube), serão
    avaliados o número de acessos, curtidas, comentários, compartilhamentos, etc.'
