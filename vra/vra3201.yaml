  course: 'Curso Teórico: Cálculo e avaliação dos índices reprodutivos; Técnicas de
    sincronização do ciclo estral: impacto no manejo reprodutivo; Nutrição e reprodução;
    Manejo reprodutivo em gado de corte; Manejo reprodutivo em gado de leite; Manejo
    reprodutivo em bubalinos; Manejo reprodutivo em ovinos e caprinos; Manejo reprodutivo
    de equinos; Manejo reprodutivo de aves; Manejo reprodutivo de cães; Manejo reprodutivo
    em suínos. Curso Prático: O ensino prático da Disciplina constará de visitas a
    estabelecimentos agropecuários para avaliação do manejo reprodutivo.'
  course_name: 'VRA3201 - Manejo Reprodutivo em Animais Domésticos

    Reproductive Management in Farm Animals'
  deactivation: 31/12/2024
  instructors: '1492328 - Pietro Sampaio Baruselli

    3399196 - Ricardo José Garcia Pereira'
  lecture_credits: '2'
  objectives: Estudo dos diferentes tipos de manejos com o intuito de melhorar a eficiência
    reprodutiva em animais domésticos.
  practical_credits: '0'
  total_workload: 30 h
