courses:
  activation: 01/01/2024
  assessment: '1 - A recuperação constará de duas provas a serem realizadas até uma
    semana antes do término do período de retificação de matrícula (estabelecido anualmente
    pelo Calendário USP)

    2 - A média da avaliação final da disciplina será avaliada levando em consideração:
    média final = média da avaliação final + média da recuperação ÷ 2.'
