  course: 'Fisiologia e endocrinologia da gestação.

    Diagnóstico de gestação e afecções da gestação de origem materna e fetal.

    Fisiologia e endocrinologia do parto e puerpério.

    Distocias de origem materna e fetal.

    Operações obstétricas cruentas e incruentas.

    Afecções puerperais e neonatologia.

    Atividades Didáticas: Aulas teóricas, Teórico-práticas, Práticas, Visitas técnicas
    e Atividades de campo.

    1) Aulas teóricas Aulas expositivas, com o uso de recursos audiovisuais.

    Duração aproximada de 120 minutos.

    Alunos - toda turma

    2) Aulas Teórico-Práticas: atendimento e discussão de casos de ambulatório; demonstração
    de técnicas obstétricas que serão executadas por docentes, precedidas ou seguidas
    de exposição explicativa; manobras obstétricas com manequim.

    Duração 4 horas.

    Alunos -15 a 20/grupo.

    3) Práticas Dirigidas.

    Demonstração e treinamento de procedimentos para os quais serão utilizadas as
    áreas onde se desenvolve o aprendizado: 1. Ambulatório 2. Centro cirúrgico 3.
    Laboratório Didático: Duração 4 horas/aula prática. 4. CBRA-Pirassununga e Visitas
    técnicas/Atividades de campo. Duração: 20 horas/turma

    Todas as aulas práticas serão ministradas a grupo de 15 a 20 alunos.'
  course_name: 'VRA4201 - Obstetrícia

