  course: '1.      Abordagens teóricas da Antropologia contemporânea e sua contribuição
    para a compreensão da sociedade e da educação

    2.      As teorias crítico-acionalistas (interacionismo simbólico, etnometodologia,
    dramaturgia social): sua contribuição para a compreensão das relações entre a
    sociedade e a escola

    3.      A Antropologia e suas contribuições para a reflexão sobre a sociedade
    e a educação no Brasil

    4.      Cultura, educação e socialização: a contribuição teórico-metodológica
    da Antropologia para o seu entendimento

    5.      Multiculturalismo, pluralidade cultural, igualdade, diferença e educação:
    perspectivas antropológicas

    6.      A cultura da escola: ritos, rituais e práticas escolares

    7.      Etnias e educação brasileira: a abordagem antropológica

    8.      A investigação antropológica e o conhecimento do cotidiano escolar

    9.  Dimensões éticas da pesquisa em Antropologia e Educação.

    Instrumentos e Critérios de Avaliação'
  course_name: '5961124 - Fundamentos Antropológicos da Educação

    Anthropological Foundations of Education'
  deactivation: ''
  instructors: 1089892 - Francirosy Campos Barbosa
  lecture_credits: '4'
  objectives: 'Geral:

    A disciplina Fundamentos  Antropológicos da Educação tem como objetivo refletir
    e investigar as relações entre a sociedade, o indivíduo e a cultura, na contemporaneidade,
    focalizando com especial relevo a "educação" e a "escola", suas funções e relações
    com a sociedade, o conhecimento e a construção de identidades pessoais, sociais
    e culturais.

    Específicos:

    a) Apresentar diferentes abordagens do conceito de cultura no pensamento antropológico,
    focalizando os temas que relacionam antropologia e educação.

    b) Oportunizar o debate sobre o papel da diversidade cultural na prática pedagógica.

    c) Favorecer a compreensão crítica dos aspectos sociais, históricos, culturais,
    educacionais e econômicos da comunidade onde se insere a escola.

    d) Refletir sobre o multiculturalismo, pluralidade cultural, igualdade, diferença
    e educação em uma perspectiva antropológica.

    e) Analisar a cultura da escola: ritos, rituais e práticas escolares.'
