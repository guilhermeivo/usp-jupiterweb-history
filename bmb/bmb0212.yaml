  course: 'FISIOLOGIA DO SISTEMA CARDIOVASCULAR

    1. Propriedades elétricas e mecânicas da fibra cardíaca. Eletrocardiograma.

    2. O coração como bomba. Ciclo cardíaco.

    3. Regulação do débito cardíaco.

    4. Hemodinâmica vascular.

    5. Circulação arterial, capilar e venosa: Perfil de ondas de pressão ao longo
    do sistema. Dinâmica e funções. Propriedades da parede capilar. Dinâmica do fluxo
    capilar. Retorno venoso e capacitância venosa.

    6. Regulação do fluxo sanguíneo.

    7. Regulação da pressão arterial.

    FISIOLOGIA DO SISTEMA RESPIRATÓRIO

    1. Mecânica respiratória.

    2. Ventilação alveolar.  Espaço morto anatômico e fisiológico.

    3. Circulação pulmonar. Relação ventilação-perfusão.

    4. Transporte dos gases. Leis dos gases.

    5. Regulação respiratória do equilíbrio ácido-base.

    6. Regulação da respiração.

    FISIOLOGIA DO SISTEMA RENAL

    1. Néfron: hemodinâmica e filtração glomerular.

    2. Função tubular: depuração, reabsorção e secreção.

    3. Mecanismos de concentração urinária.

    4. Regulação da osmolalidade e do volume dos líquidos corporais.

    5. Regulação do potássio.

    6. Regulação renal do equilíbrio ácido-base.

    FISIOLOGIA DO SISTEMA DIGESTÓRIO

    1. Organização e regulação do sistema gatrointestinal.

    2. Motilidade do trato gastrointestinal.

    3. Secreções, digestão e absorção: Processos não-fermentativos.

    4. Secreções, digestão e absorção: Processos fermentativos.

    Instrumentos e Critérios de Avaliação'
