  lecture_credits: '4'
  objectives: 'da atividade

    Promover a interação entre a universidade e sociedade, com a participação dos
    alunos, buscando o comprometimento da comunidade universitária com interesses
    e necessidades do grupo alvo.

    Descrição da atividade

    Produção de vídeos disponibilizados publicamente sobre a história da ciência (como
    a vida e as contribuições científicas de Alan Turing, Stephen Cook e Noam Chomsky)
    e, considerando a grande relevância da Informática no mundo, sobre questões que
    possam ser de interesse da sociedade (como o que pode e o que não pode ser resolvido
    por computador e os tipos de problemas computacionais que existem). Promoção de

    seminários abertos sobre esses assuntos.

    Indicadores de avaliação da atividade'
