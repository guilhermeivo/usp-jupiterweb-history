  course: 'Aula 1: Introdução ao Curso de lmunologia. Estrutura do curso, atividades,
    e avaliações. Células do sistema imune e órgãos linfoides.

    Aula 2: Inflamação. Imunidade inata.

    Aula 3: Estrutura das moléculas envolvidas no reconhecimento de antígenos (MHC,
    TCR e BCR).

    Aula 4: Geração de receptores de antígenos de linfócitos.

    Aula 5: Apresentação  de antígenos.

    Aula 6: Desenvolvimento e sobrevivência de linfócitos.

    Aula 7: Imunidade mediada por células T.

    Aula 8: Imunidade mediada por células B.

    Aula 9: Sistema Complemento.

    Aula 10 : Imunidade a infecções l.

    Aula 11 : imunidade a infecções ll.

    Aula 12 : PROVA I

    Aula 13 : Técnicas de imunodiagnóstico.

    Aula 14 : imunorregulação e imunidade de Mucosas.

    Aula 15 : imunidade do recém-nascido e Vacinação.

    Aula 16 : Hipersensibilidades. Princípios e classificação.

    Aula 17 : Auto-imunidade. Princípios e classificação.

    Aula 18 : PROVA ll

    Aula 19 : PROVA SUBSTITUTIVA

    Instrumentos e Critérios de Avaliação'
