  course: "1.\tO que é um mapa; O que é Cartografia; O mapa para a Geografia; A representação\
    \ do espaço geográfico; As modalidades de organização do espaço geográfico; A\
    \ imagem e a Geografia; A linguagem.\n2.\tA Geografia e o mapa: ontem e hoje.\n\
    3.\tA composição do mapa: Escala, projeção cartográfica, métrica e linguagem (semiologia\
    \ gráfica).\n4.\tAs representações da cartografia temática, os coremas, as anamorfoses\
    \ e as redes.\n5.\tO trabalho com o mapa em sala de aula do ensino básico.\nA\
    \ disciplina conta com carga horária de PCC na qual são elaborados materiais didáticos\
    \ para o ensino de geografia a partir do uso da linguagem cartográfica."
  course_name: 'FLG0141 - Introducao a Cartografia

    Introduction to Cartography'
  deactivation: ''
  instructors: '1042170 - Fernanda Padovesi Fonseca

    1102750 - Ligia Vizeu Barrozo

    2848490 - Rubia Gomes Morato'
  lecture_credits: '4'
  objectives: O objetivo principal do curso é introduzir os estudantes no universo
    de outras formas de representação da paisagem e do espaço geográfico, além do
    texto escrito, que são indispensáveis para a explicitação dos conhecimentos em
    Geografia. É por meio da Cartografia que o aluno será capaz de representar, de
    forma gráfica e atemporal, as relações de simultaneidade do espaço geográfico.
    A ideia também é demonstrar que os produtos cartográficos além de apresentar resultados
    de estudos funcionam também como uma forma muito importante de aquisição de novos
    conhecimentos durante a execução de pesquisas. Por fim, demonstrar que a Cartografia
    assim entendida é um excelente instrumento pedagógico no ensino.
  practical_credits: '2'
  total_workload: '120 h

    (

    Práticas como Componentes Curriculares =  20 h

    )'
