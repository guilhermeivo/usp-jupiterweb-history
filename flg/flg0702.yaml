  course: "1.\t Educação, escola e sociedade: diferentes perspectivas no limite entre\
    \ reprodução e contestação.\n2.\tHistória da Formação Docente em Geografia: períodos,\
    \ sujeitos e processos.\n3.\tPerspectivas Atuais da Formação Docente em Geografia:\
    \ os saberes docentes e a reflexão sobre e na prática.\n4.\tAs questões Curriculares\
    \ e suas implicações na formação e no trabalho docente em Geografia.\n5.\tLinguagens\
    \ e tecnologias na Educação Geográfica: reflexões a partir do conceito de material\
    \ didático.\nAs  disciplina conta com 100 horas de estágio divididas da seguinte\
    \ forma:\n- 10 horas de contato inicial com a unidade escolar, com o intuito de\
    \ levantar as demandas acerca do ensino de geografia, para elaboração do projeto\
    \ de estágio.\n- 20 horas para construção do projeto de Estágio.\n- 30 horas para\
    \ execução do projeto de estágio na unidade escolar.\n- 10 horas para participação\
    \ na Jornada Geoensino / Semana de Geografia.\n- 10 horas para organização do\
    \ Seminário de Estágio]\n- 20 horas para elaboração do relatório de estágio.\n\
    A realização do estágio é atividade obrigatória para aprovação na disciplina."
  course_name: 'FLG0702 - Estágio Supervisionado de Ensino de Geografia e Material
    Didático

    Geography Teaching Internship and Didactic Material'
  deactivation: 31/12/2020
  instructors: '3493538 - Eduardo Donizeti Girotto

    1191312 - Maria Eliza Miranda'
  lecture_credits: '4'
  objectives: "1.\tDiscutir concepções de educação e escola, bem como suas implicações\
    \ no processo de formação docente e na Educação Geográfica.\n2.\tAnalisar as diferentes\
    \ dimensões que envolvem a formação e o trabalho do professor de geografia no\
    \ mundo contemporâneo.\n3.\tCompreender as mudanças e continuidades no processo\
    \ de formação docente em diferentes períodos históricos, com ênfase na relação\
    \ entre a Geografia Escolar e a Geografia Acadêmica mediada pelo processo de estágio\
    \ supervisionado.\n4. Produzir e refletir sobre o uso de materiais e recursos\
    \ didáticos na Educação Geográfica."
  practical_credits: '4'
  total_workload: '180 h

