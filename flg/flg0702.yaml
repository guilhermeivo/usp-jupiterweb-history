  course: '1. Educação, escola e sociedade: diferentes perspectivas no limite entre
    reprodução e contestação. 2. História da Formação Docente em Geografia: períodos,
    sujeitos e processos. 3. Perspectivas Atuais da Formação Docente em Geografia:
    os saberes docentes e a reflexão sobre e na prática. 4. As questões Curriculares
    e suas implicações na formação e no trabalho docente em Geografia. 5. As leis
    10639/03 e 11645/08, as relações étnico-raciais e o ensino de Geografia. 6. Linguagens
    e tecnologias na Educação Geográfica: reflexões a partir do conceito de material
    didático. A disciplina conta com 100 horas de estágio divididas da seguinte forma:
    - 10 horas de contato inicial com a unidade escolar, com o intuito de levantar
    as demandas acerca do ensino de geografia, para elaboração do projeto de estágio.
    - 20 horas para construção do projeto de Estágio. - 30 horas para execução do
    projeto de estágio na unidade escolar. - 10 horas para participação na Jornada
    Geoensino / Semana de Geografia. - 10 horas para organização do Seminário de Estágio]
    - 20 horas para elaboração do relatório de estágio. A realização do estágio é
    atividade obrigatória para aprovação na disciplina.'
  course_name: 'FLG0702 - Estágio Supervisionado de Ensino de Geografia e Material
    Didático

    Geography Teaching Internship and Didactic Material'
  deactivation: ''
  instructors: 3493538 - Eduardo Donizeti Girotto
  lecture_credits: '4'
  objectives: 1. Discutir concepções de educação e escola, bem como suas implicações
    no processo de formação docente e na Educação Geográfica. 2. Analisar as diferentes
    dimensões que envolvem a formação e o trabalho do professor de geografia no mundo
    contemporâneo. 3. Compreender as mudanças e continuidades no processo de formação
    docente em diferentes períodos históricos, com ênfase na relação entre a Geografia
    Escolar e a Geografia Acadêmica mediada pelo processo de estágio supervisionado.
    4. Produzir e refletir sobre o uso de materiais e recursos didáticos na Educação
    Geográfica.
  practical_credits: '4'
