  course: "1.\tNoções gerais de direito tributário. Legislação tributária: conceito,\
    \ objeto e conteúdo. O Estado e sua atividade financeira2.\tConceito de tributo3.\t\
    Relação jurídica tributária. Obrigação tributária. O fato gerador. Sujeitos da\
    \ obrigação tributária4.\tCrédito tributário. Constituição. Lançamento. Natureza\
    \ jurídica. Espécies5.\tSuspensão da exigibilidade do crédito tributário. 6.\t\
    Extinção do crédito tributário. 7.\tSistematização das categorias tributárias:\
    \ competência, não competência, incidência, não incidência, isenção, imunidade7.1\t\
    Espécies de Isenção. Limites.7.2\tInterpretação e Aplicação da Lei Tributária8.\t\
    Espécies tributárias. Tentativa de classificação. Fato gerador/destinação/justificação.8.1\t\
    \ Os impostos. Causa dos impostos. Fiscalidade e extrafiscalidade. Classificações\
    \ dos impostos.8.2\tAs taxas. O poder de polícia. Os serviços, sua especificibilidade\
    \ e divisibilidade. Taxa e preço público. Justificação das taxas 8.3\tContribuição\
    \ de melhoria. Justificação da contribuição de melhoria.8.4\tA parafiscalidade:\
    \ contribuições sociais. Justificação das contribuições sociais8.5\tContribuições\
    \ Especiais: Contribuições de intervenção no domínio econômico e de interesse\
    \ de categorias profissionais ou econômicas. Justificação das Contribuições Especiais.\
    \ Referibilidade8.6\tEmpréstimos compulsório. Justificação  dos Empréstimos Compulsórios.9.\t\
