  objectives: "1.\tApresentar, do ângulo jurídico, o universo dos problemas econômicos;\
    \ qualificá-lo para atividade profissional pertinente e prepará-lo para julgamento\
    \ crítico.2.\tDar ao aluno noção do conjunto dos problemas jurídicos do Direito\
    \ Tributário.3.\tInstruir o aluno de maneira a torná-lo capaz de utilizar-se da\
    \ doutrina, legislação e jurisprudência.4.\tLevar ao conhecimento do aluno as\
    \ principais categorias jurídicas da matéria tributária."
