  course: 'Evolução do jornalismo no rádio: conceitos e avaliação crítica.

    02. O conteúdo programático no rádio e o jornalismo.

    03. As manifestações jornalísticas no rádio.

    04. A linguagem oral e a linguagem radiofônica.

    05. A noticia em rádio: da fonte à transmissão.

    06. Regras de redação da notícia.

    07. A reportagem: captação e realização.

    08. Apresentação de programas jornalísticos.

    09. Expressão da opinião em rádio: entrevistas e debates.

    10. Prática.'
  course_name: 'CJE0603 - Radiojornalismo

    Broadcast Journalism'
  deactivation: ''
  instructors: 3203756 - Luciano Victor Barros Maluly
  lecture_credits: '4'
  objectives: A disciplina tem como finalidade estudar e avaliar as manifestações
    jornalísticas no rádio, preparando os alunos para a utilização das técnicas de
    elaboração de programas jornalísticos, desenvolvendo o conhecimento das potencialidades
    do meio, aliado ao estudo crítico do jornalismo praticado no rádio atual.
  practical_credits: '2'
  total_workload: 120 h
  type: Semestral
