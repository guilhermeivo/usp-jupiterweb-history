  assessment: 'Poderão realizar a recuperação os estudantes que obtiverem frequência
    mínima de 70% e média final entre 3,0 е

    4,9 na primeira avaliação. A recuperação consistirá em uma prova adicional, cuja
    nota será utilizada para o cálculo da média final, obtida pela média aritmética
    entre a nota final obtida na disciplina e a nota obtida na prova de recuperação.
    Será considerado aprovado o estudante que obtiver média final igual ou superior
    a 5,0 após a recuperação. A prova de recuperação será oferecida na época estabelecida
    pelo Calendário Escolar da USP.'
