  course_name: 'BIO0225 - Genética e Evolução

    Genetics and Evolution'
  deactivation: ''
  instructors: 8699071 - Sonia Cristina da Silva Andrade
  lecture_credits: '3'
  objectives: Os fenótipos apresentados por todos os organismos dependem da coordenação
    espacial e  temporal da expressão de conjuntos de genes e de sua interação com
    o ambiente, desde embriogênese ao indivíduo adulto. Entender os mecanismos de
    funcionamento, herança e evolução destes genes e a arquitetura das redes constituídas
    por eles são as questões centrais da Genética. Assim, o objetivo da disciplina
    é estudar os processos subjacentes aos fenótipos observados e seus mecanismos
    de herança e evolução aplicados a questões veterinárias.
  practical_credits: '0'
  total_workload: 45 h
  type: Semestral
