courses:
  activation: 01/01/2013
  assessment: Para quem perder a prova ou não conseguir realiza-la com aproveitamento
    satisfatorio, será solicitado um trabalho monográfico sobre tópico da disciplina.
  bibliography: 'ELLET, William. The case study handbook: how to read, discuss, and
    write persuasively about cases. Massachussetts, Harvard Business School Press,
    2007.

    HANCOCK, Dawson R.; ALGOZZINE, Bob. Doing case-study research.

    New York, Columbia University Press and Teachers College Press, 2006.

    STAKE, Robert E. The art of case study research. London, Sage, 1995.

    SYKES, Vanda - "Validity and reliability in qualitative marketing research" Review
    of Literature Journal, The Market Research Society, Vol. 32, n. 3, July, 1990.

    YIN, Robert K. Case Study Research: Design and Methods. London, Sage, 2003.'
  course: '1.Introdução à metodologia do estudo de caso

    2.Modos de observação da realidade

    3.Seleção dos conteúdos de interesse.

    4.Processo de classificação de dados.

    5.Sistematização dos dados pré-selecionados e classificados.

    6.Distribuição dos conjuntos classificados.

    7.Análise preliminar de dados, por conjuntos.

    8.Análise sistêmica dos conteúdos de interesse.

    9.Suposição de resultados.

    10.Equívocos frequentes em estudos de caso.

    11.Superação de equívocos em estudos de caso.

    12.Conclusões lógicas.

    13.Conclusões estimadas.

    14.Função da pesquisa em estudos de caso.

    15.Conclusão e avaliação da disciplina.'
  course_name: 'CRP0499 - Metodologia de Case-Study para realização de Trabalho de
    Conclusão de Curso

    Case Study for Improving Monographies'
  deactivation: ''
  instructors: 2087151 - Victor Aquino Gomes Correa
  lecture_credits: '2'
  objectives: Usualmente a realização do trabalho de conclusão de curso, ou em relações
    públicas, ou em publicidade e propaganda, ou em turismo, pode se converter em
    problema. Problema que pode acarretar desnecessária delonga, atrasando, ou mesmo
    inviabilizando a realização dessa etapa tão indispensável, quanto fundamental
    para a graduação em qualquer um desses cursos. Seja do ponto de vista de escol
    ha do tema, seja de opção para abordagem do assunto escolhido, as dificuldades
    podem acarretar indecisão quanto a realizar o trabalho, ou imprecisão no tratamento
    dos primeiros dados disponíveis para isso. Nem sempre as metodologias convencionais,
    como pesquisa empírica quantitativa, ou os métodos de pesquisa qualitativa, ou
    ainda as chamadas pesquisas monográficas de gabinete tornam-se úteis nas abordagens
    mais próximas da utilidade prática profissional. Nesse sentido, a proposta da
    presente disciplina visa a suprir os conteúdos para observação, seleção, classificação
    e análise de dados em estudos de caso.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
