  course: 'Teórica:

    Introdução, histórico e evolução da Nutrição Mineral das Plantas

    Fundamentos da absorção, transporte e redistribuição dos elementos nas plantas

    Absorção de íons pelas folhas: teoria e fundamentos'
  course_name: 'LSO0420 - Nutrição Mineral de Plantas

    Plant Mineral Nutrition'
  deactivation: ''
  instructors: '7921125 - Paulo Sergio Pavinato

    3542866 - Rafael Otto

    5211881 - Tiago Tezotto'
  lecture_credits: '4'
  objectives: Dar visão aos estudantes de graduação em Engenharia Agronômica e Engenharia
    Florestal dos fundamentos da nutrição mineral de plantas, funções dos nutrientes
    nas plantas, avaliação do estado nutricional, sintomas de deficiência e toxidez
    de nutrientes, soluções nutritivas e temas recentes associados à nutrição mineral
    de plantas. A disciplina fundamenta os alunos sobre uso eficiente de fertilizantes
    e manejo nutricional de plantas.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
