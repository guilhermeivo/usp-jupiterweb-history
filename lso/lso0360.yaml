  objectives: Capacitar o aluno a entender os processos de degradação ambiental, compreender
    as suas causas, conseqüências e impactos ambientais. Avaliar as formas de recuperação
    mais adequadas em situações específicas. Estabelecer as ações de recuperação definidas
    pelas características do entorno e pelo histórico de degradação.
  practical_credits: '1'
