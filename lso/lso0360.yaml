  course: 'Introdução: Principais conceitos e objetos de estudo.

    As principais funções do solo e os mecanismos de sua degradação.

    Erosão do solo como um mecanismo de degradação ambiental.

    Degradação química de solos.

    Recuperação de solos degradados.

    Características e importância da vegetação ciliar.

    Recuperação de florestas ciliares. Meios e modos.

    A importância de programas de revegetação ciliar e as perspectivas da ecologia
    de restauração.

    Adequação ambiental de unidades naturais e unidades de produção.

    Degradação e recuperação de áreas litorâneas (mangue e restinga).

    Recuperação de áreas de mineração.

    Manutenção, degradação e recuperação da qualidade da água.

    Planejamento conservacionista.

    Manejo e conservação de bacias hidrográficas.'
  course_name: 'LSO0360 - Recuperação de Áreas Degradadas

    Restoration of Degraded Lands'
  deactivation: ''
