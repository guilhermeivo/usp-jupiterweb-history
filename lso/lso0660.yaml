  course: 'Módulo 1: Caracterização e cartografia do ambiente físico; sistemas de
    avaliação de terras e manejo do solo.

    a) Levantamento e mapeamento de solos (desenvolvimento e interpretação), relevo
    e clima.

    b) Sensoriamento remoto, geoprocessamento e bancos de dados relacionais: interpretação
    de imagens de satélites, fotopedologia e suas relações com relevo e caracterização
    de solos; estudo do solo pela sua energia eletromagnética refletida e suas implicações
    no processo agrícola e ambiental; relações/interpretações relacionadas a levantamento,
    mapeamento, fertilidade dos solos, uso da terra e práticas agrícolas.

    c) Histórico e situação contemporânea dos sistemas de classificação de terras.

    d) Sistemas e procedimentos de avaliação de terras visando a definição de aptidão
    agrícola, zoneamento agroambiental e capacidade de uso.

    e) Sistemas e procedimentos visando zoneamento ambiental estratégico e definição
    de áreas de risco.

    f) Ambientes de produção e grupos de manejo.

    Módulo 2: Avaliação, recomendação, funcionalidade e planejamento das alternativas
    de controle da erosão do solo.

    a) A situação da agricultura brasileira em relação à erosão do solo: evolução
    histórica e situação contemporânea. Principais regiões e culturas sensíveis à
    erosão.

    b) Mecânica do processo erosivo. Formas de erosão do solo.

    c) Impactos intrínsecos e extrínsecos da erosão do solo.

    d) Interpretação das características do solo visando o controle da erosão do solo.

    e) Manejo da cobertura do solo visando o controle da erosão do solo: restos de
    cultura, tratos culturais, plantas de cobertura, adubação verde e plantio direto.

    f) Práticas mecânicas de controle da erosão do solo: recomendação, dimensionamento,
    e construção de terraços e canais escoadouros.

    g) Políticas públicas voltadas à conservação do solo: matas ciliares, legislação
    e programas de microbacias hidrográficas.

    h) Conservação de estradas rurais e controle de grandes erosões.

    Módulo 3:  Manejo de solos agrícolas

    a) Introdução ao manejo do solo;

    b) Sistemas de preparo do solo.

    c) Manejo de solos com restrições físicas ao desenvolvimento do sistema radicular.

    d) Manejo de solos com restrições químicas e biológicas ao desenvolvimento do
    sistema radicular.

    e) Manejo de solos arenosos.'
  course_name: 'LSO0660 - Tecnologia do Solo

    Soil Technology'
  deactivation: ''
  instructors: '56361 - Gerd Sparovek

    74052 - Jose Alexandre Melo Dematte

    8398051 - Maurício Roberto Cherubin'
  lecture_credits: '4'
  objectives: 'a. Abordar os temas aplicados da ciência do solo como uma continuidade
    do desenvolvimento conceitual de suas áreas básicas (física, química, biologia
    do solo e pedologia);

    b. Demonstrar e discutir as vantagens e restrições das tecnologias de melhoramento
    funcional do solo considerando seu papel na produção agrícola, ciclo hidrológico
    e conservação de recursos naturais e genéticos;

    c. Capacitar o aluno na elaboração de projetos de planejamento do uso da terra
    para fins agrícolas e ambientais.'
