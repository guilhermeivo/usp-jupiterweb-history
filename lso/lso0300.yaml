  course: 'Teórico:

    Composição do solo: composição química: as fases sólida, líquida e gasosa do solo;
    equilíbrio entre as fases do solo. Cargas elétricas do solo: origem, natureza
    e caráter das cargas elétricas do solo; cargas constantes e cargas variáveis;
    ponto de carga zero e carga líquida do solo. Adsorção e troca de íons: adsorção
    e troca catiônica; capacidade de troca catiônica (CTC); CTC efetiva; os cátions
    trocáveis; soma de bases e saturação por bases; saturação de alumínio; adsorção
    e trocas de ânions; adsorção específica e não específica. Reação do solo: conceito
    e importância; origem da acidez e alcalinidade do solo; influência sobre a disponibilidade
    de nutrientes e o crescimento de plantas; o poder tampão do solo. Acidez do solo:
    conceitos e causa da acidez, componentes de acidez do solo. Conceitos de matéria
    orgânica do solo (MOS). Constituintes: Pluviolixiviados; Serapilheira e restos
    de culturas; Raizes e exsudatos; Substâncias não húmicas e Substâncias húmicas.
    Características químicas da MOS: Composição elementar e estruturas moleculares
    das substâncias húmicas; Propriedades coloidais das substâncias húmicas. MOS e
    atributos químicos do solo. Efeito da MOS nos atributos químicos do solo: Efeito
    na CTC e na ciclagem de nutriente no sistema solo-planta; Processos de formação
    de complexos estáveis com cátions; Reações envolvendo íons metálicos. Óxi-redução
    no solo: Conceito básico; Transformações químicas de elementos essenciais; redutores
    ou doadores de elétrons do solo; oxidantes ou receptores de elétrons; transformações
    em solos inundados. Nitrogênio do solo: formas de ocorrência; conteúdo e distribuição
    do perfil; flutuação do N assimilável; ganhos e perdas de N do solo; mineralização
    e imobilização; nitrificação e desnitrificação; manutenção do N no solo; o ciclo
    do N. Fósforo do solo: teor e distribuição no perfil; formas de ocorrência; adsorção
    e dessorção; precipitação e dissolução dos compostos inorgânicos de P; mineralização
    e imobilização; fósforo disponível; equilíbrio entre as formas de P; o ciclo do
    P. Potássio do solo: conteúdo e distribuição no perfil; formas de ocorrência;
    equilíbrio entre as formas de K; disponibilidade no solo; perdas do solo; o ciclo
    do K. Cálcio e magnésio do solo: conteúdo e distribuição no perfil; formas de
    ocorrência; formas disponíveis de Ca e Mg e utilização pelas plantas; perdas do
    solo; o ciclo do Ca e Mg. Enxofre do solo: conteúdo e distribuição no perfil;
    formas de ocorrências; o S disponível; mineralização e imobilização do S; oxidação
    e redução; adição e perdas do solo; o ciclo do S. Micronutrientes do solo: conteúdo
    e distribuição no perfil; formas de ocorrência; fatores que afetam a disponibilidade;
    condições favoráveis à ocorrência de deficiência e toxidez; Conceito de solo fértil
    e solo produtivo; elementos essenciais; leis da fertilidade do solo.

    Prático:

    Uso de unidades do Sistema Internacional em Química e Fertilidade do Solo. Métodos
    de avaliação da fertilidade do solo: Amostragem de terra para fins de fertilidade:
    planejamento da amostragem e coletas de amostras de terra (campo); Análises químicas
    da terra para fins de fertilidade: extratores e métodos analíticos; conferência
    de resultados; classes de teores e interpretação de resultados. Ensaios demonstrativos
    (estudos de casos - dinâmica em grupos): A: Avaliação da fertilidade de solos
    da região de Piracicaba. B: Alterações nos atributos do solo após aplicação de
    calcário e de fertilizantes N-P-K e sua relação com a resposta das culturas.'
  course_name: 'LSO0300 - Química e Fertilidade do Solo

    Soil Chemistry and Fertility'
  deactivation: ''
