  lecture_credits: '4'
  objectives: A disciplina tem o objetivo de apresentar ao estudante informações a
    respeito das características do solo e dos fenômenos químicos que nele ocorrem,
    e que o tornam um meio adequado ao fornecimento de nutrientes às plantas em quantidades
    suficientes e balanceadas, de forma a permitir altas taxas de crescimento e produtividade
    das culturas.
