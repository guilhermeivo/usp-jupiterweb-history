    SMITH, S.E. AND READ, D.J. Mycorrhizal symbiosis. 2nd ed.  San Diego : Academic
    Press, 1997.

    SUBBA RAO, N.S. Soil microorganisms and plant growth. 3rd ed. Lebanon, NH Science
    Publishers, Inc., 1995.'
  course: "1.\tMicrobiologia do Solo em perspectiva\n2.\tO solo como habitat para\
    \ organismos.\n3.\tA comunidade microbiana dos solos.\n4.\tEcologia dos microrganismos\
    \ do solo.\n5.\tEcofisiologia da rizosfera.\n6.\tMetabolismo microbiano.\n7.\t\
    Biodegradação.\n8.\tTransformações do carbono e a matéria orgânica do solo.\n\
    9.\tTransformações do nitrogênio no solo.\n10.\tFixação biológica do nitrogênio.\n\
    11.\tTransformações do fósforo no solo.\n12.\tMicorrizas.\n13.\tTransformações\
    \ do enxofre e outros elementos no solo.\n14.\tFauna do solo."
  course_name: 'LSO0400 - Biologia do Solo

    Soil Biology'
  deactivation: ''
  instructors: 2976163 - Fernando Dini Andreote
  lecture_credits: '2'
  objectives: Capacitar os estudantes de graduação a avaliar processos biológicos
    que ocorrem no solo e sua relação com as transformações biogeoquímicas de diferentes
    espécies químicas de interesse para a produção agrícola e florestal, bem como
    para a qualidade do ambiente.
