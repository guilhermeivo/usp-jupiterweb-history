  course: 'TEÓRICO-PRÁTICO:

    - Fatores de produtividade agrícola, conceito e importância da adubação. Fatores
    de perdas dos fertilizantes. Importância do Brasil na produção de alimentos, fibras
    e energia.

    - Corretivos, fertilizantes e condicionadores do solo, conceitos básicos, classificação,
    amostragem para fins de caracterização e análise de acordo com a legislação vigente.

    - Propriedades químicas, físico-químicas e físicas dos corretivos e fertilizantes.

    - Cálculo de formulações comerciais com e sem carga.

    - Corretivos agrícolas: uso eficiente do calcário.

    - Condicionadores de solo: uso eficiente do gesso agrícola

    - Fertilizantes nitrogenados: obtenção, características e ação fertilizante.

    - Fertilizantes fosfatados: obtenção, características e ação fertilizante.

    - Fertilizantes potássicos, cálcicos e magnesianos: obtenção, características
    e ação fertilizante.

    - Fertilizantes com enxofre e micronutrientes: obtenção, características e ação
    fertilizante.

    - Fertilizantes orgânicos e organomineral: fontes, caracterização, utilização,
    ação fertilizante e emprego isolado ou na forma de compostagem.

    - Adubos verdes: conceito, benefícios, principais adubos verdes, utilização e
    manejo.

    - Recomendação de práticas corretivas e de adubação em culturas anuais (milho,
    soja, feijão e algodão)

    - Recomendação de práticas corretivas e adubação em culturas perenes e cana-de-açúcar'
  course_name: 'LSO0526 - Adubos e Adubação

    Fertilizers and Fertilization'
  deactivation: 31/12/2023
  instructors: '7921125 - Paulo Sergio Pavinato

    3542866 - Rafael Otto'
  lecture_credits: '2'
  objectives: '- Desenvolver o senso crítico dos alunos em relação ao papel dos fertilizantes
    na produção de alimentos

    - Apresentar as características e propriedades dos principais tipos de fertilizantes
    sólidos e líquidos

    - Preparar o aluno para ter conhecimentos básicos quanto à tecnologia de obtenção,
    ação e utilização de corretivos, gesso agrícola e fertilizantes minerais.

    - Fornecer ao aluno subsídios para o uso, manejo e obtenção de adubos verdes e
    orgânicos.

    - Apresentar aos alunos as melhores técnicas de manejo para uso eficiente dos
    fertilizantes e corretivos na agricultura brasileira.'
  practical_credits: '1'
  total_workload: 60 h
  type: Semestral
