  course: '1. Introdução ao estudo de solos; importância para a gestão ambiental;
    conceito de solo.

    2. Frações sólidas do solo; mineralogia do solo; propriedades dos colóides do
    solo: húmus e argila.

    3. Fases líquida e gasosa do solo.

    4. Atributos físicos e água do solo: estrutura, textura e consistência do solo;
    cor do solo; densidade do solo e das partículas; porosidade do solo e compactação;
    importância da água; movimento e retenção da água no solo; o solo e o ciclo hidrológico.

    5. Formação do solo: materiais de origem, fatores e processos de formação; perfil  e
    horizontes do solo

    6. Classificação de solos: Sistema Brasileiro de Classificação de Solos (SiBCS);
    principais classes de solos.

    7. Biologia do solo: ação dos macro e microrganismo do solo; ciclos biogeoquímicos;
    bioprospecção e biorremediação.

    8. Matéria Orgânica do solo.

    9. Fertilidade do solo e ciclagem de nutrientes: adsorção e troca iônica; reação
    do solo; saturação por bases; acidez do solo; importância e relações do solo com
    as plantas.

    10.  Processos de degradação e poluição do solo: impactos ambientais das atividades
    agrícola e industrial; caracterização de resíduos agrícolas e industriais; recuperação
    de solos contaminados; uso urbano do solo e seus impactos.

    11. Solos e a produção agrícola.'
  course_name: 'LSO0257 - Fundamentos de Ciência do Solo

    Soil Science Fundamentals'
  deactivation: ''
  instructors: 8398051 - Maurício Roberto Cherubin
  lecture_credits: '4'
  objectives: Dar ao aluno a formação básica para caracterizar e utilizar os diferentes
    solos, particularmente os existentes na região tropical, a fim de capacitá-lo
    a compreender a importância dos fatores edafológicos na preservação do ambiente.
  practical_credits: '1'
  total_workload: 90 h
