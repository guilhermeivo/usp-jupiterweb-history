  course: '1.Administração. Diagnóstico institucional e ambiental. Desenvolvimento
    de planos de ação. Processo decisório. Gestão de projetos. Gerenciamento de resistência
    a mudanças. Negociação e administração de conflitos. Desenvolvimento organizacional.
    Planejamento, implementação e controle de Projetos. Planejamento e monitoramento
    do uso de recursos e serviços ambientais.  Adoção de sistemas de gestão ambiental.

    2. Gerência Ambiental. Acompanhamento dos processos de decisão, envolvendo a alocação
    de recursos e serviços ambientais.  Elaboração de estudos e relatórios de impacto
    ambiental.

    3. Política e Legislação Ambiental. Definição de políticas públicas, fortalecimento
    de instituições políticas e não governamentais, acompanhamento de ações civís
    e da atuação dos orgãos da administração pública ambiental.

    4. Auditoria e Certificação Ambiental. Participação em processos de aplicação
    de padrões de certificação e auditagem ambiental.  Desenvolvimento e estudo de
    critérios e indicadores de sustentabilidade.

    5. Educação Ambiental, Comunicação e Sociologia. Envolvimento em programas de
    conscientização ambiental, educação e cidadania. Desenvolvimento de meios de comunicação
    e marketing que contribuam para o aumento da sensibilidade e percepção dos problemas
    ambientais. Atenuação de conflitos sociais resultantes da ação conflituosa com
    o meio.'
