courses:
  activation: 15/07/2018
  assessment: Não há recuperação na disciplina de Estágio Vivencial.
  bibliography: A ser indicada pelo departamento responsável.
  course: 'O Estágio Vivencial em Ciências Biológicas terá um programa para cada estudante
    ou grupo de estudantes, elaborado de comum acordo com o seu orientador. O conteúdo
    do programa será delineado de modo a enquadrar-se em uma das seguintes áreas de
    atuação:

    Pesquisa: Elaboração de projetos de pesquisa específicos, identificação de problemas,
    delineamento experimental, redação de projetos, execução, coleta de dados, análise
    e interpretação e redação do relatório final de pesquisa.

    Ensino: Técnicas de ensino, princípios pedagógicos e didáticos. Avaliação do aprendizado
    e modelos de avaliação. Prática de ensino teórico e aplicado.

    Extensão: elaboração e execução de projetos de manejo ambiental; participação
    de equipes multidisciplinares na pesquisa e no uso de recursos naturais renováveis;
    gerenciamento e execução de tarefas técnicas nas diferentes áreas do conhecimento
    biológico.'
  course_name: '0110700 - Estágio Vivencial em Ciências Biológicas

    Experimental Internship in Biological Sciences'
  deactivation: ''
  instructors: 792922 - Flávio Bertin Gandara Mendes
  lecture_credits: '2'
  objectives: Complementar a formação e o aprimoramento acadêmico do estudante constituindo
    uma oportunidade para aquisição de experiência pré-profissional. Proporcionar
    ao estudante a oportunidade de vivenciar a prática diária de sua profissão.
  practical_credits: '8'
