courses:
  activation: 15/07/2018
  assessment: Não há recuperação na disciplina de Estágio Vivencial.
  bibliography: '7. BIBILOGRAFIA BÁSICA: a ser indicada pelo departamento responsável.'
  course: 'Produção: Análise de recursos, projeto de implantação e cronograma de implantação,
    técnicas de execução, previsão de produção e planejamento econômico.  Manejo de
    recursos naturais e insumos.

    Pesquisa:  Elaboração de projetos de pesquisa específicos, identificação de problemas,
    delineamento experimental, redação de projetos, execução, coleta de dados, análise
    e interpretação e redação do relatório final de pesquisa.

    Ensino: Técnicas de ensino, princípios pedagógicos e didáticos. Avaliação do aprendizado
    e modelos de avaliação. Prática de ensino teórico e aplicado.

    Transformação: Estudo, acompanhamento e execução de casos específicos de transformação
    de matéria prima de origem agropecuária. Estudos dos processos envolvidos em seus
    aspectos, de engenharia e de avaliação qualitativa, tanto na esfera rural quanto
    na industrial.

    Administração: Análise e planejamento da gerência de projetos agropecuários.

    Extensão: Estudo e aplicação dos princípios e técnicas de divulgação de conhecimentos
    e práticas visando o aumento da produtividade e da eficiência nas operações de
    produção.'
  course_name: '0110660 - Estágio Vivencial em Engenharia Agronômica

    Experimental Internship in Agriculture'
  deactivation: ''
  instructors: 93551 - Sônia Maria De Stefano Piedade
  lecture_credits: '2'
  objectives: Complementar a formação e o aprimoramento acadêmico do estudante constituindo
    uma oportunidade para aquisição de experiência pré-profissional. Proporcionar
    ao estudante a oportunidade de vivenciar a prática diária de sua profissão.
