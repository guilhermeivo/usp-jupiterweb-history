  objectives: '1 GERAIS: propiciar o conhecimento básico sobre os conceitos de saúde
    e qualidade de vida. 2-ESPECÍFICOS: Conhecimento sobre os processos de saúde e
    doença e seus condicionantes e consequência para populações humanas. Conhecer
    os métodos epidemiológicos.'
