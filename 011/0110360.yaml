  course: '1-Definição e objetivos; conceitos básicos; aspectos históricos: epidemiologia,
    saúde pública e nível de qualidade de vida. 2- Bases da pesquisa epidemiológica:
    problemas epidemiológicos; análise e explicitação do problema epidemiológico;
    variáveis epidemiológicas. 3- Indicadores epidemiológicos: introdução; morbidade;
    a medida da morbidade (prevalência e incidência); mortalidade (coeficientes de
    mortalidade - geral, infantil e por causas); esperança de vida. Índices e coeficientes
    estatísticos adotados em saúde pública. 4- Metodologia de pesquisa epidemiológica:
    pesquisa epidemiológica; hipóteses epidemiológicas; estudos ecológicos e seccionais;
    estudos de coortes; estudos caso-controle; estudos de intervenção. Padrões de
    distribuição de doenças: dimensão temporal; variação cíclica e variação sazonal;
    tendência secular. Determinantes do processo de transição demográfica, epidemiológica
    e nutricional Aspectos éticos envolvendo pesquisas com seres humanos.'
  course_name: '0110360 - Qualidade de Vida e Saúde

    Quality of Life and Health'
  deactivation: ''
