  bibliography: "6.\tBIBILOGRAFIA BÁSICA: a ser indicada pelo departamento responsável."
  course: 'O Estágio Profissionalizante em Economia  terá um programa para cada estudante
    ou grupo de estudantes, elaborado de comum acordo com o seu orientador. O conteúdo
    do programa será delineado de modo a enquadrar-se em uma das seguintes áreas de
    atuação:

    a) Economia da Produção: Análise econômico-financeira de recursos e de projetos
    agroindustriais.

    b) Economia de Transformação: Estudo dos processos de transformação envolvidos
    em seus aspectos econômicos e de análise qualitativa, tanto na esfera rural quanto
    na industrial.

    c) Administração: Análise e planejamento da gerência de projetos econômicos.

    d) Pesquisa: Elaboração de projetos de pesquisa, identificação de problemas, desenvolvimento
    de metodologias e execução do projeto (coleta de dados, análise, interpretação
    e relatório final).

    e) Consumo: Aplicação de princípios econômicos e administrativos em empresas do
    elo final da cadeia de produtos alimentícios.'
  course_name: '0110603 - Estágio Profissionalizante em Ciências Econômicas

    Professional Internship in Economics'
  deactivation: ''
  instructors: 5098002 - Carlos Eduardo de Freitas Vian
