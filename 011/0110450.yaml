  course: '1) Aspectos de produção e recursos ambientais relacionados a captura; 2)
    Sistemas de produção em aquicultura; 3) O pescado como matéria-prima. Aspectos
    bioquímicos, microbiológicos, toxicológicos, sensoriais e nutricionais. Legislação
    para comercialização e fiscalização; 4) Aspectos comerciais de abastecimento do
    pescado no país e exportação; 5) Aspectos higiênicos do pescado como alimento,
    métodos de sanitização; 6) Uso do frio para distribuição. Refrigeração e gelo
    no comércio e na armazenagem pré-industrial; 7) Congelamento do pescado. Tipos
    e controle de qualidade dos produtos;  8) Uso de agentes para diminuição da aw,
    secagem combinada; fermentação; defumação; 9) Uso de calor no processamento de
    pescado; 10) O pescado na culinária, elaboração de produtos em pequena escala,
    culinária nacional e internacional, 11) Inovação e Desenvolvimento de produtos:
    minced, surimi, quenelle, análogos; 12) Utilização de resíduos da cadeia produtiva
    do pescado visando a sustentabilidade. 13)Implementação de ferramentas de qualidade
    na cadeia produtiva do pescado. 14) Aulas práticas relativas aos processamentos
    e visitas técnicas.'
  course_name: '0110450 - Inovação e Qualidade na Cadeia Produtiva do Pescado

    Innovation and Quality on Seafood and Freshwater Fish Sector'
  deactivation: ''
  instructors: '5152941 - Brunno da Silva Cerozi

    1907305 - Thais Maria Ferreira de Souza Vieira'
  lecture_credits: '4'
  objectives: Apresentar aspectos de produção, industrialização e comercialização
    do pescado no Brasil, incluindo os pontos críticos ambientais, na captura/produção,
    abastecimento e comercialização, sustentabilidade, higiene e qualidade do pescado.
    Abordar a transformação da matéria-prima, envolvendo seleção de processos, implementação
    de ferramentas de qualidade, embalagens, transporte e logística. Oferecendo aos
    alunos matriculados a oportunidade de conhecer todos os elos desta cadeia produtiva.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
