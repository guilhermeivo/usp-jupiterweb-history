  lecture_credits: '4'
  objectives: Fornecer conhecimentos básicos sobre os principais sistemas de produção
    agrícola, florestal e zootécnica no Brasil,  a origem e a história da agricultura,
    das ciências florestais e da zootecnia, os aspectos relacionados com  a domesticação
    de plantas e animais e sua utilização para atender às demandas da sociedade. Assinalar
    a oportunidade da inserção do biólogo nas pesquisas básicas voltadas para os sistemas
    produtivos.  Avaliar os impactos ambientais dos agroecossistemas e a forma de
    minimizá-los.
