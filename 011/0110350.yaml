  course: "Introdução à Agricultura\na) Origem e História da agricultura;\nb) A revolução\
    \ verde\nc) O advento dos insumos modernos de produção\nd) Os perigos do uso indiscriminado\
    \ de defensivos\ne) Atual estado da arte\nf)Bases para a elaboração de Sistemas\
    \ de produção eficientes, racionais e sustentáveis.\nEcossistema versus Agroecossistema\n\
    a) Conceituação e importância\nb) Estrutura-função\nc) Leis ecológicas básicas\n\
    d) Características do agroecossistema em comparação ao ecossistema natural\ne)\
    \ Limitações do agrecossistema\nf) Estrategistas\x94k\x94 e \x93r\x94\ng) O sonho\
    \ da sustentabilidade\nh) Estratégias básicas de manejo\nCiclos biogeoquímicos\
    \ e Balanço energético\na) Nutrientes essenciais à vida vegetal\nb) Fontes dos\
    \ nutrientes na agricultura\nc) Relações solo-planta-atmosfera\nd) Os ciclos biogeoquímicos\n\
    e) Agricultura versus Energia\nf) Balanço energético\nO Sistema de Plantio Direto\n\
    a) Breve histórico\nb) Conceituação e importância\nc) Principais vantagens de\
    \ sua plena adoção\nd) O plantio Direto no Brasil\ne) A contribuição do Sistema\
    \ de Plantio Direto para a ambiente\n(ênfase a manutenção da biodiversidade, redução\
    \ do uso de defensivos, redução do potencial poluidor do nitrogênio e seqüestro\
    \ de carbono)\nPrincípios Básicos de Adubação Verde, Integração Lavoura-Pecuária,\
    \ Rotação de Culturas e Consorciação de culturas.\nSistemas de Produção na Empresa\
    \ Agrícola\na) Princípios básicos de gerenciamento\nb) Integração de atividades\n\
    c) Visão holística do processo\nd) Gestão de processos\ne) Gestão por qualidade\n\
    Principais biomas florestais\nAspectos ecológicos, silviculturais e econômicos.\
    \ Caracterização geral das florestas. Florestas sempre-verdes, caducifólias e\
    \  semicaducifólias. Florestas pluviais tropicais, florestas boreais, florestas\
    \ temperadas, florestas esclerófilas, florestas de monções e florestas de altitude.\
    \ A floresta amazônica, a mata atlântica e as florestas de araucárias.As florestas\
    \ e o ambiente. Efeito das florestas sobre o regime hídrico e o efeito estufa.\n\
    Estrutura florestal\nEstrutura da floresta natural e das plantações florestais.\
    \ Componentes do perfil florestal. A energia radiante nas florestas e reflexos\
    \ no microclima. A dinâmica do ecossistema florestal e da sucessão florestal.\
    \ Elementos de hidrologia florestal:  conceito de microbacia hidrográfica, evaporação\
    \ da água, interceptação, infiltração, armazenamento e variações no deflúvio.\
    \ Qualidade da água.\nManejo florestal\nConceito de manejo florestal sustentável.\
    \ Uso das florestas plantadas e seu reflexo sobre os recursos naturais renováveis.\
    \ Caracterização das plantações florestais dentro do processo de sucessão ecológica.\
    \ Implantação de florestas para fins ecológicos e econômicos: povoamentos puros\
    \ e mistos. Plantios de enriquecimento. Uso das plantações florestais na revegetação\
    \ e recuperação de áreas degradadas. Produtividade primária das plantações florestais.\
    \ Conceitos de incremento e de volume madeireiro.\nNutrientes e sustentabilidade\
    \ florestal\nA ciclagem dos nutrientes nas plantações florestais e a sustentabilidade.\
    \ Os ciclos geoquímico, biogeoquímico e bioquímico. Impacto das plantações florestais\
    \ no equilíbrio hidrológico. Plantações florestais e conservação da biodiversidade.\
    \ Planejamento ambiental e conservação da biodiversidade em áreas florestadas.\
    \ A proteção dos fragmentos florestais, visando sua conservação e biodiversidade.\
    \ Elementos de legislação ambiental aplicada aos recursos florestais. Domesticação\
    \ de espécies florestais exóticas e nativas para reflorestamento. Observação de\
    \ viveiros florestais e atividades silviculturais.\nOrigem e domesticação de animais\n\
    a) Os animais domesticados: ovinos, caprinos, bovinos, suínos, galinhas, perus\
    \ e outras espécies;\nb) Locais de origem e habitat natural;\nc) Teorias da domesticação\
    \ e domesticação das principais espécies;\nd) Alterações genéticas, fisiológicas,\
    \ morfológicas e comportamentais impostas pela domesticação.\nMelhoramento genético\
    \ de animais\na) Adaptação da forma à função decorrente da domesticação;\nb) Raças:\
    \ formação, aptidão e importância;\nc) Seleção e sistemas de cruzamento;\nd) Linhagens\
    \ e \"híbridos\".\nProdutos de origem animal\na) Importância econômica e social\
    \ da produção animal;\nb) Produtos para alimentação: carne, leite, ovos;\nc) Produtos\
    \ para confecção: lã, pele, couro.\nd) Produtos especiais: plumas, penas, cerdas;\n\
    e) Subprodutos e sua reciclagem.\nNutrição e alimentação animal\na) Nutrição e\
    \ nutrientes;\nb) Digestão e metabolismo dos nutrientes em ruminantes e não ruminantes;\n\
    c) Características químicas e nutricionais dos alimentos;\nd) Rações e exigências\
    \ nutricionais;\ne) Alimentação dos animais.\nControle biológico de insetos e\
    \ seu impacto no meio ambiente"
