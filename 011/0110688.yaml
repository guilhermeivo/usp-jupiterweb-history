  objectives: A disciplina visa capacitar futuros profissionais de ciências agrárias
    a conhecer os produtos fitossanitários, de modo mais profundo, envolvendo o seu
    desenvolvimento, características, uso correto  e seguro  e tecnologia de aplicação.
