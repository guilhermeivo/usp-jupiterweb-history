  course: 'Importância e alternativas de manejo de pragas agrícolas. Importância,
    evolução, produção e registro de produtos fitossanitários. Legislação sobre produtos
    fitossanitários, com ênfase a responsabilidade civil e criminal. Formulações e
    eficiência agronômica dos produtos fitossanitários. Registro de produtos fitossanitários:
    avaliação agronômica, ecotoxicológica (impactos no ambiente), toxicológica e resíduos.
    Herbicidas. Inseticidas. Acaricidas. Fungicidas. Nematicidas. Tecnologia de Aplicação.
    Uso correto e seguro de produtos fitossanitários. Receita Agronômica.'
  course_name: '0110688 - Produtos Fitossanitários

    Plant Protection Produts'
