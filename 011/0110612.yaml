  objectives: Apresentar, analisar e discutir as causas do insucesso do sistema convencional
    em ambiente tropical, as quais estimularam a adoção dos sistemas de produção agrícola
    em plantio direto. Discutir critérios relativos à adequação, diversificação e
    implantação desse sistema, e sua importância à conservação do solo e água, e acúmulo
    de carbono no solo.
