  course: 3.1. Ecossistema natural e agrícola; 3.2. Sistema convencional de produção
    agrícola; 3.3. Breve histórico sobre a história deste sistema e requisitos para
    adotá-lo; 3.4. Efeitos do revolvimento sobre o solo; 3.5. Máquinas e implementos
    agrícolas para o plantio direto; 3.6. Rotação de cultura e cobertura vegetal de
    outono-inverno; 3.7. Pragas, doenças e plantas daninhas em plantio direto; 3.8.
    Atributos físicos, químicos e biológicos do solo; 3.9. Estimativa da economia
    de água e produtividade; 3.10. Conceitos para formação e acúmulo de resíduos vegetais;
    3.11. Importância da integração lavoura e pecuária para o sistema de produção
    agrícola em plantio direto.
  course_name: '0110612 - Sistema de Produção Agrícola em Plantio Direto

    System of Agricultural Production in no-Tillage'
  deactivation: 31/12/2023
