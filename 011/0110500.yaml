  course: Importância do agronegócio e da bioenergia para o Brasil e o mundo. Cadeia
    sucroenergética; cadeia produtiva da indústria de florestas plantadas; cadeia
    produtiva de grãos e oleaginosas; cadeia produtiva da agroindústria de carnes
    e leite. Fontes  renováveis e alternativas de energias. Interação entre cadeia
    produtiva de grãos e sucroenergética;  Interações entre agroindústria de florestas
    plantadas e a agroindústria de carne, leite e grãos. Interação entre a cadeia
    sucroenergética e agroindústria florestal;  Interações entre agroindústria sucroenergética
    e a agroindústria de carne, leite e grãos. Visitas técnicas em agroindústrias
    produtoras de bioenergia, de grãos, de florestas plantadas, de unidades de produção
    de celulose e carvão, de carnes, de leite e de produtos correlatos.  Visualização
    dos desafios no dia a dia de empresas do agronegócio e elaboração estudos de casos
    para discuti-los. Elaboração de monografias a partir das experiências observadas
    nas visitas técnicas.  Discussão das monografias com profissionais do setor produtivo
    envolvidos na temática abordada nas expedições. Estudos de viabilidade técnico-econômica
    de novas tecnologias e de tendências.  Oportunidades de novos produtos e negócios.  Desafios
    e melhorias necessários para o agronegócio e a cadeia de bioenergia no Brasil
    e em outros países.
  course_name: '0110500 - Gestão de Agronegócios e Bioenergia

    Agribusiness and Bioenergy Managnement'
