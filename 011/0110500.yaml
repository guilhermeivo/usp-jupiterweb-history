  objectives: Formação multidisciplinar do estudante.  Permitir ao futuro profissional
    ter uma introdução prévia ao ambiente de trabalho pluridisciplinar e interdisciplinar
    do setor produtivo.  Além disso, permitir participar de discussões de questões
    do cotidiano do agronegócio e da bioenergia.
