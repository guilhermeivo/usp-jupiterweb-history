courses:
  activation: 15/07/2018
  assessment: Não haverá recuperação.
  bibliography: Será aquela específica para o trabalho e definida em conjunto com
    o orientador, sendo necessária a inclusão de um manual de redação de trabalho
    científico.
  course: Orientação individual. De comum acordo com o orientador escolhido pelo aluno,
    deve haver a elaboração do Plano de Trabalho com o respectivo cronograma de execução.
    O Plano de Trabalho deverá ser aprovado pelo Departamento ao qual pertence o orientador
    antes da matrícula na disciplina. Execução do plano, acompanhado pelo orientador.
    Preparação e entrega do trabalho de conclusão de curso na versão impressa.
  course_name: '0111000 - Trabalho de Conclusão de Curso em Engenharia Agronômica

    Final Report in Agriculture'
  deactivation: ''
  instructors: 93551 - Sônia Maria De Stefano Piedade
  lecture_credits: '2'
  objectives: '1) Proporcionar aos alunos o aprimoramento técnico-científico, com
    a realização de um trabalho de síntese e integração dos conhecimentos adquiridos
    ao longo do Curso;

    2) Acelerar a maturidade profissional do graduando em Engenharia Agronômica através
    de um trabalho de caráter profissional, sob orientação de um docente da ESALQ.
    Por "caráter profissional"; entende-se que o TCC apresenta nível técnico-científico
    compatível com a atividade dos Engenheiros Agrônomos em exercício na sociedade
    brasileira; e

    3) Consolidar o perfil acadêmico e profissional do aluno em final de Curso.'
  practical_credits: '4'
  total_workload: 150 h
  type: Semestral
