  course: 'Estratégias de desenvolvimento de produtos e inovação na área agroalimentar
    utilizando Design Thinking e

    processo de design: Fundamentos de etnografia e geração de ideias; Desenvolvimento
    de conceitos Seleção

    de ideias; Elaboração de soluções e apresentação em formato consistente. Testes
    e prototipagem. Co-criação e aprendizagem (integração de partes interessadas no
    desenvolvimento, condução de experiências de forma efetiva levando a inovação
    às organizações). Visitas técnicas e desenvolvimento de atividades práticas. Os
    participantes desenvolverão atividades individuais e em grupo para o desenvolvimento
    ou aprimoramento de soluções significativas e transformadoras nas temáticas selecionadas.'
  course_name: '0110152 - Pesquisa e Desenvolvimento de Produtos

