  activation: 15/07/2018
  assessment: Não há recuperação na disciplina de Estágio Vivencial.
  bibliography: '7. BIBILOGRAFIA BÁSICA: a ser indicada pelo departamento responsável.'
  course: '1. Economia da Produção: Análise econômico-financeira de recursos e de
    projetos agroindustriais.

    2.Transformação: Estudo, acompanhamento e execução de casos específicos de transformação
    de matéria prima de origem agropecuária. Estudos dos processos envolvidos em seus
    aspectos econômicos e de avaliação qualitativa, tanto na esfera rural quanto na
    industrial.

    3. Administração: Análise e planejamento da gerência de projetos econômicos.

    4. Pesquisa:  Elaboração de projetos de pesquisa, identificação de problemas,
    desenvolvimento de metodologias e execução do projeto (coleta de dados, análise,
    interpretação e relatório final).

    5. Consumo:  Aplicação de princípios econômicos e administrativos em empresas
    do elo final da cadeia de produtos alimentícios.'
  course_name: '0110680 - Estágio Vivencial em Ciências Econômicas

    Experimental Internship in Economics'
  deactivation: ''
  instructors: 5098002 - Carlos Eduardo de Freitas Vian
  lecture_credits: '2'
  objectives: Complementar a formação e o aprimoramento acadêmico do estudante constituindo
    uma oportunidade para aquisição de experiência pré-profissional. Proporcionar
    ao estudante a oportunidade de vivenciar a prática diária de sua profissão.
