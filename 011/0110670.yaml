courses:
  activation: 15/07/2018
  assessment: Não há recuperação na disciplina de Estágio Vivencial.
  bibliography: '7. BIBILOGRAFIA BÁSICA: a ser indicada pelo departamento responsável.'
  course: "Testes de espécies, procedências e híbridos. Implantação de áreas produtoras\
    \ de sementes e pomares. Seleção de árvores para propagação clonal. Planejamento\
    \ e organização do viveiro florestal: mão de obra, máquinas e insumos. Uso de\
    \ diferente recipientes  e substratos para a produção de mudas. Formulações de\
    \ adubações em viveiro. Controle da irrigação. Produção de mudas por estaquia\
    \ e micropropagação. Técnicas de plantio, operações mecanizadas, manejo de plantas\
    \ invasoras, uso de herbicidas em plantações florestais, controle de qualidade.\
    \ Mensuração de povoamentos por amostragem de pontos, atividades de inventário\
    \ florestal, processamento de dados dendrométricos, elaboração de tabelas em planilhas\
    \ de cálculo e bancos de dados, elaboração e digitalização de mapas e outros dados\
    \ georeferenciados.  Planos de corte: análise econômica. Atividades de pré-corte,\
    \ exploração florestal, atividades de pós-corte. Práticas de desbaste e desrama.\
    \ Análise e planejamento de atividades de colheita de madeira. Técnicas de prevenção\
    \ de incêndios em florestas. Técnicas e equipamentos de combate a incêndios. Elaboração\
    \ de planos de proteção florestal.  Revegetação de áreas degradadas. Escolha de\
    \ espécies tolerantes. Implantação e acompanhamento de modelos de revegetação.\
    \  Escolha de espécies potenciais para sistemas agroflorestais. Planejamento,\
    \ implantação e manutenção de sistemas agroflorestais\n011-670 Estágio Vivencial\
    \ em Engenharia Florestal\n2- Área de Ecologia Aplicada.\nLevantamentos da estrutura\
    \ vertical e horizontal da floresta. Caracterização de espécies florestais em\
    \ diferentes estágios da sucessão. Coleta de material vegetal e serapilheira para\
    \ análises. Analise de nutrientes em componentes da árvore. Determinação do estoque\
    \ de nutrientes nos compartimentos da floresta. Observações de campo e casa de\
    \ vegetação quanto à resposta das essências florestais a diferentes níveis de\
    \ luminosidade. Avaliação do potencial produtivo do sítio florestal. Analises\
    \ físicas e químicas do solo.  monitoramento de bacias hidrográficas. Produção\
    \ de água em diferentes regimes silviculturais. Coleta de dados sobre precipitação\
    \ e deflúvio. Análises da qualidade da água. Práticas de conservação de bacias\
    \ hidrográficas. Monitoramento da fauna em florestas e áreas reflorestadas. Identificação\
    \ de animais silvestres. Análise do habitat . Elaboração de programas de manejo\
    \ de habitat visando à conservação da fauna. Avaliação da capacidade de carga\
    \ de visitantes em áreas naturais. Implantação e recuperação de trilhas. Levantamento\
    \ do potencial turístico em áreas naturais. Práticas de interpretação da natureza.\
    \ Estudo do ambiente e da atividade florestal para implantação de projetos de\
    \ educação ambiental. Intervenção em escolas públicas para elaboração de projetos\
    \ de conservação do ambiente. Atividades de educação ambiental junto às comunidades\
    \ locais. Extensão florestal. Cultivo de espécies florestais de importância econômica\
    \ regional e com potencialidades medicinais. Vistoria para fins de fiscalização\
    \ do cumprimento das leis ambientais. Relatórios de impacto ambiental\n3- Área\
    \ de tecnologia de produtos florestais.\nEnsaios sobre processamento de madeiras\
    \ e de outros produtos de origem florestal e análises da interação matéria-prima\
    \ versus processos. \tAnálises de tecnologias industriais de processamento da\
    \ madeira e de outros produtos de origem florestal.  Seleção de árvores no campo\
    \ seguindo indicadores de seleção. Desdobro de toras.  Classificação da madeira\
    \ serrada e definição do uso.  Análises estatísticas do ganho de seleção.  Execução\
    \ de estruturas de madeira (Móveis, habitações, coberturas, etc.). Planejamento\
    \ de serrarias e de processos de industrialização da madeira e de outra matérias\
    \ primas de base florestal"
  course_name: '0110670 - Estágio Vivencial em Engenharia Florestal

    Experimental Internship in Forestry Engineering'
  deactivation: ''
  instructors: 2058395 - Sílvio Frosini de Barros Ferraz
  lecture_credits: '2'
  objectives: Complementar a formação e o aprimoramento acadêmico do estudante constituindo
    uma oportunidade para aquisição de experiência pré-profissional. Proporcionar
    ao estudante a oportunidade de vivenciar a prática diária de sua profissão.
  practical_credits: '8'
