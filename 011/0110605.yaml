  assessment: Não há recuperação na disciplina de Estágio Profissionalizante .
  bibliography: A ser indicada pelo departamento responsável.
  course: 'O Estágio Profissionalizante em Ciências Biológicas terá um programa para
    cada estudante ou grupo de estudantes, elaborado de comum acordo com o seu orientador.
    O conteúdo do programa será delineado de modo a enquadrar-se em uma das seguintes
    áreas de atuação:

    Pesquisa: Elaboração de projetos de pesquisa específicos, identificação de problemas,
    delineamento experimental, redação de projetos, execução, coleta de dados, análise
    e interpretação e redação do relatório final de pesquisa.

    Ensino: Técnicas de ensino, princípios pedagógicos e didáticos. Avaliação do aprendizado
    e modelos de avaliação. Prática de ensino teórico e aplicado.

    Extensão: Elaboração e execução de projetos de manejo ambiental; participação
    de equipes multidisciplinares na pesquisa e no uso de recursos naturais renováveis;
    gerenciamento e execução de tarefas técnicas nas diferentes áreas do conhecimento
    biológico.'
  course_name: '0110605 - Estágio Profissionalizante em Ciências Biológicas

    Professional Internship in Biological Sciences'
  deactivation: ''
