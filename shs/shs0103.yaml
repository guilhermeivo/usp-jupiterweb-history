  course: 'Bombas hidráulicas de fluxo. Coeficientes adimensionais, curvas características.
    Escolha de uma bomba. Rotação específica. Tubulações. Anteprojeto de uma estação
    elevatória - semelhança hidrodinâmica aplicada às bombas hidráulicas. Associações
    de bomba. Turbinas hidráulicas, noções de aproveitamentos hidroelétricos. Escolha
    de uma turbina hidráulica. Modelos reduzidos. Cavitação.

    Instrumentos e Critérios de Avaliação'
  course_name: 'SHS0103 - Máquinas Hidráulicas

    Hydraulic Machines'
