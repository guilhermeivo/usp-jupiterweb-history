  course: 'I. O Comportamento Humano como Acontecimento Simbólico

    II. A Condição Social da Vida Humana

    a) subjetividade e intersubjetividade: a dialética do reconhecimento

    b) vida política

    1. a noção de cidadania

    2. a noção de poder. Organizações servis,  totalitárias,

    burocráticas e democráticas

    c) a noção de participação em Psicologia Social: enraizamento e desenraizamento

    d) trabalho e cidadania

    III. O Grupo

    a) o conceito de grupo

    b) o grupo como realidade intersubjetiva : a noção de "emergente grupal"

    c) as influências interpessoais

    d) processos e dinâmicas grupais

    IV. A Liderança

    a) história do conceito de liderança

    b) modalidades de liderança

    c) teorias da liderança

    d) liderança e gerenciamento

    e) gerência como articulação de processos grupais

    f) gerenciamento: o exercício permanente da liderança

    g) desenvolvimento da liderança gerencial, e

    h)  obstáculos ao exercício da liderança gerencial'
  course_name: 'PST0391 - Liderança e Comportamento Humano

    Leadership and Human Behavior'
  deactivation: ''
  lecture_credits: '2'
  objectives: Refletir sobre a condição social do ser humano e suas implicações na
    organização do trabalho como atividade grupal. Discutir o conceito de liderança.
    Analisar o gerenciamento como uma atividade de articulação grupal e de influência
    sobre grupos.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
