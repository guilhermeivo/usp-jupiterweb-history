  course: 'I) Psicologia como ciência e profissão.

    - Breve histórico da Psicologia como ciência e profissão.

    - As abordagens psicológicas: behaviorista, gestaltista, histórico-cultural e
    psicanalítica: elementos gerais.

    II. Psicologia Social: temas e espaços de atuação.

    - Um pouco da história

    - Duas ramas da Psicologia Social: Psicologia Social do trabalho e Psicologia
    organizacional.

    - Mundo do Trabalho e dilemas éticos da Psicologia Social e do Trabalho.

    - As noções de indivíduo, cultura e sociedade.

    - As noções de Ideologia, identidade e processos grupais.

    III. Psicologia Social e do Trabalho: compreendendo e agindo no mundo de trabalho.

    - Mundo do trabalho, liderança e gestão de pessoas: um olhar crítico.

    - Psicologia e saúde do(a) trabalhador(a)

    - Sociedade, mundo do trabalho e sofrimento psíquico.'
  course_name: 'PST0294 - Introdução à Psicologia

    Introduction to Psychology'
  deactivation: ''
  instructors: 8747216 - Antonio Euzébios Filho
  lecture_credits: '2'
  objectives: Iniciar os alunos em estudos básicos de Psicologia. Buscar progressivamente
    introduzi-los também em elementos fundamentais de Psicologia Social e Psicologia
    do Trabalho. Deste  modo, pretende-se subsidiar o encontro dos estudantes com
    as Ciências Humanas, alargando-se a sensibilidade, o pensamento e a iniciativa
    dos jovens administradores na sociedade moderna e democrática.
