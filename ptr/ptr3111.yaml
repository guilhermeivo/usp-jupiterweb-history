  course: 'Apresentação do curso. Aplicações da disciplina na engenharia.

    . Escalas, bases cartográficas (analógicas e digitais) e seu uso. NBR 13.133 e
    NBR 14.166.

    . Coordenadas, sistemas de projeção e plantas topográficas: conceitos básicos.

    . Métodos de coleta de informações: Planimétricas e Altimétricas.

    . Coletas de posições e atributos. Conceitos de posicionamento por satélite (GNSS).

    . Implantação e locação de projetos: estradas, plataformas, barragens e obras
    subterrâneas.

    . Sistemas de projeção (UTM, LTM e Plano Topográfico Local) em projetos de engenharia.

    . Elaboração e atualização de uma planta topográfica (digital e analógica).

    . Course presentation. Applications of the discipline in the Engineering.

    . Scales, cartographic mapping (digital and analogic) and its use. NBR 13133 and
    NBR 14166.

    . Coordinates, projection systems and topographical maps: basic concepts.

    . Methods of data collection: planimetric and altimetric.

    . Collection of positions and attributes. Concepts of satellite positioning system
    (GNSS).

    . Project location and construction: roads, platforms, dams and underground works.

    . Projection system (UTM, LTM and Local Topographic Plane) in engineering projects.

    . Preparation and updating of a topographic map (digital and analogic).'
  course_name: 'PTR3111 - Geomática I

    Geomatics I'
  deactivation: 31/12/2022
  instructors: '103165 - Ana Paula Camargo Larocca

    45845 - Denizar Blitzkow

    74431 - Edvaldo Simões da Fonseca Junior

    47315 - Jorge Pimentel Cintra'
  lecture_credits: '4'
  objectives: 'Oferecer formação básica referente a especificações e metodologias
    para coleta de dados, implantação e locação de projetos e obras de engenharia,
    conceitos de geodésia, posicionamento por satélites, projeções cartográficas e
    suas aplicações em projetos e obras da Engenharia.

    To provide basic knowledge concerning the specifications and methodologies for
    data collection, implementation and location of engineering works, concepts of
    geodesy, satellite positioning, cartographic projections and its applications
    in engineering projects and works.'
  practical_credits: '2'
  total_workload: 120 h
