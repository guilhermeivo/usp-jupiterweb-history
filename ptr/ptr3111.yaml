  assessment: '1(uma) prova a ser realizada dentro do período estabelecido pela universidade
    e/ou unidade.

    Cálculo da Média Final (aluno que ficou em recuperação):

    MF = (NF + NR) / 2

    Onde:

    MF = Média Final (após a recuperação);

    NR = Nota da prova de recuperação;

    NF = Nota Final.'
