  course: '1. Conceitos fundamentais de Sensoriamento Remoto; 2. Modelagem Digital
    do Terreno; 3. Pré-processamento e processamento de imagens de Sensoriamento Remoto;
    4. Métodos de avaliação da qualidade de classificação de imagens de Sensoriamento
    Remoto; 5. Conceitos básicos de Sistemas de Informações Geográficas (SIG); 6.
    Conceitos básicos sobre Sistemas de Referência; 7. Topologia e incertezas associadas
    a dados espaciais; 8. Operações espaciais e álgebra de mapas; 9. Compartilhamento
    de dados espaciais na internet.

    1. Fundamental concepts of Remote Sensing; 2. Digital Terrain Modeling; 3. Pre-processing
    and processing of Remote Sensing images; 4. Methods for evaluating the quality
    of classification of Remote Sensing images; 5. Basic concepts of Geographic Information
    Systems (GIS); 6. Basic concepts about Reference Systems; 7. Topology and uncertainties
    associated with spatial data; 8. Spatial operations and map algebra; 9. Spatial
    data sharing on the internet.'
  course_name: 'PTR3311 - Geomática II

    Geomatics II'
  deactivation: ''
  instructors: '7500438 - Cleyton de Carvalho Carneiro

    1351435 - Mariana Abrantes Giannotti'
  lecture_credits: '2'
  objectives: 'Fornecer conceitos fundamentais de Geoprocessamento e Ciência de Dados
    Espaciais, incluindo o Sensoriamento Remoto, a Modelagem Digital do Terreno, os
    Sistemas de Informações Geográficas e suas aplicações em Engenharia Civil e Engenharia
    de Minas.

    To provide fundamental concepts of Geoprocessing and Spatial Data Science, including
    Remote Sensing, Digital Terrain Modeling, Geographic Information Systems and their
    applications in Civil and Mining Engineering.'
  practical_credits: '1'
  total_workload: 60 h
  type: Semestral
