    6. Basics concepts of Geographic Information Systems 7. Spatial Databases 8. Spatial
    Data Modeling 9. Spatial Operations and Spatial Analysis 10. Spatial Data Infrastructure.'
  course_name: 'PTR3311 - Geomática II

    Geomatics II'
  deactivation: ''
  instructors: 60849 - Jose Alberto Quintanilha
  lecture_credits: '2'
  objectives: 'Fornecer conceitos fundamentais de Geoprocessamento, incluindo o Sensoriamento
    Remoto, a Modelagem Digital do Terreno, os Sistemas de Informações Geográficas
    e suas aplicações em Engenharia Civil e Engenharia de Minas.

    To provide fundamental concepts of Geoprocessing, including Remote Sensing, Digital
    Terrain Modeling, Geographic Information Systems and their applications in Civil
    and Mining Engineering.'
