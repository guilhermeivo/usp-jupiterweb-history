  course: ''
  course_name: 'PTR3512 - Ciência de Dados Geoespaciais e Análises Urbanas

    Geospatial Data Science and Urban Analytics'
  deactivation: ''
  instructors: 1351435 - Mariana Abrantes Giannotti
  lecture_credits: '2'
  objectives: 'Prover aos alunos conceitos fundamentais de Ciência de Dados Geospaciais
    e Análises Urbanas, incluindo técnicas e métodos de análise espacial e modelagem
    em busca de revelar e descrever padrões espaço-temporais que possam contribuir
    para o suporte à decisão no planejamento urbano e de transportes.

    Provide students with fundamental concepts of Geospatial Data Science and Urban
    Analytics, including techniques and methods of spatial analysis and modeling in
    order to reveal and describe spatio-temporal patterns that can contribute to decision
    support in urban and transport planning.'
  practical_credits: '0'
  total_workload: 30 h
