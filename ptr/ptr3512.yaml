  course_name: 'PTR3512 - Geoprocessamento Aplicado a Transportes

    Geoprocessing Applied to Transport Engineering'
  deactivation: ''
  instructors: 1351435 - Mariana Abrantes Giannotti
  lecture_credits: '2'
  objectives: 'Prover aos alunos conceitos fundamentais de Geoprocessamento aplicado
    a Transportes, incluindo técnicas de Análise Espacial e modelagem de redes em
    Sistemas de Informações Geográficas (SIG) em busca de revelar e descrever padrões
    espaço-temporais que possam contribuir para o suporte à decisão na Engenharia
    de Transportes.

    To provide fundamental concepts of Geoprocessing applied to Transport Engineering,
    including techniques of Spatial Analysis and network modeling in Geographic Information
    Systems (GIS) in search of revealing and describing spatiotemporal patterns that
    can contribute to decision support in Transport Engineering.'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
