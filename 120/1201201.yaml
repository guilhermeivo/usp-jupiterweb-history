    Descrição da atividade

    Os alunos desenvolvem projeto para solucionar um problema existente, ou seja,
    uma inovação

    Entrepreneurship Thinking, Business Thinking e Design Thinking

    Os alunos serão organizados em equipes multidisciplinares observando fatores e
    dimensões de diversidade (ex: gênero, raça, cor, curso) e deverão identificar
    a associação dos seus projetos com os objetivos da ODS. É aspecto fundamental
    do curso a imersão dos alunos no ecossistema empreendedor, construir o projeto
    com base em validações diversas (ex: potenciais fornecedores, clientes, consumidores,
    stakeholders, etc). Será demandado que cada grupo apresente de forma estruturada
    um plano de desenvolvimento do negócio. Os projetos serão apresentados em diversos
    pitchs com participação de professores e banca de investidores. A entrega final
    será composta por um projeto de empreendedorismo e o protótipo do produto tecnológico.

    Indicadores de avaliação da atividade

    Qualidade do plano de negócio apresentado'
