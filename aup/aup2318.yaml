  course: 'Introdução aos elementos e operações constitutivos, tais como: ponto, linha,
    plano, equilíbrio, ritmo, escala, textura, cor, persistência, hierarquia, enquadramento,
    camadas, transparência, modularidade, repetição, agrupamento, espelhamento, rotação,
    escalonamento, movimento.

    Desenho: pensamento, representação, invenção, comunicação.

    Exercícios de leitura visual de objetos e espaços.

    Exercícios de experimentação e expressão gráfica, incluindo as práticas do desenho,
    dos processos de reprodução analógicos e digitais, da fotografia e das mídias
    eletrônicas.

    Exercícios de expressão tridimensional envolvendo modelos em diversos materiais.'
  course_name: 'AUP2318 - Linguagens Visuais

    Visual Languages'
  deactivation: ''
  instructors: '651017 - Clice de Toledo Sanjar Mazzilli

