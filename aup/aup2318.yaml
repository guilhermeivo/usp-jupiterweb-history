  lecture_credits: '4'
  objectives: 'Familiarizar o estudante com os fundamentos da linguagem visual.

    Capacitar o estudante para analisar e operar a linguagem visual, com vistas a
    ampliar suas possibilidades de expressão e comunicação.'
