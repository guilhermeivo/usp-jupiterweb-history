  assessment: '1 – A recuperação constará de uma prova, que incluirá todo o conteúdo
    ministrado nas aulas teóricas, a ser realizada até uma semana antes do término
    do período de retificação de matrícula (estabelecido anualmente pelo Calendário
    USP).

    2 – A média da avaliação final da disciplina entrará no computo da recuperação,
    sendo:

    média = média da avaliação final + nota da recuperação ÷ 2

    3 – Não será facultado aos alunos reprovados, mas que obtiveram frequência mínima
    e nota não inferior a três, a matrícula em disciplinas que dependam de pré-requisitos.'
