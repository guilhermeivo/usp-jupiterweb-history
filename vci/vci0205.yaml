  course: '1 - Morfofisiologia do sistema reprodutor, respiratório/circulatório, excretor,
    digestório, imunológico de peixes de água doce e marinhos (teleósteos e condrictes)

    2 - Morfofisiologia dos sistemas orgânicos de crustáceos (camarão)

    3 - Morfofisiologia dos sistemas orgânicos de moluscos (mariscos e ostras)

    4 - Manejo em sistemas de aquicultura para moluscos, crustáceos e teleósteos de
    água doce e marinhos de interesse comercial.

    5 - Bases morfofisiológicas da inspeção e conservação do pescado

    6 - Principais problemas que afetam a sanidade destes animais'
  course_name: 'VCI0205 - Introdução à atuação do Médico Veterinário em Espécies Aquáticas

    Introduction to the veterinarian roles in aquatic animals sciences'
  deactivation: ''
  instructors: 1030785 - José Roberto Kfoury Junior
  lecture_credits: '1'
  objectives: O curso visa apresentar aos alunos a morfofisiologia comparada dos principais
    sistemas orgânicos de peixes e invertebrados de água doce e marinhos, de interesse
    veterinário e zootécnico, ressaltando a inter-relação entre a forma, a função
    e a integração dos órgãos na manutenção da homeostase. Serão ressaltados os sistemas
    orgânicos importantes para a avaliação do produto para o consumo e o impacto da
    criação zootécnica nestes sistemas, colocando os alunos em contato com fazendas
    de cultura destes animais.
  practical_credits: '1'
  total_workload: 45 h
  type: Semestral
