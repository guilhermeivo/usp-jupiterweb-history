  assessment: 'A recuperação constará de duas provas, cuja natureza ficará a cargo
    de cada disciplina, a serem realizadas no período indicado pelo calendário USP.
    A média final após a recuperação será a média aritmética da nota da avaliação
    final e da média da recuperação [Média pós-recuperação: (nota da avaliação final
    + média da recuperação)/2]'
