  course: '● Princípios do tratamento da dor: fisiopatologia e reconhecimento da dor

    ● Principais agentes analgésicos: opioides, AINEs e adjuvantes

    ● Uso racional dos analgésicos na dor aguda

    ● Tratamento da dor crônica e da osteoartrite em cães e gatos

    ● Anestesia em pacientes de risco: o que monitorar

    ● Anestesia no paciente cardiopata

    ● Anestesia no paciente submetido a cirurgia torácica

    ● Procedimentos especiais em cães braquicefálicos'
  course_name: 'VCI0542 - Controle da dor e técnicas anestésicas especiais em cães
    e gatos

    Anesthetic Techniques in Dogs and Cats'
