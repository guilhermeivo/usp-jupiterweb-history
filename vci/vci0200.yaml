  course: "\x95Organização morfo-funcional geral do sistema nervoso.\n\x95Constituintes\
    \ funcionais dos nervos espinais e cranianos.\n\x95Degeneração e regeneração nervosa\
    \ periférica.\n\x95Organização morfo-funcional da medula espinal, do tronco encefálico,\
    \ do cérebro (diencéfalo e telencéfalo).\n\x95Síndromes relacionadas a afecções\
    \ cerebrais e cerebelares.\n\x95Síndromes relacionadas a afecções de medula espinhal\n\
    \x95Vias exteroceptivas, interoceptivas e proprioceptivas.\n\x95Vias eferentes\
    \ somáticas. Estudo crítico do neurônio motor superior e do neurônio motor inferior.\n\
    \x95\tVias eferentes viscerais.\n\x95\tNeuro-oftalmologia.\n\x95\tSistemas neurais\
    \ e comportamento. Estruturas encefálicas relacionadas com o comportamento emocional."
  course_name: "VCI0200 - Sistema Nervoso dos Animais Domésticos-correlações Anatomo-clínicas\n\
    Nervous system of domestic animals \x96 Anatomical-Clinical Correlation"
