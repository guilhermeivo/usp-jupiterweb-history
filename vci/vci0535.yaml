  course: "1.\tAbordagem anátomo-cirúrgica da articulação escápulo-umeral, com vistas\
    \ ao tratamento da osteocondrose/osteocondrite dissecante;\n2.\tAbordagem anátomo-cirúrgica\
    \ da articulação úmero-rádio-ulnar, com vistas ao tratamento da displasia do cotovelo\
    \ (fragmentação do processo coronoide medial; não união do processo ancôneo; osteocondrose/osteocondrite\
    \ dissecante da região medial do côndilo umeral);\n3.\tAbordagem anátomo-cirúrgica\
    \ da articulação coxofemoral, para tratamento da fratura do colo femoral, luxação\
    \ traumática da cabeça e colo femorais e displasia coxofemoral;\n4.\tAbordagem\
    \ anátomo-cirúrgica da articulação fêmoro-tíbio-patelar, para tratamento da luxação\
    \ de patela e/ou insuficiência do ligamento cruzado cranial;\n5.\tAbordagem anátomo-cirúrgica\
    \ dos ossos longos, para tratamento das fraturas, sendo empregados os implantes\
    \ ortopédicos;\n6.\tAmputação do membro locomotor"
