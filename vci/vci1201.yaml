  course: '● Sistema respiratório: Nariz e narinas. Seios paranasais e cavidade nasal.

    ● Sistema respiratório: laringe, traqueia, brônquios e pulmões. Características
    gerais da pleura.

    ● Sistema circulatório. Coração, vasos e sistema linfáticos.

    ● Sistema digestório: cavidade oral, esôfago e faringe.

    ● Sistema digestório: Estômagos, intestinos, fígado e pâncreas. Características
    gerais do peritônio.

    ● Sistema urinário: rins e vias de eliminação da urina.

    ● Sistema genital masculino: Órgãos genitais. Constituição, estruturas, aspectos
    funcionais do mecanismo de ereção.

    ● Sistema genital feminino: Morfologia geral dos órgãos genitais.'
  course_name: 'VCI1201 - Anatomia dos Animais Domésticos II

    Anatomy of Domestic Animals II'
  deactivation: ''
  instructors: '3247032 - Antônio Chaves de Assís Neto

    1030785 - José Roberto Kfoury Junior'
  lecture_credits: '5'
  objectives: 'Auxiliar os alunos a identificarem e reconhecerem as estruturas corpóreas,
    adquirindo as noções fundamentais abrangendo os sistemas: Circulatório, Digestório,
    Respiratório, Urinário e Genital (masculino e feminino), bem como os diferentes
    métodos de sua abordagem. Ainda fornecer elementos básicos na preparação para
    a prática médico-veterinária, facilitando a formação de alunos pensantes e capazes
    de compreenderem e agirem conforme os princípios profissionais éticos, através
    de conceitos, descrição de estruturas, forma e função dos elementos. Destacar
    a necessidade destes conhecimentos de Anatomia Sistêmica às disciplinas de aplicação.'
  practical_credits: '0'
  total_workload: 75 h
  type: Semestral
