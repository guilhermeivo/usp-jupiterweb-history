  course: 'Visando oferecer os conhecimentos básicos sobre a formação de imagem das
    diferentes modalidades

    diagnósticas, anatomia e semiologia radiográfica, ultrassonográfica, por tomografia
    computadorizada,

    ressonância magnética e radioproteção serão abordados temas, tanto no âmbito teórico
    quanto

    prático, relacionados à aquisição de imagens radiográficas simples e contrastadas,
    ultrassonográficas,

    de tomografia computadorizada e por ressonância magnética dos diferentes sistemas.

    Curso Teórico

    1. Radiodiagnóstico: Fundamentos da técnica radiográfica.

    2. Ultrassonografia. Princípios físicos e de formação da imagem.

    3. Tomografia computadorizada. Princípios físicos e formação da imagem.

    4. Ressonância magnética. Princípios físicos e formação da imagem.

    5. Proteção radiológica.

    6. Anatomia nas diferentes sob a perspectiva das diferentes modalidades de imagem.

    Curso Prático:

    1. Funcionamento e operação de equipamentos

    2. Anatomia nas diferentes sob a perspectiva das diferentes modalidades de imagem.

    Instrumentos e Critérios de Avaliação'
  course_name: 'VCI4104 - Diagnóstico por Imagem I

    Diagnostic Imaging I'
  deactivation: ''
