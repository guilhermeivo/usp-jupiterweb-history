  objectives: 'Introduzir o aluno aos conceitos de formação de imagem diagnóstica,
    proteção e segurança

    radiológica, anatomia da imagem, funcionamento de equipamentos de imagem para
    as modalidades radiográfica, ultrassonográfica de tomografia computadorizada e
    imagem por ressonância magnética.'
