  course: 'O conteúdo programático varia de acordo com a área escolhida pelo aluno,
    mas deve: - desenvolver a observação, a experimentação e o raciocínio indutivo
    e dedutivo, bem como contemplar  a redação do trabalho científico e os deveres
    do pesquisador como mestre; - empregar as regras aplicadas a qualquer questão
    não resolvida que, segundo Descartes, são "o não reconhecer como verdadeiro senão
    o evidente; dividir cada dificuldade em quantas partes seja preciso para melhor
    atacá-la; começar a análise pelo exame dos objetos mais simples e mais fáceis
    de serem compreendidos para remontar gradualmente ao conhecimento dos mais complexos".'
  course_name: 'LCB0525 - Trabalho de Conclusão de Curso II

    Monograph II'
  deactivation: ''
  instructors: 792922 - Flávio Bertin Gandara Mendes
  lecture_credits: '1'
  objectives: 'Dar ao aluno a oportunidade de: (a) fazer treinamento em método científico;
    (b) executar um

    projeto de pesquisa; (c) fazer levantamentos bibliográficos; (d) redigir relatório
    científico. O trabalho poderá ser realizado nas dependências dos diferentes departamentos
    da ESALQ, nas

    estações experimentais da unidade, em áreas protegidas e outras instituições públicas
    ou privadas. Cada aluno terá uma orientação científica individualizada, dada pelos
    docentes para discutir temas de caráter geral e, também, expor suas próprias experiências
    adquiridas durante o estágio.'
