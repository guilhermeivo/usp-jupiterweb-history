  course: ':  I) ORGANOGRAFIA: 1) Introdução:- Organização geral das plantas superiores.
    2) Organografia das plantas superiores: 2.1) Raiz:- definição, estudo das partes
    constituintes, sistemas radiculares e classificação das raízes.  2.2) Caule:-
    definição, estudo das partes constituintes e classificação dos caules. 2.3) Folha:-
    definição, estudo das partes constituintes e classificação das folhas. 2.4) Flor:-
    definição, estudo das partes constituintes, classificação floral, diagrama e fórmula
    floral. 2.5) Inflorescência:- definição, estudo das partes constituintes e classificação.
    2.6) Fruto:- definição, estudo das partes constituintes e classificação dos frutos
    enfatizando a origem, consistência e deiscência. 2.7) Semente:- definição, estudo
    das partes constituintes e classificação. II) ANATOMIA: 1) Introdução: Considerações
    gerais e importância; Organização interna do corpo da planta; Sistemas de Tecidos;
    Crescimento primário e secundário; Estudo dos tecidos. 2) Embriologia: origem
    dos embriões, estrutura anatômica comparativa dos embriões de monocotiledôneas
    e não monocotiledôneas. 3) Raiz: Organização do meristema apical da raiz, estrutura
    primária enfatizando os processos de absorção radicular e os conceitos de apoplasto
    e simplasto, origem das raízes laterais e das adventícias, estrutura secundária
    da raiz; 4) Caule: Organização do meristema apical caulinar (teoria Túnica-Corpo),
    estrutura primária e secundária do caule. 5) Folha: Origem, desenvolvimento foliar,
    estrutura foliar enfatizando a adaptação.'
  course_name: 'LCB0103 - Morfologia Vegetal

