courses:
  activation: 01/01/2020
  assessment: Será realizada uma prova de recuperação que contemplará toda a matéria
    lecionada no semestre com notas de 0 (zero) a 10,0 (dez) para os alunos que ficaram
    com média final abaixo de 5,0 e maior ou igual a 3,0 e que obtiveram freqüência
    maior ou igual a 70%. A nota final será calculada a partir da média da nota final
    obtida pelo aluno no semestre mais a nota da prova de recuperação dividida por
    dois.
  bibliography: 'Bioquímica. Donald Voet Judith G Voet; Ana Beatriz Gorini da Veiga;
    Carlos Termignoni. Porto Alegre Artmed 2015

    Princípios de Bioquímica de Lehninger. David Lehninger Nelson; Michael Cox; Trad.:
    Carla Dalmaz; Carlos Termignomi; Maria Luiza Pereira. Porto Alegre Artmed 2019

    Bioquímica. Jeremy M. Berg John L Tymoczko; Lubert Stryer; Gregory J Gatto Jr.;
    Deborah Schechtman; Antonio José Magalhães da Silva Moreira. Rio de Janeiro Guanabara
    Koogan 2014

    Bioquímica. Mary K Campbell Shawn O Farrell; All Tasks; Maria Martha Guedes Chaves.
    São Paulo Cengage Learning 2011

    Bioquímica básica. Anita Marzzoco Bayardo Baptista Torres. Rio de Janeiro Guanabara
    Koogan 2015'
  course: '1. Introdução a disciplina, importância e inserção na grade curricular.
    Soluções aquosas, interações e tampões. Princípios da Termodinâmica. 2. Carboidratos:
    Conceito, classificação, estrutura e propriedades; 3. Lipídeos: Conceito, classificação,
    estruturas e propriedades. 4. Aminoácidos e Proteínas: Conceito, classificação,
    estruturas e propriedades. Técnicas de purif. de proteínas. 5. Energética Bioquímica:
    Energia livre, energia de ativação, entropia, compostos ricos em energia e reações
    acopladas. 6. Enzimas: Conceitos, especificidade, fatores que afetam a velocidade
    de reação enzimática, co-fatores (vitaminas), enzimas alostéricas e isoenzimas.'
  course_name: 'LCB0213 - Bioquímica I

    Biochemistry I'
  deactivation: ''
  instructors: 227584 - Daniel Scherer de Moura
  lecture_credits: '4'
  objectives: Capacitar o aluno com os conhecimentos básicos e necessários para compreensão
    dos mecanismos moleculares dos constituintes celulares. Para tal, o aluno terá
    contato com os conceitos de química das biomoléculas (carboidratos, lipídeos,
    proteínas, aminoácidos,  enzimas e vitaminas), princípios de bioenergética.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
