courses:
  activation: 01/01/2023
  assessment: Será realizada uma prova de recuperação que contemplará toda a matéria
    lecionada no semestre com notas de 0 (zero) a 10,0 (dez) para os alunos que ficaram
    com média final abaixo de 5,0 e maior ou igual a 3,0 e que obtiveram frequência
    maior ou igual a 70%. A nota final será calculada a partir da média da nota final
    obtida pelo aluno no semestre mais a nota da prova de recuperação dividida por
    dois.
  bibliography: 'Literatura Básica:

    Princípios de Bioquímica de Lehninger. David Lehninger Nelson; Michael Cox. 2019

    Bioquímica. D Voet, JG Voet. 2015

    Bioquímica, por Jeremy M. BERG, John L. TYMOCZKO, e outros. 2021

    Literatura Complementar:

    Bioquímica Ilustrada de Harper, Victor W. Rodwell, David Bender, e outros. 2021

    Bioquímica básica. Anita Marzzoco Bayardo Baptista Torres. 2015

    Bioquímica. Mary K Campbell Shawn O Farrell. 2015'
  course: '1. Introdução a disciplina: importância e inserção na grade curricular.
    Soluções aquosas, interações moleculares e tampões. 2. Princípios da Termodinâmica:
    energia livre, energia de ativação, entropia, compostos ricos em energia e reações
    acopladas. 3. Carboidratos: conceito, classificação, estrutura e propriedades;
    4. Lipídeos: conceito, classificação, estruturas e propriedades. 5. Aminoácidos:
    conceito, classificação, estruturas e propriedades. 6. Estrutura e função de Proteínas:
    conceito, classificação e propriedades. 7. Técnicas de purif. de proteínas: extração,
    estabilização e separação. 8. Enzimas: conceitos, especificidade, fatores que
    afetam a velocidade de reação enzimática, co-fatores, regulação e cinética enzimática.'
  course_name: 'LCB0213 - Bioquímica I

    Biochemistry I'
  deactivation: ''
  instructors: 227584 - Daniel Scherer de Moura
  lecture_credits: '4'
  objectives: Capacitar o aluno com os conhecimentos básicos e necessários para compreensão
    dos mecanismos moleculares dos constituintes celulares. Para tal, o aluno terá
    contato com os conceitos de química das biomoléculas (carboidratos, lipídeos,
    proteínas, aminoácidos,  enzimas e vitaminas), princípios de bioenergética.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
