  course_name: 'LCB0390 - Mamíferos: Origem, Evolução e Biogeografia

    Mammals: Origin, Evolution and Biogeography'
  deactivation: ''
  instructors: 494774 - Alexandre Reis Percequillo
  lecture_credits: '4'
  objectives: A disciplina tem como objetivo o aprofundamento do estudo dos mamíferos
    por meio de uma abordagem comparativa de aspectos importantes da evolução, classificação,
    biogeografia, história natural, ecologia e conservação das diversas ordens atuais
    e extintas de mamíferos, com ênfase nos grupos sul-americanos. O conteúdo programático
    é transmitido aos alunos por meio de aulas teóricas, seminários e aulas práticas
    de laboratório e de campo, além de visitas ao Zoológico de São Paulo e ao Museu
    de Zoologia da Universidade de São Paulo.
  practical_credits: '4'
  total_workload: 180 h
  type: Semestral
