  objectives: A disciplina tem como objetivo geral permitir aos alunos terem os conhecimentos
    básicos fundamentais de técnicas de biologia molecular e genômica envolvidos em
    processos biotecnológicos e moleculares nas diversas áreas das Ciências Biológicas.
