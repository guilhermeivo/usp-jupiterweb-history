  course: '1. Histórico da Biologia Molecular e Biotecnologia: Da descoberta dos ácidos
    nucléicos a análise de genomas de procariotos e eucariotos; 2. Técnicas de Biologia
    Molecular: Isolamento de ácidos nucléicos; Reação em Cadeia da Polimerase (PCR);
    Enzimas de restrição, eletroforese; preparo de agarose e poliacrilamida; 3. Biotecnologia
    Aplicada: Obtenção de vetores de clonagem e vetores de expressão; isolamento e
    clonagem de genes, mapas de restrição, obtenção de plantas transgênicas; 3. ÔMICAS
    (genômica, transcritômica, proteômica): Métodos de sequenciamento de DNA, construção
    de bibliotecas genômica e de expressão, análises de genômica comparativa, metabolômica;
    4. Bioinformática: Ferramentas básicas de bioinformática, banco de dados, BLAST,
    alinhamento e filogenia.'
  course_name: 'LCB0246 - Biologia Molecular e Biotecnologia

    Molecular Biology and Biotechnology'
