  lecture_credits: '10'
  objectives: 1. Fornecer subsídios para identificação de espécies vegetais nativas
    e cultivadas, bem como oferecer uma visão geral da diversidade biológica, características
    morfológicas, padrões de ciclo de vida, considerações filogenéticas e ecológicas
    dos principais grupos de briófitas, licófitas, monilófitas, gimnospermas e angiospermas.
