  course: '1.1. Introdução. 1.2. Organização geral da planta. 1.3. Organografia das
    plantas superiores. 1.3.1. Raiz; 1.3.2 Caule; 1.3.3 Folha; 1.3.4. Flor; 1.3.5
    Inflorescência; 1.3.6. Fruto; 1.3.7. Semente. 2. Introdução à diversidade e as
    relações filogenéticas entre os grandes grupos dos seres vivos; 2.1. Noções de
    Filogenia; 2.2. Conquista do Ambiente terrestre; 2.3. Briófitas: Sistemática,
    características morfológicas, ciclos de vida, aspectos ecológicos, econômicos
    e evolutivos dos principais representantes das Divisões Marchantiophyta, Anthocerothophyta
    e Bryophyta; 2.4. Licófitas e monilófitas atuais: características morfológicas,
    ciclos de vida, aspectos ecológicos, evolutivos e importância econômica dos principais
    grupos 2.5. Liquens: caracterização morfológica e ecológica; importância econômica;
    3. Introdução à Sistemática de Fanerógamas. 3.1. Histórico dos Sistemas de Classificação;
    3.2. Cladística e sua importância na sistemática. 3.3. Estudo das principais famílias
    de Angiospermas e Gimnospermas.'
  course_name: 'LCB0320 - Morfologia e Sistemática Vegetal

    Plant Systematics and Morphology'
  deactivation: ''
