  course: '4.1. Parte Teórica: a parte teórica consta de conceitos e definições relativos
    à Botânica e caracterização morfológica das principais famílias vegetais de maior
    interesse agronômico; Introdução à Botânica Sistemática; Sistemas de Classificação:
    Engler (1964), Cronquist (1981), Gifford & Foster (1998); APG. III (2008); Nomenclatura
    Botânica; Chaves Analíticas Dicotômicas para Identificação de Famílias; Sistemática
    e terminologia específica de Plantas Olerícolas, Frutíferas, Ornamentais, Fibrosas,
    Latescentes, Estimulantes, Leguminosas e Gramíneas.  4.2. Parte Prática: as aulas
    práticas constam de determinação das famílias das principais espécies de plantas
    relacionadas com as práticas agrícolas, através do uso de Chaves Analíticas, utilizando-se
    material botânico recém-colhido e/ou previamente fixado, além do exame de flores
    em lupas e suas respectivas esquematizações (corte longitudinal, diagrama floral
    e fórmula floral). 4.2.1. Morfologia e Sistemática: análise morfológica, esquematização
    floral e utilização de chaves analíticas dicotômicas para identificação das seguintes
    famílias: Amaryllidaceae, Brassicaceae (= Cruciferae), Anacardiaceae, Lauraceae,
    Rutaceae, Myrtaceae, Cucurbitaceae, Vitaceae, Rubiaceae, Solanaceae, Malvaceae,
    Euphorbiaceae, Arecaceae (= Palmae), Musaceae, Fabaceae (= Leguminosae), Poaceae
    (= Gramineae), Cyperaceae (apenas noções desta família), Fabaceae (= Leguminosae)
    e Asteraceae (= Compositae). 4.2.2. Trabalho: coleta de material vegetal e confecção
    de exsicatas (unidades de herbário).'
  course_name: 'LCB1204 - Botânica Sistemática

    Systematic Botany'
  deactivation: ''
  instructors: 2692712 - Lindolpho Capellari Junior
  lecture_credits: '4'
  objectives: Fornecer subsídios para a caracterização morfo-taxonômica de angiospermas;
    Permitir o reconhecimento através de descrições e o uso de chaves analíticas das
    famílias botânicas envolvidas com os sistemas agrícolas e florestais, utilizando
    a morfologia externa de suas principais espécies; Capacitar os alunos para um
    melhor aproveitamento nas demais disciplinas do curso de Engenharia Agronômica;
    Capacitar o futuro agrônomo a reconhecer espécies vegetais cultivadas, invasoras
    e tóxicas, bem como oferecer-lhes conhecimento morfológico vegetal para que ele
    possa entender e explicar, botanicamente, padrões de produtividade vegetal.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
