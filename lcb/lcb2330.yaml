  course: '1. Parte Teórica: História das plantas medicinais e aromáticas em diversas
    culturas; Sistemas de Classificação; Evolução e arranjo filogenético das fanerógamas;
    Principais famílias onde são encontradas plantas medicinais tradicionais e potenciais
    (Angiospermas, Gymnospermas e Pteridófitas); 2. Parte Prática: as aulas práticas
    constam de reconhecimento das famílias das principais espécies de plantas medicinais
    e aromáticas, utilizando-se material botânico recém-colhido e/ou previamente fixados;
    2.1. Morfologia e Sistemática: análise morfológica, esquematização floral e utilização
    de chaves analíticas dicotômicas para identificação das famílias. 2.2. Trabalho:
    coleta de material vegetal e confecção de exsicatas (unidades de herbário). 2.3.
    Excursões: CPQBA/UNICAMP, Campinas/SP ou Instituto Plantarum, Nova Odessa/SP (sujeito
    a alteração).'
  course_name: 'LCB2330 - Sistemática de Plantas Medicinais e Aromáticas

    Medicinal and Aromatic Plant Systematics'
  deactivation: ''
  instructors: 2692712 - Lindolpho Capellari Junior
  lecture_credits: '4'
  objectives: Fornecer subsídios para a caracterização morfo-taxonômica das principais
    famílias botânicas, cujas espécies são utilizadas como fitoterápicos ou plantas
    aromáticas; Capacitar o aluno a reconhecer e identificar as espécies vegetais,
    mais empregadas em "medicina popular" e fitoterapia; Fornecer embasamento em reconhecimento
    de espécies vegetais medicinais e aromáticas, para que o aluno possa participar
    de disciplinas aplicadas correlacionadas a esta área. Esta disciplina tem um perfil
    voltado ao Curso de Graduação em Engenharia Agronômica.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
