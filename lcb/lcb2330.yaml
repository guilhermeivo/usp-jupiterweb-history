  assessment: A recuperação será feita pelos alunos que não atingiram a média suficiente
    para a aprovação, porém ficaram com média igual ou maior que a nota mínima exigida
    (média final entre 3,0 e 4,9) e com freqüência às aulas de no mínimo 70% do total
    de aulas ministradas.  Após o término do período letivo, os alunos que forem reprovados
    com média entre 3,0 - 4,9 deverão entregar uma deverão entregar uma grande coleção
    de exsicatas (plantas herborizadas) representativas de classes, ordens e famílias
    estudadas no curso seguindo normas fornecidas pelo professor no final da disciplina
    (entrega no dia marcado para a prova de recuperação).
