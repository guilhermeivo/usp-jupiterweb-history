  course_name: 'LCB1555 - Seminários em Biotecnologia II

    Seminars in Biotechnology II'
  deactivation: ''
  instructors: '227584 - Daniel Scherer de Moura

    52242 - Helaine Carrer'
  lecture_credits: '2'
  objectives: ': Apresentação de temas relevantes da área de Biotecnologia vegetal,
    animal, de microrganismos e ambiente, aos alunos de graduação. Durante as apresentações
    dos seminários os alunos terão contato com as pesquisas em biotecnologia e biologia
    molecular em desenvolvimento na agricultura e ambiente. Na ocasião dos seminários
    os alunos terão oportunidade de interagir e discutir com os professores e pesquisadores
    da ESALQ/USP e de outras instituições sobre os resultados e aplicações dos estudos
    apresentados. Esta disciplina visa principalmente colocar os alunos em contato
    com temas atuais referentes à biotecnologia, propiciar discussões e permitir o
    desenvolvimento de um espírito crítico frente aos temas apresentados.'
  practical_credits: '0'
  total_workload: 30 h
