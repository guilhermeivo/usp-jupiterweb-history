  course: '3.1. Biologia Molecular e Celular no desenvolvimento da Biotecnologia:
    3.1.1. Tecnologia do DNA Recombinante; 3.2. Avanços Biotecnológicos na Agricultura:
    3.2.1. Plantas Transgênicas, 3.2.2. Desenvolvimento de kits de diagnóstico, 3.2.3.
    Projeto Genoma Funcional em Plantas; 3.3. Avanços Biotecnológicos na Pecuária:
    3.3.1. Mapeamento genético e clonagem de animais, 3.3.2. Desenvolvimento de kits
    de diagnósticos, 3.3.3. Vacinas gênicas; 3.4. Avanços Biotecnológicos na Microbiologia:
    3.4.1. Projeto genoma de microrganismos, 3.4.2. Produção de vacinas e compostos
    terapêuticos, 3.4.3. Estudos de Interação Planta-microrganismos; 3.5. Avanços
    Biotecnológicos no Ambiente: 3.5.1. Estudos de impacto ambiental das plantas transgênicas,
    3.5.2. Controle da poluição através de organismos geneticamente modificados, 3.5.3.
    kits de diagnósticos; 3.6. Biossegurança: 3.6.1. O papel da CTNBio, 3.6.2. Aspectos
