  course: 'Ecossistemas, Agroecossistemas e Desenvolvimento: Definições. Fronteira
    agrícola, a origem dos agroecosssitemas e desenvolvimento. Devastação ambiental,
    aproveitamento racional e preservação. Conceitos básicos de ecologia e evolução:
    Habitat, nicho ecológico e ecossitema. Seleção natural, adaptação e especiação.
    Coevolução. Criação da biodiversidade. A Descrição da Vegetação Natural: Fisionomia.
    Florística. Fitossociologia. Aspectos da Fitogeografia do Brasil: Principais formações
    vegetais brasileiras.  A Organização de Comunidades Vegetais. Serapilheira, decomposição
    e alelopatia. Biologia floral e reprodutiva. Biologia da dispersão. Banco de sementes.
    Ecologia da germinação. Fatores de Perturbação. Manutenção da biodiversidade.
    Evolução e Regeneração das Comunidades Vegetais. Sucessão ecológica. Sucessão
    secundária. Sucessão florestal. Regeneração natural. Agroecologia: Definição.
    Agroecossistemas. Fundamentação ecológica. Modelos. Restauração de Áreas Degradadas.
    Restauração Ecológica. Métodos de Restauração. Seleção de Métodos. Implantação
    e Vantagens comparativas. Aspectos da Legislação Ambiental. Filosofia e Conceitos
    Gerais. Lei de Crimes Ambientais. Código Florestal. Ecologia Experimental. Instalação
    e análise de experimentos envolvendo processos ecológicos.'
  course_name: 'LCB1402 - Ecologia Vegetal

    Plant Ecology'
  deactivation: 31/12/2023
  instructors: 792922 - Flávio Bertin Gandara Mendes
  lecture_credits: '4'
  objectives: Dar aos alunos  condições de reconhecer os componentes dos ecossistemas
    naturais  e dos agroecosssitemas, seu funcionamento  e dos mecanismos de sua auto-perpetuação.
    Permitir aos alunos reconhecer as conseqüência das intervenções antrópicas sobre
    os ecossistemas naturais e os agroecossistemas e os métodos capazes de garantir
    o planejamento do seu uso, preservação e/ou restauração.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
