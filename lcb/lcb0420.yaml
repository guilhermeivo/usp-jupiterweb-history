  course: '1. Introdução à diversidade dos protistas e a árvore da vida dos eucariotos;
    2. Teoria da endossimbiose serial e a evolução dos grupos fotossintetizantes e
    seus relacionados; 3. Cianobactérias/Cyanophyta - precursores dos cloroplastos:
    caracterização morfológica e ecológica; importância econômica e sua relação com
    os eucariotos fotossintetizantes; 4. Os Super-grupos Archaeplastida: (Chlorophyta;
    Rhodophyta e Glaucophyta); SAR (Estramenopilos / Heterokonthophyta (Bacillariophyceae
    e Phaeophyceae, Rhizaria (Actinopoda, Granuloreticulosa; Chloraracniophyta); Apicomplexa
    (Dinophyta, Gregarina, Plasmodium, Toxoplasma, Ciliophora (Paramecium);) Opisthokonta:
    Choanoflagellata; Haptista (Haptophyta); Excavata: (Diplomonadida; Parabasilida;
    Kinetoplastida, Euglenophyta); Amoebozoa: Rhizopoda. Extinção de Chromalveolata
    e novas proposiçoes para Hacrobia.'
  course_name: 'LCB0420 - Protistas

    Protist'
  deactivation: ''
  instructors: 3257861 - Maria do Carmo Bittencourt de Oliveira
  lecture_credits: '4'
  objectives: Fornecer subsídios biológicos para o entendimento das relações filéticas
    entre os principais grupos de organismos vivos com ênfase naqueles conhecidos
    tradicionalmente como “algas” e “protozoários” ou “protistas” baseados em conceitos
    atuais que norteiam a classificação destes; b) Conhecer a sua importância na saúde
    humana e no ambiente, apresentando a diversidade biológica e ecológica de alguns
    subgrupos, inclusive, procariotos (cianobactérias) relacionados à origem dos eucariotos
    fotossintetizantes.   Conhecer a importância dos eventos de endossimbiose na diversidade
    destes organismos e a formação dos supergrupos e as tendências atuais
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
