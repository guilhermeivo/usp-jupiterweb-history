  course: 'I. Parte Teórica: Introdução à Botânica Sistemática Florestal; Sistemas
    de classificação botânica com destaque para Engler, Cronquist e APG II, III e
    IV; Nomenclatura botânica; Revisão sobre morfologia de espécies florestais; Evolução
    de Angiospermas a partir das Gimnospermas; Caracterização e reconhecimento das
    principais subclasses, ordens, famílias, gêneros e espécies florestais das Gimnospermas
    e Angiospermas, como as famílias Pinaceae e Araucariaceae de Gimnospermas, as
    famílias Arecaceae, Annonaceae, Magnoliaceae, Lauraceae, Moraceae, Casuarinaceae,
    Cecropiaceae, Canabaceae, Urticaceae, Nictaginaceae, Polygonaceae, Malvaceae,
    Lecythidaceae, Sapotaceae, Salicaceae, Styracaceae, Myrsnaceae, Fabaceae, Proteaceae,
    Myrtaceae, Melastomataceae, Euphobiaceae, Sapindaceae, Anacardiaceae, Meliaceae,
    Rutaceae, Rosaceae, Celastraceae, Aquifoliaceae, Apocynaceae, Solanaceae, Bignoniaceae,
    Rubiaceae, Asteraceae, Boraginaceae e outras das Angiospermas.  II) Parte Prática:
    As aulas práticas constam de observação e reconhecimento da morfologia externa
    de material reprodutivo de espécies florestais para determinação das famílias,
    gêneros e espécies das principais plantas ocorrentes em remanescentes florestais,
    com auxílio de Chaves Analíticas, utilizando-se material botânico recém-colhido
    e/ou previamente fixados. As dúvidas e checagens são feitas consultando as exsicatas
    contidas no Herbário ESA do Departamento de Ciências Biológicas da ESALQ/USP.
    Parte das aulas práticas são feitas no próprio campo, visitando remanescentes
    de florestas naturais ou áreas em Restauração Florestal da região, onde material
    botânico de espécies de interesse florestal são coletadas para identificação e
    reconhecimento em campo, que vão constituir relatórios de campo indivíduos de
    cada aluno, num total aproximado de 60 espécies florestais coletadas nas 12 aulas
    com saídas de campo. O trabalho prático da disciplina constitui na construção,
    por grupos de alunos, de uma chave dicotômica de identificação das espécies florestais
    coletadas em campo (aproximadamente 60 spp), em papel e na forma de um aplicativo
    para celular. Parte das aulas práticas são feitas em campo, visitando remanescentes
    de florestas naturais ou áreas em Restauração Florestal de municípios da região,
    de diferentes tipos florestais ou estados de conservação, onde material botânico
    de espécies de interesse florestal são coletadas para identificação e reconhecimento
    em campo, que vão constituir relatórios de campo indivíduos de cada aluno, num
    total aproximado de 60 espécies florestais coletadas nas 12 aulas com saídas de
    campo. Cada visita de campo dura em média 2 aulas e ocorrem depois das aulas teóricas,
    por isso as visitas são em fragmentos naturais próximos, mas muito bem escolhidos
    na região, já que dentro do campus da ESALQ tem poucos fragmentos, de um único
    tipo florestal. O trabalho prático da disciplina constitui na construção, por
    grupos de alunos, de uma chave dicotômica de identificação das espécies florestais
    coletadas em campo (aproximadamente 60 spp), em papel e na forma de um aplicativo
    para celular.'
  course_name: 'LCB0206 - Botânica Sistemática Florestal

    Systematic Botany of Forest Species'
  deactivation: ''
  instructors: 91886 - Ricardo Ribeiro Rodrigues
  lecture_credits: '4'
  objectives: Fornecer subsídios para a caracterização morfo-taxonômicas dos vegetais
    fanerogâmicos, permitir o reconhecimento de espécies nativas e exóticas através
    de descrições e o uso de chaves analíticas. As famílias estudadas são ocorrentes  em
    formações florestais nativas, aquelas envolvidas com os sistemas agroflorestais
    e na silvicultura, através da morfologia vegetal, da posição evolutiva e de suas
    principais espécies e utilidades. Capacitar os alunos com uma base taxonômica
    adequada, para um melhor aproveitamento nas demais disciplinas do curso de Engenharia
    Florestal.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
