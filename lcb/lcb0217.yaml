  course: 'Definições de Comunidades e a Evolução do Conceito de Comunidades. Conceitos
    Básicos e os Mecanismos de Criação e Manutenção da Biodiversidade. As Teoria sobre
    Comunidades.  A Descrição da Comunidades Vegetais: Fisionomia. Florística. Fitossociologia,
    Fitogeografia do Brasil: Principais formações vegetais brasileiras. Interações
    Interespecíficas. Processos de Organização de Comunidades. Cadeias Tróficas. Os
    Processos de Organização das Comunidades Vegetais: Serapilheira, Decomposição
    e Alelopatia. Biologia floral e reprodutiva. Biologia da Dispersão. Banco de Sementes.
    Ecologia da Germinação. Fatores de Perturbação. Agroecossistemas: organização,
    funcionamento e regulação. A Evolução e Regeneração das Comunidades Vegetais:
    Sucessão Ecológica.  e a Regeneração Natural em diferentes Comunidades Vegetais.
    Os Novos Paradigmas Ecológicos e a Preservação das Comunidades Naturais. O Processo
    de Degradação Ambiental. Os Estudo de Restauração Ecológica de Ecossistemas como
    Aplicação e Teste das Teorias de Comunidades: Métodos de Restauração, A Restauração
    Ecológica como Ecologia Aplicada.'
  course_name: 'LCB0217 - Ecologia de Comunidades

    Community Ecology'
  deactivation: ''
  instructors: '792922 - Flávio Bertin Gandara Mendes

    5243293 - Renato Augusto Ferreira de Lima'
  lecture_credits: '4'
  objectives: Dar aos alunos condições de reconhecer os componentes das Comunidades
    Naturais seu funcionamento e os mecanismos de sua auto-perpetuação. Estabelecer
    as Relações entre a organização das Comunidades e a Biodiversidade. Permitir aos
    alunos reconhecer as conseqüência das intervenções antrópicas sobre as comunidades
    e os métodos capazes de garantir o planejamento do seu uso, preservação e/ou restauração.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
