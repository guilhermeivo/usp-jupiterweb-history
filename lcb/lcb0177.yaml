courses:
  activation: 01/01/2015
  assessment: Esta disciplina não prevê recuperação.
  bibliography: 'Mayr, E. 1982. The growth of biological thougth; Diversity, Evolution
    and Inheritance. Belknap, Harvard.

    Mayr, E. 1998. O desenvolvimento do pensamento biológico; Diversidade, Evolução
    e Herança. Editora UnB.

    Mayr, E. 1988. Toward a new phylosophy of biology. Harvard University Press

    Mayr, E. 2009. Biologia, ciência única. Companhia das Letras.'
  course: 'Biologia como ciência e sua estrutura conceitual: a natureza da ciência;
    método em ciência; estrutura conceitual da biologia; filosofia da biologia. A
    mudança do pensamento biológico: antiguidade; renascimento; Iluminismo; Biologia
    no século XX e hoje. DIVERSIDADE: A ciência das espécies: conceitos de espécies
    iniciais; conceitos de espécies e o significado nas espécies na biologia. EVOLUÇÃO:
    Evolução antes de Darwin: Lamarck, Cuvier, Pensadores ingleses e alemães. Evidências
    apresentadas por Darwin para evolução natural e ancestralidade comum. As causas
    da evolução: seleção natural, conceitos e origem. Diversidade e síntese do pensamento
    evolutivo. Em direção a uma ciência da ciência: a maturação de teorias e conceitos;
    a ciência e o ambiente leigo; Progresso na ciência.'
  course_name: 'LCB0177 - História do Pensamento Biológico

    History of Biological Thought'
  deactivation: ''
  instructors: 494774 - Alexandre Reis Percequillo
  lecture_credits: '2'
  objectives: Apresentar aos alunos alguns importantes conceitos biológicos e conceitos
    de metodologia científica. Discutir os principais passos na evolução do pensamento
    biológico, com ênfase na compreensão da diversidade.
  practical_credits: '4'
  total_workload: 150 h
  type: Semestral
