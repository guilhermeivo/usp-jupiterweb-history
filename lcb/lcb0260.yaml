  objectives: "2.\tOBJETIVOS: A disciplina tem como objetivo o aprofundamento do estudo\
    \ dos anfíbios e dos répteis por meio de uma abordagem comparativa de aspectos\
    \ importantes da biologia e da ecologia dos diversos grupos, tais como locomoção,\
    \ alimentação, reprodução, interações predador-presa, comunicação, movimentos\
    \ e orientação, agrupamentos de espécies e conservação. O conteúdo programático\
    \ é transmitido aos alunos por meio de aulas teóricas, seminários e aulas práticas\
    \ de laboratório e de campo, utilizando-se, sempre que possível, exemplos retirados\
    \ da herpetofauna brasileira.."
  practical_credits: '2'
  total_workload: 120 h
