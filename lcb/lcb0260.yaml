  course: "3.\tPROGRAMA ANALÍTICO: 3.1. Posição dos Anfíbios e Répteis na Evolução\
    \ dos Vertebrados: 3.1.1. Filogenia dos tetrápodes; 3.1.2. Transição de peixes\
    \ para tetrápodes; 3.1.3. Monofiletismo dos Lissamphibia; 3.1.4. Relações entre\
    \ os Lissamphibia e os anfíbios do Paleozóico; 3.1.5. Os Lissamphibia como Temnospondylii\
    \ pedomórficos; 3.1.6 Relações entre as ordens atuais de Lissamphibia; 3.1.7.\
    \ A irradiação dos Amniota, 3.1.8. Aspectos controversos da evolução dos Amniota;\
    \ 3.2. Classificação e Diversidade dos Anfíbios Atuais: 3.2.1. Origem e evolução\
    \ de Urodela, Gymnophiona e Anura; 3.2.2. Reconhecimento de representantes das\
    \ três ordens de anfíbios atuais e das principais famílias brasileiras de anuros\
    \ 3.3. Classificação e Diversidade dos Répteis Atuais: 3.3.1. Parafiletismo do\
    \ grupo; 3.3.2. Origem e evolução de Chelonia, Crocodylia e Lepidosauria; 3.3.3.\
    \ Identificação de representantes brasileiros das principais famílias de lagartos\
    \ e serpentes por meio da utilização de chaves dicotômicas; 3.4. Locomoção: 3.4.1.\
    \ Locomoção terrestre com patas; 3.4.2. Salto; 3.4.3. Locomoção terrestre ápode;\
    \ 3.4.4. Locomoção aquática; 3.4.5. Escavação; 3.4.6. Escalada; 3.4.7. Locomoção\
    \ aérea; 3.5. Alimentação: 3.5.1. Sucção; 3.5.2. Mecanismos de alimentação terrestre;\
    \ 3.5.3. Cinetismo craniano; 3.5.4. Envenenamento; 3.5.5. Fossetas sensoriais;\
    \ 3.5.6. Herbivoria; 3.6. Reprodução e Ciclos de Vida; 3.6.1. Reprodução sexuada\
    \ e assexuada; 3.6.2. Ciclos reprodutivos, gametas, fecundação e desenvolvimento;\
    \ 3.6.3. Determinação do sexo; 3.6.4. Cuidado parental e viviparidade; 3.6.5.\
