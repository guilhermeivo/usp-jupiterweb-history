  course: '1. O ecossistema de pastagens:

    Apresentação e caracterização;

    Componentes integrantes (meio, planta e animal);

    Visão geral dos processos biológicos relacionados com a produção vegetal e animal;

    Inter-relação e interações entre componentes;

    Relação entre componentes e seu arranjo na determinação e caracterização de sistemas
    de produção animal a pasto;

    Conceito de produtividade animal em pastagens (produção por animal x taxa de lotação);

    Visão global e panorama do programa da disciplina ao longo do semestre.

    2. A planta forrageira:

    Forma e função;

    Aspectos de morfologia e fisiologia relevantes ao desenvolvimento e biologia das
    plantas;

    Transformação da energia luminosa em energia química (tecidos vegetais);

    Conceitos de índice de área foliar (IAF), área foliar remanescente, reservas orgânicas
    e sua relação com rebrota, produção e longevidade da pastagem;

    Formas de perenização (vegetativa e reprodutiva);

    Perfilhamento/brotação;

    Conceitos de resistência ao pastejo como caracterizados pelos componentes tolerância
    e preterimento ao pastejo;

    Conceitos relativos à plasticidade fenotípica de plantas forrageiras em pastagens;

    Ciclos dinâmicos de produção por indivíduo e pela comunidade de plantas no pasto;

    Fluxo de tecidos e dinâmica populacional de perfilhos;

    Mecanismo de compensação tamanho/densidade populacional de perfilhos;

    Conceitos relativos a estrutura do pasto e sua interação com a produtividade das
    plantas forrageiras sob diferentes regimes de desfolha;

    Caráter tampão dos processos biológicos determinantes e condicionadores da produção
    de forragem em pastagens.

    3. O processo de pastejo:

    Definição e caracterização;

    Importância do consumo voluntário na determinação do potencial de produção animal
    de uma pastagem;

    Conceituação de qualidade ou valor alimentar de uma forragem;

    Aspectos reguladores e determinantes do controle do consumo em animais e sua relação
    com situações em pastagens;

    Fatores componentes do consumo de forragem em pastejo e sua relação com a anatomia
    do aparato bucal e espécie animal;

    Descrição mecanística da atividade de pastejo;

    Relação entre características estruturais do pasto e o consumo voluntário de forragem
    por animais em pastejo (relação planta:animal);

    Relação desempenho individual vs produção de produto animal por unidade de área
    (eficiência de colheita da forragem produzida e acumulada);

    Importância do controle das características estruturais do pasto para assegurar
    eficácia e eficiência de práticas agronômicas e de manejo implementadas;

    Formas de monitoramento do pasto para fins de tomada de decisões relacionadas
    com o manejo da desfolha;

    métodos de pastejo (conceituação filosófica em termos de estrutura do pasto e
    controle do processo de colheita de forragem pelo animal)

    relação entre os métodos de pastejo e o perfil da desfolha efetuada em perfilhos
    ou plantas individuais no pasto

    necessidade de níveis diferenciados de controle e monitoramento para diferentes
    métodos de pastejo;

    4. Uso estratégico de práticas de conservação de forragem:

    Justificativa filosófica para a necessidade potencial do uso de técnicas de conservação
    de forragem (estrutura do pasto vs relação suprimento x demanda do sistema);

    Impacto sobre a estrutura e produção do pasto e sobre a produtividade biológica
    do sistema de produção;

    Potencial para associação entre as práticas de pastejo e conservação;

    5. Uso de alimentos suplementares volumosos e concentrados:

    Efeito de substituição - definição e conceituação;

    Relação com o valor nutritivo da forragem produzida no pasto e com o potencial
    produtivo e estado fisiológico dos animais;

    Parâmetros para o uso racional de alimentos concentrados em situações de pastagens;

    Impactos de curto, médio e longo prazos sobre a produtividade animal em pastagens
    e sobre o desempenho individual dos animais.'
  course_name: 'LZT0546 - Relações Planta-animal-meio em Ecossistemas de Pastagens

    Plant-Animal-Environment Relations in Pastoral Ecosystems'
  deactivation: ''
  instructors: 2085506 - Sila Carneiro da Silva
  lecture_credits: '4'
  objectives: A disciplina tem por objetivo fornecer embasamento teórico para a compreensão
    e entendimento dos processos biológicos concorrentes que se sucedem em ecossistemas
    de pastagens e que determinam e condicionam a dinâmica das respostas observadas
    em termos de produção de forragem e produto animal.  Ao longo do curso serão discutidos
    conceitos de ecologia de pastagens e do pastejo, de forma a permitir ao aluno
    vislumbrar o conjunto de fatores que interagem e compõem o ecossistema de pastagens,
    de forma a tornar claras as oportunidades para manipulação e interferência no
    sistema através de práticas agronômicas e de manejo.
