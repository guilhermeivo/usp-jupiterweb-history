  course: 'Componentes edafo-climáticos e biológicos do sistema de produção animal.  A
    estacionalidade  da produção de alimentos e as oportunidades de manipulação de
    fatores que a afetam.  Componentes de SUPRIMENTO e de DEMANDA  por alimentos em
    sistemas de produção animal e suas relações no planejamento da alimentação.  O
    mercado como regulador e determinante das tomadas de decisão e das estratégias
    adotadas no sistema.  Histórico e uso de índices mercadológicos na condução da
    atividade.  Aspectos conceituais do planejamento anual da produção de ruminantes
    baseada em pastagens (uso dos conceitos de SUPRIMENTO e DEMANDA e níveis hierárquicos
    do processo de tomada de decisão).  Aspectos quantitativos e qualitativos do complexo
    FORRAGEM:ANIMAL.  Conceitos e definições.  Produção, desempenho, e produtividade.  Estratégias
    de manejo e métodos de pastejo.  Efeito do clima na produção de alimento.  Modelos
    de produção de forragem baseados em variáveis climáticas e seu uso como ferramenta
    de gerenciamento.  Mecanização do sistema de produção animal: planejamento do
    parque de máquinas e das operações mecanizadas.  Conservação de forragem: opções,
    modalidades e planejamento da suplementação volumosa.  Engorda confinada como
    opção de terminação de animais para o mercado: considerações técnicas.  Manejo
    nutricional do rebanho: exigências nutricionais e planejamento da alimentação.'
  course_name: 'LZT0547 - Planejamento de Sistemas de Produção de Ruminantes

    Planning and Management of Forage Livestock Systems'
  deactivation: ''
  instructors: 601762 - Carlos Guilherme Silveira Pedreira
  lecture_credits: '4'
  objectives: A disciplina tem como principal objetivo fornecer aos alunos uma visão
    sistêmica da produção de ruminantes integrando conhecimentos das diversas disciplinas
    relacionadas com os fatores PLANTA:ANIMAL:MEIO.  Com isso, pretende-se habilitar
    o aluno para que o mesmo seja capaz de conhecer, planejar, dimensionar, implantar,
    conduzir, e avaliar sistemas pecuários completos, a partir de avaliação técnica
    da infra-estrutura física, material, biológico disponível (animal e vegetal),
    qualidade da condução e gerenciamento , potencial para aplicação de tecnologia,
    e fatores de mercado.  Espera-se, assim, poder inteferir sobre a eficiência global
    desses sistemas e propor técnicas que possam torná-los mais competitivos como
    atividade econômica.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
