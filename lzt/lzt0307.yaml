  course: 'INTRODUÇÃO A ANATOMIA: conceito e divisão da Anatomia Humana; Posição e
    nomenclatura Anatômica; Plano geral de construção do corpo humano. Conceitos básicos
    de fisiologia: Níveis organizacionais, Homeostasia e meio interno. SISTEMA NERVOSO:
    O neurônio; sistema nervoso central: encéfalo e medula espinhal; sistema nervoso
    periférico: nervos craniais e espinais; sistema nervoso autônomo; recepção de
    estímulos e comportamento. SISTEMA CIRCULATÓRIO: noções anatômicas: coração; artérias,
    capilares e veias; linfáticos. Fisiologia da circulação.  Circulação no coração,
    nos vasos sanguíneos e linfáticos. Ciclo cardíaco. SISTEMA RESPIRATÓRIO. Noções
    anatômicas: cavidade nasal, laringe, traquéia, pulmões, cavidade torácica. Respiração:
    movimentos respiratórios, mecanismos das trocas gasosas.  SISTEMA ENDÓCRINO. Noções
    anatômicas e hormônios da hipófise, tireóide, paratireóides, pâncreas, adrenais
    e gônadas.'
  course_name: 'LZT0307 - Anatomia e Fisiologia de Vertebrados I

    Anatomy and Physiology of Vertebrates'
  deactivation: ''
  instructors: '3389521 - Eduardo Francisquine Delgado

    5735072 - Roberto Sartori Filho'
  lecture_credits: '2'
  objectives: Através do estudo comparativo dos conceitos básicos da organização e
    funcionamento dos sistemas fisiológicos de integração nos mamíferos, aves, anfíbios
    e peixes, busca-se alcançar o entendimento dos mecanismos que permitem a operação
    harmoniosa do organismo animal.
  practical_credits: '3'
  total_workload: 120 h
  type: Semestral
