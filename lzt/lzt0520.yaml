  course: 'O sistema de produção animal em pastagens: definições, conceitos, componentes,
    processos, logística, oportunidades de manipulação e intervenção; Aspectos morfológicos
    e hábito de crescimento de plantas forrageiras: gramíneas e leguminosas; Fotossíntese
    e partição de fotoassimilados: análise comparativa entre plantas C3 e C4, potencial
    produtivo e implicações ecológicas, padrões de alocação de carbono; Estacionalidade
    de produção de plantas forrageiras e suas implicações para a produção animal em
    pasto: planejamento da relação suprimento x demanda, ajustes em taxa de lotação,
    implicações para o planejamento de sistemas de produção animal em pasto; Estabelecimento
    de pastagens: preparo de solo, escolha da planta forrageira, semeadura/plantio;
    Conceitos de índice de área foliar, interceptação de luz, crescimento e acúmulo
    de forragem: integração dos conceitos de fotossíntese, respiração, crescimento
    e senescência; Princípios básicos de manejo da desfolhação: freqüência, intensidade
    e época; Métodos de pastejo: definição e análise comparativa de estratégias para
    colheita de forragem pelo animal em pastejo; Anatomia de plantas forrageiras e
    qualidade de forragem: conceitos básicos de estrutura da planta, valor nutritivo
    e alimentar de plantas forrageiras; Culturas forrageiras para suplementação volumosa:
    noções gerais sobre alternativas forrageiras, escolha e custos envolvidos no processo;
    Fenação: definição e aspectos gerais; Ensilagem: definição e aspectos gerais.'
