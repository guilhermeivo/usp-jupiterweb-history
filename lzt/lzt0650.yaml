  course: "Importância da bovinocultura de corte. Características gerais da criação.\
    \ Considerações sobre o rebanho brasileiro. Raças de bovinos de corte que interessam\
    \ ao Brasil. Considerações sobre tipo, julgamento e avaliação de bovinos. Crescimento\
    \ de bovinos de corte e seu manejo. Reprodução de bovinos de corte e seu manejo.\
    \ Exigências nutricionais de bovinos de corte para manutenção, crescimento, reprodução\
    \ e engorda. Alimentação de gado de corte: Pastagens, feno, silagem, capineiras,\
    \ resíduos agrícolas e industriais e sub-produtos. Suplementado mineral de bovinos\
    \ de corte. Formulação de suplementos. Instalações e equipamentos. Práticas criatórias.\
    \ Manejo sanitário. Sistema de produção nas fezes de cria recria engorda. Manejo\
    \ de alimentação e formulação de suplementos protéicos, e de rações completas.\
    \ Melhoramento aplicado à produção de carne bovina. Testes de desempenho \tindividual\
    \ e progênie. Cruzamentos. Comercialização de bovinos de corte. Avaliação de carcaças\
    \ bovinas. Rendimento de carcaças e de carne. Subprodutos. Considerações gerais\
    \ sobre a bubalinocultura em relação a bovinocultura de corte. Estabelecimento\
    \ e manejo de rebanhos para produção de carne e reprodutores"
  course_name: 'LZT0650 - Bovinocultura de Corte

    Beef Cattle Husbandry'
