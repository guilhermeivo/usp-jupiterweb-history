  course: 'Princípios da adaptação animal. Bioclimatologia. Adaptações morfológicas,
    fisiológicas e comportamentais. Efeitos do ambiente sobre a produtividade.  Termorregulação
    e fisiologia ambiente.  Temperatura corporal. Balanço térmico. Respostas fisiológicas
    ao calor e ao frio. Aspectos fisiológicos da água na vida animal. Água corporal.
    Balanço hídrico. Desidratação e adaptação à falta de água.  Aspectos fisiológicos
    dos processos digestivos e utilização dos nutrientes. Aspectos gerais de endocrinologia.
    Atividade do eixo hipotálamo hipófise. Mecanismos específicos do controle hormonal
    da produção. Atividade da oxitocina. Proteção do organismo. Proteção específica
    e inespecífica. Mecanismos da imunidade. Características das imunoglobulinas e
    seu modo de ação. Nutrição e imunidade. Métodos de isolamento e quantificação
    das imunoglobulinas.  Colostro: características gerais conservação e avaliação
    imunológica. Mecanismos de síntese das secreções lácteas. Indução hormonal artificial
    da produção do colostro e leite.Manejo do recém-nascido e aquisição de imunidade
    passiva em mamíferos. Estudo comparativo do processo de formação e transferência
    de imunidade passiva nas diversas espécies.'
  course_name: 'LZT0493 - Fisiologia Animal Aplicada

    Applied Animal Physiology'
  deactivation: ''
  instructors: 43141 - Raul Machado Neto
  lecture_credits: '4'
  objectives: Através do estudo das funções animais relacionadas  com os processos
    produtivos, procura-se  mostrar como  se pode alcançar  maior eficiência  na exploração  dos
    animais domésticos, especialmente aqueles de interesse zootécnico.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
