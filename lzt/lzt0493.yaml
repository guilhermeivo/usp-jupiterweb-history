    Artigos científicos, teses e dissertações sobre fisiologia do exercício, fisiologia
    do estresse e

    fisiologia digestiva e de defesa em animais domésticos.'
  course: 'Homeostase; Sistemas de integração: sistema nervoso – organização, sensações
    e função motora, sistema nervoso somático, sistema nervoso autônomo, eixo hipotálamo-hipófise
    e integração com eixos endócrinos; Sangue; Fisiologia dos sistemas durante estresse
    (com ênfase em estresse térmico); Fisiologia dos sistemas durante o exercício
    – histofisiologia muscular; Fisiologia do crescimento; Fisiologia dos sistemas
    durante digestão, absorção e metabolismo - histofisiologia do trato intestinal;
    Proteção.'
  course_name: 'LZT0493 - Fisiologia Animal Aplicada

    Applied Animal Physiology'
  deactivation: ''
  instructors: 3389521 - Eduardo Francisquine Delgado
  lecture_credits: '1'
  objectives: Através do estudo integrado dos sistemas fisiológicos, analisando suas
    variáveis descritas ou obtidas em condições típicas encontradas em sistemas de
    produção ou em simulações, procurar-se-á mostrar como reconhecer, avaliar e alterar
    respostas fisiológicas integradas na busca pela sustentabilidade na criação dos
    animais vertebrados, especialmente aqueles domesticados e de interesse zootécnico.
  practical_credits: '2'
