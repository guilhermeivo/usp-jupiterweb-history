  course: 'Parte Teórica Importância zootécnica e econômica da Avicultura. História
    da produção avícola no Brasil. Estatística da produção: mercado interno exportação.
    Regiões avícolas. Problemas atuais. Produtos e subprodutos avícolas. Estrutura
    da produção avícola. Integração avícola. Origem e classificação das aves. Raças,
    linhagens e variedades das aves domésticas. Cruzamentos industriais. Aspectos
    anatômicos e fisiológicos das aves. Genética e melhoramento avícola: herança dos
    caracteres qualitativos e quantitativos de interesse econômico. Planejamento avícola:
    fatores a serem  considerados na instalação de granjas comerciais. Instalações
    e equipamentos avícolas. Reprodução avícola. Incubação: incubatório, equipamentos
    e fluxogramas operacionais. Medidas sanitárias. Fatores que afetam a incubabilidade
    dos ovos. Criação das aves: sistemas de criação, manejo de criação e arraçoamento
    de frangos de corte, aves para produção de ovos de consumo e aves reprodutoras.
    Exigências nutritivas das aves. Programas de alimentação. Alimentos e aditivos
    utilizados nas rações avícolas. Tipos e formas de rações. Profilaxia e controle
    das principais doenças parasitárias e infecto-contagiosas. Doenças nutricionais.
    Comercialização e tecnologia dos ovos. Comercialização e tecnologia da carne de
    aves. Parte Prática: Exame interno e descrição dos principais órgãos. Exterior
    das principais raças, linhagens e variedades das aves domésticas. Incubação: manejo
    da incubação, análise dos ovos e dos resíduos de incubação para levantamento do
    perfil reprodutivo das aves reprodutoras. Ovoscopia. Planejamento avícola: Cálculo
    da área mínima para implantação de uma granja avícola. Estudos econômicos das
    diferentes criações das aves. Formulação de rações: métodos e fatores a serem
    considerados na formulação. Seleção e refugagem das aves comerciais e reprodutoras.
    Necropsia das aves: tecidos e órgãos para análises patológicas. Determinação e
    reconhecimento da qualidade dos produtos avícolas. Visitas a organizações avícolas.'
  course_name: 'LZT0643 - Avicultura

    Poultry Production'
  deactivation: ''
  instructors: 75154 - José Fernando Machado Menten
  lecture_credits: '4'
  objectives: Dar ao estudante uma visão global da produção avícola, enfatizando sua
    importância econômica e social, as bases biológicas e as tecnologias para a produção
    de galinhas poedeiras, aves, matrizes e frangos de corte.
