  course: A disciplina compreende aspectos teóricos e práticos da bovinocultura de
    leite com ênfase na manipulação de fatores produtivos. Oferece subsídios para
    a criação de bovinos leiteiros e para  entendimento do mercado. Enfatiza a necessidade
    da aplicação de tecnologia para obtenção de resultados econômicos positivos. Fornece
    elementos para o planejamento e instalação de fazendas produtivas.
  course_name: 'LZT0652 - Manejo de Bovinos Leiteiros

    Dairy Cattle Management'
  deactivation: 31/12/2023
  instructors: 502809 - Carla Maris Machado Bittar
  lecture_credits: '4'
  objectives: Analisar o setor leiteiro do  país e caracterizar fatores limitantes  à
    economia do processo. Capacitar o estudante para o planejamento  e condução  de
    uma empresa produtora de leite.
  practical_credits: '0'
  total_workload: 60 h
