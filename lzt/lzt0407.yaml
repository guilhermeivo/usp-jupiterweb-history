  course: 'SISTEMA ESQUELÉTICO: noções anatômicas, função e divisão do esqueleto;
    Estrutura e desenvolvimento ósseo; Classificação dos ossos; esqueleto axial: crânio,
    coluna vertebral, esterno e costelas; esqueleto apendicular: membros anteriores,
    membros posteriores e bacia pélvica. SISTEMA ARTICULAR: conceito, tipo e classificações
    das articulações; Articulações fibrosas (suturas e sindesmoses); Articulações
    cartilaginosas (sincondroses e sínfises); Articulações sinoviais: bolsas sinoviais
    e bainhas dos tendões; movimento das articulações sinoviais; ligamentos, estrutura,
    função e tipos. SISTEMA MUSCULAR: noções anatômicas comparativas; nomenclatura
    dos músculos; características e funcionamento. SISTEMA DIGESTÓRIO. Noções anatômicas:
    boca, língua, dente, glândulas salivares, faringe, esôfago, cavidade abdominal,
    estômago, intestino delgado, intestino grosso, fígado e pâncreas. Fisiologia:
    preensão, mastigação, ensalivação, deglutição, digestão no estômago simples, digestão
    no estômago plurilocular, digestão no intestino delgado, digestão no  intestino  grosso,
    defecação. Absorção. SISTEMA URINÁRIO. Noções anatômicas: rins, ureteres, bexiga,
    uretra. Mecanismos da secreção urinária. SISTEMA REPRODUTOR MASCULINO. Noções
    anatômicas: testículos, dutos, pênis e órgãos acessórios. Espermatogênese, sêmen
    e ejaculação. SISTEMA REPRODUTOR FEMININO. Noções anatômicas: ovários, útero,
    vagina e vulva. Ciclo estral. Oogênese, fecundação, gestação, anexos embrionários
    e parto.'
  course_name: 'LZT0407 - Anatomia e Fisiologia de Vertebrados II

    Anatomy and Physiology of Vertebrates'
  deactivation: ''
  instructors: '3389521 - Eduardo Francisquine Delgado

    5735072 - Roberto Sartori Filho'
  lecture_credits: '2'
  objectives: Através do estudo comparativo dos conceitos básicos da organização e
    funcionamento dos sistemas fisiológicos estruturais, de metabolimo alimentar e
    de reprodução nos mamíferos, aves, anfíbios e peixes, busca-se alcançar o entendimento
    dos mecanismos que permitem a operação harmoniosa do organismo animal.
  practical_credits: '3'
  total_workload: 120 h
