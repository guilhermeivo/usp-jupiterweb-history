  course: 'Conceito de qualidade em plantas forrageiras. Valor nutritivo e consumo
    voluntário de forragens. Composição da planta forrageira: parede celular. Estrutura
    morfológica, histológica e anatômica em vegetais. Organização da parede  celular
    e tecidos em plantas forrageiras. Síntese de polissacarídeos estruturais da parede
    celular. Síntese de compostos fenólicos e constituição da matriz lignificada.
    Composição da planta forrageira: conteúdo celular. Síntese e armazenamento de
    carboidratos solúveis e proteínas  na planta.  Efeitos de ambiente na composição
    da forragem. Temperatura. Fotoperíodo.  Radiação. Disponibilidade de água no solo
    e a irrigação suplementar. Pressão atmosférica de CO2.  Alterações do valor nutritivo
    de plantas forrageiras geneticamente modificadas. Relação haste/folha.  Alterações
    histológicas. Gene "Brown mid-rib". Fatores antinutricionais e/ou modificadores
    de metabolismo animal presentes em plantas forrageiras. Taninos. Saponinas Alcalóides.
    Compostos cianogênicos. Culturas forrageiras destinadas à suplementação de ruminantes.  Características
    agronômicas.  Fisiologia do crescimento e maturação.  Estratégias de uso da forragem.
    Produção versus valor nutritivo.  Estacionalidade de produção da forragem.  Frequência
    e intensidade de uso da forragem.  Manejo de capineiras para a suplementação de
    animais. Cana-de-açúcar. Graníeis tropicais. Produção de silagens  Características
    de plantas destinadas à ensilagem: milho e sorgo.  Cinética e bioquímica do processo
    de fermentação anaeróbica.  Perdas na ensilagem. Dimensionamento de estruturas
    para armazenamento de silagem. Vedação do silo. Planejamento de uso de áreas destinadas
    a produção de silagem.  Reciclagem de nutrientes em glebas suportando culturas
    para ensilagem. Escolha de híbridos/variedades de milho, sorgo, gramíneas tropicais,
    alfafa, leguminosas para a ensilagem.  Ponto de corte, tamanho de partícula e
    processamento de volumosos visando a ensilagem. Silagem pré-secada: conceito e
    limitações. Gerenciamento de operações visando qualidade total no processo de
    produção de silagem e na utilização de equipamentos. Micotoxinas em silagens.  Ensilagem
    de grãos de cereais contendo alta umidade.  Produção de feno. Características
    de plantas destinadas à fenação: alfafa e gramíneas tropicais.  Cinética do processo
    de desidratação. Perdas na fenação. Dimensionamento de estruturas para armazenamento
    de feno  Alterações fisiológicas na planta após a ceifa. Planejamento de uso de
    áreas destinadas a produção de feno.  Reciclagem de nutrientes em glebas suportando
    culturas para produção de feno.  Escolha de híbridos/variedades gramíneas e leguminosas
    para a fenação.  Ponto de ceifa : produtividade versus valor nutritivo. Uso de
    condicionadores. Gerenciamento de operações visando qualidade total no processo
    de produção de feno e na utilização de equipamentos.  Maceração da forragem visando
    desidratação.  Adtivos no processo de conservação de forragens. Compostos nitrogenados.   Inibidores
    de fermentação.  Estimuladores de fermentação: fontes de carboidratos solúveis,
    bactérias e leveduras; enzimas digestoras de amido e componentes da parede celular.
    Agentes aceleradores de secagem. Culturas de inverno. Características agronômicas
    para o estabelecimento.  Maturidade fisiológica, valor nutritivo e estratégias
    de utilização. Adequação para o processo de conservação. Utilização em sistemas
    intensificados. Sistemas de rotação de culturas e cultivo sucessivo/associado.
    Resíduos ligno-celulósicos. Potencial de utilização e obtenção.

    Tratamentos químico, físico e biológico visando incremento do valor nutritivo.
    Conservação de resíduos fibrosos. Culturas não convencionais. Girassol.  Milheto.
    Modelagem de processos envolvidos com a conservação de forragem. Condições climáticas
    relacionadas com os processos de ensilagem e fenação. Planejamento em produção
    de volumosos suplementares em sistemas intensificados.'
  course_name: 'LZT0570 - Qualidade e Conservação de Volumosos para Ruminantes

    Quality and Conservation of Forage for Ruminants'
  deactivation: ''
  instructors: 700706 - Luiz Gustavo Nussio
  lecture_credits: '4'
  objectives: O curso tem por objetivo apresentar, discutir e desenvolver temas relacionados
    com a qualidade e conservação de alimentos volumosos para animais. Constam do
    conteúdo, conceitos básicos e aplicados relativos aos processos de crescimento
    e subseqüentes alterações em parâmetros da composição anatomo-histológica em plantas
    forrageiras. Serão abordados aspectos relativos à produção de forragem, sua conservação,
    e utilização; bem como o uso de resíduos fibrosos ligno-celulósicos na alimentação
    de ruminantes. O programa proposto sugere numa sequência didática a abordagem
    de temas que visam oferecer ao aluno uma visão integrada da área de produção e
    conservação de alimentos, permitindo aos alunos avaliar o processo de produção,
    identificar problemas, e equacionar soluções técnicas apropriadas.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
