  course: 'Ovino e caprinocultura: vantagens e limitações. Situação da ovino e caprinocultura
    no Brasil e no mundo. Características dos produtos.  Principais raças ovinas de
    interesse no Brasil. Características e aptidões. Sistemas de criação e tipos  de
    exploração ovina. Instalações e equipamentos. Alimentação de ovinos: exigências
    nutricionais para manutenção, crescimento, reprodução e produção. Reprodução de
    ovinos: ciclo estral na ovelha, manejo reprodutivo, inseminação artificial.  Práticas
    criatórias: desmama, marcação,  castração e corte de cauda. Manejo sanitário:
    descrição e profilaxia das principais moléstias infecciosas e parasitárias dos
    ovinos. Produção de lã e pele. Tosquia e propriedades da lã. Principais raças
    caprinas de interesse no Brasil. Características zootécnicas e aptidões. Sistemas
    de criação e tipos de exploração caprina. Instalações e equipamentos. Alimentação
    de caprinos: exigências nutricionais para manutenção, crescimento, reprodução
    e produção. Reprodução em caprinos: ciclo estral na cabra, manejo reprodutivo
    e inseminação artificial.  Práticas criatórias: aleitamento artificial, desmama,
    marcação, castração e descorna de caprinos. Manejo sanitário: descrição e profilaxia
    das principais moléstias infecciosas e parasitárias dos caprinos.  Produção de
    leite caprino: anatomia e fisiologia de glândula mamária, fatores que afetam a
    quantidade e a qualidade do leite produzido e características do leite caprino.'
