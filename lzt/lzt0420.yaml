  course: 'Bovinocultura leiteira: situação atual e perspectivas da produção de leite
    no Brasil; Sistemas de produção de leite: raças, cruzamento e melhoramento de
    animais leiteiros; sistemas de criação, manejo e alimentação de animais em crescimento
    e animais adultos; manejo sanitário do rebanho e de instalações; avaliação da
    qualidade do leite; gestão da produção de leite.

    Bovinocultura de corte: situação atual e perspectivas da produção de carne no
    Brasil; Sistemas de produção de gado de corte: raças e cruzamento, sistemas de
    criação, manejo e alimentação de animais em crescimento e animais em terminação;
    manejo sanitário do rebanho e de instalações; qualidade da carne; gestão da produção
    de bovinos de corte.

    Caprinocultura e ovinocultura: situação atual e perspectivas da produção de caprinos
    e ovinos no Brasil; Sistemas de produção de pequenos ruminantes: raças e cruzamento,
    sistemas de criação, manejo e alimentação de animais em crescimento e animais
    em terminação; manejo sanitário do rebanho e de instalações; qualidade da carne
    e do leite.'
  course_name: 'LZT0420 - Produção Animal II

    Animal production II'
  deactivation: ''
  instructors: 3628090 - Gerson Barreto Mourão
  lecture_credits: '2'
  objectives: Ministrar aos estudantes conhecimentos essenciais sobre os sistemas
    de produção, alimentos, alimentação e nutrição, reprodução, melhoramento, sanidade,
    ambiência e conforto e qualidade dos produtos de origem animal, na forma de uma
    visão global da produção de animais ruminantes no Estado de São Paulo e no Brasil.
  practical_credits: '0'
  total_workload: 30 h
