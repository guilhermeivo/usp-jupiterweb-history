  course: "Avicultura: evolução das aves industriais; situação atual e perspectivas\
    \ da avicultura brasileira; estrutura da cadeia produtiva da avicultura no Brasil;\
    \ produtos e subprodutos avícolas; integração avícola; cruzamentos industriais;\
    \ planejamento avícola; fatores a serem considerados nas instalações de granjas\
    \ avícolas; sistemas de criação, manejo e alimentação de frangos de corte, galinhas\
    \ poedeiras e reprodutores. Piscicultura: caracterização biológica e sistemática\
    \ das espécies exóticas e nacionais utilizadas em piscicultura; sistemas de produção\
    \ e regimes de manejo; o conceito de capacidade de sustentação e fundamentos de\
    \ manejo da qualidade da água para piscicultura; alimentação, nutrição e manejo\
    \ alimentar de peixes em confinamento; manejo da reprodução \x96 propagação artificial,\
    \ número efetivo de reprodutores e endocruzamento em populações confinadas. Suinocultura:\
    \ situação atual e importância econômica da suinocultura brasileira; principais\
    \ raças de suínos; exterior dos suínos e sistemas de cruzamento industrial em\
    \ suinocultura; características reprodutivas e sua importância na produção industrial\
    \ de suínos; manejo da reprodução em suinocultura industrial; manejo do rebanho\
    \ suíno - marcação; castração; vacinação; desmama, etc. Biotecnologia animal:\
    \ princípios básicos de engenharia genética; aplicações da biologia molecular\
    \ e biotecnologia na produção animal; noções de composição corporal; curvas de\
    \ crescimento, princípios de biologia do crescimento; modo de ação e as aplicações\
    \ dos reguladores e promotores de crescimento na produção animal. Melhoramento\
    \ animal: a genética dos caracteres métricos: genes que afetam os caracteres quantitativos;\
    \ estimação de parâmetros genéticos e do valor genético; os programas de seleção\
    \ na pesquisa e na prática da produção animal."
  course_name: 'LZT0419 - Produção Animal I

    Animal production I'
  deactivation: ''
  instructors: 2231328 - Urbano dos Santos Ruiz
  lecture_credits: '2'
  objectives: Ministrar aos estudantes conhecimentos essenciais sobre os sistemas
    de produção, alimentos, alimentação e nutrição, reprodução, melhoramento, sanidade,
    ambiência e conforto e qualidade dos produtos de origem animal, na forma de uma
    visão global da produção de animais não ruminantes no Estado de São Paulo e no
    Brasil.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
