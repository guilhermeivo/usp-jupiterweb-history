  objectives: Dar ao estudante uma visão geral dos aspectos básicos da nutrição de
    ruminantes, envolvendo a digestão dos alimentos, absorção e metabolismo dos nutrientes.
    Principais  alimentos usados na alimentação dos ruminantes. Aspectos básicos de
    nutrição dos ruminantes.
