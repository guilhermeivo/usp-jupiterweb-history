  course: "1-\tHistórico da nutrição animal. Ciências afins. Nutrientes e alimentos.\
    \ Sistema digestivo  relacionado com a nutrição dos ruminantes.\n2-\tCarboidratos:\
    \  classificação, digestão, metabolismo e utilização dos extrativos não nitrogenados\
    \  (ENN)  e dos carboidratos estruturais. Fontes de carboidratos. O conceito de\
    \ energia.\n3-\tLipídeos: classificação, estudo dos lipídeos de interesse em nutrição\
    \ de ruminantes. Fontes de gordura e sua utilização.\n4-\tProteínas: composição\
    \ química, classificação e funções na nutrição dos ruminantes. Aminoácidos: construção,\
    \ essencialidade e sua função na qualidade da proteína: o efeito suplementar dos\
    \ aminoácidos. Valor biológico das proteínas. Substâncias nitrogenadas não protéicas\
    \ (NNP).\n5-\tMinerais: classificação, estudo dos macro e micro minerais;  suplementação\
    \ mineral na  nutrição dos ruminantes.\n6-\tVitaminas:  classificação, funções,\
    \ produção microbiana, vitamina A e carotano, vitamina D, vitamina E selênio,\
    \ vitaminas do complexo B.\n7-\tValor nutritivo dos alimentos: concentração, digestibilidade\
    \ e consumo dos nutrientes.\n8-\tExpressões do valor energético  dos alimentos\
    \ e das exigências nutricionais dos animais.\n9-\tFatores físicos e biológicos\
    \ que alteram a qualidade dos alimentos. Efeitos do armazenamento e do processamento\
    \ na qualidade dos alimentos.\n10-\tClassificação dos alimentos. Estudo e utilização\
    \ dos alimentos concentrados e suplementos nutricionais.\n11-\tEstudo e utilização\
    \ dos alimentos volumosos nutricionais e conservados.\n12-\tNormas e padrões de\
    \ alimentação dos ruminantes: formulação e cálculo de rações."
  course_name: 'LZT0446 - Nutrição dos Ruminantes

