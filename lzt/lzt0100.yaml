  course: '1. A Zootecnia:  definição, origem, evolução.  Áreas e oportunidades de
    trabalho para o Engenheiro Agrônomo especialista em Zootecnia.  Exemplos de colocação
    profissional.

    2. Os animais domésticos: espécies, origem, evolução.  Produtos de origem animal:
    sua importância econômica e para a alimentação humana.

    3. Animais ruminantes e não ruminantes: diferenças no uso de fontes de alimento.  Noções
    elementares do aparelho digestório e rudimentos da nutrição animal.

    Os Animais Não-Ruminantes

    4. Aves: as espécies (raças), a indústria, noções básicas sobre a atividade

    5. Suínos: as espécies (raças), a indústria, noções básicas sobre a atividade

    6. Peixes (e crustáceos?):  as espécies (raças), a indústria, noções básicas sobre
    a atividade

    7. Equinos: as espécies (raças), a indústria, noções básicas sobre a atividade

    Os Animais Ruminantes

    8. Bovinos de Corte: as espécies (raças), a indústria, noções básicas sobre a
    atividade

    9. Bovinos de Leite: as espécies (raças), a indústria, noções básicas sobre a
    atividade

    10. Caprinos: as espécies (raças), a indústria, noções básicas sobre a atividade

    11. Ovinos: as espécies (raças), a indústria, noções básicas sobre a atividade

    12. A biotecnologia aplicada à Zootecnia:  histórico, avanços e oportunidades

    13. Noções básicas de gestão empresarial aplicada ao agronegócio da pecuária.'
  course_name: 'LZT0100 - Zootecnia Geral

