  course: "Parte Teórica: A produção no Brasil e no mundo: histórico, importância\
    \ econômica, estatísticas de produção atual e perspectivas. O suíno: classificação\
    \ zoológica; origem e domesticação; características biológicas; características\
    \ econômicas; tipos de suínos. Raças, genética e melhoramento de suínos: aplicação\
    \ dos conceitos de genética; objetivos do melhoramento; seleção; estudo do exterior;\
    \ índices de seleção; sistemas de cruzamento. Bases para o planejamento de uma\
    \ criação de suínos: análise do mercado; recursos disponíveis; dimensionamento\
    \ de instalações; equipamentos; ração; água; custo de produção e tipos de produção.\
    \ Reprodução: anatomia do sistema reprodutor masculino e feminino; puberdade;\
    \ cio e ciclo estral; acasalamento; gestação, parição; inseminação artificial;\
    \ fatores que afetam a eficiência reprodutiva. Nutrição dos suínos: aparelho digestivo;\
    \ nutrientes essenciais; exigências nutricionais; interações entre nutrientes;\
    \ deficiências nutricionais. Alimentação dos suínos: descrição e caracterização\
    \ dos diferentes alimentos; formulação de rações; aditivos. Manejo do rebanho\
    \ suíno: manejo de leitões ao nascer; manejo de leitões da desmama ao abate; manejo\
    \ de matrizes em pré-gestação, gestação e lactação; manejo de cachaços; manejo\
    \ da alimentação das diversas categorias de suínos. Manejo sanitário do rebanho\
    \ suíno, envolvendo isolamento, limpeza e desinfecção das instalações dos animais.\
    \ Manejo dos dejetos dos suínos. Instalações para suínos: conforto ambiental,\
    \ fatores que afetam a produtividade; edificações para os animais; construções\
    \ complementares. Técnica de pesquisa com suínos; experimentos de nutrição e alimentação\
    \ de suínos. O suíno como produtor de carne: fatores que afetam a qualidade da\
    \ carcaça; avaliação de carcaças; mercado de carne suína e derivados e qualidade\
    \ da carne.\nParte Prática:\nApreciação, avaliação e escolha dos leitões destinados\
    \ à reprodução e de reprodutores nas raças criadas no Departamento de Zootecnia\
    \ Escola Superior de Agricultura \x93Luiz de Queiroz\x94. Proporções mais usuais\
    \ de alimentos em rações de suínos. Formulação de ração e arraçoamento. Manejo\
    \ e práticas criatórias: marcação, desmama, vacinação, castração, aplicação de\
    \ ferro, aplicação de vermífugos, administração de medicamentos, pesagens e outras\
    \ práticas rotineiras de manejo. Manejo sanitário do rebanho. Escrituração zootécnica\
    \ e registro genealógico. Profilaxia e higiene das instalações. Serviços de rotina\
    \ de uma granja de suínos. Pararasitas mais comuns dos suínos \x96 profilaxia\
    \ e combate."
  course_name: 'LZT0644 - Suinocultura

    Swine Production'
  deactivation: ''
  instructors: 2231328 - Urbano dos Santos Ruiz
  lecture_credits: '4'
