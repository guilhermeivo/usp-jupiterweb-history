  course: 'Anatomia do aparelho digestório dos animais não ruminantes. Princípios
    da nutrição animal como ciência: digestão, absorção e metabolismo dos nutrientes
    em animais não ruminantes. Estudos dos nutrientes: água, carboidratos, lipídios,
    proteínas, minerais e vitaminas, envolvendo as funções no organismo animal, inter-relações
    nutricionais, deficiências nutricionais, toxicidade. Alimentos protéicos e energéticos
    para os animais não ruminantes: tipos e usos dos alimentos, composição e avaliação
    dos alimentos, características favoráveis ou indesejáveis de alguns alimentos,
    processamento de alimentos, etc. Suplementos vitamínicos. Suplementos minerais.
    Aditivos de rações. Exigências nutricionais das principais espécies de animais
    não ruminantes de interesse zootécnico/econômico: suínos, aves, cavalos e peixes.
    Fundamentos de formulação de rações para animais não ruminantes.'
  course_name: 'LZT0443 - Nutrição dos Não Ruminantes

