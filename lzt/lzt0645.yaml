  course: 'Agronegócio cavalo: visão Nacional e internacional; planejamento da criação
    de equinos; Infraestrutura específica e opcional para a criação de equinos – Bem-estar
    de equinos estabulados e a pasto; manejo reprodutivo de equinos; Especificidades
    na nutrição de equinos; Manejo de fases: garanhões, cavalos castrados, éguas,
    potros,  cavalos atletas; comportamento e bem-estar de equinos; Manejo sanitário
    de haras; morfologia e exterior de equinos.'
  course_name: 'LZT0645 - Eqüinocultura

    Equine Husbandry'
  deactivation: ''
  instructors: 6997042 - Roberta Ariboni Brandi
  lecture_credits: '4'
  objectives: Transmissão de conhecimentos teóricos e práticos referente a criação
    de equinos, visando a produção econômica e sustentável da espécie em diferentes
    sistemas de criação. Aprofundar conceitos de nutrição nas diversas fases fisiológicas.
    Apresentar conceitos de morfologia e ezoognósia de equinos.
