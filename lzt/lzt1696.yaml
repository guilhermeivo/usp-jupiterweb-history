  course: 'O agronegócio do pescado. Caracterização biológica e sistemática das espécies
    exóticas e nativas de peixes mais importantes para a piscicultura nacional. Sistemas
    de produção de peixes em confinamento, integração agricultura-piscicultura e aquaponia.
    Fundamentos de qualidade da água para piscicultura. Nutrição e manejo alimentar
    de peixes em confinamento: hábitos alimentares, fisiologia da alimentação e digestão,
    exigências alimentares e nutricionais, práticas alimentares, formulação e processamento
    de dietas para peixes. O ciclo de vida dos peixes confinados: fisiologia e manejo
    da reprodução, larvicultura, alevinagem, recria e engorda. Princípios gerais de
    doenças infecciosas na piscicultura: interação entre hospedeiro, patógeno e ambiente,
    e técnicas generalizadas de gerenciamento de doenças. Técnicas de abate e processamento
    do pescado.'
