  course: 'Caracterização biológica e sistemática das espécies exóticas e nacionais
    utilizadas em piscicultura: ciprinídeos, cichlídeos, salmonídeos, centrarchídeos
    e silurídeos exóticos; espécies dos gêneros Colossoma sp e Piaractus sp. e Salminus
    sp.; osteoglossiformes, cichlídeos e siluriformes nacionais. Sistemas e regimes
    de manejo, capacidade de sustentação e fundamentos de manejo da qualidade da água
    para piscicultura. Nutrição e manejo alimentar de peixes em confinamento: hábitos
    alimentares; fisiologia da alimentação e digestão; exigências alimentares e nutricionais
    dos peixes em confinamento; práticas alimentares em tanques e viveiros; formulação
    e processamento de dietas para peixes. Manejo da reprodução de populações confinadas:
    comportamento e adaptações reprodutivas; índices gonadais e fator de condição;
    índices de fecundidade; o número efetivo de reprodutores e o endocruzamento em
    populações.'
  course_name: 'LZT1696 - Piscicultura

    Fish Culture'
