  course: 'Conceito e importância da bromatologia na zootecnia. Conhecimento de equipamentos
    e vidrarias a serem utilizadas. Técnicas de pesagem. Boas práticas de laboratório.
    Classificação dos alimentos. Importância e técnicas de amostragem de acordo com
    o tipo de alimento. Homogenização e processamento de amostra para análise (pré-secagem
    e moagem).  Composição centesimal, método de Weende. Técnicas de determinação
    de matéria seca: estufa, método do tolueno, liofilização. Determinação de material
    mineral. Métodos de determinação de nitrogênio e estimativa de valores de proteína:
    Proteína bruta, Nitrogênio não-protéico, nitrogênio solúvel, conceito de proteína
    verdadeira. Determinação de fibra bruta, limitações para fins de formulação de
    ração. Sistema Van Soest de determinação da fração fibra: fibra detergente ácido,
    fibra detergente neutro e lignina. Carboidratos não estruturais, métodos de determinação:
    carboidratos solúveis, amido.  Ensaios de digestibilidade e de degradabilidade.
    Energia bruta, determinação em bomba calorimétrica e estimativas de energia líquida
    e metabolizável.'
  course_name: 'LZT0580 - Análise e Composição de Alimentos

    Feed Analysis and Composition'
  deactivation: 31/12/2023
  instructors: 502809 - Carla Maris Machado Bittar
  lecture_credits: '4'
  objectives: Oferecer ao aluno conhecimentos básicos para determinação e interpretação
    de resultados da composição dos alimentos para alimentação animal, ruminantes
    e não-ruminantes, através de métodos adequados de análise. O curso se propõe também
    a oferecer princípios básicos de trabalho em laboratórios de análise.
  practical_credits: '0'
