  assessment: Not applicable.
  bibliography: Reading material and reference articles are provided throughout the
    course.
  course: '1) Water reuse for agriculture in perspective: Historical review of the
    treated wastewater reuse in the agricultural sector. Role of wastewater resources
    in water-scarce conditions. Opportunities and challenges associated with the use
    of reclaimed water for crop production. The water reuse concept. Agricultural
    wastewater sources. Water reuse in the circular economy context. 2) Water quality
    parameters for assessing wastewater suitability for irrigation: Pathogens, heavy
    metals, organic compounds, emergent contaminants, nutrients, salts. Relationship
    of these parameters with the wastewater effects on the environment and the plant
    production quality and safety. Establishment of monitoring systems. 3) Water reclamation
    systems and implementation of treatment technologies: Wastewater collection, treatment,
    storage, and distribution. Primary, secondary, and tertiary wastewater treatments.
    Advanced treatments. Operation and maintenance of water reclamation systems. Costs
    and technological efficiency. 4) Irrigation with wastewater: Quality of the effluent
    and choice of the irrigation system and devices. Effects in the short and long
    term on crops and soil (salinity effects, nutrient management, crop yield and
    quality). Innovative models and adaptation of irrigation techniques and practices.
    5) Socioeconomic aspects: Cost-benefit analysis to assess the economic feasibility.
    Stakeholder and consumer acceptance. Strategies to promote irrigation with treated
    wastewater in Brazil. 6) Regulations and standards: Review of water reuse and
    food and hygiene standards. 7) Experiences in reclaimed water use: Real case studies
    of reclaimed water use in agriculture. Technical visit to an irrigation area using
    wastewater from a fish farming plant.'
  course_name: LZT0700 - Plant-assisted bioremediation technologies in integrated
    crop-livestock systems for agricultural wastewater management and treatment
  deactivation: ''
  instructors: 5152941 - Brunno da Silva Cerozi
  lecture_credits: '3'
  objectives: 1) Better understand the role of agricultural wastewater reuse in water
    resource management and planning. 2) Enhance capacity to assess agricultural wastewater
    suitability for irrigation. 3) Learn about the necessary treatments for a safe
    wastewater fit-for purpose reuse, technically and economically viable. 5) Gain
    insights on irrigation practices and techniques for the use of reclaimed water
    sources that preserve soil quality and crop production. 6) Explore strategies
    to improve the acceptance of wastewater reuse for food production. 7) Raise awareness
    of the institutional and socioeconomic implications of wastewater reuse projects.
    8) Acquire experience in the development and implementation of wastewater reuse
    projects through real success cases. 8) Become familiar with current and forthcoming
    regulatory frameworks on wastewater reuse at national and international levels.
    *This course is offered in English.
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
