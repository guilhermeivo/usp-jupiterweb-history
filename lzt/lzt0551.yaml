  bibliography: "Literatura Básica:\nPastagens.Fundamentos da Exploração Racional.\
    \ In: PEIXOTO, A.M. MOURA, J.C. & FARIA, V.P.Fundação de Estudos Agrários Luiz\
    \ de Queiroz, 1986. Piracicaba, SP.\nEcofisiologia da Produção Agrícola. 1987.\
    \ \x93In\x94. CASTRO, R. C. Ferreira, S O & YAMADA, T. Associação Brasileira para\
    \ Pesquisa de Potássio e Fosfato. Piracicaba, SP.\nDa Silva, S.C.; Nascimento\
    \ Junior, D.; Euclides, V.B.P. Pastagens: conceitos básicos, produção e manejo.\
    \ Suprema Gráfica Ltda., Viçosa, MG, 2008.\nHODGSON, J.  Grazing management \x96\
    \ science into practice. Essex: Longman Scientific & Technical, 1990.\nAnais dos\
    \ Simpósios sobre o Manejo de Pastagens da ESALQ."
  course: "\x95 Importância das áreas de pastagens para a produção animal \x96 contextualização\
    \ da disciplina e da forma como será abordada\n\x95 Necessidades edafoclimáticas\
    \ das plantas forrageiras e o reconhecimento de regiões agro-pastoris \x96 conhecimento\
    \ das restrições climáticas e de solo à exploração de plantas forrageiras e pastagens\
    \ e suas implicações\n\x95 Uso de corretivos e fertilizantes em pastagens (calcário,\
    \ gesso, nitrogênio, fósforo, potássio e micronutrientes) \x96 fontes, formas\
    \ de aplicação, análise de solo e sua interpretação, cálculo de adubação etc.\n\
    \x95 Irrigação de pastagens \x96 particularidades e contexto\n\x95 Identificação\
    \ de espécies forrageiras (gramíneas e leguminosas) \x96 componente prático a\
    \ ser realizado em canteiro agrostológico a ser mantido pelos alunos da disciplina\
    \ de forma alternada nos semestres com aqueles de LZT 520\n\x95 Crescimento e\
    \ desenvolvimento de plantas forrageiras (aspectos fenológicos, morfogênese e\
    \ suas implicações para a produção de forragem) \x96 conhecimento de como a planta\
    \ cresce e vegeta e suas implicações sobre a produção de forragem em quantidade\
    \ e qualidade e sua colheita pelos animais; o conceito de metas ou alvos de manejo\n\
    \x95 Uso estratégico de práticas de conservação e suplementação como forma de\
    \ viabilizar a realização das metas ou alvos de manejo \x96 integração das disciplinas\
    \ de forma lógica indicando como elas se integram e se complementam, favorecendo\
    \ a visualização do conjunto e de oportunidades de intervenção no processo (manejo)\n\
    \x95 Orçamentação forrageira como ferramenta de auxílio no processo de planejamento\
    \ e tomada de decisões \x96 exemplo prático de como planejar manejo e produção\
    \ animal em pasto\n\x95 Tipos de cercas e dimensionamento de rebanho, taxa de\
    \ lotação, pastos e áreas de culturas forrageiras suplementares \x96 conhecimento\
    \ de como levantar dados e informações necessárias para os cálculos e dimensionamentos\
    \ necessários. Exemplos."
  course_name: 'LZT0551 - Forragicultura

