  course: 'Consideração sobre a embriologia do aparelho genital. Anatomia do aparelho
    genital feminino: ovários, trompas uterinas, útero, corpo e cornos, colo ou cérvix,
    vagina e uretra, vulva e clitóris.  Fisiologia do aparelho  genital feminino.  Função
    ovulogênica  e endócrina  da gônada feminina.  Maturidade sexual e puberdade.  Ciclo
    estral.  Maturação folicular.  Ovulação.  Luteinização.  Involução do corpo lúteo.  Fases,
    freqüência  e duração  do ciclo estral.  Regulação  neuro-hormonal  do ciclo estral.  Anatomia
    do aparelho genital masculino: escroto, testículos, epidídimo, cordão espermático,
    glândulas sexuais acessórias (vesícula seminal, próstata, glândulas bulbouretrais),
    pênis, uretra, prepúcio. Fisiologia do aparelho genital masculino. Função espermática.
    Estabelecimento da espermatogênese nos animais jovens. Espermatogênese: duração
    e controle. Estrutura e morfologia do espermatozóide. Constituição do sêmen. Inseminação
    artificial. Detecção de cio. Sincronização do cio em bovinos. Estação de monta
    em gado de corte. Fertilização e implantação. Placentação e retenção de placenta.
    Índices reprodutivos. Transferência de embriões.'
  course_name: 'LZT0648 - Manejo da Reprodução e da Inseminação Artificial

    Reproduction Management and Artificial Insemination'
