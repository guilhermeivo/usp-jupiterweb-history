  course: 'A genética dos caracteres qualitativos nos animais domésticos. Os marcadores
    genéticos e suas aplicações. A genética dos caracteres quantitativos. Herança
    poligênica. Variação fenotípica e variação genética. Herdabilidade e repetibilidade.
    Conceitos fundamentais e métodos de estimação.

    Associação entre caracteres, correlação fenotípica, genética e ambiental. Estimativas
    da correlação genética e sua importância para o melhoramento. Interação genótipo-ambiente
    no contexto do melhoramento animal. A natureza da interação. Estimativa e conseqüências
    da interação.Princípios gerais da seleção dos reprodutores. Fatores que afetam
    a resposta à seleção: diferencial de seleção; intervalo entre gerações; herdabilidade.
    Ganho genético em diferentes tipos de seleção. As bases para seleção dos reprodutores:
    Seleção massal; seleção pelo pedigree, teste de progênie e seleção de família.
    Métodos de Seleção para mais de um caráter: conjugado, níveis independentes de
    descarte e índices de seleção. Sistema de acasalamento. Classificação dos acasalamentos:
    endogamia, exogamia, dissociação. Conseqüências genéticas e fenotípicas de cada
    sistema. A heterose e a complementaridade nos cruzamentos. Os esquemas de cruzamento
    na produção animal. Melhoramento genético de bovinos de corte.  As principais
    características, a sua herança e os métodos apropriados para seleção. O sistema
    de cruzamento na pecuária de corte no Brasil. Melhoramento genético dos bovinos
    leiteiros - os principais caracteres envolvidos e sua herança. Métodos de seleção
    dos touros e vacas. Os cruzamentos e a produção de leite em condições tropicais.
    Melhoramento genético dos suínos - os caracteres relativos à produção e ao crescimento
    e produto das progênies. Seleção dos reprodutores suínos: machos e fêmeas. As
    estações de avaliação e os testes. Melhoramento genético de ovinos e caprinos.
    Os principais caracteres. Sistemas de seleção e de acasalamento. Novas tecnologias
    da reprodução animal: inseminação artificial, transplante de embriões, sexagem
    de sêmen, animais transgênicos e clonagem e suas conseqüências para o melhoramento
    animal. A biologia molecular aplicada à seleção e melhoramento animal.'
  course_name: 'LZT0614 - Melhoramento Genético Animal

    Animal Breeding'
  deactivation: ''
  instructors: 3628090 - Gerson Barreto Mourão
  lecture_credits: '4'
  objectives: Transmitir aos alunos conhecimentos teóricos e práticos relativos ao
    melhoramento genético das principais espécies exploradas para fins de produção
    animal, com ênfase nos bovinos de corte e de leite, suínos, aves, ovinos e caprinos.
    Discutir os instrumentos necessários para entender o planejamento de programas
    de melhoramento genético, aplicáveis às diversas espécies exploradas pelo homem.
  practical_credits: '0'
  total_workload: 60 h
