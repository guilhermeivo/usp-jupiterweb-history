  course: 'O programa de Hidráulica abrange os módulos apresentados a seguir, desenvolvidos
    em aulas teórico-práticas. As práticas consistem de cálculos e dimensionamentos,
    além de demonstrações e utilização de instrumental no Laboratório de Hidráulica:
    Estática dos fluídos, estudo das pressões nos fluídos, estudo das forças atuantes
    sobre superfícies e corpos imersos. Dinâmica dos fluídos, equação da Continuidade,
    equação de Bernoulli, aplicações no escoamento dos fluídos. Condutos forçados
    (Canalizações), propriedades, perdas de carga e adutoras por gravidade. Sistemas
    de distribuição, dimensionamentos. Bombas hidráulicas, tipos,  classificação,
    princípios de funcionamento, curvas características de operação, escolha de bombas,
    limites de sucção.  Sistemas de recalque, acessórios, golpe de Aríete. Instalação
    e operação dos sistemas, dimensionamentos. Condutos Livres (Canais), propriedades,
    sistemas e dimensionamentos. Hidrometria, estudo e aplicação dos principais métodos
    e instrumentos para a medida de velocidade e da vazão em canais e em canalizações.
    Novas tecnologias aplicadas à Hidráulica.'
  course_name: 'LEB0472 - Hidráulica

    Hydraulics'
