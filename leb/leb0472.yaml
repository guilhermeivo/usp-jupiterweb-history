  objectives: A Mecânica dos Fluídos é a Ciência que trata dos princípios e das leis
    que regem o comportamento dos fluídos, tanto em repouso, por intermédio das leis
    da Hidrostática, quanto em movimento, mediante as leis da Hidrodinâmica. O seu
    conhecimento é, portanto, essencial para que se possa condicionar esse comportamento
    por meio de normas técnicas de Engenharia. A Hidráulica é o ramo da Engenharia
    que se preocupa basicamente em captar, controlar, conduzir, elevar e armazenar
    a água, exercendo assim controle ou utilização da mesma, aplicando as leis da
    Mecânica dos Fluídos. Esse manejo da água será bem sucedido desde que o engenheiro
    possa planejar, projetar, dimensionar, construir e operar estruturas hidráulicas
    apropriadas. Assim, o lecionamento dessa disciplina tem o propósito de dar ao
    aluno os conhecimentos básicos da Hidráulica e das técnicas essenciais da Engenharia,
    a fim de que, como profissional, possa realizar os itens necessários ao manejo
    e aos projetos hidráulicos relacionados aos recursos hídricos, para todos os fins
    dentro do campo da Engenharia Agronômica e Florestal.
  practical_credits: '0'
  total_workload: 60 h
