  course: 'Conceitos e histórico do sensoriamento remoto: Importância e aplicações
    nas áreas agrícola, ambiental e florestal. Princípios físicos de sensoriamento
    remoto e Radiometria: aquisição de dados e interação de energia alvo, maturação
    da radiação eletromagnética, espectroeletromagnético. Grandezas radiométricas,
    interação energia-matéria, fontes de radiação eletromagnética. Níveis de aquisição
    de dados: Níveis de aquisição de dados remotos, efeitos atmosféricos na propagação
    da radiação eletromagnética, correção geométrica e atmosférica. Comportamento
    espectral dos alvos: Solo, água e vegetação. Levantamento aéreo RPA: Princípios,
    normativas e aplicações. Sistemas sensores: Princípios de funcionamento. Sistemas
    orbitais: características e aplicações. Índices de vegetação: cálculo de índices
    de vegetação e índices de solo. Análise espacial de imagens orbitais: Processamento
    digital de imagens, análises estatísticas e classificadores. Aplicações do sensoriamento
    orbital em mapeamento de uso e cobertura da terra: identificações de padrões nas
    imagens, classificação de uso e cobertura da terra.'
  course_name: 'LEB0487 - Sensoriamento Remoto

    Remote Sensing'
  deactivation: ''
  instructors: '11967931 - Ana Claudia dos Santos Luciano

    2151441 - Peterson Ricardo Fiorio'
  lecture_credits: '4'
  objectives: Capacitar os alunos para compreender os princípios físicos de sensoriamento
    remoto e suas aplicações para o monitoramento agrícola, ambiental e florestal.
    Aprimorar o conhecimento dos alunos em relação as tecnologias disponíveis de sensoriamento
    remoto para que profissionalmente possam contribuir com soluções adequadas no
    levantamento e gerenciamento de recursos naturais terrestres, em escalas regionais
    e locais.
  practical_credits: '0'
  total_workload: 60 h
