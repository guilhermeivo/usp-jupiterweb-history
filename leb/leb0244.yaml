  course: "1) Apresentação do Balanço Energético Nacional; 2) Conceitos sobre energia;\
    \ 3) Conceitos e aplicações na diagramação de sistemas de produção; 4) Determinação\
    \ dos fluxos de materiais em sistemas de produção; 5) Análises ambientais baseadas\
    \ em fluxos de energia; 6) Emergia; 7) Noções de Análise de Ciclo de Vida; 8)\
    \ fontes de energia (solar, hidráulica, eólica, petróleo, etanol, biomassa florestal;\
    \ nuclear, cogeração, biodigestão) e seus impactos ambientais; 8) abordagens integradas\
    \ de fontes de energia.\n1) Concepts on energy, work, heat and available energy;\
    \ 2) Concepts on electromagnetism and electricity generation; 3) energy sources\
    \ and their impacts in the environment; 4) Wind energy \x96 principles, wind engines,\
    \ energy potential; 5) hydraulic energy \x96 principles, turbines, energy potential;\
    \ 6) solar energy \x96 principles, heat and photovoltaic; 7) oil and its derivates;\
    \ 8) sugarcane as an energy crop \x96 ethanol and biomass; 9) Wood and its derivates\
    \ \x96 firewood, charcoal and other options; 10) biogas \x96 raw material, conversion\
    \ process and applications; 11) national energy balance; 12) environmental evaluations\
    \ based on energy flows"
  course_name: 'LEB0244 - Recursos Energéticos e Ambiente

    Energy Resources and Environment'
  deactivation: ''
  instructors: 2230585 - Thiago Liborio Romanelli
  lecture_credits: '2'
  objectives: 'Fornecer aos alunos embasamento técnico-científico para poderem enfrentar
    a nova demanda exigida pela sociedade no que diz respeito ao conhecimento das
    aplicações dos diversos tipos de energias em utilização, com respeito ao ambiente
    e em face da escassez de energias não renováveis.

    To provide to the students technical and scientific knowledge for them to face
    the new demand from society regarding alternative energy sources, their implication
    in the environment and the scarcity of non renewable sources.'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
