  course: Desenvolver habilidades no uso de softwares para dimensionamento hidráulico
    de sistemas de irrigação pressurizados, sendo também um espaço de reflexão sobre
    atividades ligadas a inovação empreendedorismo em Engenharia da Irrigação. Aprimoramento
    da capacidade empreendedora dos alunos, estimulando e dando ferramentas àqueles
    cuja vocação profissional estiver direcionada à criação de um empreendimento em
    agricultura irrigada.
  course_name: 'LEB2671 - Engenharia de Irrigação: Projetos e Empreendedorismo

    Irrigation Engineering: Projects and Entrepreneurship'
  deactivation: ''
  instructors: 57293 - Rubens Duarte Coelho
  lecture_credits: '4'
  objectives: 'A presente disciplina tem por objetivo, preparar os alunos de graduação
    em Engenharia Agronômica e Florestal da ESALQ, para atuarem como projetistas sênior
    de sistemas de irrigação, com base no aprendizado de 3 softwares de dimensionamento
    hidráulico que são os mais utilizados a nível profissional pelas empresas que
    atuam na área de irrigação: EPANET, IRRIPRO e IRRICAD. Esta disciplina abrirá
    novas oportunidades profissionais aos alunos de graduação que tenham interesse
    em atuar nesta área do agronegócio, pois proporcionará o aprendizado de ferramentas
    computacionais que os tornarão mais eficientes e com perspectiva de maior empregabilidade
    no mercado de trabalho. Concomitantemente, serão apresentados conceitos e ideias
    em empreendedorismo aplicadas à agricultura irrigada no Brasil, de maneira tal,
    que os horizontes profissionais desses alunos se expandam às novas dinâmicas de
    trabalho da sociedade

    contemporânea.'
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
