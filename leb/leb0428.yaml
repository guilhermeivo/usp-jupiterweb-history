  course: '1) Produto fitossanitário: definição, nomenclatura, classificação, transporte,
    armazenamento, prescrição, descarte de embalagens e formulações. 2) Princípios
    básicos  da tecnologia de aplicação: volume de aplicação, dosagem, vazão, espectro
    de gotas, cobertura e penetração. 3) Classificação dos métodos de aplicação e
    equipamentos utilizados. 4) Métodos de aplicação via sólida: máquinas utilizadas,
    constituição, funcionamento e procedimentos de calibração. 5) Métodos de aplicação
    via líquida:a) espectro , movimento e distribuição das gotas; b) gotas controladas,
    c) gotas eletrizadas. 6) Máquinas para aplicação via líquida: constituição, funcionamento
    e procedimentos de calibração. 7) Bicos de pulverização: tipos, constituição,
    vazão, faixa de deposição e desgaste. 8) Sistemas eletrônicos na tecnologia de
    aplicação: tipos, constituição, variáveis controladas. 9) Sensores de vazão e
    sensores de pressão. 10) Aplicação a taxas variáveis. 11) Aplicação de produtos
    fitossanitários por aeronaves: princípios básicos, constituição, funcionamento
    e procedimentos de calibração.12) Análise econômica e operacional dos sistemas
    de aplicação. 13) Segurança na operação de aplicação: riscos ao operador a ao
    meio ambiente.'
  course_name: 'LEB0428 - Fundamentos da Aplicação de Produtos Fitossanitários

    Principles of Pesticide Application Technology'
  deactivation: ''
  instructors: 86410 - Casimiro Dias Gadanha Junior
  lecture_credits: '2'
  objectives: A disciplina visa apresentar as variáveis envolvidas na   tecnologia
    de aplicação de produtos fitossanitários  nas áreas agrícolas e florestais, com
    ênfase nos parâmetros de avaliação do desempenho das máquinas utilizadas, análise
    econômicas dos sistemas e avanços tecnológicos nessa área de conhecimento .
  practical_credits: '2'
  total_workload: 90 h
  type: Semestral
