  course: '1) A energia e a espécie humana. Produção Natural x Sistemas Produtivos.
    Demanda de alimentos, fibra e energia. Intensificação de sistemas de produção
    agrícola. 2) Conceitos e reflexões: leis da termodinâmica, sustentabilidade, origem
    de energia, ambiente, escala de análise. 3) Análises ambientais baseadas em fluxos
    de energia; 4) Emergia; 5) Noções de Análise de Ciclo de Vida; 6) fontes de energia
    (solar, hidráulica, eólica, petróleo, etanol, biomassa florestal; nuclear, cogeração,
    biodigestão) e seus impactos ambientais.'
  course_name: 'LEB0490 - Sustentabilidade Energética de Sistemas Agrícolas

    Energy Sustainability in Agricultural Systems'
  deactivation: ''
  instructors: 2230585 - Thiago Liborio Romanelli
  lecture_credits: '2'
  objectives: Apresentar aos alunos conceitos e reflexões contemplando os sistemas
    produtivos como unidades termodinâmicas e permití-los obter um senso crítico mínimo
    referente às fontes de energia disponíveis e sua interação no agronegócio.
  practical_credits: '1'
