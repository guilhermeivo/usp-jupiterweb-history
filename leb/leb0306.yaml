  course: 'a) A importância da Meteorologia Agrícola na agricultura moderna; b) Fatores
    geográficos determinantes do tempo e do clima: (latitude, altitude, relevo, oceanidade/continentalidade,
    correntes marítimas); circulação atmosférica: vento; massas de ar; fatores topo
    e microclimáticos; c) Observações meteorológicas: radiação solar, temperatura
    do ar e do solo; umidade do ar; precipitação; ventos. d) Balanço de energia radiante
    e sistemas agrícolas; aspectos quali-quantitativos da interação da radiação solar
    com os vegetais; aspectos ecológicos do fotoperiodismo; disponibilidade energética,
    temperatura e crescimento vegetal; estimativa de produtividade potencial de culturas;
    temperatura e desenvolvimento de plantas e insetos; graus-dia; exigências em frio
    de frutíferas de clima temperado; temperatura como fenômeno adverso na agricultura;
    geadas; temperatura, condições de estabilidade atmosférica e sua utilização na
    aplicação de defensivos agrícolas e dispersão de poluentes; e) Água na biosfera
    e agricultura: umidade atmosférica e doenças de plantas; umidade do ar e armazenamento
    de produtos e materiais agrícolas; precipitação e irrigação; f) Evapotranspiração:
    conceitos, métodos de medida e de estimativa; g) Balanço hídrico climatológico
    segundo Thornthwaite e Mather; balanços hídricos normais e seriados; estimativa
    da freqüência e da lâmina de irrigação com base em clima e solo; deficiência hídrica
    e produtividade das culturas; i) Importância agro-ecológica dos ventos; j) Aptidão
    climática das regiões para os cultivos; zoneamento agroclimático; k) Sistemas
    de informações agrometeorológicas.'
  course_name: 'LEB0306 - Meteorologia Agrícola

    Agricultural Meteorology'
  deactivation: ''
  instructors: '925245 - Fábio Ricardo Marin

    3609007 - Felipe Gustavo Pilau'
  lecture_credits: '4'
  objectives: A produtividade vegetal ou animal, é condicionada pelo ambiente. Nesta
    disciplina procura-se descrever as interações entre as condições atmosféricas
    e os sistemas agropecuários, de maneira que os alunos fiquem capacitados a entendê-los
    e a interferir favoravelmente no sistema agrícola, minimizando os aspectos negativos
    da agricultura exploratória. a)  Estudar os fatores que condicionam o tempo e
    o clima; b) Ensinar como são  observados  e medidos os elementos meteorológicos
    para fins  agroclimáticos; c) Discutir como as informações meteorológicas e climatológicas
    podem ser usadas para planejamento global de uso da terra e das operações agrícolas,
    bem como para minimização dos efeitos adversos do tempo e do clima na agricultura;
    d) Discutir como as condições de tempo e de clima relacionam-se com a produtividade
    agropecuária.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
