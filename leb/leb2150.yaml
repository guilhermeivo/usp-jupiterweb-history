  course: '1. Introdução: história da agricultura digital e suas principais tecnologias,
    definições e conceitos

    principais, importância, complexidade de sistemas agrícolas, tendências futuras,
    o sistema de

    produção do ponto de vista gerencial, sistemas de informação gerencial, agricultura
    de precisão como

    sistema de gestão

    2. Sensoriamento e monitoramento inteligentes: diferentes tipos de sensores e
    sensoriamento, IoT,

    coleta de dados, diferentes tipos de dados, bancos de dados abertos relevantes

    3. Análise e planejamento inteligentes: conceitos de ciência de dados e inteligência
    artificial, ciclo de

    vida dos dados e suas principais etapas, sistemas de suporte à decisão e experimentação
    ‘on farm’

    4. Controle inteligente: robótica, tipos de robôs e suas principais características,
    inteligência artificial

    aplicada à robótica, automação, autonomia

    5. Infraestrutura: processamento local, processamento em nuvem, armazenamento
    de dados

    6. Estudos de caso aplicados a diferentes culturas (anuais e perenes), tipos de
    dados (tabulares e

    imagens), e componentes da agricultura digital (sensoriamento e monitoramento,
    análise e

    planejamento, controle inteligentes)'
  course_name: 'LEB2150 - Agricultura Digital: Princípios e aplicações

    Digital Agriculture: Principles and applications'
  deactivation: ''
  instructors: '5152378 - Andre Freitas Colaco

    5411112 - Roberto Fray da Silva'
  lecture_credits: '2'
  objectives: 'Capacitar os alunos para compreender e analisar criticamente as principais
    tecnologias, métodos e técnicas

    relacionados à agricultura digital, divididos em quatro áreas: sensoriamento e
    monitoramento; análise e

    planejamento; controle; e infraestrutura. Promover o senso crítico e preparar
    os alunos para que possam

    contribuir com os profissionais de outras áreas do conhecimento no desenvolvimento
    de soluções adequadas

    aos sistemas agrícolas.'
  practical_credits: '1'
  total_workload: 60 h
  type: Semestral
