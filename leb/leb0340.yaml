    Nota de recuperação = (2 Teórica + Prática) / 3'
  bibliography: 'Literatura Básica:

    SAMPAIO, T.V. M.; BRANDALIZE, M. C. B.. Cartografia geral, digital e temática.
    Curitiba: Universidade Federal do Paraná, Programa de Pós-Graduação em Ciências
    Geodésicas, 2018. 210 p.: il. - (Série Geotecnologias: teoria e prática; v. 1)

    BORGES, A.C.  Topografia.  São Paulo, Edgard Bluscher, 1977.  187p. Vol. 1.

    GODOY, R.  Topografia Básica.  Piracicaba, FEALQ, 1988. 349p.

    ASSAD, E.D.; E.E. SANO   Sistemas de Informações Geográficas: Aplicações na Agricultura.  2ª
    ed.   EMBRAPA-CPAC, Brasília - DF, 434p., 1998.

    MOFITT, F.H. MIKHAIL, E.M.  Photogrammetry. 8a. ed.  New York, Harpen  and Row,
    Publishers. 1987.  876p.

    SEGANTINE, P.C.L.  GPS: Sistema de Posicionamento Global. EESC/USP. São Carlos,
    SP. 364p. 2005.

    AVERY, T.E.; BERLIN, G.L. Interpretation of aerial photographs.  Minneapolis,
    Burgess Publishing Company, 4ª ed, 1985.

    Literatura Complementar:

    MONICO, J.F.G.  Posicionamento pelo GNSS: descrição, fundamentos e aplicações.
    São Paulo, Editora UNESP.  2ª edição. 2007.

    ATCHESON, D.  Estimating Earthwork Quantities.  3a. ed. Lubbock, Norseman Publishing
    Company, 1986.

    DAVIS, R.E.;  FOOTE, F.S.;  ANDERSON, J.M. & MIKHAIL, E.M. Surveying: Theory and
    Practice. 6a. ed.  New York.  Mac Graw-Hill Publisching Company, 1981.  992p.'
  course: 'Cartografia: Leitura, análise e interpretação de documentos cartográficos.
    Concepção de mapa, carta e planta. Escalas, sistemas de coordenadas, projeções
    cartográficas, cartografia temática e digital. Topografia: definição, objetivos
    e divisão. Conceitos de planimetria e altimetria. Métodos de levantamento topográficos:
    intersecção, irradiação e caminhamento. Sistema Global de Navegação por Satélite
    (GNSS): Conceitos e definição. Características do GPS, medições de distância,
    aplicações. Georreferenciamento de imóveis rurais: Normativas e aplicações. Princípios
    de fotogrametria: plano de vôo aerofotogramétrico; geometria da fotografia aérea
    vertical; estereoscopia; e princípios de restituição aerofotogramétrica. Veículos
    aéreos não tripulados: Princípios e aplicações. Modelos Numéricos do Terreno (MNT):
    Conceitos, amostragem, estrutura de dados, aplicações. Introdução ao Sistema de
    Informação Geográfica (SIG): Uso de técnicas de geoprocessamento para análise
    da superfície do terreno. LIDAR ( Light Detection And Ranging): Modelagem de superfície
    do terreno. Análise de modelos digitais do terreno: declividade, drenagem e manejo
    de bacias hidrográficas.'
  course_name: 'LEB0340 - Geotecnologias Aplicadas ao Levantamento de Projetos Agrícolas

    Land Surveying and Geoprocessing I'
  deactivation: ''
  instructors: '11967931 - Ana Claudia dos Santos Luciano

    2151441 - Peterson Ricardo Fiorio'
  lecture_credits: '4'
  objectives: Conceitualizar e capacitar os alunos para aplicação do uso de geotecnologias
    no levantamento da superfície do terreno, a partir de tecnologias de levantamentos
    planialtimétricos, sistemas globais de navegação, fotogrametria e modelagem numérica
    do terreno utilizando ferramentas de processamento de dados geográficos para aplicações
    em desenvolvimento de projetos agrícolas.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
