  course: 'Planimetria: Geotecnologia aplicada às ciências agrárias. Topografia: definição,
    objetivos e divisão. Conceitos Fundamentais: ponto e plano topográfico, topografia,
    geodésia e cartografia. Teodolitos: tipos, constituição e manejo de aparelhos.
    Goniometria: bússolas, tipo e emprego; inclinação e declinação  magnética; azimutes
    e rumos verdadeiros e magnéticos; aviventação de rumos; outros ângulos horizontais.
    Medição direta de distância: erros, precisão, transposição de obstáculos. Taqueometria:
    determinação de distância horizontal e distância vertical. Medição eletrônica
    de distâncias. Métodos de levantamento topográfico: intersecção, irradiação e
    caminhamento. Determinação de áreas: métodos gráficos, analíticos. Locação de
    obras rurais. Normas técnicas referentes à topografia. Altimetria: Conceitos fundamentais:
    superfície de nível; nível verdadeiro e aparente; erro devido à curvatura da Terra
    e refração atmosférica; altitude e cota; declividade. Constituição, retificação
    e manejo dos níveis de precisão. Métodos de nivelamento: barométrico, taqueométrico;
    trigonométrico e geométrico (simples e composto). Curvas de nível e em desnível.
    Perfis longitudinais e transversais: rampas; corte e aterro. Levantamento planialtimétrico.
    Uso de "Softwares" topográficos. Desenho Topográfico: generalidades, classificação,
    instrumentação e material de traçado. Convenções e normatização para desenho topográfico.
    Processos de representação: projeções cotadas; estudo do ponto, da reta e do plano.
    Desenho de perfis e plantas planialtimétricas. Sistematização de terras: Elementos
    de terraplanagem, sistematização de terras e barramentos.'
  course_name: 'LEB0340 - Topografia

    Land Surveying and Geoprocessing I'
  deactivation: ''
  instructors: 2151441 - Peterson Ricardo Fiorio
  lecture_credits: '6'
  objectives: Informar sobre o conjunto de normas, regras e princípios aplicados aos
    métodos topográficos gerais, para representar gráfica ou analiticamente, os pontos
    de uma porção limitada da superfície terrestre, calculados com exatidão, em relação
    a um plano de referência, com todos os detalhes, acidentes, área, posição altimétrica
    e orientação segundo as coordenadas geográficas e ou planas, permitindo a execução
    de estudos e projetos a serem implantados.
