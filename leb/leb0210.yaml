  objectives: Desenvolver princípios e fundamentos necessários ao embasamento teórico
    dos acadêmicos de Gestão Ambiental e Ciências Biológicas na utilização de técnicas
    de Geoprocessamento no processo de tomada de decisão nas suas áreas de atuação.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
