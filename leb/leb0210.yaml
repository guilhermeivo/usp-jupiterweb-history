  course: "Geprocessamento aplicado às ciências do ambiente. Topografia:  - Definição,\
    \ objetivos e divisão; Planimetria: conceitos fundamentais, medição de ângulos\
    \ e distâncias e cálculo de coordenadas;  Altimetria: conceitos  fundamentais\
    \ e curvas de nível.  Fundamentos de Cartografia: Projeções cartográficas; Sistemas\
    \ de coordenadas. GPS: princípios de funcionamento e aplicações.  Fotogrametria:-\
    \ Conceitos fundamentais; - Geometria da fotografia área vertical; Estereoscópios\
    \ e estereoscopia. Introdução ao Sensoriamento Remoto: - Fundamentos físicos do\
    \ sensoriamento remoto; - Sistemas de sensoriamento remoto orbital; \t- Comparação\
    \ entre fotografias áreas, imagens orbitais e mapas; - Interpretação de imagens.\
    \ Sistemas de Informação Geográfica (SIG): - Conceito, histórico e perspectivas;\
    \ - Componentes (estrutura) de um SIG; - Aplicações."
  course_name: 'LEB0210 - Geoprocessamento

    Geoprocessing'
  deactivation: ''
