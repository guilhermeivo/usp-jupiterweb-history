    NOVO, E.M.L.M. Sensoriamento Remoto: Princípios e Aplicações. 3ª ed.  São Paulo,
    Edgard Blucher. 2008.

    PONZONI, F.J.; SHIMABUKURO, Y.E.; KUPLICH, T.M. Sensoriamento Remoto da Vegetação.
    Segunda Edição Atualizada e Ampliada. Oficina de Textos, São Paulo, SP 2012.

    SEGANTINE, P.C.L.  GPS: Sistema de Posicionamento Global. EESC/USP. São Carlos,
    SP. 364p. 2005.

    Literatura Complementar:

    LIBAULT, A.  Geocartografia.  São Paulo, Ed. Da USP, 1975.

    MONICO, J.F.G. Posicionamento pelo GNSS: descrição, fundamentos e aplicações.
