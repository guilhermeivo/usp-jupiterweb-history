  course: 'Técnicas de desenho: Materiais e instrumentos de desenho. Cotação de desenhos.
    Tipos e espessura de linhas. Formato, tamanho e dobramento das folhas de desenho.
    Desenho arquitetônico: Planta baixa, posição do telhado, planta de situação, cortes
    longitudinal e transversal e fachada. Materiais de construção: Aglomerantes: cales,
    classificação, fabricação, extinção e conservação da cal. Cimento: considerações
    gerais, "pega" e endurecimento do cimento, componentes e hidratação.  Agregados:
    considerações gerais, aplicações e classificação.  Agregados miúdos:  classificação.
    Agregados graúdos: considerações gerais, classificação.  Água de amassamento:
    definição, qualidade da água e impurezas. Argamassas: generalidades, tipos, preparo
    das argamassas e traços.  Concretos: generalidades, tipos, traços usuais de concretos,
    fator água/cimento. Manuseio do concreto: amassamento, transporte, adensamento
    e cura.  Madeiras: considerações gerais, madeiras de construção, nomenclatura,
    bitolas e empregos.  Produtos cerâmicos: considerações gerais, principais produtos
    (tijolos, telhas, manilhas, azulejos e ladrilhos).   Fundações: Considerações,
    pesquisa do sub-solo, determinação da resistência do solo pelos métodos da percussão
    e mesa de Barberot, cálculos. Classificação das fundações: direta contínua e descontínua.
    Estrutura dos telhados: considerações gerais, composição, material de cobertura,
    madeiramento. Prática de Projeto: elaboração e execução de um projeto arquitetônico
    realizado em classe. Habitação rural: considerações gerais, funcionalidade, ambiência
    em casas rurais, orientação, detalhes construtivos, dimensionamento e projeto.  Realização
    de projeto extraclasse utilizando ferramentas computacionais (softwares livres
    para projetos arquitetônicos).'
  course_name: 'LEB0418 - Construções Rurais e Desenho Técnico

    Rural Construction and Technical Drawing'
  deactivation: ''
  instructors: '2699852 - Iran Jose Oliveira da Silva

    2988034 - Késia Oliveira da Silva Miranda'
  lecture_credits: '4'
  objectives: A disciplina de Construções Rurais tem por objetivo transmitir aos alunos
    os conhecimentos gerais das técnicas indispensáveis à elaboração de projetos agropecuários.
    A disciplina considera a especificidade da formação do Engenheiro Agrônomo e Florestal
    no contexto das construções rurais, onde são abordadas de maneira eminentemente
    prática, desde as técnicas de desenho, as regras básicas para a execução de projetos
    arquitetônicos, materiais de construções, princípios básicos das fundações, fundamentos
    do projeto. São inclusas  visitas periódicas às obras civis, de maneira a favorecer
    a construção do conhecimento por meio da interação alunos e operários de uma obra,
    em diversas etapas da construção, para a visualização e complementação do estudo.
    São ministrados os conhecimentos básicos para o planejamento e elaboração de Projetos
    e Construções Rurais, que são desenvolvidos em classe e extraclasse, como parte
    do aprendizado.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
