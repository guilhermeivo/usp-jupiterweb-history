    Agropecuária, 477 p. 2002.

    Pereira, A.R.; Villa Nova, N.A.; Sedyama, G.C. Evapo(transpi)ração. FEALQ, 183p.,
    1997.

    Tubelis, A. & Nascimento, F. J. L. Meteorologia Descritiva. Editora Nobel S.A.,
