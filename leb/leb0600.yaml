  course: "Atmosfera e escalas climáticas: A biosfera e sua composição; atmosfera\
    \ terrestre; as escalas do clima.\nInterceptação da radiação solar pela Terra:\
    \ o sol como fonte primária de energia. Relações Terra-Sol:\ncoordenadas solares\
    \ em relação à Terra; constante solar e irradiância no limite superior da atmosfera;\n\
    interação da radiação solar com a atmosfera; radiação solar ao nível do solo:\
    \ radiação solar na superfície\nterrestre; balanço de radiação. Interação copa-radiação\
    \ solar: absorção, reflexão e transmissão de energia radiante; lei de Beer-Lambert;\
    \ ângulo médio de inserção; coeficiente de extinção; arquitetura de copa; índice\
    \ de área foliar. Balanço de carbono: fotossíntese bruta e líquida; respiração;\
    \ balanço de carbono no campo; eficiência de uso da radiação. Folhas e fluxos:\
    \ resistências e condutâncias; teoria do fluxo-gradiente; estômatos, cutícula\
    \ e espaços intercelulares de ar; Lei de Fick; teoria da similaridade; resistência\
    \ aerodinâmica. Calor sensível em comunidades vegetais: aspectos físicos da temperatura\
    \ do ar e do solo; variabilidade na microescala; estabilidade atmosférica; temperatura\
    \ potencial; Número de Richardson. Calor latente em comunidades vegetais: Calor\
    \ latente de vaporização; propriedades físicas da água e do vapor d’água; umidade\
    \ do ar; evaporação, transpiração e evapotranspiração; coeficiente de cultivo.\
    \ Transporte de momento em comunidades vegetais: Formação dos ventos predominantes\
    \ e locais; perfis de velocidade de vento; fluxo laminar e turbulento; Equação\
    \ de Prandtl; Número de Reynolds; viscosidade; comprimento da rugosidade e deslocamento\
    \ do plano zero; camada limite e bordadura; acoplamento copa\x02atmosfera. Eficiência\
    \ de uso da água: o papel do dióxido de carbono; antitranspirantes; plantas C3\
    \ e plantas C4; controle estomático."
  course_name: 'LEB0600 - Microclimatologia Agrícola e Florestal

    Forest And Agricultural Microclimatology'
  deactivation: ''
  instructors: 925245 - Fábio Ricardo Marin
  lecture_credits: '4'
  objectives: 'Capacitar o aluno e analisar e entender os processos físicos do ambiente
    de importância agroecológica, na

    escala microclimática. Ênfase é dada na interação entre a radiação solar com a
    vegetação e ao transporte de

    massa e energia em sistemas vegetados. Os princípios básicos da arquitetura dos
    dosséis vegetativos são

    estudados como base para a compreensão da absorção da energia radiante pela vegetação.
    Conceitos de

    mecânica dos fluídos, processos turbulentos, resistências e condutâncias, são
    aplicados aos fluxos

    atmosféricos buscando-se o entendimento dos processos de transporte e sua implicação
    no balanço de massa e energia em sistemas agrícolas e florestais.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
