  course: 'Principais teorias da administração: escola clássica; enfoques comportamental,
    sistêmico e da qualidade. O modelo Toyota. Planejamento estratégico aplicado a
    sistemas agroflorestais: conceito de missão, visão e valores; Análise SWOT; desdobramento
    de políticas; Ciclo PDCA. Gestão de processos agroflorestais: mapeamento e padronização
    de processos; análise de fluxo de valor; ferramentas da qualidade e sua aplicação
    nos processos agrícolas; controle de qualidade aplicado a operações agrícolas;
    FMEA, QFD. Sistemas de informações voltados à mecanização agroflorestal. Planejamento
    e controle, operacional e econômico, de sistemas mecanizados: modelos aplicados
    no planejamento; uso de planilhas para modelagem; estudo de tempos e movimentos;
    cálculo dos custos diretos e indiretos. Planejamento e controle da manutenção
    de sistemas mecanizados: organização da manutenção; planos de manutenção; planejamento
    e programação da manutenção; índices de manutenção; 5S''s (house keeping) aplicado
    à manutenção.'
  course_name: 'LEB0589 - Gerenciamento de Sistemas Mecanizados

    Management of Agricultural Machinery Systems'
