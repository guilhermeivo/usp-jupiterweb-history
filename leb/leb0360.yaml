  course: Importância e aplicações da Hidrologia no manejo ambiental. Ciclo hidrológico,
    seus componentes e bacias hidrográficas. Chuvas, tipos, características, probabilidades
    e recorrência. Escoamento superficial, características, condições de ocorrência,
    quantificação e seu relacionamento com os tipos de ocupação da bacia, dimensionamento
    de estruturas de controle simples. Caracterização dos recursos hídricos superficiais
    de uma bacia, vazões médias, máximas e mínimas. Previsão de eventos extremos.
    Demanda de água, recursos hídricos disponíveis, reservatórios de regularização.
    Água subterrânea, aquíferos e poços. Qualidade das águas superficiais e subterrâneas.
    Legislação para Gestão dos Recursos Hídricos.
  course_name: 'LEB0360 - Hidrologia

    Hidrology'
  deactivation: ''
  instructors: '711726 - Fernando Campos Mendonça

    52753 - Sergio Nascimento Duarte'
  lecture_credits: '2'
  objectives: Esta disciplina tem por objetivo mostrar aos alunos a importância e
    as aplicações da Hidrologia, necessárias à caracterização e ao manejo sustentado
    dos recursos hídricos naturais superficiais e subterrâneos; visa também à capacitação
    dos alunos para o diagnóstico de problemas ambientais relacionados aos fluxos
    de água no Ciclo Hidrológico.
  practical_credits: '1'
  total_workload: 60 h
  type: Semestral
