  objectives: Capacitar os alunos a entender o princípio de funcionamento dos mecanismos
    e máquinas motoras mais importantes utilizadas no processo de produção agropecuária.
    Contextualizar o uso de máquinas motoras quanto às novas tecnologias, ao seu preparo
    para o trabalho, manutenção e operação.
