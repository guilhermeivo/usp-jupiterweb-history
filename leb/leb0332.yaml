  course: 'Introdução ao estudo da mecânica e máquinas motoras: importância da mecanização
    nos sistemas de produção agropecuária atuais, aspectos econômicos e sociais, exemplos
    aplicados do uso de máquinas na produção de diversos produtos, discussão.

    Conceitos fundamentais de mecânica aplicada a máquinas agrícolas: sistemas de
    unidades, força, velocidade, trabalho, potência.

    Elementos de máquinas e mecanismos: eixos, engrenagens, polias, relação de engrenagens,
    roscas transportadoras, rotores.

    Tratores agrícolas: Introdução ao estudo de tratores. Histórico da indústria nacional;
    produção; modelos; classificação geral quanto à aplicação; chassi; rodados; constituição
    e aplicações básicas; sistema de direção e freios.

    Motores de combustão interna I. Órgãos fundamentais; princípio de funcionamento.

    Motores de combustão interna II. Combustão e Combustíveis: fenômeno da combustão,
    combustíveis derivados do petróleo; gasogênio; gás metano; álcool. Sistema de
    válvulas; sistema de alimentação de motores com carburador; sistema de ignição
    por centelha.

    Motores de combustão III. Sistema de alimentação de motores diesel; sistema de
    arrefecimento; sistema de lubrificação.

    Sistema de transmissão de tratores agrícolas I. Introdução a transmissão de potência
    de tratores agrícolas; embreagem.

    Sistema de transmissão de tratores agrícolas II. Caixa de mudanças de marchas;
    transmissão final; tomada de potência, condições de equilíbrio estático; transferência
    de peso.

    Sistemas hidráulicos. Constituição básica; estudo orgânico e funcionamento de
    sistemas hidráulicos de três pontos e de controle remoto.

    Desempenho de tratores: desempenho da tomada de potência; torque, potência; consumo
    específico. Desempenho na barra de tração; escalonamento de marchas; interpretação
    dos resultados de ensaios.

    Automação em tratores: sensores, sistemas de direcionamento, planejamento e controle
    remoto de operações

    Ergonomia e segurança:  estruturas e equipamentos de proteção; posicionamento
    de comandos; campo visual; regras de segurança básica.

    Manutenção de máquinas agrícolas: planejamento e controle da manutenção, manutenção
    corretiva, preventiva e preditiva; organização da manutenção; planos e índices
    de manutenção; lubrificantes.

    Preparo do trator: reconhecimento do equipamento; comandos e instrumentos; dispositivos
    de segurança.

    Manejo de tratores: manobras (3)'
