  course: 'Generalidades sobre a situação da Irrigação no Estado de São Paulo e no
    Brasil.  Conceitos de Física do Solo aplicados a Irrigação e Drenagem. Retenção
    e movimento da água no solo, em relação a sua disponibilidade às plantas.  Necessidade
    de água das plantas. Parâmetros para a irrigação. Controle da irrigação. Fatores
    que influem na escolha do método. Irrigação por aspersão: Generalidades. Características
    dos equipamentos para sistemas portáteis, permanentes e mecanizados de aspersão.
    Projeto de um sistema de irrigação por aspersão portátil. Operação do sistema
    mecanizado de aspersão. Irrigação localizada: Generalidades. Componentes do sistema
    e suas características de funcionamento. Princípios básicos do método. Benefícios
    e problemas. Tipos de gotejadores e microaspersores. Projeto de um sistema de
    irrigação localizada. Operação do sistema. Irrigação por sulcos: Generalidades.
    Características e tipos de sulcos. Avanço da água no sulco. Teste de infiltração
    no sulco. Projeto de um sistema de irrigação por sulcos. Operação do sistema.
    Irrigação por inundação. Generalidades. Características dos tabuleiros. Projeto
    de um sistema de irrigação por inundação. Operação do sistema. Generalidades da
    irrigação por faixas de inundação.'
