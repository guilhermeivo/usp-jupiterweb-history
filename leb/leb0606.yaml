  course: '1) Introdução:   - importância do manejo da água em sistemas agrícolas
    na bacia hidrográfica;  - considerações ambientais e econômicas; 2) Técnicas de
    controle da água aplicada via irrigação ou chuva:  2.1. Controle via dados de
    solo; - água armazenada no solo;   - água disponível (conceitos); - balanço hídrico;
    - potencial da água no solo.  2.2. Controle via dados da planta: - potencial da
    água na planta; - temperatura do dossel; - índices de estresse hídrico;  - parâmetros
    fisiológicos. 2.3. Controle via dados de clima - fórmulas para determinação da
    evapotranspiração;   - tanque classe A; - estações meteorológicas. 2.4. Métodos
    combinados: - solo e planta;  - solo e clima;    - solo, planta e clima. 3) Instrumentos
    para o controle da irrigação  - tensiômetros; - Time Domain Reflectance (T.D.R.);
    - sonda de nêutrons; - blocos de resistência elétrica; - tanque classe A;  - estações
    meteorológicas;  - radiômetros, psicrômetros, termômetro infra-vermelho; termopares,
    anemômetros,    pluviômetros.  4) Métodos de controle da água aplicada em função
    do método de irrigação - irrigação por aspersão, sulcos, localizada e inundação.
    5) Resposta das culturas à irrigação  - funções de produção: lâmina aplicada e
    produtividade para as  diferentes culturas;  - variedades desenvolvidas para irrigação.
    6) Irrigação em regiões áridas, úmidas e tropicais - caracterização da necessidade
    de água das diferentes culturas nas diferentes regiões; - método de controle associado
    ao clima e método de irrigação. 7) Energia utilizada na irrigação - economia de
    energia e método de controle da irrigação; - energia elétrica e díesel. 8) Quimigação
    - técnicas e fatores que influenciam: - fertirrigação; - insetigação; - herbigação;
    - fungigação. 9) Manejo da Água em Sistemas Agrícolas e  Ambiente - lixiviação
    de nutriente com excesso de aplicação de água e  contaminação do lençol freático;  -
    monitoramento da aplicação de agroquímicos com a água e seu monitoramento no ambiente;
    - esgotamento dos mananciais de água - dimensionamento de equipamentos e runoff.
    - manejo da irrigação e salinidade;  - manejo da irrigação e mudanças no microclima.
    10) Noções de Excel para desenvolvimento de planilha de gerenciamento. 11) Noções
    de AutoCAD para projetos.'
  course_name: 'LEB0606 - Manejo da Irrigação e da Água em Sistemas Agrícolas

    Water and Irrigation Management in Agricultural Systems'
  deactivation: 31/12/2023
  instructors: 1286078 - Patricia Angélica Alves Marques
  lecture_credits: '4'
  objectives: 'Os objetivos da disciplina Manejo da Irrigação e da Água em Sistemas
    Agrícolas são: 1) Discutir a importância do manejo da Água em Sistemas Agrícolas
    na bacia hidrográfica; 2) discutir os princípios dos principais métodos de controle
    da água sistemas agrícolas, que se baseiam no solo, na planta, no clima ou na
    combinação destes; 3) fazer com que os alunos se familiarizem com os equipamentos
    disponíveis e trabalhem com dados reais.'
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
