  course: "1. Introdução à agricultura de precisão: \t- conceituação, \t- áreas de\
    \ pesquisa e recentes desenvolvimentos ao nível mundial; - atividades econômicas\
    \ envolvidas e novas tendências. 2) Sistemas de posicionamento: - \x93Global Positioning\
    \ System\x94 (GPS); - composição do sistema; - fontes de erro; - receptores, -\
    \ métodos de correção \x96 DGPS, - outros sistemas de posicionamento. 3)  Sensoriamento:\
    \ - sensoriamento direto e remoto; - estado da arte em sensores diretos; - sensoriamento\
    \ remoto, - amostragens. 4. Monitoramento e mapeamento de produtividade de culturas:\
    \ - equipamentos sensores para fluxo e umidade de grãos, - outros sensores em\
    \ colhedoras, - calibração, - mapas de produtividade, - monitoramento de produtividade\
    \ de outras culturas. 5. Monitoramento da variabilidade espacial de características\
    \ do solo: - mapeamento da fertilidade do solo, - métodos de amostragem; - outros\
    \ parâmetros de interesse. 6. Sistemas de Informação Geográfica \x96 SIG: - definições;\
    \ - SIG para agricultura de precisão, - conceitos básicos de geoestatística, -\
    \ mapeamentos. 7. Aplicação localizada de insumos: - análise de dados e tomada\
    \ de decisões, - estratégias de ação, - modos de operação, - equipamentos. 8.\
    \ Sistemas de orientação: uso de GPS como guia para aeronaves agrícolas, aplicações\
    \ terrestres em faixas, piloto automático."
  course_name: 'LEB0447 - Agricultura de Precisão

    Precision Agriculture'
  deactivation: ''
  instructors: 59531 - Jose Paulo Molin
  lecture_credits: '2'
  objectives: Oferecer os conceitos basicos da agricultura de precisao vista como
    uma ferramenta para a otimizacao da producao agricola com base em levantamento
    de dados para diagnostico de variabilidade espacial e deficiencias localizadas
    e seu controle por metodos de correcao localizada bem como a utilizacao de recursos
    de navegacao para diversas aplicacoes agricolas.
  practical_credits: '2'
  total_workload: 90 h
  type: Semestral
