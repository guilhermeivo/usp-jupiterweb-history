  course: 'A digitalização da economia e dos processos de produção: conceituação acerca
    de digitalização, histórico de incorporação de eletrônica e a automação na indústria,
    estado da arte e perspectivas de avanço, paralelos entre indústria, serviços e
    sistemas agrícolas mecanizados.

    Planejamento e controle de sistemas agrícolas mecanizados: relação entre sistemas
    agrícolas e sistemas mecanizados, princípios básicos para planejamento e gestão
    de sistemas mecanizados; custos diretos e indiretos dos sistemas mecanizados.

    Fundamentos de instrumentação, mensuração e processamento de sinais: princípios
    físicos e tipos de sensores; sistemas analógicos e digitais, características de
    desempenho de sensores: precisão, exatidão, sensibilidade, limite de detecção,
    faixa dinâmica, seletividade, linearidade, resolução, tempo de resposta, histerese.'
  course_name: 'LEB0466 - Avaliação do Desempenho de Máquinas Agrícolas

    Performance Tests of Agricultural Machinery'
  deactivation: ''
  instructors: 2231586 - Leandro Maria Gimenez
  lecture_credits: '2'
  objectives: Desenvolver a capacidade de analisar criticamente o desempenho de máquinas
    agrícolas no contexto em que são utilizadas. Apresentar e discutir métodos padronizados
    e as inovações para avaliação e controle de máquinas agrícolas considerando os
    avanços na área da eletrônica embarcada, análise de dados e comunicação. Como
    resultado espera-se contribuir para que os alunos façam uso efetivo dos meios
    disponíveis para tomada de decisões quanto ao uso e incorporação de tecnologia
    em máquinas agrícolas.
  practical_credits: '2'
  total_workload: 90 h
  type: Semestral
