  course: 'Geotecnologias: Conceitos e aplicações do sensoriamento remoto a nível
    terrestre, aéreo e orbital. Conceitos de sensoriamento remoto: princípios físicos
    de sensoriamento remoto e níveis de aquisição de dados. Comportamento espectral
    dos alvos: água, solo e vegetação. Sistemas sensores: funcionamento dos sistemas
    sensores, tipos de sistemas, resoluções. Sensores proximais na agricultura: noções
    básicas de agricultura de precisão, sensores aplicados para solo e vegetação.
    Sistemas aéreos transportados: Princípios e aplicações. Sistemas orbitais: Classificação
    dos satélites, descrição dos principais sistemas orbitais para monitoramento dos
    recursos terrestres. Índices de vegetação: conceitos e aplicações.  Critérios
    de interpretação de imagens: identificação de padrões de imagens. Sistemas de
    Informação Geográfica (SIG): Conceitos e aplicações. Classificação de imagens:
    conceitos da classificação de imagens, tipo de classificadores, amostragem de
    dados e análises estatísticas da classificação.'
  course_name: 'LEB0450 - Geotecnologias Aplicadas às Ciências Agrárias

    Geotechnologies Applied to Agricultural Sciences'
  deactivation: ''
  instructors: '11967931 - Ana Claudia dos Santos Luciano

    2151441 - Peterson Ricardo Fiorio'
  lecture_credits: '4'
  objectives: 'Aprimorar os conhecimentos básicos adquiridos na disciplina LEB340
    - Geotecnologias aplicadas ao levantamento de projetos agrícolas, introduzir novos
    conceitos relativos ao uso de geotecnologias aplicadas ao monitoramento agrícola,
    florestal e ambiental, tais como: conceitualizar e capacitar os alunos para aplicação
    do uso de sensoriamento remoto a nível terrestre, aéreo e orbital como ferramentas
    de monitoramento de variabilidade de uso e cobertura da terra, para tomadas de
    decisão nas áreas de atuação do engenheiro agrônomo e do engenheiro florestal.
    Preparar o aluno para utilização de técnicas de análise espacial, através de sistemas
    de informação geográfica (SIG).'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
