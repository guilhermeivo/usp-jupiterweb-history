  course: '1) Introdução ao estudo de máquinas e implementos agrícolas: evolução histórica
    de ferramentas, implementos e máquinas, operações agrícolas, relação entre operações,
    classificação quanto à forma de acionamento e acoplamento de máquinas e implementos.

    2) Máquinas para o preparo do solo: relação entre preparo e sistemas de manejo
    do solo, propriedades do solo com influência sobre o desempenho, modos de mobilização
    do solo, noções sobre preparo inicial, preparo periódico, demandada de potência
    e eficiência em tração. Reconhecimento e ajuste das principais máquinas: arado,
    grade, escarificador, subsolador, enxada rotativa.

    3) Máquinas para aplicação de corretivos e fertilizantes:  características da
    operação de aplicação de fertilizantes e corretivos. Distribuidores de adubos
    orgânicos sólidos e fluidos: tipos, classificação, estudo orgânico, regulagens.

    4) Máquinas para semeadura: relação entre semeadura e sistemas de manejo do solo,
    adubação no sulco, semeadura em fluxo contínuo, semeadura de precisão, características
    construtivas: mecanismos para corte de resíduos vegetais, rompimento do solo,
    dosagem, manutenção da profundidade, fechamento e condicionamento do sulco, ajustes
    e cálculos.

    5) Máquinas para aplicação de defensivos: técnicas de aplicação de defensivos:
    conceituação sobre veículos, faixa de deposição, tamanho e espectro de gotas.
    pulverizadores: tipos, constituição, princípios de funcionamento, bicos pulverizadores.
    atomizadores e nebulizadores: tipos, constituição, princípios de funcionamento.
    aviação agrícola: princípios de utilização

    6) Máquinas no sistema de produção de cana-de-açúcar: Sistemas de colheita: manual,
    semi mecanizado e mecanizado. Subsistemas: corte, carregamento, transporte e recepção.
    Condições de campo para colheita mecanizada. Gerenciamento do sistema. Princípio
    de funcionamento de colhedoras.

    7) Máquinas para colheita de forragem: sistemas de colheita de forragem: conceituação
    sobre corte verde, fenação e ensilagem; características das operações envolvidas.
    secadoras, condicionadoras e ancinhos enleiradores: tipos, constituição, princípio
    de funcionamento. colhedoras de forragem: tipos, princípio de funcionamento, carreta
    forrageira.

    8) Máquinas para colheita de cereais: técnicas de colheita de cereais: considerações
    gerais sobre sistemas semi-mecanizados e motomecanizados. trilhadoras e batedoras:
    constituição e princípio de funcionamento. colhedoras combinadas: constituição,
    princípio de funcionamento, principais regulagens.

    9) Máquinas para processamento e beneficiamento: conceituação sobre processamento
    de cereais; importância; operações unitárias. secagem de cereais: tipos de secadores;
    princípio de funcionamento. limpeza e classificação: processos de separação de
    impurezas; tipos de equipamentos e princípio de funcionamento. transportadores
    de grãos: tipos, princípio de funcionamento, critérios de seleção e dimensionamento.
    estruturas de armazenamento: tipos, constituição, cuidados operacionais.

    10) Mecanização em agricultura de precisão: conceituação de Agricultura de Precisão
    sob a ótica da variabilidade espacial e temporal das lavouras; recursos para o
    diagnóstico da variabilidade das lavouras; operações mecanizadas e as máquinas
    envolvidas do diagnóstico às intervenções localizadas.

    11) Planejamento e gerenciamento de sistemas mecanizados: função básica da mecanização
    agrícola; Planejamento da base física e estruturas organizacionais de propriedades
    agrícolas, formatação de talhões, sistema viário, planejamento com base em planta
    padrão. Conceitos sobre gestão de processos. Metodologias e critérios para: avaliação
    de desempenho operacional, estudo de tempos e movimentos, seleção de máquinas
    agrícolas; Avaliação dos custos de sistemas mecanizados agrícolas: definição e
    metodologia de cálculo de custos diretos, fixos e variáveis; Custo indireto: pontualidade
    em operações agrícolas; Conceitos básicos sobre sistemas de informações gerenciais
    com enfoque no desempenho operacional e econômico de sistemas mecanizados; Ferramentas
    da qualidade para planejamento e gerenciamento: ciclo PDCA, QFD, FMEA. Conceitos
    de qualidade aplicados a operações agrícolas.'
  course_name: 'LEB0432 - Máquinas e Implementos Agrícolas

    Agricultural Machinery'
  deactivation: ''
  instructors: '86410 - Casimiro Dias Gadanha Junior

    59531 - Jose Paulo Molin

    2231586 - Leandro Maria Gimenez

    75290 - Marcos Milan

    2230585 - Thiago Liborio Romanelli'
  lecture_credits: '4'
  objectives: 'a. Apresentar os principais tipos de máquinas e implementos agrícolas
    e contextualizar sua utilização e inserção em sistemas de produção de grãos e
    biomassa.

    b. Capacitar os alunos para a gestão de recursos mecanizados considerando aspectos
    técnicos e econômicos.

    c. Realizar práticas: reconhecimento e justes de máquinas agrícolas; cálculos
    para estabelecimento de doses, vazões, capacidades, custos.'
