  course: "1.\tAdaptação e evolução, histórica. Sistemas de produção no país.\n2.\t\
    Introdução ao estudo do comportamento animal, conceitos, princípios e fundamentos\
    \ da etologia; Estrutura do comportamento (bases genéticas, fisiológicas e endócrinas\
    \ do comportamento); Noções básicas do comportamento social dos animais; estudo\
    \ do comportamento animal (comportamento instintivo; comportamento adquirido e\
    \ aprendizagem. Estudos de inteligência comparada. Organização Social. Comportamento\
    \ Social).\n3.\t Termorregulação \x96 comportamento termofísico dos animais: conceituação,\
    \ equilíbrio térmico, homeotermia, termogênese, zonas de termoneutralidade para\
    \ diferentes produções.\n4.\tMecanismos de transferência de energia térmica e\
    \ as trocas de calor.\n5.\tPsicrometria: caracterização do ar, e principais propriedades,\
    \ cálculos e uso de softwares.\n6.\tAmbiente e Conforto: fatores ambientais, caracterização\
    \ climática, avaliação térmica de ambientes, índices de conforto térmico. Estudo\
    \ de casos.\n7.\tAplicações da etologia no manejo e produção animal;\n8.\tConceitos,\
    \ princípios e fundamentos do bem-estar animal. Stress. Conceitos de bem-estar\
    \ animal; Senciência e bem-estar animal. Estados motivacionais: dor, frustração,\
    \ medo,  fome, outros estados motivacionais;Cognição;Etologia e bem-estar animal;Estados\
    \ biológicos e bem-estar animal; fisiologia do estresse; Bem-estar e produção\
    \ animal; Relação humano-animal;Transporte, manejo pré-abate, e abate ;Sistemas\
    \ de criação e bem-estar animal ;Avaliação e melhoria do bem-estar animal: enriquecimento\
    \ ambiental e sistemas  alternativos de criação animal;Legislação e regulamentação\
    \ nacional e internacional de bem-estar animal;Manejo racional; Apresentação de\
    \ aspectos inerentes ao uso dos animais de produção para a indústria animal, apresentação\
    \ de questões científicas, éticas e morais da utilização dos animais; noções de\
    \ enriquecimento ambiental. Mecanismos de engenharia para promover o bem estar\
    \ animal, na relação homem \x96 animal - ambiente.\n9.\tZootecnia de Precisão:\
    \ Conceitos, aplicações, e sistemas de controle. Biosensores. Sistemas inteligentes\
    \ de controle de ambiente e comportamento animal. Ferramentas de avaliação do\
    \ bem estar, comportamento e ambiência dos ciclos produtivos.\n10.\tSeminários"
  course_name: 'LEB0400 - Zootecnia de Precisão, Ambiência e Bem Estar Animal

    Precision Animal Production, Environmenta and Animal Welfare'
  deactivation: ''
  instructors: '2699852 - Iran José Oliveira da Silva

    2988034 - Késia Oliveira da Silva Miranda'
  lecture_credits: '4'
  objectives: A disciplina de Zootecnia de Precisão, Ambiência e Bem Estar Animal
    tem por objetivo transmitir aos alunos os conhecimentos gerais e as novas tecnologias
    utilizadas no sistema de produção industrial de animais, focando a importância
    dos mercados consumidores nas diferentes visões do profissional de ciências agrárias.
    Proporcionar aos alunos uma análise crítica sobre as formas de avaliação das condições
    ambientais, em nível de conforto térmico na produção animal. Abordando os conceitos
    básicos das propriedades psicrométricas do ar, e aplicações da termodinâmica relacionadas
    ao ciclo produtivo (animal). Diante dessa proposta a disciplina visa relacionar
    os conhecimentos dos sistemas de produção com o uso de técnicas de precisão (instrumentação
    e micro-eletrônica) aplicada a produção animal introduzindo os conceitos e aplicações
    da zootecnia de precisão, bem como o uso de biosensores na avaliação dos ciclos
    produtivos e a aplicação das inovações tecnológicas no setor animal. Simultaneamente
    a essa abordagem sistêmica dos diferentes sistemas de produção, as discussões
    visam também apresentar os  conceitos básicos de bem estar  aplicado aos sistemas
    industriais de produção e a realidade brasileira.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
