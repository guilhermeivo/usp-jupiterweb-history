    Literatura Complementar:

    Não há literatura complementar específica.'
  course: 'Escalas do clima. Variabilidade e mudança climática. O clima como fator
    de risco. A história da mudança climática. Painel Intergovernamental de Mudanças
    Climáticas (IPCC) e Painel Brasileiro de Mudanças Climáticas (PBMC). Produção
    agrícola em função do clima: efeitos da variação da radiação solar, da temperatura
    e umidade do ar, da precipitação, da composição atmosférica. Emissões da agricultura
    brasileira. Análise das vulnerabilidades da agricultura brasileira. e mundial.
    Projeções climáticas e de demanda agrícola de longo prazo: incertezas e possibilidades.
    Ferramentas para análise de adaptações às mudanças climáticas e planejamento estratégico.'
  course_name: 'LEB0410 - Mudanças Climáticas e Agricultura

    Climate Change and Agriculture'
  deactivation: ''
  instructors: '925245 - Fábio Ricardo Marin

    3609007 - Felipe Gustavo Pilau'
  lecture_credits: '2'
  objectives: Capacitar o aluno para compreender os conceitos de variabilidade e mudança
    climática, as causas da mudança no clima e seus efeitos sobre a agricultura brasileira.
    Analisar as projeções climáticas para as próximas décadas, em conjunto com os
    cenários econômicos, e discutir as adaptações necessárias dos sistemas produtivos
    agrícolas e florestais para lidar com as possíveis mudanças no clima.
  practical_credits: '1'
  total_workload: 60 h
  type: Semestral
