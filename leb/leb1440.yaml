  course: I – HIDROLOGIA – Introdução. Importância e aplicações da Hidrologia nas
    diferentes atividades da Engenharia, no manejo e utilização de recursos hídricos
    e no controle das águas naturais. Ciclo hidrológico. Chuvas, características e
    distribuição, chuvas intensas. Bacias hidrográficas. Cursos d’água, enchentes
    e estiagens. Demanda de água e disponibilidade dos recursos hídricos. Planejamento
    e manejo. Estudos hidrológicos para dimensionamento de reservatórios. Água subterrânea,
    aquíferos, tipos e propriedades. Hidráulica de poços. Qualidade das águas. Legislação
    para a gestão dos Recursos Hídricos. Previsão de eventos hidrológicos extremos,
    máximos e mínimos. Frequência, probabilidade e tempo de retorno. Métodos de análise.
    Escoamento superficial (Runoff). Condições de ocorrência, caracterização e previsão
    para projetos. Picos de descarga. Método Racional. Método de I-Pai-Wu. Dimensionamentos.
    II.  DRENAGEM – A diversidade dos problemas de drenagem e sua interação com a
    Hidrologia. Caracterização e controle do excesso de água em regiões úmidas. Caracterização
    e controle da salinidade em regiões áridas. Estudos básicos para a elaboração
    de projetos de drenagem. Caracterização dos fatores intervenientes da Hidrologia,
    do Solo, da Fisiologia Vegetal, da Hidráulica e do Geoprocessamento. Drenagem
    superficial, conservação do solo. Sistemas típicos e dimensionamentos. Projeto
    de drenagem superficial. Drenagem subterrânea. Aspectos teóricos do fluxo saturado
    no solo e equações para o cálculo do espaçamento de drenos. Sistemas característicos
    e condições de operação. Tipos de drenos, materiais e equipamentos. Procedimentos
    para a elaboração de um projeto de drenagem integrado, superficial e subterrâneo.
