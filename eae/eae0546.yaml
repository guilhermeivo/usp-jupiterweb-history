  course: "Aula 1\tApresentação Geral da Disciplina.\nAula 2\tIntrodução à Economia\
    \ e ao Comércio Internacional. Globalização e Competitividade. Evolução do comércio\
    \ internacional. Inserção do Brasil no mercado internacional.\nAula 3\tRevisão\
    \ da doutrina do livre comércio. Mercantilismo. Teorias Clássicas e Neoclássicas\
    \ do comércio internacional.\nAula 4\tO Balanço de Pagamentos: A Contabilidade\
    \ do Balanço de Pagamentos; a Estrutura do Balanço de Pagamentos; Poupança Externa,\
    \ Transferência de Recursos e a Dinâmica da Dívida Externa.\nAula 5\tFundamentos\
    \ de Política Comercial I: Tarifas e outras formas de proteção. Tipos de tarifas\
    \ e mensurações. Medidas do grau de proteção. Proteção Nominal e Proteção Efetiva.\
    \ Política comercial na prática.\nAula 6\tFundamentos de Política Comercial II:\
    \ quotas (puras, tarifárias), subsídios (produção, expoação), restrições voluntárias,\
    \ dumping, salvaguardas, barreiras não-tarifárias (sanitárias e técnicas).\nAula\
    \ 7\tFundamentos de Política Comercial III: Sistema Multilateral de Comércio GATT-OMC.\
    \ Integração Econômica e suas fases. Multilateralismo e Regionalismo. Criação\
    \ e desvio de comércio. Acordos Preferenciais de Comércio. Estudo dos blocos regionais\
    \ de comércio.\nAula 8\tFundamentos de Política Comercial IV: aplicações, exercícios,\
    \ debates.\nAula 9\tO Sistema Monetário Internacional em Perspectiva Histórica:\
    \ (a) O Mecanismo do Padrão Ouro; (b) O Sistema de Bretton Woods e o Fundo Monetário\
    \ Internacional; (c) A Transição para o Regime de Câmbio Flutuante.\nProva\t1a.\
    \ PROVA\nAula 10\tÁreas Monetárias Ótimas e a Experiência da União Européia: (a)\
    \ Mercado Comum e Taxas de Cambio Fixas: o Sistema Monetário Europeu. (b) O Euro\
    \ e a Política Macroeconômica: O Critério de Convergência de Maastricht; Banco\
    \ Central Unificado e Austeridade Fiscal. (c) A Teoria da Área Monetária Ótima\n\
    Aula 11\tO Mercado de Capitais Global: A Diversificação de Pofólio em Escala Global;\
    \ O Sistema Bancário Internacional e o Mercado de Capitais Internacionais; Mercado\
    \ de Eurodólares e outras Moedas; O mercado de derivativos: opções, futuros e\
    \ swaps; Regulamentação da Atividade Bancária Internacional: Acordos da Basiléia.\n\
    Aula 12\tA liberalização financeira e as crises: A tese pró-liberalização financeira\
    \ de Shaw-McKinnon; Liberalização financeira e crises financeiras (bancárias e\
    \ cambiais); Interpretações oodoxas e heterodoxas sobre as crises bancárias e\
    \ cambiais.\nAula 13\tEconomia Política Internacional: A Financeirização e a Mudança\
    \ do Regime de Acumulação do Capitalismo; Assimetrias e a condição dos países\
    \ periféricos.\nAula 14\tO debate brasileiro: A liberalização financeira brasileira\
    \ na década de 90; Interpretações sobre as recentes crises cambiais no Brasil;\
    \ O debate Com-versibilidade x Controles de Capitais e a Independência do Banco\
    \ Central.\nProva\t2ª PROVA"
  course_name: 'EAE0546 - Economia e Comércio Internacional

    Economy and International Trade'
  deactivation: 31/12/2009
  instructors: '58846 - Marcos Sawaya Jank

    2211145 - Rodrigo Alves Teixeira'
  lecture_credits: '4'
  objectives: 'Trata-se de um curso básico introdutório sobre economia e comércio
    internacional. A disciplina vai tratar dos principais fundamentos, conceitos e
    aplicações de economia, comércio e finanças internacionais, dirigidos a alunos
    do curso de Relações Internacionais. Na área de comércio internacional serão abordados
    temas como globalização e competitividade, fundamentos da teoria moderna de comércio,
    economia política do protecionismo, teoria e instrumentos de política comercial
    (tarifas, quotas de impoação, subsídios, dumping, salvaguardas, medidas do grau
    de proteção), integração econômica, criação e desvio de comércio e acordos preferenciais
    de comércio. Na área de economia e finanças internacionais serão analisados os
    seguintes tópicos: balanço de pagamentos, determinação da taxa de câmbio e regimes
    cambiais, sistema financeiro internacional, papel e atuação das instituições financeiras
    multilaterais (FMI, Banco Mundial), liberalização financeira e mercado internacional
    de capitais, crises financeiras e outros.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
