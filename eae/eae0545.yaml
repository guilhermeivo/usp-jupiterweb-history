  course: 'PARTE I: MICROECONOMIA E COMÉRCIO INTERNACIONAL

    1) O Comércio Internacional nas origens do pensamento econômico (1 aula)

    i. Mercantilistas

    ii. Economia Clássica: Adam Smith e David Ricardo

    2) Teoria Neoclássica do Comércio Internacional

    a) Fundamentos da Microeconomia Neoclássica:

    i. Teoria da Firma: Teoria da Produção, Teoria dos Custos, Maximização de lucros
    e oferta competitiva (3 aulas).

    ii. Teoria do Consumidor: maximização de utilidade (1 aula)

    b) Modelos Neoclássicos do Comércio Internacional (2 aulas)

    i. Modelo Heckscher-Ohlin

    ii. Teorema de Equalização do Preço dos Fatores de Paul Samuelson

    iii. Teorema de Stolper-Samuelson

    iv. Teorema de Rybczynsky

    PARTE II: MACROECONOMIA INTERNACIONAL

    1) Contas Nacionais e Balanço de Pagamentos (1 aula)

    2) Modelos de determinação da Renda

    i. Modelo Clássico e Modelo Keynesiano Simples (1 aula)

    ii. Modelo IS-LM e modelo Mundell-Fleming (3 aulas)

    3) Política Macroeconômica numa economia aberta e regimes cambiais (1 aula)

    4) Oferta Agregada e Curva de Phillips (1 aula)'
  course_name: 'EAE0545 - Fundamentos de Economia para o Comércio Internacional

    Economic Fundamentals for the International Trade'
  deactivation: 31/12/2009
  instructors: 2211145 - Rodrigo Alves Teixeira
  lecture_credits: '4'
  objectives: A disciplina visa apresentar aos alunos do curso de Relações Internacionais
    alguns conceitos e modelos básicos da Teoria Econômica e suas aplicações no estudo
    das relações econômicas internacionais.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
