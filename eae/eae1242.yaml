  course: '1.     TEORIA DE CARTEIRAS

    a.     Ativos Arriscados

    b.     Risco e Retorno Médio

    c.     Aversão ao risco e Retorno Esperado

    d.     Diversificação

    2.     EQUILÍBRIO ECONÔMICO NO MERCADO DE CAPITAIS: Capital Asset Pricing Model
    (CAPM)

    a.     Alocação de Capital entre Ativos Arriscados e Sem Risco

    b.     Carteiras Arriscadas Ótimas

    c.     O Capital Asset Pricing Model (CAPM)

    3.     NÃO-ARBITRAGEM NO MERCADO DE CAPITAIS: Arbitrage Pricing Theory (APT)

    a.     Modelos de 1 Fator e Multifator

    b.     Teoria de Apreçamento por Arbitragem (APT)

    4.     HIPÓTESE DE MERCADOS EFICIENTES

    a.     Eficiência do Mercado Financeiro

    b.     Evidências Empíricas Sobre o Retorno de Ativos

    c.     Gestão Ativa e Gestão Passiva

    5.     AVALIAÇÃO DE PROJETOS ARRISCADOS

    a.     Avaliação de Fluxos de Caixa Arriscados

    b.     O Custo de Capital da Empresa

    6.     AVALIAÇÃO DE DESEMPENHO

    a.     A Teoria de Gerência Ativa de Carteira

    b.     Avaliação de Desempenho de Carteiras'
  course_name: 'EAE1242 - Economia Financeira

    Financial Economics'
  deactivation: ''
  instructors: 2918014 - Rodrigo de Losso da Silveira Bueno
  lecture_credits: '4'
  objectives: O objetivo do curso é entender o funcionamento do mercado de renda variável
    (isto é, do mercado de ações) e como o instrumental de apreçamento de ações pode
    ser utilizado para apreçar ativos arriscados em geral. Discute-se as evidências
    sobre a eficiência dos mercados financeiros. As taxas de desconto ajustadas pelo
    risco também são utilizadas nos cálculos de fluxos de caixa descontados e de custo
    de capital das empresas. Finalmente, é estudado como avaliar o desempenho de fundos
    de investimento.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
