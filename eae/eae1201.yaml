  lecture_credits: '4'
  objectives: 'Esta é a primeira parte da sequência de Microeconomia. O foco fundamental
    do curso é  a modelagem do comportamento dos agentes econômicos. A disciplina
    discorre sobre a  abordagem pela teoria microeconômica das duas principais classes
    de agentes  econômicos: consumidores e firmas. A abordagem inclui aspectos positivos
    (estudo do  comportamento) e normativos (análise de bem-estar). No final, é feita
    uma pequena

    24

    introdução sobre o mecanismo de equilíbrio, que permite analisar a ação combinada
    de  agentes dessas duas classes.'
  practical_credits: '2'
  total_workload: 120 h
