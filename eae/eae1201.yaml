  lecture_credits: '4'
  objectives: Esta é a primeira parte da sequência de Microeconomia da graduação em
    economia da FEA/USP. O curso começa com uma revisão dos conceitos de otimização.
    Em seguida, apresenta a teoria da escolha individual em detalhes, com foco no
    comportamento do consumidor, e aplicações. É apresentada também teoria da escolha
    sob incerteza e teoria de preferências reveladas. Em seguida, o curso cobre a
    teoria da produção, examinando tecnologia, custos e oferta de mercado. Por fim,
    combina-se a teoria da demanda e a teoria da oferta para uma análise de equilíbrio
    parcial competitivo, no curto e no longo prazo. A apresentação dos conteúdos teóricos
    é combinada com a discussão de aplicações práticas dos modelos estudados.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
