  course_name: 'EAE0110 - Fundamentos de Microeconomia

    Foundations of Microeconomics'
  deactivation: ''
  instructors: '67224 - Jose Paulo Zeetano Chahad

    41820 - Maria Cristina Cacciamali'
  lecture_credits: '4'
  objectives: 'O objetivo geral do curso de Introdução à Economia é apresentar os
    fundamentos básicos da moderna teoria econômica. A microeconomia do funcionamento
    do mercado como forma de organização para a alocação eficiente dos recursos escassos
    da economia. Neste sistema são determinados os preços e quantidades que otimizam
    o bem estar da sociedade, sob o regime de plena concorrência. As falhas no funcionamento
    do mercado devido a concorrência imperfeita e/ou externalidades podem ser mitigadas
    com as políticas de intervenção do Governo, inclusive aquelas destinadas a redistribuir
    da riqueza para reduzir a pobreza. Ênfase é dada ao estudo da produtividade e
    do comércio internacional como fontes de ganhos de bem estar para a sociedade.
    A macroeconomia cuida de analisar os determinantes da renda nacional e do emprego
    no curto e no longo prazo. A determinação dos macros preços: juros, câmbio e salários,
    fazem parte do processo das flutuações da renda nacional, cujo sinal de desequilíbrio
    em relação ao pleno emprego, é apontado nos índices de inflação ou taxa de desemprego.
    As políticas macroeconômicas e curto prazo levam o governo a praticar a sintonia
    fina através das políticas monetárias e curto prazo levam o governo a pratica
    a sintonia fina através das políticas monetárias e fiscais, que numa economia
    aberta aos fluxos de comércio e de capital tem reflexos na política cambial. Finalmente,
    é estudada a contribuição da acumulação de fatores (capital e trabalho) e das
    inovações tecnológicas para o crescimento da renda nacional no longo prazo.

    Espera-se que com os ensinamentos da teoria básica os alunos façam um acompanhamento
    analítico dos fatos do cotidiano do mundo econômico, inclusive avaliem a eficiência
    e a eficácia das políticas econômicas.'
