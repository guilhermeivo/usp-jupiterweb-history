  lecture_credits: '4'
  objectives: 'Neste curso estudaremos em que situações e de que forma o governo deve
    atuar na economia

    de forma a gerar o melhor bem-estar para a sociedade, e se de fato isso ocorre
    no mundo real

    (e por que não). Estudaremos também como deve ser organizado o sistema tributário
    dos países

    de forma a alcançar seus objetivos de redistribuição de renda, e como abordar
    dificuldades

    modernas na taxação de riqueza e grandes empresas.

    In this course, we study in which situations and how the government should intervene
    in the

    economy, to generate the maximum social welfare. We also study whether this happens
    in the

    real world, and why not. We will study how countries’ tax systems should be organized,
    in order

    to reach goals of income redistributions, and how to approach modern challenges
    in wealth and

    corporate taxation.'
  practical_credits: '0'
