  course: '1. Introdução à saúde multiespécie e suas pedagogias periféricas.

    2. Revisão e discussão de literatura.

    3. Trabalho de campo (visita ao território e respectivas instituições).

    4. Preparação e aplicação de atividade de educação em saúde multiespécie no território
    com crianças.

    5. Elaboração de proposta especulativa quanto a promoção da saúde multiespécie
    no território.'
  course_name: 'VPS1101 - Pedagogias periféricas da saúde multiespécie

    Peripheral pedagogies of multispecies health'
  deactivation: ''
  instructors: '602530 - Evelise Oliveira Telles

    1032471 - Fabio Gregori

    7749147 - Oswaldo Santos Baquero'
  lecture_credits: '4'
  objectives: 'da atividade

    realizar atividades educação em saúde multiespécie.

    Descrição da atividade

    com base em revisão de literatura, trabalhos de campo e conversa com educadores
    de uma instituição parceira que trabalha com crianças, os estudantes organizarão
    e realizarão atividades de educação em saúde multiespcie adequadas às situações
    cotidianas da comunidade em que vivem.

    Indicadores de avaliação da atividade

    comentários das crianças, dos estudantes, da avaliação conjunta dos três docentes
    responsáveis pela disciplina e de representantes da instituição parceira.'
