  course: "1)\tIntrodução ao curso: objetivos, metodologia, entrega de material para\
    \ os seminários, e definição do tema para o trabalho de conclusão do curso.\n\
    2)\tÉtica e legislação em bem-estar animal\n3)\tAspectos econômicos relacionados\
    \ com boas práticas de bem-estar animal e programas de certificação\n4)\tBiomarcadores,\
    \ incluindo aspectos epidemiológicos e tecnologia de sensores na avaliação de\
    \ bem-estar animal\n4.1)\tSeminário virtual 1 & 2) Cenários interativos para a\
    \ avaliação de bem-estar animal. Os seminários vão facilitar o trabalho individual\
    \ e em grupo, com o estabelecimento de um banco de dados global sobre o desempenho\
    \ dos estudantes nos cenários (Heleski, Zanella and Pajor, 2003; Zanella, 2008).\
    \ A avaliação dos cenários irá preceder a abordagem na sala de aula e também o\
    \ trabalho prático.\n5)\tIndicadores e protocolos para avaliar o bem-estar de\
    \ aves domésticas e coelhos\n6)\tIndicadores e protocolos para avaliar o bem-estar\
    \ de bovinos de corte e de leite\n7)\tIndicadores e protocolos para avaliar o\
    \ bem-estar de caprinos e ovinos;\n8)\tIndicadores e protocolos para avaliar o\
    \ bem-estar de equídeos e suínos\n9)\tIndicadores e protocolos para avaliar o\
    \ bem-estar de animais de peixes e animais aquáticos\n10)\t Indicadores e protocolos\
    \ para avaliar o bem-estar de animais utilizados em pesquisa\n11)\t Indicadores\
    \ e protocolos para avaliar o bem-estar de animais de companhia e esporte\n12)\t\
    \ Indicadores e protocolos para avaliar o bem-estar de animais não domesticados,\
    \ mantidos em cativeiro ou em liberdade.\nAulas Práticas (2 horas/aula/grupo de\
    \ 20 estudantes): Ministradas em Pirassununga\n1)\tAnálise comportamental, de\
    \ saúde; coleta de amostras; análise laboratorial de bio-marcadores de bem-estar\
    \ animal; sensores utilizados para avaliação de bem-estar animal\n2)\tProtocolos\
    \ para mensurar experiências subjetivas: conforto, contentamento, dor, medo, \
    \ memoria, ansiedade em animais\n3)\tUtilização prática de protocolos validados\
    \ de avaliação de bem-estar animal em várias espécies de animais\n4)\tCompetição\
    \ de avaliação de bem-estar animal (Heleski, Zanella & Pajor, 2003)\nInstrumentos\
    \ e Critérios de Avaliação"
  course_name: 'VPS3208 - Avaliação Científica de Bem-estar animal

    Scientific Evaluation of Animal Welfare'
