  course: '- Introdução à epidemiologia

    - (Re)produção de situações epidêmicas

    - Inferência causal em saúde

    - Ecologia populacional e saúde

    - Dinâmica populacional de doenças infecciosas

    - Distribuição de eventos de saúde no tempo e no espaço

    - Medidas de frequência de eventos de saúde

    - Medidas de associação

    - Estudos de coorte

    - Estudos de caso-controle

    - Estudos transversais e estudos ecológicos

    - Estudos de intervenção

    - Métodos diagnósticos

    - Vigilância epidemiológica

    - Análise de risco

    Instrumentos e Critérios de Avaliação'
  course_name: 'VPS2202 - Epidemiologia Veterinária

    Veterinary Epidemiology'
  deactivation: ''
  instructors: 7749147 - Oswaldo Santos Baquero
  lecture_credits: '5'
  objectives: Introduzir a epidemiologia, enfatizando o raciocínio causal, a dinamicidade
    dos processos de saúde e de doença, a quantificação de indicadores de eventos
    de saúde, a identificação de possíveis alvos de intervenção, assim como os protocolos
    diagnósticos de base populacional e a vigilância epidemiológica.
  practical_credits: '0'
  total_workload: 75 h
