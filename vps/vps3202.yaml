  bibliography: 'Complementar

    A bibliografia complementar será disponibilizada previamente a cada aula ou atividade
    didática por meio da plataforma e-Disciplinas (Moodle).

    Consistirá em artigos científicos atualizados, artigos de divulgação técnico-científica,
    notas técnicas, documentos oficiais, diretrizes sanitárias, reportagens especializadas
    e outros materiais relevantes para aprofundamento dos temas abordados.

    Os materiais serão fornecidos por meio de links para acesso online ou em formato
    PDF, visando subsidiar a construção de conhecimento específico, atualizado e contextualizado
    às demandas contemporâneas da epidemiologia das doenças parasitárias dos animais
    domésticos.'
  course: "•\tFundamentos de epidemiologia aplicada às doenças parasitárias: conceitos\
    \ de cadeia epidemiológica, dinâmica de transmissão, fatores de risco, indicadores\
    \ epidemiológicos e estratégias de vigilância.\n•\tProtozooses de ruminantes:\
    \ coccidiose (Eimeriose), criptosporidiose, giardíase, tricomonose, neosporose\
    \ bovina e tripanossomose bovina.\n•\tHemoparasitoses de ruminantes e equinos:\
    \ tristeza parasitária bovina e piroplasmose.\n•\tHemoparasitoses de cães e gatos.\n\
    •\tParasitoses gastrointestinais de ruminantes: helmintoses gastrintestinais\n\
    •\tVerminoses pulmonares (dictiocaulose), fasciolose e euritrematose.\n•\tParasitoses\
    \ gastrointestinais de equinos.\n•\tParasitoses gastrointestinais de cães e gatos.\n\
    •\tEctoparasitoses de importância veterinária: carrapatos de bovinos, equinos\
    \ e cães (Ixodídeos); pulgas; piolhos; sarnas (escabioses); moscas sinantrópicas\
    \ e miíases.\n•\tDiagnóstico parasitológico: métodos coproparasitológicos, identificação\
    \ de ectoparasitas, técnicas para hemoparasitos e interpretação de resultados\
    \ laboratoriais.\n•\tPlanejamento e controle das doenças parasitárias: medidas\
    \ profiláticas, manejo integrado de parasitas, resistência antiparasitária, biossegurança\
    \ e estratégias sustentáveis de controle em sistemas de produção e em animais\
    \ de companhia.\n•\tAtividade prática de campo: diagnóstico situacional em propriedades\
    \ rurais, coleta de amostras, análise laboratorial, discussão epidemiológica e\
    \ elaboração de relatório técnico com recomendações de controle e prevenção."
  course_name: 'VPS3202 - Epidemiologia das Doenças Parasitárias dos Animais Domésticos

    Epidemiology of Parasitic Diseases of Domestic Animals'
  deactivation: ''
  instructors: '189043 - Adriano Pinter dos Santos

    2801164 - Marcelo Bahia Labruna

    1953541 - Rodrigo Martins Soares'
  lecture_credits: '5'
  objectives: "da atividade\n•\tContribuir para a melhoria das condições sanitárias\
    \ das propriedades visitadas, com foco no controle das doenças parasitárias de\
    \ ruminantes domésticos;\n•\tPromover a troca de conhecimentos entre universidade\
    \ e produtores rurais, valorizando saberes técnicos e práticos;\n•\tCapacitar\
    \ os estudantes para realizar diagnóstico situacional em campo, integrando aspectos\
    \ epidemiológicos, clínicos e de manejo;\n•\tElaborar recomendações técnicas viáveis\
    \ e compatíveis com a realidade socioeconômica do produtor;\n•\tEstimular a adoção\
    \ de práticas sustentáveis de controle parasitário, considerando biossegurança,\
    \ bem-estar animal e saúde única.\nDescrição da atividade\nA atividade de extensão\
    \ é desenvolvida durante a viagem didática ao município de Pirassununga, quando\
    \ os estudantes, organizados em grupos e acompanhados pelo docente responsável,\
    \ visitam propriedades rurais de pequeno ou médio porte.\nInicialmente, é realizada\
    \ entrevista estruturada com o pecuarista ou responsável técnico, abordando manejo\
    \ sanitário, histórico de doenças parasitárias e práticas de controle adotadas.\
    \ Em seguida, os estudantes realizam coleta de amostras biológicas (fezes, ectoparasitas\
    \ e, quando pertinente, amostras sanguíneas), que são processadas e analisadas\
    \ em laboratório didático.\nCom base nos resultados obtidos e na análise epidemiológica\
    \ da propriedade, os estudantes elaboram um relatório técnico em linguagem acessível,\
    \ contendo diagnóstico situacional e recomendações práticas de prevenção e controle.\
    \ O relatório é encaminhado ao produtor como devolutiva formal da atividade.\n\
    Indicadores de avaliação da atividade\n•\tQualidade técnica e aplicabilidade das\
    \ recomendações apresentadas nos relatórios;\n•\tParticipação e engajamento dos\
    \ estudantes nas atividades de campo e laboratório;\n•\tDiscussão reflexiva com\
    \ os estudantes ao final do módulo prático;\n•\tPercepção do pecuarista quanto\
    \ à utilidade das orientações recebidas;\n•\tIntegração efetiva entre ensino,\
    \ extensão e realidade produtiva regional."
