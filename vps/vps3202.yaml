  course_name: 'VPS3202 - Epidemiologia das Doenças Parasitárias dos Animais Domésticos

    Epidemiology of Parasitic Diseases of Domestic Animals'
  deactivation: ''
  instructors: '189043 - Adriano Pinter dos Santos

    2801164 - Marcelo Bahia Labruna

    1953541 - Rodrigo Martins Soares'
  lecture_credits: '5'
  objectives: 'da atividade

    Capacitar os alunos a executarem um diagnóstico de situação das doenças Parasitárias
    numa propriedade rural de criação de ruminantes domésticos, e a partir daí, gerar
    um relatório técnico com recomendações de melhorias e implementação de novas tecnologias
    para o controle e prevenção das doenças parasitárias de animais domésticos, dentro
    da realidade dos pequenos produtores rurais.

    Descrição da atividade

    Anualmente, a turma de alunos da disciplina VPS3202 tem uma média de 80 anos,
    a qual é sempre dividida em quatro grupos, cada um com cerca de 20 alunos. Nesta
    atividade prática, cada grupo visita uma propriedade rural de pequeno porte na
    região de Pirassununga, sempre na companhia do professor responsável, totalizando
    quatro propriedades rurais diferentes. Em cada uma das propriedades, os alunos
    primeiro fazem uma entrevista com o proprietário ou responsável técnico, referente
    a questões do manejo geral da propriedade e dos métodos que vem sendo empregados
    para controle das principais doenças parasitárias que afetam ruminantes domésticos,
    tais como as causadas por helmintos, artrópodes e protozoários, conforme o programa
    da disciplina. Após o questionário, os alunos executam coleta de amostras clínicas
    (fezes, ectoparasitas, esfregaços sanguíneos) dos animais da propriedade (bovinos
    principalmente, e quando presentes, ovinos e equinos). Essas amostras são levadas
    ao laboratório, onde são examinadas pelos próprios alunos para diagnóstico de
    parasitas por métodos usuais rotineiramente utilizados para tais fins. Os resultados
    são discutidos entre os alunos e professores, visando o entendimento da situação
    epidemiológica das doenças parasitárias na propriedade em questão. Após isso,
    os alunos confeccionam um relatório técnico numa linguagem acessível, que é encaminhado
    ao proprietário ou responsável técnico pela propriedade rural visitada. Neste
    relatório, além de uma breve descrição das atividades realizadas pelos alunos,
    são descritos os resultados dos exames laboratoriais e uma série de recomendações
    técnicas com vistas à melhoria do manejo da propriedade quanto às doenças parasitárias,
    sempre tendo em mente a realidade prática do pequeno produtor rural na região
    visitada.

    Indicadores de avaliação da atividade

    -Discussão com os alunos no final do módulo, sobre a impressão pessoal de cada
    um sobre a semana de aulas práticas em Pirassununga;

    -Avaliação dos alunos através do Conselho de Classe;

    -Percepção do proprietário sobre nossa visita a sua propriedade rural e sobre
    o relatório técnico encaminhado a ele ao final das atividades práticas.'
