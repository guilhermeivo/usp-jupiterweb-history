  bibliography: "BRASIL. MAPA. Portaria n° 46, de 10 de fevereiro de 1998.\nInstitui\
    \ o Sistema de Análise de Perigos e Pontos Críticos de Controle - APPCC a ser\
    \ implantado, gradativamente, nas indústrias de produtos de origem animal sob\
    \ o regime do Serviço de Inspeção Federal - SIF, de acordo com o MANUAL GENÉRICO\
    \ DE PROCEDIMENTOS, anexo à referida Portaria.\nBRASIL. MAPA. Portaria Nº368 de\
    \ 04 de setembro de 1997.\nAprova o Regulamento Técnico sobre as condições Higiênico-Sanitárias\
    \ e de Boas Práticas de Fabri-cação para Estabelecimentos Elaboradores Industrializadores\
    \ de Alimentos.\nBRASIL. MAPA. Resolução nº 10, de 22 de maio de 2003.\nInstitui\
    \ o Programa Genérico de PROCEDIMENTOS - PADRÃO DE HIGIENE OPERACIONAL - PPHO,\
    \ a ser utilizado nos Estabelecimentos de Leite e Derivados que funcionam sob\
    \ o regi-me de Inspeção Federal, como etapa preliminar e essencial dos Programas\
    \ de Segurança Alimentar do tipo APPCC (Análise de Perigos e Pontos Críticos de\
    \ Controle).\nBRASIL. Portaria MS nº 1.428, de 26 de novembro de 1993.\nPrecursora\
    \ na regulamentação desse tema, essa Portaria dispõe, entre outras matérias, sobre\
    \ as diretrizes gerais para o estabelecimento de Boas Práticas de Produção e Prestação\
    \ de Serviços na área de alimentos.\nBRASIL. Portaria SVS/MS nº 326, de 30 de\
    \ julho de 1997.\nBaseada no Código Internacional Recomendado de Práticas: Princípios\
    \ Gerais de Higiene dos Ali-mentos CAC/VOL. A, Ed. 2 (1985), do Codex Alimentarius,\
    \ e harmonizada no Mercosul, essa Portaria estabelece os requisitos gerais sobre\
    \ as condições higiênico-sanitárias e de Boas Práticas de Fabri-cação para estabelecimentos\
    \ produtores/industrializadores de alimentos.\nBRASIL. Resolução - RDC nº 275,\
    \ de 21 de outubro de 2002.\nEssa Resolução foi desenvolvida com o propósito de\
    \ atualizar a legislação geral, introduzindo o con-trole contínuo das BPF e os\
    \ Procedimentos Operacionais Padronizados, além de promover a har-monização das\
    \ ações de inspeção sanitária por meio de instrumento genérico de verificação\
    \ das BPF. Portanto, é ato normativo complementar à Portaria SVS/MS nº 326/97.\n\
    BRASIL. Resolução - RDC nº 216, de 15 de setembro de 2004.\nAprova o Regulamento\
    \ Técnico e estabelece procedimentos de Boas Práticas para serviços de ali-mentação\
    \ a fim de garantir as condições higiênico-sanitárias do alimento preparado.\n\
    BRASIL. Portaria SMS Nº 2619 de 06 de dezembro de 2011.\nAprova o Regulamento\
    \ Técnico de Boas Práticas. Estabelece critérios/ procedimentos operacionais \
    \     padronizados para a produção de alimentos. REVOGA a Portaria nº 1210, de\
    \ 03 de agosto de 2006.\nBRASIL. MS. Portaria Nº 2914 de 12 de dezembro de 2011.\n\
    Dispõe sobre os procedimentos de controle e de vigilância da qualidade da água\
    \ para consumo hu-mano e seu padrão de potabilidade. REVOGA a Portaria nº 518,\
    \ de 25 de março de 2004.\nESTADO DE SÃO PAULO. Portaria CVS Nº 05, de 19 de abril\
    \ de 2013.\nAprova o regulamento técnico sobre boas práticas para estabelecimentos\
    \ comerciais de alimentos e para serviços de alimentação, e o roteiro de inspeção\
    \ que vai anexo. Revoga as Portaria CVS nº 6, de 10 de março de 1999 e a Portaria\
    \ CVS nº 18, de 9 de setembro de 2008.\nESTADO DE SÃO PAULO. Lei nº 10.083, de\
    \ 23 de setembro de 1998. Dispõe sobre o Código Sanitário do Estado. Disponível\
    \ em: http://www.mpsp.mp.br/portal/page/portal/cao_consumidor/legislacao/leg_constituicao_federal_leis/leg_cf_Codigos/leg_cf_c_codigo_sanitario\n\
    FRANCO, B.D.G.M.; LANDGRAF, M. Microbiologia dos alimentos. São Paulo, Editora\
    \ Atheneu, 2001.\nMASSAGUER, P.R. Microbiologia dos Processos Alimentares. São\
    \ Paulo, Editora Varela, 2005, 258 p.\nOPAS/OMS. Perspectivas sobre a análise\
    \ de risco na segurança dos alimentos. Curso de Sensibiliza-ção. Rio de janeiro\
    \ – OPAS/OMS, 2008, 160 p.\nJAY, J.M. Modern food microbiology, 6th edition. Aspen\
    \ Publishers, Inc., 2000, 679 p.\nFDA. Bad Bug Book. Handbook of foodborn pathogenic\
    \ microorganisms and natural toxins, 2nd edi-tion, FDA. 2012. Disponível em: http://www.fda.gov/food/foodborneillnesscontaminants/causesofillnessbadbugbook/default.htm\n\
    WHO/FAO. Codex Alimentarius. International food standards. Disponível em: http://www.codexalimentarius.org/\n\
    OPAS. Ferramenta essencial para a inocuidade dos alimentos. Buenos Aires, Argentina.\
    \ OPAS /INPPAZ, 2005.\n1)\tBoas Práticas Agrícolas (GAP) e Boas Práticas de Fabricação\
    \ (GMP). Disponível em: http://bvs.panalimentos.org/local/File/manual_haccp_fasciculo_gmp2.pdf‎\n\
    2)\tAnálise de Perigos e Pontos Críticos de Controle – HACCP. Disponível em: \
    \ http://bvs.panalimentos.org/local/file/manual_haccp_fasciculo_haccp3.pdf\n3)\t\
    Métodos modernos de ensino em GMP/HACCP/auditoria. Disponível em: http://bvs.panalimentos.org/local/file/MANUAL_HACCP_FASCICULO_METODOS_ENSINO5.pdf"
  course: Perigos físicos, químicos e biológicos que podem ser veiculados pelos alimentos
    e as medidas preventivas. Análise de Perigos e Pontos Críticos de Controle (APPCC).
    Análise microbiológica de alimentos. Papel da Microbiologia Preditiva (MP) e da
    Análise de Risco (AA) na segurança dos alimentos.
  course_name: 'VPS3205 - Higiene e Segurança Alimentar II

    Food Hygiene and Safety II'
  deactivation: ''
  instructors: '602530 - Evelise Oliveira Telles

    2794132 - Simone de Carvalho Balian'
  lecture_credits: '1'
  objectives: Reconhecer os perigos que podem ser transmitidos por alimentos e as
    medidas de controle para os diversos perigos; - compreender as etapas de implantação,
    implementação e avaliação contínua das ferramentas de controle da segurança dos
    alimentos nas diferentes etapas de produção dos alimentos de origem animal;- entender
    o papel dos órgãos oficiais de controle na mitigação dos riscos e discernir a
    competência de cada esfera na normatização e fiscalização das ações nos diferentes
    estabelecimentos/empresas; - identificar os princípios da Análise de Perigos e
    Pontos Críticos de Controle; - entender o papel da análise laboratorial dos alimentos
    no contexto da segurança dos alimentos.
  practical_credits: '1'
  total_workload: 45 h
  type: Semestral
