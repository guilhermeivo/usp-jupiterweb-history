  course: 'Módulo I: Criação e implementação das primeiras bibliotecas escolares entre
    o final do século XIX e as décadas de 1930 e 1940.

    Entendimento das bibliotecas escolares na legislação, suas modificações e tensionamentos.Propostas
    de inserção da biblioteca escolar no horário escolar e de introdução de práticas
    educativas nesses espaços, dialogando com a análise de experiências realizadas
    em escolas primárias em São Paulo e no Rio de Janeiro.

    Concepção do trabalho de bibliotecários (as) e sua relação com a escolarização
    da infância na primeira metade do Novecentos.

    Módulo II: Apresenta a escola – e sua biblioteca, em especial – como espaço de
    memória a partir do qual se pode prospectar práticas escolares cotidianas na cultura
    escolar.

    Condições materiais e práticas da existência e manutenção da biblioteca escolar.

    A biblioteca como espaço potencial para articulação de ações socioculturais e
    educativas interdisciplinares na escola.

    Módulo III: As formas de aprendizagem com os meios digitais e práticas de leitura
    Bibliotecas e salas de leitura: os desafios desse contexto contemporâneo Biblioeducação
    e bibliotecas vivas.

    Bibliotecas comunitárias, acervos de acesso público e intercâmbios com a biblioteca
    escolar.'
