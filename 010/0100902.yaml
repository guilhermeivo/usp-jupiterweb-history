  course: "1.\tClínica Médica e Cirúrgica de Pequenos Animais\no\tDiagnóstico e manejo\
    \ de doenças comuns em cães e gatos.\no\tPrincipais procedimentos cirúrgicos e\
    \ cuidados pré e pós-operatórios.\no\tAtendimento emergencial e manejo intensivo.\n\
    2.\tSaúde Pública Veterinária\no\tZoonoses e doenças de interesse em saúde pública.\n\
    o\tControle de surtos e atuação em emergências sanitárias.\no\tInspeção e controle\
    \ de qualidade de produtos de origem animal.\n3.\tProdução Animal e Reprodução\n\
    o\tGestão de propriedades rurais e sistemas de produção animal.\no\tNutrição,\
    \ sanidade e manejo reprodutivo de animais de produção.\no\tBem-estar animal e\
    \ sustentabilidade na produção agropecuária.\n4.\tÉtica e Deontologia Veterinária\n\
    o\tPrincípios éticos na prática veterinária.\no\tRelação veterinário-cliente e\
    \ responsabilidade profissional.\no\tRegulamentações e legislações pertinentes\
    \ à Medicina Veterinária.\nInstrumentos e Critérios de Avaliação"
  course_name: '0100902 - Ênfase de Formação em Serviço - Módulo II

    In-service formation training - Module II'
  deactivation: ''
  instructors: 1463350 - Mayra Elena Ortiz D'Avila Assumpção
  lecture_credits: '0'
  objectives: 'Específicos:

    o Aplicar, na prática, os conhecimentos generalistas adquiridos ao longo do curso
    em diferentes áreas da Medicina Veterinária, como clínica médica e cirúrgica,
    medicina veterinária preventiva, saúde pública, saúde animal, produção e reprodução
    animal e inspeção e tecnologia de produtos de origem animal.

    o Desenvolver habilidades técnicas e interpessoais para realizar diagnósticos,
    tratamentos e procedimentos clínicos com precisão e segurança.

    o Promover a integração entre teoria e prática, estimulando a tomada de decisões
    baseadas em evidências científicas.

    o Aprimorar a comunicação e o relacionamento com proprietários e equipe técnica.

    o Capacitar o estudante a gerenciar casos clínicos complexos e situações emergenciais.

    o Fomentar a postura ética, a responsabilidade social e o compromisso com o bem-estar
    animal.'
  practical_credits: '8'
  total_workload: 240 h
  type: Semestral
