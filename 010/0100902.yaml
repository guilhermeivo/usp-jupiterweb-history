  assessment: A disciplina não oferece segunda avaliação
  bibliography: Todas aquelas que constam das ementas das disciplinas obrigatórias
    do curso de Medicina Veterinária.
  course: '1. Clínica Médica e Cirúrgica de Pequenos Animais

    o Diagnóstico e manejo de doenças comuns em cães e gatos.

    o Principais procedimentos cirúrgicos e cuidados pré e pós-operatórios.

    o Atendimento emergencial e manejo intensivo.

    2. Clínica Médica e Cirúrgica de Grandes Animais

    o Principais patologias de interesse em bovinos, equinos e suínos.

    o Técnicas de diagnóstico, terapia e cirurgia em grandes animais.

    o Manejo reprodutivo e zootécnico de espécies de produção.

    3. Saúde Pública Veterinária

    o Zoonoses e doenças de interesse em saúde pública.

    o Controle de surtos e atuação em emergências sanitárias.

    o Inspeção e controle de qualidade de produtos de origem animal.

    4. Produção Animal e Reprodução

    o Gestão de propriedades rurais e sistemas de produção animal.

    o Nutrição, sanidade e manejo reprodutivo de animais de produção.

    o Bem-estar animal e sustentabilidade na produção agropecuária.

    5. Ética e Deontologia Veterinária

    o Princípios éticos na prática veterinária.

    o Relação veterinário-cliente e responsabilidade profissional.

    o Regulamentações e legislações pertinentes à Medicina Veterinária.'
  course_name: '0100902 - Ênfase de Formação em Serviço - Módulo II

    In-service formation training - Module II'
  deactivation: ''
  instructors: 1463350 - Mayra Elena Ortiz D'Avila Assumpção
  lecture_credits: '0'
  objectives: 'da atividade

    Treinamento de habilidades técnicas, trabalho em equipe e comunicação interpessoal
    no atendimento veterinário junto ao HOVET, fazendas e empresas, ao grupo social
    alvo da atividade.

    Descrição da atividade

    Recepção do responsável e do paciente, atendimento com avaliação clínica e coleta
    de material biológico, solicitação e interpretação de exames complementares, discussão
    do caso clinico/cirúrgico, acompanhamento do procedimento cirúrgico e pós-operatório.
    Manejo produtivo, reprodutivo, sanitário e de planejamento nas propriedades rurais
    e empresas do setor.

    Indicadores de avaliação da atividade

    A cada cliente, o responsável responde um questionário avaliativo do atendimento
    prestado pelos alunos.'
  practical_credits: '8'
  total_workload: '240 h

