  bibliography: 'Literatura Básica:

     Princípios de Biologia do Desenvolvimento por Lewis Wolpert et al., 2008 Editora
    Artmed

    (disponível na Biblioteca do CENA/USP)

     Infinitas formas de grande beleza: como a evolução forjou a grande quantidade
    de criatura

    que habitam o nosso planeta por Sean B. Carroll. 2006. Editora: Jorge Zahar Rio
    de Janeiro

    Literatura Complementar:

    Artigos científicos:

     How mate choice shaped human nature: A review of sexual selection and human
    evolution.

    Miller, G. F. (1998). In C. Crawford & D. Krebs (Eds.), Handbook of evolutionary

    psychology: Ideas, issues, and applications (pp. 87- 130). Lawrence Erlbaum Press.

     Modular genetic architecture of floral morphology in Nicotiana?: quantitative
    genetic and

    comparative phenotypic approaches to floral integration. Bissell, E. K., & Diggle,
    P. K.

    (2010) vol.23, 1744–1758. J. Evol. Biology. https://doi.org/10.1111/j.1420-

    9101.2010.02040.x

     The First 50 Plant Genomes. Michael, T. P., & Jackson, S. (2013).

    https://doi.org/10.3835/plantgenome2013.03.0001in

     A broader view for plant evodevo: novel approaches for diverse model systems.
    Stilio, V.

    S. Di, Melzer, R., & Hall, J. C. (n.d.). (2017). Frontiers in Plant Science.

    https://doi.org/10.3389/978-2-88945-153-1

     Early inflorescence development in the grasses (Poaceae ). Whipple, C. J., Doust,
    A. N., &

    Endress, P. K. (2013). 4(July), 1–16. https://doi.org/10.3389/fpls.2013.00250'
  course: 'O programa está dividido em 4 blocos. O primeiro serve para definir os
    mecanismos básicos de como se

    organizam e comunicam as células entre si para formar padrões de desenvolvimento
    específicos. O segundo

    exemplifica os processos de desenvolvimento embrionário e pós-embrionário de 3
    diferentes organismos

    modelo. O terceiro bloco mostra diferentes processos moleculares que se estabelecem
    na formação de

    diferentes sistemas e orgãos, e como eles se conservam na natureza. O último bloco
    encadeia os conceitos

    acima descritos, dentro de uma visão evolucionista, que permite entender a evolução
    molecular, morfológica

    e das espécies a diferentes níveis, e como estes se relacionam com os processos
    adaptativos e especiativos.'
  course_name: 'CEN0448 - Biologia do Desenvolvimento e EVO-DEVO

