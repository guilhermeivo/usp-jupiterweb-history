  course: '1- Ciclo hidrológico

    2- Ciclos biogeoquímicos: carbono, nitrogênio e fósforo

    3- Mudanças no uso e cobertura do solo

    4- Mudanças climáticas.

    5- Mudanças nos padrões de produção e consumo nas sociedades atuais

    6- O antropoceno

    7- Alterações no ciclo hidrológico causadas pelas mudanças globais

    8- Alterações nos ciclos biogeoquímicos causadas pelas mudanças globais

    9- Efeito das mudanças globais sobre serviços ambientais

    10- Estratégias de mitigação e adaptação as mudanças climáticas'
  course_name: 'CEN0146 - Mudanças Globais e o Antropoceno

    Biosphere and Global Change'
