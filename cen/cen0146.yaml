  objectives: 'O objetivo do curso é explorar como as mudanças globais, principalmente
    mudanças no clima e no

    uso do solo, estão alterando a estrutura e o funcionamento de ecossistemas aquáticos
    e terrestres e

    consequentemente afetando as diversas formas de vida no planeta.'
