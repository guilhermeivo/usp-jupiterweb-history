  course: Noções básicas sobre entomologia, noções sobre criação de insetos em meios
    artificiais, métodos de marcação de insetos, histórico e conceitos básicos das
    radiações ionizantes, noções sobre proteção radiológica, fontes de radiação ionizante
    utilizadas, radionuclídeos utilizados em entomologia, cuidados gerais para o manuseio
    de radionuclídeos em laboratório, efeitos das radiações nos insetos, determinação
    de doses letais e esterilizantes para insetos praga, tratamento quarentenário
    e desinfestação de produtos armazenados por radiação.
  course_name: 'CEN0364 - Radioisótopos em Entomologia

    Radioisotopes in Entomology'
