  course: Noções básicas sobre entomologia, histórico da entomofagia nas diferentes
    civilizações, conteúdo nutricional das diferentes espécies, insetos como ingredientes
    na indústria alimentícia, utilização de insetos na indústria de rações para animais,
    noções sobre domesticação e criação de insetos em meios artificiais, tecnologias
    para produção em larga escala de insetos (principalmente Musca domestica, Hermetia
    illucens, Tenebrio spp., grilos e Galleria mellonella), aspectos regulatórios,
    de segurança alimentar e microbiológicos relativos à entomofagia.
  course_name: 'CEN0430 - Insetos Comestíveis

    Edible Insects'
  deactivation: 31/12/2023
  instructors: 3705273 - Thiago de Araújo Mastrangelo
  lecture_credits: '4'
  objectives: Oferecer aos alunos de Ciências Biológicas, Ciências dos Alimentos,
    Engenharias Agronômica e Florestal, conhecimentos básicos sobre a utilização de
    insetos na alimentação humana e como ração para animais.
  practical_credits: '0'
  total_workload: 60 h
