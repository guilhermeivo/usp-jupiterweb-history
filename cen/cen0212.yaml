  course: '3.1 Conceito de implicações ecológicas da poluição. Relação dose-resposta,
    influência de fatores ecológicos e efeitos tóxicos, métodos analíticos para detectar
    poluentes. Monitoramento de poluentes.

    3.2 Tipos de poluentes.

    3.3 Poluição acidental. Poluição industrial. Causas da poluição.

    3.4 Danos causados pela poluição nos ecossistemas.

    3.5 Poluentes que afetam os ecossistemas Marinhos e Continentais. Poluentes de
    Agrossistemas, poluentes atmosféricos e poluentes da hidrosfera. Compostos organohalogenados,
    organoclorados, metais e poluição nuclear.

    3.6 Remediação e biorremediação de ambientes poluídos, técnicas e organismos utilizados.

    3.7 Conceitos sobre desenvolvimento sustentável.'
  course_name: 'CEN0212 - Poluição dos Ecossistemas Terrestres, Aquáticos e Atmosféricos

    Pollution of Terrestrial, Aquatic and Atmospheric Ecosystems'
  deactivation: ''
  instructors: 54115 - Plinio Barbosa de Camargo
  lecture_credits: '4'
  objectives: Noções do Ambiente como um todo. O que é poluição, como ocorre e o que
    afeta no ambiente terrestre, aquático e atmosférico.
  practical_credits: '1'
  total_workload: 90 h
