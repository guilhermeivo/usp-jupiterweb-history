  course: ':   A paleobiologia desde o Arqueano, com ênfase ao período Quaternário.
    Mudanças da fauna e da flora. Métodos biológicos e isotópicos. Áreas de estudo
    de pesquisas paleoecológicas. Estudos lacustres e de solos no Brasil e dinâmica
    de paleovegetações associada a trocas paleoclimáticas'
  course_name: 'CEN0310 - Paleobiologia

    Paleobiology'
  deactivation: ''
  instructors: 2084360 - Luiz Carlos Ruiz Pessenda
  lecture_credits: '4'
  objectives: Fornecer aos estudantes do curso de Biologia, noções básicas sobre Paleontologia
    e a evolução humana e florística antes e no Quaternário; apresentar as modificações
    ocorridas na fauna e principalmente na flora no Brasil no Quaternário tardio com
    inferências paleoclimáticas, enfatizando conceitos básicos de paleontologia nas
    aulas iniciais. Mostrar a potencialiadade dos estudos interdisciplinares e o emprego
    de técnicas como a palinologia de sedimentos lacustres e os isótopos do carbono
    do solo e das plantas, nos estudos de reconstrução paleoambiental relativos á
    vegetação e clima. Aulas práticas envolvendo as técnicas utilizadas serão efetuadas.
  practical_credits: '2'
  total_workload: 120 h
  type: Semestral
