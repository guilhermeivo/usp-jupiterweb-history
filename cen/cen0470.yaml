  course: 'Fundamentos de segurança envolvendo: aspectos gerais de segurança em laboratórios;
    uso de equipamentos de proteção individual e coletiva; procedimentos para contenção
    de derramamentos com químicos; incompatibilidades química. Legislação aplicada
    às atividades em laboratórios de ensino e pesquisa. Toxicologia de produtos químicos
    (principais índices toxicológicos, segurança ocupacional), principais vias de
    absorção de produtos químicos, substâncias carcinogênicas, teratogênicas, mutagênicas,
    alergênicas. Implementação de Programa de gerenciamento de resíduos químicos:
    Parte preparatória (a instituição); Parte Preliminar (inventário do passivo, com
    caracterização e quantificação; obtenção do CADRI (Certificado de Aprovação para
    Destino de Resíduos industriais); Identificação do ativo; controle de estoque
    e segregação dos resíduos gerados em classes; Ações Permanentes (evitar geração,
    minimizar a geração, fichas de dados de produtos perigosos, rotulagem, normas
    para recolhimento de resíduos e métodos de tratamento). Métodos de reaproveitamento
    de resíduos (reciclagem, recuperação e reuso) e de tratamento (químico, físico,
    físico-químico, biológicos e térmicos). Disposição final de resíduos perigosos.
    Métodos de produção e controle da qualidade química e biológica de água desionizada
    em programa de gerenciamento de água e energia em laboratórios de ensino e pesquisa
    e indústrias.'
  course_name: 'CEN0470 - Introdução ao gerenciamento de resíduos químicos

    Chemical Waste Management'
  deactivation: ''
  instructors: 52590 - Jose Albertino Bendassolli
  lecture_credits: '4'
  objectives: Permitir aos alunos uma postura profissional responsável com relação
    ao manuseio, reaproveitamento e descarte de resíduos perigosos alinhados com a
    conservação do meio ambiente. Possibilitar os conhecimentos necessários de segurança
    com químicos bem como todos os conceitos e escalas de prioridades em um programa
    de gerenciamento de resíduos e águas servidas. Estudar-se-á todas as interfaces
    que envolvem o correto gerenciamento de resíduos e sua geração até a sua disposição
    ou tratamento final.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
