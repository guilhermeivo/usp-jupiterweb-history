courses:
  activation: 01/01/2024
  assessment: Prova teórica envolvendo todo o conteúdo da disciplina.
  bibliography: 'George, E. F.; Hall, M. A.; Klerk, G. J. 2008. Plant Propagation
    By Tissue Culture. 3rd ed. Springer, Dordrecht. v. 1.

    Junghans, T. G.; Souza, A. S. 2009. Aspectos Práticos da Micropropagação de Plantas.
    Embrapa, Brasilia, v. 1. 385 p.

    Torres, A. C.; Caldas, L.S. & Buso, J. A. 1998. Cultura de Tecidos e Transformação
    genética de Plantas. Embrapa, Brasília, v.1. 509 p.

    Torres, A. C. ; Caldas, L.S. & Buso, J.A. 1998. Cultura de Tecidos e Transformação
    Genética de Plantas. Embrapa, Brasília, v.2. 864 p.

    Trigiano, R.N. & Gray, D.J. 2000. Plant Tissue Concepts and Laboratory Exercises.
    2nd edition. CRC Press, p. 454.'
  course: '• Histórico do cultivo in vitro; • Infraestrutra do laboratório de cultura
    de tecidos vegetais; • Função dos

    nutrientes no desenvolvimento vegetal com ênfase na cultura de tecidos; • Meios
    de cultura; • Tipos de

    explantes; • Morfogênese vegetal e reprodução; • Métodos de assepsia; • Contaminação
    in vitro; • Cultivo in vitro de espécies de importância econômica, incluindo espécies
    ornamentais, fruteiras e florestais; • Métodos de cultivo in vitro aplicados à
    propagação vegetal; • Enxertia in vitro e limpeza viral; • Variação somaclonal;
    • Uso do cultivo in vitro para estudos de desenvolvimento e fisiologia vegetal;
    • Produção comercial de plantas utilizando o cultivo in vitro e biofábricas; •
    Métodos de cultivo in vitro aplicados ao melhoramento de espécies vegetais, incluindo
    técnicas como cultura de protoplastos, cultura de anteras, produção de híbridos
    somáticos, produção de haplóides e transformação genética de plantas; • Substratos
    e aclimatização de plantas; • Regulamentação em biotecnologia de plantas; • Legislação
    federal para a produção e comercialização de sementes e mudas; • Visita técnica
    a empresa que empregue técnicas de biotecnologia vegetal em suas atividades; •
    Visita técnica a empresa que utilize técnicas de cultivo in vitro para a propagação
    de plantas.'
  course_name: 'CEN0001 - Cultura de Tecidos Vegetais

    Plant Tissue Culture'
  deactivation: ''
  instructors: '2798025 - Adriana Pinheiro Martinelli

    724780 - José Lavres Junior

    1412186 - Paulo Hercílio Viegas Rodrigues'
  lecture_credits: '4'
  objectives: 'Proporcionar aos estudantes de Engenharia Agronômica, Engenharia Florestal
    e Ciências Biológicas

    conhecimentos básicos sobre técnicas de cultura de tecidos vegetais, com ênfase
    em aulas práticas onde os

    estudantes poderão manipular o material cultivado in vitro.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
