  course: 'Aulas teóricas: Histórico do cultivo in vitro, importância do cultivo in
    vito para espécies de importância econômica e ambiental, panorama da produção
    de plantas in vitro com ênfase em espécies ornamentais, fruteiras e florestais.
    Organização de um laboratório de cultura de tecidos. Tipos de explantes e meios
    de cultura. Contaminação in vitro. Métodos de cultivo in vitro de plantas e suas
    aplicações na propagação e no melhoramento de plantas. Limpeza de vírus. Uso do
    cultivo in vitro para estudos de desenvolvimento e fisiologia vegetal. Variação
    somaclonal. Cultivo in vitro e manipulação genética de plantas. Aclimatação de
    plantas. Produção comercial de plantas utilizando o cultivo in vitro e biofábricas.

    Aulas Práticas: Uso de equipamentos (balança, pHmetro, microscópio estereoscópico,
    autoclave, estufa, fluxo laminar), preparo de soluções-estoque,  preparo e esterilização
    de meios  de cultura, introdução e subcultivo de material in vitro, aclimatação
    de plantas. Visitas práticas a laboratórios comerciais de plantas cultivadas in
    vitro .'
  course_name: 'CEN0001 - Cultura de Tecidos Vegetais

    Plant Tissue Culture'
  deactivation: ''
  instructors: '2798025 - Adriana Pinheiro Martinelli

    724780 - José Lavres Junior

    1412186 - Paulo Hercílio Viegas Rodrigues'
  lecture_credits: '4'
  objectives: Fornecer aos alunos de Engenharia Agronômica e Florestal conhecimentos
    básicos das técnicas de cultura de tecidos vegetais, com ênfase nas aulas práticas
    onde os alunos terão oportunidade de manusear o material cultivado in vitro.
