  course: Apresentação do uso da energia nuclear e técnicas correlatas como ferramentas
    para estudos dos processos biológicos, responsáveis pelo crescimento, reprodução
    e produção em diferentes tipos de animais domésticos. Em nutrição animal é discutida
    a utilização de traçadores radioativos (3H, 45Ca, 14C, 51Cr, 32P, 35S) e não radioativos
    (15N, 13C) na compreensão do processo de digestão e da síntese microbiana no rumem
    dos animais, o uso das radiações X e ? no aumento da digestibilidade de alimentos
    fibrosos e o uso dos radioisótopos como ferramentas nos estudos de absorção real
    de minerais. Em reprodução animal, é discutido o uso dos traçadores 3H e 125I
    para determinação de hormônios através de radioimunoanálise, visando a monitoração
    das funções reprodutivas de fêmeas de interesse doméstico. No campo da saúde animal
    são discutidos os usos dos radioisótopos para traçar o caminho e a ação de medicamentos
    no hospedeiro e parasito; avaliar o efeito do parasito sobre o metabolismo da
    água no hospedeiro; e como os raios ? e X têm sido utilizados para atenuar patógenos
    e produzir vacinas seguras e eficientes.
