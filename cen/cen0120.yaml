    Literatura Complementar:

    Textos selecionados cobrindo tópicos específicos'
  course: '1. Introdução à bioquímica, conceitos gerais e sua inserção na gestão e
    ciências ambientais

    2. Interações não covalentes e interações intra- e intermoleculares. Propriedades
    da água.

    3. Quiralidade e sua importância para biomoléculas.

    4. Proteínas: aminoácidos, peptídeos, estrutura tridimensional de proteínas. Funções
    de proteínas.

    5. Enzimas: classificação, cinética e mecanismos de ação. Regulação de atividade.

    6. Carboidratos: classificação, estrutura, propriedades e funções

    7. Lipídeos: classificação, estrutura, propriedades e funções

    8. Membranas biológicas: estrutura e transporte de solutos

    9. Transporte de elétrons e quimiosmose em cloroplastos e mitocôndrios

    10. Espécies reativas de oxigênio e metabolismo antioxidante

    11. Introdução e visão geral do metabolismo

    12. Metabolismo oxidativo: glicólise, ciclo de Krebs e via das pentoses-fosfato

    13. Ciclo de Calvin. Vias C3 e C4 e adaptação ambiental.

    14. Noções e conceitos básicos de toxicologia.

    15. Tópicos em bioquímica ambiental'
  course_name: 'CEN0120 - Princípios de Bioquímica

    Principles of Biochemistry'
  deactivation: ''
  instructors: 60172 - Victor Alexandre Vitorello
  lecture_credits: '2'
  objectives: Aprendizado da estrutura, propriedades e interações entre biomoléculas
    visando a compreensão dos processos biológicos ao nível molecular. Entender os
    principais processos bioquímicos de importância biológica. Discutir a relação
    dos tópicos examinados com questões ambientais, principalmente por meio de exemplos.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
