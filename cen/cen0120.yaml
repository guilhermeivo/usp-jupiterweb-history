    1312 pg.

    Bioquímica fundamental. 2011. John L. Tymoczko; Jeremy M. Berg; Lubert Stryer;
    1a. ed. Rio de Janeiro:

    Guanabara Koogan, 780 pg.

    Fundamentos de bioquímica: a vida em nível molecular. 2014. Voet, D.; Voet, J.G.;
    Pratt, C.W. Porto Alegre,

    Ed. Artmed, 4ª ed, 1167 pg.

    Bioquímica Básica. 2015. Anita Marzzoco; Bayardo B. Torres; 4a. ed. Guanabara
    Koogan, 404 pg.

    Bioquímica. 2021. Jeremy M. Berg, John L Tymoczko; Gregory J Gatto Jr.; Lubert
