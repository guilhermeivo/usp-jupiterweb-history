  course: '- As radiações ionizantes: radiações alfa, beta, gama, RX e nêutrons;

    - Interações da radiação com a matéria: efeito fotoelétrico, Compton, formação
    de pares

    - Radiólise da água e sua importância nos seres vivos;

    - Ação das radiações nas macromoléculas de importância biológica: proteínas, ácidos
    nucléicos;

    - Irradiação da célula. Efeitos nos organelas e no núcleo;

    - Exposição aguda à radiação. Efeitos nos sistemas digestivo, nervoso, circulatório;

    - Radiação e terapia. Radioprotetores e radiosensibilizadores químicos;

    - Radiação e carcinogênes.'
  course_name: 'CEN0350 - Radioisótopos e Efeitos Biológicos da Radiação nos Animais

