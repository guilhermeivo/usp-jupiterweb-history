  course: "Conteúdo:\nTema 1 - A metodologia isotópica, fracionamento isotópico e\
    \ nomenclatura.\nTema 2 - O ciclo global do carbono (C) (visão isotópica).\n1.\
    \ Os maiores reservatórios de carbono\n2. Fluxo de carbono entre os reservatórios\n\
    3. O carbono perdido - the missing carbon\n4. Tendências temporais no ciclo do\
    \ carbono\n5. Os isótopos estáveis e o ciclo do carbono\nTema 3 - O ciclo global\
    \ do nitrogênio (N) (visão isotópica).\n1.\tOs maiores reservatórios de nitrogênio\n\
    2.\tFluxo de nitrogênio entre os reservatórios\n3.\tTendências temporais no ciclo\
    \ do nitrogênio\n4.\tPerturbações devido à atividade humana\nTema 4 - Ciclo da\
    \ água (visão isotópica).\nTema 5 - Variação isotópica do carbono, nitrogênio,\
    \ oxigênio e deutério na atmosfera e suas aplicações em estudos ecológicos, ambientais\
    \ e de agroecossistemas.\nTema 6 - Variação isotópica do carbono, nitrogênio,\
    \ oxigênio e deutério nas plantas e suas aplicações em estudos ecológicos, ambientais\
    \ e de agroecossistemas.\nTema 7 - Variação isotópica do carbono, nitrogênio,\
    \ oxigênio e deutério nos ambientes aquáticos e suas aplicações em estudos ecológicos,\
    \ ambientais e de agroecossistemas.\nTema 8 - Variação isotópica do carbono, nitrogênio\
    \ em solos e suas aplicações em estudos ecológicos, ambientais e de agroecossistemas.\n\
    Tema 9 - Variação isotópica do carbono, nitrogênio em cadeias tróficas e suas\
    \ aplicações em estudos ecológicos, ambientais e de agroecossistemas.\nTema 10\
    \ - Aplicações práticas de isótopos estáveis em estudos de: nutrição animal, paleoecologia,\
    \ qualidade de alimentos e bebidas."
