  course: '3-  PROGRAMA  ANALÍTICO: O cliclo da vida. Definição dos reservatórios
    da hidrosfera e dinâmica da água. Fatores climáticos associados a deriva continental.
    Influência das flutuações climáticas globais e regionais. Modelos de evaporação
    e drenagem. Uso de bacias hidrográficas em estudos hidrogeoquímicos. Parâmetros
    hidrológicos principais. Separação de hidrogramas de cheia. Modelos regionais
    de evaporação e vapotranspiração. Transporte fluvial de material particular. Técnicas
    de amostragens de sedimentos. Mecanismos de Erosão mecânica global e regional.
    Hidroquímica fluvial. Transporte de material fluvial dissolvido, incluindo modelos
    de transporte.  Estudos dos aportes atmosféricos totais e correção na carga dissolvida
    fluvial.Consumo de CO2 atmosférico/solo durante o processo de alteração de rochas
    em bacias hidrográficas. Modelos geoquímicos de alteração de rochas silicatadas,
    carbonatadas e evaporíticas. Balanço de erosão mecânica e química. Técnicas de
    especiação de metais pesados e terras raras em sedimentos fluviais no estudo da
    biodisponibilidade dessas espécies químicas. Uso da técnica de sulfetos voláteis
    ácidos.  Emprego de técnicas isotópicas em problemas ambientais específicos. Estudo
    de casos.'
  course_name: 'CEN0150 - Hidrogeoquímica de Bacias Hidrográficas

    River Basin Hydrogeochemistry'
  deactivation: ''
  instructors: 2084356 - Luiz Antonio Martinelli
  lecture_credits: '2'
  objectives: '2.  OBJETIVOS:   Proporcionar aos alunos um conhecimento mais aprofundado
    sobre a versatilidade dinâmica das bacias de drenagem face aos principais parâmetros
    hidrogeoquímicos tanto em ecossistemas naturais como alterados e suas contribuições
    para o estudo do transporte de material particulado e dissolvido para  os oceanos,
    identificando as influências hidroclimáticas e antropogênicas no balanço global
    da erosão.'
  practical_credits: '1'
  total_workload: 60 h
