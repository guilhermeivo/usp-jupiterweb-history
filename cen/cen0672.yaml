  course: '1 Processo evolutivo: Populações, espécies e evolução; Adaptação a pressões
    antrópicas;

    2 Processos amostrais: Abordagem experimental (teste de hipóteses e delineamento
    amostral); Metodologia amostral de mamíferos e aves;

    3 Processos individuais: Sistemas de acasalamento, cuidado parental e uso do espaço
    (dispersão, movimento e migração);

    4 Processos populacionais: Natalidade e mortalidade; Distribuição etária e fecundidade;
    Modelos de crescimento populacional; Abordagem metapopulacional;

    5 Manejo de populações: Conservação biológica, controle de pragas, uso sustentável
    e monitoramento.'
  course_name: 'CEN0672 - Ecologia de Populações

    Ecology and Management of Vertebrates'
  deactivation: ''
  instructors: 1097780 - Luciano Martins Verdade
  lecture_credits: '5'
  objectives: Apresentar aos estudantes a base conceitual sobre ecologia de populações,
    incluindo processos evolutivos e individuais que determinem padrões de estrutura
    e dinâmica populacionais, e discutir limitações quanto à inovação tecnológica
    e de governança que limitem o manejo da fauna e flora ao nível populacional, incluindo
    a conservação biológica, controle de espécies danosas, uso sustentável e monitoramento.
  practical_credits: '1'
  total_workload: 105 h
  type: Semestral
