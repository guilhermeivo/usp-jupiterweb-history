courses:
  activation: 01/01/2023
  assessment: Prova escrita englobando o conteúdo total do programa da disciplina.
  bibliography: 'Literatura Básica:

    Artigos científicos recentes sobre o tema e material didático a ser distribuído
    no e-disciplinas.'
  course: 'Definição dos conceitos de saúde e qualidade de vida através de estudos
    sobre subnutrição e desenvolvimento de doenças. Interrealções entre genética,
    ambiente, alimentação, hábitos e patógenos com qualidade de vida e saúde. Fatores
    genéticos e epigenéticos que influenciam relações metabólicas do organismo (ex.
    mal-nutrição durante o período da segunda guerra mundial e descoberta de desvios
    metabólicos nas gerações seguintes que levaram a descoberta da epigenética). Qualidade
    dos alimentos, contaminantes, toxinas alimentares e fungos produzidos na estocagem
    alimentar. Compostos alergênicos. Transgênicos na alimentação animal e humana.
    Boas e más práticas agrícolas e a relação com o acúmulo de subprodutos de fertilizantes,
    pesticidas e herbicidas nos alimentos. Mudanças metabólicas induzidas: Casos de
    Doping, dependências físicas e dependências virtuais. Abuso de

    medicamentos. Descobertas recentes das relações entre microbioma intestinal e
    sistema imunológico. A importância do sono na regulação dos níveis de estresse
    e metabolismo e da atividade física na regulação hormonal. Pandemia e qualidade
    de vida.'
  course_name: 'CEN0360 - Qualidade de Vida e Saúde

    Life Quality and Health'
  deactivation: 31/12/2024
  instructors: '453826 - Ernani Pinto Junior

    9502695 - Francisco Scaglia Linhares'
  lecture_credits: '2'
  objectives: Proporcionar noções básicas de saúde e qualidade de vida, apresentando
    diferentes inter- conexões entre alimentação, alergênicos, contaminantes, toxinas
    e tipos de alimentos com microbioma intestinal, fisiologia humana e sistema imunológico.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
