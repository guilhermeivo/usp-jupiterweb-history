  course: '1- Estrutura da Terra: conceitos sobre geosfera, hidrosfera, atmosfera,
    criosfera e biosfera

    2- Funcionamento da Terra e a Teoria de Gaia

    3- O Sol: fonte fundamental de energia, origem da radiação solar e leis da radiação

    4- Transformações da energia solar, fotossíntese, transpiração, evaporação e aquecimento

    5- Balanço global de radição e redistribuição da energia global

    6- Efeito estufa, causas naturais e antrópicas, o papel da matriz energética e
    das mudanças no uso e cobertura do solo, especialmente agricultua e desmatamento,
    modelos de previsão do clima

    7- Ações mitigadoras, Protocolos de Montreal e Kyoto

    8- Gestão sustentada dos recursos naturais em termos energéticos e suas nuances'
  course_name: 'CEN0107 - Energia e Biosfera

    Energy and Biosphere'
  deactivation: ''
  instructors: 3210215 - Alex Vladimir Krusche
  lecture_credits: '2'
  objectives: Para gerir de o ambiente de forma adequada é necessário conhecer, profundamente,
    as consequências das ações humanas (individuais e coletivas) para a sobrevivência
    da demais espécies. O diagnóstico, planejamento, manejo e manutenção do ambiente
    natural requerem conhecimentos dos possíveis destinos da energia solar captada
    pelo sistema Terra, fator limitante primário do funcionamento dos ecossistemas.
    O ambiente natural resulta de infinitas interações a que nos submetemos a cada
    instante e que determinam a direção e intensidade dos fluxos de energia. Apresentar
    visões cinetíficas sobre os acontecimentos naturais, os aspectos temporais desses
    acontecimentos e as mudanças intensionais que impomos à paisagem são os objetivos
    deste curso.
  practical_credits: '0'
