  course: 'I. Introdução

    I.1. Ecossistemas: histórico, conceitos.

    I.2. Principais tipos de ecossistemas naturais, ecossistemas brasileiros (biomas).

    II. Estrutura e Dinâmica dos Ecossistemas

    II1. Termodinâmica. Fluxos de energia.

    II2. Níveis tróficos, cadeia alimentar, teia alimentar. Pirâmides ecológicas,
    espécies chaves.

    II.3. Produção primária e secundária, decomposição.

    II.4. Ciclos Biogeoquímicos.

    II.5. Sucessão Ecológica, fases sucessionais, sucessão primária e secundária.

    II.6 Clímax e equilíbrio, mecanismos homeostáticos.

    III. Aspectos Aplicados

    III.1. Interferência antrópica: ecossistemas urbanos e agrícolas, poluição, mudanças
    climáticas globais.

    III.2. Manejo e conservação de ecossistemas. Restauração de ecossistemas degradados.'
  course_name: 'CEN0110 - Ecologia de Ecossistemas

    Ecosystems Ecology'
  deactivation: ''
  instructors: '2084356 - Luiz Antonio Martinelli

    54115 - Plinio Barbosa de Camargo'
  lecture_credits: '4'
  objectives: '1. Oferecer o conhecimento básico sobre ecologia de ecossistemas, através
    de conceitos

    fundamentais, a sua origem, sua evolução e aplicações nas questões ambientais.

    2. Proporcionar o entendimento sobre a organização da biosfera ao nível de ecossistemas.

    3. Compreender aspectos relacionados à estrutura e dinâmica dos ecossistemas.

    4. Oferecer bases para a compreensão e interpretação das consequências da ação
    humana e efeitos das mudanças globais sobre  os ecossistemas.

    5. Proporcionar embasamento teórico com relação a aspectos aplicados como manejo
    e

    conservação de ecossistemas.'
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
