  course: 'As origens das propriedades dos nanomateriais. Principais métodos de síntese
    de nanomateriais: sol-gel, solvotérmico, e precipitação. Principais técnicas de
    caracterização de nanomateriais: Microscopias eletrônicas, microscopia de força
    atômica, espalhamento de luz e métodos que empregam raios X. Estratégias de desenvolvimento
    de nanomateriais por biomimetismo. Toxicidade e riscos associados aos nanomateriais.
    Nanomateriais e nanotecnologias na liberação de substâncias químicas como fertilizantes,
    defensivos e fragrâncias. Nanomateriais e nanotecnologias na remediação ambiental:
    adsorção e degradação fotocatalítica de contaminantes. Catálise heterogênea e
    energias renováveis. Nanomateriais e nanotecnologias para coleta, purificação
    de água e irrigação. Nanocompósitos na embalagem e conservação de alimentos. Biossíntese
    de nanomateriais. Nanomateriais na nutrição mineral de plantas.'
  course_name: 'CEN0370 - Nanotecnologia na Agricultura, Meio Ambiente e Ciência dos
    Alimentos

    Nanotechnology in Agriculture, Environment and Food Science'
  deactivation: ''
  instructors: '9433952 - Flavia Vischi Winck

    6390741 - Hudson Wallace Pereira de Carvalho'
  lecture_credits: '3'
  objectives: Através de uma abordagem teórico-prática o curso se propõe a discutir
    as relações entre estrutura e propriedades da matéria. Objetiva-se introduzir
    os principais métodos de síntese e caracterização de nanomateriaism, assim como
    construir dispositivos e realizar experimentos que permitam explorar as atuais
    e potencias aplicações da nanotecnologia na agricultura e ambiente.
  practical_credits: '0'
  total_workload: 45 h
  type: Semestral
