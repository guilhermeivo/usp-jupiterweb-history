  course: "Introdução e definições de Ecologia da paisagem\nDesenvolvimento histórico\
    \ - Aplicações da Ecologia da paisagem. Definições, fundamentos e terminologia\
    \ em Ecologia da Paisagem - Características da paisagem: estrutura, função e mudança\
    \ - Padões e heterogeneidade -Mosaicos, fragmentos, corredores e matrizes - Fragmentação\
    \ e fragmentos. Escalas e hierarquia em paisagens -Escalas e técnicas de escalonamento.\
    \ Agentes causadores do padrões -Fatores físicos (clima e gemorfologia) -Formas\
    \ e posição da paisagem - Processos bióticos -Regimes de perturbação (Mudanças\
    \ e escalas temporais de longa duração; Uso do solo -paisagens sociais e culturais).\
    \ Dados de paisagens e análise quantitativa - Sistemas de Informações Geográficas\
    \ e paisagens: introdução à análise espacial -Sensoriamento remoto em Ecologia\
    \ da Paisagem -Dados sociais e culturais em Ecologia da Paisagem -Fontes de erros\
    \ em dados da paisagem e sua análise. Quantificação dos padrões da paisagem: Interação\
    \ de agentes causadores dos padrões e estratégias de análise -Porque e como quantificar\
    \ padrões da paisagem - Regras de interpretação de métricas da paisagem - Uso\
    \ de modelos em em Ecologia da Paisagem: Introdução. Dinâmica dos padrões - Mudanças\
    \ ecológicas\n- Modelos ecológicos - Dinâmica da paisagem - Modelagem das mudanças\
    \ na paisagem. Processos, padrões e aplicações em Ecologia da Paisagem  - O papel\
    \ da distribuição em paisagens: dinâmica espacial das perturbações - Perturbação,\
    \ equilíbrio e escalonamento de paisagens - Produtividade e dinâmica de nutrientes\
    \ em paisagens - Interações terra-água: hidrologia e paisagens; controles da paisagem\
    \ na qualidade das águas superficiais - Conectividade e fragmentação: efeitos\
    \ nos organismos; biodiversidade e manejo de paisagens - Sucessão como um processo\
    \ espacial em paisagens -\tSustentabilidade e manejo de paisagens - Monitoramento\
    \ de paisagens - Análise de risco- Manejo adaptativo - Recuperação de paisagens\
    \ - Variabilidade natural, incertezas científicas e manejo de paisagens."
  course_name: 'CEN0628 - Ecologia da Paisagem

    Landscape Ecology'
  deactivation: ''
  instructors: 2300606 - Maria Victoria Ramos Ballester
  lecture_credits: '3'
  objectives: O objetivo deste curso é o de explorar os conceitos, métodos e aplicações
    da ecologia da paisagem, os quais serão utilizados como um arcaboço para pesquisa,
    análise e manejo de paisagens ( solução de problemas). As atividades serão desenvolvidas
    através de 1- aulas teóricas ; 2- leitura e discussão de literatura representativa
    do estado da arte na pesquisa na área; 3- resolução de exercícios desenhados para
    fornecer experiência com algumas ferramentas quantitativas e 4- desenvolvimento
    de projetos de pesquisa.
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
