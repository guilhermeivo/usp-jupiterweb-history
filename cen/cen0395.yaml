  course: 'A nutrição mineral de plantas e sua relação com o desenvolvimento vegetal.
    O solo como fornecedor de nutrientes aos vegetais. Os elementos essenciais, os
    elementos úteis/benéficos e os elementos tóxicos. A absorção, o transporte e a
    redistribuição dos elementos essenciais, úteis e tóxicos. Os macronutrientes e
    suas funções.  Os micronutrientes e suas funções. Efeitos dos elementos úteis
    e tóxicos. Genômica, Ionômica, Biologia Molecular e Nutrição de Plantas.

    The mineral nutrition of plants and its relationship with plant development. The
    soil as a supplier of nutrients to plants. The essential elements, the beneficial
    elements and toxic elements. The uptake, translocation and redistribution of essential
    (nutrients), beneficial and toxic elements. Macronutrients and its functions.
    Micronutrients and its functions. Effects of beneficial and toxic elements in
    plant growth and development. Genomics, Ionomics, Molecular Biology and Plant
    Nutrition.'
  course_name: 'CEN0395 - Introdução a Nutrição Mineral de Plantas

    Introduction to Plant Mineral Nutrition'
  deactivation: ''
  instructors: '180162 - Cassio Hamilton Abreu Junior

    724780 - José Lavres Junior'
  lecture_credits: '2'
  objectives: 'Abordar em visão geral, para os alunos do curso de Ciências Biológicas,
    os principais aspectos da Nutrição Mineral de Plantas como, as funções dos nutrientes
    (macro e micronutrientes) no metabolismo vegetal, bem como estudar a relação entre
    a disponibilidade de nutrientes no substrato com a fisiologia da planta e a expressão
    de genes associados ao transporte e redistribuição no tecido vegetal. Desenvolver
    uma abordagem clara considerando a importância do suprimento adequado dos nutrientes
    aos vegetais visando à produção de alimentos, a qualidade do produto agrícola
    e a conservação do solo, da água e dos ecossistemas.

    Approach on overview of the main aspects of the Mineral Nutrition of Plants such
    as functions of nutrients (macro and micronutrients) in plant metabolism and to
    study the relationship between nutrient availability and the plant physiology
    as well as the expression of genes as related to nutrient translocation and its
    redistribution in plant tissue. Develop a clear approach considering the importance
    of adequate supply of nutrients to plants aiming to food production, agricultural
    product quality and the conservation of soil, water and ecosystems.'
  practical_credits: '2'
  total_workload: 90 h
  type: Semestral
