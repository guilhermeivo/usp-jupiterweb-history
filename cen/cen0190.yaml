  course: 'Uso de sistemas de informações geográficas para análise ambiental e manejo
    de recursos naturais; Revisão dos conceitos: representação gráfica do espaço ao
    longo da civilização humana; Definição, epistemiologia e características dos sistemas
    de informações; Sistemas de Informações Gegráficas: definições, origem, histórico
    e características; Componentes e Arquiteturas dos SIGs; Principais aplicações
    na área ambiental dos SIGs; Efeitos das escalas espaciais e temporais nos fatores
    estruturais e agentes modificadores dos ecossistemas; Revisão dos conceitos: mapas,
    simbologias, escalas e projeções; Estruturas presentadas no computador: sistemas
    matricial e vetorial; Dados de sensores remotos: características; Resoluções radiométrica,
    espacial e temporal; Técnicas de escalonamento; Análise e interpretação dos padrões
    espaciais dos fatores estruturais e agentes modificadores dos ecossistemas; Introdução
    à Análise Espacial; Métodos convencionais e computadorizados, vantagens e desvantagens  no
    uso de SIGs; Manejo de Dados Espaciais, Lógica Boleana, Reclassificação e auxílio
    à tomada de desições; Operadores de distância e contexto; Métodos quantitativos
    de análise dos fatores estruturais (topografia, drenagem, solos e clima) e do
    uso e cobertura do solo; Efeitos espacias e temporais das mudandaças do uso e
    cobertura do solo na estrutura e funcinamento de ecossitemas; Análise integrada
    de ecossistemas por técnicas de geoprocessamento; Desenho e implementação de bancos
    de dados georeferenciados para o planejamento ambiental; Desenho e implamentação
    de um projeto; Definição e adquisição do Sistema de Informações Geográficas: diretrizes
    gerais; Estrutura e elaboração do banco de dados: localização, adquisição e conversão
    de dados; elaboração  e manutenção do banco de dados digital georefenciado; Manipulação
    dos dados  e análise dos resultados; Exemplos de estudos sobre o uso de SIGs no
    planejamento urbano e ambiental; aplicação de conhecimentos;  Desenvolvimento
    de projetos: construção e análise de bancos de dados digitais georefenciados;
    Apresentação dos resultados dos estudos de caso'
  course_name: 'CEN0190 - Uso de Técnicas de Geoprocessamento em Estudos Ambientais

    GIS Principles and Application in Environmental Studies'
  deactivation: ''
  instructors: 2300606 - Maria Victoria Ramos Ballester
  lecture_credits: '3'
  objectives: O objetivo deste curso é o de explorar e integrar os princípios e conceitos
    de análise espacial, ecologia de sistemas e geoprocessamento no diagnóstico e
    manejo de sistemas ecológicos. Estes conhecimentos serão utilizados como um arcaboço
    para pesquisa, análise e manejo sistemas através do estudo de casos. As atividades
    serão desenvolvidas através de 1- aulas teóricas; 2- leitura e discussão de literatura
    representativa do estado da arte na pesquisa na área; 3- resolução de exercícios
    desenhados para fornecer experiência com algumas ferramentas quantitativas e 4-
    desenvolvimento de projetos de pesquisa. Este será um curso avaçado sobre estrutura,
    funcionamento e aplicações de geoprocessamento em estudos ambientais.
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
