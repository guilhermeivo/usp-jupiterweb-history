  course: 'I - revisão sobre os ciclos da água, carbono e nitrogênio

    II - conceitos básicos sobre bacias hidrográficas como modelo de estudo

    III - caracterização ambiental de bacias hidrográficas

    IV - estudos comparativos entre bacias hidrográficas de médio porte do Estado
    de São Paulo e da bacia Amazônica'
