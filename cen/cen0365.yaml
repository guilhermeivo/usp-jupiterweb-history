  course: '3-  PROGRAMA  ANALÍTICO:         (digitar em  texto  corrido)

    Conceitos básicos de Microscopia Óptica e Eletrônica; Constituição e funcionamento
    do microscópio eletrônico de transmissão e varredura; Considerações teóricas sobre
    preparo de espécimens para microscopia eletrônica de transmissão e varredura:
    Fixação de tecido, principais fixadores, propriedades, cuidados com a fixação,
    soluções tampão - propriedades; Desidratação; Inclusão dos materiais (no caso
    de ME de transmissão) uso de resinas; Secagem ao ponto crítico e metalização de
    espécimen (no caso de ME de varredura);  Preparo de materiais em suspensão para
    diagnosticar doenças de plantas (contrastação negativa) - exames ao microscópio
    de transmissão; Práticas Histológicas: preparação de materiais para exame: fixação,
    desidratação e inclusão; Preparo de tampões, soluções fixadoras, resinas; Ultramicrotomia
    - considerações teórica e prática; Preparo de secções semifinas e ultrafinas (trimagem
    dos blocos, preparação de navalhas, seccionamento dos materiais); Limpeza de lâminas
    e grades, preparo de corantes, coloração de lâminas; Exames aos microscópios óptico
    e eletrônico; Obtenção de fotomicrografias; Técnicas fotográficas e interpretação
    de fotografias.'
  course_name: 'CEN0365 - Ultra Estrutura Celular

    Cell Ultra Structure'
  deactivation: ''
  instructors: 50236 - Neusa de Lima Nogueira
  lecture_credits: '2'
  objectives: '2.  OBJETIVOS:   (digitar  em  texto  corrido)

    Capacitar o aluno para o preparo de amostras e observação aos microscópios eletrônico
    de transmissão, varredura e óptico, visando a descrição e compreensão dos processos
    biológicos através da análise de células e tecidos.'
