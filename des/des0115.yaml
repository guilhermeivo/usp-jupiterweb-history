  course: "i.\tO Estado Constitucional. A idéia de Constituição. Origens e características\
    \ do Constitucionalismo.\nii.\tO Poder Constituinte.  Poder constituinte originário\
    \ e derivado.  A reforma da Constituição.  Rigidez e flexibilidade constitucionais.\
    \ Limites ao poder de revisão.\niii.\t A garantia da Constituição. O controle\
    \ de constitucionalidade.  Origem, conceito, formas de controle. Política externa\
    \ e controle de constitucionalidade.\niv.\tO Estado Democrático de Direito. Fundamentos\
    \ da República Federativa do Brasil.  Objetivos fundamentais.\nv.\tO Estado na\
    \ Ordem Internacional. Os princípios que regem o Brasil em suas relações internacionais.\
    \ O processo de tomada de decisões no plano internacional.\nvi.\tA Separação de\
    \ Poderes. Legislativo, Executivo e Judiciário. As competências dos Poderes na\
    \ área das relações internacionais.\nvii.\tA Limitação do Poder.  O Estado de\
    \ Direito. Os Direitos Fundamentais: doutrina e evolução. Direitos e garantias\
    \ na Constituição Brasileira de 1988. A proteção internacional dos Direitos Fundamentais.\n\
    viii.\tOs Tratados Internacionais e a Constituição Brasileira. A gênese dos tratados.\
    \ O comprometimento externo do Estado. A validade interna dos tratados. Monismo\
    \ versus internacionalismo.\nix.\tTendências do Governo no Estado Contemporâneo.\
    \ Regimes políticos e  formas de Governo. A democracia.\nx.\tO Estado diante da\
    \ Globalização. O fenômeno da globalização. O Estado e as organizações internacionais.\
    \ Multilateralismo versus plurilateralismo e bilateralismo. A formação de blocos\
    \ regionais. A questão da soberania."
  course_name: 'DES0115 - Teoria do Estado II

    Theory of State II'
  deactivation: 30/01/2023
  lecture_credits: '4'
  objectives: Oferecer aos alunos conhecimentos relativos à estrutura, à organização
    do Estado e dos seus Poderes, suas competências, limites de atuação e controles
    institucionais, ao regime dos direitos fundamentais, e à sua inserção na ordem
    internacional, a partir das normas constitucionais que, no Brasil, definem a titularidade
    do poder e os modos de formação e manifestação da vontade política estatal.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
