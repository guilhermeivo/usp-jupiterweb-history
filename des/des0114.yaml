  course_name: 'DES0114 - Teoria do Estado I

    Theory of State I'
  deactivation: 31/12/2025
  instructors: '4946083 - Arthur Roberto Capella Giannattasio

    3548261 - Danielle Hanna Rached

    1016819 - Guilherme Assis de Almeida

    1518253 - Pedro Bohomoletz de Abreu Dallari

    2933193 - Yi Shin Tang'
  lecture_credits: '4'
  objectives: Apresentar noções básicas sobre o estado e seus elementos constitutivos,
    por meio da discussão de temas relacionados à sua origem, à sua organização e
    ao seu funcionamento. Abordar debates contemporâneos que reconhecem o estado como
    uma organização jurídico-política da sociedade gestada no interior da tradição
    política europeia. Tratar a invenção jurídica do estado como uma instituição de
    base para as relações internacionais. Realizar uma viagem didática em Brasília
    para visitar instituições do estado brasileiro (conforme disponibilidade e confirmação
    das instituições).
