  course_name: 'DES0114 - Teoria do Estado I

    State Theory 1'
  deactivation: ''
  instructors: 1304122 - Nina Beatriz Stocco Ranieri
  lecture_credits: '4'
  objectives: 'Esta disciplina visa oferecer aos alunos noções teóricas sobre a natureza
    e o papel do Estado, sua origem, evolução, elementos, instituições, organização
    e funcionamento.

    Objetiva-se preparar os alunos para o estudo do direito positivo e das demais
    disciplinas do curso com conhecimento básico dos componentes do Estado.

    O curso será ministrado de acordo com o programa e bibliografia anexos, desenvolvendo-se
    por meio de exposições, discussões em sala de aula, seminários e leitura de textos
    clássicos e de doutrina contemporânea.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
