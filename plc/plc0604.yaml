  objectives: Tendo como compromisso a formação de professores de ciências capazes
    de atuar de forma efetiva junto a alunos público-alvo da educação especial em
    uma perspectiva da educação inclusiva esta disciplina pretende oferecer conhecimentos
    a respeito dos fundamentos, políticas e práticas pedagógicas da educação especial.
    Apresentar tecnologias assistivas para o desenvolvimento do processo ensino e
    aprendizagem. A educação de Surdos e a Língua Brasileira de Sinais - LIBRAS
