  course_name: 'DCO0414 - Direito Empresarial II

    Business Law II'
  deactivation: ''
  instructors: 1553792 - Paula Andrea Forgioni
  lecture_credits: '2'
  objectives: A atividade do contabilista, bem como sua responsabilidade perante terceiros,
    são formatadas pelo Direito. Com esse pressuposto, o curso visa a possibilitar
    ao profissional da contabilidade o domínio dos instrumentos necessários à.compreensão
    dos princípios e regras jurídicas no que diz respeito às empresas e sua atuação
    no mercado. Como os alunos já terão noções de direito empresarial, são abordados
    tópicos mais modernos da regulação jurídica das atividades da empresa no mercado.
    O primeiro módulo destaca as sociedades anônimas abertas, o mercado de capitais
    e seus principais contratos. O segundo módulo tratará da disciplina da concorrência,
    que cada vez se consolida mais no Brasil. No terceiro, haverá o aprofundamento
    do tema da propriedade industrial e de suas consequências para a atividade dos
    contabilistas. O quarto módulo estudará as relações entre empresas e consumidores,
    enquanto o quinto trará a nova disciplina brasileira da falência e da recuperação
    de empresas. Por fim, noções sobre os procedimentos arbitrais, uma das formas
    mais usadas pelas empresas para a solução de seus conflitos no Brasil de hoje.
  practical_credits: '0'
  total_workload: 30 h
