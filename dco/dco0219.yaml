  course: "1.\tRelações entre CONTABILIDADE e DIREITO COMERCIAL\n1.1.\t Das preposições:\
    \ do guarda-livros ao contabilista\n1.2.\t Dos princípios gerais de contabilidade\
    \ e seu reflexo no direito\n1.3.\t Da responsabilidade do contabilista\n1.4.\t\
    \ Da escrituração, dos livros e de sua exibição e das demonstrações financeiras\n\
    2.\tOs SUJEITOS DA ATIVIDADE DA EMPRESA e sua relação com a contabilidade\n2.1.\t\
    \ Ato e atividade: aspectos gerais\n2.2.\t Elementos dos atos jurídicos. Capacidade\n\
    2.3.\t Pessoas físicas. Comerciante individual e empresário individual\n2.4.\t\
    \ Pessoas jurídicas. Sociedades mercantis. Registro das empresas mercantis\n2.5.\t\
    \ Responsabilidade ilimitada e limitada. Desconsideração da personalidade jurídica\n\
    2.6.\t Disciplina jurídica do patrimônio. O patrimônio como garantia dos credores\n\
    2.7.\tA contração de obrigações. Débito e crédito. Dever e responsabilidade\n\
    3.\tA EMPRESA\n3.1.\t Empresário, empresa e estabelecimento\n3.2.\t Elementos\
    \ do estabelecimento. Trespasse do estabelecimento. Os intangíveis.\n3.3.\t A\
    \ empresa e o mercado.\n3.4.\t A função social da empresa.\n3.5.\tA disciplina\
    \ jurídica da empresa e a implementação de políticas públicas\n4.\tCONTRATOS EMPRESARIAIS\n\
    4.1.\tA ordem jurídica dos mercados. A importância da informação.  Propriedade\
    \ e contrato. Segurança jurídica\n4.2.\t Contratos entre empresas [B2B] e contratos\
    \ entre empresas e consumidores [B2C]\n4.3.\t Tipicidade e atipicidade contratual\n\
    4.4.\t Contratos de compra e venda\n4.5.\t Contratos de fornecimento\n4.6.\t Contratos\
    \ da distribuição\n4.7.\t Mandato\n4.8.\t Locação e leasing\n4.9.\t Contratos\
    \ ligados à terceirização da produção\n4.10.\tFactoring\n4.11.\tSeguros\n5.\t\
    SOCIEDADES COMERCIAIS\n5.1.\tSociedades personificadas e não personificadas\n\
    5.2.\tSociedade em comum\n5.3.\tSociedade em conta de participação\n5.4.\tSociedades\
    \ limitadas\n5.5.\tSociedades anônimas"
  course_name: 'DCO0219 - Direito Empresarial I

    Business Law I'
  deactivation: ''
  instructors: 1553792 - Paula Andrea Forgioni
  lecture_credits: '2'
  objectives: A atividade do contabilista, bem como sua responsabilidade perante terceiros,
    são formatadas pelo Direito. Com esse pressuposto, o curso visa a possibilitar
    ao profissional da contabilidade o domínio dos instrumentos necessários à.compreensão
    dos princípios e regras jurídicas no que diz respeito às empresas e sua atuação
    no mercado. De início, são estudadas as relações entre a contabilidade e o direito
    comercial [módulo 1] para, após, serem tratados importantes institutos do direito
    privado, com destaque para a atividade, pessoas físicas e jurídicas, responsabilidade
    limitada e ilimitada dos agentes econômicos, patrimônio, débitos e créditos [módulo
    2]. No terceiro módulo, entra-se mais a fundo na análise da empresa e na sua atuação
    no mercado. O módulo 5 tem por objetivo mostrar aos futuros contabilistas os contratos
    empresariais e sua dinâmica no mercado, com destaque para os principais tipos
    encontrados na prática atual. O ultimo módulo [modulo 6] aprofunda a análise das
    sociedades empresariais, com ênfase nos cinco tipos mais encontrados na prática
    brasileira.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
