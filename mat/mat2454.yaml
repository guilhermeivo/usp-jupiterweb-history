  course: "Funções de duas ou mais variáveis: limites, continuidade, diferenciabilidade.\
    \ ; Gradiente; Regra da cadeia; Teorema do Valor Médio; Derivadas de ordem superior;\
    \ Teorema de Schwarz (enunciado); Fórmula de Taylor; Máximos e Mínimos; Multiplicadores\
    \ de Lagrange.\nFunctions of two or more variables: limits, continuity, diferentiability;\
    \ Gradient; Chain Rule; Mean Value Theorem;Higher ordederivatives;  Schwarz\x92\
    s Theorem (statement); Taylor´s Formula; Maximum and Minimum; Lagrange multipliers."
  course_name: 'MAT2454 - Cálculo Diferencial e Integral II

    Differential and Integral Calculus II'
  deactivation: ''
  lecture_credits: '4'
  objectives: 'Aprimorar o conhecimento e as habilidades dos alunos introduzindo o
    cálculo diferencial de funções de duas ou mais variáveis.

    Enhance the knowledge and the abilities of the students introducing differential
    calculus for functions of two or more variables.'
