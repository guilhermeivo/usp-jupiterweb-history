  course: 'A disciplina abordará os seguintes conceitos: fundamentos de helmintologia,
    protozoologia e artropodologia de parasitas de interesse médico-veterinário; aspectos
    básicos de morfologia, taxonomia e ciclo evolutivo; mecanismos de interação parasita-hospedeiro
    como colonização, adesão, invasão intracelular, evasão do sistema imune;técnicas
    de colheita, conservação e envio de material biológico destinado ao diagnóstico
    de parasitas, métodos para a identificação morfológica e molecular de parasitas;
    principais drogas para o controle de parasitas.

    Os principais parasitas de interesse médico veterinário serão abordados, tais
    como protozoários (Coccidia, Haemosporida, Piroplasmida, Diplomonadida, Trichomonadida,
    Kinetoplastida); artrópodes ( Acari, Diptera, Siphonaptera, Anoplura, Amblycera,
    Ischnocera) e helmintos ( Nematoda: Ascaridida, Strongylida, Spirurida, Rhabditida,
    Oxyurida; Cestoda:Taeniidae, Hymenolepididae, Davaineidae, Dipylidiidae, Anoplocephalidae;
    Trematoda: Echinostomida, Strigeidida, Plagiorchiida; Acanthocephala).'
  course_name: 'BMP0222 - Parasitologia Veterinária

    Veterinary Parasitology'
  deactivation: ''
  instructors: '2085430 - Alda Maria Backx Noronha Madeira

    2796430 - Arthur Gruber

    92309 - Carlos Eduardo Winter

    6310240 - Mauro Javier Cortez Véliz'
  lecture_credits: '6'
  objectives: Transmitir os conhecimentos básicos gerais sobre a morfologia e biologia
    dos protozoários, artrópodes e helmintos de maior importância para a  Parasitologia
    Veterinária. Identificar os principais grupos e realizar o diagnóstico desses
    parasitas. Apresentar as relações entre parasitas e seus hospedeiros, e suas interações
    com o meio ambiente.
  practical_credits: '1'
  total_workload: 120 h
  type: Semestral
