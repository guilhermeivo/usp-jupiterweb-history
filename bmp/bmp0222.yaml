  course: 'A disciplina abordará os seguintes conceitos: fundamentos de helmintologia,
    protozoologia e

    artropodologia de parasitas de interesse médico-veterinário; aspectos básicos
    de morfologia, taxonomia e ciclo evolutivo; mecanismos de interação parasita-hospedeiro
    como colonização, adesão, invasão intracelular, evasão do sistema imune; mecanismos
    gerais de resistência à drogas e inseticidas; técnicas de colheita, conservação
    e envio de material biológico destinado ao diagnóstico de parasitas; métodos para
    a identificação morfológica e molecular de parasitas; principais drogas para o
    controle de parasitas.

    Os principais parasitas de interesse médico veterinário serão abordados, tais
    como protozoários

    (Diplomonadida, Trichomonadida, Kinetoplastida, Ciliophora, Coccidia, Haemosporida,
    Piroplasmida); helmintos (Nematoda: Ascaridida, Strongyloidea, Ancylostomatoidea,
    Trichostrongyloidea, Metastrongyloidea, Spirurida,

    Rhabditida, Oxyurida, Adenophorea; Cestoda: Diphillobothriidae , Taeniidae, Hymenolepididae,
    Davaineidae,

    Dilepididae, Anoplocephalidae; Trematoda: Echinostomatida, Strigeida, Plagiorchida;
    Acanthocephala) e

    artrópodes (Acari, Diptera, Hemiptera, Siphonaptera, Anoplura, Mallophaga).

    Instrumentos e Critérios de Avaliação'
  course_name: 'BMP0222 - Parasitologia Veterinária

    Veterinary Parasitology'
  deactivation: ''
