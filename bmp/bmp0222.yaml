  assessment: 'Serão adotados os seguintes critérios para a recuperação:

    a recuperação será composta de duas provas globais cumulativas, uma teórica e
    uma prática a serem realizadas durante o período estabelecido pelo calendário
    USP. A nota da recuperação (R) será calculada pela média ponderada dos conceitos
    obtidos nas provas teórica ( peso 3) e prática ( peso 1). O conceito final (F)
    da disciplina será calculado como segue:

    Conceito final (F) = {nota da Disciplina (D) + nota de Recuperação (R)}/2'
