  course: Visões histórica, social e política da homeopatia. Fundamentos da homeopatia.
    Concepção homeopática do processo saúde-doença. Semiologia homeopática. Diagnósticos
    e prognósticos homeopáticos. Prescrição homeopática. Matéria médica homeopática.
    Repertório homeopático. Farmacotécnica homeopática. Pesquisa homeopática.
  course_name: 'MCM0773 - Fundamentos da Homeopatia

    Fundamentals of Homeopathy'
  deactivation: ''
  instructors: 66053 - Milton de Arruda Martins
  lecture_credits: '3'
  objectives: Transmitir o conhecimento teórico dos principais fundamentos homeopáticos,
    para que os estudantes possam diferenciá-Ios e integrá-Ios às demais disciplinas
    e especialidades médicas. Exemplificar esses fundamentos teóricos na prática clínica
    homeopática (casos clínicos, seminários, experimentação patogenética etc.). Fundamentar
    cientificamente o modelo homeopático através de trabalhos nas áreas das pesquisas
    básica e clínica.
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
