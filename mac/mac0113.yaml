  lecture_credits: '4'
  objectives: 'Introduzir a programação de computadores através do estudo de uma linguagem
    algorítmica e de exercícios práticos; introduzir software de uso geral.

    To introduce computer programming through the study of algorithmic language and
    practical exercises; introduce general purpose software.'
