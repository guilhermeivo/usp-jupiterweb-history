  course: 'Algoritmos: caracterização, notação, estruturas básicas. Computadores:
    unidades básicas, instruções, programa armazenado, endereçamento, programas em
    linguagem de máquina.; Conceitos de linguagens algorítmicas: expressões; comandos
    sequenciais, seletivos e repetitivos; entrada/saída; variáveis estruturadas.;
    Desenvolvimento e documentação de programas.; Software de uso geral: processadores
    de textos, planilhas eletrônicas, gerenciadores de arquivos, gerenciadores de
    bancos de dados, sistemas operacionais de microcomputadores.

    Algorithms: characterization, notation, basic structures. Computers: basic units,
    instructions, stored program, addressing, programs in machine language .; Concepts
    of algorithmic languages: expressions; sequential, selective, and repetitive commands;
    input and output; structured variables; Program development and documentation
    .; Software of general use: word processors, spreadsheets, file managers, database
    managers, microcomputer operating systems.'
  course_name: 'MAC0113 - Introdução à Computação para Ciências Humanas

    Introduction to Computing for Human Sciences'
  deactivation: ''
  instructors: '2564323 - Ana Cristina Vieira de Melo

    78352 - Flavio Soares Correa da Silva

