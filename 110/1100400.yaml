  assessment: Não há recuperação na disciplina de Estágio Supervisionado
  bibliography: Fornecida pelo orientador do estágio, de acordo com cada área.
  course: O Estágio Supervisionado terá um programa para cada estudante ou grupo de
    estudantes, elaborado de comum acordo com o seu orientador, necessariamente um
    professor da ESALQ ou do CENA. As atividades poderão ser desenvolvidas tanto na
    ESALQ, no CENA ou em entidades públicas e privadas, sempre com o acompanhamento
    de seu professor orientador.
  course_name: '1100400 - Estágio Supervisionado II

    Supervised Internship II'
  deactivation: ''
  instructors: 1907305 - Thais Maria Ferreira de Souza Vieira
  lecture_credits: '0'
  objectives: 'Oferecer ao aluno possibilidades de ampliar e aprofundar os conhecimentos
    adquiridos durante as aulas teóricas e práticas das disciplinas de seu curso,
    com uma visão mais realista da sua profissão. Para alcançar estes objetivos, pretende-se:
    (i) melhorar o processo de aprendizagem através do contato direto do aluno com
    as atividades rotineiras desenvolvidas em laboratórios e no campo, colocando o
    estudante em sintonia com a prática diária de sua profissão; (ii) desenvolver
    o espírito crítico do aluno através da análise de problemas práticos inerentes
    as atividades da área escolhida; (iii) treinar o aluno para planejar e desenvolver
    atividades profissionais nas diferentes áreas de atuação profissional; e, (iv)
    aprimorar a formação cultural, social e técnico-científica do estudante.'
  practical_credits: '4'
  total_workload: '120 h

    (

    Estágio: 120 h

    )'
