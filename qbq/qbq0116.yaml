  course: 'Estrutura de Biomoléculas: Conceito de pH. Sistemas "tampão". Sistemas
    "tampão" fisiológicos. Noções básicas de estrutura de carboidratos. Noções básicas
    de estrutura e função de lipídeos e membranas biológicas. Estrutura e propriedades
    de aminoácidos, peptídeos e proteínas. Funções de proteínas. Propriedades de enzimas.

    Metabolismo: Modelo geral do metabolismo celular. Vias metabólicas: glicólise,
    ciclo de Krebs, cadeia de transporte de elétrons, fosforilação oxidativa, oxidação
    de ácidos graxos, gliconeogênese, via das pentoses, síntese e degradação de glicogênio,
    biosíntese de ácidos graxos, noções gerais sobre metabolismo de aminoácidos e
    ciclo da uréia.Ação de hormônios (insulina, glucagon e adrenalina) nas vias metabólicas.
    Integração de vias metabólicas.'
  course_name: 'QBQ0116 - Bioquímica: Estrutura de Biomoléculas e Metabolismo

    Biochemistry: Structure of Biomolecules and Metabolism'
