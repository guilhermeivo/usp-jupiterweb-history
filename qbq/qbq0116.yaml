courses:
  activation: 01/01/2020
  assessment: Nota da 2ª Avaliação = Nota da 1ª Avaliação + 2 x (Nota da prova de
    recuperação) dividido por 3.
  bibliography: 'Bioquímica Básica - A. Marzzocco e B. B. Torres

    Princípios de Bioquímica de Lehninger, D. L. Nelson & M. M. Cox

    Fundamentos de Bioquímica - D. Voet, J. G. Voet, C.W. Pratt

    Bioquímica -  J. M. Berg, J. L. T. e L. Stryer

    Artigos e revisões da literatura ou outra bibliografia indicada no cronograma
    anual da disciplina.'
  course: 'Água e tampões biológicos. Estrutura e propriedades de aminoácidos, proteínas,
    enzimas, lipídios, carboidratos e membranas biológicas. Visão geral e integrada
    do metabolismo celular. Glicólise. Fermentações lática e alcoólica. Gliconeogênese.
    Beta-oxidação de ácidos graxos. Acetil-CoA: formação e destino. Ciclo de Krebs.
    Cadeia de transporte de elétrons e fosforilação oxidativa. Metabolismo do Glicogênio
    e Via das Pentoses-Fosfato. Síntese de ácidos graxos. Metabolismo de aminoácidos.
    Regulação metabólica, ação hormonal no controle do metabolismo (insulina, glucagon
    e epinefrina). Integração e alterações metabólicas fisiológicas e patológicas.'
  course_name: 'QBQ0116 - Bioquímica: Estrutura de Biomoléculas e Metabolismo

    Biochemistry: Structure of Biomolecules and Metabolism'
  deactivation: ''
  instructors: 7105312 - Daniela Sanchez Bassères
  lecture_credits: '8'
  objectives: Proporcionar aos alunos uma visão global dos princípios gerais da Bioquímica,
    incluindo estrutura de biomoléculas.
