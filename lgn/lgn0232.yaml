  bibliography: 'Literatura Básica:

    Alberts, B.; Bray, D.; Hopkin, K.; Johnson, A.; Lewis, J.; Raff, M.; Roberts,
    K.; Walter, P. 2011. Fundamentos da Biologia Celular. 3ª Edição brasileira. Artmed,
    Porto Alegre.

    Lodish, H.; Berk, A.; Matsudaira, P.; Kaiser, C.A.; Krieger, M.; Bretscher, A.;
    Ploegh, H. Amon, A.; Scott, M.P. (2012). Biologia Celular e Molecular. 7ª Edição.
    Artmed, Porto Alegre

    Borém, A.; Fritsche-Neto, R. 2013. Biotecnologia Aplicada ao Melhoramento de Plantas.
    1o Edição, Produção Independente, Viçosa.

    Menck, C.F.M.; Van Sluys, M.A. 2017. Genética Molecular Básica: dos genes aos
    genomas. Editora Guanabara Koogan.

    Literatura Complementar:

    Textos científicos de jornais e revistas sobre descobertas atuais relacionadas
    à genética molecular que auxiliam na formação e senso critico do aluno.'
  course: '1. Introdução ao curso: apresentação dos objetivos do curso, o que os organismos
    vivos têm em comum, diversidade genética e onde a informação sobre a diversidade
    é encontrada. Aplicação dos estudos em genética molecular (Biotecnologia); 2.  Estrutura
    e função do DNA, replicação, transcrição e tradução. A natureza do gene e Estrutura
    molecular do gene: definição de gene (uma abordagem molecular), elementos regulatórios
    que compõem a estrutura do gene, diferenças entre genes de eucarioto e procarioto,
    organização dos genes nos genomas de eucariotos e procariotos, tamanho de genomas
    x complexidade; 3. Tecnologia do DNA Recombinante: Histórico e Enzimas de Restrição;
    4. Tecnologia do DNA Recombinante: Vetores de clonagem e hospedeiros (origem e
    características); 5. Clonagem independente de células vivas: PCR. 6. Transgenia
    em plantas, métodos de transformação de plantas (biobalística e Agrobacterium
    tumefasciens), cultura de tecidos, criação de uma linhagem transgênica e utilização
    em programas de melhoramento, exemplos do processo de criação de transgênicos
    com diferentes construções sintéticas; 7. Estudo das ômicas: genômica x transcriptômica
    e a metagênomica; 8. Genética de Microrganismos e suas aplicações biotecnológicas;
    9. Introdução aos bancos de dados biológicos contendo informações sobre sequências
    de DNA e proteínas: aprendizagem na leitura das informações biológicas em um banco
    de dados de sequências de DNA. Comparação de sequências; 10. Marcadores Moleculares
    no melhoramento e em estudos de conservação; 11.  Novas descobertas em Genética
    Molecular.'
  course_name: 'LGN0232 - Genética Molecular

    Molecular Genetics'
  deactivation: ''
  instructors: 3294216 - Maria Carolina Quecine Verdi
  lecture_credits: '2'
  objectives: A disciplina de GENÉTICA MOLECULAR (LGN0232) é um dos cursos de formação
    básica e também da ESALQ. Atende aos estudantes dos cursos de Engenharia Agronômica
    e Engenharia Florestal.  O curso se propõe a desenvolver os tópicos básicos da
    Genética Molecular através de aulas teóricas e práticas, enfatizando avanços recentes
    de novas técnicas biotecnológicas suas aplicações na Agropecuária e no setor Florestal.
    É uma disciplina pré-requisito fundamental a disciplina obrigatória oferecida
    pelo Departamento de Genética (Melhoramento de Plantas). Possui carga horária
    de 2 horas/aula semanais. O crédito trabalho é aplicado em complementação de leituras
    programadas, preparo do trabalho de curso de apresentação oral, e preparo de relatórios
    sobre as atividades realizadas em laboratório. O objetivo é dar aos alunos conhecimentos
    básicos sobre a biologia molecular necessários para entender as aplicações mais
    recentes no campo da biotecnologia em diversas áreas de conhecimento apresentando
    um perfil interdisciplinar, sendo assim uma disciplina de suma importância na
    formação profissional dos alunos da ESALQ. As aulas teóricas apresentam o detalhamento
    sobre o DNA como material genético; isolamento e clonagem de genes; estrutura
    do gene de procariotos e eucariotos; mecanismos da transcrição e da tradução;
    regulação da expressão gênica; genômica funcional, incluindo uma abordagem aplicada
    em diferentes áreas do conhecimento, mas principalmente em Genética, Melhoramento
    e Biotecnologia e conceitos técnicos sobre a produção de plantas geneticamente
    modificadas.   A disciplina representa também uma oportunidade para o aluno aprender
    o que é pesquisa científica, ou seja, a procura de explicações para os fenômenos
    que são observados na natureza. O conhecimento básico representa a origem de toda
    tecnologia aplicada. A Genética Molecular é uma ciência básica que depende dos
    conhecimentos adquiridos sobre a biologia da célula, necessários para entender
    todos vários processos desenvolvidos no âmbito da biotecnologia.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
