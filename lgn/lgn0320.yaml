  course: '1. Introdução:

    Interdisciplinaridade e áreas de estudos relacionadas à Ecologia Evolutiva Humana.
    Conceito de Ecologia Evolutiva Humana.

    2. Revisão de Conceitos e Processos Ecológicos Básicos:

    População; comunidade; nicho ecológico; habitat; ecossistema; sucessão ecológica;
    ciclos de matéria e fluxo de energia.

    3. Populações Humanas, Adaptação e Diversidade (Evolução):

    Biologia e dinâmica de populações humanas; esforço reprodutivo; fluxo gênico;
    evolução hominínea e a evolução da comunidade. Processos coevolutivos na domesticação
    de plantas, animais e micro-organismos. Epigênese.

    4. Comunidades Humanas do Ponto de Vista Ecológico-evolutivo:

    Estratégias de forrageio: métodos de estudo, aplicações a populações indígenas
    contemporâneas e à ecologia evolutiva. Modos de produção e modelos de subsistência,
    parentesco e residência; territorialidade. Etnobiologia e etnoecologia: conhecimento
    tradicional, incluindo conhecimentos genéticos e de sistemas reprodutivos de variedades
    locais cultivadas e(ou) coletadas e sua relação com a conservação.

    5. Evolução, Genes e Cultura:

    Mecanismos de transição entre os genes e a cultura; coevolução. Sociobiologia
    Revista, Antropologia Cultural e Antropologia Ecológica, abordagens da interação
    genes-cultura no processo evolutivo da Espécie Humana. Biologia Cultural. Fenótipo
    humano: genes, cultura e ambiente.

    6. Sustentabilidade:

    População Humana e Produção de Alimentos. Geração de Resíduos.

    O ser humano, o ecossistema e a cultura. A adaptação humana a ambientes específicos.
    Sociobiodiversidade. Sustentabilidade e Diversidade Cultural: perspectivas evolutivas
    para a espécie humana. Ecologia das Tecnologias.

    7. Projetos de Pesquisa em Ecologia Humana e suas Interfaces com outras áreas
    de conhecimento:

    Pesquisas em Ecologia Humana, orientação e exercícios de elaboração de projetos
    de pesquisa e(ou) seminários com questões pertinentes às interfaces entre as linhas
    de pesquisa e referenciais teóricos da Ecologia Humana e as áreas de trabalho
    dos cursos de graduação dos estudantes matriculados no semestre. Interfaces dos
    conhecimentos de Ecologia Humana com outras áreas da ciência e programas de pesquisa.'
  course_name: 'LGN0320 - Ecologia Evolutiva Humana

    Human Evolutionary Ecology'
  deactivation: ''
  instructors: 60370 - Silvia Maria Guerra Molina
  lecture_credits: '4'
  objectives: 'Ao final deste curso os estudantes deverão:

    a) compreender abordagens teóricas e técnicas de pesquisa em Ecologia Humana;

    b) compreender os processos e mecanismos envolvidos na Evolução da Espécie Humana
    e Coevolução com outros organismos (especialmente plantas, animais e micro-organismos
    domesticados);

    c) desenvolver capacidade de análise crítica de situações complexas de interação
    da Espécie Humana com os demais organismos e o ambiente físico, com base principalmente
    nas interfaces da Genética de Populações, Antropologia, Ecologia e Evolução;

    d) a partir das interações entre seres humanos e o meio, confrontar a possibilidade
    de sustentabilidade em ambientes específicos, a diversidade cultural e o processo
    de evolução da Espécie Humana.'
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
