  bibliography: 'Literatura Básica:

    1. Alberts, B.; Bray, D.; Johnson, A.; Lewis, J.; Raff, M.; Roberts, K.; Walter,
    P. 2009. Biologia Molecular da Célula. 5ª Edição brasileira. Artmed, Porto Alegre.

