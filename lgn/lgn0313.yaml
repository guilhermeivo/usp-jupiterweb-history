  course: 'Importância, objetivos do melhoramento genético e perfil do melhorista.
    Sistemas reprodutivos e suas relações com o melhoramento.Origem e evolução das
    espécies cultivadas, Domesticação e Bancos de Germoplasma. Base genética de caracteres
    quantitativos. Componentes da variação fenotípica, coeficientes de herdabilidade
    e progresso com seleção. Interação genótipo por ambiente.Técnicas experimentais
    aplicadas ao melhoramento. Lei de proteção de cultivares. Teoria das linhas puras
    e seleção massal. Escolha de genitores e tipos de progênies. Melhoramento de espécies
    autógamas: estrutura genética das populações, tipos de cultivares, geração de
    variabilidade e métodos de seleção: método genealógico, método da população, método
    SSD e método do retrocruzamento. Melhoramento de espécies de propagação vegetativa:
    estrutura genética das populações, tipos de cultivares, geração de variabilidade
    e etapas da seleção.Melhoramento de espécies alógamas: estrutura genética de populações,
    tipos de cultivares e procedimentos para o desenvolvimento de cultivares híbridos:
    obtenção e melhoramento de linhagens e avaliação de linhagens. Seleção recorrente:
    conceitos básicos, etapas e importância para o melhoramento genético.  Manejo
    de cultivares transgênicos.'
  course_name: 'LGN0313 - Melhoramento Genético

    Plant Breeding'
  deactivation: ''
  instructors: 707464 - Jose Baldin Pinheiro
  lecture_credits: '3'
  objectives: Elucidar a importância do desenvolvimento de cultivares para o agronegócio
    e proporcionar a compreensão da base genética dos métodos de melhoramento. Além
    disso, buscar-se-á discutir a utilização tecnologias associadas para auxiliar
    o desenvolvimento de cultivares, em espécies anuais, semi-perenes e perenes.
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
