  course: "1.\tIntrodução à toxicologia veterinária: aspectos históricos e conceitos.\n\
    2.\tToxicocinética: vias de exposição, absorção, distribuição, biotransformação\
    \ e eliminação dos agentes tóxicos.\n3.\tToxicodinâmica: mecanismos de ação dos\
    \ agentes tóxicos, relação concentração/doseefeito nocivo.\n4.\tAvaliação da toxicidade.\n\
    5.\tDiagnóstico das intoxicações e noções de toxicologia forense.\n6.\tConduta\
    \ de urgência nas intoxicações.\n7.\tToxicologia do desenvolvimento.\n8.\tPlantas\
    \ tóxicas ornamentais e de interesse agropecuário.\n9.\tPraguicidas: piretroides,\
    \ organofosforados e carbamatos, acaricidas, fungicidas e raticidas.\n10.\tToxicologia\
    \ dos medicamentos.\n11.\tImunotoxicologia.\n12.\tIntoxicação por produtos domissanitários.\n\
    13.\tMicotoxicoses.\n14.\tAlimentos tóxicos para animais e drogas de uso ilícito.\n\
    15.\tZootoxinas.\n16.\tResíduos de substâncias químicas em produtos de origem\
    \ animal."
