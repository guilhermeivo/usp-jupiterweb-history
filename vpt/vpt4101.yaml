  course: 'Introdução à toxicologia veterinária: aspectos históricos e conceitos.
    Toxicocinética: vias de exposição, absorção, distribuição, biotransformação e
    eliminação dos agentes tóxicos. Toxicodinâmica: mecanismos de ação dos agentes
    tóxicos, relação concentração/dose-efeito nocivo. Avaliação da toxicidade. Diagnóstico
    das intoxicações e noções de toxicologia forense. Conduta de urgência nas intoxicações.
    Toxicologia do desenvolvimento. Plantas tóxicas ornamentais e de interesse agropecuário.
    Praguicidas: organoclorados e piretróides, organofosforados e carbamatos, herbicidas,
    acaricidas, fungicidas e raticidas. Toxicologia dos medicamentos. Intoxicação
    por metais. Intoxicação por produtos domissanitários. Imunotoxicologia. Micotoxicoses.
    Alimentos tóxicos para animais e drogas de uso ilícito. Zootoxinas. Toxicologia
    forense. Resíduos de substâncias químicas em produtos de origem animal. Viagem
    didática para o campus USP Fernando Costa, em Pirassununga, para realização de
    aula prática, visando o diagnóstico de intoxicação em animais de produção, em
    condições de campo.

    Instrumentos e Critérios de Avaliação'
  course_name: 'VPT4101 - Toxicologia aplicada à Medicina Veterinária

    Applied Toxicology in Veterinary Medicine'
  deactivation: ''
  instructors: 91736 - Silvana Lima Gorniak
  lecture_credits: '3'
  objectives: Proporcionar aos alunos os conhecimentos de toxicologia veterinária,
    capacitando-os a compreender os fatores envolvidos na toxicidade de diversos agentes
    e seus efeitos nocivos no organismo animal, bem como as implicações na saúde humana
    de resíduos de produtos de uso veterinário e de agentes tóxicos nos animais de
    produção. Habilitar o aluno na prevenção, diagnóstico e tratamento das intoxicações
    dos animais domésticos. Possibilitar a vivência de realização do diagnóstico de
    intoxicação em animais de produção, em condições de campo (Fazenda Escola, em
    Pirassununga), por meio de treinamento prático, com coleta de informações com
    o tratador do animal, avaliação das condições de armazenamentos de insumos e coletas
    de agentes tóxicos, como, por exemplo, plantas tóxicas.
  practical_credits: '0'
  total_workload: 45 h
  type: Semestral
