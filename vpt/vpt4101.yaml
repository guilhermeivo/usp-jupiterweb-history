  course: 'Introdução à toxicologia veterinária: aspectos históricos e conceitos.
    Toxicocinética: vias de exposição, absorção, distribuição, biotransformação e
    eliminação dos agentes tóxicos. Toxicodinâmica:mecanismos de ação dos agentes
    tóxicos, relação concentração/dose-efeito nocivo. Avaliação da toxicidade. Diagnóstico
    das intoxicações e noções de toxicologia forense. Conduta de urgência nas intoxicações.
    Toxicologia do desenvolvimento. Plantas tóxicas ornamentais e de interesse agropecuário.
    Praguicidas: organoclorados e piretróides, organofosforados e carbamatos, herbicidas,acaricidas,
    fungicidas e raticidas. Toxicologia dos medicamentos. Intoxicação por metais.
    Intoxicação por produtos domissanitários. Imunotoxicologia. Micotoxicoses. Zootoxinas.
    Toxicologia forense. Resíduos de substâncias químicas em produtos de origem animal.'
  course_name: 'VPT4101 - Toxicologia aplicada à Medicina Veterinária

    Toxicology'
  deactivation: ''
  instructors: 91736 - Silvana Lima Gorniak
  lecture_credits: '3'
  objectives: Proporcionar aos alunos os conhecimentos de toxicologia veterinária,
    capacitando-os a compreender os fatores envolvidos na toxicidade de diversos agentes
    e seus efeitos nocivos no organismo animal e, ainda, habilitar o aluno na prevenção,
    diagnóstico e tratamento das intoxicações dos animais domésticos.
  practical_credits: '0'
  total_workload: 45 h
  type: Semestral
