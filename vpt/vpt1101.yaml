  course_name: 'VPT1101 - Princípios Éticos e Legais no Uso de Animais no Ensino e
    na Pesquisa

    Ethical and Legal Principles on the Use of Animals in Education and Research'
  deactivation: 31/12/2022
  instructors: 141703 - Claudia Madalena Cabrera Mori
  lecture_credits: '2'
  objectives: Seguindo uma tendência internacional, o uso de animais no ensino de
    graduação tem sido progressivamente substituído por alternativas, tais como programas
    de computador, manequins e simuladores, cadáveres de animais obtidos de maneira
    ética e atividades relacionadas ao atendimento de casos clínicos de rotina. A
    educação humanitária e o debate sobre alternativas ao uso de animais no ensino
    superior é uma questão relativamente recente no Brasil. Somente em 2008 foi aprovada
    a lei 11.794 que cria o Conselho Nacional de Controle da Experimentação Animal
    (CONCEA) e regulamenta o uso de animais no ensino e pesquisa. Sendo assim, a disciplina
    visa apresentar ao corpo discente os princípios éticos e legais no uso de animais
    no ensino superior e na pesquisa biomédica.
  practical_credits: '0'
  total_workload: 30 h
