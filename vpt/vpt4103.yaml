  course: '1. Sistemas ambientais. Gestão de recursos naturais. Poluição do ar, da
    água e do solo.

    2. Cadeias produtivas, produção orgânica e impacto ambiental.

    3. Legislação. Crimes contra o meio ambiente.

    4. Estudo dos impactos ambientais.

    5. Destino de dejetos, excretas, animais mortos.

    6. Tratamento de água e efluentes.

    7. Esgotamento sanitário.

    8. Controle de sinantrópicos.

    9. Animais peçonhentos.

    10. Resíduos de medicamentos

    11. Esterilização, desinfecção, biofilmes e resistência bacteriana.

    12. Segurança do alimento na indústria.

    13. Apresentação e discussão dos projetos integrados.'
  course_name: 'VPT4103 - Projetos Sanitários Integrados

    Sanitary Projects'
  deactivation: ''
  instructors: '230779 - Andrea Micke Moreno

    767934 - Lilian Rose Marques de Sá

    1733991 - Terezinha Knöbl'
  lecture_credits: '2'
  objectives: O objetivo da disciplina é capacitar os alunos de graduação para a identificação
    e solução de problemas ambientais associados à transmissão de doenças. Ao final
    da disciplina, o aluno estará apto a elaborar projetos sanitários integrados para
    os diversos cenários que compõem a medicina veterinária.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
