  lecture_credits: '7'
  objectives: 'da atividade

    Prover aos interessados no encaminhamento dos cadáveres um relatório acerca das
    alterações que colaboraram para o desfecho do caso encaminhado (óbito do animal
    em questão); promover aos estudantes uma oportunidade de treinamento real no cotidiano
    de trabalho de patologistas veterinários que trabalham com diagnóstico, possibilitando
    a discussão de casos completos e o estabelecimento do raciocínio em saúde que
    possibilita a compreensão global dos processos de adoecimento e morte.

    Descrição da atividade

    Para tanto, os estudantes realizarão o exame necroscópico completo do cadáver
    nos próprios do Departamento de Patologia, redigirão um relatório minucioso descritivo
    (que será anexado ao módulo de avaliacão de competências no e-disciplinas da USP),
    além de treinar a coleta e encaminhamento de material para exame histopatológico;
    posteriormente, os estudantes discutirão o caso completo com veterinários residentes
    do serviço, bem como conosco (corpo docente) e eventuais profissionais interessados
    nos casos em questão.

    Indicadores de avaliação da atividade

    Os relatórios submetidos no módulo de competências serão avaliados por docentes,
    médicos veterinários associados ao serviço e eventualmente consultores externos;
    serão contabilizados o número de exames necroscópicos realizados, confrontando-os
    com o número de relatórios gerados e enviados aos interessados. Antecipamos que
    cada estudante participante da atividade extensionista realizará um exame por
    período de quatro horas, o que deve gerar quatro descrições, discussões e relatórios
    ao longo do semestre.'
