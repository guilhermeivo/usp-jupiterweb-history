  objectives: A disciplina tem o objetivo de proporcionar condições para que o aluno
    compreenda as respostas teciduais por sistemas e reconheça e descreva as alterações
    anatomopatológicas que são observadas em maior frequência nos diferentes sistemas
    e nas diferentes espécies de animais.
