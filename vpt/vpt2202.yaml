    \ das Glândulas Endócrinas\n6.\tPatologia do Sistema Urinário\n7.\tPatologia do\
    \ Sistema Genital Feminino e do Sistema Genital Masculino\n8.\tPatologia do Sistema\
    \ Nervoso\n9.\tPatologia do Sistema tegumentar\n11.\tPatologia do sistema músculo-esquelético\n\
    12.\tPatologia do olho e ouvido"
  course_name: 'VPT2202 - Patologia Animal

    Animal Pathology'
