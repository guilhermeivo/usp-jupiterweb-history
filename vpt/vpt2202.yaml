  course: 'O ensino das enfermidades terá enfoque na fisiopatologia e aspectos macro
    e microscópicos dos grandes processos que acometem os diferentes sistemas, bem
    como especificamente da etiologia e patogenia de processos de importância em medicina
    veterinária.

    Aulas Teórico-práticas:

    1. Patologia do Sistema Respiratório

    2. Patologia do Sistema Hematopoiético e Linfopoiético

    3. Patologia do Sistema Circulatório

    4. Patologia do Sistema Digestório

    5. Patologia das Glândulas Anexas ao Sistema Digestório

    6. Patologia das Glândulas Endócrinas

    6. Patologia do Sistema Urinário

    7. Patologia do Sistema Genital Feminino e do Sistema Genital Masculino

    8. Patologia do Sistema Nervoso

    9. Patologia do Sistema tegumentar

    10. Doenças causadas por ectoparasitos

    11. Patologia do sistema músculo-esquelético

    12. Patologia do olho e ouvido

    13. Patologia forense.'
  course_name: 'VPT2202 - Patologia Animal

