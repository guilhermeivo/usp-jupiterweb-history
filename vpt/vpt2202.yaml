  course: "O processo de ensino e aprendizagem da disciplina abordará a fisiopatologia\
    \ e as grandes classes de processos patológicos com suas respectivas alterações\
    \ anatomopatológicas que acometem os órgãos e sistemas dos animais domésticos.\n\
    São empregadas aulas teóricas, práticas e discussões de casos sobre os seguintes\
    \ temas:\n1.\tPatologia do Sistema Respiratório\n2.\tPatologia do Sistema Hematopoiético\
    \ e Linfopoiético\n3.\tPatologia do Sistema Circulatório\n4.\tPatologia do Sistema\
