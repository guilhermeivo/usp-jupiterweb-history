  objectives: O objetivo básico desta Disciplina é proporcionar ao aluno conhe-cimentos
    para que possam raciocinar e compreender como ocorre a comuni-cação entre os neurônios
    e os mecanismos envolvidos na manifestação do comportamento animal e nos distúrbios
    do Sistema Nervoso Central (SNC). Para tanto, serão utilizados modelos de comportamento
    animal que fazem uso de animais de laboratório.
