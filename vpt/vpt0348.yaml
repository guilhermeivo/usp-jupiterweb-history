  course: 'A Bioética: origem e relação com a evolução do conceito de direito dos
    animais e o direito ambiental; Senciência animal;Normas e legislação nacional
    e internacional sobre o uso de animais; Regulamentação das CEUAs e o papel do
    Veterinário como membro de CEUA de acordo com a Legislação vigente; A importância
    do uso de modelos animais em Pesquisa; Eutanásia em animais: Legislação e Métodos.

    Aspectos básicos da legislação na área de Medicina Veterinária Legal; Atuação
    do profissional em Medicina Veterinária Legal. Noções: Direito e Criminalística;
    Identificação e Genealogia:verificação de parentesco; Arbitragem de valores e
    custos de produção pecuária; Patologia forense; Tanatologia e Traumatologia forense;
    normas relativas aos produtos de origem animal; funcionamento de estabelecimentos
    veterinário e correlatos; Normas relativas ao transito nacional e internacional
    de animais e violência doméstica; Erro Médico e Código de Ética na Medicina Veterinária;
    Exames laboratoriais em perícias; identificação de fraudes, imperícias; Avaliação
    de produtos de origem animal, estabelecimentos veterinários e correlatos; elaboração
    de laudos, pareceres técnicos e demais documentos judiciais e papel do Médico
    Veterinário como Perito.'
  course_name: 'VPT0348 - Bioética e Medicina Veterinária Legal

    Bioethics and Forensics Veterinary Medicine'
  deactivation: ''
  instructors: '141703 - Claudia Madalena Cabrera Mori

    9128068 - Claudia Momo

    1240998 - Paulo César Maiorka'
  lecture_credits: '3'
  objectives: Introduzir e discutir os conceitos de bioética e legislação sobre o
    uso de animais; Apresentar os organismos nacionais e internacionais que regulamentam
    a experimentação animal; Discutir o conceito de senciência e implicações legais;
    Capacitar os Médicos Veterinários a ocupar assento junto às Comissões de Ética
    no Uso de Animais (CEUAs) como preconizado em Lei. Apresentar legislação nacional
    sobre métodos de Eutanásia; Discutir a importância de modelos animais. ntroduzir
    aspectos básicos da legislação vigente na area de Medicina Veterinária. Apresentar
    as áreas de atuação do Medico Veterinário na Medicina Legal. Apresentar métodos
    de avaliação e identificação de animais e rebanhos;Apresentar normas relativas
    ao transito nacional e internacional de animais e seguro para animais; Constatação
    de maus tratos aos animais e danos ao meio ambiente; Discutir o Erro Médico na
    Medicina Veterinária; Capacitar Médicos Veterinários a realizar exames periciais
    elaborar laudos, pareceres técnicos e demais documentos judiciais.
  practical_credits: '0'
  total_workload: 45 h
  type: Semestral
