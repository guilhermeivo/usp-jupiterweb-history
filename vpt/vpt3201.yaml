courses:
  activation: 01/01/2025
  assessment: 'A recuperação constará de duas provas a serem realizadas até uma semana
    antes do término do período de retificação de matrícula (estabelecido anualmente
    pelo Calendário USP).

    A média da avaliação final da disciplina entrará no computo da recuperação, sendo:
    média = média da avaliação final + média da recuperação ÷ 2.'
  bibliography: '1. AAAP. A laboratory manual the isolation and identification of
    avian pathogens. 4th ed. 1998.

    2. Revolledo, L & Ferreira, A. J. P. Patologia Aviária. Ed. Manole, 2008.

    3. Berchieri, JR., A. & Macari, M. Doenças das aves. FACTA, 2000.

    4. Berchieri, JR., A. et al. Doenças das aves. 2ª Edição, FACTA, 2009.

    5. McLelland, J. Color atlas of avian anatomy. WP, London, UK, 1990.'
  course: 'Curso Teórico:

    1. Doenças bacterianas - micoplasmose aviária, colibacilose aviária, salmoneloses,
    pasteurelose, coriza infecciosa das galinhas, clostridioses, ornitobacteriose,
    clamidiose e enterites bacterianas.

    2. Doenças virais - enterites virais, doença de Newcastle, doença de Marek, reticuloendoteliose,
    leucoses (complexo tumoral viral), doença de Gumboro, bouba aviária, anemia infecciosa
    das galinhas, laringotraqueíte infecciosa, adenoviroses, encefalomielite aviária,
    artrite viral, bronquite infecciosa das galinhas e pneumovirose.

    3. Doenças parasitárias - coccidiose, ectoparasitas e endoparasitas.

    4. Doenças metabólicas - síndrome ascítica e síndrome da morte súbita.

    Curso Prático:

    O curso prático constará de aulas de métodos de coleta de material biológico,
    exame necroscópico e técnicas de vacinação em aves.

    Instrumentos e Critérios de Avaliação'
  course_name: 'VPT3201 - Ornitopatologia

    Avian Pathology'
  deactivation: ''
  instructors: '55839 - Antônio José Piantino Ferreira

    3160492 - Tânia de Freitas Raso'
  lecture_credits: '3'
  objectives: A disciplina abordará os temas específicos sobre as doenças de importância
    econômica e/ou epidemiológica que acometem as aves de produção (galinhas de postura,
    frangos, reprodutoras, perus e outras aves), seu impacto à saúde das aves e suas
    consequências para a saúde humana. O enfoque será dado ao estudo dos agentes etiológicos,
    patogenia, sinais clínicos, lesões anatomopatológicas e métodos de diagnóstico
    das enfermidades. Ao final do curso o aluno estará capacitado para diagnosticas
    doenças em aves de produção e propor medidas preventivas e/ou curativas para minimizar
    o impacto das doenças nos planteis avícolas.
  practical_credits: '0'
  total_workload: 45 h
  type: Semestral
