  bibliography: 'SWAYNE, D.E. et al. (2023) Diseases of Poultry. 13th ed. Wiley-Blackwell,
    USA.

    REVOLLEDO, L. & FERREIRA, A.J.P. (2008) Patologia Aviária. Editora Manole, São
