    ANDREATTI, R. et al. (2020) Doenças das Aves. 3 ed. Editora Facta, Campinas, SP.'
  course: O curso será de conteúdo teórico-prático abordando inicialmente os conceitos
    e definições do Plano Nacional de Saúde Aviária – PNSA, biosseguridade e anatomia
    de aves comerciais. Capacitar o aluno para o conhecimento das doenças virais (influenza,
    doença de Newcastle, bronquite infecciosa das galinhas, pneumovirose, doença de
    Gumboro, anemia das galinhas, complexo tumoral viral, doença de Marek, reticuloendoteliose,
    leucose linfóide e mielóide, poxvirose, adenovirose, encefalomielite aviária,
    artrite viral, enterites virais e outras doenças virais), doenças bacterianas
    (micoplasmose aviária, colibacilose, salmoneloses, pasteurelose, coriza infecciosa,
    clostridioses, ornitobacterioses e enterites bacterianas), doenças parasitárias
    (coccidiose, ectoparasitas, endoparasitas) e doenças metabólicas. O curso prático
    não utiliza animais e sim métodos alternativos de videoaulas, como por exemplo,
    vacinação, e deverá capacitar o aluno para a adequada anamnese, contenção física,
    exame clínico, técnicas de colheita de material biológico, bem como realização
    de necropsia e identificação das alterações anatomopatológicas em aves.
  course_name: 'VPT3201 - Ornitopatologia

