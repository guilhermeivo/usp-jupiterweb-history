  objectives: 'de Desenvolvimento Sustentável (ONU)

    n° 2)

    Fome Zero e Agricultura Sustentável:

    acabar com a fome, alcançar a segurança alimentar e melhoria da nutrição e promover
    a agricultura sustentável;

    n° 3)

    Saúde e Bem-Estar:

    assegurar uma vida saudável e promover o bem-estar para todos, em todas as idades;

    n° 4)

    Educação de Qualidade:

    assegurar a educação inclusiva, e equitativa e de qualidade, e promover oportunidades
    de aprendizagem ao longo da vida para todos;

    n° 6)

    Água Potável e Saneamento:

    garantir disponibilidade e manejo sustentável da água e saneamento para todos;

    n° 9)

    Indústria, Inovação e Infraestrutura:

    construir infraestrutura resiliente, promover a industrialização inclusiva e sustentável,
    e fomentar a inovação;

    n° 11)

    Cidades e Comunidades Sustentáveis:

    tornar as cidades e os assentamentos humanos inclusivos, seguros, resilientes
    e sustentáveis;

    n° 12)

    Consumo e Produção Responsáveis:

    assegurar padrões de produção e de consumo sustentáveis;

    n° 15)

    Vida Terrestre:

    proteger, recuperar e promover o uso sustentável dos ecossistemas terrestres,
    gerir de forma sustentável as florestas, combater a desertificação, deter e reverter
    a degradação da Terra e deter a perda da biodiversidade;

    n° 17)

    Parcerias e Meios de Implementação:

    fortalecer os meios de implementação e revitalizar a parceria global para o desenvolvimento
    sustentável'
