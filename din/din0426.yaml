  course: 'A. IntroduçãoI - Preliminares: 1. Iniciação bibliográfica; 2. Prolegômenos:
    Sociedade e Comunidade Internacional; 3. Especificidade; 4. Denominação e Definição.
    II - Perspectiva Histórica: 5. Observações prévias; 6. A Idade Antiga; 7. O surgimento
    da Disciplina Autônoma; 8. Do  Congresso de Wesphalia aos Tratados de Viena (1648-1815);
    9. Do Congresso de Viena à Primeira Guerra Mundial (1815-1918); 10. O Período
    entre as Duas Guerra Mundiais (1919-1939); 11. Durante a Segunda Guerra Mundial;
    12. Depois da Segunda Guerra Mundial. III - Sujeitos, Classificação e Fundamento:
    13. Classificação de Direito Internacional Público; 14. Sujeitos de Direito Internacional
    Público; 15. Fundamento de Direito Internacional Público.B. Elaboração do Direito
    Internacional PúblicoI - Atos Jurídicos e Fontes: 16. O Comportamento dos Estados;
    17. Atos Jurídicos Internacionais; 18. Fontes do Direito Internacional Público;
    19. Atos Jurídicos Estatais Unilaterais. II - Tratados Internacionais: 20. Preliminares;
    21. Classificação; 22. Processo de Conclusão; 23. Condições de Validade; 24. Entrada
    em Vigor, Efeitos, Revisão e Término; 25. Reserva; 26. Interpretação. III - Demais
    Fontes: 27. Costume Internacional; 28. Princípios Gerais de Direito; 29. Fontes
    Subsidiárias: Decisões Judiciais e Doutrinas; 30. Fonte Complementar: Equidade;
    31. Fonte Derivada: Atos Emanados de Organizações Internacionais. IV - Codificação:
    32. Codificação do Direito Internacional. V - Direito Interno e Direito Internacional:
    33. Relações entre Direito Interno e Direito Internacional; 34. Conflitos entre
    Tratados Internacionais e Leis Ordinárias; 35. Conflitos entre Tratados Internacionais
    e Leis Constitucionais; 36. Sanções sobre Conflito).'
  course_name: 'DIN0426 - Direito Internacional Público

    International Public Law'
  deactivation: ''
  instructors: 1518253 - Pedro Bohomoletz de Abreu Dallari
  lecture_credits: '4'
  objectives: Ministrar conhecimentos básicos sobre as normas e instituições jurídicas
    da sociedade internacional, assim como sobre os princípios e leis que solucionam
    os conflitos de normas no espaço; b) Fornecer diretrizes sobre utilização das
    fontes de direito internacional e de direito interno em redação a problemas que
    transcendem o interesse exclusivo de uma única ordem jurídica estatal; c) Dar
    informações sobre as funções e competência de nosso país na ordem jurídica internacional;
    d) Fornecer os elementos de análise e compreensão que possibilitem ao aluno resolver
    problemas de repercussão internacional, de acordo com o direito positivo pátrio
    e tratados internacionais pertinentes; e) Dar diretrizes sobre a utilização das
    fontes de direito estrangeiro.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
