  course: 'A importância da carne na economia brasileira. Estrutura e composição da
    carne. Conversão do músculo em carne. Etapas no abate de bovinos, suínos e aves.
    Qualidade de carne (cor, textura, pH, capacidade de retenção de água, capacidade
    de ligação, definição e características de carne PSE, DFD, RSN). Produtos da carne
    bovina e suína (produtos curados e defumados, produtos de umidade intermediária,
    produtos emulsionados, produtos fermentados). Produtos derivados da carne de aves
    (empanados e marinados). Aproveitamento de resíduos de origem animal. Ovos. Características.
    Química dos ovos. Qualidade dos ovos (métodos físicos e químicos). Produtos processados
    de ovos. Bibliografia.

    Práticas de Laboratório e Planta de Processamento: 1) Qualidade de carnes: estrutura
    de carne bovina e aves, capacidade de retenção de água, cor, cozimento, perda
    de peso por cozimento, perda de peso por gotejamento; 2) Produtos cominuídos:
    processamento de linguiça, análise de perda de cocção, análise de umidade;3) Produtos
    emulsionados: processamento de salsicha, análise de estabilidade de emulsão; 4)
    Cura e defumação: preparação de cura à seco, cura por injeção de salmoura, defumação
    a quente;

    5) Formulação de produtos e discussão da legislação brasileira quanto à processamento
    de produtos cárneos; 6) Pasteurização de produtos cárneos: estabelecimento e verificação
    do tratamento térmico.7) Estrutura e qualidade e processamento de ovos. Visitas
    a frigoríficos, empresas de processamento de carnes e ovos.'
  course_name: 'LAN0318 - Carnes e Ovos

