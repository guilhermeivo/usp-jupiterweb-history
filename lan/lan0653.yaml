  course: 'IIntrodução à tecnologia do açúcar. Novas matérias-primas sacaríneas. Controle
    de qualidade da matéria-prima: maturação e influência de impurezas – minerais
    e vegetais. Operações produtivas preliminares: corte, transporte, carregamento,
    descarregamento e armazenamento. Influência na qualidade do armazenamento de matérias-primas.
    Recepção, condução e lavagem de matérias-primas sacaríneas. Preparo da matéria-prima
    sacarínea para extração. Extração do caldo pelas moendas e por difusão – introdução,
    regulagens e cálculos. Purificação e clarificação do caldo: peneiragem, sulfitação,
    caleagem, aquecimento, decantação e filtração – introdução, regulagens e cálculos.
    Concentração: evaporação do caldo em múltiplos-efeitos, tratamento do xarope –
    introdução, regulagens e cálculos. Concentração: cozimento (cristalização) – introdução,
    regulagens e cálculos. Cristalização complementar. Centrifugação das massas cozidas.
    Operações finais: secagem, classificação, acondicionamento e armazenamento. Cálculos
    de rendimentos. Produção de vapor e de energia elétrica - termodinâmica. Controle
    de qualidade. Novas tecnologias. Visita técnica orientada a usinas de açúcar.'
  course_name: 'LAN0653 - Tecnologia do Açúcar

    Sugar Technology'
  deactivation: ''
  instructors: 2171774 - Claudio Lima de Aguiar
  lecture_credits: '4'
  objectives: a) Compreensão de todas as operações unitárias e aspectos de engenharia
    envolvidas na produção de diferentes tipos de açúcar cristal, bem como, envolver
    o aluno numa discussão sobre os mecanismos, fenômenos e causas que se processam
    durante a fabricação do açúcar e que podem acarretar e/ou influenciar na manutenção
    ou perda de qualidade dos diferentes tipos de açúcares produzidos industrialmente;
    b) Compreensão dos processos de condução e balanços de massa e energéticos da
    usina em bases técnicas com vistas a um aproveitamento racional da matéria-prima
    e uma melhor eficiência energética, mantendo os princípios da sustentabilidade
    ambiental nas diversas fases do processamento açucareiro.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
