  course: 'Importância da agroindústria sucroenergética. Fluxogramas industriais de
    produção do açúcar e do álcool. Influência da qualidade da matéria-prima sobre
    o processamento. Planejamento agrícola: setorização. Pagamento de cana pela qualidade.
    Operações preliminares da fabricação de açúcar e do álcool. Preparo da cana e
    extração do caldo. Purificação do caldo. Evaporação e cozimento. Cristalização,
    e centrifugação. Operações finais da fabricação do açúcar. Considerações gerais
    sobre matérias-primas para produção de álcool. Noções de tratamento de caldo,
    preparo e qualidade de mosto. Fermentação alcoólica: leveduras, preparo do fermento
    e condução de processos industriais. Destilação, retificação e desidratação do
    álcool. Subprodutos e efluentes. Produção energética.'
  course_name: 'LAN1458 - Açúcar e Álcool

    Sugar and Ethanol'
  deactivation: ''
  instructors: '543329 - Andre Ricardo Alcarde

    2524269 - Antonio Sampaio Baptista'
  lecture_credits: '2'
  objectives: a) Transmitir conhecimentos conceituais e técnicos dos principais processos
    de produção dos diferentes tipos de açúcar e dos processos de produção de etanol,
    destacando a importância das matérias-primas para a obtenção de produtos de interesse
    econômico para a cadeia sucroenergética.   b) Desenvolver a formação crítica do
    aluno na área de engenharia agroindustrial voltado para a produção de açúcar,
    etanol e bioenergias. c) Possibilitar o entendimento das operações envolvidas
    na indústria do açúcar e do etanol, bem como assimilar novas tecnologias e propor
    a resoluções aos desafios impostos aos processos envolvidos na cadeia sucroenergética.
  practical_credits: '1'
  total_workload: 60 h
  type: Semestral
