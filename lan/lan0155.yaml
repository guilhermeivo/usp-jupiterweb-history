  course: '1. Química básica de lipídeos: estrutura e propriedades físico-químicas
    de triacilgliceróis; componentes menores e sua importância tecnológica: tocoferóis,
    esteróis, fosfolipídeos, ceras e outras substâncias acompanhantes; 2. Propriedades
    físicas das matérias graxas: ponto de fusão e cristalização, curva de sólidos;
    3. Deterioração hidrolítica, oxidativa e métodos de conservação; 4. Parâmetros
    analíticos de qualidade e de identidade de óleos e gorduras: índice de acidez,
    índice de peróxido, estabilidade oxidativa em Rancimat, absortividade na faixa
    do UV, matéria insaponificável, índice de iodo, índice de saponificação, composição
    em ácidos graxos. Aulas práticas para determinações analíticas em óleos vegetais.
    5. Processos de extração de óleos e gorduras em pequena e grande escala; 6. Refino
    e hidrogenação de óleos vegetais; 7. Embalagens para óleos vegetais; 8. Gestão
    de resíduos na indústria de óleo de soja; 9. Farelos, concentrados e isolados
    proteicos vegetais e produtos tradicionais de soja; 10. Cacau e chocolate; 11.
    Emulsões alimentícias, maionese e margarina; 12. Interesterificação química e
    enzimática e fracionamento de óleos e gorduras. Processamento dos cereais (trigo,
    milho, arroz e outros). Princípios químicos e físicos envolvidos no processamento
    dos cereais.'
  course_name: 'LAN0155 - Produtos de Origem Vegetal II

    Oils, Fats, Oilseeds and By-products'
  deactivation: ''
  instructors: 5023119 - Severino Matias de Alencar
  lecture_credits: '4'
  objectives: 'Capacitar os alunos a: 1. Atuar com pensamento crítico e embasamento
    científico na tecnologia de alimentos lipídicos de origem vegetal e animal e proteicos
    de origem vegetal. 2. Desenvolver ou melhorar alimentos de bases lipídica e proteica
    de origem vegetal. 3.Atuar no processamento de cereais, com embasamento científico.'
  practical_credits: '1'
