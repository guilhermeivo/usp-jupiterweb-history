courses:
  activation: 01/01/2019
  assessment: 'Será efetuada 1 (uma) prova de recuperação dentro do prazo

    estabelecido pela Comissão de Graduação da ESALQ, respeitada a Resolução COG-3583.
    A nota final será

    a média da nota (N) obtida pelo aluno no semestre e a nota da prova de recuperação.'
  bibliography: 'Básica

    Apostilas e textos disponibilizados no STOA ou no e-mail da Classe.

    Complementar

    CHITARRA, M.I.F.; CHITARRA, E.B. Pós-colheita de frutos e hortaliças: fisiologia
    e manuseio.

    2. ed. Lavras. UFLA, 2005. 785p.

    CHITARRA, M.I.F.; CHITARRA, E.B. Pós-colheita de frutos e hortaliças: glossário.
    Lavras.

    UFLA, 2006. 256p.

    LIMA, U.A. Agroindustrialização de frutas. 2 ed. Piracicaba: FEALQ, 2008. 164p.

    MORETTI, C.L. Manual do processamento mínimo de frutas e hortaliças. Brasília.
    Embrapa

    Hortaliças e Sebrae, 2007.

    OETTERER, M.; REGITANO-d´ARCE, M.A.B. & SPOTO, M.H.F. Fundamentos de Ciência e

    Tecnologia de Alimentos. Ed. Manole, Barueri, SP, 2006. 612p.'
  course: 'Bioquímica e fisiologia de frutas e hortaliças (respiração, produção

    de etileno, pigmentos, pectina), pós-colheita (análises de controle de qualidade),
    refrigeração,

    processamento mínimo, congelamento de frutas e hortaliças (branqueamento, escurecimento

    enzimático); conservação de frutas pasteurizadas: frutas em calda ou xarope, polpa,
    sucos integral e

    concentrado, néctar, xarope; conservação de frutas por controle osmótico: compota,
    geleia,

    geleiada, doce cremoso, doce em massa, frutas cristalizadas; conservação de frutas
    e hortaliças pelo

    controle da umidade (desidratação e liofilização): conservação de hortaliças pelo
    calor (acidificadas

    e não acidificadas) e fermentação (picles, chucrute e azeitonas); produtos derivados
    do amido

    (derivados da hidrólise, derivados por modificações química, física e bioquímica),
    qualidade dos

    produtos amiláceos; processamento do trigo (obtenção da farinha, panificação,
    pastas e biscoitos);

    processamento do milho; beneficiamento e processamento do arroz; processamento
    da mandioca;

    produção de extrusados; legislação para frutas e hortaliças; sistema de embalagem
    e

    armazenamento; processamento de resíduos; conservantes.'
  course_name: 'LAN2680 - Frutas e Hortaliças

    Fruit and Vegetables'
  deactivation: ''
  instructors: 2102223 - Marta Helena Fillet Spoto
  lecture_credits: '4'
  objectives: 'a) Aprimorar o conhecimento dos alunos na tecnologia de alimentos de
    origem vegetal: frutas,

    hortaliças, inclusive tuberosas e seus produtos; b) Capacitar os alunos a desenvolverem
    produtos à

    base destas matérias-primas e a resolverem problemas práticos relacionados com
    a conservação e o

    processamento desses alimentos.'
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
