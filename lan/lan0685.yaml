  course: 'Cenário Nacional e Internacional da Produção de etanol. Introdução: (Propriedades
    físicas e químicas do etanol). Fluxograma de produção de etanol por fermentação.
    Matérias-primas: cana-de-açúcar, cana energia, milho, material lignocelulósico,  melaço
    e xarope. Aspectos da qualidade da matéria-prima para fabricação do álcool. Hidrólise
    de material amiláceo e de material lignocelulósico.  Pagamento de cana-de-açúcar
    pela qualidade tecnológica. Processos de tratamento de caldo de cana-de-açúcar:
    peneiragem, aquecimento, caleagem, decantação, evaporação. Mosto: caracteres gerais
    do meio de fermentação. Microrganismos: leveduras e bactérias. Cinética da fermentação:
    efeito Pasteur, efeito Crabtree. Leveduras floculantes. Preparo do levedo: laboratório
    e industrial. Fermentação alcoólica industrial em processos intermitentes e contínuos:
    fermentos individuais, cortes, decantação, Melle-Boinot, Melle-Boinot-Almeida,
    único estágio, torre, sob vácuo, Biostil e múltiplos estágios. Condução dos processos
    fermentativos. Contaminações e infecções dos processos. Rendimento e eficiência.
    Destilação: considerações teóricas. Condução industrial da destilação. Retificação.
    Desidratação. Aspectos gerais de controle de produção e de qualidade. Subprodutos,
    resíduos e efluentes. Visitas técnicas a destilarias da região.'
  course_name: 'LAN0685 - Tecnologia do Álcool

    Ethanol Technology'
  deactivation: ''
  instructors: 2524269 - Antonio Sampaio Baptista
  lecture_credits: '4'
  objectives: a) capacitar o  profissional para exercer controle de produção e de
    qualidade na produção de etanol  b) Capacitar o futuro profissional a participar
    do desenvolvimento técnico da indústria. c) Formação de senso crítico sobre os
    principais problemas das indústrias produtoras de álcool e de aguardente de cana.
