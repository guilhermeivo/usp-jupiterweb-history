  course: 'Matérias-primas para a produção das diferentes bebidas: composição e qualidade.
    Preparo do mosto: extração, preparo da matéria-prima, mosturação, clarificação,
    purificação e pasteurização. Leveduras industriais: aspectos fisiológicos, bioquímicos
    e tecnológicos. Fermentação alcoólica: processos intermitentes e contínuos em
    indústrias de pequeno e grande portes. Emprego de insumos nos processos fermentativos
    e suas implicações de naturezas quantitativa e qualitativa das bebidas. Operações
    finais na produção de bebidas fermentadas. Destilação: fundamentos teóricos. Destilação
    intermitente: qualidade final do destilado em função da sistemática da sua condução.
    Destilação contínua: qualidade final do destilado em função dos diferentes tipos
    de coluna e alternativas de modificação das colunas visando melhor separação dos
    componentes indesejáveis da bebida. Precursores e formação de componentes indesejáveis
    no destilado final. Aspectos relacionados à maturação (envelhecimento) de bebidas
    em tonéis de madeira. Experimentos de produção de cervejas, vinhos e aguardente
    de cana. Análises físico-químicas para determinação da composição e qualidade
    de bebidas. Visitas a destilarias e cervejarias.'
  course_name: 'LAN1616 - Tecnologia de Bebidas

    Technology of Beverages'
  deactivation: ''
  instructors: 543329 - Andre Ricardo Alcarde
  lecture_credits: '4'
  objectives: O aluno compreenderá a tecnologia envolvida na produção de bebidas fermentadas
    e destiladas, mediante o entendimento dos processos industriais de produção destas
    bebidas, englobando aspectos de matéria-prima, preparo do mosto, fermentação alcoólica,
    destilação e envelhecimento.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
