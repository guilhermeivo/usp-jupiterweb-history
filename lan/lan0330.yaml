  course: '1. Introdução à microbiologia dos alimentos. 2. Fatores intrínsecos, extrínsecos
    e implícitos que afetam o

    desenvolvimento microbiano. 3. Microrganismos indicadores. 4. Microrganismos patogênicos:
    principais

    bactérias e suas características de multiplicação nos alimentos, fontes de contaminação
    e capacidade de

    sobrevivência aos processos de industrialização/conservação de alimentos. 5. Zoonoses
    e parasitologia. 6. Microbiologia de hortaliças. 7. Microbiologia do pescado.
    8. Microbiologia de carnes e produtos cárneos. 9. Microbiologia do leite e derivados.
    10. Microbiologia de sucos e outros alimentos. 11. Microbiologia da água. 12.
    Termobacteriologia aplicada a alimentos. 13. Critérios microbiológicos e planos
    de amostragem. 14. Epidemiologia: definições, conceitos, princípios e propósitos.
    15. Metodologia epidemiológica: fase descritiva, coleta de dados, fase analítica,
    medidas de morbidade e mortalidade. 16. Biologia molecular aplicada à microbiologia
    dos alimentos. 17. Métodos rápidos em microbiologia dos alimentos. 18. Aulas práticas
    para pesquisa e enumeração de microrganismos patogênicos e indicadores de contaminação
    nos alimentos: preparo de amostras, técnicas de diluição decimal, métodos de detecção
    e enumeração em placas e tubos.'
  course_name: 'LAN0330 - Microbiologia dos Alimentos e Epidemiologia das Doenças
    Veiculadas por Alimentos

    Food Microbiology and Epidemiology of Foodborne Illnesses'
  deactivation: 31/12/2023
  instructors: 7643900 - Daniele Fernanda Maffei
  lecture_credits: '8'
  objectives: Propiciar o aprendizado de conceitos de microbiologia dos alimentos.
    Estudar a importância dos micro-organismos benéficos, deteriorantes e patogênicos
    em alimentos. Estudar o alimento como ecossistema microbiano e o controle do desenvolvimento
    de micro-organismos. Estudar a disseminação de micro-organismos no ambiente de
    produção e processamento dos alimentos. Compreender os fundamentos de epidemiologia
    em doenças veiculadas por alimentos, estudar os mecanismos de virulência dos principais
    patógenos veiculados por alimentos. Capacitar o futuro profissional a atuar em
    casos de investigações epidemiológicas de surtos de doenças transmitidas por alimentos.
    Compreender critérios microbiológicos e planos de amostragem. Executar técnicas
    de análises microbiológicas de água e alimentos, interpretar resultados e a legislação
    pertinente. Desenvolver competência para adotar medidas preventivas na manipulação,
    industrialização e armazenamento dos alimentos. Estudar os princípios de higienização
    na indústria de alimentos. Despertar para a importância da gestão da segurança
    dos alimentos.
  practical_credits: '1'
  total_workload: 150 h
  type: Semestral
