  course: '1. Introdução à microbiologia dos alimentos. 2. Alimento como ecossistema:
    fatores intrínsecos e extrínsecos que afetam o desenvolvimento microbiano. 3.
    Epidemiologia: definições, conceitos, princípios e propósitos, alimentos como
    veículos de infecções, intoxicações e toxinfecções alimentares. 4. Saúde: definição
    saúde-doença, agentes, hospedeiros e meio-ambiente, portadores, vias de transmissão,
    princípios de infecção, virulência dos agentes, dose infectante, defesas do organismo
    humano, interações entre micro-organismos e seres humanos. 5. Princípios de anatomia,
    histologia e fisiologia do aparelho digestório. 6. Zoonoses e doenças transmitidas
    por alimentos, relações ecológicas dos micro-organismos patogênicos com o alimento
    e o ambiente; principais grupos de patógenos e suas características de multiplicação
    nos alimentos, fontes de contaminação, capacidade de sobrevivência aos processos
    de industrialização/conservação de alimentos. 7. Micro-organismos indicadores.
    8. Metodologia epidemiológica: fase descritiva, coleta de dados, fase analítica,
    medidas de morbidade e mortalidade. 9. Planos de amostragem e critérios microbiológicos.
    10. Termobacteriologia aplicada a alimentos. 11. Microbiologia de hortaliças.
    12. Microbiologia do pescado. 13. Microbiologia de carnes e produtos cárneos.
    14. Microbiologia do leite e derivados. 15. Microbiologia de sucos e outros alimentos.
    16. Microbiologia da água. 17. Biologia molecular aplicada à microbiologia dos
    alimentos. 18. Princípios gerais de higienização, detergentes e sanificantes,
    principais princípios ativos empregados nas indústrias de alimentos. 19. Métodos
    de higienização em indústrias e cozinhas industriais, tipos de sujidades (resíduos
    de alimentos), biofilmes microbianos, sistemas CIP e SIP. 20. Aulas práticas:
    a) micro-organismos indicadores e patogênicos em alimentos - preparo de amostras,
    técnicas de diluição decimal, métodos de detecção e enumeração de micro-organismos
    em placas e tubos; b) higiene e sanitização - preparo de soluções sanificantes,
    uso de detergentes em diferentes sujidades e avaliação do processo de higienização
    pela técnica de amostragem por swab.'
  course_name: 'LAN0330 - Microbiologia dos Alimentos e Epidemiologia das Doenças
    Veiculadas por Alimentos

    Food Microbiology and Epidemiology of Foodborne Illnesses'
  deactivation: ''
  instructors: 7643900 - Daniele Fernanda Maffei
  lecture_credits: '8'
  objectives: Propiciar o aprendizado de conceitos de microbiologia dos alimentos.
    Estudar a importância dos micro-organismos benéficos, deteriorantes e patogênicos
    em alimentos. Estudar o alimento como ecossistema microbiano e o controle do desenvolvimento
    de micro-organismos. Estudar a disseminação de micro-organismos no ambiente de
    produção e processamento dos alimentos. Compreender os fundamentos de epidemiologia
    em doenças veiculadas por alimentos, estudar os mecanismos de virulência dos principais
    patógenos veiculados por alimentos. Capacitar o futuro profissional a atuar em
    casos de investigações epidemiológicas de surtos de doenças transmitidas por alimentos.
    Compreender critérios microbiológicos e planos de amostragem. Executar técnicas
    de análises microbiológicas de água e alimentos, interpretar resultados e a legislação
    pertinente. Desenvolver competência para adotar medidas preventivas na manipulação,
    industrialização e armazenamento dos alimentos. Estudar os princípios de higienização
    na indústria de alimentos. Despertar para a importância da gestão da segurança
    dos alimentos.
  practical_credits: '1'
  total_workload: 150 h
  type: Semestral
