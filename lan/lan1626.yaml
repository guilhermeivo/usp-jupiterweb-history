  course: 'Importância da qualidade química de bebidas. Organização e gerenciamento
    do laboratório de análises. Princípios dos métodos analíticos: sacarimetria, espectrofotometria;
    volumetria de neutralização e de oxi-redução, densimetria, cromatografia líquida
    (CLAE com detectores de IR e UV) e cromatografia gasosa (CG com detectores FID
    e MASSAS). Limpeza de vidrarias e preparo de reagentes. Análises químicas em matérias-primas
    para a produção das diferentes bebidas. Análises em mostos. Prática de fermentação.
    Análises em bebidas fermentadas. Prática de destilação. Análises em bebidas destiladas.
    Prática de envelhecimento em madeiras. Análises em bebidas envelhecidas. Caracterização
    química de bebidas. Principais compostos a serem mensurados em bebidas: açúcares,
    etanol, acidez, furfural, ácidos orgânicos, ésteres, aldeídos, metanol, acroleína,
    álcoois superiores, óleos fúseis, carbamato de etila, compostos fenólicos, compostos
    aromáticos, antocianinas e taninos.'
  course_name: 'LAN1626 - Qualidade Química de Bebidas

    Chemical Quality of Beverages'
  deactivation: ''
  instructors: 543329 - Andre Ricardo Alcarde
  lecture_credits: '4'
  objectives: O aluno compreenderá as técnicas e as metodologias empregadas nas determinações
    analíticas e nas análises químicas envolvidas na garantia e no controle da qualidade
    química de bebidas fermentadas e destiladas, preparando-o para a carreira técnico-científica.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
