  course: 'Agroindústria: avanços e tendências. Conceitos de qualidade. Alterações
    microbianas. Princípios e métodos de conservação de alimentos: Pasteurização e
    Esterilização; Refrigeração e Congelamento Alterações dos alimentos. Procedimentos
    de manuseio para comercialização e armazenamento. Pós colheita e armazenamento
    de frutas, hortaliças, raízes e tubérculos. Armazenamento de grãos e fatores que
    influenciam a pós-colheita de grãos. Micotoxinas e micotoxicoses. Abate e pós-abate
    de bovinos e suínos. Qualidade e tecnologia de carnes. Pós- captura, conservação
    e tecnologia do pescado. Processamento de leite e derivados. Normas e regulamentos
    técnicos na indústria de alimentos.'
  course_name: 'LAN0440 - Qualidade e Processamento de Alimentos

    Food Quality and Processing'
  deactivation: ''
  instructors: 2540671 - Carmen Josefina Contreras Castillo
  lecture_credits: '2'
  objectives: 'Ao final da disciplina o aluno deverá ser capaz de: a) compreender
    os princípios que podem alterar a vida útil das matérias primas alimentares processadas,
    visando a melhor qualidade e evitando perdas na cadeia produtiva. b) Identificar
    os principais agentes de alteração de alimentos e produtos alimentícios. c) Identificar
    e interpretar a legislação da área.'
  practical_credits: '1'
  total_workload: 60 h
  type: Semestral
