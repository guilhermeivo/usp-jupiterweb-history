    de textos, São Paulo.'
  course: "Processo de avaliação de impactos ambientais: Histórico e evolução do processo\
    \ de avaliação ambiental no Brasil. Legislação do licenciamento ambiental. Competência\
    \ dos órgãos federais, estaduais e municipais no licenciamento ambiental. O processo\
    \ e etapas do licenciamento ambiental. Licenciamento ambiental com avaliação de\
    \ impactos ambientais. Estudos ambientais: Conceituação de impactos ambientais.\
    \ Ações humanas, aspectos e impactos ambientais. Estrutura do EIA/RIMA e RAP.\
    \ Caracterização do empreendimento. Diagnóstico ambiental dos meios físico, biótico\
    \ e sócio-econômico. Classificação dos impactos ambientais. Análise de impactos\
    \ ambientais. Medidas mitigadoras e compensatórias. Programa de monitoramento,\
    \ acompanhamento e gestão de impactos ambientais. Elaboração e análise dos EIA/RIMA\
    \ através de estudos de casos (estudos dirigidos).\nObs:\nEIA\t-  Estudo de Impacto\
    \ Ambiental\nRIMA\t-  Relatório de Impacto Ambiental\nRAP\t-  Relatório Ambiental\
    \ Preliminar"
  course_name: 'LCF1697 - Gestão de Impactos Ambientais

    Environmental Impact Assessment'
  deactivation: ''
  instructors: 836301 - Katia Maria Paschoaletto Micchi de Barros Ferraz
  lecture_credits: '4'
  objectives: 2.1.Conscientizar o aluno sobre a importância do processo de avaliação
    e gestão de impactos ambientais. 2.2.Fornecer aos alunos instrumentos técnico-científicos
    que o capacitem a compreender o processo de avaliação de impactos ambientais.
    2.3.Capacitar o aluno sobre a estrutura e funcionamento do EIA/RIMA. 2.4.Preparar
    o aluno para participar em equipes na elaboração do EIA/RIMA. 2.5.Capacitar o
    aluno para o gerenciamento de trabalhos de elaboração dos EIA/RIMA
  practical_credits: '1'
  total_workload: 90 h
