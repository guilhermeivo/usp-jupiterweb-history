  course: '1. A certificação como um instrumento de gestão sustentável

    2. Sistemas de Certificação Florestal Objetivos, requisitos, entidades envolvidas
    e programas aplicáveis FSC e PEFC-CERFLOR

    3. Princípios & Critérios do FSC

    4. Processo de Elaboração de um Padrão Internacional e de adaptação local. Padrões
    Válidos no Brasil e Hierarquia do padrão.

    5. Auditoria: Tipos, métodos de amostragem e fases.

    6. Certificação de Cadeia de Custódia

    7. Contexto social global da certificação florestal e Aspectos Sociais e Trabalhistas
    no Contexto da Certificação Florestal,

    8. Contexto econômico global da certificação florestal

    9. Contexto ambiental global da certificação florestal'
  course_name: 'LCF0290 - Certificação Florestal

    Forest Certification'
  deactivation: ''
  instructors: 2151034 - Edson José Vidal da Silva
  lecture_credits: '3'
  objectives: Capacitar os estudantes a compreender, entender e atuar nos diferentes
    processos de certificação em vigência no Brasil, de florestas nativas, plantações
    florestais, e de seus produtos, pensando-se na sustentabilidade das atividades
    florestais.
