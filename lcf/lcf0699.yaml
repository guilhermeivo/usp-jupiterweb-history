  course: 'Unidade I - Resíduos Florestais: Definição de resíduos florestais. Os impactos
    negativos da gestão inadequada dos resíduos florestais. Classificação dos resíduos
    florestais: - quanto à origem: resíduos da exploração madeireira; resíduos do
    processamento da madeira. - quanto ao tipo: resíduos florestais madeireiros; resíduos
    florestais não madeireiros; - quanto a atividade geradora: resíduos da colheita
    da madeira; resíduos da produção de papel e celulose; resíduos do processamento
    primário (serrarias e laminadoras); resíduos da produção de chapas (compensados,
    aglomerados e fibras); resíduos da indústria moveleira; resíduos da produção de
    energia; resíduos da arborização urbana. Unidade II - Aproveitamento de Resíduos
    Florestais: Métodos para avaliação do potencial de aproveitamento de resíduos
    florestais em diferentes produtos, considerando os aspectos tecnológicos, ambientais,
    econômicos, sociais e culturais. Unidade III - Estudos de caso e práticas em aproveitamento
    de resíduos florestais: métodos para desenvolvimento de produtos a partir de resíduos;
    práticas de desenvolvimento de produtos e produção de protótipos. Aproveitamento
    de resíduos em materiais de construç; móveis e pequenos objetos de madeira; fármacos,
    cosméticos e corantes; energia; compostagem; uso agrícola;compósitos poliméricos;reciclagem
    de resíduos florestais pós-consumo; e outros.'
  course_name: 'LCF0699 - Aproveitamento de Resíduos Florestais

    Forest Residues Management'
  deactivation: ''
  instructors: 57417 - Adriana Maria Nolasco
  lecture_credits: '4'
  objectives: Identificar e caracterizar os diferentes tipos de resíduos resultantes
    da colheita e beneficiamento da madeira e produtos florestais não madeireiros.
    Identificar e analisar as implicações ambientais, sócio-econômicas e culturais
    do aproveitamento dos resíduos florestais em diferentes tipos de produtos. Realizar
    estudos de caso e práticas de processo de desenvolvimento de produtos a partir
    de resíduos florestais.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
