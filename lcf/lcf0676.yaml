  course: "1. Importância do Melhoramento Florestal e Histórico e evolução do melhoramento\
    \ florestal no Brasil e no mundo.\n2. Evolução e Genética de populações: Causas\
    \ da variação natural.  Mutação; fluxo gênico; seleção natural; deriva genética.\
    \ Tamanho efetivo populacional\n3.\tPadrões de variação dentro e entre populações\
    \ e indivíduos: a) localidade geográfica. b) sites. c) povoamentos. d) indivíduos.\n\
    4.\tProcedências das sementes e variação genética: importância da procedência\
    \ das sementes - Testes de procedências para essências   exóticas e nativas.\n\
    5. Métodos de melhoramento: a) seleção massal versus genotípica; b) hibridação\
    \ e c) seleção assistida por marcadores moleculares.\n6. Métodos de produção de\
    \ sementes voltados para cálculo de parâmetros genéticos: a) área de coleta de\
    \ sementes. b) área de produção de sementes. c) pomares de sementes. d) testes\
    \ de progênies.\n7. Genética quantitativa - testes de progênies e estimação de\
    \ parâmetros genéticos.\n8. Métodos assexuados: a) importância. b) seleção de\
    \ árvores superiores. c) testes clonais. d) limitações dos métodos.\n9. Uso da\
    \ diversidade genética em conservação e melhoramento florestal: seleção de populações\
    \ x uso do material; conceito de múltiplas populações de cruzamento; estratégias\
    \ de conservação pelo uso.\n10. Uso de ferramentas biotecnológicas e moleculares\
    \ aplicadas a conservação e ao melhoramento florestal.\n11. Estudos de caso I.\
    \ - Melhoramento de Eucaliptos, Pinus, Araucária, Seringueira e outras espécies\
    \ de interesse econômico.\n12. Estudos de caso II. - Melhoramento de espécies\
    \ florestais nativas."
  course_name: 'LCF0676 - Melhoramento Florestal I

    Forest Improvement I'
  deactivation: ''
  instructors: 2801928 - Weber Antonio Neves do Amaral
  lecture_credits: '4'
  objectives: O curso visa dar ao aluno conhecimentos básicos e aplicados sobre os
    principais métodos de melhoramento genético de espécies arbóreas. Por intermédio
    do estudo de variações naturais em essências florestais procura-se motivar o aluno
    para problemas relativos à conservação genética das espécies (in-situ; ex-situ
    e circa-situ) e a utilização racional dos recursos genéticos florestais em programas
    de conservação e melhoramento florestal aplicados a diferentes usos.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
