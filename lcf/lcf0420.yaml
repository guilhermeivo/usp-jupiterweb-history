  course: 'ção Computacional Estruturada:

    -Linguagem Phyton: Definição de variáveis, comandos print e input, estruturas
    de repetição (while, for), comando de opção (if, elif, else), funções, listas,
    operações algébricas, operações com vetores e matrizes.

    -Linguagem C e C++: Instalação IDE-Codeblocks, Definição de variáveis, comando
    printf e scanf, diretivas include, desvios condicionais (If, Else), estruturas
    de repetição (while, for), funções, listas, Operações algébricas, operações com
    vetores e matrizes.

    -Linguagem Visual Basic (VBA), Exel e Macros: guia desenvolvedor, desvios condicionais
    (if then else), estruturas de repetição (do while loop, do until, for next/step,
    for each next. Funções, operações algébricas, operações com vetores e matrizes,
    gráficos.

    Introdução à robótica: adaptação de linguagens ao comando de sensores, comandos
    de operações robotizadas, práticas com arduíno.

    Introdução à mecatrônica, máquinas de comando numérico por computador.'
  course_name: 'LCF0420 - Linguagens Estruturadas e Programação Computacional Orientada
    à Robótica

    STRUCTURED LANGUAGES AND COMPUTATIONAL PROGRAMMING ORIENTED TO ROBOTICS'
  deactivation: ''
  instructors: 74003 - José Nivaldo Garcia
  lecture_credits: '2'
  objectives: 'Oferecer aos alunos a oportunidades de iniciarem-se nas linguagens
    computacionais modernas e na programação orientada à robótica industrial.

    Formar o aluno para avaliar os diferentes processos de industrialização da madeira
    e sua transformação final em bens e produtos, estudando os diversos equipamentos
    de última geração, “layouts” e os conceitos básicos dos principais processos industriais
    adequados às especificidades da matéria-prima. Consolidar conceitos de qualidade
    da madeira associada ao uso final do produto e criar indicadores técnicos de otimização
    de industrias madeireiras.'
  practical_credits: '2'
  total_workload: 90 h
  type: Semestral
