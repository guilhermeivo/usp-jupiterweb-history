  course: 'Noções de estática: conceitos fundamentais, corpo rígido, força, unidades
    de força, composição de forças, decomposição de forças, momento de uma força em
    relação a um ponto, caso geral de forças no plano, força resultante, ponto de
    aplicação da resultante, equilíbrio estático de um corpo, tipos de vínculos, diagrama
    de sólido livre, condições gerais de equilíbrio de um corpo. Características das
    figuras planas: área, centro de gravidade, momento estático, momento de inércia,
    raio de giração. Noções de resistência dos materiais: tração simples e compressão
    em peças curtas (tensão de tração/compressão, deformação, lei de Hooke, diagramas
    de esforço normal). cisalhamento simples (tensão última de cisalhamento e distorção),
    flexão simples (esforço cortante, momento fletor, função geral de momentos; tensões
    normais oriundas da flexão pura, simples, oblíqua e composta;, linha elástica,
    tensões de cisalhamento), compressão em peças esbeltas (comprimento de flambagem,
    índice de esbeltez, carga crítica de flambagem). Propriedades mecânicas da madeira:
    resistência à compressão paralela, módulo de elasticidade na compressão paralela,
    resistência e módulo de elasticidade na compressão normal, resistência, resistência,
    módulo de elasticidade e rigidez à flexão estática, resistência ao cisalhamento
    paralelo às fibras, módulo de elasticidade transversal, dureza Janka, resistência
    e módulo de elasticidade à compressão/tração inclinada em relação à direção das
    fibras, fendilhamento longitudinal, tabelas de valores das propriedades físicas
    e mecânicas de madeiras brasileiras e correlações entre elas. Especificações para
    o cálculo de peças e estruturas de madeira: cargas permanentes (externas, peso
    próprio dos elementos), cargas acidentais (sobrecargas, pressão do vento, cargas
    móveis em pontes rodoviárias). Verificação da estabilidade das estruturas: estruturas
    isostáticas, vigas maciças, pórticos e estruturas reticuladas, dimensionamentos
    (teoria de vigas, método dos nós e processo de Hitter). Defeitos naturais da madeira:
    Origem e importância nas estruturas e as possíveis formas de minimização de seus
    efeitos através de técnicas construtivas ou de manejo florestal. Dimensionamento
    de ligações: tipos de ligações, tensões na madeira e nas partes metálicas, ligações
    com parafusos, ligações com pregos, ligações com entalhes, tarugos ou cavilhas
    e ligações com adesivos.'
  course_name: 'LCF0623 - Propriedades Mecânicas e Estruturas de Madeira

    Mechanical Properties and Wood Engineering'
  deactivation: ''
  instructors: 74003 - José Nivaldo Garcia
  lecture_credits: '4'
  objectives: Caracterizar mecanicamente as propriedades das madeiras nacionais, estabelecendo
    comparações entre as diversas espécies para indicação de seus fins mais apropriados.
    Mostrar ao aluno a grande possibilidade de utilização da madeira como elemento
    estrutural, introduzindo cálculos e projetos estruturais para o dimensionamento
    de obras como habitações, telhados em geral, pontes e torres de vigia.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
