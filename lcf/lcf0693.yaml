  course: "3.1. Introdução ao estudo de sistemas agroflorestais. O enfoque de análise\
    \ de sistemas. Definição e classificação de SAF. Sistemas agroflorestais tradicionais\
    \ e desenvolvimento de sistemas alternativos de uso da terra envolvendo árvores.\
    \ Os SAFs como alternativa para a promoção do desenvolvimento sustentável. As\
    \ árvores mais propícias para sistemas agroflorestais nas diferentes condições\
    \ ambientais e socioeconômicas. Funções dos sistemas agroflorestais: ecológicas,\
    \ econômicas e sociais. Particularidades das condições tropicais (de superúmidas\
    \ até áridas), sub-temperadas e temperadas; 3.2. Diagnose e o desenho de sistemas\
    \ agroflorestais. Avaliação de terras e climas e introdução à analise de sistemas\
    \ de uso da terra baseados em zoneamento ecológico. Identificação de limitações\
    \ e oportunidades para os sistemas agroflorestais. Seleção do SAF com base na\
    \ função: aumento de produtividade (o conceito de captura de recursos e uso de\
    \ fatores de produção), proteção do solo contra a degradação e mananciais, sombreamento\
    \ e proteção de plantas e animais consorciados, diversificação da receita e de\
    \ produtos gerados (lenha, banco de proteínas para animais, madeira, caça, etc.),\
    \ estética e enriquecimento da paisagem (eco-turismo e turismo rural), preservação\
    \ da biodiversidade e da vida silvestre (diversidade e resiliêcia em sistemas\
    \ agroecológicos, entorno e corredores para áreas de preservação). Determinação\
    \ de intervenções de manejo, pesquisa e planejamento; 3.3. Principais processos\
    \ envolvidos em sistemas agroflorestais. Princípios de captura e uso dos recursos\
    \ naturais, complementaridade e competição no uso de água, luz e nutrientes, crescimento\
    \ e adaptação aos diferentes ambientes e manejo, a ecologia da intercalação de\
    \ culturas e animais. Modelagem e simulação de SAFS; 3.4. O manejo de sistemas\
    \ agroflorestais. O plantio e condução das árvores, manejo dos subsistemas agrícolas\
    \ e pecuários, crescimento e produtividades do sistema e de seus constituintes,\
    \ alterações morfológicas e fenológicas das plantas consorciadas, podas, plantios\
    \ e colheita em SAF, adaptações tecnológicas e uso de mão de obra. Estudos de\
    \ casos; 3.5. A experimentação em sistemas agroflorestais. O processo de desenvolvimento\
    \ tecnológico. Conceituação sobre pesquisa participativa. Identificação de problemas\
    \ a serem pesquisados: elaboração de questões científicas e definição de hipóteses\
    \ e objetivos de pesquisa. Planejamento e análise de pesquisas em estações experimentais\
    \ e junto a produtores rurais. Formulação dos tratamentos, suas combinações e\
    \ escolha dos desenhos experimentais. O uso de sistemas já implantados em propriedades\
    \ rurais para definição de tecnologias; 3.6. Avaliação de sistemas agroflorestais.\
    \ Avaliação do sistema produtivo com base em: ecologia, biologia, economia, sociologia,\
    \ agronomia, impacto e conservação ambiental. Definição de escalas, temporal e\
    \ espacial, de avaliação. Ponderação dos componentes dos SAFs, práticas envolvidas\
    \ e seus impactos dentro e fora do sistema. Comparação dos SAFs com outros sistemas\
    \ de uso da terra. Valoração da função de proteção dos sub-componentes agrícolas\
    \ e pecuários, do ambiente e da estética da paisagem. Os produtos socioambientalmente\
    \ apropriados, sua certificação e valorização; 3.7. A extensão com sistemas agroflorestais.\
    \ SAF como uma inovação tecnológica e como um processo de uso tradicional da terra.\
    \ Nichos potencialmente favoráveis para SAFs. Treinamento de técnicos locais.\
    \ Envolvimento da comunidade. Técnicas de comunicação e extensão no meio rural;\
    \ 3.8 \x96 Etnoecologia e processos participativos. A importância do conhecimento\
    \ de populações tradicionais. Sistemas de manejo tradicionais. Processos participativos:\
    \ importância e métodos. Estudos de caso."
  course_name: 'LCF0693 - Sistemas Agroflorestais

    Agroforestry Systems'
  deactivation: 31/12/2023
  instructors: '374151 - Ciro Abbud Righi

    2086021 - Marcos Silveira Bernardes'
  lecture_credits: '4'
  objectives: 'Avaliar o conceito do uso da terra por meio da compreensão dos sistemas
    agroflorestais (SAFs) e desenvolver a habilidade e capacidade do aluno para: 1.
    diagnosticar as limitações apresentadas por um sistema; 2. determinar os mecanismos
    de intervenção e; 3. viabilizar a sua implementação. O conhecimento adquirido
    deverá permitir a atuação do profissional nas diferentes escalas de um sistema
    agroflorestal - de seus componentes, na escala de propriedade rural, de paisagem
    e regional. Para tal, devem contar com conhecimento nas interações biofísicas
    e fisiológicas entre os componentes (árvores, culturas, animais) e econômicas
    e sociais, e possuir habilidade para interligar disciplinas de diferentes áreas
    do conhecimento como botânica, solos e nutrição, fisiologia vegetal e animal,
    agrometeorologia e economia. Ao final do curso os alunos deverão ser capazes de
    atuar em sistemas agroflorestais nos domínios da extensão rural, da pesquisa biológica
    e sociológica, e do planejamento.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
