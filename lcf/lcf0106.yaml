  course: "1. A Engenharia Florestal como Profissão:\n1.1. Posição da Engenharia Florestal\
    \ na Agricultura; 1.2. Principais atribuições da Engenharia Florestal; 1.3. Importância\
    \ da Engenharia Florestal no desenvolvimento do país; 1.4. Importância da Engenharia\
    \ Florestal na conservação da natureza;\n1.5. O Engenheiro Florestal como profissional.\n\
    2-A Escola na formação do Engenheiro Florestal:\n2.1. As escolas de Engenharia\
    \ no Brasil e no Mundo; 2.2. História da ESALQ; 2.3. O Curso de Engenharia Florestal\
    \ na ESALQ;\n2.4. O Departamento de Ciências Florestais no Curso de Engenharia\
    \ Florestal da USP; 2.5. O currículo mínimo da Engenharia Florestal;\n2.6. O significado\
    \ das disciplinas essenciais e optativas; 2.7. disciplinas essenciais do Curso\
    \ de Engenharia Florestal na USP;\n2.8. As disciplinas optativas do Curso de Engenharia\
    \ Florestal na USP;\n3.O Departamento de Ciências Florestais na formação do Engenheiro\
    \ Florestal e os camos profissionais do Engenheiro Florestal:\n3.1.A área de Silvicultura;\
    \ 3.2.\tA área de Melhoramento e Produção de Sementes Florestais; 3.3. A área\
    \ da Ecologia Aplicada;\n3.4. A área de Planejamento Florestal; 3.5. A área de\
    \ Tecnologia e Industrialização da Madeira; 3.6. Ensino de Graduação e Pós-Graduação;\
    \ 3.7. As atividades de pesquisa; 3.8. A extensão de serviços à comunidade.\n\
    6.A situação florestal brasileira e a importância da silvicultura intensiva:\n\
    6.1.\tProdução e consumo de madeira por setores; 6.2. Quantificação e distribuição\
    \ das reservas florestais; 6.3.Silvicultura tradicional x Silvicultura intensiva;\n\
    7.Floresta:\n7.1.\tEstrutura; 7.2. Funcionamento; 7.3. Classificação;\n8.Escolha\
    \ de espécies arbóreas para formação de maciços florestais:\n8.1. Espécie nativa\
    \ e espécie exótica; 8.2. Escolha das espécies para plantio; 8.3. Condições climáticas\
    \ e edáficas;\n10.Introdução ao Manejo Florestal:\n10.1. Conceitos; 10.2. Técnicas\
    \ de manejo;\n11. Teoria dos sistemas e Conceitos de Cadeia Produtiva:\n11.1.\
    \ Teoria dos sistemas; 11.2. Conceitos de Cadeia Produtiva; 11.3. Ambiente Empresarial;\
    \ 11.4. Ambiente Institucional; 11.5. Ambiente Organizacional; 11.6. Fluxos internos\
    \ e externos.\n12. Arranjos Cooperativos de Produção Industrial:\n12.1 Histórico\
    \ dos Arranjos Cooperativos; 12.2. Governança Compartilhada e Governança Hierárquica;\
    \ 12.3. Tipologias Básicas (Distritos Industriais, Clusters, Parques Tecnológicos,\
    \ Incubadoras de Empresas, Arranjos Produtivos Locais); 12.4. Políticas Públicas.\n\
    13. Principais Cadeias Produtivas de Base Florestal:\n13.1. Indústrias de Base\
    \ Florestal; 13.2. Cadeia Produtiva de Celulose e Papel, 13.3. Cadeia Produtiva\
    \ do Carvão Vegetal; 13.4. Cadeia Produtiva dos Produtos de Maior Valor Agregado;\
    \ 13.4.1. Móveis; 13.4.2. Painéis a base de Madeira; 13.4.3. Pisos de Madeira;\
    \ Componentes para a Construção Civil; 13.5. Cadeias Produtivas de Produtos Florestais\
    \ não Madeireiros."
  course_name: 'LCF0106 - Introdução à Engenharia Florestal

    Introduction to Forestry Engineering'
  deactivation: ''
  instructors: '4864078 - Demóstenes Ferreira da Silva Filho

    75175 - Ivaldo Pontes Jankowsky'
  lecture_credits: '3'
  objectives: '1- Orientar o aluno sobre as diversas áreas de atuação e locais de
    trabalho do Engenheiro Florestal. 2- Informar o aluno sobre sua Escola e seu Currículo.
    3- Caracterizar a importância do setor florestal brasileiro. 4- Dar noções sobre
    Silvicultura e múltiplos usos da floresta. 5- Apresentar uma visão sistêmica da
    indústria de base florestal, aplicando os conceitos de cadeia produtiva.

    6- Conhecer as principais cadeias produtivas de base florestal.'
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
