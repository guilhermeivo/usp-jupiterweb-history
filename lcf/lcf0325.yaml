  course: Introdução. Apresentação dos objetivos do curso, da metodologia de trabalho
    e das tarefas. Generalidades sobre a nutrição das árvores. Princípios e métodos
    experimentais da nutrição mineral das árvores. Macro e Micro-nutrientes. Critérios
    de essencialidade. Métodos experimentais. Absorção e transporte mineral das árvores.
    Absorção e transporte celular. Regiões de absorção. Mecanismos. Transporte a longa
    distância.Xilema. Floema. Função e metabolismo dos nutrientes. Macronutrientes.
    Micronutrientes. Metabolismo do nitrogênio. Fixação. Assimilação. Nutrientes minerais
    e o controle de crescimento e do desenvolvimento das árvores. Crescimento vegetativo.
    Crescimento reprodutivo. Qualidade dos produtos florestais. Problemas edáficos
    e aspectos da diagnose mineral em florestas. Aspectos genéticos. Aspectos ecológicos.
  course_name: 'LCF0325 - Nutrição Mineral das Árvores

    Tree Mineral Nutrition'
  deactivation: ''
