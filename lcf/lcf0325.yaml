  objectives: "O curso se propõe a atingir os seguintes objetivos :\na) Propiciar\
    \  a compreensão dos processos da nutrição mineral\ndas árvores.\nb)\tExplicar\
    \  os mecanismos de regulação dos processos da       nutrição mineral no controle\
    \ do crescimento e do       desenvolvimento das árvores, produtividade e qualidade\
    \ dos       produtos florestais."
