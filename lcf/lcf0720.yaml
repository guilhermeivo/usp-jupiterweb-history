  course: '* Introdução: Avaliação do local para instalação de viveiros florestais;

    * Infraestrutura de viveiro;

    * Recipiente e Substrato;

    * Qualidade da água e fertilização de mudas;

    * Propagação sexuada;

    * Propagação assexuada (cultura de tecido, macro e micro propagação, técnicas
