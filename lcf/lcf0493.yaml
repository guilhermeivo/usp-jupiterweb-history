  course: '1. A degradação de ecossistemas naturais e o comprometimento da oferta
    de produtos florestais e serviços ambientais; 2. Histórico da silvicultura de
    espécies nativas no Brasil e perspectivas futuras; 3. Legislação ambiental aplicada
    à silvicultura de espécies nativas; 4. Projetos de recuperação de ecossistemas
    florestais no âmbito da certificação ambiental, florestal e agrícola; 5. Diagnóstico
    e zoneamento ambiental, social e legal para o planejamento das ações de recuperação
    florestal; 6. Restauração florestal; 7. Procedimentos operacionais associados
    à silvicultura de espécies nativas; 8. Restauração de fragmentos florestais degradados;
    9. Sistemas Agroflorestais; 10. Avaliação e monitoramento de áreas em processo
    de recuperação florestal; 112. Produção florestal em áreas de Reserva Legal; 12.
    Pagamento por serviços ambientais: conceitos, aplicações e estudos de caso; 1413.
    Produção de mudas de espécies florestais nativas.'
  course_name: 'LCF0493 - Silvicultura de Espécies Nativas

    Forestry Native Species'
  deactivation: ''
  instructors: 3490066 - Pedro Henrique Santin Brancalion
  lecture_credits: '3'
  objectives: Capacitar os alunos para conceber, implantar e conduzir projetos de
    silvicultura de espécies nativas dentro de uma abordagem integrada dos aspectos
    ecológicos, legais, econômicos e sociais.
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
