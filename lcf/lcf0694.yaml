  course: 'A certificação florestal é um processo que resulta em um certificado escrito
    e conferido por uma entidade independente, para atestar que uma floresta em particular
    é manejada de forma sustentável e que a madeira foi produzida de acordo com recomendações
    florestais e padrões ambientais adequados. Os esquemas podem incluir rotulagem
    ou certificação de cadeias de custódia desenhadas para assegurar ao consumidor
    que a madeira comprada é proveniente de uma floresta manejada de forma sustentável.  Certificação
    é um conceito que tenta oferecer vantagens de mercado para aqueles que investem
    em práticas sustentáveis do ponto de vista ambiental, econômico e social. Uma
    das iniciativas de certificação florestal foi desenvolvido pelao Forest Stewardship
    Council (FSC), uma organização internacional sem fins lucrativos, fundada em 1993,
    constituída por um grupo de representantes de entidades sociais, ambientais, madeireiras
    e de profissionais florestais de várias partes do mundo. Uma outra grande iniciativa
    é o PEFC ( Programme for the Endorsement of Forest Certification) uma organização
    não-governamental dedicada a promover o manejo flotrestal sustentável (MFS)através
    da certificação florestal de terceira parte. Tanto o FSC como o PEFC desenvolveram
    uma série de princípios e indicadores de sustentabilidade do manejo florestal,
    que os gestores florestais devem atender para ter as suas florestas certificadas.  A
    idéia por trás desses princípios é que funcionariam igualmente em todas as florestas
    e plantios florestais em qualquer parte do mundo, seja ele tropical, temperado
    ou boreal.  Dessa forma, reconhece certificadores em diversas partes do mundo
    sob rígidos critérios de homologação para que estes se ofereçam profissionalmente
    como certificadores.

    A série ISO 14000 é uma série de padrões internacionais sobre gestão ambiental.  Essa
    série oferece um marco referencial para o desenvolvimento de um sistema de gestão
    ambiental e de suporte a programas de auditagem.  O principal estímulo para a
    sua divulgação veio da Eco92 realizada no Rio pelas Nações Unidas.  Com a proliferação
    de padrões nacionais próprios, a Organização Internacional de Padronização (ISO
    – International Organization for Standardisation) criou um grupo para pesquisar
    como tais padrões poderiam beneficiar os negócios e a indústria.  E como resultado
    esse grupo recomendou que um comitê ISO criasse um único padrão internacional.  O
    padrão ISO 14001 é a pedra angular da série ISO 14000, e define uma referência
    para a certificação de Sistemas de Gestão Ambiental por terceiros.  Fazem parte
    da série ISO 14000: a ISO 14004 (um guia para o desenvolvimento e implementação
    de Sistemas de Gestão Ambiental); as ISO 14010, 14011 e 14012 (substituídas pela
    ISO 19011 e que definem princípios gerais, orientações para a auditagem, e critérios
    de qualificação de auditores ambientais); a ISO 14013/5 (com material para desenvolvimento
    de um programa de auditagem, levantamento e revisão); a ISO 14020+ (para questões
    de rotulagem); a ISO 14030+ (orienta a definição de metas de desempenho e de monitoramento
    em um Sistema de Gestão Ambiental); e a ISO 14040+ (para questões relativas à
    definição de ciclo de vida).  Depois da análise de cada documento de referência
    básica, estudos de caso também serão analisados para uma completa compreensão
    dos processos de normatização ambiental.'
