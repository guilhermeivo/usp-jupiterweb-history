  objectives: A sustentabilidade dos recursos florestais e o conceito de manejo florestal
    sustentável (MFS) impõem o atendimento simultâneo de aspirações ambientais, econômicas
    e da comunidade.  O objetivo deste curso é prover os meios para aumentar os conhecimentos
    dos alunos sobre os processos florestais de certificação e de normatização ambiental
    (série ISO 14000).
