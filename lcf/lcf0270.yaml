  course: "Módulo 1: Histórico do ambientalismo e da EA e as atuais políticas públicas\
    \ de educação ambiental  no Brasil:\n-Introdução à disciplina: Levantamento das\
    \ expectativas em relação ao curso; apresentação dos módulos da disciplina e formas\
    \ de avaliação;\n-Introdução ao histórico e contextualização da EA: Estudo preliminar\
    \ do contexto político/histórico e cultural da EA e debate sobre as atuais políticas\
    \ públicas de EA no Brasil (Política Nacional de EA; Política Estadual de EA e\
    \ Programa Nacional de EA).\nMódulo 2: Fundamentos teórico-metodológicos da EA\n\
    Análise dos eixos temáticos com base em leitura prévia de textos recomendados:\n\
    - pedagogia da práxis e emancipação social;\n- educação ambiental crítica e sustentabilidade;\n\
    -\tdimensões humanas da conservação da biodiversidade;gestão ambiental participativa;\n\
    - EA junto ao público infantil e a dimensão lúdica da EA\nMódulo 3: Introdução\
    \ à elaboração de projetos e análise de  experiências de EA em curso\n-\tSeminário:\
    \ apresentação de trabalhos dos grupos\n-\tAnálise de projetos de EA e das principais\
    \ vertentes da EA no Brasil e no mundo\n-\tSíntese do curso e avaliação coletiva\
    \ da disciplina"
  course_name: 'LCF0270 - Educação Ambiental

    Environmental Education'
  deactivation: ''
  instructors: 2917121 - Teresa Cristina Magro Lindenkamp
  lecture_credits: '4'
  objectives: "Promover a continuidade e a permanência de processos educativos por\
    \ meio dos quais o indivíduo e a coletividade constroem valores sociais, conhecimentos,\
    \ habilidades, atitudes e competências voltadas para a conservação do meio ambiente;\
    \ Contribuir para o desenvolvimento de uma compreensão integrada do meio ambiente\
    \ em suas múltiplas e complexas relações, considerando a interdependência entre\
    \ o meio natural, o sócio-econômico e o cultural; Estimular o fortalecimento de\
    \ uma consciência crítica sobre a problemática sócio-ambiental, vinculando a educação\
    \ à ética, ao trabalho e às práticas sociais; Analisar a importância do incentivo\
    \ à participação individual e coletiva na preservação do equilíbrio do meio ambiente\
    \ por meio do fortalecimento do exercício da cidadania; Trabalhar uma abordagem\
    \ articulada das questões ambientais locais, regionais, nacionais e globais considerando\
    \ a diversidade individual e cultural e o pluralismo de idéias e concepções pedagógicas\
    \ na perspectiva da inter, multi e transdisciplinaridade (adaptado da Política\
    \ Nacional de Educação Ambiental \x96 PNEA);"
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
