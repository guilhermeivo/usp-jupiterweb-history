  course: '.Introdução e importância. Localização das plantas produtoras de madeira
    no Reino Vegetal. Dendrologia das angiospermas(folhosas) nativas e exóticas: ocorrência
    no país de origem e distribuição no Brasil;  características da organografia e
    anatomia, crescimento e desenvolvimento em diferentes condições, variação existentes
    entre e dentro das espécies, reconhecimento através dos constituintes do vegetal.Dentrologia
    das gymnospermas (coníferas) nativas e exóticas:ocorrência no país de origem e
    distribuição no Brasil; características da organografia e anatomia, crescimento
    e desenvolvimento em diferentes condições, variação existente entre e dentro das
    espécies, reconhecimento através dos constituintes do vegetal.'
