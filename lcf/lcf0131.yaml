  course: 'Importância da Informação Espacial; Sistemas de coordenadas / Sistemas
    de projeção; Unidades para medidas lineares e de área; Cartografia básica; SIG:
    definição, tipos, softwares, visão geral do ARCGIS; GPS: Sistema; Receptores;
    Conceitos de Sensoriamento remoto.Fontes de dados digitais e analógicos; Digitalização
    de mapas; Escanerização; Vetorização; GPS: Coleta de dados no campo; Imagens:
    fonte de dados, tipos, formatos; Georeferenciamento de imagens digitais. Coleta
    de pontos de controle; Cálculo do erro aceitável. Conceito de raster; Imagens
    multiespectrais, infravermelho próximo e fisiologia. Classificação supervisionada
    e geração de mapas temáticos por meio de Raster; Pratica com classificação de
    imagens com o Multispec  usando imagens de altíssima definição e infravermelho
    próximo. ArcGIS; Projeto; Layers; Simbologia; Plotagem de pontos do campo; Consultas.
    Adição de atributos; Edição, manutenção de tabelas; Associação. Estrutura do Cadastro
    florestal; Consultas por atributos; Consultas espaciais. Banco de dados relacional.
    Criação, edição e manutenção de bases cartográficas. Digitalização de curvas de
    nível; Preparação do MDT; Derivação de declividade e exposição. Uso de buffers
    na delimitação de APP; Álgebra de mapas vetoriais; Sobreposição de mapas; Aplicações:
    adequação ambiental,  traçado de estradas, demarcação de talhões, silvicultura
    de precisão.'
  course_name: 'LCF0131 - Gestão de Informações Espaciais em Atividades Florestais

    Spatial Information Management in Forestry'
  deactivation: ''
  instructors: 2058395 - Sílvio Frosini de Barros Ferraz
  lecture_credits: '3'
  objectives: a) fornecer conceitos básicos sobre SIG, incluindo estrutura de dados
    espaciais, projeções de mapas; sistemas de coordenadas; sensoriamento remoto e
    sistemas de posicionamento global; b) instruir alunos a criação de bases cartográficas
    com a utilização de interpretação de imagens e levantamentos com GPS; c) demonstrar
    como a tecnologia de informação espacial pode ser utilizada para solução de problemas
    reais no manejo de recursos naturais; d) realizar exercícios práticos que subsidiem
    trabalhos de outras disciplinas do currículo.
  practical_credits: '2'
  total_workload: 105 h
  type: Semestral
