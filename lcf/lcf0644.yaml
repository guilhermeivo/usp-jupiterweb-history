    3.5..   Manejo dos Recursos Hídricos e de Bacias Hidrográficas; Poluição dos Solos
    e da Água; Matas Ciliares; 3.9.  Fontes Energéticas e seus Reflexos Ecológicos
    sobre os Ecossistemas Terrestres e Aquáticos; 3.10. Impactos Humanos sobre o Ambiente;
    As Queimadas; O Desflorestamentos e a Desertificação; Efeito Estufa e Alterações
    Climáticas; Emissão e Fixação de Cor; Camada de Oxigênio.'
