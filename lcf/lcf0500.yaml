    v.79, 477-487.'
  course: "1.\tModelos em Mensuração e Manejo Florestal: conceitos e estrutura dos\
    \ modelos empíricos. Relação hipsométrica. Equações de volume e de biomassa. Modelos\
    \ de sortimento da produção. Equações de produção. Modelos de crescimento e produção.\
    \ Modelos de mortalidade. Modelos de regeneração e ingresso.\n2.\tDistribuição\
    \ de probabilidades: conceito, estrutura e simulação. Distribuições discretas:\
    \ binomial, poisson, binomial negativa. Distribuições contínuas: exponencial,\
    \ Gaussiana, log-normal, Weibull, gama.\n3.\tModelos com parâmetros constantes:\
    \ estimação de parâmetros, avaliação e comparação de modelos.  Modelos de distribuição\
    \ de diâmetros.\n4.\tModelos binomiais e poisson: estimação, avaliação e comparação\
    \ de modelos. Modelos de mortalidade e de regeneração.\n5.\tModelos Gaussianos:\
    \ estimação, avaliação e comparação de modelos. Relação hipsométrica. Equações\
    \ de volume e biomassa. Modelos de crescimento e produção no nível de arboreto."
  course_name: 'LCF0500 - Fundamentos de Biometria Florestal

    Fundamentals of Forest Biometrics'
  deactivation: ''
  instructors: '39751 - Hilton Thadeu Zarate do Couto

    86793 - João Luis Ferreira Batista'
  lecture_credits: '3'
  objectives: 'Os objetivos são: (1) que os alunos conheçam os fundamentos da construção
    de modelos empíricos aplicados à mensuração e ao manejo de florestas nativas e
    plantadas, compreendendo os princípios e os métodos biométricos de construção;
    (2) que os alunos sejam capazes de  construir modelos empíricos simples a partir
    de dados de mensuração florestal, adquirindo para isso  proficiência no ambiente
    computacional R (software R).'
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
