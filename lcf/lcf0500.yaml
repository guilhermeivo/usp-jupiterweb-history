  bibliography: 'Complementar:

    Colbert, J.J. ; Schuckers, M.; Fekedulegn, D.; Rentch, J.; MacSiúrtáin, M.; Gottschalk,
    K.  2004  Individual tree basal-area growth parameter estimates for four models.  Ecological
    Modelling, v.174, p.115-126.

    Maguire, D.; Mainwaring, D. & Halpern, C.  2006 Stand dynamics after variable-retention
    harvesting in mature Douglas-fir forests of Western North America. Allg. Forst-
    u. J.-Ztg., v.177, p.120-131.

    Müller, I.; Finger, C. A. G.; Schneider, P. R.  2005  Forma do tronco e sortimento
    de madeira de Eucalyptus grandis Hill ex Maiden, na região do Sudeste do Estado
    do Rio Grande do Sul. Ciência Florestal, v.15, p.293-305.

    Parresol, B.R. 2001  Additivity of nonlinear biomass equations.  Canadian Journal
    of Forest Reseach, v.31, p.865-878.

    Thiersch, C. R.; Scolforo, J. R.; Oliveira, A. D. d.; Maestri, R.; Dehon, G.   2006  Acurácia
    dos métodos para estimativa do volume comercial de clones de Eucalyptus sp, Cerne,
    v.12, p.167-181.

    Vieira, S.A. Et alii  2008 Estimating biomass and carbon: the case of the Atlantic
    Forest.  Biota Neotropica, v.8, p.21-29.

    Zianis, D.; Radoglou, K.  2006 Comparison between empirical and theoretical biomass
