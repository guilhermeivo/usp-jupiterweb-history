  course: 'Aula 1. Empreeendedorismo: conceitos fundamentais, liderança, competências,
    ambientes para empreender e mudanças de comportamento;

    Aula 2. Empreendedorismo e inovações: sociais, tecnologias, de impacto e de valor;

    Aula 3. Processos de transformação de ideias em projetos e novos negócios: conceitos
    e práticas;

    Aula 4. Metodologias e elaboração de modelos e planos de negócios: BMG, VPC, Design
    Thinking, gamificaçāo e outras metodologias;

    Aula 5. Financiamento e investimentos: anjos, crowdfunding, venture capital, private
    equity;

    Aula 6. Ecossistemas de inovação, start-ups, aceleradoras e corporate vendure;

    Aula 7. Atores-chave, organizações, e instituições associadas ao empreendedorismo
    e inovação;

    Aula 8. Empreendedorismo: casos e exemplos em bioeconomia: da agricultura, florestas,
    biodiversidade e outras áreas afins;

    Aula 9. Identificando e capturando o valor empreendedor: estratégias, metodologias
    e ferramentas;

    Aula 10 e Aula 11. Conceitos e oportunidades para empreender em economia circular;

    Aula 12 a 15. Elaboração, estruturação e apresentação de planos de negócios e
    modelos de negócios circulares.'
  course_name: 'LCF0600 - Empreendedorismo e Inovação Circular em Bioeconomia

    Entrepreneurship and circular innovation in bioeconomy'
  deactivation: ''
  instructors: 2801928 - Weber Antonio Neves do Amaral
  lecture_credits: '3'
  objectives: 'a) Proporcionar aos alunos de graduação conceitos fundamentais, metodologias,
    ferramentas e exemplos de empreendedorismo, transformando idéias em valor e negócios
    sustentáveis.

    b) Criar condições para que os alunos utilizem conceitos e exemplos de outras
    disciplinas, a partir de uma visão transdisciplinar para lhes dar suporte e criar
    condições para que os mesmos desenvolvam uma visão empreendedora.'
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
