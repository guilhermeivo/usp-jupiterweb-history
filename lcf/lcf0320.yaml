  course: Geotecnologias aplicadas a caracterização ambiental; análise estatística
    de amostragens de campo; relação entre estrutura do solo e clima; efeitos fisiológicos
    de doenças e pragas florestais; ecofisiologia das árvores e sua influência das
    características físicas da madeira. Efeito da nutrição do solo para a proteção
    florestal.
