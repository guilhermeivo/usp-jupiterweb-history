  course: 'Módulo 1: Legislação ambiental e florestal

    Introdução à legislação ambiental: hierarquia das leis; princípios do direito
    ambiental, esclarecimentos sobre como ler uma lei; Política Nacional do Meio Ambiente
    (LEI 6938 DE 31/08/1981) e órgãos gestores; Código Florestal Brasileiro: histórico
    e contextualizarão da lei, análise dos principais capítulos da lei (APP e RL),
    os decretos CONAMA mais usados, a implementação (órgãos gestores); Estudos de
    caso sobre o cumprimento, ou não, da legislação e suas consequências.

    Módulo 2: Políticas públicas que regulamentam as florestas brasileiras

    Administração Pública do Setor Florestal e Ambiental: órgãos responsáveis pelo
    Setor. Forma de atuação dos órgãos ligados à administração pública do Setor. Política,
    programas/projetos em andamento (Gestão de Florestas Públicas e o Serviço Florestal
    Brasileiro); Política Nacional de Florestas e políticas locais; Programa de Microbacias
    Hidrográficas e Política Estadual de Meio Ambiente; Propostas de uso da APP e
    RL e possíveis fontes de financiamento da restauração.

    Módulo 3: Educação e outros instrumentos de políticas públicas

    Instrumentos de Políticas Públicas; Educação Ambiental e Extensão Florestal; Cidadania,
    participação e política florestal. Utopias, estado-nação contemporâneo e cenários
    de futuro.'
  course_name: 'LCF0679 - Políticas Públicas,  Legislação e Educação  Florestal

    Forest Education, Public Policies and Legislation'
  deactivation: ''
  instructors: 85364 - Luiz Carlos Estraviz Rodriguez
  lecture_credits: '3'
  objectives: 'Apresentar histórico das políticas públicas e da legislação florestal
    no Brasil analisando sua relação com o direito e a educação ambiental, em geral;
    Estudar as principais leis e políticas públicas relacionadas às florestas brasileiras:
    a Constituição Federal, o Código Florestal, a Política Nacional do Meio Ambiente
    e as Políticas Setoriais; Analisar a hierarquia das normas e os instrumentos de
    políticas públicas; Apresentar os principais órgãos colegiados brasileiros que
    compõem o SISNAMA e discutir sobre a competência desses colegiados na regulamentação
    de florestas no Brasil, os programas e projetos em andamento e os canais de participação
    social na conservação da biodiversidade existentes; Debater as principais dificuldades
    e estratégias da restauração florestal, sobretudo no que diz respeito à área de
    preservação permanente (APP) e Reserva Legal (RL); Apresentar experiências de
    políticas públicas que obtiveram êxito, as dificuldades encontradas e possíveis
    formas de financiamento; Analisar o papel da educação no contexto florestal.'
  practical_credits: '1'
  total_workload: 75 h
