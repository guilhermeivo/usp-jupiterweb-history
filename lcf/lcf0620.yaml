  course: 'Histórico: Fatores e processos de formação dos solos. Características mineralógicas,
    morfológicas, químicas e físicas dos principais tipos de solos utilizados para
    fins florestais. Implicações silviculturais. Reflexos da ciclagem de nutrientes
    sobre a fertilidade e características físicas dos solos: Características climáticas
    e edáficas relacionadas com a ocorrência das principais províncias florestais
    brasileiras: Floresta Tropical Perenifólia, Floresta Tropical Subperenifólia,
    Floresta Tropical Caducifólia, Floresta Caducifólia, Caatinga e Cerrado. Avaliação
    da Fertilidade do Solo. Recomendação de Corretivos e Adubos: amostragem de solo;
    métodos, calibração e interpretação de análises de solo; exigências nutricionais
    das árvores; épocas, dosagens e métodos de aplicação de corretivos e adubos. Métodos
    e indiretos de mapeamento da capacidade produtiva dos sítios florestais em função
    das condições climáticas, fisiográficas, edáficas e de manejo florestal. O sistema
    radicular das árvores: características morfológicas, distribuição no perfil de
    solo e funções.'
  course_name: 'LCF0620 - Solos Florestais

    Forest Soils'
  deactivation: ''
  instructors: 55756 - José Leonardo de Moraes Gonçalves
  lecture_credits: '4'
  objectives: 'Transmitir conhecimentos básicos e aplicados sobre: a) a caracterização
    dos principais tipos de solos usados para fins florestais; b) métodos de manejo
    físico, químico e biológico desses solos; c) o sistema radicular das árvores;
    d) os métodos de classificação da qualidade dos sítios florestais.'
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
