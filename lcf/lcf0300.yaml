  course: '1. OS DESAFIOS DA URBANIZAÇÃO CRESCENTE NO MUNDO, NA AMÉRICA LATINA E NO
    BRASIL: - urbanização, degradação ambiental e qualidade de vida no mundo e na
    América Latina; - os principais problemas urbanos brasileiros e as perspectivas
    para a gestão ambiental urbana no país. 2. IMPACTOS DA URBANIZAÇÃO: - expansão
    urbana e a metamorfose do espaço; - urbanização e e seus efeitos na qualidade
    ambiental intra-urbana; -  poluição sonora e do ar e a qualidade de vida nos centros
    urbanos; - degradação da paisagem e vegetação urbana; - resíduos sólidos como
    um desafio para as cidades. 3.SISTEMAS AMBIENTAIS URBANOS SUSTENTÁVEIS E SEU GERENCIAMENTO
    INTEGRADO: - princípios de sustentabilidade para sistemas urbanos de abastecimento;
    - recuperação de áreas degradadas urbanas através da vegetação; - gestão integrada
    de resíduos sólidos; - Cidades sustentáveis; - Ecovilas - sustentabilidade urbana
    ou utopia? 4. INSTRUMENTOS DE GESTÃO AMBIENTAL URBANA: - a legislação ambiental
    urbana e seus principais instrumentos; - política urbana, plano diretor e zoneamento
    urbano; - Estatuto da Cidade e Agenda 21 e sua contribuição para o planejamento
    e gestão ambiental urbana; - o papel do Estado e a participação social no planejamento
    ambiental urbano; - perspectivas de gestão ambiental em pequenas, média e grandes
    cidade.'
  course_name: 'LCF0300 - Gestão Ambiental Urbana

    Urban Environmental Management'
  deactivation: ''
  instructors: 4864078 - Demóstenes Ferreira da Silva Filho
  lecture_credits: '4'
  objectives: Contribuir para o entendimento da problemática urbana; bem como capacitar
    o aluno para desenvolver e aplicar metodologias para gestão dos problemas ambientais
    urbanos. Além disso, pretende-se que o curso seja um espaço aberto para discussão
    e troca de informações sobre o tema, fomentando uma reflexão e abordagemintegrada
    do assunto e a busca por soluções para os problemas ambientais urbanos.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
