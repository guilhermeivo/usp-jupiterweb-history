  course: 'Principais equipamentos de serraria: Serras de fita, Serras circulares;
    Serras alternativas ou de quadro. Equipamentos auxiliares. Manutenção de ferramentas
    de corte básicas. Técnica de desdobro: Pinus, Eucalyptus (tensões e deformações
    de crescimento, tensões residuais, defeitos originados das tensões de crescimento)
    e nativas. Layouts de serraria. Prognoses de produtividade industrial, produção
    e sustentabilidade florestal. Beneficiamento básico da madeira: equipamentos de
    desbaste e acabamento (plainas, fresas, tupias, furadeiras, tornos e lixadeiras)
    e exigências do produto final. Viga laminada colada (VLC): propriedades mecânicas
    da lâmina, resistência ao cisalhamento(no plano de cola e na madeira maciça),
    emenda dentada colada (finger joint), noções básicas de adesivo e adesão, montagem
    da VLC, propriedades mecânicas da VLC.'
  course_name: 'LCF0650 - Industrialização de Produtos Florestais I

    Forest Product Industrialization I'
