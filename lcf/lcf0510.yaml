    Schreuder, H.T.; Gregoire, T.G.; Wood G.B.; Sampling Methods for Multiresource
    Forest Inventory.  New York: John Wiley & Sons, 446p., 1993.

    Shiver, B.D.; Borders, B.E.;  Sampling Techniques for Forest Resource Inventory.  New
