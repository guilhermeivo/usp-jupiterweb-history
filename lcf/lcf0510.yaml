    pelos autores, 316p., 1997.

    Sanqueta, C.R.; Watzlawick, L.F.; Côrte, A.P.D.; Fernandes, L. de A.V.; Inventários
    Florestais: Planejamento e Execução.  Curitiba: Multi-Graphic Gráfica e Editora,
    270p., 2006.

    Soares, C.P.B.; Paula Neto, F. de; Souza, A.L. de; Dendrometria e Inventário Florestal.
    Viçosa: Editora UFV, 276p., 2006.

    Literatura Complementar:

    Avery, T.E.; H.E. Burkhart; Forest Mensurements. New York: McGraw-Hill, 1983.

