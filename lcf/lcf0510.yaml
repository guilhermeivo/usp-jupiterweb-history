    Spurr, G. Forest inventory. New York, Ronald Press, 1952. 476p.'
  course: 'Definição e tipos de inventário florestal; Finalidades dos levantamentos
    de recursos florestais: comercial, planejamento, abastecimento, pesquisa e conservação;
    Classificação de tipos florestais através de análise por agrupamento; Índice de
    sítio: usos e modelos; Curvas de crescimento: modelos matemáticos; Tamanho e forma
    de parcelas de amostragem; Amostragem simples ao acaso: intensidade da amostragem
    e seleção aleatória; Amostragem simples ao acaso de proporções: determinação do
    erro e intervalo de confiança; Amostragem sistemática: problemas e soluções; Amostragem
    estratificada: determinação da intensidade da amostragem; Estimador de Razão;  Amostragem
    por conglomerado: usos e determinação da intensidade da amostragem; Levantamento
    de opinião de populações humanas: métodos e suas aplicações à Engenharia Florestal.'
  course_name: 'LCF0510 - Inventário Florestal

    Forest Inventory'
  deactivation: ''
  instructors: '86793 - João Luis Ferreira Batista

    85364 - Luiz Carlos Estraviz Rodriguez'
  lecture_credits: '4'
  objectives: Capacitar o aluno a utilizar as diversas técnicas estatísticas de amostragem
    nos levantamentos florestais a níveis nacional e regional e de propriedade rural,
    de modo a fornecer subsídios ao planejamento, conservação e utilização racional
    de recursos florestais.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
