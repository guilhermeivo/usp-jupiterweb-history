  assessment: A recuperação é realizada através de um exame de 2 horas que engloba
    todos assuntos desenvolvidos durante o curso tanto em aulas teóricas, listas de
    problemas, atividades das aulas práticas, excursões e relatórios técnicos.
  bibliography: 'Literatura Básica:

    Batista, J.L.F.; Couto, H.T.Z. do; Silva Filho, D.F. da;  Quantificação de Recursos
