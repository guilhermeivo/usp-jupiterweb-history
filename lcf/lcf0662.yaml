  course: A partir de leituras, conferências e debates sobre aspectos diversos da
    educação ambiental e sobre técnicas, objetivos e conteúdos de projetos na área
    pretende-se possibilitar às/aos participantes a oportunidade de elaborarem seus
    próprios projetos, debatendo-os com um grupo de pessoas com interesses semelhantes.
    Pretende-se também aprofundar as reflexões teóricas dos/das participantes, sobre
    educação ambiental, através da elaboração de artigos e da crítica coletiva aos
    mesmos. Serão apresentadas técnicas que possibilitem o aprimoramento do fazer
    educativo dos participantes e procurar-se-á aliar atividades de ensino e pesquisa
    a uma atividade de extensão voltada à proposição de um programa de educação ambiental
    para uma instituição.
  course_name: 'LCF0662 - Projetos de Educação Ambiental

    Programs of Environmental Education'
  deactivation: ''
  instructors: 54244 - Marcos Sorrentino
  lecture_credits: '4'
  objectives: Contribuir para a capacitação dos/das estudantes na análise, planejamento,
    implantação e avaliação de projetos de educação ambiental; Contribuir para a formação
    ambiental e pedagógica dos/das estudantes; Aprofundar os conhecimentos teóricos
    dos/das participantes sobre a questão educacional voltada a resolução de problemas
    ambientais.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
