  course: Conceito genérico de propriedade física. Principais propriedades físicas
    da madeira.Massa específica, densidade e densidade básica. Variações na densidade.
    Relações entre densidade e umidade. Métodos de determinação da densidade. Relações
    água-madeira. Formas de água presentes na madeira. Umidade, definição e determinação
    Higroscopicidade, umidade de equilíbrio e ponto de saturação das fibras. Movimentação
    dimensional.Propriedades elétricas da madeira. Condutividade e resistividade.
    Aplicações. Movimentação de fluídos na madeira. Porosidade, permeabilidade, capilaridade,
    difusão.Secagem de madeiras. Secagem natural. Secagem convencional. Defeitos de
    secagem, causa e controle. Controle de processo, de defeitos e de qualidade. Deterioração
    física, química e biológica da madeira. Principais agentes da degradação biológica.Tratamentos
    preservativos de madeiras. Principais produtos e processos.
  course_name: 'LCF0522 - Física da Madeira

    Physics of Madeira'
  deactivation: ''
  instructors: 75175 - Ivaldo Pontes Jankowsky
  lecture_credits: '3'
  objectives: 'Fornecer aos alunos o conhecimento das principais propriedades físicas
    da madeira e a aplicação desses     conceitos nos diversos processos de transformação
    e industrialização da madeira.

    Destaque para a aplicação da física da madeira aos processos de secagem e tratamento
    químico.'
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
