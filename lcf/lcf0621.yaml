  course: "\x95\tO setor florestal brasileiro: aspectos sociais, econômicos, ecológicos\
    \ e silviculturais;\n\x95\tConservação e preparo do solo: i) práticas de caráter\
    \ vegetativo, edáfico e mecânico; ii) efeito de diferentes sistemas de manejo\
    \ sobre os atributos morfológicos, físicos e químicos do solo;\n\x95\tDiagnóstico\
    \ da fertilidade do solo; Adubos e recomendação de adubação: i) características\
    \ físicas, químicas e efeito dos principais adubos sobre a fertilidade do solo;\
    \ ii) adubação de plantio e de cobertura: época de aplicação, doses e métodos\
    \ de distribuição;\n\x95\tEspaçamento de plantio: critérios para sua definição\
    \ em função das características ecofisiológicas, edáficas e do manejo florestal;\n\
    \x95\tTécnicas de plantio e replantio;\n\x95\tRegeneração de povoamentos florestais\
    \ por meio da condução da brotação (Método da Talhadia): objetivos, fatores econômicos\
    \ e técnicos a serem considerados para a tomada de decisão, desbrota, planejamento\
    \ operacional (época, rendi¬mentos operacionais e custos). Interplantio;\n\x95\
    \tTratos culturais: controle de plantas daninhas; prevenção contra incêndios;\
    \ controle de formigas e cupins;\n\x95\tSilvicultura de precisão: objetivos; equipamentos;\
    \ aplicações nas fases de planejamento, implantação e manejo florestal."
  course_name: 'LCF0621 - Implantação e Regeneração de Plantações Florestais

    Establishment and Regeneration of Forest Plantations'
  deactivation: ''
  instructors: 55756 - José Leonardo de Moraes Gonçalves
  lecture_credits: '4'
  objectives: Transmitir conhecimentos teóricos e práticos relativos à implantação,
    à regeneração e aos tratos culturais essenciais para o estabelecimento de plantações
    florestais sustentáveis socioeconômica e ecologicamente.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
