  course: 'Introdução à linguagens Python, C, C++ e VBA com ênfase ao cálculo vetorial
    e matricial.

    Introdução à mecatrônica, máquinas de comando numérico por computador (CNC: routers,
    planners, drillers), uso do AutoCad em projetos de madeira e comunicação com equipamentos
    CNC, Interação máquina madeira,

    Problemas que surgem no e após o desdobro: Devido aos equipamentos,Devido às matérias-primas.
    Procedimentos minimizadores de defeitos: Por seleção da matéria-prima. Por adequada
    adaptação dos equipamentos. Por técnicas de serrar e beneficiar. Clínica das serras,
    facas brocas e fresas. Programação linear aplicada à otimização de indústrias
    madeireiras. Levantamento de demandas. Estoque de matéria-prima para auto-sustentação.
    Versatilidade de produção: para atendimento do mercado, para melhores qualidades.
    Pré-fabricação de estruturas de madeira: maciças. VLC, OSL, reticuladas, vergadas.
    Produtos engenheirados de madeira. Ensaios mecânicos de árvores e de estruturas
    reais.'
  course_name: 'LCF0665 - Tópicos Avançados em Processamento Mecânico da Madeira

    Advanced Topics on Wood Mechanical Processing'
  deactivation: ''
  instructors: 74003 - José Nivaldo Garcia
  lecture_credits: '2'
  objectives: Formar o aluno para avaliar os diferentes processos de industrialização
    da madeira e sua transformação final em bens e produtos, estudando os diversos
    equipamentos de última geração, “layouts” e os conceitos básicos dos principais
    processos industriais adequados às especificidades da matéria-prima. Consolidar
    conceitos de qualidade da madeira associada ao uso final do produto e criar indicadores
    técnicos de otimização de industrias madeireiras.
  practical_credits: '2'
  total_workload: 90 h
  type: Semestral
