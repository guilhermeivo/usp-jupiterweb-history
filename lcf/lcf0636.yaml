  course: 'A história das cidades e da silvicultura urbana: a distribuição e a importância
    da vegetação nas cidades não planejadas e planejadas (a cidade medieval, a cidade
    industrial, a cidade jardim, as cidades com influência do desenho urbano espanhol,
    português, inglês, a cidade moderna). Os usos, benefícios e funções da vegetação
    nos ambientes urbanos: melhoria da paisagem urbana (estética/paisagismo); melhoria
    do conforto térmico e acústico; controle da erosão; controle da poluição do ar
    e da água; controle da luminosidade, reflexão e ofuscamento; lazer e recreação;
    direcionamento e ordenamento do tráfego de pedestres e veículos; usos na arquitetura;
    benefícios econômicos; benefícios para a fauna. Princípios de paisagismo: elementos
    de artes plásticas aplicados ao paisagismo (ritmo, cor, volume, textura,luz);
    estilos de parques e jardins (estilo clássico/francês, estilo romântico/inglês,
    estilo composto, estilo moderno, o jardim japonês. Planejamento em silvicultura
    urbana: a distribuição da vegetação nos espaços públicos e privados e a responsabilidade
    pelo manejo; arborização de ruas, avenidas e estradas ; parques urbanos; jardins
    públicos e privados; áreas verdes; florestas ripárias; florestas periurbanas.
    A influência do meio físico (espaço, adaptação de espécies florestais a diferentes
    níveis de luminosidade, solos, topografia, microclimas, etc.), das atividades
    antrópicas (necessidades, usos, poluição, etc.) e das características biológicas
    e ecológicas das plantas na seleção das espécies e na sustentabilidade dos ecossistemas
    florestais urbanos naturais ou plantados. Inventário florestal em áreas urbanas.
    Sensoriamento remoto e bancos de dados no manejo da floresta urbana e sua valoração.
    Produção de mudas; plantio (espaçamento, distribuição, sistema radicular, nutrição);
    manutenção (nutrição, poda, pragas, cuidados especiais, máquinas e outros equipamentos
    para manutenção). Políticas públicas municipais(política ambiental, estrutura
    administrativa, planejamento urbano, etc.) e programas comunitários para implantação,
    recuperação, valorização ; manutenção dos ecossistemas florestais urbanos e periurbanos.'
  course_name: 'LCF0636 - Silvicultura Urbana

    Urban Forestry'
  deactivation: ''
  instructors: 4864078 - Demóstenes Ferreira da Silva Filho
  lecture_credits: '3'
  objectives: Estudar os princípios e práticas de planejamento, implantação, manejo
    e conservação, de ecossistemas florestais urbanos, considerando as interações
    entre vegetação - atividades e necessidades humanas - planejamento e desenho urbano.
    O enfoque principal será dado sobre a função da vegetação nos espaços urbanos,
    os modelos de produção de mudas e distribuição de espécies adequadas para diferentes
    condições, manejo silvicultural, políticas públicas e organização comunitária.
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
