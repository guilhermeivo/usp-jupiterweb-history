  course: 'Mecanização florestal e colheita de madeira: introdução, evolução, sistemas,
    planejamento da colheita de madeira e levantamento de dados. Fatores de influência
    na colheita de madeira e principais efeitos no ambiente. Colheita de madeira em
    florestas tropicais. Colheita de florestas implantadas: corte raso e desbastes.
    Equipamentos de corte: características técnicas e econômicas, esquema de trabalho,
    rendimentos e efeitos. Extração florestal: máquinas e equipamentos, descrição
    técnica, avaliação econômica e rendimentos. Determinação do custo de equipamentos
    florestais. Desgalhamento, toragem e descascamento. Produção de cavacos no campo.
    Transporte principal: ferroviário, hidroviário e rodoviário. Caminhões: importância,
    análise técnica e econômica, alternativas de veículos e legislação. Estradas florestais:
    projeto e alocação da rede viária, características técnicas, construção de obras
    de arte e impactos sobre o meio ambiente. Ergonomia florestal. Aspectos fisiológicos
    do trabalho. Estudo do trabalho e de tempo: planejamento, instrumentos, etapas,
    identificação de atividades parciais e coleta de dados. Introdução aos conceitos
    sobre Logística e Gestão da Cadeia de Suprimentos.'
  course_name: 'LCF0683 - Colheita e Transporte de Madeira

    Harvest and Transport of Wood'
  deactivation: ''
  instructors: '2151034 - Edson José Vidal da Silva

    7024292 - Luciana Duque Silva'
  lecture_credits: '3'
  objectives: 'e importância da mecanização florestal e descrição dos sistemas de
    colheita florestal nas atividades de: corte, toragem, desgalhamento, extração,
    carga e descarga, transporte principal e descascamento.Analisa máquinas e implementos
    florestais e os efeitos da colheita de madeira no ambiente. Aspectos de ergonomia
    nas atividades florestais. Estradas florestais. Logística.

    Objectives and importance of forest mechanization; Description of systems in forest
    harvesting activities: cutting, bucking, debranching, extraction, loading and
    unloading, wood transportation and debarking; Machinery and forest implements
    analysis, and the effects of timber harvesting on the environment; Aspects of
    ergonomics in forestry activities; Forest roads.'
  practical_credits: '1'
  total_workload: 75 h
