courses:
  activation: 01/01/2003
  assessment: Elaboração de um trabalho técnico e/ou científico. Trabalho.
  bibliography: 'HARTMANN, H.T. e D.E. KESTER - Plant Propagation : principles       and
    practices. 1968.

    SHEAT, W.G. - Propagation of trees, shrubs and conífers. 1963.

    WELLS, J.S. - Plant Propagation Practices. 1955.

    WELCH, J.S. - Mist propagation and automatic watering, 1975.

    BLEASDALE, J.K.A. - Fisiologia Vegetal. Trad. WEISHAUPH, L. e       A. LAMBERTI.
    1977.'
  course: 'INTRODUÇÃO: Apresentação dos objetivos, do programa, da metodologia de
    trabalho e das tarefas do curso. Aspectos gerais da propagação de plantas. ASPECTOS
    GERAIS: Estruturas e instalações. Recipientes e substratos. Aspectos fitossanitários.
    PROPAGAÇÃO SEXUADA: Princípios e técnicas. Embriogênese comparativa. Poliembrionia
    e apomixia. PROPAGAÇÃO ASSEXUADA: Aspectos gerais da propagação vegetativa. Bases
    anatômicas e fisiológicas da propagação através da estaquia, da alporquia, da
    mergulhia e da amontoa. Técnica de propagação por estaquia, alporquia, mergulhia
    e amontoa. Aspectos anatômicos e fisiológicos da enxertia e da borbulhia. Técnicas
    de enxertia e de borbulhia. Aspectos teóricos de micropropagação. Técnicas de
    propagação. Propagação por estruturas especializada. PROTEÇÃO E QUARENTENA: Sistemas
    de Produção. Quarentena. Sistemas de produção de clones livres de doenças e patógenos.SISTEMA
    DE PRODUÇÃO DE MUDAS DE ESSÊNCIAS FLORESTAIS: Aspectos gerais. Usos. Viabilidade
    e produtividade.'
  course_name: 'LCF0427 - Propagação de Essências Florestais

    Propagation of Forest Species'
  deactivation: ''
  instructors: 2086636 - Antonio Natal Gonçalves
  lecture_credits: '4'
  objectives: Dar aos alunos os principais conceitos de propagação de    espécies
    arbóreas florestais. Estudar os problemas envolvidos    na propagação de essências
    florestais e a escolha de métodos e suas implicações na Silvicultura e, principalmente,
    no    melhoramento florestal.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
