  course: 'O programa será desenvolvido por grupo de espécies florestais afins, sendo
    que para cada grupo abordar-se-ão os seguintes tópicos: a. Região de Ocorrência
    Natural das Espécies, b. Aptidão e Zoneamento Edafo-Climático, c. Produtos Florestais
    Disponibilizados (Madereiros e Não-Madereiros), d. Produção de Sementes Melhoradas,
    Propágulos  e Mudas, e. Preparo de Solo e Implantação Florestal (Fertilização,
    Espaçamento e Plantio), f. Manutenção Florestal (Tratos Culturais e Pragas), g.
    Manejo Florestal (Sistema Silvicultural, Ritmo de Crescimento, Uso Múltiplo e
    Modelo Ecofisiológico Básico), g. Exploração Florestal, h. Regeneração Florestal,
    i. Planejamento Operacional de Cultivos Florestais.

    Os grupos de famílias, gêneros ou espécies que poderão ser ministrados na disciplina
    serão:

    Eucalyptus tropicais e subtropicais (energia, celulose, desdobro, óleos essenciais);

    Pinus tropicais e subtropicais (celulose, desdobro, resina);

    Araucaria angustifolia (Pinheiro do Paraná - desdobro);

    Acacias: A.mearnsii (Acácia Negra - casca e energia), A.mangium e A.auriculiformis
    (madeira e recuperação áreas degradas);

    Leucaena spp, Mimosa spp (Leguminosae, fixadoras N, energia), Casuarina spp (energia,
    revegetação);

    Tectona grandis, Cedrela spp, Swietenia spp (Meliaceae - desdobro);

    Euterpe spp e Bactris spp (Palmito). Bambusa spp (Bambu - celulose);

    Hevea brasiliensis (Seringueira - látex) e Bertholletia excelsa (Castanha do Pará);
    Ilex paraguariensis (Erva Mate);

    Cunninghamii lanceolata, Cupressus lusitanica e Cryptomeria japonica (celulose,
    desdobro e ornamentação). Populus spp (desdobro);

    Espécies do Cerrado: Hymenaea spp, Tabebuia spp etc (desdobro, revegetação);

    Espécie da Mata Atlântica: Cariniana spp, Hymenaea spp, Balfourodendron spp, Ocotea
    spp etc (desdobro, revegetação).'
  course_name: 'LCF0575 - Culturas Florestais

    Forest Crops'
  deactivation: ''
  instructors: 7024292 - Luciana Duque Silva
  lecture_credits: '3'
  objectives: 'Fornecer ao aluno de Engenharia Florestal conhecimentos básicos e aplicados
    em relação às principais culturas florestais tradicionais, de importância econômica
    e ecológica a nível nacional ou regional;

    Introduzir conceitos de sustentabilidade ecológica de plantações florestais e
    os principais indicadores para seu monitoramento. Introdução de modelos ecofisiológicos
    básicos para o manejo florestal.

    Fomentar pesquisa bibliográfica, análise e discussão sobre culturas florestais
    não tradicionais, mas com potencial de produção de bens madereiros e não madereiros,
    para pequenos, médios e grandes propietários rurais;

    Transmitir conceitos técnicos e científicos relacionados à seleção de gênero/espécie
    para fins de cultivo florestal com base em zoneamentos edafo-bio-climáticos;

    Transmitir conceitos operacionais relativos à implantação, manejo e regeneração
    destes povoamentos com base em aspectos silviculturais, ambientais, tecnológicos
    e econômicos;

    Capacitar o aluno a gerir o planejamento, a implantação, a manutenção e o manejo
    de projetos florestais de acordo com as demandas de produtos florestais e as disponibilidades/
    restrições de recursos humanos, materiais e financeiros;'
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
