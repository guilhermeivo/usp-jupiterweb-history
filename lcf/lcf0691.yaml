  course: 'A recreação ao ar livre; primeiros Parques Nacionais e movimentos conservacionistas
    no Brasil e no mundo. A visão econômica da conservação. Sociologia do Lazer: filosofia
    biocêntrica e antropocêntrica no manejo de áreas naturais; experiência recreacional;
    análise do visitante; demanda para recreação. Introdução à Economia dos Recursos
    Naturais: conceitos básicos e relacionamento com o planejamento e manejo de áreas
    naaturais; fatores que afetam a demanda; avaliação econômica em Unidades de Conservação.
    Plano do Sistema de Unidades de Conservação do Brasil: objetivos nacionais da
    Conservação, categorias de manejo. Planejamento: conceito e estrutura do Plano
    de Manejo;; fases do planejamento; participação pública em planejamento; levantamento
    dos recursos para o planejamento; uso dos recursos pelos visitantes. Zoneamento:  limites,
    considerações para delimitação de unidades de conservação; zonas de manejo; programas
    especiais. Interpretação em Áreas Naturais: objetivos da Interpretação; métodos
    e técnicas de interpretação; e programa interpretativo. Planejamento de Local:
    requerimentos ecológicos; estéticos e técnicos; placas; sinalização,  proteção
    e segurança.Manejo do uso público: princípios básicos; metodologias para avaliação
    do uso público em áreas naturais protegidas; técnicas para lidar com os impactos
    negativos do uso público.'
  course_name: 'LCF0691 - Manejo de Áreas Naturais Protegidas

    Conservation and Protected Areas Management'
  deactivation: ''
  instructors: 2917121 - Teresa Cristina Magro Lindenkamp
  lecture_credits: '4'
  objectives: 1. Demonstrar ao aluno argumentação técnica que justifique a importância
    das áreas naturais protegidas na preservação dos recursos naturais renováveis.
    2- Apresentar ao aluno as diferentes modalidades de manejo de unidades de conservação,
    capacitando-o para identificar as atividades e usos que podem ou não ser desenvolvidos
    em cada modalidade. 3- Apresentar ao aluno a função do planejamento de áreas naturais
    protegidas e familiariza-lo com a sua aplicação no fornecimento de oportunidades
    recreativas, educacionais e científicas. 4- Capacitar o aluno para planejar programas
    de uso público para áreas protegidas. 5- Contribuir para o desenvolvimento de
    uma visão crítica e criativa para o manejo adequado das áreas naturais, criando
    condições para o uso adequado dos seus recursos naturais e culturais.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
