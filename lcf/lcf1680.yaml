  course: '1. Manejo Florestal - conceito, objetivos, avaliação da possibilidade de
    produção e índice de qualidade de um determinado meio. Uso múltiplo e rendimento
    sustentado. Planos de manejo. 2. Modelos de Crescimento e Produção Florestal:
    Índice de sítio: método da curva guia e método das equações da diferença; Modelos
    de crescimento e produção no nível de povoamento: modelos estáticos e modelos
    dinâmicos, método das equações da diferença. 3.Desrama natural e artificial :
    fatores que a regulam. Forma da árvore, qualidade da madeira, métodos de desrama
    artificial, programação e execução. 4. Desbastes - conceitos: objetivos, métodos,
    efeitos e exeqüibilidade. Intensidade e freqüência dos desbastes. Ferramentas,
    programação, execução e custos dos desbastes. Estagnação do crescimento e determinação
    da necessidade dos desbastes. Idade do povoamento, dimensões das árvores e qualidade
    e aplicação da madeira resultante do desbastes. 5. Programação e execução dos
    desbastes. Aplicação em povoamentos artificiais. Vantagens e desvantagens da rotação
    longa. 6. Sistemas de manejo, exploração e regeneração para as grandes culturas
    florestais em conformidade com a finalidade da cultura. Rotação curta e longa.
    7. Exploração: cálculo da possibilidade, ordenamento, planejamento e execução,
    obedecendo ao princípio de rendimento sustentado. Corte raso: condições para a
    sua aplicação, época e altura de corte, vantagens e desvantagens. 8. Condução
    de  regeneração natural por brotação de touças: fatores que afetam, desbrota,
    adubação, controle da formiga cortadeira. Interplantio.  9.Reforma de  povoamentos
    florestais : decisão econômica,  substituição do material genético, preparo do
    solo, re-alinhamento, retalhonamento, plantio, tratos culturais, reposição da
    fertilidade. 10. Uso de fogo controlado. Prevenção e combate a incêndio. 11. Trabalhos
    extra-classes de inventário, implantação e manejo florestal.'
  course_name: 'LCF1680 - Manejo e Regeneração de Povoamentos Florestais

    Regeneration and Forest Management'
  deactivation: ''
  instructors: 7024292 - Luciana Duque Silva
  lecture_credits: '4'
  objectives: Avaliar a capacidade produtiva das principais espécies florestais em
    função do meio onde está estabelecida a floresta. Uso múltiplo. -Estudar os diferentes
    métodos de condução da floresta, implantada ou artificial, de acordo com a finalidade
    e visando maximizar a produtividade e a rentabilidade. - Determinação do sistema
    mais econômico de desrama e de desbaste aplicável à floresta e que possibilite
    o máximo de qualidade e utilização da madeira. Determinação do momento ideal de
    corte, do método mais interessante de exploração e do sistema de regeneração visando
    rendimento sustentado. - Estudo de técnicas de prevenção e combate aos incêndios
    florestais.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
