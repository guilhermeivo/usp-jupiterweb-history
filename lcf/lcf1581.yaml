  course: 'a)O Ecossistema Florestal: conceitos, funcionamento, caracterização; florestas
    naturais e florestas plantadas; unidades de conservação; manejo de fragmentos
    florestais. b)Reflorestamento de Proteção Ambiental : planejamento ambiental de
    propriedades agrícolas; matas ciliares; recuperação de áreas degradadas; c)Formação
    e Manejo de Povoamentos Florestais em Propriedades Agrícolas: viveiros florestais;
    escolha das espécies; implantação de pequenos povoamentos florestais mensuração
    de pequenos povoamentos florestais; manejo por talhadia e por alto-fuste; maturação
    econômica da floresta; d)Utilização Racional da Madeira : cubagem da madeira;
    preservação e tratamento de moirões; produção de carvão vegetal.'
  course_name: 'LCF1581 - Recursos Florestais em Propriedades Agrícolas

    Forest Resources in Agricultural Properties'
  deactivation: 31/12/2023
  instructors: '7024292 - Luciana Duque Silva

    3490066 - Pedro Henrique Santin Brancalion

    2801928 - Weber Antonio Neves do Amaral'
  lecture_credits: '4'
  objectives: Este programa visa proporcionar ao futuro Engenheiro Agrônomo os conhecimentos
    básicos para o cultivo e o aproveitamento de árvores e a conservação de ecossistemas
    florestais em propriedades voltadas para a produção agrícola. O plantio de árvores
    pode contribuir significativamente para uma melhor conservação dos solos, recursos
    hídricos e biodiversidade e, ainda, para aumentar a produtividade dos atuais sistemas
    de produção. Para tratar do aproveitamento apropriado dos recursos florestais,
    esta disciplina aborda, também, aspectos relacionados à utilização da madeira
    na propriedade agrícola.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
