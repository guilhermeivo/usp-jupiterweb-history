  course: "-\tFenologia de florescimento e frutificação em espécies arbóreas: - Biologia\
    \ floral e interação flor x polinizador; Dispersão de sementes de espécies arbóreas\
    \ e interação fruto/semente x agente dispersor;\n- Sistema reprodutivo de espécies\
    \ arbóreas: Alogamia e autogamia; determinação de taxa de cruzamento em espécies\
    \ arbóreas;\n- Germinação de sementes de espécies arbóreas: - Dormência em sementes\
    \ de espécies arbóreas; Métodos de superação de dormência; Dormência e grupos\
    \ de sucessão ecológica;\n- Sucessão secundária e banco de sementes no solo: Banco\
    \ de plântulas de espécies de estágios finais de sucessão;\n-\tFatores que afetam\
    \ a produção de sementes de espécies arbóreas: - Métodos de produção de sementes\
    \ de espécies arbóreas. - Secagem e armazenamento de sementes de espécies arbóreas."
