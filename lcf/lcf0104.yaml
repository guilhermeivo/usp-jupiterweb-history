courses:
  activation: 01/01/2024
  assessment: Não haverá recuperação nessa disciplina.
  bibliography: 'Literatura Básica:

    CAIN, M. L.; BOWMAN W. D.; HACKER, S. D. 2011. Ecologia. Artmed. Porto Alegre.

    PIRATELLI, A. J.; FRANCISCO, M. R. 2013. Conservação da Biodiversidade. Dos Conceitos
    às ações. Technical Books Editora. Rio de Janeiro.

    TOWNSEND, C. R.; BEGON, M.; HARPER, J. L. 2006. Fundamentos em Ecologia. 2ª. Ed.
    Artmed, Porto Alegre.

    Literatura Complementar:

    FERNANDEZ, F. 2011. O Poema Imperfeito: Crônicas de Biologia, Conservação da Natureza
    e seus Heróis. Editora UFPR, Curitiba.

    GIBBS, J. P.; HUNTER, JR. M. J., STERLING, E. J. 2008. Problem-solving in Conservation
    Biology and Wildlife Management. Second Edition. Blackwell Publishing.'
  course: Apresentação e discussão de problemas ambientais típicos e atuais do exercício
    profissional do biólogo. Método científico e resolução de problemas. Leitura e
    discussão de textos específicos. Excursões (viagens de campo). Elaboração de relatórios
    e redação científica. Apresentação de seminários dos temas propostos.
  course_name: 'LCF0104 - Ecologia Aplicada

    APPLIED ECOLOGY'
  deactivation: ''
  instructors: '494774 - Alexandre Reis Percequillo

    792922 - Flávio Bertin Gandara Mendes

    836301 - Katia Maria Paschoaletto Micchi de Barros Ferraz

    5553650 - Vânia Galindo Massabni'
  lecture_credits: '1'
  objectives: 1) Contextualizar os principais problemas ambientais da atualidade ligados
    à atividade profissional do biólogo, 2) capacitar o aluno na busca por soluções
    efetivas para os problemas ambientais ligados aos principais temas da ecologia
    aplicada, tais como, conservação biológica, mudanças globais, manejo de habitat
    e de fauna, restauração ecológica, manejo de pragas e doenças, dentre outros,
    3) oferecer ao aluno meios para desenvolver os temas de estudo propostos, a partir
    de uma abordagem de aprendizagem baseada em problemas e 4) Instigar o aluno a
    desenvolver um pensar crítico frente aos problemas ambientais da atualidade, motivando-o
    na busca por conhecimento adicional fora da sala de aula, com apoio de colaboradores
    (tutores) especialistas nos temas propostos.
  practical_credits: '2'
  total_workload: 75 h
  type: Semestral
