  course: "-\tanalisar a interdependência campo/cidade, produção/comercialização,\
    \ fiscalização/educação, ensino/pesquisa/extensão, economia/ecologia, mercado\
    \ interno/externo, progresso/felicidade, tecnologias alternativas/tecnologias\
    \ tradicionais, conhecimento erudito/conhecimento popular, tradição/ruptura, etc.;\n\
    -\tdetectar em si próprio ações negativas e positivas para o ambiente e para a\
    \ vida (sua e dos outros) e trabalhar na superação das negativas e aprimoramento\
    \ das positivas;\n-\tcontribuir na formação de grupos ou atuar em grupos no sentido\
    \ de estimulá-los a conhecerem o ambiente onde vivem, debaterem seus problemas/necessidades,\
    \ projetarem o futuro que desejam, alternativas de caminhos para alcançá-lo e\
    \ acima de tudo, desenvolverem ações no sentido considerado mais adequado;\n-\t\
    compreender que a ação local é tanto mais eficiente e eficaz quanto maior for\
    \ a percepção e entendimento da totalidade de fatores envolvidos com a mesma e\
    \ que a reflexão global será mais pertinente se tiver as \"mãos na terra\", ou\
    \ seja, ancoragem no concreto/cotidiano, a partir dele e voltada para ele;\n-\t\
    diagnosticar problemas e buscar soluções técnicas, políticas, legais, sociais\
    \ e ambientais com participação cooperativa das coletividades envolvidas, formulando\
    \ hipóteses, propondo soluções, experimentando-as, analisando os resultados, reformulando\
    \ hipóteses e teorias, ...;\n-\telaborar projetos e procurar viabilizá-los;\n\
    -\tcolaborar na formação de novas pessoas para atuarem dentro do espírito descrito\
    \ acima e que por sua vez procurarão formar novas pessoas nesta mesma perspectiva\
    \ e assim por diante ..."
  course_name: 'LCF0622 - Tópicos de Educação Voltados à Questão Ambiental

    Education Topics Directed to Environmental Issues'
  deactivation: ''
  instructors: 54244 - Marcos Sorrentino
  lecture_credits: '4'
  objectives: "Propiciar aos estudantes da ESALQ oportunidades de relacionamento crítico\
    \ com textos, pessoas e situações no campo educacional que possam ser úteis na\
    \ construção de seus conhecimentos sobre como superar os problemas ambientais;\
    \ -\tanalisar alternativas de metodologias e conteúdos de educação ambiental compatíveis\
    \ com distintos objetivos e diretrizes; - propiciar a tomada de consciência generalizada\
    \ a respeito das causas e consequências que têm para o ser humano, para a sociedade\
    \ e para a comunidade internacional, os problemas do meio ambiente e estimular\
    \ na vida diária profissional e na ação para o desenvolvimento, uma ética, atitudes\
    \ e conceitos individuais e coletivos que contribuam para a proteção e melhoria\
    \ do meio ambiente e da qualidade de vida (adaptado do Programa Internacional\
    \ de Educação Ambiental, estabelecido pela 22a Conferência Geral da UNESCO."
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
