  assessment: 'Dar condições para o/a estudante amadurecer em sua capacidade de análise
    crítica sobre problemas ambientais e sobre caminhos educacionais que possam contribuir
    na sua  superação.

    O período destinado à recuperação possibilitará que o/a estudante realize as atividades
    - caderno, artigos, intervenções educacionais, prova, projeto preliminar ou proposta
    educacional que deixou de realizar durante o semestre.'
