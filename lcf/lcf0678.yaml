  course: 'Hidrologia florestal, terminologia, unidades e transformações. Ciclo hidrológico,
    processos hidrológicos. Bacia hidrográfica: escala, delimitação / cálculo de área;
    Caracterização física de bacias por meio de Sistemas de Informações Geográficas.
    Precipitação: intensidade, distribuição e métodos de mensuração em áreas florestadas.
    Distribuição espacial da precipitação em bacias. A interceptação da chuva pela
    copa das florestas: conceitos, fatores que influenciam a interceptação. Papel
    das perdas por interceptação no balanço hídrico da microbacia. Medição dos processos
    envolvidos na interceptação. Evapotranspiração potencial. Balanço hídrico em microbacias
    hidrográficas florestadas. Quantificação do balanço hídrico. Regime da água do
    solo em áreas florestais: conceitos de hidrologia do solo, dinâmica da água do
    solo, umidade do solo. Infiltração da água no solo. Escoamento superficial. Escoamento
    direto / indireto. Vazão: deflúvio, medição e avaliação de hidrograma. Hidrologia
    da microbacia hidrográfica: o processo de geração do deflúvio em microbacias florestadas,
    conceito de área variável de afluência, resposta hidrológica.  Efeitos da floresta
    sobre a produção de água da microbacia. Métodos de medição do deflúvio em microbacias
    experimentais. Zona ripária: dinâmica, caracterização, importância. Interação
    sistema terrestre / aquático. Florestas e produção de água. Consumo de água por
    espécies florestais: fatores envolvidos, evaporação, transpiração e perdas por
    interceptação. Medição da evapotranspiração em florestas.  Manejo florestal: impactos:
    Erosão e sedimentos; Composição físico-química da água em microbacias hidrográficas
    florestadas: conceitos, parâmetros de qualidade da água, ciclagem de nutrientes
    em florestas. Efeitos das atividades florestais de uso da terra sobre a qualidade
    da água. Avaliação da qualidade da água. Planejamento integrado de bacias hidrográficas.
    Uso de Sistemas de Informações Geográficas para manejo de bacias hidrográficas
    Alocação de áreas naturais. Corte raso. Desenho de talhões e estradas florestais.
    Monitoramento de microbacias. Sustentabilidade do manejo florestal: manutenção
    do potencial produtivo, processos hidrológicos e diversidade biológica. Aula prática
    sobre medição de processos hidrológicos na Estação Experimental de Itatinga.'
  course_name: 'LCF0678 - Manejo de Bacias Hidrográficas

    Forest Watershed Management'
  deactivation: ''
  instructors: 2058395 - Sílvio Frosini de Barros Ferraz
  lecture_credits: '3'
  objectives: 'a) Informar o aluno a respeito dos princípios fundamentais de hidrologia
    florestal, com ênfase em suas aplicações práticas para o manejo de microbacias
    hidrográficas.

    b) Fornecer ao aluno elementos que lhe permitam entender e planejar o manejo da
    floresta visando a produção e a qualidade da água.

    c) Desenvolver a visão holística de manejo florestal tendo a microbacia hidrográfica
    como base física de planejamento, visando a minimização dos impactos ambientais.'
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
