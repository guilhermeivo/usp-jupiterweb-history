  course: 'Revisão sobre composição química da madeira. Madeira e suas reações à ação
    de agentes químicos. Separação química de carboidratos e lignina. Obtenção de
    pasta celulósica. Matérias primas para produção de celulose. Classificação quanto
    à fonte e tipo de fibra. Qualidade da matéria-prima. Madeira de coníferas e folhosas,
    fibras anuais, resíduos agrícolas e industriais; Processos de obtenção de celulose.
    Classificação quanto ao rendimento, tipo de energia empregada. Adequação com a
    matéria-prima e qualidade do produto. Processos mecânicos, termo mecânicos, semi
    químicos e químicos: classificação, principais equipamentos e variáveis de processo,
    qualidade e uso da celulose/pasta resultante. Aspectos técnicos, econômicos e
    sociais da indústria de celulose no mundo e no Brasil. Hidrólise da madeira. Etanol
    da madeira. Alternativas de pré-tratamento químico da madeira. Conceitos sobre
    biorefinaria.'
  course_name: 'LCF0445 - Fundamentos e Aplicações da Química de Produtos Florestais
    II

    Principles and Applications of Forest Products Chemistry II'
  deactivation: ''
  instructors: 1166011 - Francides Gomes da Silva Junior
  lecture_credits: '3'
  objectives: Fornecer aos alunos conhecimentos básicos e aplicados referentes ao
    processamento químico de matérias primas de origem florestal, seus produtos e
    aplicações, tendo em conta, especialmente, os componentes lignocelulósicos como
    fonte de biofibras e biocombustíveis.
  practical_credits: '1'
  total_workload: 75 h
