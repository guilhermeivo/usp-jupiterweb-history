  course: 'Introdução aos ecossistemas florestais tropicais: definição de trópicos,
    floresta tropical, ecossistema, bioma, ecorregião, eco-unidades, ecótono; componentes
    do ecossistema; ecossistemas antrópicos. Fluxo de energia nos ecossistemas: Temperatura,
    precipitação, umidade do ar e evaporação, transpiração, radiação solar. Solos
    e ciclagem de nutrientes nos ecossistemas: Solos tropicais, Ciclagem de nutrientes
    na floresta tropical, Armazenamento de água, Erosão e carreamento de sedimentos
    e nutrientes. Comunidades biológicas em ecossistemas florestais: Conceitos de
    espécie, população e comunidades, Papel da fauna nos ecossistemas florestais,
    Meta-populações. Diversidade e complexidade dos ecossistemas: Biodiversidade tropical,
    Valor da biodiversidade, Complexidade das florestas tropicais, Heterogeneidade
    física local, Gradientes naturais, Biogeografia de espécies tropicais, Distúrbios
    naturais como fonte de diversidade. Bacias hidrográficas e a ciclagem da água:
    Conceito de bacia hidrográfica, O ciclo da água nos ecossistemas florestais, Balanço
    hídrico, O papel da floresta no ciclo da água. Ecologia da paisagem: Conceitos,
    Composição e estrutura da paisagem, Quantificação da estrutura, Manejo da paisagem.
    Perturbação e equilíbrio dos ecossistemas: Conceitos de resistência, resiliência,
    Regime de distúrbios, Efeito dos distúrbios no padrão, Conceito de equilíbrio.
    Mudanças climáticas nos Ecossistemas florestais: Adaptação dos ecossistemas ao
    clima, Modelos de alterações climáticas, Cenários IPCC, Consequências das mudanças
    climática no padrão. Dinâmica de paisagens florestais tropicais: Desmatamento:
    Histórico e perspectiva atual, Padrão de desmatamento, Quantificação e monitoramento
    do desmatamento, Regeneração natural. Degradação de ecossistemas florestais. Restauração
    de ecossistemas tropicais: Definições: restauração, reabilitação e recuperação,
    Objetivos da restauração, Metas globais de restauração florestal, Restauração
    da Estrutura função. Serviços Ecossistêmicos: Conceituação, Tipos de serviços,
    Pagamento por serviços ecossistêmicos, Exemplos práticos. Mercado de carbono,
    protocolos e metas globais de emissões, MDL, Offset de carbono, neutralização
    de emissões, mercado de carbono, REDD+.'
  course_name: 'LCF0778 - Serviços Ecossistêmicos e Adaptação às Mudanças Globais

    Ecosystem Services  and Adaptation to Global Changes'
  deactivation: ''
  instructors: 2058395 - Sílvio Frosini de Barros Ferraz
  lecture_credits: '2'
  objectives: a) Informar o aluno a respeito dos princípios fundamentais dos serviços
    ecossistêmicos gerados pelas florestas. b)Fornecer ao aluno elementos que lhe
    permitam entender os ecossistemas florestais para promover a conservação da biodiversidade
    e dos serviços ecossistêmicos. c) Desenvolver a visão holística dos ecossistemas
    florestais, suas propriedades e vulnerabilidades e oportunidades frente as mudanças
    globais.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
