  course: 'Dendrologia e biologia da madeira: da morfologia externa a anatomia do
    lenho das árvores de espécies florestais nativas e introduzidas. Partes integrantes
    de um vegetal arbóreo; estudo da raiz, caule, folha, flores, frutos e sementes.
    Atividade cambial e formação do tronco das árvores. Anéis de crescimento no lenho
    das árvores: caracterização anatômica e aplicações no manejo, monitoramento ambiental,
    reconstrução climática, datação de árvores, etc. Composição do tronco e a formação
    do alburno/cerne, madeira juvenil/adulta, lenho de reação (compressão e tração).
    Biodeterioração do lenho das árvores e da madeira. Planos de observação do tronco.
    Estrutura anatômica da madeira das angiospermas (folhosas) e das gimnospermas
    (coníferas). Identificação macro e microscópica das principais espécies comerciais
    no Brasil, através das características de suas madeiras.'
  course_name: 'LCF0225 - Dendrologia e Biologia da Madeira

    Dendrology and Wood Biology'
  deactivation: ''
  instructors: 49807 - Mario Tommasiello Filho
  lecture_credits: '3'
  objectives: Transmitir conhecimentos básicos sobre a dendrologia das principais
    espécies florestais nativas e exóticas cultivadas no país. Explicar a origem e
    formação dos tecidos que formam o lenho das árvores. A estrutura e composição
    dos meristemas apicais e lateral. Distinguir as células e tecidos estruturais
    que compõem o lenho das árvores e as funções desempenhadas. Estudar o processo
    de formação do cerne e da madeira juvenil e adulta no lenho das árvores. Estudar
    a formação e aplicação dos anéis de crescimento no lenho das árvores. Analisar
    a parede das células do lenho madeira até a sua ultra-estrutura. Reconhecer as
    principais estruturas anatômicas utilizadas na identificação macroscópica das
    espécies florestais. Identificar macro e microscopicamente as principais madeiras
    através da sua estrutura anatômica e aplicação de chaves. Estudar a biodeterioração
    do lenho das árvores e da madeira em uso, por microorganismos e insetos.
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
