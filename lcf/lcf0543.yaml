  course: '1. Características, produção, consumo e  perspectivas de uso dos painéis
    à base de madeira.

    2. Chapas de Fibras :

    2.1. Matéria-prima

    2.2. Processos de desfibramento

    2.3. Formação da manta:

    2.3.1. Processo seco

    2.3.2. Processo úmido

    2.4. Processo de manufatura da chapa

    2.4.1. Chapa mole

    2.4.1. Chapa dura

    2.5. Controle de Qualidade

    3. Adesivo :

    3.1. Adesivos naturais

    3.2. Adesivos sintéticos :

    3.2.1. Formas de obtenção

    3.2.2. Características dos principais adesivos

    3.3. Fundamentos básicos de colagem

    4. Agromerados :

    4.1. Matéria-prima

    4.2. Processos :

    4.2.1. Extrusão

    4.2.2. Prensagem

    4.3. Controle de Qualidade

    5. Painéis compensados :

    5.1. Produção de lâminas

    5.2. Manufatura do painel

    5.3. Controle de qualidade

    6. Outros painéis à base de madeira.'
  course_name: 'LCF0543 - Painéis à Base de Madeira

    Wood Based Panels'
  deactivation: ''
  instructors: 1121661 - Geraldo Bortoletto Junior
  lecture_credits: '3'
  objectives: Dar ao aluno conhecimentos sobre os princípios envolvidos nos    processos
    de manufatura dos painéis a base de madeira (chapas    de fibras, aglomerados,
    compensados e sarrafeados), estudando    a tecnologia envolvida no processamento,
    as propriedades    físico-mecânicas do produto final e o controle de qualidade.
  practical_credits: '1'
  total_workload: 75 h
