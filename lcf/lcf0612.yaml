  objectives: 'Capacitar o aluno a planejar, delinear, instalar, medir, analisar e
    interpretar experimentos florestais usando o sistema SAS.

    To enable the student to plan, delineate, install, measure, analyze and interpret
    forest experiments using the SAS system.'
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
