  course: "Importância do SAS para a área biológica. Origens da Estatística: sua importância\
    \ na pesquisa e relações com outras disciplinas.\nO método científico: raciocínio\
    \ dedutivo e indutivo. Introdução ao sistema SAS Conceitos de amostragem e variáveis.\t\
    Conceito de população e parâmetros populacionais (média, variância, desvio padrão);\
    \ Conceito de amostra e estatísticas (média(x), variância(s2) e desvio padrão\
    \ amostral(s)); A Distribuição Normal: origens, forma, usos. Assimetria e Curtose.\
    \ Testes de ajustamento (interpretação do valor-p). Testes de hipóteses: Formulação\
    \ de hipóteses. A Hipótese de Nulidade. A Hipótese Alternativa. Tipos de erros.\
    \ Nível de significância. O teste t para dados pareados: Histórico, Suposições,\
    \ Exemplo de cálculo. O teste t para duas amostras: Histórico, Suposições, Exemplo\
    \ de cálculo. Suposições dos modelos de análises de dados. Transformação de dados:\
    \ o teste de BOX-COX. Testes não-paramétricos. Planejamento de experimentos. Considerações\
    \ teóricas a respeito de planejamento de experimentos: Formulação de hipótese.\
    \ Repetições. Casualização. Controle Local. Quadro de análise de Variância. Graus\
    \ de liberdade.  Experimentos inteiramente ao acaso – Aplicações e Restrições.\
    \ Cálculos manuais do quadro de análise de variância. Graus de liberdade. Soma\
    \ de quadrados. Quadrados médios. Estatística F. Consulta à tabela da estatística\
    \ F. Experimentos em blocos ao acaso – Aplicações e Restrições. Cálculos do quadro\
    \ de análise de variância. Graus de liberdade. Soma de quadrados. Quadrados médios.\
    \ Estatística F. Consulta à tabela da estatística F. Testes para comparação múltipla\
    \ de médias: Principais testes para comparações de médias, características principais\
    \ e restrições aos testes: Tukey, Duncan, Dunnett. Análise de variáveis nominais.\
    \ O teste QUI- QUADRADO e o teste G. Análise de regressão Linear Simples."
  course_name: 'LCF0612 - Introdução à Pesquisa Florestal

    Introduction to Forestry Research'
  deactivation: ''
  instructors: 39751 - Hilton Thadeu Zarate do Couto
