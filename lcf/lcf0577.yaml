  course: '1.Introdução à biodiversidade: definições, origens e manutenção. 2.Medidas
    da biodiversidade: de genes a ecossistemas.3.Uso de sistemas de informação geográfica
    em biodiversidade.4.Uso de critérios e indicadores no uso e gestão dabiodiversidade.5.Modelos
    de gestão da biodiversidade: participativa; descentralizada. 6.Gestão da biodiversidade
    em áreas públicas e privadas.7.Gestão da agrobiodiversidade em sistemas de produção.8.Mecanismos
    de fortalecimento jurídico e institucional para a gestão da biodiversidade.9.Instrumentos
    econômicos na gestão da conservação da biodiversidade.10.Políticas públicas, Acordos
    internacionais e a Convenção sobre Diversidade Biológica e a gestão da biodiversidade.11.Estudos
    de caso sobre uso sustentável e gestãoda biodiversidade:da bioprospecção a bioengenharia,
    aos conhecimentos tradicionais e divisão de benefícios.12. Desenvolvimento de
    planos de negócios e gestão da biodiversidade.'
  course_name: 'LCF0577 - Gestão da Biodiversidade

    Biodiversity Management'
  deactivation: ''
  instructors: 2801928 - Weber Antonio Neves do Amaral
  lecture_credits: '4'
  objectives: '2.1.Fornecer informações básicas e atualizadas sobre:a) definições;b)medidas
    da biodiversidade,c) padrões de distribuição,d) origens e manutenção da diversidade
    biológica, e e)estratégias de uso desta biodiversidade e sua gestão.  Modelos
    e estratégias de gestão: participativa, e de governancia. Gestão da biodiversidade
    por comunidades locais; empreendimentos privados e por governos locais, regionais
    e nacionais. Serão discutidas e contextualizadas a partir de estudos de caso e
    de exemplos de políticas públicas e instrumentos para valorização da diversidade
    biológica, seus produtos e serviços ambientais.2.2. A crescente demanda de informações
    aplicadas ao uso e gestão sustentável da biodiversidade e da busca de alternativas
    para minimizar as perdas devido às mudanças do uso do solo, a expansão da fronteira
    agrícola e a falta de políticas adequadas de valorização da diversidade biológic,
    nos obriga a revermos os atuais modelos de desenvolvimento e de crescimento econômico.  Desta
    forma, os profissionais da área ambiental devem se capacitar para entenderem estes
    processos e buscarem soluções sustentáveis para o uso e gestão dos recursos biológicos,
    de forma direta (produtos) e indireta (serviços).'
  practical_credits: '0'
  total_workload: 60 h
