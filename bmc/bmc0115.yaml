  assessment: 'Provas teóricas sob a forma de testes objetivos e/ou dissertativas.

    Provas práticas pelo reconhecimento e diagnóstico das estruturas presentes em
    modelos, micrografias e lâminas histológicas ao microscópio.

    _______________________________

    OBSERVAÇÃO: Será oferecida prova de recuperação (Res. COG 3583/89) nos meses de
    julho para as disciplinas do 1o semestre e em fevereiro para as disciplinas do
    2o semestre, exigindo-se média igual ou superior a 5,0 (cinco) para aprovação.'
