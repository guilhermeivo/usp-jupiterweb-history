courses:
  activation: 15/07/2025
  assessment: 'Provas teóricas sob a forma de testes objetivos e/ou dissertativas.

    Provas práticas pelo reconhecimento e diagnóstico das estruturas presentes em
    modelos, micrografias e

    lâminas histológicas ao microscópio.

    Será oferecida prova de recuperação (Res. COG 3583/89) nos meses de julho para
    as disciplinas do 1o semestre

    e em fevereiro para as disciplinas do 2o semestre, para alunos com nota final
    entre 3,0 a 4,9 e frequência

    mínima de 70%, exigindo-se média igual ou superior a 5,0 (cinco) para aprovação.
    A nota da prova de

    recuperação substituirá a média obtida anteriormente.'
