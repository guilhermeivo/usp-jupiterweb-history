  course: 'I- Biologia Celular: 1- Membranas celulares; 2- Citoesqueleto; 3-Matriz
    extracelular; 4- Transporte vesicular; 5-Sinalização celular; 6- Ciclo celular;
    7- Morte celular.

    II- Histologia: 1- Tecidos epiteliais; 2- Tecidos conjuntivos próprio e adiposo;
    3- Tecido Nervoso; 4- Tecido

    Muscular; 5- Sangue; 6- Sistema Endócrino.

    III- Embriologia: 1- Gametogênese e Fecundação 2- Blastocisto, Gastrulação, Neurulação
    e Dobramento do

    corpo; 3- Desenvolvimento do Sistema Nervoso e Sensorial 4- Desenvolvimento do
    Sistema Locomotor e

    Miogênese

    Instrumentos e Critérios de Avaliação'
