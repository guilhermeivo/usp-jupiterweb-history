  course: "1.\tINTRODUÇÃO AOS CONCEITOS DE CONFORTO AMBIENTAL.\n2.\tPERCEPÇÃO DO AMBIENTE\
    \ QUANTO AOS ASPECTOS DIMENSIONAIS, TÉRMICOS, ACÚSTICOS E VISUAIS.\n3.\tEXIGÊNCIAS\
    \ HUMANAS DE CONFORTO AMBIENTAL.\n4.\tCOMPORTAMENTO E CONFORTO: FATORES ERGONÔMICOS.\
    \ PSICOLÓGICOS (CONSCIÊNCIA INTERNA); SÓCIO-CULTURAIS (RELAÇÕES INTERPESSOAIS);\
    \ AMBIENTAIS (EXPERIÊNCIA EXTERNA); FÍSICOS (BIOMECÂNICA E ANTROPOMETRIA).\n5.\t\
    PROPORÇÕES E DIMENSÕES E A ESCALA HUMANA\n6.\tUSOS, MOBILIDADE E ACESSIBILIDADE.\n\
    7.\tANÁLISE DE PROJETOS SOB A ÓTICA DO CONFORTO AMBIENTAL.\n8.\tPROGRAMA PRÁTICO:\n\
    8.1. AVALIAÇÃO DA ORGANIZAÇÃO FUNCIONAL DOS ESPAÇOS.\n8.2. MEDIDAS DE CAMPO."
  course_name: 'AUT0270 - Homem, Arquitetura e Urbanismo

    Man, Architecture and Urbanism'
  deactivation: ''
  lecture_credits: '2'
  objectives: SENSIBILIZAR OS ALUNOS QUANTO À IMPORTÂNCIA DO CONFORTO AMBIENTAL NOS
    PROJETOS DE ARQUITETURA E URBANISMO. ESTABELECER, COM OS ALUNOS, A IMPORTÂNCIA
    DA ERGONOMIA E DOS FATORES HUMANOS NO DIMENSIONAMENTO E NO ARRANJO DO AMBIENTE
    CONSTRUÍDO, BEM COMO, ESTIMULAR A PERCEPÇÃO DO IMPACTO DAS CARACTERÍSTICAS PSICOLÓGICAS,
    CULTURAIS, AMBIENTAIS E FÍSICAS DO AMBIENTE SOBRE O DESEMPENHO, A SATISFAÇÃO E
    A SEGURANÇA DO USUÁRIO.
  practical_credits: '1'
  total_workload: 60 h
  type: Semestral
