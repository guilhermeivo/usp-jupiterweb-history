  course: 'Panorama da pós-colheita de frutas, hortaliças e flores. Perdas pós-colheita
    no Brasil. Qualidade pós-colheita. Técnicas para avaliação da qualidade. Fisiologia
    e bioquímica pós-colheita (respiração, transpiração, etileno, transformações bioquímicas).  Desordens
    fisiológicas em frutas e hortaliças. Métodos de conservação (refrigeração, atmosfera
    modificada, atmosfera controlada, reguladores vegetais). Fitopatologia pós-colheita.
    Manejo pós-colheita de frutas, hortaliças e flores. Beneficiamento, classificação,
    padronização e embalagens.  Processamento mínimo de frutas e hortaliças. TEPORICO-PRÁTICO:
    Visitas técnicas a centros de abastecimento e casas de embalagem de produtos hortícolas,
    Atividades demonstrativas. Trabalho prático.'
  course_name: 'LPV0660 - Pós Colheita de Produtos Hortícolas

    Post-Harvest of Horticultural Crops'
  deactivation: ''
  instructors: '2143657 - Angelo Pedro Jacomino

    9734349 - Poliana Cristina Spricigo'
  lecture_credits: '4'
  objectives: 'Transmitir aos alunos conhecimentos de fisiologia e tecnologia pós-colheita
    de frutas, hortaliças e flores, capacitando-os a: - Identificar e diagnosticar
    problemas de pré ou pós-colheita em situações reais de cada produto hortícola.
    Propor soluções adequadas do ponto de vista técnico e econômico. Atuar profissionalmente
    nesta área de trabalho, preenchendo a lacuna existente na cadeia hortícola no
    Brasil.'
