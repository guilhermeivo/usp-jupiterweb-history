  course: 'AGROECOLOGIA

    O Homo sapiens sapiens como entidade biológica e sua evolução alimentar. Da caça
    e coleta ao cultivo de alimentos. Origem da agricultura e domesticação de plantas
    e animais. Centros de origem dos cultivos agrícolas e sua consequência em termos
    de exigências edafo-climáticas. Histórico ambiental e tecnológico da agricultura
    no Mundo e no Brasil. A criação de fertilidade na natureza. Os conceitos de fertilidade
    do sistema e de fertilidade do solo. Os animais e seus efeitos sobre os sistemas
    agrícolas. Manchas de urina e a dinâmica de nitrogênio no sistema. Diretrizes
    da natureza para a criação e manutenção da fertilidade do sistema e sua aplicação
    em sistemas de produção agrícola centrados em hortaliças, culturas anuais e culturas
    perenes. Normas de produção orgânica, certificação orgânica e comercialização
    de produtos orgânicos. Estudo de caso de inciativas de produção orgânica.

    CULTURA DE ALGODÃO

    Classificação das fibras naturais.  Fibras vegetais: produção e aplicações.  Fibras
    artificiais: importância e influência na produção e no consumo de fibras naturais.
    Origem e distribuição da fibra de algodão e uso.  Importância sócio econômica.
    Produtores mundiais, evolução e organização da cotonicultura brasileira e mundial.
    Taxonomia, morfologia e fisiologia.  Influência dos fatores edáficos e climáticos.
    Ciclo vegetativo. Formação e estrutura das fibras; caracteres agronômicos e tecnológicos
    da fibra. Melhoramento genético; cultivares, obtenção e uso. Sistemas de produção:
    convencional, segunda safra e espaçamentos reduzidos . Técnica cultural: planejamento,
    épocas de semeaduras, manejo e preparo do solo, sementes e semeação, condução
    da cultura, uso de reguladores vegetais, nutrição e adubação; manejo fitossanitário.
    Rotação de culturas. Colheita, beneficiamento e comercialização.

    CULTURA DE CAFÉ

    Origem e classificação botânica das principais espécies. Métodos de propagação
    e formação de mudas. Morfologia da planta: caule, raízes, ramos, folhas, flores,
    frutos e semente. Zoneamento agrícola das principais espécies. Fisiologia da germinação,
    crescimento, reprodução e frutificação. Assimilação de carbono e nitrogênio. Fertilidade
    de solo e nutrição da planta.  Sistemas de preparo do solo,instalação, condução
    e tratos culturais. Adubação de plantas novas e em produção e avaliação do estado
    nutricional. Tipos de colheita, preparo e beneficiamento de grãos, e classificação.'
  course_name: 'LPV0564 - Produção de Algodão, Café e Agroecologia

    Cotton And Coffee Production And Introduction To Agroecology'
  deactivation: 31/12/2023
  instructors: '201602 - Carlos Armênio Khatounian

    741511 - Jose Laercio Favarin

    3749501 - Rafael Munhoz Pedroso'
  lecture_credits: '4'
  objectives: Essa disciplina tem dois objetivos complementares. No primeiro bloco,
    referente à Agroecologia, busca introduzir os estudantes na abordagem dos sistemas
    agrícolas como ecossistemas conduzidos pelo homem - agroecossistemas - regidos
    pelos mesmos princípios e leis que os ecossistemas naturais. Utilizam-se os conceitos
    e métodos da ecologia para identificar problemas e soluções no sentido de aprimorar
    os sistemas agrícolas em seus aspectos ambientais.  No segundo bloco, referente
    a plantas fibrosas e estimulantes, propicia aos alunos conhecimentos teórico-práticos
    para entender as plantas de algodão e café como entidades biológicas.
