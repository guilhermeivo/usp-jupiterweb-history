courses:
  activation: 01/01/2019
  assessment: Não haverá recuperação.
  bibliography: 'BRASIL. Ministério da Agricultura, Pecuária e Abastecimento. Secretaria
    de Defesa Agropecuária. Regras para Análise de Sementes. Brasília: MAPA/ACS, 395p,
    2009.

    CARVALHO, N.M.; NAKAGAWA, J. Sementes: Ciência, Tecnologia e Produção. Jaboticabal:
    FUNEP, 590p, 2012.

    PESKE, S.T.; VILLELA, F.A.; MENEGHELLO, G.E. Sementes: Fundamentos Científicos
    e Tecnológicos. Pelotas: Ed. Universitária/UFPel, 573p, 2012.'
  course: Situação da produção de sementes no Brasil. Sistemas de Produção de Sementes.
    Formação das sementes das Angiospermas. Morfologia das sementes. Germinação e
    dormência das sementes. Técnicas específicas para a produção das sementes. Maturação
    e colheita das sementes. Secagem das sementes. Princípios do beneficiamento das
    sementes. Armazenamento das sementes. Finalidades da análise das sementes. Métodos
    para a análise das sementes. Controle da qualidade das sementes.
  course_name: 'LPV0638 - Produção de Sementes

    Seed Production'
  deactivation: ''
  instructors: '2098827 - Ana Dionisia da Luz Coelho Novembre

    5042761 - Francisco Guilhien Gomes Junior'
  lecture_credits: '4'
  objectives: Transferência das informações relacionadas à Tecnologia de Sementes,
    considerando a legislação básica, as técnicas para a produção das sementes em
    campo e após a colheita, tais como o beneficiamento, o tratamento das sementes,
    a conservação e os métodos para a avaliação da qualidade das sementes, além do
    conhecimento básico das máquinas, equipamentos e demais técnicas aplicáveis para
    a produção das sementes, independentemente da espécie vegetal.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
