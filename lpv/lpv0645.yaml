  course: 'Importância econômica e social da floricultura. Situação do mercado nacional
    e internacional. Principais classes de plantas ornamentais. Propagação de plantas
    ornamentais: convencional e cultura de tecidos. Substratos. Melhoramento genético
    de flores e plantas ornamentais. Tecnologias utilizadas no cultivo de flores e
    plantas ornamentais.  Produção de espécies de importância comercial: a) plantas
    de vaso; b) flores de corte; c) folhagens; d) mudas; e) bulbos; f) flores comestíveis.
    Tecnologia de pós-colheita e comercialização de plantas ornamentais. Jardins Verticais
    em ambientes fechados. Arranjos florais. Nas aulas teórico-práticas incluem visitas
    técnicas em produtores comerciais da região e cooperativa de produção de flores.'
  course_name: 'LPV0645 - Floricultura e Plantas Ornamentais

    Floriculture and Ornamental Plants'
