  objectives: Fornecer conhecimentos básicos em floricultura e plantas ornamentais.  Estudar
    tópicos mais relevantes no planejamento, propagação e condução de culturas de
    flores e plantas ornamentais. Implementar a produção e assessoria em plantas ornamentais.
