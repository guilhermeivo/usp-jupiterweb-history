  course: 'FISIOLOGIA DA PRODUÇÃO: Importância econômica e social.  Classificação,
    relações filogenéticas, origem e variedades. Fatores que afetam a produção. Propagação.
    Clima e solo Tratos culturais. Método de condução e orientação do cultivo. Tratamentos
    fitossanitários. Colheita, comercialização e beneficiamento. CULTURAS: Batata,
    Cebola, alho, cenoura, batata-doce, beterraba,  mandioquinha-salsa, rabanete,
    taro, inhame.'
  course_name: 'LPV0622 - Olericultura II ( Hortaliças de Raízes, Tubérculos, Rizomas
    e Bulbos )

    Vegetable crops II (Root, Tubers, Rhizomes and Bulbs)'
  deactivation: ''
  instructors: 3490181 - Fernando Angelo Piotto
  lecture_credits: '4'
  objectives: '· Contribuir para a formação do Engenheiro Agrônomo, dando informações
    teóricas e práticas, da produção de hortaliças de raízes, tubérculos, rizomas
    e bulbos.

    · Dar condições para que o futuro profissional tenha base necessária para conduzir
    uma horta comercial ou assessorar um produtor.

    · Identificar e indicar soluções para os problemas de formação e produção de culturas
    olerícolas.'
