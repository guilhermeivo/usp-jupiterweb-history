  course: 'FISIOLOGIA DA PRODUÇÃO: Importância econômica, alimentar e social. Classificação
    botânica e relações filogenéticas. Variedades. Propagação. Clima e solo. Sistema
    de produção e fatores que o afetam. Tratos culturais. Métodos de orientação e
    condução. Tratamentos fitossanitários. Colheita, conservação, maturação e comercialização
    dos produtos. PLANEJAMENTO: Título.Objetivos. Justificativa. Engenharia do projeto
    CULTURAS:  videira, fruteiras de caroço (pêssego e nectarina), figo, maçã, caqui
    e pequenos frutos (mirtilo, amora-preta e framboesa). As aulas teórico-práticas
    incluem visitas técnicas em plantios comerciais na região.'
  course_name: 'LPV0642 - Fruticultura Temperada

    Temperate Fruit Crops'
  deactivation: ''
