  lecture_credits: '4'
  objectives: 'Dar ao aluno condições para: - Fazer e desenvolver o planejamento agricola
    de pomar de frutíferas de clima temperado. - Identificar e indicar soluções para
    os problemas de formação de pomares e produção de culturas frutíferas de clima
    temperado. - Administrar ou assessorar na condução de um pomar comercial.'
