  course: I. Introdução I.1. Evolução e domesticação das plantas cultivadas I.2. Seleção
    natural e adaptação vegetal. I.3. Natureza e mecanismos de adaptações de importância
    agronômica I.4. Origem e histórico da agricultura I.5. Organização agrícola das
    primeiras civilizações.  II. Agroecossistemas II.1. Conceituação II.2. Ecossistema
    natural x Ecossistema agrícola. II.3. Estrutura e função dos agroecossistemas.
    II.4. Características dos agroecossistemas. II.5. Planificação dos agroecossistemas.
    II.6. Estratégias básicas de manejo III. Sistema Convencional de Produção. III.1.
    Origem e breve histórico. III.2. Conceituação e importância. III.3. Métodos de
    preparo do solo. III.4. Efeitos do revolvimento excessivo do solo. III.5. Análise
    crítica do sistema III.6. Problemas emergenciais.  IV. Sistemas de rotação de
    Culturas IV.1. Importância e conceituação. IV.2. Benefícios de sua utilização
    IV.3. Limitações para sua efetiva adoção IV.4. Sistemas potenciais de rotação
    de culturas.  V. Plantio Direto e Cultivo Mínimo. V.1. Breve histórico V.2. Conceituação
    e Importância. V.3. Pré-requisitos básicos V.4. Vantagens e desvantagens do sistema.
    V.5. Máquinas e Implementos específicos.  V.6. Cobertura Vegetal de outono/inverno
    V.7. A problemática de pragas, doenças e plantas invasoras inerentes aos sistemas
    considerados. V.8. Implantação e manejo de sistemas de plantio direto e cultivo
    mínimo. VI. Sistemas Consorciados de Produção. VI.1. Importância e conceituação
    VI.2. Benefícios da diversificação de culturas. VI.3. Fundamentos biológicos da
    consorciação. VI.4. Arranjo espacial de plantas. VI.5. Sistemas consorciados de
    culturas anuais. VI.6. Sistemas consorciados de culturas perenes. VI.7. Sistemas
    consorciados de culturas anuais e perenes VII. Sistemas Integrados de Produção.
    VII.1. Importância e conceituação. VII.2. Levantamento e estudo dos elementos
    potenciais de integração. VII.3. Planificação e implantação de sistemas integrados
    de produção. VII.4. Alguns exemplos de sistemas diversificados e integrados de
    produção de importância agropecuária. VIII. Integração Agricultura-Pecuária VIII.1.
    Importância atual.VIII.2. Sistema Barreirão e Santa Fé. VIII.3. Pastagens sob
    pivô central. VIII.4.Sistemas agrosilvopastoris. IX. Sistemas de Produção na Empresa
    Agrícola IX.1 Princípios básicos de gerenciamento; IX.2  Integração de atividades;
    IX.3. Visão holística do processo produtivo; IX.4. Adequação ambiental (importância
    e estratégias); IX.5. Gestão de processos e IX.6. Gestão por qualidade
  course_name: 'LPV0664 - Sistemas de Produção

    Production Systems'
  deactivation: ''
  instructors: '201602 - Carlos Armênio Khatounian

    741511 - Jose Laercio Favarin

    2086021 - Marcos Silveira Bernardes'
  lecture_credits: '4'
  objectives: 'a) Estudar as características e, principalmente, as limitações do agroecossistema
    ou ecossistema agrícola.

    b) Apresentar, analisar e discutir os fatores envolvidos no estabelecimento de
    sistema de produção.

    c) Discutir critérios relativos à adequação, auto-sustentação, diversificação
    e integração de sistemas de produção.

    d) Discutir a potencialidade e a importância do emprego de sistemas de produção
    adequados às condições ambientais e sócio-econômicas reinantes, mediante o estudo
    analítico de modelos estabelecidos.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
