  course: '3. PROGRAMA ANALÍTICO: Histórico da área irrigada no Brasil e no mundo.
    Clima das regiões produtoras do Brasil. Fontes de suprimento de água. Propriedade
    físico-hídricas dos principais solos brasileiros. Principais métodos de irrigação
    e suas adequações em função das culturas. Feijão irrigado. Milho Irrigado. Umidade
    de manejo. Modelos estatísticos e deterministicos para previsão de safra em condições
    de agricultura irrigada. Manejo da irrigação: Métodos de controle de irrigação.
    Irrigação por sulcos.  Ciclo vegetativo da planta e a necessidade de água. Método
    conjugado. Análise quantitativa de crescimento. Distribuição do sistema radicular
    das plantas. Sistema condutor de água na planta. Principais fatores que afetam
    a absorção. Abertura e fechamento dos estômatos. Transpiração. Evapotranspiração.
    Evapotranspiração máxima e real da cultura. Coeficiente de eficácia de produtividade.
    Desenvolvimento relativo, temperatura basal e índice térmico da cultura de interesse.
    Estimativa do armazenamento diário de água no solo, da lâmina mínima e máxima
    de irrigação. Aplicabilidade do método. Exemplo prático para às culturas de milho
    e feijão.  Quimigação: Fertirrigação: histórico, vantagens e limitações. Aplicação
    de fertilizantes via pivô central. Manejo da fertirrigação. Fungigação. Herbigação,
    Insetigação. Sistema notliada.'
