  course: 'TEÓRICO:

    - Apresentação da disciplina. Introdução à Horticultura. Planejamento de pomares

    - Aspectos teóricos da multiplicação de plantas (produção de gametas, formação
    do zigoto e da semente, juvenilidade, matrizes, mutações), Multiplicação por sementes,
    Estaquia, Enxertia, Mergulhia, Alporquia, Micropropagação.

    - Fruticultura: Aspectos teóricos da produção de fruteiras de clima tropical,
    subtropical e temperado, com ênfase para as culturas do maracujazeiro, abacateiro,
    bananeira, videira, citros e goiabeira.

    - Colheita e pós-colheita de frutas.

    PRÁTICO:

    Atividades práticas, complementares aos assuntos lecionados em aulas teóricas,
    a saber: Métodos de multiplicação de plantas (sementes: quebra de dormência, apomixia,
    semeadura, transplante; estaquia: seleção da planta doadora, coleta e preparo
    de estacas; enxertia: métodos de borbulhia e garfagem; mergulhia: mergulhia de
    cepa; alporquia: seleção de ramos, preparo e observação de alporques), podas de
    plantas frutíferas e outros tratos culturais. Manejo das principais fruteiras,
    com ênfase para as culturas do maracujazeiro, abacateiro, bananeira, videira,
    citros e goiabeira. Aulas práticas inclui uma viagem técnica para área de produção
    de abacate do Departamento de Produção Vegetal.'
  course_name: 'LPV0448 - Fruticultura

