  objectives: Fornecer aos alunos os conhecimentos necessários para o desenvolvimento
    de atividades profissionais na área de Horticultura, com ênfase à propagação de
    plantas, planejamento e implantação de pomares, e manejo de fruteiras. Estas informações,
    além de essenciais para o currículo profissional do Engenheiro Agrônomo, também
    são necessárias para aqueles alunos que desejarem cursar disciplinas mais avançadas
    (optativas) na área de fruticultura.
