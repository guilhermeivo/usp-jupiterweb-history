  course: 'Olericultura: Culturas de tomate, batata, batata-doce, repolho, cenoura,
    cebola, alface, pepino. Tópicos a serem abordados: Importância da cultura. Origem,
    relação filogenética e classificação. Fatores que afetam a produção. Produção
    e tratos culturais. Colheita, beneficiamento e comercialização. Floricultura:
    Situação da produção e comercialização de flores e plantas ornamentais no Brasil
    e no mundo. Culturas mais importantes. Fatores que afetam a produção. Colheita,
    beneficiamento e comercialização. Paisagismo: Introdução ao paisagismo. Conceitos
    básicos. Histórico dos Jardins. Estilos de Jardins. Grupos de Plantas Ornamentais.
    Planejamento básico de um projeto paisagístico: levantamento, anteprojeto, projeto
    executivo.'
  course_name: 'LPV0480 - Olericultura, Floricultura e Paisagismo

