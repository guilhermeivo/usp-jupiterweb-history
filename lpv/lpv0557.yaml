  course: 'Arroz: Importância econômica: origem e difusão geográfica. Situação econômica
    e perspectivas. Morfologia, fisiologia e fenologia da cultura.  Manejo de cultivares.
    Sistemas de instalação e condução de lavouras. Problemas da cultura no Brasil.
    Nutrição e adubação. Plantas daninhas: principais espécies, prejuízos e sistemas
    de controle. Problemas fitossanitários e métodos de controle. Sistematização de
    áreas para o cultivo irrigado. Manejo da água de irrigação. Colheita, secagem,
    beneficiamento, classificação do produto e comercialização.

    Trigo: Importância econômica: origem e difusão geográfica. Situação econômica
    e perspectivas. Morfologia, fisiologia e fenologia da cultura.  Manejo de cultivares.
    Exigências climáticas e problemas com adversidades. Problemas da cultura no Brasil.
    Nutrição e adubação. Problemas fitossanitários e de plantas daninhas e métodos
    de controle. Outras culturas opcionais de inverno.

    Feijão - Importância econômica: origem e difusão geográfica. Classificação botânica.  Morfologia
    da planta.  Principais variedades. Qualidade fisiológica de sementes. Problemas
    da cultura no Brasil. Classificação comercial das variedades e propriedades organolépticas.  Ecofisiologia
    e Fenologia. Instalação da cultura. Técnica cultural: tratos culturais; consorciação
    e rotação de culturas; nutrição e adubação; manejo das principais pragas e doenças;
    irrigação. Colheita.

    Milho - Importância econômica. Origem e difusão geográfica.  Características botânicas.
    Problemas da cultura no Brasil. Grupos genéticos, variedades e híbridos.  Ecofisiologia
    e Fenologia. Instalação da cultura: semeadura convencional, cultivo mínimo e plantio
    direto.  Técnica cultural: Manejo de população e distribuição espacial de plantas;
    nutrição e adubação; manejo de pragas e doenças.  Adubação verde, rotação e consorciação
    de culturas.  Colheita: modalidades, época e demais fatores influentes.  Milhos
    especiais: milho de pipoca e milho verde.  Produção de sementes de milho híbrido.
    Beneficiamento de sementes. Armazenamento.'
  course_name: 'LPV0557 - Produção de Arroz, Feijão, Milho e Trigo

