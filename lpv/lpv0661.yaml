  course: ': TEÓRICO: A disciplina aborda as seguintes culturas frutíferas: abacaxi,
    manga, citros, mamão.  Para cada uma dessas culturas, os seguintes tópicos serão
    estudados: Importância econômica, alimentar e social; Classificação botânica e
    relações filogenéticas; Variedades; Produção de mudas; Clima e solo; Fisiologia
    da produção; Nutrição e adubação; Tratos culturais; Pragas e doenças; Colheita
    e pós-colheita; Processamento e comercialização AULAS PRÁTICAS E EXCURSÕES: Identificação
    de espécies e cultivares de fruteiras. Produção de mudas de fruteiras. Visitas
    a viveiros comerciais e empresas produtoras especializadas na produção de frutas
    tropicais e subtropicais.'
  course_name: 'LPV0661 - Fruticultura Tropical e Subtropical

    Tropical and Subtropical Fruit Crops'
  deactivation: ''
  instructors: 63258 - Francisco de Assis Alves Mourao Filho
  lecture_credits: '4'
  objectives: 'Dar ao aluno condições para:

    · Realizar planejamento agrícola de pomar de frutíferas tropicais e subtropicais.

    · Identificar e indicar soluções para os problemas de formação de pomares e produção
    de culturas frutíferas.'
