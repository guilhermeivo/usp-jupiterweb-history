  course: "T -Apresentação da disciplina, origem e evolução das plantas daninhas.\
    \ P -Levantamento de plantas daninhas. T -Dinâmica do banco de sementes de plantas\
    \ daninhas em agroecossistemas. T -Competição e métodos de estudos de competição\
    \ entre plantas daninhas e cultivadas. T -Alelopatia na agricultura. T -Controle\
    \ biológico das plantas daninhas. T -Processos preventivos de manejo das plantas\
    \ daninhas. T -Métodos mecânicos e não convencionais de controle das plantas daninhas.\
    \ P -Tecnologia de aplicação de herbicidas. T -Resistência de plantas daninhas\
    \ aos herbicidas. P -Avaliação de biotipos resistentes de plantas daninhas aos\
    \ herbicidas\tinibidores da ALS e ACCase. T -Impacto ambiental do uso de herbicidas.\
    \ P -Formulação de herbicidas e importância nas aplicações de campo. T -Ecotoxicologia\
    \ de herbicidas.T -Possibilidades de utilização de plantas geneticamente modificadas\
    \ resistentes aos herbicidas. T - Manejo integrado de plantas daninhas."
  course_name: 'LPV0672 - Biologia e Manejo de Plantas Daninhas

    Weed Biology and Management'
  deactivation: ''
  instructors: '54394 - Pedro Jacob Christoffoleti

    3749501 - Rafael Munhoz Pedroso

    69192 - Ricardo Victoria Filho'
  lecture_credits: '4'
  objectives: Fornecer informações sobre a biologia e ecologia das plantas daninhas,
    relacionando as com a dinâmica populacional e interferência que estas espécies
    vegetais causam sobre as plantas cultivadas.  Assim, estas relações poderão ser
    utilizadas na racionalização do manejo integrado das plantas daninhas em agroecossistemas,
    através do emprego dos diversos métodos e tecnologias de controle utilizados na
    agricultura moderna.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
