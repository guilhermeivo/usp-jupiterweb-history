  course: Introdução à Olericultura I; Produção de mudas de hortaliças; Cultivo de
    hortaliças da família Cucurbitaceae (melancia e pepino); cultivo de hortaliças
    da família Asteraceae (alface); cultivo de hortaliças da família Solanaceae (tomate
    de mesa; pimentão) cultivo de hortaliças da família Brassicaceae (couve-flor e
    brócolis); colheita e comercialização de hortaliças. As aulas teóricas serão consolidadas
    com as aulas práticas a serem realizadas em propriedades rurais, para que o aluno
    possa vivenciar as práticas de manejo adotadas no campo para o cultivo de hortaliças
    de folhas, flores e frutos. Nas aulas teórico-práticas incluem visitas técnicas
    em produtores de hortaliças na região.
  course_name: 'LPV0621 - Olericultura I ( Hortaliças de Flores, Frutos e Folhas)

    Vegetable crops I (Flower, Fruit and Leaf Vegetables)'
