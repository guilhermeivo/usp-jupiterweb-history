  course: "01.\tApresentação do programa da disciplina, do sistema de avaliação, do\
    \ calendário de provas e da bibliografia básica. Panorama da setor canavieiro.\
    \ Visita ao campo para primeiros contatos com cana-de-açúcar.\n02.\tOrigem e importância\
    \ econômica\n03.\tBotânica e fisiologia.\n04.\tClima e ecofisiologia.\n05.\tPrimeira\
    \ visita técnica\n06.\tSolos e nutrição mineral. Adubação, acidez e calagem. Preparo\
    \ do solo.\n07.\tSegunda visita técnica\n08.\tSistemas de produção e produção\
    \ de mudas\n09.\tInstalação da cultura.\n10.\tTratos culturais de cana-planta\
    \ e cana-soca.\n11.\tTerceira visita técnica\n12.\tFitossanidade: Pragas e doenças\n\
    13.\tColheita.\n14.\tUsos da cana-de-açúcar: matéria-prima para agroindústria\
    \ do açúcar, álcool e aguardente, forragem e consumo direto.\n15.\tControles e\
    \ custos de produção, planejamento da produção.\nInclusão sobre realização  de\
    \ oito visitas técnicas (aulas práticas) em  usinas de cana de açúcar, canavial,\
    \ CTC, Coplacana"
  course_name: 'LPV0683 - Produção de Cana-de-Açúcar

    SugarCane Crop Production'
  deactivation: ''
  instructors: 9197917 - Renan Caldas Umburanas
  lecture_credits: '4'
  objectives: Proporcionar aos alunos conhecimentos de natureza básica e aplicada
    sobre as técnicas de produção vegetal da cana-de-açúcar, de maneira a capacitá-los
    no reconhecimento e diagnóstico de problemas relacionados à produção, visando
    à adoção de medidas que resultem em maior eficiência técnico-econômica do sistema
    de produção vegetal.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
