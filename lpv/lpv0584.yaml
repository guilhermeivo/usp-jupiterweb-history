  course: 'Cana-de-açúcar e Soja

    Apresentação da disciplina e do sistema de avaliação. Visita a canteiros didáticos
    para primeiros contatos com cana-de-açúcar e soja. Cana-de-açúcar: a) importância
    econômica; b) estudo da planta (classificação botânica, descrição agrobotânica,
    fenologia, melhoramento genético e cultivares); c) ecofisiologia (solo, clima
    e produtividade); d) planejamento e instalação da cultura; e) tratos culturais
    de cana-planta e cana-soca; f) nutrição mineral, calagem e adubação; g) colheita
    e sistemas de produção. Soja: a) importância econômica; b) estudo da planta (classificação
    botânica, descrição agrobotânica, fenologia, melhoramento genético e cultivares);
    c) ecofisiologia (solo, clima e produtividade); d) planejamento e instalação da
    cultura; e) tratos culturais de cana-planta e cana-soca; f) nutrição mineral,
    calagem e adubação; g) colheita e sistemas de produção.'
  course_name: 'LPV0584 - Produção de Cana e Soja

    Sugarcane And Soybean Production'
  deactivation: 31/12/2023
  instructors: 2086021 - Marcos Silveira Bernardes
  lecture_credits: '4'
  objectives: Proporcionar aos alunos conhecimentos de natureza básica e aplicada
    sobre as técnicas de produção vegetal das culturas de cana-de-açúcar, mandioca
    e soja, de maneira a capacitá-los no reconhecimento e diagnóstico de problemas
    relacionados à produção visando a adoção de medidas que resultem em maior eficiência
    técnico-econômica do sistema de produção vegetal. Visa também, educar os alunos
    na adoção e interpretação da nomenclatura técnica inerente aos agronegócios dessas
    culturas.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
