  course: Origens da Agricultura, domesticação de plantas e animais e regiões de origem
    de espécies domésticas. O Conceito de conforto fisiológico. 2. A abordagem sistêmica
    na produção agrícola, com ênfase nas explorações em que predomina mão de obra
    familiar. 3. A natureza como modelo para a estruturação e o manejo de sistemas
    de produção agrícola. Diretrizes aprendidas da natureza para a estruturação e
    condução dos sistemas. 4. Principais criações domésticas, características alimentares
    e digestórias e seus estercos. 5. O conceito de fertilidade do sistema, em oposição
    à fertilidade do solo. Aplicações do conceito de fertilidade do sistema e das
    diretrizes aprendidas da natureza na condução de diferentes explorações agrícolas.
    6. Alimentação sustentável e produção para consumo local. 7. Energia na Agricultura.
    8. Agricultura Orgânica – legislação e comercialização. 8. Agricultura de base
    ecológica e os desafios para a alimentação humana e a conservação dos recursos
    naturais no século XXI. 9. Elaboração de planos de conversão para a agricultura
    de base ecológica. Nas aulas teórico-práticas estão incluídas visitas técnicas
    a iniciativas de referência em produção orgânica na região.
  course_name: 'LPV0513 - Agroecologia e Agricultura Orgânica

    Agroecology and Organic Agriculture'
  deactivation: ''
  instructors: 201602 - Carlos Armênio Khatounian
  lecture_credits: '4'
  objectives: Agroecologia e Agricultura Orgânica é um curso direcionado para a síntese
    de conhecimento das ciências agrárias, tendo como eixo pedagógico o desenvolvimento
    de um plano de conversão para estilos de agricultura mais sustentáveis. Está voltado
    ao desenvolvimento regional, tendo como ênfase os aspectos biológicos da construção
    de agroecossistemas mais sustentáveis, incluindo temáticas sócio-econômicas e
    culturais relevantes para essa construção. No final do curso, espera-se que o
    participante esteja apto a diagnosticar, analisar, planejar e manejar sistemas
    de produção agrícola em bases ecológicas nas condições reais em que os sistemas
    operam.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
