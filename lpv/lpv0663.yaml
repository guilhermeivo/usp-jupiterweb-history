  course: 'Introdução ao cultivo protegido de hortaliças; Tipos de estruturas; Manejo
    da ambiência; Sistemas de cultivo de hortaliças em ambiente protegido (substrato
    e hidropônico) e fechado (indoor); manejo da água, manejo da nutrição de plantas,
    uso da iluminação artificial e outras práticas de manejo.

    As aulas teóricas sobre os assuntos descritos serão consolidadas através do conhecimento
    adquirido nas aulas práticas. As aulas práticas serão referentes aos seguintes
    assuntos: estruturas para o cultivo em ambiente protegido e fechado; manejo da
    ambiência (sistemas de controle dos fatores ambientais); cultivo em substrato;
    cultivo em sistema hidropônico; cultivo de hortaliças em ambiente fechado (indoor);
    sistemas de irrigação em ambiente protegido; manejo da fertirrigação. Nas aulas
    teórico-práticas estão incluídas visitas técnicas a produtores e empresas relacionados
    ao setor.'
  course_name: 'LPV0663 - Cultivo Protegido de Hortaliças

    Protected Cultivation of Vegetables'
