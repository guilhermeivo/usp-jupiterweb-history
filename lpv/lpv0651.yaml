  course: 'Conceito e importância. Ecologia da Paisagem. Áreas verdes urbanas. Histórico
    da arte dos jardins. Planejamento do jardim. Estudos básicos. Classificação de
    jardins. O jardim residencial: conceito e objetivos.  Estruturação das áreas básicas.
    Elementos de trabalho: plantas ornamentais: palmeiras, anuais, árvores, arbustos,
    trepadeiras, gramados e forrações. Materiais arquitetônicos. Características dos
    elementos. Princípios de composição. Representação gráfica do projeto e dos elementos.
    O ante-projeto. Memorial descritivo: objetivos, o local, características paisagísticas
    do projeto, identificação dos elementos,. orçamento e contrato:custo de plantas
    e outros materiais. Custo de mão-de-obra e de execução. A praça pública: objetivos,
    características, estruturação das áreas básicas. Arborização das ruas. Objetivos.
    O sistema viário urbano. Plantas para as ruas e suas características. Implantação
    do projeto e manejo do jardim. Nas aulas teórico-práticas incluem visitas técnicas
    em viveiros e cooperativa da região.'
  course_name: 'LPV0651 - Paisagismo, Parques e Jardins

    Landscaping, Parks and Gardens'
