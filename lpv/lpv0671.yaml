  course: 'Conceito, histórico, origem e danos causados pelas plantas daninhas. Sistemática
    das plantas daninhas: monocotiledôneas e dicotiledôneas. Classificação, estratégias
    evolutivas e disseminação das plantas daninhas. Dinâmica de populações e banco
    de sementes de plantas daninhas no solo. Competição de plantas daninhas. Alelopatia.
    Efeitos alelopáticos de importância prática. Métodos de controle das plantas daninhas:
    preventivo, cultural e mecânico. Métodos de controle das plantas daninhas: biológico
    e químico. Bioensaios. Translocação dos herbicidas nas plantas e seletividade.
    Avaliação da eficácia e seletividade dos herbicidas. Formulação e equipamentos
    para aplicação dos herbicidas. Mecanismos de ação dos herbicidas. Resistência
    das plantas daninhas aos herbicidas. Experimentação, calibração e cálculos. Impacto
    ambiental dos herbicidas. Lixiviação dos herbicidas no solo. Controle de plantas
    daninhas em: culturas anuais (soja, milho, feijão); culturas anuais (arroz, algodão,
    amedoim); pastagem e florestas; fruticultura; culturas perenes (cana-de-açúcar
    e café). Controle de plantas daninhas em Olericultura e manejo de plantas aquáticas.
    As aulas práticas incluem uma visita técnica na área de agricultura do Departamento
    de produção vegetal.'
  course_name: 'LPV0671 - Controle das Plantas Daninhas

    Weed Control'
  deactivation: ''
