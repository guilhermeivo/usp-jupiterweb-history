  objectives: Fornecer aos alunos informações sobre a biologia das plantas daninhas
    e as interferências que causam as plantas cultivadas.  Essas informações serão
    utilizadas no manejo integrado das plantas daninhas nas diferentes culturas agrícolas
    e outras áreas de interesse.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
