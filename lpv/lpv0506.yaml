  course: '1. Apresentação do programa da disciplina, do sistema de avaliação, do
    calendário de provas e da bibliografia básica. Visita ao campo para primeiros
    contatos com as plantas oleaginosas de ciclo anual. 2. Soja: importância econômica
    e estudo da planta (descrição agrobotânica e fenologia). 3. Soja: estudo da planta
    (hábitos de crescimento, melhoramento e cultivares). 4. Soja: ecofisiologia (elementos
    de clima e produtividade). 5. Soja: ecofisiologia (elementos de solo e produtividade).
    6. Soja: nutrição mineral, calagem e adubação. 7. Soja: preparo da área agrícola
    (preparo convencional, preparo mínimo e plantio direto). 8. Soja: instalação da
    cultura I (épocas de semeadura, qualidade da semente e preparo da semente). 9.
    Soja: Instalação da cultura II (semeadura e adubação de base; profundidade de
    semeadura; manejo populacional e manejo varietal da cultura). 10. Soja: condução
    da cultura I (manejo das plantas daninhas). 11. Soja: condução da cultura II (manejo
    das principais pragas e doenças). 12. Soja: colheita e sistemas de produção. 13.  Amendoim:
    problemas da produção, estudo da planta e ecofisiologia.  14. Amendoim: instalação,
    condução e colheita.  15. Girassol: problemas da produção, estudo da planta e
    ecofisiologia. 16. Girassol: instalação, condução e colheita. 17. Revisão da matéria
    lecionada.'
  course_name: 'LPV0506 - Plantas Oleaginosas

    Oil Plants'
  deactivation: ''
  instructors: '5042761 - Francisco Guilhien Gomes Junior

    9197917 - Renan Caldas Umburanas'
  lecture_credits: '4'
  objectives: 'Proporcionar aos alunos conhecimentos de natureza básica e aplicada
    sobre as técnicas de produção das

    principais plantas oleaginosas de ciclo anual, desenvolver o raciocínio crítico
    quanto às tecnologias

    atualmente disponíveis e capacitá-los no reconhecimento de problemas relacionados
    à produção, ao manejo

    do sistema de produção vegetal, com ênfase para as culturas de soja, amendoim
    e girassol. Visa também

    difundir a adoção e interpretação da nomenclatura técnica inerente aos agronegócios
    das plantas oleaginosas.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
