  course: 'Teórico

    Introdução a Microbiologia. Classificação dos microrganismos: seres procariotos
    e eucariotos; categorias taxonômicas; esquemas de classificação. Características
    dos principais grupos de microrganismos: fungos, bactérias, vírus. Nutrição e
    cultivo de bactérias e fungos. Metabolismo fúngico e bacteriano. Taxonomia e ultra-estrutura
    de fungos e bactérias. Controle de microrganismos: agentes químicos e físicos.
    Relações entre os microrganismos e os seres vivos. Microrganismos e Engenharia
    Genética / Biotecnologia.

    Prático

    Observação microscópica de fungos e bactérias; métodos para coloração de microrganismos;
    preparo de meio de cultivo; manutenção e cultivo de microrganismos; efeitos de
    agentes químicos e físicos sobre microrganismos; produção de exoenzimas; antagonismo
    microbiano; associações simbióticas; análise microbiológica da água; isolamento
    de microrganismos do solo e do ar.'
  course_name: 'LFN0225 - Microbiologia Geral

    General Microbiology'
  deactivation: ''
  instructors: 2162461 - Francisco Andre Ossamu Tanaka
  lecture_credits: '4'
  objectives: Fornecer ao aluno informações básicas da biologia dos microrganismos,
    propiciando condições para o entendimento de aspectos relacionados com a caracterização,
    nutrição, crescimento, controle e inter-relações entre esses organismos. Capacitar
    o aluno no acompanhamento, dentro da grade curricular das Ciências Biológicas,
    de assuntos relacionados à Microbiologia.
