  assessment: Aplicação de uma única prova compreendendo toda a matéria lecionada
    no semestre
  bibliography: 'Alexander, M. 1999. Biodegradation and Bioremediation. Academic Press,
    New York. 472 p.

    Bergamin Filho, A., Kimati, K. & Amorim, L. (Eds) 1995. Manual de Fitopatologia
    Vol. I. Ed. Agronômica Ceres, São Paulo. 919 p.

    Maier, R. (Ed.). 2000. Environmental Microbiology. Academic Press, New York. 608
