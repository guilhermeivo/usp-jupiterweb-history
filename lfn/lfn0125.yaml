    Pelczar, M.J., Chan, E.C.S. & Krieg, N.R. 1996. Microbiologia: conceitos e aplicações.
    Vol. II. Makron Books, São Paulo. 517 p.'
  course: ':   Teórico: taxonomia e classificação de microrganismos; características
    morfológicas e ultra-estruturais de fungos, bactérias e vírus; atividade microbiana
    relacionada aos ciclos geoquímicos do carbono, nitrogênio e enxofre; aspectos
    sobre microbiologia do ar, da água, do solo, de esgotos e de resíduos agrícolas
    e industriais.

    Prático: técnicas para observação microscópica de fungos e bactérias; esterilização,
    meios de cultivo-tipos e preparo, métodos aplicados ao isolamento de microrganismos
    do solo, da água e do ar; tratamento da água e análise da qualidade sanitária.'
  course_name: 'LFN0125 - Microbiologia Ambiental

    Environmental Microbiology'
  deactivation: ''
  instructors: '52923 - Ivan Paulo Bedendo

    1505492 - Nelson Sidnei Massola Júnior'
  lecture_credits: '2'
  objectives: ': Dotar os alunos de conhecimentos básicos sobre os diferentes grupos
    de microrganismos e suas atividades nos principais processos biológicos que se
    desenvolvem no ambiente.'
  practical_credits: '0'
