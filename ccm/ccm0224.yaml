  course: 'Princípios de Espectroscopia

    1) Breve histórico da evolução da espectroscopia. Natureza da radiação eletromagnética
    e interação radiação/matéria (breve recordação). Simetria, grupos de ponto e teoria
    de grupos.

    2) Aplicações da teoria de grupos: Simetria de orbitais moleculares e construção
    do diagrama de orbitais moleculares em moléculas com mais de 2 átomos. Modos vibracionais
    e princípios da espectroscopia vibracional.3) Espectroscopia eletrônica: Estados
    de energia eletrônicos de átomos e íons gasosos, termos espectroscópicos; estados
    eletrônicos de espécies poliatômicas; aproximação de Born-Oppenheimer; espectros
    de absorção e emissão; transições eletrônicas, momento de transição e força do
    oscilador; Regras de seleção e aplicações da teoria de grupos.

    Química de Coordenação

    4) Desenvolvimento histórico, evolução do modelo de coordenação. Isomeria e estereoquímica
    de compostos de coordenação. Isomeria constitucional e espacial, isomeria conformacional.

    5) Estrutura eletrônica dos íons metálicos. Esquema Russel-Saunders, repulsão
    intereletrônica, parâmetros de Racah.

    6) Teoria do campo ligante, desdobramento energético dos orbitais, efeito Jahn-Teller,
    energias de estabilização de campo ligante.

    7) Espectroscopia eletrônica em complexos - transições d-d, regras de seleção,
    diagramas de Tanabe-Sugano, interpretação de espectros de campo ligante. Teoria
    dos orbitais moleculares para compostos de coordenação, série espectroquímica
    e nefelauxética, espectros de transferência de carga e intervalência. Propriedades
    Magnéticas.

    8) Termodinâmica e equilíbrio na química de coordenação - abordagem de Klopman,
    constantes de estabilidade, efeito quelato, solvatação iônica, potenciais redox.
    Cinética e reatividade de compostos de coordenação - aspectos dinâmicos em solução,
    labilidade e inercia, mecanismos de substituição, transferência de elétrons e
    de ativação de ligante.

    9) Compostos organometálicos e clusters. Ligação metal-metal. Catálise envolvendo
    compostos de coordenação. Aspectos bioinorgânicos e ambientais: metais em sistemas
    biológicos, transporte de oxigênio, processos enzimáticos. Aspectos toxicológicos
    e ambientais.'
