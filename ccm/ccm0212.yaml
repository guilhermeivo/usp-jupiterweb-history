  course_name: 'CCM0212 - Fisica III

    Physics III'
  deactivation: ''
  instructors: 73854 - Antonio Martins Figueiredo Neto
  lecture_credits: '6'
  objectives: Introduzir os conceitos básicos que explicam os diversos fenômenos físicos
    relacionados com a eletricidade e magnetismo. Utilizar o cálculo diferencial e
    integral para descrever esses fenômenos. Sintetizar a teoria nas quarto equações
    de Maxwell. Desenvolver no estudante a habilidade para compreender e resolver
    problemas relacionados com o eletromagnetismo.
