  course: "1. Visão geral do eletromagnetismo.\n(a)\tForças elétricas e magnéticas.\n\
    (b)\tA noção de campo.\n(c)\tO impacto do eletromagnetismo na ciência e na tecnologia\n\
    2. Revisão do cálculo vetorial integral e diferencial.\n3. Eletrostática.\n(a)\t\
    Lei de Coulomb.\n(b)\tPotencial Elétrico.\n(c)\tLei de Gauss.\n(d)\tAplicações\
    \ da lei de Gauss.\n(e)\tDipolo elétrico.\n(f)\tCampo de condutores carregados.\n\
    (g)\tEnergia eletrostática.\n4. Dielétricos.\n(a) Constante dielétrica e vetor\
    \ de polarização.\n(b)\tEquações da eletrostática em dielétricos.\n(c)\tCondições\
    \ de contorno em dielétricos\n5. Magnetostática.\n(a)\tLei de Ampère.\n(b)\tO\
    \ potencial escalar magnético\n(c)\tA lei de Biot e Savart\n(d)\tDipolo magnético.\n\
    (e)\tForça magnética sobre uma corrente\n(f)\tEnergia de um dipolo magnético.\n\
    6. O fenômeno da indução.\n(a)\tA lei da indução\n(b)\tA lei de Lenz\n(c)\tMotores,\
    \ geradores e tecnologia eletromagnética.\n(d)\tAceleração de partículas em campos\
    \ elétricos induzidos.\n(e)\tIndutância mútua e auto-indutância.\n(f)\tEnergia\
    \ magnética.\n7. Magnetismo na matéria.\n(a) Diamagnetismo e paramagnetismo.\n\
    (b)\tMomento angular na Mecânica Quântica.\n(c)\tFerromagnetismo.\n(d)\tCondições\
    \ de contorno em materiais magnéticos\n8. As equações de Maxwell.\n(a) A corrente\
    \ do deslocamento.\n(b)\tPropagação dos campos elétricos e magnéticos.\n(c)\t\
    Ondas eletromagnéticas planas e esféricas.\n(d)\tCampos de um dipolo oscilante.\n\
    Program\n1. Overview of Electromagnetism.\n(a) Electric and Magnetic Forces.\n\
    (b) The concept of field.\n(c) The impact of electromagnetism on science and technology.\n\
    2. Review of Vector Calculus, Integral and Differential.\n3. Electrostatics.\n\
    (a) Coulomb's Law.\n(b) Electric Potential.\n(c) Gauss's Law.\n(d) Applications\
    \ of Gauss's Law.\n(e) Electric Dipole.\n(f) Field of Charged Conductors.\n(g)\
    \ Electrostatic Energy.\n4. Dielectrics.\n(a) Dielectric Constant and Polarization\
    \ Vector.\n(b) Electrostatic Equations in Dielectrics.\n(c) Boundary Conditions\
    \ in Dielectrics.\n5. Magnetostatics.\n(a) Ampere's Law.\n(b) Magnetic Scalar\
    \ Potential.\n(c) Biot-Savart Law.\n(d) Magnetic Dipole.\n(e) Magnetic Force on\
    \ a Current.\n(f) Energy of a Magnetic Dipole.\n6. The Phenomenon of Induction.\n\
    (a) Faraday's Law of Induction.\n(b) Lenz's Law.\n(c) Motors, Generators, and\
    \ Electromagnetic Technology.\n(d) Particle Acceleration in Induced Electric Fields.\n\
    (e) Mutual Inductance and Self-Inductance.\n(f) Magnetic Energy.\n7. Magnetism\
    \ in Matter.\n(a) Diamagnetism and Paramagnetism.\n(b) Angular Momentum in Quantum\
    \ Mechanics.\n(c) Ferromagnetism.\n(d) Boundary Conditions in Magnetic Materials.\n\
    8. Maxwell's Equations.\n(a) Displacement Current.\n(b) Propagation of Electric\
    \ and Magnetic Fields.\n(c) Plane and Spherical Electromagnetic Waves.\n(d) Fields\
    \ of an Oscillating Dipole."
