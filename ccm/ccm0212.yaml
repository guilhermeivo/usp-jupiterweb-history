  objectives: 'da atividade

    disseminação do conhecimento para escolas do fundamental e ensino médio e em espaços
    não formais de educação(físicos ou virtuais). Instigar a curiosidade e o saber
    científico através de atividades lúdicas e artísticas.

    Descrição da atividade

    desenvolvimento de projetos quanto a preparação e ações envolvendo demonstrações
    físicas ou virtuais e a exploração de linguagens artísticas dos conceitos e fenômenos
    desenvolvidos na disciplina em consonância com demandas e desafios da sociedade(Energia
    e Sustentabilidade) e aplicações cotidianas, realçando o papel social da Física.

    Indicadores de avaliação da atividade

    avaliação via questionário quanto ao perfil, satisfação e métricas de sucesso.'
