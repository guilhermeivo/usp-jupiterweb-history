    16)\tThe Ohm\x92s law\n17)\tThe electromotive force\n18)\tMagnetostatics\n19)\t\
    Magnetic force and Lorentz\x92s force\n20)\tThe Ampère\x92s law\n21)\tThe magnetic\
    \ scalar potential\n22)\tThe Biot-Savart\x92s law\n23)\tThe electromagnetic induction\n\
    24)\tThe Faraday\x92s law\n25)\tThe Maxwell\x92s equations\n26)\tMagnetic induction\n\
    27)\tDisplacement current\n28)\tMagnetic fields in matter\n29)\tMagnetization.\
    \ Paramagnetism, diamagnetism and ferromagnetism\n30)\tThe field H\n31)\tWave\
