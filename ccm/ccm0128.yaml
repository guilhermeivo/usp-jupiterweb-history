  lecture_credits: '4'
  objectives: 'Refinar o conhecimento de programação de computadores e suas aplicações
    através do estudo de algoritmos, estruturas de dados e tipos abstratos de dados
    fundamentais e de exercícios de programação.

    To introduce more advanced practices in computer programming and its applications,
    through the study of fundamental algorithms, data structures and abstract data
    types and programming exercises.'
  practical_credits: '1'
  total_workload: 90 h
  type: 's abstratos de dados (ADTs), uso de ADTs, e implementação de ADTs através
    da classes.  Algoritmos de ordenação elementares, linearítmicos e lineares.  ADTs
    fundamentais: pilhas, filas, filas de prioridade e tabelas de símbolos.  Estruturas
    de dados básicas: listas ligadas, árvores de busca e tabelas de espalhamento.  Exemplos
    envolvendo processamento de texto; busca em grafos e caminhos mínimos

    em grafos; aplicações interdisciplinares.  Extensa prática de programação e depuração
    de programas.

    Abstract data types (ADTs).  Applications of ADTs and their implementation using
    classes.  Elementary, linearithmic and linear time sorting algorithms.  Basic
    ADTs: stacks, queues, priority queues and symbol tables.  Basic data structures:
    linked lists, search trees and hashing.  Examples involving text processing; search
    in graphs; interdisciplinary applications.  Extensive programming practice.

    Instrumentos e Critérios de Avaliação'
