  course: 'A disciplina pretende introduzir os alunos à pesquisa científica pela realização
    de projeto relacionado ao projeto pedagógico do curso. O projeto será aprovado
    pela coordenação do CCM. Para matrícula na disciplina, o aluno deverá apresentar
    também um planejamento das disciplinas a serem cursadas concomitantemente ao desenvolvimento
    do projeto. A cada semestre haverá possibilidade de mudança de projeto, orientador
    e grade de disciplinas a ser avaliada juntamente com o relatório semestral.

    The subject intends to introduce students to research by carrying out a project
    on topics related to the course . The project will be approved by the coordination
    of CCM. To be admitted in the discipline, the student must also present a plan
    of the subjects to be taken concurrently with the development of the project.
    Each semester there will be the possibility of changing the project, advisor and
    course schedule to be evaluated along with the semester report.

    Instrumentos e Critérios de Avaliação'
