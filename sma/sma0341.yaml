  assessment: 'de aprovação: a nota final (MF) do aluno que realizou provas de recuperação
    dependerá da média do semestre (MS) e da média das provas de recuperação (MR),
    como segue:

    MF=5 se 5 <= MR <= 10 - MS;

    MF = (MS + MR) / 2 se MR   10 - MS

    MF = MS se MR   5.'
