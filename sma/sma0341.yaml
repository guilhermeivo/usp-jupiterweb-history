  course: 'Noções de lógica. Estratégias de provas: provas diretas, provas por contra-positiva
    e por contradição.

    Conjuntos: subconjuntos, operações com conjuntos, produtos cartesianos.

    Relações: relações binárias, relações de equivalência, relações de ordem.

    Funções: conceito, imagem inversa e imagem direta, funções injetoras e sobrejetoras,
    função inversa, composição de função.

    Noções de cardinalidade: conjuntos equivalentes, conjuntos enumeráveis e contáveis,
    o "continuum", o conceito de cardinalidade.

    Os números naturais: Axioma de Peano, indução.

    Os números inteiros: construção lógico-formal do conjunto dos números inteiros,
    imersão de N em Z, operações e relação de ordem em Z,  valor absoluto, divisibilidade,
    máximo divisor comum, mínimo múltiplo comum, primos.

    Os números racionais: a divisão em Z, construção dos números racionais, operações
    e relações de ordem, valor absoluto, números racionais decimais.

    Basic notions of  logic; sets; relations; functions; cardinality; Natural (N),
    Integers(Z) and Rational (Q) numbers.'
  course_name: 'SMA0341 - Elementos de Matemática

    Foundations of Mathematics'
