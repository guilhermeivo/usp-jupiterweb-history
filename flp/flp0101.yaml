  course: '1. Aristóteles e a reflexão sobre a pólis

    2. Maquiavel: humanismo cívico e as formas de governo

    3. Hobbes e os pressupostos da teoria do Estado

    4. Locke: a comunidade política e o direito de resistência

    5. Rousseau e as bases do Estado democrático'
  course_name: 'FLP0101 - Política I - Pensamento Político Moderno

    Politics I - Modern Political Thought'
  deactivation: ''
  instructors: '466233 - Cicero Romao Resende de Araujo

    361574 - Eunice Ostrensky

    5011036 - Patricio Tierno'
  lecture_credits: '4'
  objectives: 'O objetivo é apresentar aos alunos os principais temas e conceitos
    da teoria política moderna. Trata-se de examinar as teses sobre as origens e os
    fundamentos do poder político, a gênese dos conceitos de contrato social, Estado
    e soberania (estatal e popular), a estrutura das concepções que anteciparam e
    expressaram o processo de construção do Estado nacional moderno. O curso está
    dividido em três partes: a primeira esquematiza o modo pelo qual Aristóteles pensou
    a política e a comunidade política, a segunda examina a inovação teórica efetivada
    pela obra de Maquiavel, e a terceira investiga como os pensadores jusnaturalistas
    e contratualistas (Hobbes, Locke, Rousseau) lançaram as bases de uma nova ciência
    para os novos tempos. Por fim, busca-se desenvolver a compreensão nos alunos de
    conceitos clássicos da Ciência Política bem como de sua constituição histórico-filosófica,
    a partir do conhecimento dos debates ocorridos entre os principais autores desse
    campo científico, de modo que o futuro professor tenha condições de atuar no ensino
    médio trazendo para a realidade dos alunos deste nível de ensino referências para
    a sua formação como cidadão.'
  practical_credits: '1'
  total_workload: '90 h

    (

    Práticas como Componentes Curriculares =  20 h

    )'
