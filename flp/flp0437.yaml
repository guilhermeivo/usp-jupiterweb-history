  course: 'Introdução: análise e lógica da Política Externa

    A construção das bases contemporâneas  da política externa: do Barão de Rio Branco
    ao pragmatismo do estado novo

    A Política Externa Independente: em busca de um paradigma autônomo

    Política externa do período dos governos militares à consolidação democrática:
    e a afirmação da diplomacia do pragmatismoParadigmas e crises de paradigmas na
    condução diplomática da política externa brasileira do Pós-Guerra Fria.

    O Regionalismo como finalidade e prioridade na política externa brasileira do
    pós-Guerra Fria

    Política externa e diplomacia pública e novos atores

    O Brasil na ordem mundial do pós-Guerra Fria'
  course_name: 'FLP0437 - Política Externa Brasileira

    Brazilian Foreign Policy'
  deactivation: ''
  instructors: 2091542 - Rafael Antonio Duarte Villa
  lecture_credits: '4'
  objectives: A disciplina tem por objetivos introduzir o aluno no conhecimento das  bases
    teóricas, paradigmas e conceitos que tem guiado a ação brasileira, a partir do
    século XX, na inserção no sistema  internacional . Especial destaque será  dado
    aos conceitos de ação diplomática nos períodos  de durante e após a Guerra Fria,
    frisando-se  os momentos de continuidade, discontinuidade e crise nas concepções
    dos formuladores e atores da  política externa do pais.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
