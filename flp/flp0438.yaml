  course: 'A emergência da disciplina da relações internacionais:

    Uma questão introdutória: estado, antiga e nova soberania:

    O grande debate doutrinário: realismo versus  idealismo Hobbes/Maquivel e Kant:

    O idealismo na política internacional: a afirmação no entre-guerras:

    O realismo na política internacional: sistematização e hegemonia na Guerra Fria

    Um  balanço dos  modelos clássicos:

    Neoidealismo e neorealismo : a revisão do conceito clássicos

    Uma terceira via: o neogrotianismo de Hedley Bull: a teoria  da Sociedade Internacional

    A concepção Liberal e pluralista : Interdependencia complexa, regimes e internacionais
    e institucionalismo

    A teoria da interdependencia complexa:

    A teoria dos regimes internacionais

    O institucionalismo liberal

    Um balance crítico do enfoque liberal

    Novas possibilidades de enfoques normativos em política internacional: cultualismo
    e construtivismo'
  course_name: 'FLP0438 - Introdução às Relações Internacionais

    Introduction to International Relations'
  deactivation: 02/08/2011
  instructors: 2091542 - Rafael Antonio Duarte Villa
  lecture_credits: '4'
  objectives: O curso tem como objetivo introduzir o aluno no estudo e conhecimento
    das principais correntes teóricas clássicas  que marcaram o debate normativo das
    relações internacionais, especialmente as correntes idealistas e realistas. Porém,
    é também uma meta  deste  curso apresentar e discutir os novos enfoques que se
    derivam a partir dos modelos clássicos assim como o contraponto conceitual elaborado
    pela perspectiva liberal da política internacional frente ás correntes tradicionais
    e neotradicionais.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
