  course: 'Instituições Políticas Brasileiras.

    A cidadania no Brasil. Formação e perspectivas

    O processo político pós-revolução de 1930 e sob o Estado Novo

    Reconstrução do Estado.

    A experiência de 1946-64: redemocractização

    Desenvolvimento, transformações sociais, 1930-2000.

    A experiência de 1946-64: redemocractização.

    Partidos e eleições no período 1946-64. Interpretações e debates.

    Crise de 1964: explicações.

    Os militares e a política.

    Regime Militar, Eleições e Transição.

    Constituinte e Debate Institucional.

    A Constituição e o novo modelo político brasileiro.

    A Dinâmica dos sistemas eleitoral e partidário pós 1988.

    Relações Executivo-Legislativo.

    Federalismo.

    Instituições judiciais e mecanismos de accountability

    Reforma Política'
  course_name: 'FLP0204 - Política IV - Instituições Políticas Brasileiras I

    Politics IV - Brazilian Political Institutions I'
  deactivation: ''
  instructors: '3363950 - Eduardo Cesar Leão Marques

    2090774 - Elizabeth Balbachevsky

    2090200 - Fernando de Magalhaes Papaterra Limongi

    3079320 - Marta Teresa da Silva Arretche

    5011036 - Patricio Tierno

    2027125 - Rogério Bastos Arantes'
  lecture_credits: '4'
  objectives: 'O curso trata do processo político brasileiro pós-revolução de 1930,
    com atenção especial a três períodos: o experimento democrático inaugurado pela
    constituição de 1946, o regime autoritário iniciado em 1964 e, por fim, a retomada
    da democracia nos anos 1980 e sua condição atual. Para que o aluno, futuro professor,
    possa debater com seus alunos do ensino médio a presença de tais questões em seu
    cotidiano, o curso promove atividades que estimulam o engajamento dos estudantes
    no processo de ensino dos conteúdos pertinentes, como a formação de grupos para
    discussão e exposição das ideias centrais contidas em cada texto por meio de seminários.'
  practical_credits: '1'
  total_workload: '90 h

    (

    Práticas como Componentes Curriculares =  20 h

    )'
  type: Semestral
