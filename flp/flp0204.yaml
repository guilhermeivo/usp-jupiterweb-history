  objectives: A disciplina tem por objetivo oferecer aos alunos um panorama sobre
    as mais importantes abordagens analíticas que enfocam políticas públicas em perspectiva
    comparada, com destaque para o Brasil. A disciplina apresenta diversos conceitos
    e processos clássicos no campo das políticas públicas, essenciais e indispensáveis
    para a formação do cientista social.
