  course: 'O curso será desenvolvido em 15 aulas, organizadas em três unidades. Excluindo
    as aulas de introdução do curso e as dedicadas às avaliações, a sequência de aulas
    e temas serão os seguintes:

    1. Estado e burocracias:

    a. Formação dos Estados nacionais;

    b. Burocracias;

    c. Estado do Brasil (2 aulas);

    2. Direitos, Welfare e Políticas Sociais:

    a. Direitos e cidadania moderna;

    b. Welfare States;

    c. Direitos e políticas sociais no Brasil (2 aulas);

    3. Processo de produção de políticas:

    a. Ciclo e decisão;

    b. Incrementalismo e a crítica à decisão;

    c. Implementação de burocracias de nível da rua;

    d. Agenda e ideias de políticas públicas.'
  course_name: 'FLP0204 - Política IV - Introdução às Políticas Públicas

