  course: '1. Estado Moderno, realismo político e ética da responsabilidade: Nicolau
    Maquiavel; 2. Soberania estatal versus anarquia internacional no realismo clássico:
    Thomas Hobbes; 3. A geopolítica do poder terrestre e o pivô geográfico da História:
    Halford Mackinder; 4. A segunda guerra e a estratégia americana na política mundial:
    Nicholas Spykman; 5. A guerra fria e a confrontação americano-soviética: Zbigniew
    Brzezinski; 6. O pós-guerra fria e a mudança nos interesses estratégicos americanos:
    Samuel Huntington; 7. Fim da História ou Fim do Socialismo? Francis Fukuyama;
    8. Choque de Civilizações? ou "o Ocidente contra o resto": Samuel Huntington.'
  course_name: 'FLP0410 - Análise de Sistemas Internacionais

    Analysis of International Systems'
  deactivation: 11/03/2014
  instructors: 88624 - Leonel Itaussu Almeida Mello
  lecture_credits: '4'
  objectives: Considerando o contexto contemporâneo de guerra contra o terrorismo,
    discutir as relações entre estratégia, direito e guerra, objetivando a busca de
    elementos para uma reflexão sobre segurança e defesa em perspectiva brasileira.
  practical_credits: '0'
  total_workload: 60 h
