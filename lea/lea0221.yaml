    \ Morfologia, Biologia e Controle. Divisa Editora, Rio Claro São Paulo.\nCOULSON,\
    \ R.N. & WITTER, J.A. Forest Entomology. Ecology and Management.  John Wiley &\
    \ Sons, New York, 1984.  669p.\nDELLA LUCIA, T. M. 2011. Formigas Cortadeiras,\
