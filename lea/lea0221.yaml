courses:
  activation: 01/01/2020
  assessment: Aplicação de prova teórica e prática sobre todo o programa lecionado
    e, eventualmente, apresentação da coleção de insetos de importância florestal,
    no caso de aluno que não o apresentou na época devida.
  bibliography: "Literatura Básica:\nGALLO, D.; NAKANO, O.; SILVEIRA NETO, S.; CARVALHO,\
