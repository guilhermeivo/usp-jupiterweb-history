  course: 'Introdução: 1 Conceito de pragas, inimigos naturais e manejo integrado.
    Noções sobre métodos de controle e inseticidas.

    2 Pragas do algodoeiro: Descrição, biologia, prejuízos. Reconhecimento em campo.

    3 Pragas do algodoeiro: Manejo integrado. Reconhecimento das principais pragas
    e inimigos naturais em laboratório.

    4 Pragas da soja: Descrição, biologia, prejuízos e manejo integrado das pragas.
    Amostragem em campo.

    5 Pragas do feijão e amendoim: Descrição, biologia, prejuízos, controle e reconhecimento
    em campo.

    6 Pragas do milho: Descrição, biologia, prejuízos e controle no campo e no armazém.
    Pragas de grãos armazenados.

    7 Pragas do arroz e trigo: Descrição, biologia, danos, controle e reconhecimento
    das pragas em campo.

    8 Pragas da cana-de-açúcar: Descrição, biologia, danos e controle. Levantamento
    de infestação no campo. Técnicas de controle biológico. Reconhecimento de pragas
    e inimigos naturais.

    9 Pragas das pastagens: Descrição, biologia, danos e controle das pragas. Cupins
    - Técnicas de controle em campo.

    10 Saúvas: Reconhecimento de espécies, biologia, danos e controle em campo. Sauveiro
    artificial.

    11 Pragas do café: Descrição, biologia, danos e controle das principais pragas.
    Técnicas de levantamento no campo.

    12 Pragas dos citros: Descrição, biologia, danos, controle e reconhecimento das
    principais pragas e inimigos naturais.

    13 Pragas da bananeira:  Descrição, biologia, danos e controle das pragas. Técnicas
    de monitoramento em campo.

    14 Pragas das frutíferas: Descrição, biologia, danos e controle das principais
    pragas.

    15 Pragas das hortaliças, com ênfase em Solanáceas - descrição, biologia, danos
    e controle.'
  course_name: 'LEA0430 - Pragas das Plantas Cultivadas

    Pest of Crop Plants'
  deactivation: ''
  instructors: '57056 - Joao Roberto Spotti Lopes

    2549718 - Jose Mauricio Simoes Bento

    3199683 - Pedro Takao Yamamoto'
  lecture_credits: '4'
  objectives: Dar aos alunos conhecimentos gerais sobre as principais pragas das plantas
    cultivadas, incluindo, reconhecimento, biologia, levantamento de infestação (métodos
    de amostragem) e alternativas de controle, para possibilitar ao aluno condições
    de solucionar, na vida prática, os principais problemas de pragas das culturas.
    Dar condições ao aluno de fazer o Receituário Agronômico e Manejo das Pragas.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
