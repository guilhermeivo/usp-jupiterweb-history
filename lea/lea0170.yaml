  course: 1.Breve histórico da Zoologia. Considerações sobre o Reino Animal. Nomenclatura
    zoológica e classificação dos seres. Elementos básicos de sistemática filogenética.
    Origem e evolução dos metazoários. Conceitos básicos em embriologia e ontogenia.
    2. Noções gerais sobre a organização estrutural, morfologia, fisiologia, biologia
    e relações filogenéticas dos Porifera. 3. Organização estrutural, morfologia,
    fisiologia, biologia e relações filogenéticas dos Cnidaria. Morfologia interna
    e externa de formas polipóides e medusóides. 4. Noções gerais sobre a organização
    estrutural, morfologia, fisiologia, biologia e relações filogenéticas dos Platyhelminthes.
    Breve introdução dos conceitos de parasitologia. Esquistossomose mansônica, teníases
    e cisticercoses humanos. 5. Organização estrutural, morfologia, fisiologia, biologia
    e relações filogenéticas dos Nematoda. Modos de parasitismo e ação sobre plantas
    e animais. Ascaríase e ancilostomose. 6. Classificação, morfologia, fisiologia,
    biologia e relações filogenéticas dos Mollusca. Diversidade e hábitos de vida.
    7. Classificação, morfologia, fisiologia, biologia e relações filogenéticas dos
    Annelida. 8. Classificação e relações filogenéticas, morfologia, fisiologia e
    biologia dos Echinodermata. 9. Noções gerais sobre a organização e biologia de
    outros grupos menores de invertebrados.  10.  Viagem didática a campo para o Centro
    de Biologia Marinha da USP (CEBIMar) para estudo sobre invertebrados marinhos
    e diversidade de animais marinhos em plâncton, fital e costão rochoso.
  course_name: 'LEA0170 - Zoologia de Invertebrados I

    Invertebrate Zoology I'
  deactivation: ''
  instructors: 1033541 - Italo Delalibera Junior
  lecture_credits: '4'
  objectives: Transmitir e construir com os alunos informações básicas e comparativas
    sobre a morfologia, biologia, ecologia, comportamento, importância e relações
    filogenéticas entre os grupos dos invertebrados (exceto os grupos abordados na
    LEA0200).
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
