  course: 1.Considerações sobre o Reino Animal. Nomenclatura zoológica e classificação
    dos seres, elementos básicos de sistemática filogenética, origem e evolução dos
    metazoários, conceitos básicos em embriologia e ontogenia. 2. Noções gerais sobre
    a organização, estrutura e biologia dos Porifera. 3. Organização e biologia dos
    Cnidaria. Morfologia interna e externa de formas polipóides e medusóides. 4. Noções
    gerais sobre a organização e biologia dos Platyhelminthes. Esquistossomose mansônica,
    teníases e cisticercoses humanas. 5. Organização e biologia dos Nematoda. Modos
    de parasitismo e ação sobre plantas e animais. Ascaríase e ancilostomose. 6. Classificação,
    morfologia e biologia dos Mollusca.  Diversidade e hábitos de vida. 7. Classificação,
    morfologia e biologia dos Annelida. 8. Classificação, morfologia e biologia dos
    Echinodermata. 9. Noções gerais sobre a organização e biologia de outros grupos
    menores de invertebrados.
  course_name: 'LEA0170 - Zoologia de Invertebrados I

    Invertebrate Zoology I'
  deactivation: ''
  instructors: 1033541 - Italo Delalibera Junior
  lecture_credits: '4'
  objectives: Transmitir aos alunos informações básicas sobre a morfologia, biologia,
    ecologia, importância e relações filogenéticas entre os grupos dos invertebrados  (exceto
    os grupos abrordados na LEF0200)
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
