    Alternative biotechnological approaches in IPM\n13)\tQuarantine. How to prevent\
    \ invasive pests.\n14)\tChallenges to implementing IPM programs in tropical agriculture.\
    \ Social and political constraints."
  course_name: LEA0638 - Sustainable Pest Management in Tropical Agriculture
  deactivation: ''
  instructors: '93742 - Celso Omoto

    57056 - Joao Roberto Spotti Lopes

    3199683 - Pedro Takao Yamamoto'
  lecture_credits: '3'
  objectives: The rationale of this course is to introduce the diversity and complexity
    of integrated pest management (IPM) in tropical agroecosystems. The major objective
    is to develop an understanding of the concepts and principles of IPM as a complex
    mix of practices and technologies to efficiently manage pest populations under
    tropical agriculture conditions.
  practical_credits: '2'
  total_workload: 105 h
  type: Semestral
