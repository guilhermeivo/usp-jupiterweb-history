  course: "1)\tTropical agriculture and implications for IPM. Concepts, strategies\
    \ and tactics.\n2)\tEcological basis for IPM. Modelling applied to IPM.\n3)\t\
    Molecular ecology applied in tropical agroecosystems.\n4)\tPrecision agriculture\
    \ as an IPM tool.\n5)\tBiological control in tropical agroecosystems.\n6)\tThe\
