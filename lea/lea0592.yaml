  course: 'SEMANAS AULAS TEÓRICAS

    1. Bases do Manejo Integrado de Pragas (MIP)

    2. Métodos de controle legislativo, cultural, mecânico e físico

    3. Resistência de plantas a insetos

    4. PROVA I

    5. Seminários

    6. Controle biológico de pragas: parasitoides e predadores

    7. Controle biológico de pragas: microrganismos patogênicos

    8. Controle por comportamento: feromônios e atraentes

    9. Pragas domissanitárias e seu controle

    10. Plantas geneticamente modificadas

    11. PROVA II

    12. Manejo de insetos vetores de fitopatógenos

    13. Controle químico: inseticidas neurotóxicos

    14. Controle químico: inseticidas reguladores de crescimento de insetos, inibidores
    da respiração celular e outros grupos.

    15. Integração de táticas de MIP (I)

    16. Integração de táticas de MIP (II)

    17. Receituário Agronômico

    18. PROVA III

    SEMANAS AULAS PRÁTICAS

    1. Estudos de caso de Manejo Integrado de Pragas

    2. Monitoramento de pragas

    3. Uso de plantas inseticidas no controle de pragas

    4. PROVA I

    5. Seminários

    6. Criação de inimigos naturais para programas de MIP

    7. Produção, formulação e utilização de entomopatógenos

    8. Exemplos e uso de feromônios para monitoramento e controle de pragas

    9. Identificação de pragas, ferramentas para monitoramento e controle de pragas
    urbanas

    10. Resistência de insetos a inseticidas e plantas geneticamente modificadas

    11. PROVA II

    12. Transmissão de fitopatógenos por insetos e seu manejo

    13. Formulações de inseticidas

    14. Métodos e equipamentos de aplicação de inseticidas

    15. Estudos de casos sobre Integração de táticas de MIP

    16. Estudos de casos sobre Integração de táticas de MIP

    17. Visita a laboratório/empresa de produção de inimigos naturais

    18. PROVA III'
  course_name: 'LEA0592 - Manejo Integrado de Pragas

    Integrated Pest Management'
  deactivation: ''
  instructors: '2549718 - Jose Mauricio Simoes Bento

    3199683 - Pedro Takao Yamamoto'
  lecture_credits: '4'
  objectives: Dar aos alunos conhecimentos básicos sobre os principais métodos de
    controle de pragas, além de fornecer subsídios para a especialização do aluno
    no campo da entomologia econômica, visando o manejo de pragas.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
