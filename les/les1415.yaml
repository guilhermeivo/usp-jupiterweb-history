  course: '3.1.Conteúdo teórico-prático: orientações para a documentação do estágio
    e boa realização do mesmo e discussões e embasamento teórico da prática a ser
    vivenciada. Aspectos a discutir: a) cultura educativa, os alunos, projeto político-pedagógico.
    b) a escola e seu contexto, infraestrutura e espaços a serem utilizados em aulas
    das áreas das Ciências Agrárias e Biológicas e projetos nas Ciências; c) planejamento
    do ensino com vistas aos processos participativos e democráticos na escola e de
    valorização do aluno; d) autoridade e autoritarismo docente; e) ensinar e critérios
    e formas de avaliar em Ciências; f) exemplos de estágios em parceria com escolas;
    g) relação das situações observadas ao conhecimento teórico (Psicologia, Didática,
    entre outros) para interpretar as ocorrências escolares e avançar na aprendizagem
    docente; h) expressão pessoal (formas de agir, crenças, concepções, preconceitos
    e valores) e a docência nas áreas de Ciências e correlatas; i) análise da gestão
    da matéria e gestão da classe (tempos e espaços da aula) em Ciências;  j) orientação
    para escolha dos conteúdos e metodologias de ensino para o estágio, considerando
    os currículos, necessidades dos alunos e premissas de ação, com ênfase na educação
    ambiental, nas hortas escolares e espaços verdes da escola (viagem didática a
    complementar este item j).

    3.2. Estágio supervisionado:

    Unidade 1- Observação e análise do contexto escolar e seu registro (Diários).
    Reflexões sobre a prática observada em diante do contexto educacional mais amplo.
    Conjuntamente, pode ocorrer o Estágio de Participação. Visa colher elementos e
    impressões para as regências, colaborar nas atividades de em sala de aula; preparar
    material didático, exercitando a Língua Portuguesa, se escrito, e com uso das
    TICs; d) auxilio ao docente na escola, na sua área e(discussões, material de apoio,
    orientação aos alunos, atividades de reforço, preparo de aulas práticas, correções,
    entre outras, sempre sob supervisão do professor).

    Unidade 2- a) Elaboração e Execução do Projeto de Estágio com regências de aulas
    (Estágio de Docência Supervisionada em Ciências); b) Regência de aulas e apresentação
    dos resultados do estágio. Cada aluno apresentará um projeto de intervenção para
    desenvolver na escola básica, de forma a valorizar a interdisciplinar, criatividade,
    criticidade e envolvimento do aluno da escola, em comum acordo com a instituição
    e atendendo orientações do curso. O aluno terá a oportunidade de experimentar
    e refletir as aulas e demais ações desenvolvidas em um relatório de estágio e
    em um seminário, de forma a contemplar a expressão e uso da Língua Portuguesa
    falada e escrita. Para as Ciências Agrárias, valorizam-se ações vinculadas à área
    agrária, incluindo regências em disciplinas correlatas que possuam o conteúdo
    específico de agrárias, como solos, plantio, geoprocessamento, agricultura, formas
    sustentáveis de cultivo, arborização e educação ambiental, questões do uso da
    terra, o trabalho rural, e produtividade, entre outras..'
  course_name: 'LES1415 - Metodologia do Ensino em Ciências

    Teaching Methods in Sciences'
  deactivation: ''
  instructors: 5553650 - Vânia Galindo Massabni
  lecture_credits: '4'
  objectives: Espera-se que o aluno vivencie o cotidiano escolar da escola básica
    em um estágio supervisionado e indique, ao final, ter desenvolvido características
    profissionais necessárias à docência em Ciências e suas interfaces com as especificidades
    das Ciências Biológicas e Agrárias. O perfil esperado é saber ensinar considerando
    a docência uma profissão comprometida com os educandos e com a educação democrática
    e de qualidade, considerando o caráter permanente de aprendizagem docente. A reflexão
    sobre a prática por meio do conteúdo teórico-prático da disciplina possibilita
    reorientação das ações na escola, se necessário e apoia a  interpretação e a proposição
    de intervenções com vistas a construção pessoal da docência. Neste estágio, ocorre
    a imersão no cotidiano escolar, com acompanhamento da docência, além da realização
    de intervenções educacionais planejadas em um Projeto de Estágio individual relacionado
    aos conteúdos das Ciências, na escola, considerando suas interfaces e a interdisciplinaridade.
