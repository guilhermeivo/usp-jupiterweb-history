  course: "1. História da agricultura. Lei de terras. Reforma agrária.  2.Estrutura\
    \ fundiária no Brasil contemporâneo 3. Êxodo rural e questão urbana. 4.Atores\
    \ sociais no campo. A luta pela terra. 5.Populações tradicionais, quilombolas\
    \ e indígenas. 6. Progresso técnico\x96modernização. Desenvolvimento e Sustentabilidade.\
    \ 7.Agricultura familiar, políticas públicas e desenvolvimento rural sustentável.\
    \ 8. Ciência, Tecnologia e inovação na agricultura.  9. A extensão rural no Brasil,\
    \ origens e trajetória. Conceitos de ATER (Assistência Técnica e Extensão Rural)\
    \ 10.  Agroecologia. Extensão e Conservação Florestal. 11. Teoria de ensino aprendizagem.\
    \ 12. Comunicação rural. Teoria da adoção e difusão de tecnologia. 13. Métodos\
    \ de extensão rural e assistência técnica e de organização rural."
  course_name: 'LES0129 - Sociologia e Extensão

    Sociology and Extension'
  deactivation: ''
  instructors: '5594340 - Adalmir Leonidio

    325635 - Antonio Ribeiro de Almeida Junior

    1261309 - Paulo Eduardo Moruzzi Marques'
  lecture_credits: '4'
  objectives: Fornecer aos alunos elementos para a compreensão da evolução da agricultura
    brasileira, em suas dimensões histórica, econômica, social e política; e da estrutura
    fundiária brasileira. Pretende-se também oferecer aos alunos elementos para a
    reflexão sobre o lugar da agricultura nas sociedades contemporâneas a partir dos
    processos de modernização, industrialização e urbanização e a questão da sustentabilidade.
    Entender o estágio atual da ciência, tecnologia e inovação da agricultura no Brasil
    e discutir a perspectiva de iniciativas agrícolas alternativas, políticas públicas
    e os possíveis caminhos de seu futuro.  Apresentar os fundamentos da extensão
    rural e do processo de difusão de inovações.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
