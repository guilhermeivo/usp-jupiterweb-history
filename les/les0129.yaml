  course: 1. Sociologia e Sociologia rural; 2. História da Agricultura Brasileira;
    3. A experiência histórica da extensão rural no Brasil; 4. Relações sociais no
    campo; 5. Inovação tecnológica, desenvolvimento e sustentabilidade; 6. A extensão
    rural e as novas formas de produção agrícola; 6. Estratégias de ação pedagógicas
    (trabalho com grupos e organização rural); 7. O futuro da agricultura brasileira;
    8. Visita a uma experiência de extensão.
  course_name: 'LES0129 - Sociologia e Extensão

    Sociology and Extension'
  deactivation: 14/07/2024
  instructors: '5594340 - Adalmir Leonidio

    325635 - Antonio Ribeiro de Almeida Junior

    1261309 - Paulo Eduardo Moruzzi Marques'
  lecture_credits: '4'
  objectives: Fornecer aos estudantes elementos para a compreensão da evolução da
    agricultura brasileira, em suas dimensões histórica, econômica, social e política
    e da estrutura fundiária brasileira. Pretende-se também oferecer aos estudantes
    elementos para a reflexão sobre o lugar da agricultura nas sociedades contemporâneas
    a partir dos processos de modernização, industrialização e urbanização e a questão
    da sustentabilidade. Entender o estágio atual da ciência, tecnologia e inovação
    da agricultura no Brasil e discutir a perspectiva de iniciativas agrícolas alternativas,
    políticas públicas e os possíveis caminhos de seu futuro. Apresentar o histórico
    e a contextualização da extensão rural passada e atual, discutir os caminhos que
    se vislumbram. Discutir as principais políticas públicas para a agricultura familiar,
    os fundamentos dos processos de comunicação, ensino/aprendizagem e difusão de
    inovações. Apresentar as estratégias de ação extensionista.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
