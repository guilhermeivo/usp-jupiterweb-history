  course: '1. Apresentação do curso e introdução: Evolução histórica do direito ambiental,
    Conceito atual de direito ambiental, Princípios do direito ambiental, O ordenamento
    ambiental brasileiro;2. Política Nacional do Meio Ambiente e Sistema Nacional
    do Meio Ambiente: Poderes da República: atribuições, Competência legislativa em
    matéria ambiental, Órgãos integrantes do sistema nacional do meio ambiente, A
    Política Nacional do Meio Ambiente (PNMA); 3. Principais instrumentos da política
    nacional do meio ambiente: Padrões de qualidade ambiental, Zoneamento ambiental,
    Avaliação de impactos ambientais, Licenciamento ambiental, Auditoria ambiental;4.
    Florestas de preservação permanente, reserva florestal legal, e fauna: Florestas
    de preservação permanente, Reserva florestal legal, Fauna;5. Unidades de conservação:
    Conceito de unidades de conservação, Objetivos do sistema nacional de áreas de
    conservação (SNUC), Tipos e funções das unidades de conservação, Criação e implantação
    das unidades de conservação, Compensação do dano ambiental e unidades de conservação,
    Plano de Manejo, Direitos e deveres da população tradicional das unidades de conservação,
    A pesquisa científica nas unidades de conservação, Gestão das unidades de conservação;
    6. Recursos hídricos: Noções gerais, Os objetivos da política nacional de recursos
    hídricos, Os planos de recursos hídricos, Outorga de direitos de uso de recursos
    hídricos, Cobrança de uso de recursos hídricos, Sistema Nacional de Gerenciamento
    de recursos hídricos; 7. Estudo da poluição: Conceito de poluição, Poluição hídrica,
    Poluição atmosférica, Poluição do solo, Poluição sonora, Poluição visual; 8. Tutela
    Civil do Ambiente: Responsabilidade civil e reparação do dano ambiental; 9. A
    tutela administrativa, penal e jurisdicional do ambiente: Direito Ambiental Penal,
    Tutela Administrativa, Meios processuais para a defesa ambiental; 10. O meio ambiente
    artificial, cultural e do trabalho; 11. Direito ambiental: especialidades: Direito,
    Biossegurança, Política Nacional de Resíduos Sólidos, Política Nacional sobre
    Mudança do Clima, Meio Ambiente no Plano Internacional.'
  course_name: 'LES0614 - Direito Ambiental

    Environment Law'
  deactivation: ''
  instructors: 52263 - Paulo Sergio Millan
  lecture_credits: '4'
  objectives: '- Esta disciplina objetiva abordar os temas principais do direito ambiental
    que estão necessariamente relacionados com a prática do profissional de gestão
    ambiental. Através da transmissão de conceitos básicos, será fornecido instrumental
    para orientação do futuro profissional nas questões jurídico/ambientais que surgirão
    no âmbito de suas atividades.'
