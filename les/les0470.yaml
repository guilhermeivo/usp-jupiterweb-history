  course: 'a) Sistema financeiro brasileiro: autoridades monetárias, regulamentação
    do sistema financeiro;

    b) Sistema brasileiro de pagamentos: contas de reserva e de liquidação financeira,
    papel e funcionamento do Banco Central e das câmaras de compensação não governamental;

    c) Investidores institucionais;

    d) Teoria e prática de carteira de ativos: risco, retorno e dados históricos;
    alocação de capital em ativos de risco, carteira de risco ótima e modelos de índice;

    e) Funcionamento do Mercado: participantes, home broker, tipos de ordem, fundos
    de investimento e ETFs

    f) Mercado de renda variável: modelos de precificação;

    g) Opções, futuros e outros derivativos (swaps): mercado de opções, mercado de
    futuros, swaps e gestão de risco;

    h) Gestão de carteiras: avaliação de desempenho de carteiras, diversificação internacional,
    fundos de hedge;

    i) Transformações do mercado de capitais e expectativas quanto ao futuro: moedas
    virtuais e outras inovações.'
  course_name: 'LES0470 - Mercado de Capitais

    Capital Markets'
  deactivation: ''
  instructors: 8498852 - Alex da Silva Alves
  lecture_credits: '2'
  objectives: Este curso visa aprofundar e focar na implementação dos conceitos estudados
    nas disciplinas de administração financeira e aplicar tópicos avançados de avaliação
    de ativos financeiros e composição ótima de carteiras. Os alunos devem estar aptos
    a operacionalizar a otimização de carteira de ativos financeiros, com diferentes
    classes de ativos tais como renda fixa, variável, derivativos convencionais e
    inovadores.
  practical_credits: '1'
  total_workload: 60 h
  type: Semestral
