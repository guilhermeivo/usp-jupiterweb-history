  course: 'Introdução à Economia e Gestão dos Negócios Agroalimentares: conceitos,
    dimensões, tendências e abordagem sistêmica. Sistemas Agroindustriais (SAGs):
    metodologia de análise, coordenação e gerenciamento, sistemática para coleta de
    dados e análise de mercados. Noções de Economia das Organizações e Organização
    Industrial. Concorrência nos negócios agroalimentares. Estratégias Agroalimentares:
    formas básicas de organização das firmas, estratégias de crescimento das firmas
    (integração horizontal e vertical, diversificação, etc.), parcerias e alianças
    (joint-venture, licenciamento, franquia, etc.), fronteiras de eficiência, terceirização,
    fusões e aquisições. Finanças e Marketing nos negócios agroalimentares. Competitividade
    e Globalização nos negócios agroalimentares. Organizações e Instituições. Qualidade
    e Segurança de Alimentos. Gestão da qualidade no agribusiness. Gestão Ambiental
    no sistema agroindustrial. Administração estratégica de cadeias de suprimento
    no agribusiness. Estudos de Caso.'
  course_name: 'LES0452 - Economia e Gestão do Agronegócio

    Agribusiness Economics and Management'
  deactivation: ''
  instructors: 1225121 - Margarete Boteon
  lecture_credits: '4'
  objectives: Trata-se de um curso introdutório à economia e gestão dos negócios dos
    sistemas agroalimentares. O objetivo central é fazer com  que o aluno compreenda
    a estrutura e a dinâmica de funcionamento do complexo agroindustrial no Brasil.
    Visa ainda explorar as inter-relações entre os segmentos das cadeias agroindustriais
    e destes com as instituições, bem como seus principais desafios atuais. Ao final
    do curso, espera-se que o aluno tenha uma noção geral da dimensão e do funcionamento
    dos sistemas integrados de produção de alimentos, fibras e biomassa. Para tanto,
    serão abordados temas como a evolução do conceito de complexo agroindustrial,
    organização e coordenação das cadeias produtivas em seus diferentes segmentos
    (indústria de máquinas e insumos, produção agropecuária, agroindústria e distribuição),
    o papel dos agentes envolvidos, principais estratégias das empresas agroalimentares,
    marketing aplicado aos negócios agroalimentares, competitividade e globalização,
    organizações e instituições do agronegócio, aspectos de logística e gestão ambiental.
  practical_credits: '0'
  total_workload: 60 h
