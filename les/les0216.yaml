  course: 1. Constituição histórica da ciência; 2. Conhecimentos científicos e tradicionais;
    3. Ciência normal e ciência revolucionária; 4. Interações e diferenças entre pesquisa
    qualitativa e pesquisa quantitativa, indução e dedução; 5. Princípios de elaboração
    de projetos de pesquisa e do TCC; 6. Métodos e técnicas de pesquisa; 7. Princípios
    éticos da redação científica; 8. Ferramentas de busca em bancos de dados bibliográficos;
    9. Critérios de seleção de textos científicos 10. Estrutura do trabalho científico;
    12. Referências bibliográficas e normas técnicas.
  course_name: 'LES0216 - Conhecimento e Pesquisa

    Knowledge and Research'
  deactivation: ''
  instructors: '325635 - Antonio Ribeiro de Almeida Junior

    70170 - Maria Elisa de Paula Eduardo Garavello'
  lecture_credits: '2'
  objectives: 'Ao final da disciplina os alunos deverão:

    1. Conhecer elementos da constituição histórica da ciência; 2. Diferenciar conhecimentos,
    científicos e tradicionais; 3. Diferenciar ciência normal de ciência revolucionária;
    4. Compreender as interações e diferenças entre pesquisa qualitativa e pesquisa
    quantitativa, indução e dedução; 5. Conhecer alguns métodos e técnicas de pesquisa;
    6. Conhecer as características do trabalho científico e os princípios de elaboração
    de projetos de pesquisa e do TCC; 7. Conhecer princípios éticos da comunicação
    em ciências; 8. Conhecer as principais fontes de informação científica; 9. Conhecer
    técnicas de busca e seleção de informações científicas; 10. Conhecer normas para
    referência bibliográficas.'
  practical_credits: '0'
  total_workload: 30 h
