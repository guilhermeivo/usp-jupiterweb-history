  course: 1. Constituição histórica da ciência; 2. Conhecimentos rivais, científicos
    e tradicionais; 3. Ciência normal e ciência revolucionária; 4. Pesquisa qualitativa
    e pesquisa quantitativa, indução e dedução; 5. Financiamento à pesquisa; 6. Métodos
    e técnicas de pesquisa; 7. Trabalho científico, elaboração de projetos de pesquisa
    e trabalhos acadêmicos; 8. Ética na comunicação científica; 9. Bases de dados
    de acesso aberto e restrito; 10. Estratégias de busca e seleção de informação
    científica; 11. Análise crítica da estrutura, elementos essenciais, metodologia,
    apresentação de resultados, apresentação de figuras, gráficos e tabelas, considerações
    finais e resumo; 12. Normas ABNT e gerenciadores de referências e citações; 13.
    Dicas de apresentação oral de trabalhos acadêmicos.
  course_name: 'LES0216 - Conhecimento e Pesquisa

    Knowledge and Research'
  deactivation: 31/12/2023
  instructors: 325635 - Antonio Ribeiro de Almeida Junior
  lecture_credits: '2'
  objectives: 'Ao final da disciplina os alunos deverão:

    1. Conhecer elementos da constituição histórica da ciência; 2. Reconhecer a existência
    de conhecimentos rivais, científicos e tradicionais e suas principais características;
    3. Diferenciar ciência normal de ciência revolucionária; 4. Compreender as interações
    e diferenças entre pesquisa qualitativa e pesquisa quantitativa, indução e dedução;
    5. Entender o funcionamento básico das agências de fomento à pesquisa; 6. Ser
    capazes de empregar alguns métodos e técnicas de pesquisa; 7. Conhecer as características
    do trabalho científico e os princípios da elaboração de projetos de pesquisa e
    trabalho acadêmico; 8. Conhecer princípios éticos da comunicação científica; 9.
    Conhecer as principais fontes de informação científica e serviços de descoberta;
    10. Conhecer as estratégias de busca e seleção de informações científicas; 11.
    Demonstrar capacidade de análise crítica, síntese e redação de textos técnico-científicos;
    12. Conhecer as normas técnicas e os gerenciadores de referências; 13. Conhecer
    as orientações de conduta para apresentação oral de trabalhos acadêmicos.'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
