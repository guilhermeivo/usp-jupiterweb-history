  course: "s especiais de crédito, o sistema de avaliação dos projetos.\n2. Projetos\
    \ de investimento na administração da empresa.  Conceituação.  Decisões de investimento\
    \ e administração financeira.  Noções de contabilidade e análise de balanços.\n\
    3.\tTécnicas de capitalização e desconto.  Formação da taxa de juros.  Aplicações\
    \ de matemática financeira na administração da empresa.\n4. Formação de fluxos\
    \ de caixa dos projetos agropecuários.  Conceitos.  Critérios:  fluxos diferenciais,\
    \ preços, depreciação, tributos e subsídios.  Distribuição temporal, fluxos financeiros.\
    \  Agregação de empresas em projetos de \tassentamento.\n5. Depreciação.  Conceito\
    \ e método de cálculo.\n6.\tCusto de capital.  Custo médio considerado como taxa\
    \ mínima de atratividade de projetos.\n7. Métodos de avaliação econômica.  Período\
    \ de recuperação do capital.  Retorno sobre o investimento.  Valor líquido presente.\
    \  Taxa interna de retorno e razão beneficio/custo.\n8. Inflação.  Preços nominais,\
    \ preços reais e preços relativos.  Efeitos de inflação sobre a decisão e investimento.\n\
    9. Risco e incerteza.  Fontes de riscos.  Análise de sensibilidade.  Sensibilidade.\
    \  Simulação de Monte Carlo.\n10.\tAnálise econômica e social de projetos.  Sua\
    \ origem e estágio atual no Brasil."
