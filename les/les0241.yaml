  course: 'Desenvolvimento Psicológico e Processos Educacionais. Fatores Intrapessoais,
    Sócio-Ambientais e Interpessoais do Processo de Ensino e Aprendizagem. Análise
    Psico Educativa e Processo de Ensino e Aprendizagem. A Construção do Conhecimento
    em Sala de Aula. As Práticas Educativas como Contexto de desenvolvimento de crianças
    e adolescentes. Avaliação no processo de aprendizagem e de desenvolvimento. A
    construção da identidade: seu processo de construção, a escolha como elemento
    constitutivo na formação da identidade. Teorias da Personalidade: as diferentes
    teorias da personalidade e suas implicações educacionais; Desenvolvimento Moral
    e Escolarização. Fundamentos da psicanálise freudiana. Aspectos funcionais e estruturais
    da teoria piagetiana.'
  course_name: 'LES0241 - Psicologia da Educação II

    Educational Psychology II'
  deactivation: ''
  instructors: '827221 - Luciana Buainain Jacob

    5553650 - Vânia Galindo Massabni'
  lecture_credits: '4'
  objectives: 1. Compreender e explicar como e sob que condições a educação proporciona
    aos seres humanos - os instrumentos e os meios eficazes para se relacionarem de
    forma construtiva e satisfatória consigo mesmo, com os demais e com o entorno
    físico e natural. 2. Contribuir para uma melhor compreensão do desenvolvimento
    do adolescente e do jovem adulto em processo de escolarização. 3. Analisar as
    especificidades do espaço escolar e os processos de motivação. 4. Refletir sobre
    o pressuposto da “Educação para todos” e os processos de inclusão de portadores
    de necessidades educacionais especiais. Nas  60h de Práticas como Componente Curricular,
    os alunos devem realizar um estudo de caso com as crianças e adolescentes.
  practical_credits: '2'
  total_workload: '120 h

    (

    Práticas como Componentes Curriculares =  60 h

    )'
