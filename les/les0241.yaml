  course: 'Desenvolvimento Psicológico e Processos Educacionais. Fatores Intrapessoais,
    Socioambientais e Interpessoais do Processo de Ensino e Aprendizagem. Análise
    Psico Educativa e Processo de Ensino e Aprendizagem. A Construção do Conhecimento
    em Sala de Aula. As Práticas Educativas como Contexto de desenvolvimento de crianças
    e adolescentes. Avaliação no processo de aprendizagem e de desenvolvimento. A
    construção da identidade: seu processo de construção, a escolha como elemento
    constitutivo na formação da identidade. Teorias da Personalidade: as diferentes
    teorias da personalidade e suas implicações educacionais; Desenvolvimento Moral
    e Escolarização. Fundamentos da psicanálise. A disciplina contém 60 horas de Práticas
    como Componentes Curriculares (PCCs), sendo consideradas atividades voltadas à
    análise de situações do cotidiano escolar, estudo de casos, discussão de relatos/entrevistas
    de professores e alunos, elaboração e análise de recursos didáticos.'
  course_name: 'LES0241 - Psicologia da Educação II

    Educational Psychology II'
  deactivation: ''
  instructors: 7723980 - Karina Soledad Maldonado Molina
  lecture_credits: '4'
  objectives: Contribuir para uma melhor compreensão do desenvolvimento na segunda
    infância, na adolescência e no jovem adulto em processo de escolarização. Analisar
    as especificidades do espaço escolar e os processos de motivação. Estudar a relação
    entre a educação e a psicanálise, a teoria interacionista de Wallon e a teoria
    das inteligências múltiplas de Gardner.
  practical_credits: '2'
  total_workload: '120 h

    (

    Práticas como Componentes Curriculares =  60 h

    )'
  type: Semestral
