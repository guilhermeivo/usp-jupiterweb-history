  course: 'A Sociologia como ciência. Sociologia e Sociedade- A emergência do pensamento
    sociológico

    - Características da sociedade moderna. Conceitos básicos da Sociologia aplicados
    à Administração. Conceitos fundamentais da Sociologia Clássica. Escolas e abordagens
    sociológicas a partir da expansão capitalista. Contribuições sociológicas para
    o entendimento das organizações sociais. Cultura organizacional, burocracia, poder,
    identidade, globalização. Sociologia e Administração no contexto social brasileiro.'
  course_name: 'LES0195 - Introdução à Sociologia para Administração

    Introduction to Sociology for Management'
  deactivation: ''
  instructors: 8478112 - Luciano Mendes
  lecture_credits: '2'
  objectives: "\x95\tPossibilitar ao estudante e futuro profissional em Administração\
    \ o reconhecimento das relações e interdependência entre a Sociologia e a Administração;\n\
    \x95\tFornecer base conceitual e metodológico da Sociologia como requisitos fundamentais\
    \ para a compreensão das relações humanas no âmbito dos diversos tipos de organizações\
    \ sociais;\n\x95\tPossibilitar a compreensão da complexidade da realidade social,\
    \ mediante uma postura reflexiva e crítica no sentido de contribuir para um mundo\
    \ mais humano e solidário;\n\x95\tIdentificar as características e as especificidades\
    \ das organizações formais e informais;\n\x95\tIdentificar e analisar a função\
    \ e os efeitos da burocracia nas organizações sociais;\n\x95\tIdentificar e analisar\
    \ os diversos tipos de organização a partir de conceitos fundamentais como poder,\
    \ dominação, classe social, democracia e cooperação;\n\x95\tIdentificar as mudanças\
    \ ocorridas nas estruturas organizacionais na contemporaneidade;\n\x95\tReconhecer\
    \ os efeitos da especificidade da cultura brasileira nas suas formas de organização."
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
