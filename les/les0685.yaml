  course: 'Política e programação sob a plena intervenção: os casos das economias
    centralmente planejadas. Os grandes modelos de programação matemática e/ou insumo-produto
    no planejamento alocativo. A intervenção parcial e as políticas indicativas. Os
    objetivos da política econômica: desenvolvimento econômico; crescimento econômico;
    estabilidade montaria e a eficiência repartitiva; Instrumentos de ação da política
    econômica: política monetária; política cambial; políticas de distribuição de
    renda e riqueza. Experiência de implementação de políticas públicas no Brasil
    e em outros países. Orçamento público e Planos Plurianuais.  Política Industrial;
    política de comércio exterior, política ambiental, política de educação. Qualidade
    regulatória. Participação e realização de trabalhos relacionados aos conselhos
    municipais.'
  course_name: 'LES0685 - Politica e Planejamento Econômico

    Economic Planning and Policy'
  deactivation: ''
  instructors: '643773 - Eliana Tadeu Terci

    1906631 - Silvia Helena Galvao de Miranda'
  lecture_credits: '2'
  objectives: Procura introduzir o aluno no processo de planejamento da economia e
    na condução das políticas macroeconômicas de modo a cumprir esse planejamento.
    Apresenta o processo de elaboração e implementação de política e planejamento
    econômico e busca interpretar as medidas adotadas no país ao longo do século XX
    e início do século XXI. Aborda a condução das políticas setoriais no Brasil dentro
    do contexto de planejamento econômico e apresentar alguns instrumentos analíticos
    para avaliar os impactos da implementação de políticas econômicas e setoriais.
    Busca, sobretudo, expor o aluno a um contato direto com a administração pública
    e o processo de decisão da política pública, incentivando sua participação em
    conselhos municipais, audiências públicas e outros fóruns relacionados.
  practical_credits: '1'
  total_workload: 60 h
  type: Semestral
