  course: 'Evolução dos mercados mundiais de produtos agrícolas e produtos agroprocessados.  A
    atual inserção do Brasil no agribusiness internacional. Abertura econômica. Teoria
    Clássica do Comércio Internacional: Mercantilismo, Teoria das Vantagens Absolutas
    e das Vantagens Comparativas. Teoria da Dotação Relativa dos Fatores (Heckscher-Ohlin,
    Heckscher-Ohlin-Samuelson, Stolper-Samuelson), Modelo de Fatores de Produção Específicos.
    Política comercial: Tarifas, subsídios e outras formas de proteção. Barreiras
    comerciais não-tarifárias. Medidas do grau de proteção. Política Comercial na
    prática: instituições reguladoras do protecionismo. Balanço de Pagamentos. Transações
    Correntes: abordagem macroeconômica (dívida externa, abordagem da absorção, investimento/poupança
    e transações correntes, ajuste do Balanço de Pagamentos). Política cambial - taxa
    de câmbio, mercado cambial, pagamentos internacionais. Globalização de mercados,
    empresas transnacionais e investimentos diretos. Sistema monetário internacional.  Integração
    Econômica: fases da integração, criação e desvio de comércio.  Os megablocos econômicos
    da atualidade:  União Européia, Leste Europeu, NAFTA, Países Asiáticos, Mercosul,
    Pacto Andino, ALCA. Análise das políticas agrícolas e comerciais dos países desenvolvidos
    e sua reforma. A Política Agrícola Comum (PAC) da União Européia. A Política Agrícola
    dos Estados Unidos (PAA). Análise histórica da regulação multilateral do comércio
    internacional.  O acordo agrícola da Rodada Uruguai do GATT:  conclusões no acesso
    a mercados, no apoio interno e nos subsídios às exportações. Perspectivas da Rodada
    Agrícola da OMC.

    Evolution of the agricultural and agro processed products at global market. Actual
    insertion of Brazil at the international agribusiness. Opening Economy. Classical
    theory of the international trade: Mercantilism, Theory of Absolute Advantage
    and Comparative Advantage. Theory of relative factor endowments (Heckscher-Ohlin
    model, Heckscher-Ohlin-Samuelson, Stolper-Samuelson). Model of factors of specific
    products. Commercial Policy: Tariffs, Subsidies and other forms of protection.
    Non-tariff trade barriers. Actions on the level of protection. Trade Policy in
    practice: institutions of the regulatory protectionism. Balance of Payments. Current
    Transactions: macroeconomic approach (external debt, the absorption approach,
    investment / savings and current accounts, adjust the balance of Exchange rate
    policy - the exchange rate, foreign exchange, international payments. Globalization
    of markets, transnational corporations and foreign direct investment. International
    monetary system. Economic Integration: the integration phases, creation and trade
    diversion. The economic megablocos today: the European Union, Eastern Europe,
    NAFTA, Asian Countries, Mercosul, Andean Pact, the FTAA. Analysis of agricultural
    and trade policies of developed countries and its reform. The Common Agricultural
    Policy (CAP) of the European Union. The U.S. Agricultural Policy (EAP). Historical
    analysis of the multilateral regulation of international trade. The agricultural
    agreement of the Uruguay Round of the GATT: Conclusions on market access, domestic
    support and export subsidies. Perspectives on the WTO Agricultural Round.'
  course_name: 'LES0596 - Economia e Comércio Internacional

    Economics and International Trade'
  deactivation: ''
  instructors: 2084377 - Heloisa Lee Burnquist
  lecture_credits: '4'
  objectives: 'Trata-se de um curso básico de economia e comércio internacional aplicados
    ao setor agroindustrial. O curso apresenta os fundamentos básicos e as principais
    teorias de economia e comércio internacional, abordando também balanço de pagamentos
    e taxa de câmbio. Na área de política comercial, discute os sistemas de tarifas,
    as restrições não-tarifárias e as práticas desleais de comércio, com ênfase no
    comércio agrícola. A disciplina também discute a evolução da regulação multilateral
    do comércio e os tratados regionais de comércio.

    It is a basic course of economics and international trade applied to the agribusines
    sector. The course shows the basic elements and the principal theories of economics
    and international trade, integrating also the balance of payment and exchange
    rate. At the field of commercial policy, it is discussed the rates system, not-rated
    restrictions and disloyal practical of commerce, with emphasis on agribusiness
    commerce. The course also discusses the evolution of the multilateral regulation
    of the commerce and the regional treatments of commerce.'
