  course_name: 'LES0213 - Fundamentos de Economia, Política e Desenvolvimento

    Principles of Economics, Politics and Development'
  deactivation: ''
  instructors: 3043376 - Alexandre Nunes de Almeida
  lecture_credits: '2'
  objectives: Esta disciplina objetiva fornecer ao estudante os conhecimentos básicos
    de teoria econômica aplicada a problemas enfrentados pela agricultura e pela agroindústria.
    Composta por três módulos de conteúdos distintos busca iniciar o estudante nos
    assuntos econômicos e motivá-lo à buscar aprofundamento nas disciplinas optativas
    da área. Além de introduzir conceitos econômicos, o foco está na economia aplicada.
    No módulo de Macroeconomia, procura mostrar que o conhecimento e análise da conjuntura
    econômica são essenciais para condução das atividades profissionais. O módulo
    de Microeconomia apresenta conteúdos que auxiliarão o aluno na gestão enquanto
    o último módulo é apresentado noções básicas de modelos de Desenvolvimento Econômico
    e são discutidas Politicas Econômicas.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
