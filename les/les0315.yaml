  course: '1.Conteúdo teórico-prático: Contextualização das metodologias específicas.
    O triângulo pedagógico para compreender o papel do professor na definição da metodologia
    na elaboração da própria prática na escola. Abordagem tradicional e a formação
    de professores de Ciências e a aprendizagem significativa. O construtivismo no
    ensino de Ciências. Tipos de conhecimento e suas relações com as metodologias
    de ensino de ciências e as ciências biológicas; relações entre a Ciência e) O
    ensino da Ciência, a aprendizagem, suas dificuldades e problemas na atualidade,
    nas escolas; currículo e conteúdos da área na escola e avaliação; concepções sobre
    Ciências; diversidade metodológica e autonomia dos professores; perspectivas da
    construção do conhecimento e o pensamento dos alunos, direcionando metodologias
    de ensino dialógicas e criativas (tirar- a escola e do professor na sociedade
    e o ensino de Ciências;), O uso de atividades práticas e experimentação em projetos
    e atividades de preparação para o trabalho em sala de aula, considerando as características
    dos alunos, o contexto de atuação e o papel do ensino da área; a elaboração, análise
    e uso de materiais didáticos; relação do projeto político pedagógico e prática
    de ensino de Ciências/Biologia); a gestão da aula (tempos e espaços escolares),
    de forma a organizar situações construtivas no ensino- aprendizagem de Ciências/Biologia.
    Inclui PCC (prática como componente curricular) no levantamento dos materiais
    didáticos e análise dos conteúdos curriculares na escola.

    2.Estágio supervisionado: Estágio de prática de ensino supervisionado na educação
    básica. Observação, participação e regência em grupos de trabalho na escola. Análise
    da escola, variedade didática no ensino de Ciências, materiais didáticos e processos
    pedagógicos. Apresentação dos projetos de estágio. Acompanhamento do professor
    supervisor na elaboração de projeto, materiais e planos necessários às aulas de
    estágio, em colaboração com o campo de estágio; vivência na escola nos anos finais
    do ensino fundamental ou no ensino médio e reconhecimento das atividades de gestão
    do ensino na escola. Registro reflexivo das atividades de estágio, a ser entregue
    em relatório final.'
  course_name: 'LES0315 - Metodologia do Ensino em Ciências Biológicas

    Teaching Methods in Biological Sciences I'
  deactivation: ''
  instructors: 5553650 - Vânia Galindo Massabni
  lecture_credits: '4'
  objectives: De forma intrínseca a atividade de estágio prevista na disciplina, esta
    tem como objetivo apresentar as bases teóricas das metodologias específicas das
    Ciências/Biologia e sua relação com conhecimentos construtivistas e da pedagogia
    geral, a fim de que o educador seja capaz de optar, de forma autônoma, pelas metodologias
    mais adequadas ao seu contexto. Em constante reflexão sobre a relação teoria-prática
    em aula, a disciplina inclui a realização de um estágio docência na escola que
    inclui a gestão pedagógica da sala de aula e da escola. São objetivos da disciplina
    levar os estudantes a compreenderem, refletirem e apropriarem-se de um saber necessário
    para preparar e conduzir aulas em que se considere o papel do professor, do estudante
    e da escola, bem como da área das Ciências/Biologia, na democratização dos conhecimentos
    em uma sociedade que vise ser inclusiva e justa.
