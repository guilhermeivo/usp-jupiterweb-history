  course_name: 'LES0750 - Desenvolvimento de Sistemas de Informação

    Information Systems Development'
  deactivation: 31/12/2023
  instructors: 5863920 - Catarina Barbosa Careta
  lecture_credits: '2'
  objectives: Apresentar conceitos e técnicas sobre desenvolvimento de sistemas de
    informação, capacitando o futuro administrador a analisar processos e projetar
    sistemas de informação que atuem como ferramentas de apoio a tomada de decisões
    e fontes estratégicas de vantagem competitiva.
