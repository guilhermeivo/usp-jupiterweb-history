  assessment: 'Uma prova de recuperação sobre todo material estudado no semestre.
    A nota final da disciplina será a média aritmética entre a média obtida no período
    regular, que envolveu prova regular, atividades, seminário e relatório de estágio,  e
    a nota da avaliação de recuperação. Será aprovado o aluno que obtiver nota final
    igual ou superior a 5,0 (cinco).

    A realização do estágio e entrega do relatório é obrigatória para conclusão da
    disciplina.'
