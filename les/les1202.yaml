  course: 'Unidade I. 1) O papel da Didática na formação de educadores; 2) Função
    social da escola e dos professores; a relação professor-aluno; 3) Pressupostos
    teóricos da Didática; 4) A didática e a relação ensino-aprendizagem; 5) A estruturação
    do trabalho docente. Unidade II. 1) A evolução do ideário pedagógico e as implicações
    decorrentes da adoção de modelos de ensino; 2) As teorias da Educação e o problema
    da marginalidade social. 3) A concepção de professor reflexivo. Unidade III. 1)
    Contribuições didáticas provenientes do conhecimento dos modelos de ensino e suas
    implicações na prática pedagógica do futuro licenciado; 2) Relações professor-aluno
    na sala de aula. 3) A aula como forma de sistematização do ensino. 4) Transposição
    didática. 5) A educação a distância e as novas tecnologias da informação e comunicação
    na pratica pedagógica. Unidade IV e V. 1) Conceito de Planejamento de ensino;
    2) Tipos de plano de ensino; 3) Fases do planejamento de ensino: a formulação
    de objetivos educacionais, seleção e organização dos conteúdos de ensino, seleção
    dos procedimentos de ensino e experiências de aprendizagem, escolha e utilização
    dos recursos audiovisuais e seleção do procedimento de avaliação do processo ensino-aprendizagem.
    Unidade VI. 1) Estruturação de plano de curso, unidade e aula. 2) Gestão escolar,
    trabalho pedagógico coletivo, conselho de classe, associação de pais e mestres,
    reforço e recuperação.'
  course_name: 'LES1202 - Didática

    Didactics'
  deactivation: ''
  instructors: 7785642 - Taitiâny Karita Bonzanini Minetto
  lecture_credits: '4'
  objectives: 'A disciplina objetiva proporcionar ao estudante: 1) Reflexões sobre
    questões educacionais e sobre os fundamentos da didática; 2) Identificação dos
    principais modelos do pensamento educacional, seus representantes e as contribuições
    que cada um dos modelos apresentados oferece à ação educativa do profissional
    da área de ciências agrárias e biológicas (evolução sóciofilosófica das ideias
    pedagógicas); 3) Análise e discussão sobre os principais pressupostos teóricos
    da Didática, e as relações desses como o processo de ensinar e aprender e a estruturação
    do trabalho docente; 4) Refletir sobre a relação teoria-prática, ao aplicar o
    conteúdo da didática no contexto das relações entre educação e sociedade, com
    ênfase especial ao ensino técnico na área de ciências agrárias e ciências biológicas;
    5) Entendimento sobre a importância da transposição didática, 6) Conceituar planejamento
    de ensino e distinguir os diferentes tipos de plano de ensino, bem como suas partes
    principais; 7) Reconhecer a relação que existe entre as fases que compõem o planejamento
    de ensino; 8) Desenvolver cada fase do planejamento de ensino, a saber: determinação
    de objetivos, seleção e organização dos conteúdos, dos procedimentos de ensino,
    dos recursos de ensino, indicar as competências e habilidades que poderão ser
    trabalhadas e os procedimentos e técnicas de avaliação do ensino; 9) Estruturar
    exemplos de planos de ensino atendendo aos itens já relacionados e considerando
    o campo específico da prática pedagógica; 10) Reconhecer o papel da educação a
    distância e das novas tecnologias da informação e comunicação, na condução de
    novos formas de ensinar e aprender; 11) Gestão do ensino e aprendizagem e técnicas
    de manejo de tempo, espaço e organização da classe; 12) Realizar atividades relacionadas
    a prática como componente curricular como: planejamento e execução de seminários;
    estudos dirigidos, resolução de situações problemas advindos de resultados de
    pesquisas da área educacional; 13) Realizar estágio em escolas de educação básica
    ou ensino profissional técnico para observação sobre o contexto educativo em escola
    do ensino formal, para analisar as relações professor – aluno e a abordagem didática
    realizada em sala de aula, valorizando os conhecimentos pedagógicos do conteúdo;
    14) Visitas didáticas a espaços de educação formal e informal para reflexões sobre
    o contexto didático.'
