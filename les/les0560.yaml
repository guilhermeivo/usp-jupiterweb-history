  course_name: 'LES0560 - Comercialização de Produtos Agrícolas

    Trading of Agriculture Products'
  deactivation: ''
  instructors: 1603283 - Mirian Rumenos Piedade Bacchi
  lecture_credits: '3'
  objectives: 'Fornecer os conhecimentos básicos  para  entender e atuar no processo
    de comercialização de produtos agroindustriais e no desenvolvimento de novos mercados
    agropecuários. Especificamente pretende-se: Problematizar a questão da comercialização
    de produtos agropecuários dentro de um enfoque sistêmico (agribusiness) e rever
    o processo de atuação das forças de oferta e demanda do modelo teórico; Conhecer
    o processo de funcionamento dos mercados físicos; Discutir estratégias comerciais
    atuais e potenciais.'
  practical_credits: '1'
  total_workload: 75 h
