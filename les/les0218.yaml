  course: Conceitos básicos e visão sistêmica do Marketing. Conceitos básicos em Marketing.
    Visão geral da Administração e Marketing. O Sistema de Marketing e o Ambiente
    de Marketing. Planejamento Estratégico e o Papel do Marketing. Mensuração e Previsão.
    Segmentação do Mercado e Posicionamento.
  course_name: 'LES0218 - Fundamentos de Marketing

    Principles of Marketing'
  deactivation: 31/12/2023
  instructors: 168175 - Eduardo Eugenio Spers
  lecture_credits: '4'
  objectives: Apresentar uma visão geral do conceito de marketing, do sistema de marketing
    e da administração de Marketing. Discutir os aspectos estratégicos e tático-operacionais
    de marketing. Fornecer uma base para o processo de análise do mercado e do ambiente
    de marketing. Discutir o papel e a função do marketing e a sua capacidade de gerar
    valor às organizações e à sociedade; Capacitar o aluno na elaboração e na avaliação
    de um plano de marketing; Propiciar ao aluno uma visão crítica e ética sobre os
    desafios do marketing como as mudanças no comportamento do consumidor e os aspectos
    mercadológicos e econômicos decorrentes do meio ambiente.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
