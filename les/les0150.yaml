  course: '1) Questões teórico-metodológicas: perspectivas de análise em história
    e sociologia ambiental; 2) O problema moderno da relação entre homem e natureza
    (ciência, indústria e dominação da natureza); 3) A moderna noção de progresso
    e desenvolvimento (do Iluminismo à Belle Époque); Os primórdios da questão ambiental:
    conservacionistas x preservacionistas; 4) Os primeiros abalos no otimismo cientista
    e desenvolvimentista: as duas guerras mundiais; 5) As primeiras críticas: em torno
    de Maio de 1968; 6) Das propostas do Clube de Roma à Primeira Conferência da ONU
    (1972); 7) Da ECO 92 aos nossos dias (a importância das ONGs e outras organizações
    da sociedade civil); 8) O conceito de desenvolvimento sustentável e suas críticas;
    9) Principais correntes do movimento ecológico: Neomalthusianos, Ecoanarquistas,
    Ecologia Profunda, Ecossocialistas, Ecofeministas, Ecologia Política.'
  course_name: 'LES0150 - História dos Movimentos Socioambientais Contemporâneos

    History of Contemporary Environmental Movements'
  deactivation: ''
  instructors: 5594340 - Adalmir Leonidio
  lecture_credits: '2'
  objectives: "Pretende-se levar o aluno a:1) Compreender e explicar como ecologia\
    \ e ambiente se constituem como problema sociológico; 2) Compreender que tipos\
    \ de problemas e contextos envolvem o surgimento da \x93questão ambiental\x94\
    ; 3) Compreender os pontos de vista das principais correntes do movimento ambientalista\
    \ mundial"
