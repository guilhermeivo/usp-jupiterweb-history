  course: '1) Introdução. - Conceito de direito. - Fontes formais do direito. - Classificação
    das leis. - O processo legislativo. - Organização do Poder Judiciário. - Divisão
    do direito e ramos do direito. 2) Tópicos de Direito Civil. - Parte geral do direito
    civil. - Direitos reais. - Direito das obrigações e contratos. 3) Direito Comercial
    - Conceito de direito comercial. - Atos do comércio, teoria da empresa. - Sociedades
    mercantis. - Contratos e obrigações comerciais. - Títulos de crédito. - Direito
    falimentar. 4) Direito Tributário - Conceito de direito tributário. - Conceito
    e classificação dos tributos: impostos, taxas, contribuição de melhoria. - Obrigação
    tributária e seus elementos: a hipótese de incidência. - Análise de alguns impostos.'
