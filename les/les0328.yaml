  course: 'Ø Conceitos básicos sobre estrutura organizacional

    Ø As variáveis organizacionais

    - Complexidade - Divisão do trabalho e níveis hierárquicos

    - Centralização e descentralização

    - Formalização

    Ø Estruturas departamentalizadas: alternativas e critérios

    Ø Estruturas matriciais: tipos e operação

    - Matrizes funcionais e por projetos

    Ø Estruturas por equipes

    Ø UEN - Unidades Estratégicas de Negócio

    Ø Organizações em redes e virtuais

    Ø Concepção e implantação de novas estruturas'
  course_name: 'LES0328 - Estrutura Organizacional

    Organizational Structure'
  deactivation: ''
  instructors: 5748111 - Heliani Berlato dos Santos
  lecture_credits: '2'
  objectives: 'a) Conhecer e identificar os condicionantes e componentes da estrutura
    organizacional das empresas;

    b) Analisar e tomar decisões sobre as alternativas de estrutura organizacional
    para diferentes contextos empresariais;

    c) Entender as limitações e dificuldades envolvidas no estudo e prática do processo
    de avaliação, formulação e implantação da estrutura organizacional nas empresas;'
