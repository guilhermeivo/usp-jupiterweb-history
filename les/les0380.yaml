  course: '1. Conceituações de agricultura familiar

    2. O debate clássico: a revolução industrial e o destino dos camponeses

    3. Da função industrial da agricultura à multifuncionalidade da atividade agrícola

    4. Política agrícola favorável à modernização da agricultura familiar: o exemplo
    do produtivismo francês

    5. A emergência da noção  de agricultura familiar no Brasil

    6. A diversidade da agricultura familiar brasileira

    7. Políticas públicas e o campo de debate em torno do fortalecimento da agricultura
    familiar

    8.  Democracia e questão agrária

    9. Temas associados à agricultura familiar: a) pluriatividade, b) sustentabilidade;
    c) segurança e soberania alimentar; d) participação social; e)agroecologia.'
  course_name: 'LES0380 - Agricultura Familiar, Desenvolvimento Rural e Questão Agrária

    Family Farming, Rural Development and Agrarian Issue'
  deactivation: ''
  instructors: 1261309 - Paulo Eduardo Moruzzi Marques
  lecture_credits: '4'
  objectives: A reflexão e os debates em torno do tema da agricultura familiar ganham
    terreno no Brasil contemporâneo. De fato, a ideia de favorecer a agricultura familiar
    teve um peso considerável na modernização da agricultura dos países mais industrializados.
    Esta disciplina propõe examinar os aspectos que permitiram este fenômeno, em particular
    considerando o debate e as orientações das políticas agrícolas na França. Por
    outro lado, convém tomar em conta a diversidade desta forma social de produção
    agrícola com vistas à reflexão sobre o tema. Nesta perspectiva, pretende-se focalizar
    a emergência da idéia de fortalecimento da agricultura familiar e suas repercussões
    nas políticas e nos debates sobre o desenvolvimento rural no Brasil. Nesta linha,  serão
    discutidos os temas que se associam à reflexão atual sobre a agricultura familiar,
    sob a luz notadamente do debate em torno da multifuncionalidade da agricultura,
    no que diz respeito à pluriatividade, à segurança alimentar, à sustentabilidade,
    ao desenvolvimento territorial, à participação social e à reforma agrária. Sobre
    este último ponto, convém salientar que a questão agrária persiste como fundamental
    para a reflexão sobre a democracia brasileira. A desigualdade social brasileira
    se associa profundamente com a estrutura fundiária concentrada do país. Assim,
    esta disciplina focalizará particularmente este problema, considerando a história
    da ocupação do território brasileiro, a incorporação da questão agrária no âmbito
    político, o movimento social por terra, o debate sobre a reforma agrária e os
    impactos e desafios relativos à implantação dos assentamentos rurais.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
