  course_name: 'LES0557 - Teoria Macroeconômica II

    Macroeconomic Theory II'
  deactivation: ''
  instructors: 3043376 - Alexandre Nunes de Almeida
  lecture_credits: '4'
  objectives: "A disciplina visa a alcançar dois objetivos.\nO primeiro é examinar\
    \ os desenvolvimentos da macroeconomia no longo prazo, isto é, na perspectiva\
    \ do crescimento econômico. A questão central: por quê o Brasil tem ficado para\
    \ trás no contexto internacional? Compara-se a o desempenho do Brasil ao de outros\
    \ países, discutindo-se os possíveis determinantes da evolução observada tanto\
    \ do ponto de vista teórico como à luz das evidências disponíveis. São examinados\
    \ os papéis da poupança e da acumulação de capital, do conhecimento e da tecnologia\
    \ e da eficiência seus efeitos sobre a produtividade e renda per capita.\nO segundo\
    \ objetivo, focando no curto e médio prazo, é apresentar uma síntese dos principais\
    \ desenvolvimentos nas políticas de estabilização a partir dos anos 1970. A questão\
    \ central é: O que provoca os ciclos econômicos e o que pode ser feito para estabilizá-los?\
    \ Trata-se fundamentalmente da chamada \x93síntese neoclássica\x94, isto é, dos\
    \ desenvolvimentos teóricos a partir da integração das idéias de Keynes e dos\
    \ Clássicos, com ênfase no papel das expectativas e os debates em torno da Curva\
    \ de Phillips. Segue-se, então, a incorporação da teoria das expectativas racionais\
    \ e suas implicações nos vários campos da macroeconomia. Sob esse enfoque, discutem-se\
    \ a eficácia das políticas de estabilização face aos choques de demanda e oferta,\
    \ a escolha das políticas, o papel da dívida pública e sua sustentabilidade."
