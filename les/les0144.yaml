  objectives: Este curso visa apresentar os princípios da teoria microeconômica e
    macroeconômica de modo a permitir aos alunos o entendimento do que vem a ser economia
    e qual o seu objetivo de estudo. Ao final do curso os alunos deverão estar dominando
    os conceitos econômicos básicos e capazes de analisar e entender os fatos econômicos
    diários relacionados ao seu campo de atuação.
