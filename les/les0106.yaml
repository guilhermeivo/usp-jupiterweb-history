  course: 'Definição e importância do estudo de história econômica e das diversas
    correntes teóricas. Teoria econômica e principais pensadores. Revisão da Primeira
    revolução econômica, primeiros Sistemas Econômicos, Feudalismo e da Transição
    do Feudalismo para o capitalismo. A Primeira Revolução Industrial. A Onda de industrialização
    atrasada. A Segunda Revolução Industrial. A crise da hegemonia inglesa e a Segunda
    Onda de industrialização. O imperialismo. As Guerras mundiais, o Comunismo e os
    governos ditatoriais de direita no mundo. A crise dos anos 1930. A evolução da
    Economia Mundial no Pós-Guerra – a Era de Ouro do capitalismo, a financeirização
    e o capitalismo de massa. Industrialização tardia: Coréia, Brasil, China, índia,
    Argentina. Debates sobre temas atuais.'
  course_name: 'LES0106 - História Econômica Contemporânea

    General Economic History'
  deactivation: ''
  instructors: 5098002 - Carlos Eduardo de Freitas Vian
  lecture_credits: '4'
  objectives: "Discutir com os alunos o desenvolvimento histórico do capitalismo até\
    \ os \x93tempos modernos\x94, analisando o processo de conformação da sociedade\
    \ capitalista atual. Compreender, ainda, a evolução da economia internacional\
    \ no pós-guerra, principalmente no que se refere aos padrões de desenvolvimento\
    \ industrial adotados e a crise mundial dos anos 1980. Ênfase especial será dada\
    \ ao desenvolvimento das grandes corporações multinacionais e ao processo de \x93\
    Globalização\x94 e à era do consumo de massas, que marcam os dias de hoje.\nNeste\
    \ contexto os alunos deverão entender e criticar as diferentes trajetórias de\
    \ desenvolvimento agrícola e industrial e os problemas do Capitalismo Financeiro\
    \ vigente hoje. Nesta discussão buscar-se-á situar o Brasil no contexto do desenvolvimento\
    \ histórico do capitalismo e da divisão internacional do trabalho, dando base\
    \ para estudos posteriores nas disciplinas de Formação Econômica I e II e Desenvolvimento\
    \ Econômico e Social."
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
