  course: "-Natureza e objeto dos estudos filosóficos.\n- Ciência e Filosofia - Conceitos.\n\
    - As diversas ciências e a Administração.\n- Ética, Lógica, Estética e Metafísica\
    \ e suas relações com a Administração.\n- A Ética e o conhecimento na história\
    \ da filosofia ocidental: o Pré-socráticas, Sócrates, Platão e Aristóteles, a\
    \ Escolástica, o Racionalismo, o Empirismo, o Criticismo e o Positivismo.\n- O\
    \ problema do conhecimento (Epistemologia) e sua implicação na Administração.\n\
    - O conhecimento nas ciências humanas e na filosofia moderna aplicados na Administração.\n\
    - A metodologia científica nas ciências humanas e sua aplicação na Administração.\n\
    -Nature and objective of the philosophy study\n-Science and philosophy \x96 Concept\n\
    -The diverse sciences and the Administration\n-Ethic, Logic, Esthetic e Metaphysics,\
    \ and it relations with the administrations\n-The ethic and the knowledge inside\
    \ the occidental philosophy history: Pre-Socratic Socrates, Plato and Aristotle,\
    \ Scholasticism, Rationalism, Empiricism, Positivism and Criticism.\n- The problem\
    \ of knowledge (epistemology) and their involvement in the administration.\n-\
    \ The knowledge in the humanities and applied in modern philosophy in the administration.\n\
    - The scientific methodology in human sciences and their application in the administration."
  course_name: 'LES0170 - Introdução à Filosofia para Administração

    Introduction to the Philosophy for Management'
  deactivation: ''
  instructors: 93929 - Alex Coltro
  lecture_credits: '2'
  objectives: 'Permitir ao aluno ter conhecimentos básicos sobre filosofia e ciência;
    b) Dar oportunidade ao aluno de refletir sobre os fundamentos Éticos da atividade
    empresarial; moralidade pessoal e organizacional possibilitando desenvolver posturas
    responsáveis nos negócios, na política e nas relações pessoais; c) Dar embasamento
    sobre o conhecimento e sua forma de obtenção; d) Fornecer subsídios para o desenvolvimento
    do espírito crítico e do raciocínio lógico; e) Permitir iniciação à metodologia
    científica de pesquisa.

    ) Allow the students to have the basis of the knowledge of philosophy and science;
    b) Give the opportunity for the student to think about ethics on company activities;
    personal moral and organizational making possible to develop responsible standards
    for business, policy and personal relations; c) Give basement about knowledge
    and how to obtain it; d) Give subsidies to develop the critic spirit and logic
    thinking; e) permit the start to the scientific methodology and research.'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
