  course: ":    O programa foi melhor detalhado para especificar os tópicos ministrados.\n\
    1. Metodologias de construção de cenários de conjuntura econômica e social e bases\
    \ de dados; 2 - Revisão sobre o processo de industrialização no Brasil e suas\
    \ principais características; 3 - A década de 1980 e a crise da dívida; 4 \x96\
    \ A Década de 1990: Abertura comercial, estabilização, econômica e mudanças estruturais\
    \ (Privatização, reforma da previdência, mudanças no setor financeiro); 5 \x96\
    \ Retorno do crescimento nos anos 2000 e seus determinantes (PAC, PDP, Política\
    \ Industrial, políticas sociais, estratégias empresariais). 6 \x96 Perspectivas\
    \ da Competitividade da economia nacional (Inovação, política industrial, nova\
    \ ordem mundial); 7 \x96 Estudos setoriais, regionais ou temáticos (a serem definidos\
    \ com cada turma)."
  course_name: 'LES0561 - Economia Brasileira Contemporânea

    Contemporary Brazilian Economics'
  deactivation: ''
  instructors: 5098002 - Carlos Eduardo de Freitas Vian
  lecture_credits: '4'
  objectives: 'Analisar a evolução da economia brasileira desde os anos 1980, entendendo
    seus problemas, períodos de crescimento e recessão e os determinantes da retomada
    do crescimento no início do século XXI. Serão discutidos os problemas da economia
    brasileira nas décadas de 1980 e 1990, particularmente a restrição externa, a
    inflação e a reestruturação econômica. Por fim, analisamos o alguns tópicos das
    questões relacionadas ao crescimento recente do país e as seus obstáculos.

    O curso terá uma fase final de debates de temas específicos que serão determinados
    com os alunos, onde os mesmos deverão fazer uma revisão bibliográfica do tema
    e traçar as perspectivas futuras sobre o mesmo, montando um cenário conjuntural.'
  practical_credits: '0'
  total_workload: 60 h
