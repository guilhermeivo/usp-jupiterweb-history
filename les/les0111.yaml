  course: 'Introdução à Gestão Ambiental é uma disciplina essencial e obrigatória
    dentro do curso e tem como principal finalidade oferecer aos alunos informações
    sobre os princípios básicos da administração da relação entre homem e natureza.
    Serão usados como referência para discussão os seguintes temas: História e Desenvolvimento
    do Movimento Ambientalista, Desenvolvimento Sustentável, Consumo Consciente e
    Mecanismos de Desenvolvimento Limpo, Serviços e Produtos Ambientais, Responsabilidade
    Sócio-Ambiental Empresarial, Fiscalização Ambiental, Gestão de Mananciais Hídricos,
    Resolução de Conflitos, Terceiro Setor e ONGs, Fontes Alternativas de Energia,
    Certificação Ambiental, Protocolos Internacionais sobre Mudanças Climáticas e
    Atmosféricas. Contribui para formação discente, introduzindo as noções preliminares
    sobre Gestão Ambiental e seu caráter multidisciplinar.'
  course_name: 'LES0111 - Introdução à Gestão Ambiental

    LES0111 Introduction of Environmental Management'
  deactivation: ''
  instructors: 1564700 - Odaléia Telles Marcondes Machado Queiroz
