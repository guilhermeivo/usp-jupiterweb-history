  course_name: 'LES0773 - Estatística Aplicada III (Análise Multivariada)

    Applied Statistics III (Multivariate Analysis)'
  deactivation: ''
  instructors: 1777242 - Vitor Augusto Ozaki
  lecture_credits: '4'
  objectives: "A disciplina tem como objetivo principal capacitar os alunos para o\
    \ entendimento e compreensão de diversas técnicas de análise multivariada, com\
    \ enfoque para aplicações em ciências contábeis e atuariais.\nO conteúdo a ser\
    \ discutido visa complementar a utilização de microcomputadores por parte dos\
    \ alunos, considerando os aspectos relacionados à elaboração, tratamento e análise\
    \ de bancos de dados.\nO intuito é que o aluno adquira conhecimentos e habilidades\
    \ sobre o assunto \x93Gerenciamento e Tratamento de Bancos de Dados\x94, por meio\
    \ de discussão de conceitos e oferta de espaço para treinamento, em laboratório,\
    \ de questões práticas relativas ao seu uso.\nÉ prevista revisão conceitual profunda\
    \ de tratamento e análise de bancos de dados em sessões de laboratório, relacionadas\
    \ com aplicação prática de softwares como SPSS e SAS."
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
