  assessment: A recuperação será feita por meio de uma prova adicional que comporá
    a nota final de avaliação. O aluno será considerado aprovado se a média aritmética
    entre a nota obtida na avaliação normal e a nota obtida nesta prova adicional
    for maior ou igual a 5,0 (cinco).
