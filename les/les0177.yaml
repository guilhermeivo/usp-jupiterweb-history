  course: "1) Questões metodológicas: O que é história ambiental; 2) Período colonial:\
    \ História do agro e do desmatamento, relacionada ao \x93sentido\x94 inicial da\
    \ colonização; Os cronistas e a visão de natureza predominante; A Época Pombalina\
    \ e a introdução das ciências naturais;3) Período imperial: A presença dos naturalistas\
    \ no Brasil e a visão de natureza correlata; As novas sensibilidades: a construção\
    \ de jardins botânicos, parques públicos, preocupações preservacionistas; as sensibilidades\
    \ românticas; A construção de cidades, o crescimento urbano e seus impactos; A\
    \ introdução de máquinas na agricultura, o fim do trabalho escravo e as modificações\
    \ na agricultura; 4) O período republicano: A industrialização e seus impactos;\
    \ O higienismo; O período Vargas e a criação dos primeiros parques nacionais como\
    \ áreas de preservação; O período da ditadura e a Revolução Verde na agricultura"
  course_name: 'LES0177 - História Social e  Ambiental do Brasil

    Brazilian Social and Environmental History'
  deactivation: ''
  instructors: 5594340 - Adalmir Leonidio
  lecture_credits: '2'
  objectives: Pretende-se levar o aluno a:1) Compreender e explicar o que é História
    Ambiental como modalidade teórico-metodológica; 2) Compreender que sociedade e
    natureza são construídos historicamente e não fenômenos universais e atemporais;
    3) Compreender como muitos dos problemas que são colocados hoje mediante preocupações
    ambientais estão relacionados à forma como se construiu historicamente a relação
    entre homem e natureza no Brasil.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
