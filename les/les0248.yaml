  course: 'Apresentar os modelos de análise, proposição e implantação de estruturas
    organizacionais, cujos condicionantes são: estratégia, tecnologia, ambiente, pessoas
    e objetivos. Os mesmos possuem como seus componentes os sub-sistemas de autoridade,
    comunicação e responsabilidade. Apresentar os conceitos básicos sobre estrutura
    organizacional e o processo de organização. Utilizando-se de temas emergentes
    na gestão e de suas atuais "ferramentas" estudar os condicionantes e componentes
    da estrutura organizacional. Departamentalização. Centralização e Descentralização.
    Níveis hierárquicos e amplitude de controle. Estruturas inovativas. Diagnóstico
    da Estrutura. Concepção e implantação da estrutura organizacional institucional.
    Papéis e habilidades do gestor. Condicionantes do estilo gerencial. Delegação
    e desenvolvimento de subordinados.'
  course_name: 'LES0248 - Organização e Métodos

    Organization and Methods'
  deactivation: ''
  instructors: '4514654 - Giovana Escrivão

    5747472 - Maria Lucia Granja Coutinho'
  lecture_credits: '4'
  objectives: Conhecer e identificar os condicionantes e componentes da estrutura
    organizacional das instituições. Analisar e tomar decisões sobre as alternativas
    de estrutura organizacional para diferentes contextos institucionais. Entender
    as limitações e dificuldades envolvidas no estudo e prática do processo de avaliação,
    formulação e implementação da estrutura organizacional nas instituições. Conhecer
    os conceitos e técnicas que favorecem o desempenho do gestor na empresa. Discutir
    estilos de direção de sucesso em diferentes contextos.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
