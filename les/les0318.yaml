  course: Conceitos básicos sobre Marketing e Estratégia. Visão geral do Planejamento
    Estratégico e Administração de Marketing. Análise do Ambiente Interno e Externo.
    Estratégias de Marketing. Estratégias do Composto de Marketing. Formulação, Implementação,
    Organização e Controle das Estratégias de Marketing.
  course_name: 'LES0318 - Marketing II

    Marketing II'
  deactivation: ''
  instructors: 168175 - Eduardo Eugenio Spers
  lecture_credits: '4'
  objectives: Apresentar uma visão geral do conceito de marketing e estratégia organizacional.
    Explorar os conceitos de vantagem competitiva, valor para o cliente, posicionamento
    e segmentação de mercado. Discutir os aspectos estratégicos das decisões de produto,
    preço, distribuição e comunicação. Fornecer instrumentos metodológicos para a
    pesquisa e análise do mercado e da empresa.Objetivos específicos:- Discutir o
    papel e a função do marketing na estratégia organizacional;- Capacitar o aluno
    na elaboração, avaliação e implementação de um plano estratégico de marketing;-
    Propiciar ao aluno uma visão crítica e ética sobre os desafios do marketing e
    de sua implementação e gestão nas organizações e;- Avaliar o papel crítico e social
    do marketing numa sociedade globalizada.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
