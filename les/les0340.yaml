  course: 'O programa da disciplina prevê o trabalho com: Discussões e execução de
    Estágio em instrumentação Prática como componente curricular: elaboração de materiais
    e seminários. Discussão de conteúdos como: História da Ciência e sua relação com
    o desenvolvimento instrumental; o professor enquanto intelectual e profissional
    reflexivo e sua relação com a instrumentação para o ensino dos conteúdos curriculares
    tradicionais e inovadores; análise e desenvolvimento de materiais para o ensino
    de áreas específicas (genética, anatomia, entre outras), com discussões sobre
    Metodologia de Ensino e Didática; análise e desenvolvimento de materiais para
    o ensino envolvendo alunos com necessidades educacionais especiais; discussões
    sobre instrumentos para o trabalho com temas transversais, interdisciplinaridade,
    multidisciplinaridade e transversalidade, fontes de informação e tecnologias da
    informação na escola e em espaços educacionais interativos; Alfabetização Científica;
    a perspectiva CTSA e o ensino; laboratórios didáticos: montagem, manutenção, segurança
    e uso no ensino básico; adaptação de experimentos ao ensino básico; espaços não
    formais de aprendizagem como Museus, Feiras de Ciências e organização do ensino
    em espaços alternativos na sociedade, visitas didáticas a espaços formais e não
    formais de aprendizagem (excursões da disciplina) com o objetivo de proporcionar
    aos alunos maiores vivências e contatos com diferentes situações de ensino, proporcionando
    discussões e reflexões sobre o processo de ensino e de aprendizagem nesses espaços;
    concepção, elaboração e uso de KITs educacionais; produção e análise de Jogos
    Educativos; Educação Ambiental: concepções e recursos didáticos para sua implementação.'
  course_name: 'LES0340 - Instrumentação para o Ensino de Ciências Biológicas

    Instrumentation for the Teaching of Biological Sciences'
  deactivation: ''
  instructors: 7785642 - Taitiâny Karita Bonzanini Minetto
  lecture_credits: '4'
  objectives: Preparo instrumental do educador para considerar sua atividade intelectual
    e reflexiva, considerando a dimensão da Ciência na sociedade e as tendências atuais
    na área de ensino de Ciências para propor, analisar e elaborar experimentos, materiais
    e espaços didáticos no ensino formal (como o laboratório escolar) e não formal
    de Ciências, conhecidos através de visitas didáticas a Museus e Exposições (excursões
    da disciplina) e, incluindo, ainda os espaços abertos pela tecnologia da informação.
    A disciplina visa contemplar questões relacionadas a gestão pedagógica, tanto
    no Ensino Fundamental como no Ensino Médio, discutindo instrumentos de ensino
    utilizados em projetos pedagógicos, além do estudo sobre aplicação de técnicas
    e manejo de tempo, espaço e organização da classe, utilizando-se de recursos que
    possam motivar os alunos e contribuir para a aprendizagem. Associada a tais discussões
    encontram-se também análises sobre as formas de avaliar o processo de ensino-aprendizagem
    visando contribuir para o progresso do aluno. Contemplar atividades envolvendo
    a prática como componente curricular como a elaboração e análise de materiais
    didáticos aplicados a situações de ensino, junto a escola de educação básica,
    bem como a reflexão sobre a relação desses materiais com as disciplinas, envolvendo
    a elaboração de kits didáticos, jogos educativos, materiais para atividades práticas
    de laboratório, dentre outros, como também o planejamento e condução de seminários,
    focalizando materiais que contribuam para a instrumentação pedagógica. Realização
    de estágio supervisionado em escolas de educação básica.
