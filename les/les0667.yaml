  course: '1. Introdução à Administração - Evolução da Gestão Agroindustrial no Brasil
    - 2. Alguns Conceitos Básicos - Custos de produção:  teoria e métodos de cálculo
    - Aplicações de custos de produção na empresa; 4. Planejamento Estratégico. 5.
    Empreendedorismo e Plano de Negócios; 6. Controle - Controle como uma função administrativa
    - As fases do controle - Técnicas de controle;  7. Noções de Finanças - Administração
    financeira; 8. Noções de marketing - Diferenciação de produto e pesquisa de mercado;
    9. Financiamento da produção e comercialização.'
  course_name: 'LES0667 - Gestão dos Negócios Agroindustriais

    Agribusiness Management'
  deactivation: ''
  instructors: '1225121 - Margarete Boteon

    1707772 - Sérgio De Zen'
  lecture_credits: '2'
  objectives: Introduzir o aluno na área de gestão agroindustrial. O programa perpassa
    todas as áreas das ciências da administração, via conhecimento de fundamentos
    em administração geral, empreendedorismo, marketing, planejamento estratégico,
    crédito,, contabilidade e administração financeira - com ênfase em problemas relacionados
    às empresas que atuam no sistema agroindustrial.
  practical_credits: '1'
  total_workload: 60 h
  type: Semestral
