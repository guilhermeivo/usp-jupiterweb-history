  course_name: 'LES0691 - Econometria

    Econometrics'
  deactivation: ''
  instructors: 56020 - Ana Lucia Kassouf
  lecture_credits: '4'
  objectives: 'O curso é idealizado para os alunos de graduação em economia que já
    fizeram os cursos de estatística básica, economia básica e cálculo.

    Pretende-se mostrar aos alunos como dados econômicos são utilizados com teoria
    econômica para estimar parâmetros, testar hipóteses e prever resultados econômicos.

    Ficará claro como modelos econômicos, pressuposições estatísticas, procedimentos
    de estimação e inferência, e os dados, têm uma relação de interdependência no
    processo de obtenção de informações empíricas.'
