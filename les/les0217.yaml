  objectives: Assimilar os principais pressupostos teóricos que fundamentam a definição
    de políticas e práticas de Gestão de Pessoas nas Empresas; Conhecer as principais
    atividades e procedimentos dos vários subsistemas da Administração de Pessoas
    e os impactos de sua operacionalização em diferentes instâncias organizacionais;
    Familiarizar-se com processo de formulação de Políticas de Gestão de Pessoas,
    identificando seus elementos componentes para implementação e avaliação.
