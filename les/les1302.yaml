  course: 'Introdução a Psicologia. A Psicologia enquanto ciência: sua história e
    as principais correntes teóricas. A psicologia educacional como campo do estudo.
    Desenvolvimento humano. As principais escolas da psicologia, elementos históricos
    e pressupostos teóricos. A relação entre desenvolvimento e a aprendizagem escolar.
    A disciplina contém 60 horas de Práticas como Componentes Curriculares (PCCs),
    sendo consideradas atividades voltadas à análise de situações do cotidiano escolar,
    estudo de casos, discussão de relatos/entrevistas de professores e alunos, elaboração
    e análise de recursos didáticos.'
  course_name: 'LES1302 - Psicologia da Educação I

    Educational Psychology I'
  deactivation: ''
  instructors: 7723980 - Karina Soledad Maldonado Molina
  lecture_credits: '2'
  objectives: Disponibilizar aos estudantes espaço para consolidação de conhecimento
    a respeito da Psicologia como ciência. Apresentar os pressupostos teóricos das
    diferentes escolas da Psicologia. Compreender do ponto de vista psicológico a
    relação desenvolvimento e aprendizagem, partindo das diferenças presentes nas
    pessoas.
