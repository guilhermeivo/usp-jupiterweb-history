  course: 'Introdução a Psicologia. A Psicologia enquanto ciência: sua história e
    as principais correntes teóricas. A psicologia educacional como campo do estudo.
    O Behaviorismo: histórico e pressupostos teóricos básicos. A psicologia sócio
    histórica de Lev Vygothsky. Desenvolvimento humano; a visão contextualista - interacionista
    do processo evolutivo. As principais escolas da psicologia, elementos históricos
    e pressupostos teóricos. A motivação para a aprendizagem escolar. Atividades de
    Prática como Componente Curricular-PCC (60h).'
  course_name: 'LES1302 - Psicologia da Educação I

    Educational Psychology I'
  deactivation: ''
  instructors: '827221 - Luciana Buainain Jacob

    5553650 - Vânia Galindo Massabni'
  lecture_credits: '2'
  objectives: 1. Apresentar o histórico e os fundamentos da psicologia enquanto ciência.
    Apresentar os pressupostos teóricos das principais escolas da psicologia. 3. Utilizar
    as contribuições da Psicologia da Educação na compreensão dos alunos em suas semelhanças
    e diferenças no que diz respeito aos diversos aspectos do seu processo evolutivo.
    Entrevistas realizadas pelos licenciandos para estudar a motivação, nas 60 h de
    Prática como Componente Curricular (PCC).
  practical_credits: '2'
  total_workload: '90 h

    (

    Práticas como Componentes Curriculares =  60 h

