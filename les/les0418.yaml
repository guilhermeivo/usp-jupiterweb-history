  course: Aspectos Teóricos e Metodológicos da Vantagem Competitiva. Formulação, Implementação
    e Mudança das Estratégias. Estratégia e Conhecimento. Estratégias Empresariais
    e Corporativas. Estratégia, Sustentabilidade Socioambiental e Ética Corporativa.
    Estratégia e Empreendedorismo. Estratégia e Cooperação. Negócios Internacionais.
    Modelagem e Mensuração do Desempenho. Perspectivas Organizacionais e Sociológicas
    da Estratégia. Estratégia, Governo e Desenvolvimento.
  course_name: 'LES0418 - Estratégia em Organizações

    Strategy in Organizations'
  deactivation: ''
  instructors: 5098002 - Carlos Eduardo de Freitas Vian
  lecture_credits: '4'
  objectives: O objetivo da disciplina é propiciar ao aluno uma visão crítica e ética
    sobre a estratégia, explorando sua aplicação à realidade organizacional no escopo
    das suas teorias, ferramentas e perspectivas. Alinhado ao eixo formativo e profissional
    do aluno, a abordagem de temas relevantes como vantagem competitiva, empreendedorismo,
    gestão e planejamento estratégico, conferem reflexões e aplicações pertinentes
    sob o viés das questões ética, econômica, ambiental e social da estratégia e da
    sustentabilidade nas organizações.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
