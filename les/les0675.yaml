  course: '- Oferta de Moeda: conceitos de moeda, base monetária e meios de pagamentos.
    - Mercados Financeiros e Política Monetária: Moeda, Sistema Monetário e Política
    Monetária; Inflação; Intermediação Financeira; Sistema Financeiro Nacional; Instrumentos
    de Política Monetária. - Mercados Financeiros: Mercado Formal e Mercados Informais;
    Evolução histórica e estrutura atual; Situação atual dos financiamentos no Brasil;
    Programas existentes, fontes de recursos.'
  course_name: 'LES0675 - Economia Monetária

    Monetary Economics'
  deactivation: ''
  instructors: 1968008 - Roberto Arruda de Souza Lima
  lecture_credits: '4'
  objectives: Proporcionar ao estudante os conhecimentos básicos a respeito da economia
    monetária e do crédito, seu papel como instrumento de desenvolvimento e normas
    gerais que regulamentam suas operações. Ministrar conhecimentos sobre a importância
    e o funcionamento dos mercados financeiros. Discutir os principais instrumentos
    de política monetária e seus efeitos no desenvolvimento econômico do país.
