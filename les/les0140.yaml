  course: 'Metodologia: -Como formular e delimitar um problema de pesquisa; - Designs
    de pesquisa; Conceitos, hipóteses e variáveis; Coleta e interpretação de dados;
    Experimentação; Pesquisa Bibliográfica; Estudos de caso; Diário de campo; Pesquisa
    participante; Pesquisa ação; Redação de textos científicos. Ciência: Por que  fazer
    ciência?; Ciência e outras formas de conhecimento; As diversas formas de fazer
    ciência; Origens e situação atual; Ciências humanas e naturais'
  course_name: 'LES0140 - Métodos e Técnicas de Pesquisa em Economia

    Methods and Techniques in Economic Research'
  deactivation: ''
  instructors: 1564700 - Odaléia Telles Marcondes Machado Queiroz
  lecture_credits: '4'
  objectives: 'Os objetivos do curso, são os seguintes: (a) propor elementos para
    o melhor aproveitamento do tempo de estudos dos alunos; (b) propiciar ao aluno
    condições para entender a Ciência como teoria explicativa, como atividade/processo
    de investigação da realidade e como instituição social em mutação; (c) permitir
    ao aluno estabelecer relações, diferenças e similares entre a Ciência e outras
    modalidades de conhecimento/explicação da realidade; (d) salientar as características
    do método científico; (e) levar o aluno a iniciar-se num trabalho prático de pesquisa
    científica; (f) por em relevo o sentido pedagógico-humanizante da atitude científica;
    (g) analisar e discutir a pesquisa como princípio científico e como princípio
    educativo; (h) fornecer as diretrizes para elaboração e apresentação de um trabalho
    cinetífico; e (i) esta disciplina, parte prática-Seminários, visa também a compreensão
    crítica da realidade brasileira atual, enfatizando a participação na solução de
    problemas nacionais relevantes.'
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
