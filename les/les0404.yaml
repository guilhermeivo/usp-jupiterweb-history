  course: 'A disciplina abordará aspectos fundamentais da Educação inclusiva, sua
    discussão no campo teórico e prático, considerando as demandas por uma educação
    para todos. A disciplina requer leitura e análise de textos nas temáticas, aulas
    expositivas e exercícios, entre outras metodologias de aprendizagem.  Serão usados
    como referência para discussão os seguintes temas: Educação especial e inclusiva;
    História da política de educação inclusiva no mundo e no Brasil e principais marcos
    legais; Programas de acessibilidade; Autonomia, participação social e emancipação
    da pessoa com deficiência; Direito à Diversidade; Educação de Surdos e a Língua
    Brasileira de Surdos; Salas de Recursos Multifuncionais.'
  course_name: 'LES0404 - Educação Inclusiva e LIBRAS (Língua Brasileira de Sinais)

    Inclusive education and LIBRAS (Brazilian Language of Signs)'
  deactivation: ''
  instructors: 1564700 - Odaléia Telles Marcondes Machado Queiroz
  lecture_credits: '4'
  objectives: Apresentar ao aluno a oportunidade de conhecer as principais questões
    relacionadas aos fundamentos da educação especial, reconhecendo suas especificidades
    e necessidades formativas, políticas públicas ligadas ao assunto, enfatizando
    práticas pedagógicas que facilitem o ensino e o aprendizado e noções de comunicação
    interpessoal na perspectiva da inclusão – educação de Surdos e a Língua Brasileira
    de Surdos - LIBRAS. Evidenciar técnicas inovadoras que possam promover a conexão
    do portador de deficiência à sociedade. A disciplina visa atender ao DECRETO Nº
    5.626, DE 22 DE DEZEMBRO DE 2005 da Presidência da República.
