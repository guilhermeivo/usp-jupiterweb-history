  course: 'Teórico – Apresentar elementos centrais para o desenvolvimento de práticas
    pedagógicas inclusivas, a partir da discussão dos conceitos de educação inclusiva,
    educação inclusiva, necessidade educativa especial e pessoa com deficiência. Explorar
    a política nacional de Educação Especial na Perspectiva Inclusiva seu público-alvo,
    o atendimento educacional especializados, papel dos professores regentes e especialistas
    e demais profissionais que atuam no apoio aos estudantes. Introduzir os fundamentos
    da Educação de Surdos: contexto histórico, educacional, cultural, linguístico
    e político. Educação Bilingue para surdos e a atuação de tradutores intérpretes
    de Libras.

    Prática - Estudo prático da Libras em nível introdutório.

    A disciplina contém 60 horas de Práticas como Componentes Curriculares (PCCs),
    sendo consideradas atividades voltadas à análise de situações do cotidiano escolar,
    estudo de casos, discussão de relatos/entrevistas de professores e alunos, elaboração
    e análise de recursos didáticos.'
  course_name: 'LES0404 - Educação Inclusiva e LIBRAS (Língua Brasileira de Sinais)

    Inclusive education and LIBRAS (Brazilian Language of Signs)'
  deactivation: ''
  instructors: 7723980 - Karina Soledad Maldonado Molina
  lecture_credits: '4'
  objectives: Apresentar a proposta da Educação Inclusiva como princípio para o processo
    de escolarização de todos os estudantes. Destaque para a Educação Especial no
    Brasil, atendimento a público-alvo específico, para a Educação de Surdos desenvolvendo
    noções básicas de Língua Brasileira de Sinais – LIBRAS conforme Decreto n° 5.626/2005.,
    que colaborem na formação inicial de professores das áreas das Ciências Biológicas
    e Ciências Agrárias. Contextualizar historicamente e politicamente a educação
    inclusiva, educação especial, educação de surdos e educação bilíngue.  Discutir
    e diferenciar os papéis dos professores regentes, professores especialistas no
    campo da educação especial, intérpretes de Libras e demais profissionais envolvidos
    na educação inclusiva.
  practical_credits: '2'
  total_workload: '120 h

    (

    Práticas como Componentes Curriculares =  60 h

    )'
