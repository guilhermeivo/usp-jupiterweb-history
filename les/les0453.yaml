  course: 'Mercados futuros: agentes; principais bolsas; Regulação de mercados futuros
    no Brasil e no Mundo; Características e funcionamentos dos Mercados Futuros e
    de Opções; Estratégias com Futuros e Opções; Visita ao Mercado Financeiro.'
  course_name: 'LES0453 - Mercados de Derivativos Agropecuários e Financeiros

    Agricultural and Financial Derivatives Markets'
  deactivation: ''
  instructors: 1968008 - Roberto Arruda de Souza Lima
  lecture_credits: '4'
  objectives: 'Esta disciplina tem como objetivo principal mostrar o funcionamento
    dos mercados futuros e de opções agropecuários e estratégias que podem ser utilizadas
    para administração de riscos de preços. Especificamente, pretende-se: - Conhecer
    de forma teórica e prática o funcionamento dos mercados futuros e de opções agropecuárias;
    -Desenvolver a habilidade de acessar informações e interpretá-las; -Discutir Estratégias
    atuais e potenciais com futuros e outros derivativos; - Introduzir os alunos nas
    principais bolsas de interesse do agronegócio brasileira bem como mostrar os princípios
    básicos de operacionalização dos mercados.'
