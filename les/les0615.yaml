  course: '4.1. Economia/Administração. Desenvolvimento de estágio em algumas das
    áreas de pesquisa do LES, sempre sob a orientação de um professor responsável.  Estes
    trabalhos poderão ser desenvolvidos no Departamento de Economia, Administração
    e Sociologia e em empresas públicas ou privadas. 4.2. Extensão Rural. Preparação
    inicial para o estágio: natureza do estágio, instrumentos de extensão, conhecimentos
    sobre a área do estágio; Visitas semanais à região do estágio para assessorar
    produtores e suas organizações; Sessões de reflexão sobre as experiências nas
    comunidades e organizações; Compartilhamento de experiências com profissionais
    de extensão; Apresentação de seminários.

    Economics / Management. Development internship at some of the research areas of
    LES, always under the guidance of a teacher. This work can be undertaken at the
    Department of Economics, Administration and Sociology and in public or private
    companies. Extension. Initial preparation for the internship: the nature of the
    internship, extension tools, knowledge about the area of the internship; weekly
    visits to the region of the stage to assist farmers and their organizations; Sessions
    reflection on experiences in communities and organizations, sharing experiences
    with professionals extension; Presentation of seminars.'
  course_name: 'LES0615 - Estágio Supervisionado em Economia, Administração, Ciências
    Humanas e Extensão I

    Supervised internship for Economics, Management and Sociology I'
  deactivation: ''
  instructors: 2210982 - Humberto Francisco Silva Spolador
  lecture_credits: '0'
  objectives: 'Oferecer aos alunos a possibilidade de ampliar e aprofundar os conhecimentos
    adquiridos nas aulas práticas e teóricas das disciplinas do Departamento de Economia,
    Administração  e Sociologia . Para alcançar estes objetivos, pretende-se:

    1. Propiciar condições para o contato direto com técnicas de análise econômica,
    administração de empresas agroindustriais e práticas extensionistas.

    2. Criar condições para o envolvimento dos alunos em atividades de análise econômica,
    administração e extensão em empresas com fins produtivos ou em empresas públicas.

    3. Incentivar a integração interdisciplinar e interdepartamental em torno de problemas
    dos segmentos do complexo agroindustrial  (insumos, produção, processamento e
    varejo),  integrando ensino, pesquisa e extensão.

    4. Proporcionar aos alunos, por meio de processo vivencial e utilização de estratégias
    de extensão,  condições necessárias ao estudo e soluções de problemas de produtores.

    Offer to the student the possibility to increase and go deeper inside the knowledge
    gained at the practical and theoretical courses of the department of Economy,
    management and sociology. To achieve this objectives, it is intend to: 1. Give
    the conditions to have the contact with the technical of economic analyses, management
    of agribusiness companies and extensional. 2. Create conditions to involve the
    students in activities of economic analyses, management and extensional of companies
    that aims productivity or at public companies. 3. Encourage interdisciplinary
    and interdepartmental integration around problems of the segments of the agro
    industrial complex (inputs, production, processing and retailing), integrating
    teaching, research and extension. 4. Provide students through vivencial process
    and use of extension strategies, conditions for study and solution of problems
    of producers.'
  practical_credits: '4'
