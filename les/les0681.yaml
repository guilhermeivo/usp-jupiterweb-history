  course: '1. Introdução à teoria da comunicação e da informação

    2. Comunicação e cultura

    3. Comunicação e linguagem

    4. Comunicação, participação e democracia

    5. McLuhan e os meios de comunicação

    6. Comunicação no meio rural

    7. Comunicação rural e mídias

    8. Planejamento, execução e avaliação de programas, estratégias e  atividades
    de comunicação rural'
  course_name: 'LES0681 - Comunicação Rural

    Rural Communication'
  deactivation: ''
  instructors: 8478112 - Luciano Mendes
  lecture_credits: '4'
  objectives: 'Específicos:

    -  estudar e compreender os modelos teóricos de comunicação  dentro da especifidade
    do público rural, com um olhar crítico sobre o papel da comunicação no empoderamento
    da população rural.

    - apresentar e discutir os principais fatores e aspectos que envolvem os processos
    de comunicação no meio rural.

    -  analisar o papel da comunicação  no processo de desenvolvimento da agricultura
    brasileira e sua importância na difusão  dos  instrumentos de Política Públicas
    voltados ao desenvolvimento do meio rural.

    -  conhecer e praticar os métodos individuais, grupais e massais  de comunicação
    rural e difusão de inovações, buscando instrumentalizar  os alunos através de
    dinâmicas grupais, seminários, visitas,  buscando desenvolver habilidades que
    permitam melhorar seu desempenho profissional.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
