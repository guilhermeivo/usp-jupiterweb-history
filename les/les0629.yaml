  course: "Capital Social e Associativismo. Evolução social do ser humano. Gênese\
    \ do Associativismo. Teoria de Grupos. Conceito, finalidades e características\
    \ das associações. Políticas Públicas: os órgãos governamentais e suas ações.\
    \ As organizações representativas do setor rural e suas funções. Cooperativas\
    \ - origem, conceito, doutrina e princípios cooperativistas. Tipos de cooperativas.\
    \ Ramos de atividades. Contabilidade e administração das cooperativas - estruturas\
    \ de gestão, organogramas e organização.  Formas de cooperação e gestão. Diferenças\
    \ entre cooperativas e outras instituições afins. Estruturas de mercados e cooperativas.\
    \ Estrutura do cooperativismo brasileiro. Cooperativas na prática. Empresas de\
    \ capital e empresas cooperativas. Legislação cooperativista, a lei 5764, a constituição\
    \ federal de 1988 e as propostas de modernização. Participação e educação do cooperado,\
    \ comitês educativos. Controle financeiro de empresas cooperativistas. Balanços\
    \ e demonstrativos  Avaliação de eficiência econômica e social da empresa cooperativa.\
    \ Cooperativismo e organização industrial - integração vertical e horizontal,\
    \ diversificação, diferenciação e mercados. Visitas a cooperativas agropecuárias\
    \ e estudos de caso de cooperativismo.\tEconomia de empresas e estratégias de\
    \ negócios das empresas cooperativadas"
  course_name: 'LES0629 - Capital Social: associativismo e cooperativismo

    Social Capital: Co-operatives and Associations'
  deactivation: ''
  instructors: 8478112 - Luciano Mendes
  lecture_credits: '4'
  objectives: '- Discutir  conceitos chaves como capital social, cultura, modernidade
    e desenvolvimento local, fundamentais na análise dos fenômenos econômicos e sociais
    em qualquer realidade e analisar como os mesmos contribuem na construção de diferentes
    estilos de gestão do desenvolvimento, pensando na construção de diferentes atores
    sociais e de suas subjetividades, além dos aspectos gerenciais, políticos e culturais
    inerentes a cada processo.

    - Compreender os momentos sociais coletivos dos seres humanos, em especial da
    população rural, sua evolução e desdobramentos, analisando em especial  a história
    evolutiva dos movimentos associativos e cooperativos, bem como os princípios,
    formas e metas de organização e representação social do setor rural.

    - Conhecer e estudar as diversas formas de Associação e Cooperação, seus benefícios
    e restrições.

    - Analisar algumas armadilhas conceituais: movimentos sociais, cooperação, competição,
    terceiro setor e associativismo.

    - Fornecer elementos que possibilitem o entendimento dos papéis específicos  e
    da importância das organizações associativas como Associações, Condomínios, ONGs,
    OSCIPS  e cooperativas e suas relações com as políticas públicas.

    - Oferecer elementos necessários para a compreensão do que é a cooperativa, sua
    importância como o principal braço econômico dos produtores, suas estratégias
    de negócios e tendências, seus principais problemas gerenciais e administrativos
    e suas particularidades, bem como as suas vantagens comparativas.

    - Proporcionar uma visão abrangente e integrada da doutrina e teoria cooperativista,
    com vistas a uma melhor capacitação frente aos desafios futuros.

    - Desenvolver o senso crítico embasado no debate e reflexão sobre a realidade
    cooperativista, através de estudos e busca de alternativas para solução dos problemas
    encontrados com relação ao trabalho em cooperativas'
  practical_credits: '0'
  total_workload: 60 h
