  course: '1.O pensamento econômico no século XX e a dicotomia Estado x mercado; a
    definição dos principais paradigmas: liberalismo, intervencionismo e socialismo
    como respostas às questões econômicas contemporâneas: crescimento x desenvolvimento,
    emprego, distribuição de renda, inflação, sustentabilidade socioambiental. 2.
    O pensamento econômico latino americano: o estruturalismo a referência na Cepal.
    3. A crítica a concorrência perfeita e o surgimento da nova microeconomia. 4.
    Shumpeter a teoria dos ciclos e da inovação. 5. Economia do Meio Ambiente/ Economia
    ecológica/Economia Circular. 6. Institucionalismo e economia comportamental.'
  course_name: 'LES0203 - História do Pensamento Econômico

    History of Economic Thought'
  deactivation: ''
  instructors: 643773 - Eliana Tadeu Terci
  lecture_credits: '4'
  objectives: 'O objetivo da disciplina é apresentar as principais paradigmas explicativos
    e os debates sobre as questões econômicas contemporâneas: crescimento x desenvolvimento,
    emprego, distribuição de renda, inflação, sustentabilidade socioambiental. Pretende-se
    que o aluno entenda como estes expoentes do pensamento econômico explicam sob
    diferentes abordagens metodológicas o funcionamento das economias capitalistas
    (países desenvolvidos e subdesenvolvidos) e consequentemente sugerem soluções
    diferenciadas de atuação dos agentes econômicos públicos e privados.'
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
