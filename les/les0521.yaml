  course: '1. Conceitos sócio-antropológicos de referência: socialização e cultura.
    2. A evolução do processo alimentar: os primórdios da alimentação e as histórias
    naturais, material e técnica, econômica, social e cultural. 3. Alimentação e relações
    sociais; a) gênero, comida e afeto; b) os rituais na alimentação; comensalidade
    e gastronomia. 4. Hábitos e concepções alimentares. a) a vaca sagrada na Índia;
    b) as restrições à carne de porco; c) tradições  alimentares relativas ás características
    dos alimentos e às condições ambientais. 5. A alimentação no Brasil: a) as origens
    da cozinha brasileira; b) alimentação nos meios rural e urbano; c) o atual padrão
    alimentar brasileiro. 6. O impacto do sistema ciência-tecnologia no consumo de
    alimentos. a) produção de alimentos, tecnologia e ambiente; b) homogeneização
    e/ou diversificação dos hábitos alimentares na globalização; c) Permanências e
    transformações da alimentação contemporânea; d) Riscos alimentares 7) Segurança
    e soberania alimentar: a) concepções concorrentes sobre o abastecimento alimentar
    e o combate contra a fome; b) ações públicas fundadas em segurança e/ou  soberania
    alimentar; c) o papel da agricultura familiar para a alimentação  8) Novos paradigmas
    da alimentação. Em defesa da comida. O movimento Slow Food. Iniciativas em favor
    de circuitos curtos para o acesso ao alimento; O ativismo alimentar pelo locavorismo.'
  course_name: 'LES0521 - Socioantropologia da Alimentação

    Anthropology of Food'
  deactivation: ''
  instructors: 1261309 - Paulo Eduardo Moruzzi Marques
  lecture_credits: '4'
  objectives: 'Fornecer aos alunos subsídios para: identificar os componentes sociais
    e culturais da alimentação; entender a evolução do processo alimentar e dos hábitos
    alimentares de diferentes sociedades e grupos; avaliar os condicionantes do acesso
    aos alimentos e os impactos do sistema ciência-tecnologia, característico da sociedade
    ocidental, no consumo de alimentos; discutir  novas alternativas para os sistemas
    alimentares.'
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
