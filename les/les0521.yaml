  course: '1. Conceitos sócio-antropológicos de referência: socialização e cultura.
    2. A evolução do processo alimentar: os primórdios da alimentação e as histórias
    naturais, material e técnica, econômica, social e cultural. 3. Alimentação e relações
    sociais; a) gênero, comida e afeto; b) os rituais na alimentação; comensalidade
    e gastronomia. 4. Hábitos e ideologias alimentares. a) a vaca sagrada na Índia;
    b) as restrições à carne de porco; c) ideologias alimentares relativas ás características
    dos alimentos e às condições ambientais. 5. A alimentação no Brasil: a)as origens
    da cozinha brasileira; b)alimentação nos meios rural e urbano; c) o atual padrão
    alimentar brasileiro. 6. O impacto do sistema ciência-tecnologia no consumo de
    alimentos. a) produção de alimentos, tecnologia e ambiente; b) homogeneização
    e/ou diversificação dos hábitos alimentares na globalização; c) Permanências e
    transformações da alimentação contemporânea; d) Riscos alimentares.7) Novos paradigmas
    da alimentação. Em defesa da comida. O movimento Slow Food. Comfort food.'
  course_name: 'LES0521 - Antropologia da Alimentação

    Anthropology of Food'
  deactivation: ''
  instructors: 70170 - Maria Elisa de Paula Eduardo Garavello
  lecture_credits: '4'
  objectives: 'Fornecer aos alunos subsídios para: identificar os componentes sociais
    e culturais da alimentação; entender a evolução do processo alimentar e as ideologias
    e hábitos alimentares de diferentes sociedades e grupos; avaliar os condicionantes
    do acesso aos alimentos e os impactos do sistema ciência-tecnologia, característico
    da sociedade ocidental, no consumo de alimentos; buscar novas alternativas para
    os sistemas alimentares.'
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
