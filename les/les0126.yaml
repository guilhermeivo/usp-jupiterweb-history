  course: '1. INTRODUÇÃO:  Sistema de números. Módulo ou Valor Absoluto. Desigualdade
    Triangular. Álgebra de Números. Intervalos. 2. FUNÇÕES E SEUS GRÁFICOS: Funções
    reais de uma variável. Funções Lineares. Tipos de Função. 3. LIMITE E CONTINUIDADE:
    A Derivada e a Inclinação de uma Curva. Conceito de Limite. Teoremas dos Limites.
    Continuidade e Diferenciabilidade de uma Função.  4. DERIVAÇÃO E DIFERENCIAÇÃO:
    Taxa de mudança e derivada. Regras Básicas de Diferenciação. 5. APLICAÇÃO DE DERIVADAS.
    Introdução. Incrementos, Diferenciais e Ap. Linear. Funções Crescentes e Decrescentes.
    Teste da Derivada Primeira. Traçado de Curvas.Derivadas de Ordem Superior e Concavidade.
    6. INTEGRAL: Introdução. Antiderivadas e o Problema do Valor Inicial. Cálculos
    Elementares de Áreas. Cálculo de Integrais. Valores Médios e o Teorema Fundamental
    do Cálculo. Integração por Substituição. Áreas de Regiões Planas. 7. FUNÇÕES EXPONENCIAIS
    E LOGARÍTMICAS: Definição . Logaritmo Natural. Função Exponencial. Generalização.
    8. Exercícios práticos utilizando computadores (gráficos, conjuntos, operações
    de funções lógicas, derivadas, integrais).'
  course_name: 'LES0126 - Matemática Aplicada I

