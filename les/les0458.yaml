courses:
  activation: 01/01/2023
  assessment: Os alunos com média >3 e <5, estarão aptos a fazer a prova de recuperação,
    conforme calendário oficial da USP e devem obter nota final maior ou igual a 5,
    sendo esta a média simples entre a nota da prova de recuperação e a média final
    alcançada antes desta.
  bibliography: 'Literatura Básica:

    NICHOLSON, W; SNYDER, C. Microeconomic Theory: Basic Principles and Extensions.
    11th Edition (International Edition), 2012.

    VARIAN, H. Intermediate Microeconomics: A Modern Approach. 8th Edition, 2010.

    Literatura Complementar:

    PINDYCK, R.S. e D.L. RUBINFELD.  Microeconomia.  São Paulo; Pearson Education
    do Brasil, 8ª edição, 2013.

    FIANI, R. Teoria dos Jogos. 6ª Edição, 2009.

    BESANKO, D; BRAEUTIGAM, R. Microeconomics. 4th Edition, 2011.

    CHIANG, A. C; WAINWRIGHT, K. Matemática para Economistas.'
  course: '1) Modelo competitivo de Equilíbrio Parcial de mercados – curto prazo,
    longo prazo, bem-estar;

    2) Modelo competitivo de Equilíbrio Geral de mercados – produção, trocas puras,
    função de bem-estar social;

    3) Monopólio, Monopsônio, Discriminação de preços, Mercado de Concorrência Monopolística,
    Mercado de fatores de produção;

    4) Teoria dos Jogos e Estratégia Competitiva: Oligopólio, Oligopsônio, Coalisão.

    5) Risco, Incerteza e Assimetria de Informação;

    6) Externalidades e bens públicos.'
  course_name: 'LES0458 - Teoria Microeconômica II

    Microeconomic Theory II'
  deactivation: ''
  instructors: 1906631 - Silvia Helena Galvao de Miranda
  lecture_credits: '4'
  objectives: 1) Desenvolver a análise de determinação de preços e quantidades em
    mercados de concorrência imperfeita. 2) Mostrar a determinação de preços de fatores
    de produção e de bens finais dentro de um sistema de equilíbrio geral em concorrência
    perfeita.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
