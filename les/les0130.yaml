  course: '1)problemas de história da ciência: Conhecimento mítico X conhecimento
    racional; A ciência da Antiguidade; a contribuição da Renascença; a Revolução
    Científica do século XVII: fundação da ciência moderna; O problema da objetividade
    e do rigor científico: conhecimento seguro, correto, verdadeiro, neutro, universal;
    Relação conhecimento/realidade; O problema do século XX; O problema da objetividade
    em ciências sociais; Outras formas de conhecimento: senso comum, etc. 2) Problemas
    de metodologia da ciência: O objetivo de pesquisa científica; O problema de investigação;
    As hipóteses de pesquisa; Leis e teorias; Noções e conceitos; O problema da experimentação
    e do teste de hipóteses 3) A elaboração de um projeto de pesquisa: Escolha do
    tema, delimitação do objeto, formulação do problema e hipóteses; Revisão bibliográfica;
    Coleta e interpretação de dados; Diferenças entre pesquisa de campo, pesquisa
    de laboratório e pesquisa bibliográfica; redação de textos científicos; Normas
    de citação.'
  course_name: 'LES0130 - Problemas de História e Metodologia da Ciência

    Issues of Science History and Methodology'
  deactivation: ''
  instructors: 5594340 - Adalmir Leonidio
  lecture_credits: '2'
  objectives: 'Pretende-se levar o aluno a:

    1. Compreender e explicar o que é ciência, metodologia de pesquisa e pesquisa
    científica

    2. Analisar e discutir a metodologia e suas diversas etapas

    2. Elaborar e apresentar um trabalho de iniciação científica'
