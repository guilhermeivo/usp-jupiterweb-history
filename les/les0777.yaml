    GIL, Antonio Carlos. 2008. Métodos e Técnicas de Pesquisa Social. São Paulo, Atlas

    _____________. 1998. Como Elaborar Projetos de Pesquisa. São Paulo, Atlas.

    GOOD, William J.; HATT, Paul K. Métodos em pesquisa social. 7ª ed. São Paulo:
    Nacional, 979.

    MARCONI, Marina de Andrade; LAKATOS, Eva Maria. 2000. Metodologia Científica.
