    Adicionalmente à bibliografia supracitada, o estudante deverá, juntamente com
    seu orientador, buscar bibliografia específica sobre o tema de sua pesquisa.'
  course: Definição do tema do TCC - definição das questões a serem estudadas- delimitação
    dos objetivos- definição das hipóteses; 2. Seleção da bibliografia a ser revisada
    - métodos de busca bibliográfica - técnicas de resumo de textos - como elaborar
    uma revisão bibliográfica; 3. Definição do arcabouço teórico, analítico e/ou conceitual
    bem como da metodologia a serem utilizados - A definição do arcabouço teórico/analítico/conceitual
    - A definição da metodologia - Interligações entre arcabouços teórico/analítico/conceitual
    e metodologia - Fontes de dados.
