  course: 1) Modelos interpretativos da colonização brasileira; 2) Introdução ao problema
    da colonização brasileira; 3) Elementos estruturais do Brasil colonial; 4) O processo
    de trabalho na colônia; 5) A economia açucareira; 6) A questão do mercado interno
    na colônia; 7) A crise do Antigo Sistema Colonial; 8) Introdução ao estudo da
    economia cafeeira; 9) Sistema político no Império; 10) A transição do regime de
    trabalho escravo para o livre; 11) A industrialização na Primeira República; 12)
    Coronelismo; 13) Política oligárquica; 14) A crise da agroexportação e a Revolução
    de 1930.
  course_name: 'LES1201 - Formação Econômica, Social e Política do Brasil I

