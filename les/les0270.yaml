  course: '1. Metodologia da Economia e as Escolas de Pensamento: ciência x ideologia.
    2 - Pensamento econômico na Antiguidade e na Idade Média. 3 -Pensamento Econômico
    no limiar do capitalismo: mercantilismo e fisiocracia. 4. O nascimento da Economia
    Política: a) Adam Smith e a teoria da riqueza das nações; b) David Ricardo a teoria
    do valor trabalho; renda da terra e o a lei das vantagens comparativas do comércio
    exterior; c) Malthus e a  teoria da população. 5 - Karl Marx, a crítica da Economia
    Política; teoria da mais valia e a lei geral da acumulação capitalista. 6 - O
    surgimento da análise marginal e da teoria subjetiva do valor em resposta aos
    clássicos. a) Jevons e o valor utilidade; b) Walras e a teoria do equilíbrio geral;
    b) Marshall e a síntese neoclássica; c) Wilfredo Pareto e a redefinição dos conceitos
    de utilidade e bem-estar.'
  course_name: 'LES0270 - Economia Política

    Political Economics'
  deactivation: ''
  instructors: 643773 - Eliana Tadeu Terci
  lecture_credits: '4'
  objectives: 'O objetivo da disciplina é apresentar as ideias econômicas dos principais
    expoentes da denominada economia clássica: Adam Smith, D. Ricardo, Malthus e K.
    Marx; bem como a denominada síntese neoclássica realizada pela Escola Marginalista.
    Busca-se compreender o nascimento e desenvolvimento da economia como ciência entre
    os séculos XVIII e XIX e a delimitação do seu objeto: a busca do método para compreender
    o processo de produção, distribuição e consumo da riqueza social.'
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
