  course: 1-Introdução ao debate sobre a democracia e a questão agrária. 2. História
    da ocupação do território brasileiro. 3. Do conflito agrário à questão agrária.
    4. O Estatuto da Terra e a evolução da legislação agrária. 5. O movimento social
    pela terra. 6. A reforma agrária desde a transição democrática aos dias de hoje.
    7. Os assentamentos rurais em questão.
  course_name: 'LES1450 - Democracia e Questão Agrária

    Democracy and agrarian question'
  deactivation: ''
  instructors: 1261309 - Paulo Eduardo Moruzzi Marques
  lecture_credits: '4'
  objectives: 'Novo conteúdo: A questão agrária persiste como fundamental para a reflexão
    sobre a democracia brasileira. A desigualdade social brasileira se associa profundamente
    com a estrutura fundiária concentrada do país. Assim, o objetivo da disciplina
    consiste em iluminar os principais aspectos em torno deste problema, passando
    pela história da ocupação do território brasileiro, a transformação da questão
    agrária para o âmbito político, as iniciativas públicas para enfrentar o problema,
    o movimento social pela demanda de terra e o debate recente sobre o papel da reforma
    agrária. Por outro lado, a disciplina se voltará com uma especial atenção aos
    desafios em torno da implantação dos assentamentos rurais. Os temas aqui considerados
    serão principalmente o processo de organização dos assentados, os modelos produtivos
    adotados, os impactos regionais dos assentamentos e as mudanças ocorridas em diferentes
    esferas da vida dos assentados.'
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
