  course: '1. O Estudo científico e o lugar da antropologia. 2. O panorama histórico
    da antropologia. 3. Concepção teórica da antropologia. 4. Evolucionismo cultural.
    5. A mudança nos fundamentos da antropologia. 6. A Escola Americana de Antropologia.
    7. A Escola Inglesa de Antropologia. 8. A Escola Francesa de Antropologia. 9.
    O método antropológico. 10. Epistemologias antropológicas. 11. Rituais e Ritos.
    12. Mitos. 13. Tendências recentes nos estudos antropológicos. 14. Antropologia
    e Organizações. 15. Cultura nacional e cultura brasileira. 16. Cultura organizacional.
    17. A antropologia das Organizações: possibilidades e compreensões sobre as organizações.'
  course_name: 'LES0284 - Antropologia das Organizações

    Anthropology of organizations'
  deactivation: ''
  instructors: 8478112 - Luciano Mendes
  lecture_credits: '4'
  objectives: As relações entre a cultura, organizações e sociedade, constituem o
    foco temático das reflexões desta disciplina, cujas referências se encontram nos
    conceitos e debates da Antropologia. De maneira privilegiada, os temas em pauta
    serão tratados no âmbito das modernas sociedades ocidentais, procurando familiarizar
    os estudantes com as contribuições da antropologia para o debate e a reflexão
    densa e crítica sobre as organizações, suas culturas e suas formas de interação
    e integração à sociedade.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
