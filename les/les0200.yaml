  lecture_credits: '4'
  objectives: 'Definir conceitos necessários para o desenvolvimento de um contexto
    teórico de análise macroeconômica.

    Apresentar métodos de medidas macroeconômicas gerais que resumem a atividade econômica,
    bem como detalhar as formas empregadas para o levantamento e sistematização de
    dados agregados, enfatizando os procedimentos empregados para a economia brasileira.'
