  course: '1. Medidas da Atividade Econômica (produto, renda, consumo, poupança, investimento,
    gastos do governo, exportações e importações)e as relações básicas que definem
    a estrutura de contas nacionais; 1.1. Conceitos de medidas especiais e resumidas
    da Atividade Econômica (produto, renda, consumo, poupança, investimento, gastos
    do governo, exportações e importações); 1.2. Relações básicas para a definição
    da estrutura das Contas Nacionais; 1.3. Definição do Produto Interno Bruto e conceitos
    relacionados; 1.4. Caracterização e importância da agroindústria no PIB brasileiro.
    2. Sistema de Contas Nacionais, Produto Interno Bruto, Dívida Pública Interna
    e Externa; 2.1. Detalhamento relacionado a cada um desses agregados macroeconômicos
    em termos de: estrutura, procedimento empregado no levantamento e apresentação
    sistemática da estatísticas, relações com o contexto institucional e estrutura
    administrativa do governo brasileiro. 3. Mercados Financeiros: estrutura e mecanismos
    básicos de funcionamento; 3.1. Sistema Monetário e a Oferta de Moeda. 3.2. Principais
    Métodos de Controle Monetário; 3.3. Sistema Financeiro Brasileiro. 4. Finanças
    Públicas: conceitos e medidas; 4.1. Receitas e Despesas do Tesouro Nacional. 4.2.
    Estrutura Fiscal; 4.3. Déficit Público: diferentes formas de mensuração. 4.4.
    Contas Públicas: detalhamento de usos e fontes. 5. Balanço de Pagamentos e Indicadores
    da Economia Internacional; 5.1. Definição da Estrutura e Contabilidade do Balanço
    de Pagamentos; 5.2. Indicadores da Economia Internacional; 5.2.1. Taxas de câmbio;
    5.2.2. Taxas de juros em diversas moedas; 5.2.3. Reservas internacionais. 6. Matriz
    Insumo-Produto: conceitos básicos.'
  course_name: 'LES0200 - Contabilidade Social

    Social Accoutability'
  deactivation: ''
