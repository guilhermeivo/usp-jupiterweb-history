  instructors: 1968008 - Roberto Arruda de Souza Lima
  lecture_credits: '2'
  objectives: Capacitar quanto aos princípios e às técnicas de matemática financeira
    e sua utilização em finanças, análise de investimentos e engenharia econômica,
    conceitos e aplicações de crédito rural.
