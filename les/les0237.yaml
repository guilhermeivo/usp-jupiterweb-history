  course: "1. O Homem, ser social e cultural: uma abordagem a partir da história dos\
    \ debates e do desenvolvimento dos domínios do conhecimento científico voltados\
    \ para o estudo da sociedade e da cultura, a sociologia e a antropologia. 2. A\
    \ civilização ocidental: considerações sobre o \x93processo civilizador\x94. 3.\
    \ Fundamentos para o estudo da cultura e da ideologia: debates e controvérsias\
    \ em torno dos conceitos de cultura e ideologia. 4. Globalização, mercados, cultura\
    \ e ambiente: reflexões sobre o fenômeno da globalização; a propagação das economias\
    \ de mercado; resistências culturais; a questão ambiental e seu caráter global.\
    \ 5. Ambiente e sociedade, paradigmas do conhecimento: ciências e capitalismo\
    \ diante das questões ambientais; transições paradigmáticas e o lugar da interdisciplinaridade."
  course_name: 'LES0237 - Sociedade, Cultura e Natureza

    Society, Culture and Nature'
  deactivation: ''
  instructors: 1261309 - Paulo Eduardo Moruzzi Marques
  lecture_credits: '4'
  objectives: As relações entre a sociedade, cultura e natureza constituem o foco
    temático das reflexões desta disciplina, cujas referências se encontram nos conceitos
    e debates da Sociologia e da Antropologia. De maneira privilegiada, os temas em
    pauta serão tratados no âmbito das modernas sociedades ocidentais, procurando
    familiarizar os estudantes com as contribuições das ciências sociais para o debate
    e a reflexão densa e crítica sobre questões contemporâneas, como aquelas em torno
    da degradação ambiental, da globalização, da desigualdade social ou do lugar da
    mídia no cotidiano humano.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
