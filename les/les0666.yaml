  course: 'Questões sobre o desenvolvimento econômico. Modelos de crescimento econômico
    que consideram um setor. Modelos de crescimento com tecnologia endógena e retornos
    crescentes. Modelos de convergência. Diferenças de renda per capita: causas fundamentais.
    Instituições e desenvolvimento econômico. Determinantes do Crescimento Econômico
    numa Economia Globalizada. A Economia das Idéias.  Análise de Políticas Econômicas.'
  course_name: 'LES0666 - Crescimento e Desenvolvimento Econômico

    Social and  Economic Development'
  deactivation: ''
  instructors: 2210982 - Humberto Francisco Silva Spolador
  lecture_credits: '4'
  objectives: Neste curso serão analisados os principais modelos teóricos de crescimento
    econômico, e as questões mais recentes sobre o desenvolvimento econômico, como
    conceitos e medidas, e questões relacionadas aos temas saúde, nutrição e educação.
    Também serão discutidos os efeitos da política econômica sobre as taxas de crescimento
    dos países, com atenção especial para o caso brasileiro.  O objetivo da disciplina
    é apresentar, e discutir, os conceitos teóricos mais modernos, de modo que o aluno
    adquira um conhecimento básico que lhe permita acompanhar os debates e pesquisas
    recentes na área de crescimento e desenvolvimento econômico.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
