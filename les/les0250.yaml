  course: "1. Introdução; Conceito de Contabilidade; Evolução histórica da Contabilidade;\
    \ Evolução histórica da Contabilidade no Brasil; Áreas da Contabilidade 2. Principais\
    \ Informações geradas pela Contabilidade Financeira; 2.1 Introdução; 2.2 O BP;\
    \ 2.2.1 Componentes; 2.2.2 Equação fundamental; 2.2.3 Representação gráfica; 2.2.4\
    \ Formação de um patrimônio empresarial; 2.2.5 Origens e aplicações de recursos;\
    \ 2.2.6 Situações patrimoniais; 2.2.7 Grupos de contas BP; Grupos do Ativo; Grupos\
    \ do Passivo; 2.2.8 Análise do Balanço Patrimonial; -Índices de liquidez (ILC,\
    \ ILS, ILI e ILG); -Índices de endividamento (TCT e CE); -Análise horizontal,\
    \ -Análise vertical, - Depreciação de bens de capital, -Métodos de depreciação,\
    \ -Custos de Produção, 2.3 A DRE, 2.3.1 Alguns conceitos básicos, 2.3.2 Regimes\
    \ de contabilidade e a DRE, 2.3.3 Componentes da DRE, 2.3.4 Resultados da DRE,\
    \ 2.3.5 Outros tipos de Despesas e Receitas, 2.3.6 A independência dos períodos\
    \ contábeis, 2.3.7 Análise da DRE, Indicadores de rentabilidade (TRCT, TRCP, GA\
    \ e Margens de lucro), Análise da TRCT por meio do GA e da MLV, Outra maneira\
    \ de se obter a TRCT, Análise vertical e horizontal da DRE, 2.4 A DLPAc, 2.5 A\
    \ Demonstração do Fluxo de Caixa, 3. Outros componentes Importantes do Sistema\
    \ Contábil, 4. O Ativo Circulante (AC), 4.1 Estoques (Valorização dos estoques),\
    \ 4.1.1 Apuração direta do CPV, 4.1.2 Apuração Indireta do CPV \x96 Inventário\
    \ Periódico, 4.1.3 Apuração de Custos para atividades de produção com mais de\
    \ um produto, Sucatas, Subprodutos, Co-produtos, Critérios de atribuição de custos\
    \ a co-produtos. 4.1.4 Despesas 5. O ativo não Circulante, 5.1 Imobilizado Fixo,\
    \ 5.2 Imobilizado em Andamento, 5.3 Diferido, 5.4 Investimentos, 6. O Passivo,\
    \ 6.1 Passivo Circulante, 6.2 Passivo não Circulante, 6.3 Patrimônio Líquido.\
    \ 7 Contabilidade Ambiental. 7.1 Ativos ambientais 7.2 Passivos ambientais 7.3\
    \ Balanços ambientais; 8. Normas e diretrizes nacionais e internacionais 9. Evidenciação\
    \ de informações ambientais 10. Auditoria ambiental. 11. Gestão de Passivos Ambientais."
