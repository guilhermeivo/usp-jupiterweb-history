  course_name: 'LES0580 - Economia das Organizações

    Economics of Organizations'
  deactivation: ''
  instructors: 1225121 - Margarete Boteon
  lecture_credits: '4'
  objectives: 'O curso introduz o aluno à análise econômica das organizações e instituições
    sob a ótica da Nova Economia Institucional e faz um contraste com a tradicional
    teoria da Organização Industrial. No caso da Economia das Organizações, o objetivo
    é familiarizar os alunos com esta abordagem teórica através da leitura e análise
    de papers clássicos no assunto. As principais teorias abordadas serão: natureza
    da firma e custo social (abordagem de Coase), custos de transação, especificidade
    dos ativos, risco moral, teoria do agente/principal, direto de propriedade e ações
    coletivas. O objetivo final é proporcionar discussão, reflexão e ativo envolvimento
    dos alunos em teorias e pesquisas que tratam do comportamento e das relações entre
    os agentes, indivíduos e organizações empresariais e governamentais, e a sua interação
    com o ambiente econômico e instituições. A Organização Industrial tem um foco
    no ambiente competitivo através da análise da estrutura, conduta e desempenho
    dos setores econômicos.'
  practical_credits: '0'
  total_workload: 60 h
