  course: 'Bases históricas para a evolução das teorias administrativas; Escolas de
    Administração: -Escola Clássica - Escola das Relações Humanas - Escola Burocrática;
    A Abordagem comportamental da administração; A abordagem sistêmica da administração;
    A abordagem contingencial; As funções administrativas: Planejamento - Níveis de
    planejamento: Planejamento estratégico tático e operacional - Planejamento estratégico-
    Análise de decisão; Organização: - A função de organização - Estrutura legal da
    empresa - Modelos de estrutura organizacional; Direção:- Autoridade e poder satisfação,
    motivação, comunicação e cultura - Princípios gerais de Administração aplicados
    à Direção; Controle:- Controle como uma função administração - As fases do controle
    -Técnicas de controle. Novos paradigmas em administração.'
