  course_name: 'LES0352 - Pesquisa Operacional I

    Operational Research I'
  deactivation: ''
  instructors: '5863920 - Catarina Barbosa Careta

    59145 - Jose Vicente Caixeta Filho'
  lecture_credits: '4'
  objectives: a) Apresentar os principais conceitos de pesquisa operacional; b) Capacitar
    o aluno para formular e estruturar modelos matemáticos de programação linear visando
    a análise de diversos problemas empresariais; c) Preparar o aluno para o uso de
    diferentes estratégias e ferramentas adotadas na resolução de problemas de programação
    linear; d) Habilitar o aluno para avaliar e interpretar os resultados dos modelos
    estruturados, identificando as informações necessárias para fundamentar decisões
    no ambiente empresarial.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
