courses:
  activation: 01/01/2023
  assessment: Uma prova com toda a matéria lecionada. Estará apto a efetuar a prova
    de recuperação o aluno que tiver como média final na disciplina uma nota igual
    ou superior a três (3,0) e inferior a cinco (5,0), e tiver, no mínimo, 70% (setenta
    por cento) de frequência às aulas. O cálculo de uma média aritmética simples será
    feito com a nota da prova de recuperação e a média final obtida pelo aluno na
    disciplina. Se esta média resultar em nota igual ou superior a cinco (5,0), o
    aluno será aprovado.
  bibliography: 'Literatura Básica:

    CAIXETA FILHO, J.V. Pesquisa Operacional: Técnicas de otimização aplicadas a Sistemas
    Agroindustriais. 2ª ed. São Paulo: Atlas: 2004. HILLIER, F. S.; LIEBERMAN, G.
    J. Introdução à pesquisa operacional. Porto Alegre: Bookman, 2013. MOREIRA, D.
    A. Pesquisa operacional: curso introdutório. São Paulo: Cengage, 2011.

    Literatura Complementar:

    BELFIORE, P.; FÁVERO, L. P. Pesquisa operacional: para cursos de administração,
    contabilidade e economia. Rio de Janeiro: Elsevier-Campus, 2012. LACHTERMACHER,
    G. Pesquisa operacional na tomada de decisões. São Paulo: Pearson, 2009. SILVA,
    E. M.; SILVA, E. M.; GONÇALVES, V.; MUROLO, A. F. Pesquisa operacional para os
    cursos de administração e engenharia. São Paulo: Atlas, 2010. RAGSDALE, C. T.
    Modelagem e análise de decisão. São Paulo: Cengage Learning, 2009. TAHA, H. A.
    Pesquisa operacional. São Paulo: Pearson, 2008.'
  course: '; Histórico da Programação Matemática

    ; Resolução de Sistemas de Equações Lineares

    ; Resolução por Programação Linear pelo Método Gráfico

    ; Software para Programação Linear

    ; Método Simplex

    ; Casos Especiais de Programação Linear

    ; Dualidade e Análise de Sensibilidade

    ; Problemas de Transporte e Designação

