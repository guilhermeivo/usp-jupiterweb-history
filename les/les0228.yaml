  course: "I - Ética: introdução, conceitos e fundamentos. Ética, juízo, moral e valores.\
    \ II \x96 Doutrinas éticas fundamentais. Ética grega. Ética cristã medieval. Ética\
    \ moderna. Ética contemporânea. Ética Aplicada no campo pessoal, profissional\
    \ e empresarial. III \x96 As instituições políticas e o mundo dos negócios; IV\
    \ \x96 As dimensões políticas, éticas e sociais nas decisões de políticas públicas\
    \ e dos agentes administrativos. V \x96 Política e ética e as questões jurídicas."
  course_name: 'LES0228 - Ética e Política

    Ethics and Politics'
  deactivation: ''
  instructors: 8819776 - Andres Felipe Thiago Selingardi Guardia
  lecture_credits: '2'
  objectives: "1.\tIntroduzir e trabalhar conceitos sobre ética, moral e valores.\n\
    2.\tConhecer e compreender os fundamentos das principais doutrinas éticas da história\
    \ da humanidade.\n3.\tDesenvolver reflexões sobre ética, pós-modernidade e contemporaneidade.\n\
    4.\tTrabalhar estudos de caso e de ética aplicada no campo pessoal, profissional\
    \ e empresarial.\n5.\tLevar o aluno a perceber e identificar os fundamentos e\
    \ princípios éticos que orientam as ações e tomadas de decisão.\n6.\tA relação\
    \ ética, política e instituições no Brasil e seus efeitos sobre os negócios."
