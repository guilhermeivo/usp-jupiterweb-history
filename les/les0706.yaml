  course: Introdução Gestão dos Negócios Agroalimentares. Planejamento, programação
    e controle para produção. Noções de controle financeiro da produção. Sistemas
    de organizacionais. Conceitos de planejamento, programação e controle da produção.
    Conceitos básicos de estoques. Modelos de planejamento agregado da produção. Cálculo
    de necessidades (MRP) e otimização do sistema produtivo. Seqüenciamento Kanban/Just-in-time.
    Gestão de Qualidade. Projeção (média corrida e suavização exponencial) da demanda.Avaliação
    de modelos de previsão e conceitos de planos estratégicos de negócios.
  course_name: 'LES0706 - Administração e Controle da Produção

    Management and production control'
  deactivation: ''
  instructors: 1225121 - Margarete Boteon
  lecture_credits: '4'
  objectives: Capacitar o aluno para uma visão geral do sistema produtivo e operacional
    na produção de bens e serviços. Os conceitos de administração e controle e projeção
    da produção auxiliarão nas decisões estratégicas em diferentes setores do sistema
    produtivo. A avaliação e análise com diferentes indicadores econômicos, instrumentos
    de gestão de qualidade e capacidade de produção despertará a atenção para um processo
    eficiente em produtividade e qualidade com viabilidade econômica.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
