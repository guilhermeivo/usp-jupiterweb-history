  course: 'Conceitos fundamentais sobre tecnologia e sistemas de informação. Economia
    da informação e o uso estratégico de tecnologia e sistemas de informação. Infraestrutura
    de TI: hardware, software, banco de dados, telecomunicações e redes. Programação
    de SI: lógica e estrutura de dados. Conceitos para construção de sites. Sistemas
    de informação para gestão e apoio à decisão. Comércio eletrônico. Gestão de serviços
    de TI. Governança em TI. Ética e segurança.'
  course_name: 'LES0700 - Tecnologia e Sistemas de Informação

    Information Systems and Technology'
  deactivation: ''
  instructors: 5863920 - Catarina Barbosa Careta
  lecture_credits: '4'
  objectives: Desenvolver conceitos e aplicações associadas à implementação e administração
    de sistemas de informação e de suas tecnologias, no contexto da administração
    de organizações e pessoas. Serão abordados aspectos relacionados a software, hardware
    e recursos humanos, dentro de uma perspectiva gerencial. Além disso, o curso irá
    abordar tópicos como redes, internet, computação nas nuvens, comércio eletrônico,
    governança, ética, segurança e o uso inteligente da tecnologia da informação na
    gestão de negócios das organizações.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
