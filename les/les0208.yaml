  course: Conceitos Básicos e Visão Sistêmica do Marketing. Sistema de Informação
    e Pesquisa de Marketing. Mensuração e Previsão da Demanda. Análise de Mercados
    Consumidores. Segmentação de Mercado. Diferenciação e Posicionamento da Marca.
    Produtos e Serviços. Preços. Canais de Marketing. Comunicação Integrada de Marketing.
    Comunicação de Massa. Comunicação Pessoal. Marketing Global.
  course_name: 'LES0208 - Marketing I

    Marketing I'
  deactivation: ''
  instructors: 168175 - Eduardo Eugenio Spers
  lecture_credits: '4'
  objectives: Caracterização do conceito e do papel do marketing nas organizações
    e na sociedade. Apresentar o as funções estratégicas e táticas do marketing. Fornecer
    uma base para o processo de análise do mercado e do ambiente de marketing. Capacitar
    o aluno na elaboração e na avaliação de um plano de marketing .Propiciar ao aluno
    uma visão crítica e ética sobre os desafios atuais do marketing.
