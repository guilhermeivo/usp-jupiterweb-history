  course: '1. Definição e Importância da Agropecuária e do Agronegócio na Economia
    brasileira. 1.1 Distinção entre agropecuária e agronegócio. 1.2. Participação
    da agropecuária e do agronegócio no PIB brasileiro. 2. O papel da agropecuária
    no Desenvolvimento Econômico. 2.1 Funções clássicas da agropecuária no processo
    de desenvolvimento econômico. 2.2 A interação entre agropecuária e o processo
    de industrialização. 3. Instrumentos de Política Econômica que afetam a agropecuária.
    3.1 A Política Fiscal. 3.2 A Política Monetária. 3.3 A Política Cambial. 3.4 A
    Política de Rendas. 3.5 A Política Comercial 3.6 Política de Crédito Rural. 3.7
    A Política de Preços Mínimos. 3.8 A Política de Pesquisa e Extensão Rural. 3.9
    Políticas específicas para alguns produtos (café, açúcar e trigo) e insumos (fertilizantes
    e equipamentos). 3.10 Política de uso de recursos florestais. 4. A cafeicultura
    e os primórdios da evolução industrial no Brasil. 5. Evolução da agropecuária
    no período de 1930 a 1945: crise da cafeicultura e diversificação da pauta agrícola.
    6. A agropecuária brasileira no período de 1946 a 1964: crescimento apesar da
    discriminação. 7. A agropecuária brasileira no período de 1965 a 1986: aceleração
    do processo de modernização. 8. A agropecuária brasileira no período de 1987 a
    2014: crescimento sem subsídio. 9. Evolução da estrutura agrária brasileira. 10.
    Perspectivas para os próximos anos.'
  course_name: 'LES0310 - Economia e Política Agrícola

    Economics and Agricultural Policy'
  deactivation: ''
  instructors: 2715154 - Carlos Jose Caetano Bacha
  lecture_credits: '4'
  objectives: Analisar a evolução do setor agrícola na economia brasileira, destacando
    o papel essencial que este setor teve no passado e sua atual interligação com
    os demais setores econômicos que constituem a economia. Analisar o funcionamento
    passado e atual dos instrumentos de política econômica que afetam o setor agrícola.
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
