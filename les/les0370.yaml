  course: Atividade empreendedora. O perfil empreendedor. Aprimorando o próprio desempenho
    pró-ativo. Identificando oportunidades. Transformação da oportunidade em conceitos.
    Avaliação do potencial do lucro e do crescimento. Dinâmica dos negócios. Escolha
    da estratégia competitiva. Implementação de negócios. Pré-requisitos necessários
    para o início de um empreendimento. Análise financeira do novo empreendimento.
    Preparação do plano de negócios para a viabilização do empreendimento. A prática
    da inovação. Empreendimento sistemático. Inovação deliberada e suas várias fontes.
    Administração empreendedora. A nova empresa de risco. Estratégias empreendedoras.
  course_name: 'LES0370 - Formação Empreendedorial: Capacitação pró-ativa

    Proactive Entrepreneuship Capacitation'
  deactivation: ''
  instructors: 93929 - Alex Coltro
  lecture_credits: '4'
  objectives: "a)\tFornecer ao aluno o estado da arte a respeito dos conhecimentos\
    \ sobre empreendedorismo, inovação e criação de novos negócios, em uma ótica de\
    \ capacitação pessoal e profissional;\nb)\tDar ao aluno a chance de aplicar, durante\
    \ o curso, os conhecimentos adquiridos através da elaboração de um projeto para\
    \ a criação de um novo negócio."
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
