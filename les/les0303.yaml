  course: 'Gestão Turística de ambientes naturais é uma disciplina essencial dentro
    do curso de Gestão Ambiental. Tem como principal propósito oferecer informações
    sobre a atividade turística e sua relação com fatores ambientais. Tem principais
    assuntos: Evolução histórica da atividade de turismo, aspectos teóricos, conceituação,
    terminologia e elementos fundamentais da atividade de turismo; interação bi-direcional
    dos recursos naturais e o meio-ambiente com as atividades de turismo; planejamento,
    gerenciamento e sustentabilidade do turismo e minimização do impacto negativo
    da atividade no meio-ambiente; e, diversificação, segmentação e fragmentação da
    atividade turística.'
  course_name: 'LES0303 - Gestão Turística de Ambientes Naturais

    Tourism Management in Natural Environments'
  deactivation: ''
  instructors: 1564700 - Odaléia Telles Marcondes Machado Queiroz
  lecture_credits: '4'
  objectives: Fornecer ao estudante ferramentas básicas para o planejamento, gestão
    e sustentabilidade do turismo em ambientes naturais urbanos e rurais e minimização
    do impacto negativo da atividade humana no meio ambiente.
  practical_credits: '1'
