  course: "1. O Modelo Agroexportador: Auge e Decadência da economia agroexportadora\
    \ cafeeira: a) A política econômica  cafeeira (política cambial, Convênio de Taubaté\
    \ e Política de Valorização permanente);  b) A crise do café e a grande depressão.\
    \ 2. Processo de Substituição de Importações: o modelo de Substituição de Importações;\
    \ a)  O projeto nacionalista de Getúlio Vargas; b) Os impasses das mudanças estruturais\
    \ do Pós-Guerra; 3) O Plano de Metas de Juscelino Kubistchek; a)  o avanço da\
    \ industrialização pesada,  a  internalização da indústria de bens duráveis (1956-1961);\
    \ b) Os anos 1960 e a desaceleração no ritmo dos investimentos públicos e privados:\
    \ desequilíbrios e pontos de estrangulamento da Economia Brasileira e crise político-institucional;\
    \ 4) O Golpe Militar de 1964 e o avanço da internacionalização da economia brasileira,\
    \ a) o PAEG e as bases do Milagre Brasileiro; 5) O Milagre Brasileiro: crescimento\
    \ econômico e desigualdades social e regional;  6) O II Plano Nacional de Desenvolvimento,\
    \ \x93o grande salto para Frente\x94; 7) as mazelas do processo de industrialização\
    \ brasileira: crise fiscal do Estado, Inflação e Dívida Externa."
  course_name: 'LES0301 - Formação Econômica, Social e Política do Brasil II

    Brazilian Economic, Social and Political Formation II'
  deactivation: ''
  instructors: 5098002 - Carlos Eduardo de Freitas Vian
  lecture_credits: '4'
  objectives: Levar os alunos à compreensão do desenvolvimento do capitalismo no Brasil,
    a partir da sua inserção subordinada na divisão internacional do trabalho como
    economia agroexportadora, a crise e superação do modelo primário-exportador e
    a transição para uma economia industrial. Oferecer aos alunos subsídios para a
    compreensão das especificidades da industrialização brasileira, seus desafios
    e fragilidades, procurando apresentar o debate em torno das opções assumidas pelos
    tomadores de decisões em suas várias fases, bem como antecipar os elementos para
    uma reflexão dos impasses colocados à economia brasileira a partir da reversão
    cíclica e estrutural dos anos 1980/1990.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
