  course: '1. Tópicos essenciais de Economia do Setor Público

    1.1. Falhas de mercado; Bens públicos; Monopólio natural; Bens de propriedade
    comum; Regulamentação de falhas de mercado. 1.2. Objetivos da política fiscal
    e as funções do governo; Função Alocativa; Função Redistributiva; Função Estabilizadora;
    Inter-relações entre as funções fiscais. 1.3. Orçamento Público. 1.4. Princípios
    de Tributação. 1.5. Instrumentos de Estabilização. 1.6. Processo Político. 1.7.
    A Questão Distributiva. 1.8. Poluição e Informação.

    2.Análise Aplicada de um processo de definição de Orçamento Público: Estudo de
    Caso em Prefeitura Municipal. (para os Créditos Trabalho).'
  course_name: 'LES0559 - Economia do Setor Público

    Public Sector Economics'
  deactivation: ''
  instructors: 2084377 - Heloisa Lee Burnquist
  lecture_credits: '3'
  objectives: O objetivo do curso é apresentar ao aluno os fundamentos teóricos das
    ações do governo no campo das finanças públicas, bem como introduzi-lo a uma análise
    crítica da evolução das iniciativas governamentais no contexto histórico e geográfico
    em que vive, à luz dos conceitos adquiridos. O curso aborda os principais tópicos
    sobre a teoria das finanças públicas, incluindo questões relacionadas às funções
    do governo, às falhas de mercado e à teoria da tributação, dentre outras. Examina-se
    a racionalidade teórica da participação governamental na economia e as consequências
    econômicas desta intervenção, utilizando exemplos da economia brasileira. Serão
    examinadas questões teóricas e empíricas ao provisionamento e à alocação de bens
    e serviços públicos, além de aspectos positivos e normativos da taxação e federalismo
    fiscal.
  practical_credits: '1'
  total_workload: 75 h
  type: Semestral
