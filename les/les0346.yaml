courses:
  activation: 01/01/2013
  assessment: 'Poderão submeter-se à recuperação os alunos regularmente matriculados
    na disciplina e que tenham alcançado:

    a) freqüência mínima regimental eb) nota final não inferior a 3,0 (três).'
  bibliography: 1. Carraza, R. A. Curso de Direito Constitucional Tributário. Editora
    Saraiva, São Paulo. 2. Cassone, V. Direito Tributário. Editora Atlas, São Paulo.
    3. Constituição Federal. 4. Código Tributário Nacional.5. Fabretti L. C. Direito
    Tributário para os cursos de Administração e Ciências Contábeis. Editora Jurídica
    Atlas, São Paulo.
  course: 'Noções gerais de direito tributário. A atividade financeira do Estado.
    Sistema tributário nacional. Tributo: conceito e espécies. Impostos, taxas, contribuição
    de melhoria, contribuições especiais e empréstimos compulsórios. Limitações ao
    poder de tributar. Princípios constitucionais tributários. Imunidades. As normas
    gerais de direito tributário. Legislação tributaria. Obrigação tributaria. Crédito
    tributário. Administração tributária.'
  course_name: 'LES0346 - Direito Tributário

    Tax Law'
  deactivation: ''
  instructors: 8819776 - Andres Felipe Thiago Selingardi Guardia
  lecture_credits: '2'
  objectives: Introduzir os principais conceitos e fundamentos do sistema tributário
    nacional assim como esclarecer aos alunos as diferentes classes e espécies tributárias.
  practical_credits: '0'
  total_workload: 30 h
