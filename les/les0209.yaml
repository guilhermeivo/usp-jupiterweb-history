  course: 'Unidade I - Evolução sócio-histórica das idéias pedagógicas e práticas
    educativas dialógicas. Comunicação e Educação: interfaces, estudos, pesquisas
    e experiências.Unidade II – Meios de comunicação e sua influência na educação
    e o desenvolvimento das tecnologias da informação. Unidade III- Mídia, TICs, CTSAe
    Educação: Leitura crítica da comunicação Unidade IV - Prática como componente
    curricular por meio do desenvolvimento de um projeto de comunicação aplicado à
    educação.'
  course_name: 'LES0209 - Comunicação e Educação

    Communication and Education'
  deactivation: ''
  instructors: '1895432 - Rosebelly Nunes Marques

    7785642 - Taitiâny Karita Bonzanini

    5553650 - Vânia Galindo Massabni'
  lecture_credits: '4'
  objectives: 1. Desenvolver habilidades e competências comunicativas. 2. Desenvolver
    reflexões sobre a prática dialógica e participativa na sala de aula. 3. Aprofundar
    conhecimentos e desenvolver pensamento crítico quanto ao emprego das tecnologias
    da informação e da comunicação (TICs) na educação e no movimentoCTSA (Ciência,
    Tecnologia, Ambiente e Sociedade). 4  Desenvolver percepção crítica acerca das
    mídias e sua influência na sociedade e na cultura. 5. Desenvolver reflexões acerca
    do papel e postura do professor perante as mídias e das TICs. 6. Desenvolver experiência
    prática como componente curricular envolvendo a apropriação das TICs pensando
    seu emprego em contextos educativos e formativos, por meio da produção de um vídeo.
  practical_credits: '2'
  total_workload: '120 h

    (

    Práticas como Componentes Curriculares =  60 h

    )'
  type: Semestral
