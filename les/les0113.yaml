  course: 1) Elementos básicos de teoria social; 2) Desigualdade social e condição
    de classe. Classe e modo de produção. Classe e oportunidades de renda; 3) Racionalidade
    ambiental; 4) A metamorfose da produção social e do trabalho; 5) Transformações
    na vida íntima e cotidiana; 6) Racismo no Brasil. Exclusão social e raça; 7) Os
    gêneros nas sociedades contemporâneas; 8) O papel dos meios de comunicação na
    sociedade contemporânea. Informação e propaganda. Cultura nacional e cultura global;
    9) Desigualdade e violência. Normas culturais e violência; 10) Natureza e trabalho.
    Natureza e representação social; 11) Estado e Política.
  course_name: 'LES0113 - Introdução às Ciências Sociais

    Introduction to Social Science'
  deactivation: ''
  instructors: 325635 - Antonio Ribeiro de Almeida Junior
  lecture_credits: '2'
  objectives: Colocar os alunos em contato com os conceitos básicos das Ciências Sociais,
    inclusive alguns elementos das teorias clássicas das ciências sociais. Ao final
    da disciplina, os alunos deverão ser capazes de empregar estes conceitos para
    analisar realidades sociais simples e também o cotidiano. A disciplina deve ainda
    proporcionar aos alunos elementos teóricos que lhes permitam compreender a utilidade
    das Ciências Sociais no entendimento dos problemas ambientais. A disciplina deve
    ainda fornecer uma compreensão básica sobre como fazer pesquisa em ciências sociais
  practical_credits: '1'
  total_workload: 60 h
  type: Semestral
