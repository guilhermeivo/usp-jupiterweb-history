  course: '1) As Ciências Sociais: conceito e disciplinas afins. 2) O indivíduo, A
    cultura e a sociedade: processo de socialização; a dinâmica cultural; estrutura
    e organização social. 3) A contribuição de Durkheim para o estudo da sociedade:
    fato social, consciência coletiva e instituição, solidariedade orgânica e mecânica.
    4) A contribuição de Max Weber para o estudo da sociedade: ação social dotada
    de sentido, divisão de trabalho social, racionalidade na sociedade capitalista.
    5) A contribuição de Marx para o estudo da sociedade: materialismo histórico,
    modos de produção, trabalho, valor e lucro, alienação. 6) Obras importantes de
    outros cientistas sociais  para o estudo da realidade social: Norbert Elias (processo
    civilizador), John Thompson (midiação da cultura), Bernard Lahire (sociologia
    em escala individual), Pierre Bourdieu (distinção social) e Luc Boltanski (justificações
    legítimas) 7) O mercado, o sistema ciência-tecnologia e a cultura na sociedade
    capitalista. 7) Sociedade de massa. 8) Movimentos Sociais. 9) Globalização, tempo
    e espaço na pós modernidade.'
