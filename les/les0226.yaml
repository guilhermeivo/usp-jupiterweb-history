  course: '1 - Álgebra Matricial. Matrizes e vetores. Dimensão de uma matriz: linhas,
    colunas, diagonais. Matrizes especiais: matriz quadrada, vetor linha, vetor coluna,
    matriz diagonal, matriz identidade, matriz nula, matriz triangular. Operações
    e relações algébricas: igualdade, soma, subtração. Multiplicação: matriz x escalar;
    matriz x matriz (pré e pós-multiplicação). Propriedades observadas: adição (comutativa,
    associativa); multiplicação (comutativa, associativa, distributiva). Outras matrizes
    especiais: transpostas, simétricas, idempotentes, particionadas. Matriz inversa,
    matriz singular, matriz não-singular. Determinantes. Menores e cofatores de uma
    matriz. Expansão de Laplace. Propriedades dos determinantes. Cálculo da matriz
    inversa. Aplicação à resolução de sistemas de equações lineares. Regra de Cramer.
    Posto ("rank") de uma matriz. Traço de uma matriz. Cálculo da inversa de matriz
    particionada. Aplicações. Grandezas e operações vetoriais. Representação geométrica
    de vetores: espaços vetoriais. Soma e subtração de vetores. Multiplicação e divisão
    de um vetor por um elemento escalar. Distância entre vetores. 2 - Limites: pela
    direita e pela esquerda. Propriedades dos limites. Formas indeterminadas. Regra
    de L''Hôpital. Diferenciação x continuidade. Tipos de descontinuidade. Regras
    de derivação. Propriedades das regras de derivação. Extensões da regra de L''Hôpital.
    Diferenciação da função inversa. Regra da cadeia. Derivadas de ordem superior.
    Derivadas parciais. Determinante Jacobiano. 3 - Funções exponenciais: definições
    e propriedades básicas. Funções logarítmicas: definições e propriedades. Aplicações.
    Funções trigonométricas: definições e propriedades básicas. 4 - Integrais - Função
    primitiva. Regras básicas de integração. Propriedades das regras básicas de integração.
    Regra da substituição. Integração por

    partes. Integrais definidas. Propriedades das integrais definidas. Integrais impróprias.
    A integral definida como a área sob uma curva. Integrais múltiplas. Aplicação.
    5 - Conceitos básicos de equações diferenciais e de diferença. Equações diferenciais
    ordinárias. Solução geral e particular. Equações diferenciais separáveis. Equações
    diferenciais homogêneas. Equações diferenciais exatas. Equações diferenciais lineares.
    Aplicação. 6 - Otimização. Classificação de problemas que envolvam otimização.
    Otimização não-condicionada: uma variável. Teste da derivada primeira, para extremo
    relativo. Obtenção de máximo ou mínimo global. Teste da derivada segunda. Funções
    côncavas e convexas. Funções quadráticas: obtenção de raízes e análise de convexidade.
    Aplicações. Pontos de inflexão. Séries de Taylor e de MacLaurin. Teste da derivada
    enésima para extremos relativos de uma função de uma variável. Otimização não-condicionada:
    duas variáveis. Ponto de sela. O conceito de diferencial. Diferenciação total.
    Derivada total. Funções implícitas. Formas alternativas para expressar as condições
    de primeira e segunda ordem. Determinante Hessiano. Aplicações. Otimização condicionada.
    Resolução algébrica. Método do multiplicador de Lagrange. Hessiano orlado. Programação
    linear: resolução gráfica. O conceito de preço-sombra e custo de oportunidade.
    Programação não-linear,extensão do método de Lagrange. Condições de Karush-Kuhn-Tucker.
    Teorema da folga complementar. Aplicação: firma que maximiza vendas. Convexidade
    e concavidade. Teoremas decorrentes.'
