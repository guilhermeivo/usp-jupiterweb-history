  course: Breve histórico do processo de Educação escolar e não escolar.Relação entre
    o espaço escolar e construção do pensamento autônomo. O pensamento de Paulo Freire
    no processo de Educação. Os Parâmetros Curriculares Nacionais (PCNs) e as orientações
    norteadoras do fazer pedagógico. Análise de textos considerando a coerência interna
    expressa ou não pelo autor. Produção de textos considerando os elementos essenciais
    de uma redação e que contemple a organização de argumentos e indique sua coerência
    interna. Realização de consulta a bases de divulgação científica considerando
    a mídia escrita e não escrita.Entrevistas realizadas pelos licenciandos nas atividades
    de Prática como Componentes Curriculares- PCC (60h).
  course_name: 'LES0114 - Introdução aos Estudos da Educação

    Introduction to research in education'
  deactivation: ''
  instructors: 1895432 - Rosebelly Nunes Marques
  lecture_credits: '2'
  objectives: 'A disciplina introduz o licenciando na Programa de Licenciatura e almeja
    esclarecê-lo e incentivá-lo para a carreira docente abordando, para isso, os principais
    pressupostos educacionais. A ênfase da introdução está nos aspectos psicológicos
    e sociais do ato de educar. O uso adequado da linguagem (oral e escrita) no processo
    de socialização e o construção do saber, também compõem os objetivos que são necessários
    a reflexão da prática pedagógica. Desenvolver atividades de Prática como Componentes
    Curriculares (PCC).Como resultado de desenvolvimento da disciplina marcado pela
    apresentação de conteúdo, debates e reflexões, os alunos deverão estar aptos a:

    a) Apresentar a diferenciação entre a educação formal e não formal, explicitando
    as especificidades dos diferentes locus de divulgação e construção do conhecimento.
    b) Indicar os pressupostos básicos do pensamento freiriano e sua importância para
    a reflexão sobre a educação escolar, em específico, a educação escolar brasileira.
    c) Apresentar os pressupostos nortearam o pensamento da relação e sociedade com
    ênfase nos pressupostos reprodutivistas e contra-reprodutivistas. d) Indicar como
    Jean Piaget e Paulo Freire concebiam a educação como espaço para a construção
    e exercício da autonomia. e) realizar a análise de textos considerando os paradigmas
    do consenso e do conflito na apresentação dos autores. f) produzir textos argumentativos
    considerando a necessidade de coerência interna. g) identificar as principais
    revistas e locais de divulgação de artigos científicos disponíveis na mídia impressa
    e não impressa.'
  practical_credits: '2'
  total_workload: '90 h

    (

    Práticas como Componentes Curriculares =  60 h

    )'
  type: Semestral
