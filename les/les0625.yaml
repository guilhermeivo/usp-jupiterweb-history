  lecture_credits: '2'
  objectives: O objetivo da disciplina é dar oportunidade para o aprimoramento teórico
    vinculado a um estágio de formação docente em uma fase intermediária do curso,
    colocando o aluno da licenciatura em contato com diferentes realidades educacionais
    formais ou não formais. A prática consiste em trabalhos de pesquisa, ensino e/ou
    extensão que requerem vivência com o processo educativo. A parte teórica da disciplina
    consiste na orientação deste trabalho pelo docente por meio de aulas, estudos
    dirigidos, seminários e discussões, culminando em um relatório. O estágio supervisionado
    nesta disciplina está organizado de acordo com o Programa de Formação de Professores
    da USP, refletindo a diversidade de perspectivas do curso e seus desdobramentos
    na prática, visando a compreensão e análise fundamentada do contexto educativo
    e das formas de atuação do educador na área de Ciências/Biologia/Ciências Agrárias.
