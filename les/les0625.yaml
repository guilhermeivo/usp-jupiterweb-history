  course: 'Realizar um estágio a fim de iniciar o futuro professor na prática educativa
    e incluir subsídios teóricos para a realização deste estágio. Para o aprofundamento
    em áreas específicas, a atividade de estágio requer vivência com o processo educativo
    e será orientada por um professor do curso de Licenciatura da ESALQ/USP que atuará
    como supervisor de estágio desta disciplina na área em questão, a fim de contemplar
    os objetivos formativos da docência previstos no projeto pedagógico do curso.
    Os projetos articularão ensino, pesquisa e extensão em educação e, dependendo
    de sua natureza, podem enfatizar um destes três eixos formativos.  O estágio irá
    requerer: 1- Elaboração ou participação no desenvolvimento de um projeto na área
    da educação com ênfase no ensino técnico em ciências agrárias, no ensino de ciências
    no ensino fundamental e biologia no ensino médio; 2- Aulas necessárias ao desenvolvimento
    do tema em estudo; 3- Delineamento de um Plano de Trabalho respeitando presença
    e carga horária semanal e compatível com o período da disciplina, a ser supervisionado
    pelo professor de estágio. 4- Atividades ajustadas ao projeto, envolvendo leituras,
    levantamentos, elaboração de instrumentos de coleta de dados e sua análise, realização
    de intervenções em escolas e no campus da ESALQ, estabelecimento de parcerias
    educativas, identificação e análise de práticas pedagógicas, materiais e recursos
    didáticos, linhas de pesquisa em educação, projetos educativos e outras, pautando-se
    por critérios éticos, a serem discutidos durante a disciplina. 5- Realização da
    parte prática do estágio (vivência); 6- Preparação e redação do projeto e respectivo
    relatório, que pode ser um relatório formal segundo formatação de relato de pesquisa
    ou de experiência ou ainda poderá ser realizado como textos de divulgação científica,
    textos didáticos e textos em blogs e outros, objetivando o aprimoramento da Língua
    Portuguesa através da leitura e escrita.'
  course_name: 'LES0625 - Estágio Curricular em Licenciatura: teoria e prática

    Course Internship in teacher training'
