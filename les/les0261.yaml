  course: 'A escolha das atividades consideradas para o cômputo da carga horária deve
    estar orientada pelo princípio da consolidação da formação do professor crítico,
    competente e consciente das demandas de sua atuação profissional. As atividades
    que o aluno deve cumprir para ter a carga horária, além de outras que podem ser
    consideradas, a depender da apreciação dos professores envolvidos, são:

    1. Atividades de extensão: cursos de difusão cultural, atualização e outras;

    2. Eventos: semanas de estudos, congressos, seminários, mesas-redonda, simpósios,
    encontros, jornadas, palestras, conferências;

    3. Iniciação científica;

    4. Participação em grupos de estudos e pesquisa;

    5. Diretoria de Centro Acadêmico e outro tipo de representação estudantil;

    6. Representação discente em comissões estatutárias na Unidade, órgãos centrais
    e outros;

    7. Monitoria;

    8. Publicações;

    9. Cursos de Línguas

    10. Aulas e atividades educacionais comprovadas'
  course_name: 'LES0261 - Atividades Teórico-Práticas de Aprofundamento (ATPA)

    Theoretical and Practical Complementary Activities  (ATPA)'
  deactivation: ''
  instructors: '3058549 - Ricardo Leite Camargo

    1895432 - Rosebelly Nunes Marques

    7785642 - Taitiâny Karita Bonzanini

    5553650 - Vânia Galindo Massabni'
  lecture_credits: '0'
  objectives: As Atividades Teórico-Práticas de Aprofundamento integram obrigatoriamente
    os cursos de formação de professores e em conformidade com a legislação educacional
    e com o Programa de Formação de Professores da USP constituem-se em requisito
    indispensável para a colação de grau do licenciado. Tais atividades ampliam e
    aprofundam a formação sócio cultural e científica do futuro professor, contribuição
    que deve ser indicada em reflexões das atividades realizadas, as quais serão contabilizadas
    ao longo de uma disciplina. Estas atividades são de responsabilidade da Comissão
    Coordenadora de Curso (COC) e estarão baseadas na comprovação, por parte dos alunos,
    dos certificados, documentos comprobatórios das 200h de atividades, com cópias
    encadernadas e organizadas, com o somatório das horas. Haverá o cômputo das horas,
    por parte dos docentes responsáveis. A ATPA visa o cumprimento de 200h de atividades
    complementares para atendimento da Resolução CNE/CP 02/2015 e Deliberação CEE
    154/2017.
