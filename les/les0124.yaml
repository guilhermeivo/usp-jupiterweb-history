  assessment: A recuperação dos alunos, a ser realizada em data determinada pela seção
    de graduação, constará de uma prova dissertativa sobre temas constantes do programa
    ministrado no semestre e a entrega do projeto de pesquisa corrigido. Existe a
    possibilidade, essa prova escrita poderá ser complementada ou transformada em
    prova oral, abrangendo em ambos os casos o total do programa ministrado.
