  course: Ciência e tipos de conhecimentos (conhecimento científico, conhecimento
    religioso, conhecimento filosófico, conhecimento comum, etc.); métodos das ciências
    sociais (método dedutivo, método indutivo, método dialético, etc.); processos
    de pesquisa (para que pesquisa, o que pesquisar, pesquisar par formular teorias,
    etc.); pesquisa social (pesquisas exploratória, descritiva, explicativa, etc.);
    roteiro de um projeto de pesquisa (introdução, justificativa, definição do problemas  de
    pesquisa, objetivos da pesquisa, hipóteses, etc.);; delineamento de pesquisa (pesquisa
    de campo, estudo de caso, pesquisa documental, etc.); métodos quantitativos e
    qualitativos; instrumentos para coleta de dados (questionário, entrevista, observação
    participante e não participante, etnografia, etc.); planejamento de pesquisa (elaboração
    e tratamento dos dados, análise dos resultados); análise, interpretação e redação
    do trabalho final.
  course_name: 'LES0124 - Métodos em Pesquisa

    Methods in Research'
  deactivation: ''
  instructors: 93929 - Alex Coltro
  lecture_credits: '2'
  objectives: Evidenciar os fundamentos e métodos pertinentes ao conhecimento científico.
    Compreender as diversas fases e as principais técnicas para desenvolvimento de
    pesquisas e trabalhos acadêmicos. Desenvolver pesquisas de campo aliado a trabalhos
    científicos de acordo com as orientações e normas da Associação Brasileira de
    Normas Técnicas.
  practical_credits: '1'
  total_workload: 60 h
  type: Semestral
