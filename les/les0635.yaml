  course: '4.1. Economia/Administração. Desenvolvimento de estágio dentro de algumas
    das áreas de pesquisa do LES, sempre sob a orientação de um professor responsável.  Estes
    trabalhos poderão ser desenvolvidos no Departamento de Economia, Administração
    e Sociologia e em empresas públicas ou privadas. 4.2. Extensão Rural-Preparação
    inicial para o estágio: natureza do estágio, instrumentos de extensão, conhecimentos
    sobre a área do estágio; Visitas semanais à região do estágio para assessorar
    produtores e suas organizações; Sessões de reflexão sobre as experiências nas
    comunidades e organizações; Compartilhamento de experiências com profissionais
    de extensão; Apresentação de seminários'
  course_name: 'LES0635 - Estágio Supervisionado em Economia, Administração, Ciências
    Humanas e Extensão II

    Supervised  intership for Economics, Management and Sociology II'
  deactivation: ''
  instructors: 2210982 - Humberto Francisco Silva Spolador
  lecture_credits: '0'
  objectives: 'Oferecer aos alunos a possibilidade de ampliarem e aprofundarem os
    conhecimentos adquiridos nas aulas práticas e teóricas das disciplinas do Departamento
    de Economia, Administração e Sociologia. Para alcançar estes objetivos, pretende-se:

    1. Propiciar condições para o contato direto com técnicas de análise econômica,
    administração de empresas agroindustriais e práticas extensionistas.

    2. Criar condições para o envolvimento dos alunos em atividades de análise econômica,
    administração e extensão em empresas com fins produtivos ou em empresas públicas.

    3. Incentivar a integração interdisciplinar e interdepartamental em torno de problemas
    dos segmentos do complexo agroindustrial  (insumos, produção, processamento e
    varejo),  integrando ensino, pesquisa e extensão.'
  practical_credits: '4'
