  course: Ciência moderna e criações tecnológicas e simbólicas. A ecologia como desafio
    científico. O natural, o artificial e o simbólico. A ecologia dos instrumentos
    (media ecology). As tecnologias como extensões do corpo. Conjunto técnico e mudança
    social. O fetichismo da tecnologia e a utopia tecnológica. O mundo como artefato.
    A cibernética como metáfora científica. Arte, ciência e tecnologia. A teoria crítica
    e a tecnologia. A autonomia do simbólico e os veículos de comunicação. A ecologia
    dos saberes. Poder e tecnologia. Poder e símbolo. Impactos do artificial e do
    simbólico sobre o mundo psíquico e sobre a saúde.
  course_name: 'LES0135 - Ecologias do Artificial e do Simbólico

    Artificial and Symbolic Ecology'
  deactivation: ''
  instructors: 325635 - Antonio Ribeiro de Almeida Junior
  lecture_credits: '4'
  objectives: 1. Investigar as possibilidades de pensar as criações humanas (científicas,
    tecnológicas e simbólicas) por meio de concepções ecológicas; 2. Debater o que
    é a ecologia no mundo contemporâneo; 3. Debater como as criações humanas podem
    ser pensadas dentro de cadeias tróficas; 4. Discutir os vínculos destas criações
    humanas com as organizações contemporâneas; 5. Debater os ambientes simbólicos
    criados pelos veículos de comunicação eletrônicos; 6. Apresentar algumas metodologias
    de pesquisa que possam ser aplicadas em investigações destas criações dentro de
    um espírito ecológico; 7. Analisar alguns impactos das criações humanas (materiais
    e simbólicas) sobre a saúde corporal e psíquica.
  practical_credits: '1'
  total_workload: 90 h
  type: Semestral
