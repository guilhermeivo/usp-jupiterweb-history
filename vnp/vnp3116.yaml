  course: ''
  course_name: 'VNP3116 - Nutrologia canina e felina

    Canine and feline nutrology'
  deactivation: 31/12/2024
  instructors: 94103 - Alexandre Augusto de Oliveira Gobesso
  lecture_credits: '3'
  objectives: 'Propiciar conhecimentos específicos para que os acadêmicos possam:

    Compreender o papel da nutrição na etiologia e patogenia de afecções que acometem
    cães e gatos;

    Compreender a influência da doença e das diferentes fases fisiológicas sobre as
    necessidades e o metabolismo dos nutrientes na espécie canina e felina;

    Compreender princípios gerais de avaliação nutricional do paciente;

    Instituir a correção dietética pertinentes aos distúrbios nutricionais e metabólicos
    de cães e gatos;

    Utilizar nutrientes específicos na terapia de doenças e distúrbios metabólicos
    e nutricionais de cães e gatos.'
  practical_credits: '0'
  total_workload: 45 h
