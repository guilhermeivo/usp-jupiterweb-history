  course: '1. Avaliação nutricional do paciente canino e felino:

    -1.1 Avaliação do escore de condição corporal ;

    - 1.2 Avaliação do escore de massa muscular;

    - 1.3 Técnicas de composição corporal;

    - 1.4 Anamnese nutricional;

    - 1.5 Exames laboratoriais auxiliares na determinação do estado nutricional do
    paciente;

    ● 2. Necessidades nutricionais e manejo nutricional do animal doente:

    2.1 Relação entre nutrição-imunidade-infecção;

    2.2 Importância da manutenção do balanço energético positivo na recuperação;

    2.3 Suporte nutricional intensivo enteral e parenteral;

    2.4 Doenças osteoarticulares do desenvolvimento: fatores nutricionais envolvidos
    e manejo dietético;

    2.5 Manejo nutricional das cardiopatias;

    2.6 Manejo nutricional nos diferentes estágios da doença renal crônica;

    2.7 Manejo nutricional das endocrinopatias;

    2.8 Manejo nutricional das dermatopatias;

    2.9 Manejo nutricional das hepatopatias;

    2.10 Manejo nutricional das doenças gastrintestinais;

    2.11 Manejo nutricional do paciente com câncer;

    2.12 Manejo nutricional do pós-cirúrgico;

    ● 3. Uso de alimentos funcionais e nutracêuticos na nutrologia de cães e gatos.'
  course_name: 'VNP3116 - Nutrologia canina e felina

    Canine and feline nutrology'
  deactivation: ''
  instructors: 7686777 - Marcio Antonio Brunetto
  lecture_credits: '3'
  objectives: 'Propiciar conhecimentos específicos para que os acadêmicos possam:

    4.1.1 compreender o papel da nutrição na etiologia e patogenia de afecções que
    acometem cães e gatos;

    4.1.2 compreender a influência da doença e das diferentes fases fisiológicas sobre
    as necessidades e o metabolismo dos nutrientes na espécie canina e felina;

    4.1.3 Compreender princípios gerais de avaliação nutricional do paciente;

    4.1.4 instituir a correção dietética pertinentes aos distúrbios nutricionais e
    metabólicos de cães e gatos;

    4.1.5 utilizar nutrientes específicos na terapia de doenças e distúrbios metabólicos
    e nutricionais de cães e gatos.'
  practical_credits: '0'
  total_workload: 45 h
