  objectives: 'da atividade

    Transmitir conhecimentos na vanguarda da grande área da Nutrição e Produção Animal,
    por meio de minicursos teóricos, práticos e aplicados, para Produtores Rurais,
    Empreendedores e demais profissionais do Setor Produção Animal.

    Descrição da atividade

    A atividade de extensão proposta tem por objetivo oferecer atualizações na área
    grande área da Produção Animal para produtores rurais, empreendedores e demais
    profissionais do Setor da Produção Animal. Os alunos do Curso de Medicina Veterinária
    do 5º semestre, serão responsáveis pela: (i) organização; (ii) divulgação; (iii)
    preparação dos minicursos, palestras, e/ou atividades práticas; (iv) criação dos
    indicadores de avaliação de cada atividades; (v) compilação dos resultados da
    avaliação das atividades; (vi) confecção de relatório final contemplando os pontos
    fortes e fracos de cada atividade e do Evento. Os alunos serão assistidos pelos
    Professores do Departamento ao longo de todo processo.

    Indicadores de avaliação da atividade

    Os indicadores de avaliação das atividades serão realizados por meio questões
    múltipla-escolha (por meio de escalas de cinco pontos), além de duas abertas para
    identificação de pontos fortes e fracos de cada minicurso/palestra/atividade.
    O objetivo é avaliar a eficácia de cada atividade, fornecendo aos participantes
    a opção de avaliar sua experiência em cada atividade. As avaliações serão disponibilizadas
    para os participantes por meio de formulário impresso, link e/ou QR Code, sem
    a necessidade de identificação dos participante.'
