  course: 'Introdução ao estudo da avicultura: evolução da avicultura, importância
    econômica para o Brasil e cenário internacional; funções econômicas; híbridos
    comerciais; atuação do médico veterinário na cadeia avícola.

    Produção de carne:  equipamentos; sistemas de criação e de produção; manejo dos
    pintainhos e frangos; manejo alimentar e programas de alimentação.

    Produção de ovos de consumo: equipamentos; sistemas de criação; manejo das pintainhas,
    frangas e poedeiras; manejo dos ovos comerciais; qualidade interna e externa de
    ovos; classificação e nomenclatura de ovos em natureza; manejo alimentar e programas
    de alimentação.

    Produção de ovos férteis e pintainhos de um dia: equipamentos; manejo de reprodutores
    durante as fases de cria, recria e produção; manejo alimentar e programas de alimentação;
    cuidados com os ovos incubáveis; manejo da incubadora e câmara de eclosão.

    Ambiência: conforto térmico; critérios de localização; construções; modificações
    primárias e secundárias das instalações.'
