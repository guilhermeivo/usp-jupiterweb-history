  objectives: 'de Desenvolvimento Sustentável (ONU)

    n° 1)

    Erradicação da Pobreza:

    acabar com a pobreza em todas as suas formas, em todos os lugares;

    n° 2)

    Fome Zero e Agricultura Sustentável:

    acabar com a fome, alcançar a segurança alimentar e melhoria da nutrição e promover
    a agricultura sustentável;

    n° 3)

    Saúde e Bem-Estar:

    assegurar uma vida saudável e promover o bem-estar para todos, em todas as idades;

    n° 12)

    Consumo e Produção Responsáveis:

    assegurar padrões de produção e de consumo sustentáveis;

    Viagem Didática

    É estruturante?

    Sim

    Atividades a serem desenvolvidas

    Atividades essencialmente práticas realizadas no Campus da Universidade de São
    Paulo “Fernando Costa” – Pirassununga, junto ao Departamento de Nutrição e Produção
    Animal (VNP), onde os alunos acompanham a rotina dos diferentes sistemas de criação
    de animais e sua inter-relação com o exercício profissional e a realidade brasileira,
    no contexto das criações de Bovinos de Leite, Bovinos de Corte, Suínos, Aves,
    Caprinos e Ovinos, Equinos e Cães e Gatos.

    O objetivo é oferecer aos acadêmicos ingressantes conhecimentos iniciais ligados
    aos diferentes sistemas de criação dos animais, através de atividades de rotina
    específicas empregadas na lida com os animais, de maneira a permitir a identificação
    dos vários fatores envolvidos no complexo dos criatórios.'
