  objectives: Oferecer ao acadêmico ingressante, conhecimentos iniciais ligados aos
    diferentes sistemas de criação dos animais, através de atividades de rotina específicas
    empregadas na lida com os animais, de maneira a permitir a identificação dos vários
    fatores envolvidos no complexo dos criatórios.
