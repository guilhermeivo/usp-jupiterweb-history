  course: "Atividades essencialmente práticas realizadas no Campus da USP Fernando\
    \ Costa – Pirassununga/SP – Departamento de Nutrição e Produção Animal (VNP) da\
    \ FMVZ-USP, acompanhando a rotina dos diferentes sistemas de criação de animais\
    \ e sua inter-relação com o exercício profissional e a realidade brasileira, no\
    \ contexto das criações de:\n•\tAves / Coelhos\n•\tBovinos de Corte\n•\tBovinos\
    \ de Leite\n•\tCaprinos / Ovinos\n•\tEquinos\n•\tSuínos\n•\tCães e Gatos\nAulas\
    \ de Campo – Campus da USP “Fernando Costa” - Pirassununga\nInstrumentos e Critérios\
    \ de Avaliação"
  course_name: 'VNP0135 - Introdução ao Estudo da Medicina Veterinária em Sistemas
    de Criações

    Introduction to the Study of Veterinary Medicine in Production Systems'
