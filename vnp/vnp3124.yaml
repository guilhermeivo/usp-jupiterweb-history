  course: "•\tIntrodução à Bioinformática aplicada à Produção Animal e Medicina Veterinária.\n\
    •\tIntrodução aos conceitos sobre visão computacional, Big Data, Aprendizado de\
    \ Máquina e banco de dados, todos relacionados a possíveis aplicações em Veterinária.\n\
    •\tNoções sobre dados relacionadas à Produção Animal de Precisão\n•\tNovos fenótipos\
    \ mensurados em Bovinocultura de Leite, Corte e Suinocultura\n•\tConceitos básicos\
    \ sobre o uso do EXCEL para fins de exploração inicial dos dados\n•\tIntrodução\
    \ a lógica de programação e linguagem R\n•\tFerramentas visuais: ggplot2, plotly\
    \ e Power BI\n•\tApresentacao e discussao de projetos/pesquisas envolvendo dados\
    \ de Precisão (Imagem, vídeo, sensores e áudio)\n•\tSimulação de dados\n•\tProjeto\
    \ Final\n•\tBioinformática na Prática: problemas ligados à Bovinocultura de Leite\n\
    •\tBioinformática na Prática: problemas ligados à Bovinocultura de Corte\n•\t\
    Bioinformática na Prática: problemas ligados à Suinocultura"
