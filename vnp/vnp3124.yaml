  course_name: 'VNP3124 - Bioinformática aplicada à Medicina Veterinária e Pecuária
    de Precisão

    Bioinformatics applied to Veterinary Medicine and Precision Livestock Production'
  deactivation: ''
  instructors: 9124662 - Ricardo Vieira Ventura
  lecture_credits: '2'
  objectives: 'Avanços teóricos e tecnológicos em bioinformática, genética, estatística
    e coleta de novos tipos de dados, podem ser definidos como fatores determinantes
    para a proliferação de tecnologias e técnicas que auxiliam no entendimento dos
    mecanismos que controlam a diversidade genética e fenotípica em animais de diferentes
    espécies. Novos projetos relacionados à área de produção animal estão gerando
    grandes quantidades de dados biológicos complexos, que requerem melhor entendimento
    sobre fatores como armazenamento eficaz, análise e interpretação de dados relacionados
    aos sistemas de produção animal. Esta disciplina fornecerá aos alunos uma visão
    geral e conhecimento inicial sobre aplicação de recursos computacionais e estatísticos
    relacionadas à análise de dados biológicos aplicados às áreas de Medicina Veterinária
    e Zootecnia de Precisão. A disciplina tem como objetivos específicos: introduzir
    conceitos básicos sobre linguagem EXCEL para resolução de problemas simplificados;
    apresentar e discutir tópicos como exploração de dados "ômicos", mineração de
    dados,  reconhecimento de padrões e análise de imagens. Espera-se que, ao final
    do curso, o aluno possa ter capacidade de utilização da ferramenta EXCEL para
    fins de manipulação de dados simplificados e também possa acumular conhecimento
    para um futuro aprofundamento diante das novas técnicas relacionadas à exploração
    de dados biológicos via recursos computacionais.'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
