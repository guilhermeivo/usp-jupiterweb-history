  course: 'Introdução à Bioinformática aplicada à Produção Animal e Medicina Veterinária.

    Introdução aos conceitos sobre visão computacional, Big Data, Aprendizado de Máquina
    e banco de dados, todos relacionados a possíveis aplicações em Veterinária.

    Noções sobre dados relacionadas à Produção Animal de Precisão

    Novos fenótipos mensurados em Bovinocultura de Leite, Corte e Suinocultura

    Conceitos básicos sobre o uso do EXCEL para fins de exploração inicial dos dados

    Introdução à lógica de programação e linguagem R

    Ferramentas visuais: ggplot2, plotly e Power BI

    Apresentação e discussão de projetos/pesquisas envolvendo dados de Precisão (Imagem,
    vídeo, sensores e áudio)

    Simulação de dados

    Projeto Final

    Bioinformática na Prática: problemas ligados à Bovinocultura de Leite

    Bioinformática na Prática: problemas ligados à Bovinocultura de Corte

    Bioinformática na Prática: problemas ligados à Suinocultura'
  course_name: 'VNP3124 - Bioinformática aplicada à Medicina Veterinária e Pecuária
    de Precisão

    Bioinformatics applied to Veterinary Medicine and Precision Livestock Production'
  deactivation: ''
  instructors: 9124662 - Ricardo Vieira Ventura
  lecture_credits: '2'
  objectives: 'Novos projetos relacionados à área de produção animal estão gerando
    grandes quantidades de dados biológicos, o que em muitos casos requer estratégias
    específicas sobre armazenamento, e visualização, previamente as etapas de análise
    estatística e emprego de modelagens específicas. Esta disciplina fornecerá aos
    alunos uma visão geral e conhecimento inicial sobre possíveis aplicações de técnicas
    computacionais com foco na manipulação de dados biológicos, fontes de projetos
    aplicados às áreas de Medicina Veterinária e Zootecnia de Precisão. Adicionalmente,
    irá capacitar os estudantes possibilitando o aprendizado da linguagem computacional
    R, utilizada para manipulação e visualização de dados, além de noções sobre ferramentas
    de visualização de dados. A disciplina tem como objetivos específicos: introduzir/rever
    conceitos básicos sobre linguagem EXCEL; introduzir conceitos sobre lógica de
    programação e linguagem R; apresentar as ferramentas ggplot, plotly e PowerBI;
    Discutir brevemente sobre projetos na área de veterinária que envolvam áreas como
    visão computacional, Big Data, aprendizado de Máquina, banco de dados, e reconhecimento
    de padrões envolvendo dados como imagens, vídeos e áudios. Espera-se que, ao final
    do curso, o aluno possa ter capacidade de utilização da ferramenta EXCEL, R, além
    de aplicar ferramentas gráficas para fins de manipulação e interpretação inicial
    de dados simplificados. Adicionalmente, almeja-se também que se possa acumular
    noções gerais para participação em projetos que envolvam dados e novas técnicas
    relacionadas à Zootecnia e Medicina Veterinária de Precisão.'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
