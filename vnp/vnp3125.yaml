  course: 'Conceitos Básicos em Estatística Experimental:

    Parâmetros;

    Estimadores;

    Estimativas;

    Hipóteses;

    Erros tipo I e II.

    Testes de Hipóteses:

    Teste para uma Média Amostral: Exemplos Práticos;

    Teste para duas Variâncias Amostrais: Exemplos Práticos;

    Teste para duas Amostras Independentes: Exemplos Práticos;

    Teste para duas Amostras Dependentes: Exemplos Práticos.

    Contraste entre Grupos de Médias:

    Definição;

    Estimativa do contraste: Exemplo Prático;

    Variância do contraste: Exemplo Prático;

    Covariância entre contraste e ortogonalidade: Exemplos Práticos.

    Princípios Básicos da Experimentação:

    Alguns Conceitos Básicos;

    Princípio da Repetição;

    Princípio da Casualização;

    Princípio do Controle local.

    Fontes de Variação de um Experimento.

    Delineamento Inteiramente Casualizados (DIC):

    Introdução;

    Vantagens e Desvantagens;

    Modelo Estatístico;

    Quadro de Tabulação das Dados;

    Análise de Variância;

    Exemplos Práticos.

    Testes de Comparações de Médias e de Grupos de Médias:

    Introdução;

    Alguns Procedimentos para Comparações Múltiplas:

    Teste de Tukey: Exemplo Prático;

    Teste  de Duncan: Exemplo Prático;

    Teste de Scheffé: Exemplo Prático.

    Vantagens e Desvantagens dos Procedimentos de Comparações Múltiplas;

    Fatores Qualitativos versus Fatores Quantitativos.

    Delineamento em Blocos Casualizados (DBC):

    Introdução;

    Modelo Estatístico;

    Quadro de Tabulação dos Dados;

    Análise de Variância;

    Exemplos Práticos.

    Delineamento em Qualdrado Latino (DQL):

    Introdução;

    Modelo Estatístico;

    Quadro de Tabulação dos Dados;

    Análise de Variância;

    Exemplos Práticos.

    Uso de Computadores em Análises Experimentais:

    Introdução; Montagem do Arquivo de Dados; Modelo apropriado ao Delineamento; Escolha
    do Procedimento apropriado; Gravação dos Arquivos de Saída (output’s) ;Interpretação
    dos Resultados das Análises.'
