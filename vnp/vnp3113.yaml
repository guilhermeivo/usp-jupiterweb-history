  course: "Mercado pet food: tendências e oportunidades;\n•\tFisiologia digestiva\
    \ e comportamento alimentar de cães e gatos: semelhanças e particularidades;\n\
    •\tCarboidratos e fibras na nutrição e alimentação de cães e gatos: metabolismo,\
    \ fontes e recomendações;\n•\tGorduras e ácidos graxos na nutrição e alimentação\
    \ de cães e gatos: metabolismo, fontes e recomendações;\n•\tProteinas e aminoácidos\
    \ na nutrição e alimentação de cães e gatos: metabolismo, fontes e recomendações;\n\
    •\tEnergia: medidas e necessidades; técnicas de avaliação do gasto energético\
    \ em cães e gatos;\n•\tVitaminas, minerais e antioxidantes: necessidades e recomendações;\n\
    •\tManejo nutricional e alimentar nas diferentes fases de vida: crescimento, manutenção,\
    \ gestação, lactação e geriatria;\n•\tNutrição do cão atleta e de trabalho;\n\
    •\tProtocolos de avaliação de alimentos para cães e gatos (digestibilidade, palatabilidade,\
    \ pH urinário e saúde a longo prazo);\n•\tAlimentos comerciais e avaliação de\
    \ rótulo: como diferenciar diferentes alimentos com base nessas informações;\n\
    •\tNoções gerais sobre raças de cães e gatos e particularidades nutricionais relacionadas;\n\
    •\tNoções gerais sobre construções e instalações para canis e gatis de acordo\
    \ com cada fase de vida;\nAtividades práticas:\n•\tCondução de ensaio de digestibilidade\
    \ e pH urinário (aula no canil/gatil);\n•\tAvaliação de escore de condição corporal\
    \ em cães e gatos (aula no canil/gatil);\n•\tAvaliação de escore de massa muscular\
    \ em cães e gatos (aula no canil/gatil);\n•\tVisitas à fábricas de alimentos (empresas);\n\
    Instrumentos e Critérios de Avaliação"
