    \ e gatos: metabolismo, fontes e recomendações;\n•\tEnergia: medidas e necessidades;\
    \ técnicas de avaliação do gasto energético em cães e gatos;\n•\tVitaminas, minerais\
    \ e antioxidantes: necessidades e recomendações;\n•\tManejo nutricional e alimentar\
    \ nas diferentes fases de vida: crescimento, manutenção, gestação, lactação e\
    \ geriatria;\n•\tProtocolos de avaliação de alimentos para cães e gatos (digestibilidade,\
    \ palatabilidade, pH urinário e saúde a longo prazo);\n•\tAlimentos comerciais\
    \ e avaliação de rótulo: como diferenciar diferentes alimentos com base nessas\
    \ informações.\nAtividades práticas:\n•\tCondução de ensaio de digestibilidade,\
    \ palatabilidade e aceitabilidade (aula no canil/gatil);\n•\tAvaliação de escore\
    \ de condição corporal e escore de massa muscular em cães e gatos (aula no canil/gatil);\n\
    •\tCondução de teste de pH urinário (aula no canil/gatil);\n•\tAvaliação de rótulos\
    \ de alimentos (empresas);"
