  course: "Conhecimento do sistema de produção e a suinocultura como um todo. Manejo\
    \ geral e específico nas diferentes fases da criação. Programas de alimentação\
    \ para as fases. Biosseguridade. Dimensionamento do rebanho, quantificação de\
    \ baias e gaiolas.\nTeórico\n1. Introdução ao Estudo dos Suínos e do sistema de\
    \ produção\na) classificação zoológica, origem e domesticação\nb) raças de suínos\n\
    c) objetivos da exploração de suínos\nd) aspectos gerais da suinocultura nacional\
    \ e mundial\n2. Manejo das fêmeas nas diferentes fases do ciclo de produção e\
    \ a relação com o sistema\na) puberdade e idade à reprodução\nb) gestação\nc)\
    \ lactação e  desmame\nd) Conhecimento e análise dos parâmetros de produção\n\
    3. Manejo dos machos reprodutores no ciclo de produção\n4. Manejo dos leitões\
    \ nas fases de creche, recria e terminação\n5. Programa de Alimentação em Suínos\n\
    a)\tPrograma em fêmeas e machos reprodutores no ciclo de produção\nb)\tPrograma\
    \ em leitões no aleitamento, creche, recria e terminação\n6. Seleção de Machos\
    \ e Fêmeas destinados à Reprodução, Renovação do  Plantel e Descarte de Fêmeas\
    \ Improdutivas.\n7. Biosseguridade do sistema de produção\n8. Manejo de dejetos\n\
    9. Construções e Equipamentos\na) dimensionamento do sistema de produção de suínos.\n\
    b) quantificação das baias e equipamentos nas diferentes fases da criação.\nc)\
    \ especificação das principais construções associadas ao dimensionamento da construção"
  course_name: 'VNP3103 - Produção de Suínos

    Swine Production'
  deactivation: ''
  instructors: 10649722 - Cesar Augusto Pospissil Garbossa
  lecture_credits: '2'
  objectives: 'da atividade

    Transmitir conhecimentos na vanguarda da grande área da Nutrição e Produção Animal,
    por meio de minicursos teóricos, práticos e aplicados, para Produtores Rurais,
    Empreendedores e demais profissionais do Setor Produção Animal.

    Descrição da atividade

    A atividade de extensão proposta tem por objetivo oferecer atualizações na área
    grande área da Produção Animal para produtores rurais, empreendedores e demais
    profissionais do Setor da Produção Animal. Os alunos do Curso de Medicina Veterinária
    do 5º semestre, serão responsáveis pela: (i) organização; (ii) divulgação; (iii)
    preparação dos minicursos, palestras, e/ou atividades práticas; (iv) criação dos
    indicadores de avaliação de cada atividades; (v) compilação dos resultados da
    avaliação das atividades; (vi) confecção de relatório final contemplando os pontos
    fortes e fracos de cada atividade e do Evento. Os alunos serão assistidos pelos
    Professores do Departamento ao longo de todo processo.

    Indicadores de avaliação da atividade

    Os indicadores de avaliação das atividades serão realizados por meio questões
    múltipla-escolha (por meio de escalas de cinco pontos), além de duas abertas para
    identificação de pontos fortes e fracos de cada minicurso/palestra/atividade.
    O objetivo é avaliar a eficácia de cada atividade, fornecendo aos participantes
    a opção de avaliar sua experiência em cada atividade. As avaliações serão disponibilizadas
    para os participantes por meio de formulário impresso, link e/ou QR Code, sem
    a necessidade de identificação dos participante.'
