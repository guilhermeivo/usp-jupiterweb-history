  course: "Bubalinocultura\n1-\tImportância da Bubalinocultura;\n2-\tSituação mundial\
    \ e brasileira da Bubalinocultura;\n3-\tRaças e exterior de bubalinos;\n4-\tAdaptação\
    \ e tolerância ambiental;\n5-\tPotencial de bubalinos para produção de leite,\
    \ carne e como produtor de trabalho;\n6-\tInstalações e equipamentos utilizados\
    \ em bubalinocultura;\nCaprinocultura\n1-\tRaças nacionais e estrangeiras de interesse\
    \ no país;\n2-\tFunções econômicas e distribuição pelo país;\n3-\t Instalações\
    \ e equipamentos;\n4-\tCuidados durante a criação;\n5-\tEscrituração zootecnia;\n\
    6-\tProdução de leite.\nOvinocultura\n1-\tRaças nacionais e estrangeiras de interesse\
    \ para o país;\n2-\tFunções econômicas e distribuição pelo país;\n3-\tInstalações\
    \ e equipamentos;\n4-\tCuidados durante a criação;\n5-\tProdução de lã, carne\
    \ e peles;\n6-\tEscrituração zootécnica.\nViagens Técnicas\nVisita a propriedades\
    \ particulares."
  course_name: 'VNP3106 - Produção de Búfalos, Caprinos e Ovinos

    Buffaloes, Sheep and Goat Production'
  deactivation: ''
  instructors: 9124662 - Ricardo Vieira Ventura
  lecture_credits: '2'
  objectives: Demonstrar aos alunos os conceitos gerais relacionados à produção de
    búfalos, caprinos e ovinos e desenvolver a capacidade de avaliação crítica de
    sistema de produção de leite e carne, e das técnicas de manejo e criação empregadas,
    possibilitando formação adequada para o exercício de sua profissão.
  practical_credits: '0'
  total_workload: 30 h
