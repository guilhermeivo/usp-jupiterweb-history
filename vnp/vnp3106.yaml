  course: "Bubalinocultura no Brasil e no Mundo; Raças de Búfalos; Produção de leite\
    \ e carne com bubalinos; Importância da Caprinocultura, Raças de Caprinos; Práticas\
    \ de manejo e criação;  Importância da Ovinocultura, Raças de Ovinos; Práticas\
    \ de manejo e criação.\nBubalinocultura\n1-\tImportância da Bubalinocultura;\n\
    2-\tSituação mundial e brasileira da Bubalinocultura;\n3-\tRaças e exterior de\
    \ bubalinos;\n4-\tAdaptação e tolerância ambiental;\n5-\tPotencial de bubalinos\
    \ para produção de leite, carne e como produtor de trabalho;\n6-\tInstalações\
    \ e equipamentos utilizados em bubalinocultura;\nCaprinocultura\n1-\tRaças nacionais\
    \ e estrangeiras de interesse no país;\n2-\tFunções econômicas e distribuição\
    \ pelo país;\n3-\t Instalações e equipamentos;\n4-\tCuidados durante a criação;\n\
    5-\tEscrituração zootecnia;\n6-\tProdução de leite.\nOvinocultura\n1-\tRaças nacionais\
    \ e estrangeiras de interesse para o país;\n2-\tFunções econômicas e distribuição\
    \ pelo país;\n3-\tInstalações e equipamentos;\n4-\tCuidados durante a criação;\n\
    5-\tProdução de lã, carne e peles;\n6-\tEscrituração zootécnica.\nViagens Técnicas\n\
    Visita a propriedades particulares."
