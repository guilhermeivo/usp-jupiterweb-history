  course_name: 'VNP0241 - Tópicos Avançados em Genética Veterinária

    Advanced Topics in Veterinay Genetics'
  deactivation: 31/12/2025
  instructors: 83636 - Maria de Fatima Martins
  lecture_credits: '2'
  objectives: Discutir através de aulas formais, seminários e visitas técnicas, os
    principais processos envolvidos na Genética Animal com ênfase na Medicina Veterinária.
    Fornecer aos alunos os elementos básicos por identificação dos diferentes parâmetros
    genéticos.
