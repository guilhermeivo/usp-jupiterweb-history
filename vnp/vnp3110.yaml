  course: "Teóricos:\n•\tImportância das pastagens para a pecuária.\n•\tAnatomia e\
    \ fisiologia de plantas forrageiras.\n•\tPrincípios do manejo de plantas forrageiras\
    \ tropicais.\n•\tManejo de cultivares de Panicum e Pennisetum.\n•\tAspectos de\
    \ adubação de plantas forrageiras.\n•\tIrrigação de pastagens.\n•\tManejo intensivo\
    \ da Brachiaria e Cynodon.\n•\tVolumosos suplementares.\nPrático:\n•\tReconhecimento\
    \ de espécies forrageiras.\n•\tOrçamentação forrageira."
