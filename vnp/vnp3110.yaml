  course: "Teóricos:\n•\tImportância das pastagens para a pecuária e produção sustentável.\n\
    •\tAnatomia e fisiologia de plantas forrageiras.\n•\tPrincípios do manejo de plantas\
    \ forrageiras tropicais e temperadas.\n•\tManejo das pastagens e capineiras cultivares\
    \ de Panicum e Pennisetum.\n•\tConservação de forragens\n•\tManejo intensivo da\
    \ Brachiaria e Cynodon.\n•\tVolumosos suplementares.\nPrático:\n•\tDeterminação\
    \ da matéria seca\n•\tReconhecimento de espécies forrageiras.\n•\tProdução de\
    \ silagem\n•\tOrçamentação forrageira.\nInstrumentos e Critérios de Avaliação"
  course_name: 'VNP3110 - Agrostologia

    Forages'
  deactivation: ''
  instructors: 6968672 - Nara Regina Brandão Cônsolo
  lecture_credits: '2'
  objectives: 'da atividade

    Transmitir conhecimentos na vanguarda da grande área de Agrostologia e Nutrição
    e Produção Animal. Capacitar os participantes sobre as principais tendências e
    tecnologias das áreas em questão, por meio do oferecimento de atividades de extensão,  minicursos
    teóricos, práticos e aplicados, para Produtores Rurais, Empreendedores e demais
    profissionais do Setor Produção Animal.

    Descrição da atividade

    Objetiva-se nesta atividade atualizar e treinar na área de Agrostologia e Produção
    animal os produtores rurais, associados de Cooperativas, empreendedores e demais
    profissionais deste Setor. Os estudantes do Curso de Medicina Veterinária do 5º
    semestre, serão responsáveis pela: (i) organização; (ii) divulgação; (iii) preparação
    dos minicursos, palestras, e/ou atividades práticas; (iv) criação dos indicadores
    de avaliação de cada atividades; (v) compilação dos resultados da avaliação das
    atividades; (vi) confecção de relatório final, sob orientação do professor responsável
    pela disciplina.

    Indicadores de avaliação da atividade

    Os indicadores de avaliação das atividades serão realizados com questões múltipla-escolha
    (por meio de escalas de cinco pontos), além de duas abertas para identificação
    de pontos fortes e fraquezas de cada minicurso/palestra/atividade. Assim, haverá
    a possibilidade de avaliar a eficácia das atividades propostas, fornecendo aos
    participantes a opção de analisar sua experiência em cada atividade. As avaliações
    serão disponibilizadas para os participantes por meio de formulários, por ex:
    google forms, sem a identificação dos participantes, necessariamente.'
