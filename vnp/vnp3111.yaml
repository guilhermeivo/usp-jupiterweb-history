  course: 'Introdução a Sociologia.

    Objeto da Sociologia; conceitos básicos; a Sociologia no Brasil; bases para o
    estudo da Sociologia Rural.

    O pensamento sociológico clássico.

    Desenvolvimento econômico e social.

    Desenvolvimento rural e sustentabilidade.

    Breve histórico da agricultura brasileira.

    O agronegócio brasileiro.

    Introdução à Extensão.

    Trajetória e histórico da Extensão Rural no Brasil; desafios e perspectivas para
    o futuro.

    Processos de comunicação e de ensino-aprendizagem; métodos em extensão rural.

    Movimentos sociais, conflitos; a questão agrária no Brasil.

    A relação homem x animal nos sistemas de produção: a questão do bem-estar animal
    do ponto de vista socioeconômico.

    Políticas atuais de desenvolvimento rural.'
  course_name: 'VNP3111 - Sociologia e Extensão

    Sociology and Extension'
  deactivation: ''
  instructors: 2150307 - Augusto Hauber Gameiro
  lecture_credits: '2'
  objectives: Fornecer aos alunos fundamentos da Sociologia aplicados à profissão
    do Médico Veterinário e discutir a prática da extensão e os processos de difusão
    de inovações tecnológicas, com ênfase na produção animal.
