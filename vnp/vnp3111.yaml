    Atividades de Extensão

    Grupo social alvo da atividade

    O grupo social será definido pelos grupos de trabalho, com o apoio do professor.
    É exigência básica que o grupo alvo seja especificamente definido, em função do
    tipo de conteúdo a ser gerado pelos alunos em sua atividade extensionista. Exemplos
    de grupos sociais são: i) produtores rurais; ii) consumidores; iii) estudantes
    de diferentes níveis acadêmicos; iv) técnicos e profissionais; e/ou v) população
    no geral.'
  course: 'Introdução a Sociologia.

    Objeto da Sociologia; conceitos básicos; a Sociologia no Brasil; bases para o
    estudo da Sociologia Rural.

    O pensamento sociológico clássico.

    Desenvolvimento econômico e social.

    Desenvolvimento rural e sustentabilidade.

    Breve histórico da agricultura brasileira.

    O agronegócio brasileiro.

    Introdução à Extensão.

    Trajetória e histórico da Extensão Rural no Brasil; desafios e perspectivas para
    o futuro.

    Processos de comunicação e de ensino-aprendizagem; métodos em extensão rural.

    Movimentos sociais, conflitos; a questão agrária no Brasil.

    A relação homem x animal nos sistemas de produção: a questão do bem-estar animal
    do ponto de vista socioeconômico.

    Políticas atuais de desenvolvimento rural.

    Instrumentos e Critérios de Avaliação'
  course_name: 'VNP3111 - Sociologia e Extensão

    Sociology and Extension'
  deactivation: 31/12/2025
  instructors: 2150307 - Augusto Hauber Gameiro
  lecture_credits: '2'
  objectives: 'da atividade

    A atividade extensionista vinculada a esta disciplina tem como objetivo principal
    proporcionar ao estudante a vivência e a experiência de, junto à sociedade e seus
    diferentes segmentos – portanto, fora do ambiente universitário –, identificar
    problemas relacionados à prática da Medicina Veterinária e, a partir dessa identificação,
    discutir, refletir, gerar conhecimento a respeito e retornar à sociedade o conteúdo
    elaborado com possíveis soluções, respostas ou encaminhamentos pertinentes ao
    problema identificado.

    Descrição da atividade

    Organizados em grupos de quatro estudantes, eles devem – com o auxílio do professor
    desta e de outras disciplinas – identificar problemas relacionados à prática da
    Medicina Veterinária. Essa busca deve ser feita externamente à Universidade, ainda
    que possa ser embasada em conteúdo publicado nos mais diferentes meios. Uma vez
    identificado o problema, o público-alvo do conteúdo a ser gerado deverá ser definido
    pelos alunos. A partir da interação com as pessoas envolvidas a campo e mediante
    pesquisa técnica e científica a respeito do problema, os estudantes devem gerar
    um roteiro com a fundamentação teórica e com a proposta de elaboração de conteúdo.
    Sugere-se que o conteúdo seja colocado em formato eletrônico, como vídeos ou áudios.
    Conteúdo de divulgação como cartazes, folders e cartilhas também são recomendados.  O
    conteúdo produzido é então levado à sociedade pelo próprio grupo, e disponibilizado
    amplamente pelos canais de comunicação da Universidade.

    Indicadores de avaliação da atividade

    Serão avaliados os seguintes elementos dos trabalhos de extensão: i) proposta;
    ii) fundamentação teórica; iii) qualidade do conteúdo gerado; iv) formato e estética
    do conteúdo; v) atendimento geral à proposta original.'
