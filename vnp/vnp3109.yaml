  bibliography: 'Complementar

    Essa bibliografia básica indicada acima não tem a pretensão de suprir todas as
    necessidades para a formação profissional do médico veterinário que queira atuar
    na área do melhoramento genético animal. Recomenda-se aos alunos leitura de periódicos
    especializadas, tais como: Animal Genetics, Journal of Animal Science, Journal
    of Dairy Science, Livestock Production, Genetic, Selection and Evolution, Journal
    Animal Breeding and Genetics, BMC Genetics, BMC Genomics, dentre outros, visando
    complementação e evolução dos tópicos discutidos em aula.

    Atividades de Extensão

    Grupo social alvo da atividade

    Produtores Rurais, Empreendedores e demais profissionais relacionadas à grande
    área do Setor de Produção Animal.'
