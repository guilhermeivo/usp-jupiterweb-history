  course: 'Introdução e Aspectos Históricos.

    Evolução do Melhoramento Animal.

    Conceitos Básicos em Genética de Populações e Quantitativa

    - Cálculo de Frequências Genotípicas e Gênicas

    - Teorema de Hardy-Weinberg

    - Fatores que alteram as Frequências Gênicas e Genotípicas

    Conceitos Básicos em Estatística e Quantitativa

    - Comparação de Caracteres Qualitativos versus Quantitativos

    - Estatística aplicada ao Melhoramento (medidas de tendência central, medidas
    de dispersão e de relacionamento entre variáveis)

    - Modelo aditivo-dominate

    - Parâmetros genéticos e fenotípicos (Métodos de Estimação de herdabilidade; Variação
    dentro de Linha Isogênica. Regressão dos Valores Fenotípicos dos Progenitores
    e das Progênies; Decomposição da Variação Total por meio de Momentos)'
  course_name: 'VNP3109 - Melhoramento Animal

    Animal Breeding'
