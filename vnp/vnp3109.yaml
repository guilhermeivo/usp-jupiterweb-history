  lecture_credits: '2'
  objectives: Estudo de bases e métodos de melhoramento genético animal, aplicados
    a  sistemas de produção dos animais domésticos, oferecendo subsídios ao exercício
    profissional e qualificando-o para a exploração e remanejamento genético de animais
    destinados à produção animal.
