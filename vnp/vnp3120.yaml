  course: 'Situação atual da qualidade do leite e controle de mastite no Brasil;

    Diagnóstico de situação da mastite clínica e subclínica em rebanhos leiteiros;

    Principais indicadores de monitoramento de mastite clínica e subclínica de rebanhos;

    Perdas de produção causadas pela mastite e impactos sobre a qualidade do leite;

    Custos e prejuízos causados pela mastite clínica e subclínica;

    Principais agentes causadores de mastite;

    Principais medidas de manejo de ordenha;

    Principais medidas de controle de mastite contagiosa e ambiental.'
  course_name: 'VNP3120 - Qualidade do leite e controle de mastite bovina

    Milk quality and bovine mastitis control'
  deactivation: ''
  instructors: 1203273 - Marcos Veiga dos Santos
  lecture_credits: '2'
  objectives: 'Que o aluno seja capaz de: a) descrever a situação atual da qualidade
    do leite e controle de mastite no Brasil; b) diagnosticar a situação da mastite
    clínica e subclínica em rebanhos leiteiros; c) analisar os principais indicadores
    de monitoramento de mastite clínica e subclínica de rebanhos; d) estimar perdas
    de produção causadas pela mastite e impactos sobre a qualidade do leite; estimar
    custos de mastite clínica e subclínica; e) descrever os principais agentes causadores
    de mastite; f) descrever as principais medidas de manejo de ordenha; g) descrever
    as principais medidas de controle de mastite contagiosa e ambiental.'
