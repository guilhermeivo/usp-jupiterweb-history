    O mercado de produtos (alimentos, medicamentos, acessórios) para pets;

    Desenvolvimento de SKAs (Skills, Knowledge, Aptitudes and Attitudes) de Médicos
    Veterinários;

    Planejamento estratégico e as metas SMART para negócios do segmento pet;

    Instalação e gestão de clínica veterinária;

    Administração de hospitais veterinários; e

    Administração de pet shops.'
