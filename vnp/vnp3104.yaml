  course: '- Introdução a Equideocultura

    - Classificação zoológica, origem e domesticação.

    - População e importância econômica para o Brasil e demais países

    - Caracterização racial

    - Introdução ao estudo do exterior do cavalo

    - Andamentos dos equinos

    - Podologia equina

    - Escolha de raças e reprodutores

    - Implantação de um haras

    - Instalações e equipamentos de um haras

    - Manejo reprodutivo

    - Manejo nutricional

    - Manejo sanitário

    - Cuidados com os potros recém-nascidos

    - Manejo de potros do nascimento à doma

    - Escrituração zootécnica de equinos

    - Avaliação econômica de sistemas de produção de equinos

    - Utilização do cavalo no esporte

    - Criação de jumentos e muares'
  course_name: 'VNP3104 - Produção de Equinos

    Equine Science'
  deactivation: ''
  instructors: 94103 - Alexandre Augusto de Oliveira Gobesso
  lecture_credits: '2'
  objectives: Capacitar o aluno para a implantação e avaliação de sistemas de produção
    no que diz respeito aos aspectos de criação, visando maior produtividade de equídeos,
    oferecendo-lhes subsídios para o exercício adequado de sua profissão. Proporcionar
    amplo entendimento dos princípios biológicos e desenvolver a capacidade de incorporar
    o uso destes princípios para a indústria do cavalo. Uma compreensão de princípios
    de negócios/econômico e sua aplicação às empresas de equídeos. Capacidade de avaliar
    criticamente questões indústria equina e propor a resolução de problemas e habilidades
    de liderança que melhoram o sucesso profissional.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
