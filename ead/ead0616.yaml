  course_name: 'EAD0616 - Teoria das Organizações

    Organization Theory'
  deactivation: ''
  instructors: '205694 - Cláudio Antonio Pinheiro Machado Filho

    2109999 - Fabio Lotti Oliva'
  lecture_credits: '2'
  objectives: '-Reconhecer as principais teorias organizacionais, descrevendo os principais
    conceitos de cada teoria.

    -Analisar as teorias e conceitos, resolvendo casos da atualidade.

    -Aplicar as diferentes perspectivas da administração, implementando-as na tomada
    de decisão das organizações.

    -Estimular a aprendizagem por meio da resolução de problemas, analisando-os a
    partir das teorias organizacionais.

    -Promover a troca de ideias,   experimentando soluções inovadoras nas práticas
    organizacionais.

    -Criar um ambiente que estimule o(a) aluno(a) a pesquisar, aprofundar e criticar
    por si mesmo(a), produzindo pensamento crítico.

    -Compreender os princípios éticos, explicando a importância da sua adoção nas
    organizações.

    -Reconhecer os principais conceitos relacionados aos aspectos sociais e ambientais
    advindos das teorias organizacionais, identificando-os nas organizações.

    -Aplicar os conhecimentos transmitidos nas aulas, realizando um conjunto de atividades
    entre os alunos, dentro e fora da sala de aula.

    -Implementar um ambiente favorável à diversidade, demonstrando a sua importância
    nos mais variados aspectos.

    -Expressar as ideias de acordo com as diversas perspectivas da administração,
    usando-as de forma clara e objetiva em suas intervenções orais.

    -Expressar as ideias de acordo com as diversas perspectivas da administração,
    usando-as de forma clara e objetiva nos textos produzidos

    -Diferenciar os fundamentos da administração, investigando, por meio das ferramentas
    tecnológicas, como se aplicam na atualidade organizacional.'
  practical_credits: '1'
  total_workload: 60 h
