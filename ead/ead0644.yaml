  course: 'Promoção

    · Processo de comunicação persuasiva

    · Composto de comunicação persuasiva

    - Propaganda

    - Venda pessoal

    - Publicidade / Relações Públicas

    - Venda pessoal (a força de vendas)

    - Campanhas promocionais

    - Agências de propaganda

    Distribuição / Canais

    · Estrutura do canal e a distribuição física

    · Canais de Marketing como sistemas sociais: poder, liderança, conflitos

    · Gerenciamento de canais

    · Logística em canais de Marketing

    · Processo de distribuição física

    · Tendências na distribuição física e a influência da internet

    · Varejo e atacado'
  course_name: 'EAD0644 - Decisões de Promoção, Distribuição / Canais

    Distribution/Channels and Promotion Decisions'
  deactivation: ''
  lecture_credits: '2'
  objectives: · Estudar as técnicas utilizadas na tomada de decisões de marketing
    à luz dos conceitos postulados na disciplina "marketing básico". Analisar as principais
    decisões da Administração de Marketing e sua problemática no contexto empresarial.
    Introduzir conceitos e analisar problemas de alguns campos específicos de Marketing
    referentes a Promoção e Distribuição/Canais
  practical_credits: '0'
  total_workload: 30 h
