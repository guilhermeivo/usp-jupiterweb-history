  course: 'Conceito de Simulação

    Números aleatório e pseudo-aleatório

    Distribuição de probabilidade

    Geração de variáveis estocásticas

    Modelo de Monte Carlo (Simulação)

    Simulação a Eventos Discretos

    Aplicações e Uso de softwares

    Simulation Concept

    Random and pseudo-random numbers

    Probability distribution

    Generation of stochastic variables

    Monte Carlo Model (Simulation)

    Simulation of Discrete Events

    Applications and Use of Software'
  course_name: 'EAD0652 - Modelos de Simulação

    Simulation Models'
  deactivation: ''
  instructors: 105091 - Adriana Backx Noronha Viana
  lecture_credits: '2'
  objectives: '- Compreender problemas que podem ser resolvidos por meio da simulação,
    identificando a diferença entre modelos analíticos e simulação;

    - Recordar do framework apresentado na solução de problemas envolvendo a simulação,
    identificando cada parte do framework na solução de problemas

    - Estimar uma solução ou alternativa para o problema ou situação estudada, justificando
    as decisões ou escolhas realizadas

    - Enumerar os tipos de variáveis existentes, identificando suas respectivas distribuições
    de probabilidade;

    - Diferenciar solução analítica e numérica, categorizando problemas a serem resolvidos;

    - Classificar as variáveis existentes nos problemas propostos, inferindo que distribuição
    de probabilidade deverá ser considerada

    - Reconhecer qual o tipo de simulação deve ser utilizado enumerando os tipos de
    simulação existentes e as perguntas-chave para a classificação das simulações;

    - Utilizar funções do Excel para gerar valores para as variáveis identificadas
    nos problemas propostos, executando possíveis cenários para o problema em estudo;

    - Organizar os resultados gerados pelo processo de simulação de forma visual (gráficos
    de dispersão, gráficos de tendência, tabela de dados, entre outros), concluindo
    (obtendo) a solução para o problema em estudo;

    - Analisar o impacto das variáveis selecionadas no resultado do objetivo final
    da simulação selecionando melhores combinações ou possibilidades em relação aos
    valores das variáveis;

    - Criar novos cenários para uma situação problema, produzindo melhorias para a
    solução encontrada.

    - Julgar se o modelo de simulação utilizado retrata satisfatoriamente o problema
    proposto, determinando uma solução possível para o problema em estudo;

    - Refletir se o problema proposto foi solucionado de maneira adequada verificando
    outras soluções possíveis;

    - Desenvolvimento de trabalho em grupo para Interpretar e selecionar modelos que,
    em determinadas circunstâncias, melhor retratam uma situação (ou problema).

    - Elaborar apresentação aos colegas de solução encontrada, produzindo vídeo com
    resolução e demais explicações

    - Executar modelos de simulação utilizando-se as planilhas eletrônicas do Microsoft
    Excel.'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
