  course: 'Jornada do cliente e Comportamento do consumidor

    Processo decisório do consumidor: reconhecimento de necessidade, busca de informações,
    avaliação de alternativas, compra, consumo, avaliação da satisfação, descarte.

    Influências no processo decisório do consumidor: grupos e mídias sociais, características
    demográficas, renda, cultura e classe social.

    Jornada do cliente em ambientes digitais

    Obtendo insights sobre o consumidor

    Processo da pesquisa de marketing'
  course_name: 'EAD0747 - Insights do Consumidor

    Consumer Insights'
  deactivation: ''
  instructors: '403396 - Andres Rodriguez Veloso

    68872 - Jose Afonso Mazzon'
  lecture_credits: '2'
  objectives: 'Selecionar as opções mais adequadas para obter insights sobre o comportamento
    do consumidor a partir da seleção dos métodos de pesquisa e coleta de dados.

    Desenvolver habilidades de análise de problemas e a capacidade de traduzir um
    problema de gerenciamento em uma questão de pesquisa viável.

    Analisar de que forma os estudos de comportamento do consumidor podem afetar o
    bem-estar.

    Criar um projeto aplicado de pesquisa de marketing para obter insights do consumidor
    que ajudem a empresa a resolver um problema gerencial de marketing.

    Compreender termos técnicos utilizados na pesquisa de mercado e na análise do
    comportamento do consumidor.'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
