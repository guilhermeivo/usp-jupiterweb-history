  objectives: 'APRESENTAÇÃO DA DISCIPLINA:

    A disciplina análise da decisão aborda a teoria prescritiva (teoria da decisão)
    e descritiva (vieses comportamentais) de forma complementar, de forma que o aluno
    seja capaz de delinear um problema decisório de forma racional, decompondo-o em
    elementos fundamentais, e avaliando a melhor alternativa a ser tomada, considerando
    possíveis influências de questões comportamentais que possam comprometer o resultado
    da decisão.

    OBJETIVOS DE APRENDIZAGEM:

    Ao final da disciplina espera-se que o aluno seja capaz de reconhecer e estruturar
    um problema decisório, aplicar técnicas para tomada de decisão e identificar possíveis
    vieses comportamentais envolvidos no processo decisório, ou seja:

    1. Reconhecer um problema decisório no âmbito organizacional e pessoal;

    2. Compreender os elementos envolvidos no processo decisório;

    3. Estruturar um problema decisório, envolvendo decisões, alternativas e estados
    da natureza;

    4. Reconhecer uma decisão a ser tomada sob certeza;

    5. Reconhecer uma decisão a ser tomada sob risco;

    6. Aplicar técnicas analíticas para tomada da decisão (valor esperado, teorema
    de bayes, utilidade, dominância);

    7. Reconhecer vieses comportamentais envolvidos no processo decisório;

    8. Refletir sobre implicações dos vieses comportamentais no resultado da decisão;
    e

    9. Refletir sobre potenciais e limitações da teoria da decisão.'
