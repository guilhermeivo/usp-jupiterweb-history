  course: '· A importância da pesquisa para Marketing

    · processo de pesquisa

    · Tipos e métodos de pesquisa

    · Tipos, fontes e formas de coleta de dados

    · Dimensionamento de amostras

    · Medidas e escalas

    · Técnicas de amostragem

    · Verificação, digitação e processamento dos dados

    · Métodos de análise paramétricos

    · Métodos de análise não paramétricos

    · Projeto de pesquisa

    · Análise e apresentação dos resultados'
  course_name: 'EAD0647 - Sistema de Informações de Marketing e Pesquisa de Marketing

    Marketing Information System and Marketing Research'
  deactivation: ''
  lecture_credits: '2'
  objectives: '· Desenvolver a capacidade de analisar problemas empresariais e a habilidade
    para traduzi-los em problemas gerenciais específicos que possam ser resolvidos
    com a ajuda de pesquisa.

    · Levar aos participantes os conhecimentos dos conceitos, métodos e técnicas de
    pesquisa, aplicados a Marketing e a outras áreas de Administração.

    · Desenvolver nos participantes a capacidade de planejar a executar pesquisas,
    bem como a de avaliar as qualidades de um projeto de pesquisa.'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
