  lecture_credits: '4'
  objectives: '-Entender o papel do gestor

    -Entender o papel da função produção nas organizações, explicando como recursos
    são geridos de forma a entregar produtos e serviços.

    -Entender o papel do gestor nas organizações, compreendendo como sua atuação pode
    impactar nos resultados da empresa

    -Compreender o papel das organizações, descrevendo o impacto sócio ambiental dos
    processos

    -Trabalhar em equipe, avaliando o processo de colaboração no desenvolvimento do
    projeto.'
