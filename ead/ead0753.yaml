  course_name: 'EAD0753 - Transformação Digital e Negócios Digitais nas Organizações

    Digital Transformation and Digital Business in Organizations'
  deactivation: ''
  instructors: 606684 - Cesar Alexandre de Souza
  lecture_credits: '2'
  objectives: 'Compreender os conceitos envolvidos na elaboração e apresentação de
    novos modelos de negócio digitais e desenvolver a capacidade de elaboração dos
    mesmos.

    Compreender os impactos das tecnologias digitais disruptivas e emergentes (p,ex
    Blockchain, Smart Robots, Big Data, Inteligência Artificial, Internet of Things,
    Realidade Virtual/Aumentada, Veículos Autônomos...) nas organizações, nos seus
    modelos de negócio e na sociedade.

    Discutir os impactos das tecnologias de redes sociais, Web 2.0 e novas mídias
    digitais nas organizações e na sociedade, bem como seus aspectos éticos.

    Discutir os impactos das tecnologias de redes sociais, Web 2.0 e novas mídias
    digitais nas organizações e na sociedade, bem como seus aspectos éticos.

    Realizar trabalho semestral em grupo envolvendo a proposta e apresentação de modelo
    de negócio digital baseado em tecnologia digital

    Realizar a apresentação do trabalho semestral no formato de “pitch”

    Desenvolver relatório escrito apresentado o modelo de negócios proposto no trabalho
    semestral.

    Compreender os conceitos atuais relacionados à aplicação de Sistemas de Informação
    e Tecnologias de Informação Digitais (TDs) e seu uso estratégico em organizações
    e em novos modelos de negócios digitais (NMND).'
  practical_credits: '0'
  total_workload: 30 h
