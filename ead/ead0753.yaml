  course_name: 'EAD0753 - Sistemas de Informações Empresariais e Negócios Digitais

    Business Information Systems and Digital Business'
  deactivation: ''
  lecture_credits: '2'
  objectives: "Apresentar visão sobre Sistemas e Tecnologias de Informação (TI) e\
    \ conceitos atuais relacionados à aplicação e uso estratégico da Web e da TI nas\
    \ organizações e na sociedade. Avaliar o potencial de inovação contínua e de ruptura\
    \ para os negócios trazidos por novas tecnologias de informação. Apresentar e\
    \ discutir os sistemas empresariais da atualidade \x96 ERP / CRM / BI / e-commerce\
    \ / social-commerce / mobile-commerce. Apresentar e discutir os impactos das novas\
    \ tecnologias de redes sociais e Web 2.0 nas organizações e na sociedade, bem\
    \ como seus aspectos éticos."
