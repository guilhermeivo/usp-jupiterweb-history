  course: 'Megatendências e o Processo Gerencial de Marketing

    O Sistema de Marketing nas Perspectivas Operacional e Estratégica

    Valor sob a Ótica de Marketing e Orientação para o Mercado

    Evolução do Pensamento Estratégico e do Marketing na Organização

    Estratégia: Estratégia de Crescimento e Estratégica Competitiva e sua interface
    com Marketing Estratégico.

    Segmentação de Mercado e Posicionamento Estratégico de Marketing

    Planejamento estratégico de marketing'
  course_name: 'EAD0744 - Enfoque Estratégico de Marketing

    Marketing Strategic Approach'
  deactivation: ''
  instructors: 2974821 - Kavita Miadaira Hamza
  lecture_credits: '2'
  objectives: 'Compreender princípios e processos do Marketing Estratégico.

    Desenvolver, na prática, os processos estratégicos de segmentação de mercado e
    posicionamento de marketing.

    Compreender e avaliar a interação das estratégias de crescimento e competitiva
    e o marketing estratégico.

    Realizar, para cada tópico abordado, uma tarefa de aplicação em grupo

    Apresentar por escrito todas as tarefas realizadas e casos propostos'
