  course: '· O plano de marketing como elemento componente do plano corporativo da
    empresa

    · O processo de planejamento e a preparação do plano de marketing

    · Modelos e técnicas usadas para a preparação do plano de marketing

    · Base de dados para a preparação do plano de marketing

    · Análise de situações: análise dos pontos fortes e fracos e a identificação de
    ameaças e oportunidades

    · Estabelecimento dos objetivos e metas de marketing

    · Estratégias, táticas e planos de ação

    · Plano de ação: produção (propaganda, merchandising, relações públicas, promoção
    de vendas)

    · Plano de ação: venda pessoal

    · Plano de ação: distribuição (canais e distribuição física)

    · Preparação de orçamento e demonstrativos financeiros

    · Redação do documento do plano de marketing'
  course_name: 'EAD0446 - Planejamento e Controle de Marketing

    Marketing Planning and Control'
