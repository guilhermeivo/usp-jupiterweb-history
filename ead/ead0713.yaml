  course: "O programa será desenvolvido mediante exposição e discussão dos temas de\
    \ cada encontro por meio da utilização de seminários e preleções do professor.\
    \ Contempla-se também a utilização de audiovisuais e palestras de especialistas\
    \ com atuação em negócios internacionais. Exercícios e trabalhos práticos que\
    \ facilitem a assimilação dos conteúdos, dentro de um processo ativo e centrado\
    \ nos interesses específicos de pesquisa do aluno serão desenvolvidos. Dessa maneira,\
    \ vislumbra-se:\na)\tBoa preparação das aulas pelo professor sistematizando conteúdos\
    \ e, para uma maior assimilação dos mesmos pelos alunos, uma cuidadosa atenção\
    \ às dinâmicas adotadas quando da sua exposição;\nb)\tFrequente participação e\
    \ dedicação do aluno em discussões e apresentações estruturadas em classe, envolvendo\
    \ respostas a questões sobre o conteúdo das leituras recomendadas com a devida\
    \ antecedência;\nc)\tElaboração de breves resenhas sobre as leituras recomendadas,\
    \ de um livro sobre negócios internacionais recentemente publicado em português\
    \ ou inglês e elaboração de um artigo científico seguindo as orientações aos autores\
    \ recomendadas pelo SEMEAD."
  course_name: 'EAD0713 - Gestão de Negócios Internacionais

    Management of International Business'
  deactivation: ''
  lecture_credits: '2'
  objectives: "A disciplina busca expor aos estudantes significativas oportunidades\
    \ de desenvolvimento de habilidades de argumentação oral e escrita por meio da\
    \ discussão de temas acadêmicos e experiências empresariais relacionados com a\
    \ gestão de negócios internacionais, buscando motivar os alunos para:\na)\tInternalizar\
    \ as principais teorias, conceitos e técnicas relacionadas com a gestão de negócios\
    \ internacionais;\nb)\tExpandir aptidões para o desenvolvimento de estudos, competências\
    \ e pesquisas em negócios internacionais;\nc)\tBuscar um maior entendimento sobre\
    \ o processo de internacionalização das empresas brasileiras e latino-americanas\
    \ contrastado com as experiências asiáticas de desenvolvimento industrial;"
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
