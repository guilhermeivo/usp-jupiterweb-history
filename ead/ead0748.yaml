courses:
  activation: 01/01/2023
  assessment: O aluno será submetido a uma avaliação cuja nota terá peso de 50% na
    média final.
  bibliography: 'Complementar

    Blacharski, Dan. (2017). Born In The Cloud Marketing: Transformative Strategies
    for the Next Generation of Cloud-Based Businesses. ManhattanBay Media.

    Berger, J. (2016). Contagious: Why things catch on. Simon and Schuster.

    Eyal, N. (2014). Hooked: How to build habit-forming products. Penguin.

    Galloway, S. (2021). Post Corona. Plataforma.

    Kalbach, J. (2020). Mapping experiences. O''Reilly Media.

    Kiso, R. (2021). Unbound Marketing: Como construir uma estratégia exponencial
    usando o marketing em ambiente digital. DVS Editora.

    McKinsey Chief Marketing & Sales Officer Forum. (2014). Big Data, Analytics, and
    the Future of Marketing & Sales. McKinsey & Company.

    Sarkar, Christian; Kotler, Philip. (2018). Brand Activism: From Purpose to Action.
    IDEA BITE PRESS.'
  course: '1- Tópicos de segmentação, targeting e posicionamento no marketing digital

    - Funil de vendas e de marketing

    - Jornada do cliente no ambiente digital

    - Momento da verdade e micro momentos

    - Persona e perfil do comprador

    - Geospacial data e geocoding

    - Netnografia

    2 - Implicações digitais na oferta de produtos

    - Administração da experiência do cliente

    - Jobs-To-Be-Done (JTBD)

    - Scrum, Design-to-value (DTV)

    - Darwinismo Digital, Hiperciclo do produto e Chasm

    3- Implicações digitais nas estratégias de preços

    - Otimização dinâmica de preços

    4- Implicações digitais no gerenciamento da distribuição

    - Marketplace

    - Ominichannel

    - Distribuição colaborativa por aplicativos

    5- Desafios digitais na comunicação de marketing

    - Social Media Marketing

    - Eventos, experiencias, influenciadores e patrocínios no mundo virtual

    - Contágio de ideias, memes e buzz marketing

    - Elemento criativo na comunicação digital

    - Google ads

    6- Valor na marca na era digital

    - Engajamento digital da marca

    - Elementos digitais da marca

    7- Princípios de marketing analítico

    - Apresentação de softwares de marketing analítico

    - Métricas de marketing analítico

    - Martech'
  course_name: 'EAD0748 - Marketing Digital

    Digital Marketing'
  deactivation: ''
  instructors: '3454983 - Edson Crescitelli

    2975141 - Guilherme de Farias Shiraishi'
  lecture_credits: '2'
  objectives: 'Explicar o conceito de marketing digital, com base na literatura de
    administração de marketing e comportamento do consumidor/comprador.

    Investigar aplicações de marketing digital na administração de marketing das organizações

    Analisar níveis de implantação do marketing digital em casos didáticos

    Reconhecer as técnicas de marketing digital que potencializam o processo de inovação
    das organizações

    Colaborar na realização de um vídeo temático no qual são expostos conceitos de
    marketing digital.

    Avaliar vieses de aplicação tecnológica relacionados a elementos físicos e de
    expressão de minorias na oferta de bens e serviços

    Gravar um vídeo sobre o uso de marketing digital

    Pesquisar informações sobre marketing digital

    Reconhecer interfaces de sistemas de TI no uso de marketing digital'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
