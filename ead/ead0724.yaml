  course: "\x95\tDesafios para o desenvolvimento sustentável no Brasil: características\
    \ econômicas, sociais, políticas e culturais.\n\x95\tResponsabilidade Social Corporativa\
    \ e Sustentabilidade: conceitos, práticas, avaliação.\n\x95\tO campo de Empreendedorismo\
    \ Social\n\x95\tNegócios Sociais:  tipologia e histórico\n\x95\tAtores envolvidos\
    \ no campo de Negócios Sociais: aceleradoras, investidores, incubadoras, organizações\
    \ da sociedade civil, empresas e governo\n\x95\tGestão de Negócios Sociais:  princípios\
    \ e estratégias"
  course_name: 'EAD0724 - Responsabilidade Social e Empreendedorismo Social

    Social Responsibility and Social Entrepreneurship'
  deactivation: ''
  lecture_credits: '2'
  objectives: "\x95\tIntroduzir o referencial teórico-conceitual do Empreendedorismo\
    \ Social no contexto de Desenvolvimento Sustentável;\n\x95\tAnalisar as condições\
    \ e características da emergência dos negócios sociais, suas potencialidades e\
    \ limitações;\n\x95\tIdentificar os desafios de gestão dos empreendimentos com\
    \ finalidades sociais e ambientais e as possibilidades de aplicação dos conhecimentos,\
    \ métodos e técnicas consagrados na Administração de Organizações;\n\x95\tAnalisar\
    \ os principais processos de gestão dos empreendimentos sociais: liderança, comunicação,\
    \ estratégia, mensuração de resultados e impacto social e econômico."
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
