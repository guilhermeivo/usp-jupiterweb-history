  assessment: 'Três avaliações  incluindo uma prova inicial,  a prova unificada e
    um seminário sobre aspectos  da economia brasileira.

    Haverá prova substitutiva apenas para quem perder uma das 2  provas.'
  bibliography: 'Fundamentalmente artigos publicados na imprensa que o professor recomendará
    ao longo do curso. Especialmente  “Economist”, revista Exame e jornal “Valor Economico
    “

    Feldmann, P.R. Management in Latin America. Springer . 2014

    Bresser Pereira , Oreiro e Marconi . “Macroeconomia Desenvolvimentista- Teoria
    e Politica do Novo Desenvolvimentismo” Elsevier. 2016

    Bresser Pereira, “Em busca do desenvolvimento perdido” . FGV. 2018

    Carvalho, Laura. “Valsa Brasileira”. Editora Todavia. 2018'
  course: "1.\tEvolução histórica do Brasil e análise dos fatores econômicos que moldaram\
    \ o país.\n2.\tConjuntura econômica Brasileira atual em uma perspectiva macroeconômica.\n\
    3.\tO Brasil no cenário internacional.\n4.\tA importância da microeconomia no\
    \ desenvolvimento econômico das Nações.\n5.\tO ambiente para negócios no Brasil.\n\
    6.\tA disponibilidade de infraestrutura- energia, transportes, telecomunicações,\
    \ etc.\n7.\tEstado da arte da tecnologia e da inovação. Principais polos geradores\
    \ e maiores deficiências.\n8.\tPapel do governo, do poder judiciário e do aparato\
    \ Legal.\n9.\tCadeias de valor significativas na conjuntura Brasileira. Análise\
    \ de fornecedores, clientes e distribuidores.\n10.\tAs dificuldades da pequena\
    \ e da microempresa Brasileiras.\n11.\tA questão da responsabilidade social e\
    \ do meio ambiente.\n12.\tPerspectivas para o Brasil neste século XXI"
  course_name: 'EAD0674 - Economia Brasileira: O Ambiente de Negócios

    Brazilian Economy: The Business Environment'
