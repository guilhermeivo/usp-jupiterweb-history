  course: 'O conteúdo do curso consiste nos seguintes tópicos:

    -Fundamentos de Finanças o Função financeira da empresa

    -Inserção da empresa no mercado financeiro

    -Agentes reguladores, fiscalizadores do mercado financeiro

    -Finanças Corporativas: objetivo, separação propriedade x controle Introdução
    à Teoria da Agência: stakeholders, Governança Corporativa

    -Introdução Risco x Retorno: características dos indivíduos com relação ao risco

    -Organização das empresas

    -Empresas individuais

    -Sociedades de responsabilidade limitada

    -Sociedades anônimas

    -Indicadores para tomada de decisão: Conceitos fundamentais e os elementos da
    decisão de investimento

    -Técnicas de Avaliação de Projetos de Investimento

    -VPL

    -Payback

    -Payback Descontado

    -IL

    -TIR

    -Premissa de Reinvestimento;

    -TIR e as decisões de Investimento considerando as diferenças na distribuição
    do fluxo de caixa ao longo do tempo;

    -Múltiplas TIRs

    -TIR Modificada

    -Projetos excludentes, restrição de capital, projetos com vidas desiguais

    -Projeção de Fluxo de Caixa

    -Análise dos Demonstrativos Financeiros

    -Análise Vertical e horizontal

    -Indicadores de Liquidez

    -Indicadores de Alavancagem Financeira

    -Indicadores de Alavancagem Operacional

    -Indicadores de Rentabilidade

    -Indicadores de Atividades'
