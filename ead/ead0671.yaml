  course_name: 'EAD0671 - Economia de Empresas II

    Corporate Economics II'
  deactivation: ''
  lecture_credits: '4'
  objectives: 'Uma das possíveis formas de dividir a economia é separá-la em duas
    grandes partes: microeconomia e macroeconomia. A macroeconomia trataria de grandezas
    agregadas, como, produto (PIB), emprego, inflação, etc. A microeconomia, por sua
    vez, focalizaria o comportamento dos agentes econômicos (consumidores, firmas),
    individualmente considerados e também suas interações em mercados, visando a explicar
    a formação dos preços. Para tomar suas decisões, o administrador lança mão de
    conhecimentos de diversas disciplinas, dentre as quais a economia, especialmente
    a microeconomia. O objetivo central deste curso é mostrar como os modelos teóricos
    da microeconomia podem auxiliar o administrador na tomada de decisão. Nesta disciplina
    são explorados conceitos relacionados às teorias de preço, jogos de empresas e
    dos custos de transação.'
  practical_credits: '0'
  total_workload: 60 h
