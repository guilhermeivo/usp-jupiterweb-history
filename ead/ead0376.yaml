  course: "\x95 O ambiente em torno da empresa. Macroambiente e papel dos agentes\
    \ envolvidos. Influência dos mesmos na política de negócios  da empresa.\n\x95\
    \ Macrotendências do ambiente internacional.\n\x95 Tipologia de empresas e  as\
    \ varias formas de se aglutinar empresas afins. Introdução  à analise de setores\
    \ da economia.\n\x95 O fenômeno da globalização e como ele afeta a competição\
    \ entre as empresas. A globalização  e os  vários tipos de empresas.\n\x95 Tecnologia\
    \  e seus efeitos na competição entre empresas. Relação entre tecnologia e cadeia\
    \ de valores.\n\x95 O conceito de competências essenciais\n\x95 Determinantes\
    \ da Vantagem Competitiva Nacional . O modelo do \"diamante \"de Michael  Porter\n\
    \x95 Casos de Setores  em países desenvolvidos\n\x95 Adaptação  do modelo  do\
    \ \"diamante\" à realidade da América Latina.\n\x95 Casos de setores  na América\
    \ Latina incluindo Brasil\n\x95 Como as empresas devem definir suas estratégias\
    \ levando em consideração  os determinantes nacionais."
  course_name: 'EAD0376 - Economia da Estratégia

    Economics of Strategy'
  deactivation: ''
  lecture_credits: '4'
  objectives: "A disciplina tem por objetivo fazer com que os alunos compreendam a\
    \ política de negócios nas empresas e discutam a sua importância e proporcionar\
    \ uma visão integrativa da empresa em seus aspectos estratégicos e também mostrar\
    \ como as decisões na empresa são afetadas por fatores e aspectos exógenos onde\
    \ a influência por parte do executivo é mínima;\n\x95 Como levar em consideração\
    \ o macroambiente examinando cada um de seus componentes sob o ponto de vista\
    \ da importância na gestão de empresas;\n\x95 Como o management difere de uma\
    \ nação para a outra\n\x95 Mostrar como diferentes países aplicam estratégia competitivas\
    \ distintas no ambiente globalizado\n."
  practical_credits: '0'
  total_workload: 60 h
