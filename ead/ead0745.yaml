  lecture_credits: '4'
  objectives: "Compreender o conceito e fundamentos de marketing.\nEntender as técnicas\
    \ de marketing e suas aplicações na gestão de organizações.\nCapacidade de diagnosticar\
    \ e propor alternativas para problemas de gestão mercadológicas.\nCapacidade para\
    \ analisar e avaliar os efeitos das ações de marketing nas estratégias das organizações.\n\
    Compreender a relação organização versus mercado em ambientes complexos.\nCompreender\
    \ o papel desempenhado pelo marketing frente às demandas da \t sociedade contemporânea\
    \ e seus impactos no planeta e na sociedade.\nPesquisar sobre estratégias de marketing\
    \ para organizações diferentes setores, produzindo documentos com parecer crítico."
