  course_name: 'EAD0738 - Planejamento e Controle Financeiro II

    Financial Planning and Control II'
  deactivation: ''
  lecture_credits: '2'
  objectives: 'Aprofundar os conceitos em planejamento, orçamento e controle e apresentar
    modernas ferramentas e sistemas de controle empresarial. A disciplina apresentará
    os riscos financeiros e as possíveis estratégias a serem adotadas para gestão
    de riscos: evitar, reter, reduzir, transferir e/ou compartilhar ou explorar o
    risco. A disciplina também apresentará as metodologias de avaliação de riscos,
    os procedimentos de auditoria interna e estrutura e requisitos dos relatórios
    de acompanhamento.'
