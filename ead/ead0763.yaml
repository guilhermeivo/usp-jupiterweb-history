  course: '- Estratégia de operações: conteúdo, processo e contexto.

    - Trade-offs e foco em operações.

    - Estratégia de gestão da capacidade.

    - Estratégia da rede de operações: decisões de integração vertical e alianças
    estratégicas.

    - Estratégia de tecnologia de processos.

    - Desenvolvimento de novos produtos e serviços.

    - Formulação da estratégia de operações: modelos de Slack & Lewis, Hill, Hayes
    & Wheelright e Platts & Gregory

    - Integração da estratégia de operações com o planejamento estratégico e demais
    estratégias funcionais: estratégia de marketing e planejamento financeiro/orçamentário.'
  course_name: 'EAD0763 - Estratégia de Operações

    Strategy in Operations'
  deactivation: ''
  lecture_credits: '2'
  objectives: 'Esta disciplina objetiva estudar a formulação da estratégia de operações
    de uma organização. Especificamente os objetivos da disciplina são:

    - Apresentar os conceitos básicos, os principais elementos e técnicas associados
    á formulação da estratégia de operações.

    - Discutir a aplicação prática destes conceitos e técnicas em diferentes tipos
    de organizações (intensivas em produtos, serviços e conhecimento; com e sem fins
    lucrativos).

    - Proporcionar aos participantes uma melhor compreensão sobre a contribuição estratégica
    das operações para o desempenho das organizações.

    - Discutir o inter-relacionamento da estratégia de operações com outras decisões
    de natureza estratégica, tais como: estratégia corporativa, estratégia competitiva,
    estratégia de marketing, políticas de gestão de pessoas e planejamento financeiro/orçamentário.'
  practical_credits: '0'
  total_workload: 30 h
