  course: '1. Definições, usuários dos sistemas de estoques, funções e custos associados
    a estoques, classificação ABC, políticas de estoque

    2. Modelos determinísticos de gestão de estoques

    Wilson/Harris

    Lead-time > 0

    Atraso; taxa de suprimento finita; descontos por quantidade

    Indicadores: custos, giro e cobertura de estoques

    Demanda variável: Wagner-Whitin; Silver-Meal; programação linear mista

    Reposição coordenada de vários itens

    3. Modelos probabilísticos de gestão de estoques

    Reposição periódica com perda de venda

    Revisão contínua e demanda estável

    Lead-time probabilístico

    Indicadores: custos e nível de serviço

    Demanda variável'
