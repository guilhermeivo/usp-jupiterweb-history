  bibliography: 'Krugman ,P &  Wells , R. “Introdução à Economia”, Campus , 2007

    Dicken, P. “ Global Shift “ 2012 . The Guilford Press

    Cavusgil, ST, Knight G & Riesenkerger, J “International Business : The new realities
    “ Pearson 2020

    Stiglitz J & Marsh, C. – “Introdução á Microeconomia” . Campus.2003'
  course: '1.Introdução ao Comércio Internacional

    a. Agentes mais importantes , exportadores , importadores

    b. Arcabouço Legal e Organismos Reguladores Internacionais

    2.Vantagem Comparativa e Vantagem Competitiva

    a. De David Ricardo a Michael Porter

    b. Fontes de Vantagem Comparativa e de Vantagem Competitiva

    3. Conjuntura Econômica Mundial

    a. Diversos fatores que impactam o crescimento da economia mundial

    b. Fatores que tornam diferentes as taxas de crescimento nas diversas regiões

    c. Papel dos blocos regionais de comércio

    4.  Histórico da Globalização

    a. A influencia da Tecnologia da Informação no crescimento da globalização

    b. Impacto do comercio eletrônico no futuro do Comércio Internacional

    c. A entrada dos países asiáticos – Japão, Coreia e China – e seus impactos

    5.  O crescimento do protecionismo

    a. As limitações do conceito de livre comércio

    b. Diferenças entre protecionismos :  países desenvolvidos  X países emergentes

    c. As barreiras utilizadas

    6.  Fatores que afetam os IDEs  Investimentos Diretos Estrangeiros

    a. Como as empresas multinacionais tomam suas decisões de investimentos no exterior

    b. As  Regiões que recebem mais investimentos do exterior

    7.  Negociação Internacional e Relações Interculturais

    a. O papel da cultura no desenvolvimento das nações e na forma da gestão de suas
    empresas

    b . A complexidade da negociação internacional'
  course_name: 'EAD0914 - Economia e Negócios Internacionais

    Economics and International Business'
  deactivation: ''
  instructors: '5848082 - Gilmar Masiero

    77542 - Paulo Roberto Feldmann'
  lecture_credits: '2'
  objectives: 'Aplicar os principais conceitos de comercio internacional , utilizando
    os  em ambientes de incerteza mas fundamentais para a empresa

    Analisar através de estudos de casos investigando os efeitos da teoria do Comercio
    Internacional na gestão das empresas

    Propor estratégias de internacionalização para as empresas traçando as ações resultantes
    das mesmas

    Identificar conceitos importantes reconhecendo nas discussões de grupo as situações
    práticas onde os mesmos possam ser utilizados

    Produzir apresentação oral de casos e seminários criando estímulos para que haja
    interação em sala de aula'
  practical_credits: '0'
  total_workload: 30 h
