  course_name: 'EAD0851 - Ciência de Dados e Inteligência Artificial Aplicada aos
    Negócios

    Data Science and Artificial Intelligence Applied to Business'
  deactivation: ''
  instructors: 86344 - Antonio Geraldo da Rocha Vidal
  lecture_credits: '2'
  objectives: '-Conhecer os principais conceitos de ciência de dados e sua aplicação
    aos negócios.

    -Conhecer os principais conceitos relacionados à Inteligência Artificial, Machine
    Learning e Deep Learning e suas aplicações aos negócios.

    -Conhecer as principais metodologias e técnicas em ciência de dados para aplicações
    em negócios.

    -Conhecer os fundamentos e técnicas de aprendizado de máquina (machine learning
    e deep learning).

    -Compreender os fundamentos de Redes Neurais Artificiais (RNA).

    -Conhecer as principais Arquiteturas e Topologias de Redes Neurais Artificiais.

    -Compreender os fundamentos do Processo de Treinamento de Redes Neurais Artificiais.

    -Compreender os conceitos de underfitting e overfitting em Redes Neurais Artificiais.

    -Compreender os conceitos de Aprendizado de Máquina (Machine Learning) e Profundo
    (Deep Learning).

    -Conhecer e utilizar as estruturas básicas das linguagens de programação R e Python.

    -Conhecer as principais ferramentas para utilização das linguagens R e Python.

    -Conhecer e utilizar as principais bibliotecas da linguagem Python para aprendizado
    de máquina (Machine Learning).

    -Conhecer e utilizar as principais bibliotecas da linguagem Python para aplicação
    de técnicas de aprendizado de profundo (Deep Learning).

    -Selecionar e compreender a aplicação de técnicas de redes neurais artificiais
    para criação de modelos para solução de problemas de classificação e regressão.

    -Selecionar e compreender a aplicação de técnicas de redes neurais artificiais
    para a criação de modelos para solução de problemas de otimização.

    -Selecionar e compreender a aplicação de técnicas de redes neurais artificiais
    para a criação de modelos para solução de problemas de reconhecimento de imagem
    (computer vision).

    -Selecionar e compreender a aplicação de técnicas de redes neurais artificiais
    para a criação de modelos para solução de problemas de reconhecimento de textos
    e linguagem natural (natural language processing).

    -Avaliar e validar de modelos de redes neurais artificiais.

    -Aplicar modelos de redes neurais artificiais para tomada de decisão.

    Aplicar modelos de deep learning para a tomada de decisão.

    -Aplicação de modelos analíticos baseados em redes neurais artificiais para solução
    de problemas de negócio.

    -Descobrir oportunidades de mudança e inovação nos negócios através da construção
    de modelos de inteligência artificial baseados em redes neurais artificiais e
    deep learning.

    -Compreender e avaliar o potencial, as possibilidades, as limitações e as dificuldades
    para aplicação de modelos inteligência artificial nos negócios.

    -Compreender e avaliar os aspectos éticos aplicação de técnicas relacionadas à
    inteligência artificial.

    -Discutir a privacidade, segurança, veracidade e propriedade de dados entre outros
    aspectos éticos ligados modelos de inteligência artificial.

    -Discutir os possíveis impactos e responsabilidades sociais com a aplicação de
    modelos de inteligência artificial nos negócios.

    -Colaborar na realização de exercícios e estudos de caso sobre a aplicação de
    técnicas e modelos de redes neurais artificiais em problemas de negócio.

    -Adquirir competência para a redação de relatórios conclusivos sobre os modelos
    de inteligência artificial e sua aplicação, resultados e impactos nos negócios.

    -Pesquisar informações sobre técnicas, ferramentas e bibliotecas de aprendizado
    de máquina e aprendizado profundo e sua aplicação nos negócios.

    -Pesquisar informações sobre fontes de dados e exemplos de modelos analíticos
    baseados em redes neurais artificiais e deep learning.

    -Adquirir competência básica para criação e aplicação de modelos analíticos de
    redes neurais artificiais utilizando as linguagens de programação R e Python.

    -Conhecer os principais recursos, ferramentas e bibliotecas da linguagem de programação
    Python para aplicações de algoritmos baseados em redes neurais artificiais (machine
    learning e deep learning).'
  practical_credits: '0'
  total_workload: 30 h
