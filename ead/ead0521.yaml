  objectives: Desenvolver nos alunos a sensibilidade para compreender as relações
    que se estabelecem no interior das organizações entre indivíduos e grupos/organização
    e conhecer os fatores determinantes de como as referidas relações acontecem na
    dinâmica organizacional.
