  course: '· O que é a ciência do Comportamento-Modelos e quadros de referência

    · Organizações e Comportamento

    · O indivíduo - variáveis intrínsecas e extrínsecas determinantes do comportamento

    · Atitude, percepção, aprendizagem, motivação

    · Os grupos na organização - Como se formam

    · Características dos grupos - Hierarquia, normas, papéis, coesão, objetivos

