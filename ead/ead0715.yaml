  course: "\x95 Importância da Inovação para a competitividade\n\x95 Modelo de Inovação\
    \ \x96 \x93Gangorra da Competitividade\x94 \x96 aplicação em projetos de inovação\
    \ da Siemens.\n\x95 Inovação incremental e radical.\n\x95 Como estabelecer um\
    \ modelo de gestão, integrando tecnologia, mercado e resultado financeiro \x96\
    \ a experiência do Google,\n\x95 Como reunir as condições necessárias para tornar\
    \ um produto aprimorado num sucesso absoluto \x96 A experiência do iPOD e o caso\
    \ Apple.\n\x95 Descentralização x Centralização mundial do processo de inovação\
    \ \x96 a experiência da 3M.\n\x95 Ferramentas de gestão para integrar a inovação\
    \ tecnológica ao negócio \x96 experiências da Vale, Vallée e Wahler.\n\x95 Modelos\
    \ de Gestão bem sucedidos, integrando inovação, estratégia, estrutura e cultura\
    \ \x96 as experiências da IBM e da GE.\n\x95 Modelo de gestão de alianças estratégicas\
    \ para a inovação.\n\x95 Modelo de negócios tipo rede de inovação. Aplicação na\
    \ Petrobrás.\n\x95 Aliança estratégica entre empresas como ferramenta para inovação\
    \ radical \x96 a experiência da FIAT.\n\x95 Estratégia de consórcio entre empresas\
    \ como ferramenta para inovação radical \x96 a experiência no setor farmacêutico\
    \ Coinfar.\n\x95 Estratégia de aquisição como opção para inovação tecnológica\
    \ competitiva no setor de TI \x96 a experiência da EMC.\n\x95 Como uma empresa\
    \ brasileira familiar de tamanho médio consegue enfrentar a Pfizer e grandes multinacionais\
    \ através da inovação \x96 a experiência da Cristália"
  course_name: 'EAD0715 - Gestão da Inovação para a Competitividade Empresarial

    Innovation Management for Business Competitiveness'
  deactivation: ''
  lecture_credits: '2'
  objectives: "\x95 Desenvolver com os estudantes sua capacidade de compreender a\
    \ importância da Inovação para a competitividade da empresa.\n\x95 Discutir a\
    \ aplicabilidade das principais ferramentas para viabilizá-la.\n\x95 Mostrar exemplos\
    \ de inovações bem e mal sucedidas e analisar o que pode ser aprendido dessas\
    \ experiências."
  practical_credits: '0'
  total_workload: 30 h
