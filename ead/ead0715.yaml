  course: 'Importância da inovação para a competitividade empresarial. Conceitos.
    As diferentes dimensões da inovação: tecnológica, organizacional.

    Conceito estratégico de inovação integrando inovação, estratégia, estrutura e
    cultura.

    Inovação incremental e radical.

    Sistema Nacional de Inovação. Ecossistema de inovação empresarial. Organizações
    participantes: papéis e interação entre as mesmas.

    Ecossistemas inovação empresarial - a experiência IPT Open; Distrito Industrial
    (Itália).

    Fomento à inovação - experiências de organizações governamentais e não-governamentais:
    agências de inovação; incubadoras de empresas; startups; parques tecnológicos;
    entidades financiadoras.

    Estratégia de cooperação entre empresas para acesso à inovação e mercado - experiências
    de alianças estratégicas: Nokia/Gradiente (telefone celular); Stellantis FCA &
    PSA (mobilidade-auto); EVE-Embraer/Parceiros (eVTOL “carro voador”; mobilidade-aero);
    Fiocruz/Astrazeneca-U. Oxford (vacina para covid19); Butantã/Sinovac (vacina para
    covid19).

    Modelo de gestão de alianças estratégicas. Aplicação.

    Estratégia de aquisição como opção para inovação tecnológica competitiva no setor
    de TI - a experiência da EMC.

    Inovação, modelos de negócios e transformação digital - a experiência da Magalu.

    Transformação digital na Construção Civil - a experiência do CTE Centro de Tecnologia
    de Edificações.

    Inovação em serviços - a experiência do Laboratório Fleury.

    Modelo de gestão de inovação tecnológica - “Gangorra da Competitividade” - aplicação
    em projetos de inovação da Siemens.

    Formas de organização para a inovação:

    Inovação aberta - Cristália (farmacêutico); Klabin (caixas alimentos);

    Inovação em redes - Petrobras (energia/petróleo e gás: centro de excelência/redes:
    naval e oceânica; pré-sal);

    Consórcio entre empresas - Coinfar (farmacêutico).

    Inovação em subsidiária e internacionalização de negócios - a experiência da Magneti
    Marelli Cofap (autopeças).

    Inovação em cadeia produtiva - a experiência da Klabin (celulose/papel/ondulado/embalagens).'
  course_name: 'EAD0715 - Gestão da Inovação para a Competitividade Empresarial

    Innovation Management for Business Competitiveness'
  deactivation: ''
  instructors: '76284 - Guilherme Ary Plonski

    1305012 - Moacir de Miranda Oliveira Júnior'
  lecture_credits: '2'
  objectives: 'Desenvolver com os/as estudantes sua capacidade de compreender a importância
    da inovação para a competitividade da empresa, com ênfase no contexto brasileiro.

    Discutir a aplicabilidade das principais ferramentas para viabilizá-la.

    Mostrar exemplos de inovações bem e malsucedidas e analisar o que pode ser aprendido
    dessas experiências.'
