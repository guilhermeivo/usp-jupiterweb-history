  course: 'Filosofia e Ética

    - Filosofia: Atitude Filosófica e Reflexão Filosófica

    - Os campos da Filosofia

    Ética: conceitos básicos

    - O sujeito ético e seus atributos

    - Os constituintes do campo ético: virtude, sujeito moral e meios

    Ética e Psicanálise

    - Necessidade, Desejo e Vontade

    Vertentes éticas

    Teleologia (Ética das Virtudes), Egoísmo ético, Utilitarismo e Deontologia (ética
    do dever)

    Ética e Organizações

    - A Visão Institucional e Organizações (Valores, visão e missão)

    - Organizações, códigos de conduta, relações com stakeholders e instituições

    - Sustentabilidade

    - Relações com consumidor

    - Ética e investimentos

    - Relações de Trabalho'
  course_name: 'EAD0791 - Ética e Organizações

    Ethics and Organizations'
  deactivation: ''
  instructors: '2974821 - Kavita Miadaira Hamza

    1963351 - Wilson Aparecido Costa de Amorim'
  lecture_credits: '2'
  objectives: 'Compreender as implicações das questões de natureza ética no ambiente
    da organização enquanto um espaço social, de poder e em mudança;

    Examinar conflitos morais à luz do instrumental proporcionado pelo estudo de dilemas
    éticos e posicionar-se diante deles.

    Aplicar em casos de ensino, os conceitos e as reflexões sobre Ética, utilizando-os
    como base para o entendimento de situações e práticas;

    Analisar questões de natureza ética no ambiente da organização e suas implicações;

    Analisar, sintetizar e justificar o seu próprio ponto de vista – por meio do exame
    crítico de problemas filosóficos de natureza ética e vinculados à Economia e à
    Administração em suas diversas áreas

    Conhecer o quadro conceitual da Ética, identificando e descrevendo os conceitos
    a partir de exemplos e questões teóricas;

    Identificar as linhas de pensamento ético;

    Elaborar um quadro conceitual que integre os conceitos, métodos e reflexões abordados
    em leituras e em sala de aula.

    Colaborar na pesquisa e escrita para um trabalho em formato de artigo acadêmico
    sobre um estudo de caso envolvendo ética e organizações de acordo com a estrutura
    proposta

    Escrever um trabalho em formato de artigo acadêmico sobre um estudo de caso envolvendo
    ética e organizações de acordo com a estrutura proposta

    Pesquisar informações sobre valores, princípios e cultura de uma organização,
    produzindo um artigo acadêmico'
  practical_credits: '1'
  total_workload: 60 h
  type: Semestral
