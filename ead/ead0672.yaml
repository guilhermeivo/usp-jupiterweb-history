  course: 'Um Simulador Geral, que reúne todas as áreas funcionais, será adotado para
    permitir a aplicação dos conceitos apreendidos ao longo do curso.

    As atividades serão desenvolvidas por meio de um modelo híbrido, com atividades
    presenciais (70%) e online (30%), conforme indicado no programa.

    Nas atividades online serão utilizados métodos de Ensino a Distância – EAD.

    Um Jogo de Empresas (Business Game) é usado para dinamizar a aprendizagem vivencial
    e:

    a) Promover a construção de um significado dinâmico para os conhecimentos estáticos
    já adquiridos;

    b) Desenvolver habilidades gerenciais repetindo o ciclo: planejar, organizar,
    decidir e controlar;

    c) Espelhar as atitudes de ousadia e conservadorismo, face ao risco na tomada
    de decisão;

    O modelo híbrido de aprendizagem promove benefícios adicionais para os estudantes
    e para o curso de administração, a saber:

     Permite o desenvolvimento de habilidades gerenciais para a atuação em equipes
    virtuais, cada vez mais necessárias no ambiente profissional atual.

    2

     Promove a utilização de tecnologias modernas e dinâmicas no desenvolvimento
    do processo ensino-aprendizagem.

     Alavanca o desenvolvimento de soft-skills , por meio das atividades online,
    adicionais aos soft-skills desenvolvidos pelas atividades presenciais, com a inclusão
    de novos conteúdos e abordagens.

     Permite novas oportunidades de reflexão teórica, tendo em vista o recente desenvolvimento
    de bibliografias sobre aprendizagem híbrida e métodos ativos, abrindo novos campos
    de pesquisa no Laboratório de Gestão.

     Consolida a possibilidade de oferta de disciplinas na modalidade semi-presencial,
    conforme estabelece a Portaria nº 4.059/2004 do Ministério da Educação, em seu
    Art. 1º: “As instituições de ensino superior poderão introduzir, na organização
    pedagógica e curricular de seus cursos superiores reconhecidos, a oferta de disciplinas
    integrantes do currículo que utilizem modalidade semi-presencial [...].”'
  course_name: 'EAD0672 - Laboratório de Gestão Empresarial I

    Laboratory of Entrepreneurial Management I'
