  course: '· Logística e cadeia de suprimentos: conceitos, funções e custos associados

    · Localização e utilização de várias unidades (modelos quantitativos baseados
    em programação linear mista): sistema com 1 produto fabricado em várias fábricas,
    sistema com vários produtos fabricados em fábricas distintas, sistemas de manufatura
    em unidades distintas (cálculo de necessidades/mistura)

    · Inclusão de decisões de planejamento agregado da produção em modelos de localização

    · Planejamento de estoques de sistemas em série

    · Movimentação e armazenagem de materiais

    · Roteamento de entregas

    · Técnicas de compras'
