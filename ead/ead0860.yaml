courses:
  activation: 01/01/2023
  assessment: O aluno será submetido a uma avaliação cuja nota terá peso de 50% na
    média final.
  bibliography: 'Clark, K. B. & Wheelwright, S. C. 1993. Managing new product and
    process development: text and cases. New York: The Free Press.

    Christensen, C. M. 1998. The innovator’s dilemma: when new technologies cause
    great firms to fail. Cambridge: Harvard Business School Press.'
  course: A disciplina apresenta temas contemporâneos de Gestão de Inovação tanto
    no contexto de Estratégias de Gestão interna nas organizações bem como as principais
    estratégias e abordagens de implementação de Gestão aberta de Inovação nas Organizações
    e impactos internos e externos à Organização em relação aos Projetos de Inovação
    em relação às principais métricas de performance tanto para as equipes envolvidas
    quanto para a Organização como um todo.
  course_name: 'EAD0860 - Tópicos de Operações II

    Topics in Operations II'
  deactivation: ''
  instructors: 320498 - Alvair Silveira Torres Junior
  lecture_credits: '2'
  objectives: '-Compreender e Analisar os principais conceitos de Estratégia de Gestão
    de Negócios no contexto da Integração das várias Áreas Funcionais como Gestão
    Estratégica, Gestão de Operações, Planejamento de Marketing e Gestão de Pessoas
    aplicados à Gestão de Inovação.

    -Reconhecer, Decompor e Analisar os vários processos decisórios no contexto de
    Gestão de Inovação para avaliar as melhores alternativas estratégicas e melhores
    conceitos para a Inovação.

    -Compreender e Analisar os principais aspectos de inovação relacionados a necessidades
    dos mercados, à gestão da organização e das capacidades produtivas e criativas

    -Compreender a importância de criar inovações que satisfaçam as necessidades dos
    mercados com qualidade, funcionalidade, eficiência, sustentabilidade econômica
    e socioambiental para a sociedade e comunidades envolvidas em todo o processo.

    -Trabalhos em Equipe para compreensão e aplicação de conceitos importantes do
    Projeto de Inovação.

    -Analisar, Expor e Preparar discussões acerca de temas contemporâneos e relevantes
    sobre Gestão de Inovação.

    -Escrever um Trabalho (Projeto) sobre estratégias e desenvolvimento de Inovação.

    -Pesquisar e analisar informações e conceitos contemporâneos teóricos e de mercado
    a respeito de Estratégias de Gestão de Inovação.'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
