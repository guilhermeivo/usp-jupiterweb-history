courses:
  activation: 01/01/2014
  assessment: O aluno será avaliado continuamente e, em caso de performance não compatível,
    será submetido a uma reavaliação final, a título de recuperação.
  bibliography: '1. ALBUQUERQUE, Lindolfo G. Competitividade e Recursos Humanos. Revista
    de Administração da USP, vol. 27(4), p. 16-29, out/dez 1992.

    2. DUTRA, Joel Souza. Administração de Carreiras - uma proposta para repensar
    a gestão de pessoas. São Paulo: Atlas, 1996.

    4. LAWLER, E. E. Strategic Pay. USA: Jossey-Bass Inc. Publishers, 1991.

    5. TEIXEIRA, Gilney M. A Curva da Maturidade. Apostila publicada pelo DLP, 1985.

    6. ULRICH, Dave. Os campeões de Recursos Humanos. São Paulo: Futura, 1998.

    7. WOOD, T. e PICARELLI, V. (Coopers & Lybrand). Remuneração Estratégica - a nova
    vantagem competitiva. São Paulo: Atlas, 1999.

    8. ZIMPECK, Beverly G. Administração de Salários. São Paulo: Atlas, 1990.'
  course: '· modelo integrado de gestão de pessoas

    · gestão de pessoas e estratégia de negócios

    · processos de remuneração baseados em Cargos

    · processos de remuneração baseados no indivíduo

    · sistemas de remuneração variável

    · processos de remuneração indireta

    · processos de carreira e avaliação do desenvolvimento

    · participação nos lucros e resultados

    · planejamento de carreira - enfoque organizacional

    · planejamento de carreira - enfoque individual

    · desafios e tendências em compensação de recursos humanos'
  course_name: 'EAD0625 - Gestão de Carreira e Remuneração

    Compensation and Career Management'
  deactivation: ''
  lecture_credits: '2'
  objectives: Propiciar aos alunos conhecimento sobre conceitos, métodos e práticas
    de Gestão da Compensação de Recursos Humanos, integrando essa função às demais
    atividades de Gestão de Pessoas na Organização. Estimular os alunos a refletir
    criticamente sobre as modernas técnicas de Gestão da Remuneração  nas Organizações
    e seus principais desafios.Auxiliar os alunos a avaliar decisões de CArreira como
    parte de seu desenvolvimento em Organizações.
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
