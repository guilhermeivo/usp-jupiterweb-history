  course: 'Dinâmica da carreira no mercado e nas organizações

    Trajetórias de carreira típicas no mercado

    Sistemas de gestão de carreiras

    Processo sucessório

    Processos de orientação profissional

    Protagonismo na gestão da própria carreira

    Autoconhecimento

    Enfrentamento de dilemas de carreira

    Planejamento da carreira individual

    Construção de projeto de desenvolvimento profissional

    Conciliação de expectativas entre as pessoas e a organização

    Diferentes papéis no processo de conciliação de expectativas (pessoa, gestor e
    organização)

    Suporte da organização para as pessoas refletirem sobre suas carreiras

    Etapas da carreira e valorização profissional

    Níveis de complexidade nas carreiras profissionais e gerenciais

    Lógica de valorização do mercado para cada degrau de complexidade

    Processos de transição de carreira e fechamento de ciclos.'
  course_name: 'EAD0625 - Gestão de Carreira

    Career Gestion'
  deactivation: ''
  instructors: '2783915 - Joel Souza Dutra

    1849068 - Tania Casado'
  lecture_credits: '2'
  objectives: 'Refletir sobre seus objetivos de carreira e e sobre as ações de desenvolvimento
    necessárias, construindo seu plano individual de carreira

    Compreender a dinâmica da carreira no mercado de trabalho e nas organizações,
    desenhando e explicando as trajetórias de carreira de uma determinada organização

    Analisar o processo de desenvolvimento na carreira e de valorização profissional,
    identificando e diferenciando as etapas de uma determinada carreira e os níveis
    salariais correspondentes

    Avaliar seu próprio desenvolvimento na carreira e dos membros de sua equipe, predizendo
    indicadores de evolução e de aprendizagem.

    Analisar o peso da carreira profissional frente às demais dimensões da sua vida,
    comparando situações de escolhas efetuadas por diversas pessoas com as suas possíveis
    escolhas.

    Avaliar alternativas profissionais ponderando os aspectos racionais e emocionais
    envolvidos nas possíveis escolhas de carreira

    Compreender os ciclos de carreira e a necessidade de renovação contínua de conhecimentos,
    exemplificando situações vividas por pessoas do seu conhecimento ou investigadas
    nos trabalhos para a disciplina

    Criar distância crítica sobre a própria carreira e sobre o seu processo de desenvolvimento,
    desenvolvendo ações para construir consciência crítica sobre a carreira.

    Compreender a importância da cooperação no processo de desenvolvimento profissional,
    explicando os benefícios e contribuições da cooperação no desenvolvimento das
    pessoas

    Compreender a contribuição da diversidade no desenvolvimento pessoal e profissional,
    explicando como a diversidade pode influenciar no desenvolvimento.'
  practical_credits: '0'
