  course: '1. Introdução: o que é modelo de negócios. Conceito de geração de valor.

    2. Componentes do modelo de negócios. Formas de representação (arquitetura) do
    modelo de negócios.

    3. Perspectiva dinâmica do modelo de negócios. Inovação de modelo de negócios.

    4. Integração do modelo de negócios à gestão estratégica. Projeto (desenho) da
    empresa segundo o conceito de modelo de negócios. Abordagens para modelagem de
    negócios: (1) escolhas estratégicas e abordagem recombinante; (2) rota mercadológica
    e rota tecnológica.

    5. Contextualização da empresa: modelagem da cadeia de valor.

    6. Tipologia de modelos de negócios. Segmentos-alvo de clientes.

    7. Proposta de valor (e inovação de valor). Posicionamento estratégico (e mapa
    de posicionamento competitivo). Submodelos associados ao posicionamento estratégico
    e à proposta de valor.

    8. Modelo de geração de receita. Submodelos associados ao modelo de geração de
    receita.

    9. Modelo de operações. Direcionadores estratégicos e submodelos relacionados
    ao modelo de operações.

    10. Modelo de relacionamento com clientes. Direcionadores estratégicos e submodelos
    associados ao relacionamento com clientes.

    11. Modelo de inovação. Direcionadores estratégicos e submodelos associados ao
    modelo de inovação.

    12. Modelo econômico. Direcionadores de valor (estratégicos) e submodelos associados
    ao modelo econômico.

    13. Modelo de gestão. Direcionadores estratégicos e submodelos associados ao modelo
    de gestão.'
  course_name: 'EAD0764 - Modelo de Negócios

    Operations Management in Services'
  deactivation: ''
  instructors: 1617538 - Marcelo Caldeira Pedroso
  lecture_credits: '2'
  objectives: 'específicos:

    Estudar o conceito de modelo de negócios e sua utilização para: (1) análise de
    modelos de negócios atuais; (2) concepção (desenho) de novos modelos de negócios;
    e (3) inovação de modelo de negócios.

    Fornecer referencial conceitual, ferramental técnico e templates para modelagem
    de negócios.

    Abordar a integração entre modelo de negócios e gestão estratégica.'
  practical_credits: '0'
  total_workload: 30 h
