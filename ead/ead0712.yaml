  course_name: 'EAD0712 - Gestão de Pequenas Empresas Empreendedoras

    Management of Small Enterprising Business'
  deactivation: ''
  lecture_credits: '2'
  objectives: Propiciar aos alunos conhecimentos sobre a gestão do empreendedor como
    agente do processo de desenvolvimento de uma pequena empresa. Discutir com os
    graduandos a aplicação dos conceitos e técnicas da Administração no contexto das
    pequenas organizações. Apresentar a problemática do desenvolvimento de pequenas
    organizações.
  practical_credits: '0'
  total_workload: 30 h
