courses:
  activation: 01/01/2010
  assessment: O aluno será avaliado continuamente e, em caso de performance não compatível,
    será submetido a uma reavaliação final, a título de recuperação
  bibliography: 'ALMEIDA, Martinho, I. R. Manual de planejamento estratégico.  São
    Paulo: Atlas, 2001.

    FISCHMANN, Adalberto A. e ALMEIDA, Martinho I. R. Planejamento estratégico na
    prática. 2A. ed. São Paulo: Atlas, 1995.

    OLIVEIRA, Djalma P. R. Planejamento estratégico: conceitos, metodologias e práticas.
    12A.ed. São Paulo: Atlas, 1992.

    PORTER, Michael E. Vantagem competitiva. Campus, 1992.'
  course: '· Conceitos e tipos de planejamento (estratégico, tático e operacional)

    · Metodologias a serem utilizadas

    · Diagnóstico de aspectos internos e análise externa

    · Estabelecimento de cenários

    · Estruturação do sistema de informações estratégicas

    · Estabelecimento da missão e das áreas de atuação da empresa

    · Análise e desenvolvimento de novos negócios

    · Análise da posição competitiva

    · Estabelecimento de objetivos e metas empresariais

    · Determinação, avaliação e implantação de estratégias (incluindo as alternativas)

    · Determinação de políticas empresariais

    · Estabelecimento de projetos e planos de ação

    · Controle e avaliação

    · Cultura da empresa e as resistências que podem ser encontradas

    · Administração estratégica

    - Concepts and types of planning (strategic, tactical, and operational)

    - Methodologies to be used

    - Diagnosis of internal aspects and external analysis

    - Establishment of scenarios

    - Structuring the strategic information system

    - Establishment of the company''s mission and areas of activity

    - Analysis and development of new business

    - Analysis of the competitive position

    - Establishment of corporate objectives and goals

    - Determining, assessing, and implementing strategies (including alternatives)

    - Determining business policies

    - Establishing projects and action plans

    - Monitoring and assessment

    - Corporate culture and the resistances that may emerge

    - Strategic Management'
  course_name: 'EAD0611 - Planejamento Estratégico

    Strategic Planning'
  deactivation: ''
  lecture_credits: '4'
  objectives: '· Proporcionar aos participantes o conhecimento dos principais conceitos
    e de diferentes metodologias para desenvolver e implementar o planejamento empresarial
    em nível estratégico

    · Procurar desenvolver a capacidade analítica e crítica dos participantes frente
    ao planejamento estratégico aplicado às organizações

    · To provide the participants with knowledge of the main concepts and different
    methodologies to develop and implement business planning at the strategic level.

    · To develop the analytical and critical capacity of the participants about strategic
    planning applied to organizations.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
