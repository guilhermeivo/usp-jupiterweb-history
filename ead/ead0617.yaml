  objectives: 'Compreender os conceitos e ferramentas de execução da Estratégia, relacionando-os
    com Gestão Estratégica

    Analisar as escolhas estratégicas, explicando sua implementação

    Analisar qual o melhor caminho para uma boa execução estratégica, resolvendo a
    implementação

    Elaborar planos, traçando caminhos inovadores e personalizados às necessidades
    das empresas.

    Avaliar os caminhos estratégicos da empresa, defendendo a sua aplicabilidade e
    eficácia.

    Comparar diferentes execuções estratégicas das empresas, selecionando uma abordagem
    consensual.

    Defender a escolha estratégica, justificando-a frente a diferentes pontos de vista.

    Elaborar planos estratégicos, traçando novas perspectivas e diferentes abordagens
    de execução estratégica.'
