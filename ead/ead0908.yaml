    Gestão de Negócios Sociais: princípios e estratégias'
  course_name: 'EAD0908 - Gestão de Negócios Sustentáveis

    Sustainable Business Management'
  deactivation: ''
  instructors: 203945 - Adriana Marotti de Mello
  lecture_credits: '4'
  objectives: O objetivo central desta disciplina é apresentar e discutir com os alunos
    como os negócios podem ser geridos de maneira que a sustentabilidade faça parte
    de sua estratégia e como (e se) esta questão pode ser uma fonte de vantagem competitiva
    e de impacto positivo na sociedade. Visa estender o entendimento da estratégia
    do negócio, de seu sistema de produção, do ciclo de vida dos produtos/serviços
    (incluindo aí seu descarte e reinserção na cadeia produtiva), de seu relacionamento
    com o mercado e seus impactos sociais.  Cabe destacar que a abordagem metodológica
    será feita a partir do estudo de casos reais de negócios sustentáveis e de impacto
    social
  practical_credits: '2'
  total_workload: 120 h
  type: Semestral
