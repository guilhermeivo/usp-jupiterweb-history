  course: 'Desempenho e indicadores de sustentabilidade

    Sustentabilidade Organizacional

    Estratégia e Modelos de negócio sustentáveis

    Consumo sustentável

    Certificação sustentável

    Gestão de portfolio de produtos sustentáveis

    Inovação socioambiental

    Economia circular

    Economia regenerativa

    Gestão de cadeias de suprimento circulares (fechadas / híbridas)

    Empreendedorismo Socioambiental e Gestão de negócios sociais: princípios e estratégias'
  course_name: 'EAD0908 - Gestão de Negócios Sustentáveis

    Sustainable Business Management'
  deactivation: ''
  instructors: '203945 - Adriana Marotti de Mello

    1084243 - Flávio Hourneaux Junior

    1013604 - Graziella Maria Comini

    2974821 - Kavita Miadaira Hamza'
  lecture_credits: '2'
  objectives: 'Compreender de que forma os negócios sustentáveis podem ser uma fonte
    de vantagem competitiva e de impacto positivo na sociedade, interpretando exemplos
    discutidos nas aulas.

    Analisar como os negócios podem ser geridos de maneira que a sustentabilidade
    faça parte de sua estratégia, contrastando diferentes modelos de negócios.

    Colaborar na pesquisa e escrita para um trabalho em formato de artigo acadêmico
    sobre um estudo de caso envolvendo gestão socioambiental de acordo com a estrutura
    proposta

    Escrever um trabalho em formato de artigo acadêmico sobre um estudo de caso envolvendo
    gestão socioambiental de acordo com a estrutura proposta'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
