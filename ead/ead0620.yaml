  course: '· Formação das Ciências Sociais

    · A Sociologia

    · A imaginação sociológica

    · A constituição da sociedade capitalista (Marx x Weber)

    · Teoria da sociedade capitalista e teoria da sociedade industrial

    · Classes sociais e Estado

    · Leituras sobre a sociedade contemporânea

    · A sociedade pós-industrial

    · Fase monopolista do capitalismo

    · Revolução informacional e a sociedade

    · As transformações contemporâneas da sociedade capitalista'
  course_name: 'EAD0620 - Fundamentos das Ciências Sociais

    Principles of Social Sciences'
  deactivation: ''
  lecture_credits: '2'
  objectives: 'Objetivo geral

    · introduzir os alunos de Administração no universo das principais questões estudadas
    pelas Ciências Sociais através da perspectiva sociológica, histórica e crítica

    Objetivo específico

    · compreender as origens, a formação e o desenvolvimento da sociologia, bem como,
    a natureza e a estrutura da sociedade capitalista

    · identificar os principais conceitos desenvolvidos pela sociologia no entendimento
    das sociedades e suas transformações

    · desenvolver a imaginação sociológica e a sensibilidade social no tratamento
    das questões do mundo contemporâneo'
