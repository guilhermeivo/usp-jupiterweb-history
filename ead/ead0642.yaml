  objectives: · Estudar as técnicas utilizadas na tomada de decisões de marketing
    à luz dos conceitos postulados na disciplina "marketing básico". Analisar as principais
    decisões da Administração de Marketing e sua problemática no contexto empresarial.
    Introduzir conceitos e analisar problemas de alguns campos específicos de Marketing
    referentes a Produtos/Serviços e Preços
