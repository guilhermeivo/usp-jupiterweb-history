    Atlas, 1992.

    8. MOTTA, Fernando C.R., A Ciência e a Arte de Ser Dirigente, São Paulo, Editora
    Record, 1991.

    9. VASCONCELLOS, E. e HENSLEY James R. - Estrutura das Organizações: Estruturas
    Tradicionais, Estruturas para Inovação, Estrutura Matricial, São Paulo, Editora
