  course: '· Conceitos básicos sobre estrutura organizacional e o processo de organização

    · Condicionantes e componentes da estrutura organizacional

    · Departamentalização

    · Centralização e Descentralização

    · Níveis hierárquicos e amplitude de controle

    · Estruturas inovativas

    · Diagnóstico da Estrutura

    · Concepção e implantação da estrutura organizacional na empresa

    · Papéis e habilidades do executivo

    · Condicionantes do estilo gerencial

    · Delegação e desenvolvimento de subordinados

    · Comunicação organizacional e interpessoal'
  course_name: 'EAD0614 - Estrutura Organizacional

    Organizational Structure'
  deactivation: ''
  lecture_credits: '2'
  objectives: '· Conhecer e identificar os condicionantes e componentes da estrutura
    organizacional das empresas

    · Analisar e tomar decisões sobre as alternativas de estrutura organizacional
    para diferentes contextos empresariais

    · Entender as limitações e dificuldades envolvidas no estudo e prática do processo
    de avaliação, formulação e implantação da estrutura organizacional nas empresas

    · Discutir os papéis básicos do Dirigente Empresarial

    · Conhecer os conceitos e técnicas que favorecem o desempenho do executivo na
    empresa

    · Discutir estilos de direção de sucesso em diferentes contextos'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
