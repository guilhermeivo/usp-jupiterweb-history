    3. GIBSON, Janes L. , IVANCEVICH, John M., DONNELLY, James H. - Organizações:

    Comportamento, Estrutura e Processos. São Paulo, Editora Atlas, 1981.

    4. KATZ, Daniel; KAHN, Robert L. - Psicologia Social das Organizações. São Paulo,
    Ed. Atlas,

    1970.

    5. LAWRENCE, Paul R., LORSCH, Jay W. - O Desenvolvimento de Organizações: Diagnóstico

    e Ação. São Paulo, Edgard Blücher, 1972.

    6. LIKERT, Rensis - A Organização Humana. São Paulo, Editora Atlas, 1975.

    7. MAXIMIANO, Antonio C.A. - Introdução à Administração, 3a. edição, São Paulo,
