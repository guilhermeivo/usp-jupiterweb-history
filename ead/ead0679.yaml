  course_name: 'EAD0679 - Mercados e Macroambiente

    Markets and macro environments'
  deactivation: ''
  instructors: '2253712 - Daniel Reed Bergmann

    1452257 - Nuno Manoel Martins Dias Fouto

    5393993 - Paula Sarita Bigio Schnaider Nissimoff

    77542 - Paulo Roberto Feldmann

    2068031 - Renata Giovinazzo Spers'
  lecture_credits: '4'
  objectives: '- Aplicar fundamentos de macro e microeconomia, implementando estratégias
    de posicionamento, preço e produção;

    - Compreender a lógica subjacente à forma de competição nos mercados; relacionado
    os princípios da macro e  da microeconomia à realidade dos mercados.

    - Criar estratégias de precificação e produção, traçando as melhores práticas
    para cada mercado.

    -  Entender com as decisões governamentais sobre a macroeconomia impactam as empresas,
    relacionando-as às estratégias

    - Analisar as características dos mercados, categorizando-os para fornecer subsídios
    às decisões estratégicas

    - Compreender as relações e rivalidade entre firmas em um dado mercado, relacionando-as
    com as estratégias das firmas.

    - Compreender o comportamento do comercio internacional, explicando os impactos
    sobre as empresas

    - Criar estratégias, de acordo com as circunstâncias concorrenciais; traçando
    ações que levem a vantagem competitiva.

    - Identificar os conceitos, reconhecendo situações práticas, a partir da discussão
    casos e exercícios aplicados em grupo.

    - Usar ferramentas de TI, implementando exercícios e estudos de caso (processador
    de texto, gráficos e planilhas).'
  practical_credits: '0'
  total_workload: 60 h
