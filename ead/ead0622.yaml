  course: 'I - Gestão Estratégica de Pessoas

    Gestão de Pessoas no Contexto Contemporâneo

    Resgate Histórico

    Papel de RH

    II – Movimentação de Pessoas

    Dinâmica do Mercado de Trabalho e Planejamento de Quadro

    Captação e Seleção: estratégias e instrumentos

    III - Aprendizagem e Desenvolvimento

    Gestão de Carreiras

    Desenvolvimento de Pessoas e Organizacional

    IV – Valorização

    Padrões de Equidade

    Remuneração Fixa e Variável

    Gestão da Massa Salarial

    V – Gestão do Desenvolvimento

    Processo de Avaliação

    Diálogo de Desenvolvimento

    Desenvolvimento de liderança

    Processo Sucessório

    VI – Tendências

    Desafios atuais e futuros em gestão de pessoas'
  course_name: 'EAD0622 - Gestão de Pessoas

    Personal Management'
  deactivation: ''
  instructors: '1013604 - Graziella Maria Comini

    2783915 - Joel Souza Dutra

    1963351 - Wilson Aparecido Costa de Amorim'
  lecture_credits: '4'
  objectives: '-Conhecer o quadro conceitual da Gestão de Pessoas nas suas políticas
    e práticas, reconhecendo teorias e abordagens ao longo do tempo.

    -Compreender as especificidades das políticas e práticas de Gestão de Pessoas,
    diferenciando-as em suas finalidades.

    -Avaliar modelos de gestão de pessoas, apontando aspectos positivos e fragilidades.

    -Aplicar o quadro conceitual em casos práticos identificando os elementos e premissas
    das políticas e práticas de gestão de pessoas.

    -Analisar criticamente os casos de políticas e práticas de gestão de pessoas,
    utilizando os conceitos e ferramentas proporcionados pelo curso.'
  practical_credits: '0'
  total_workload: 60 h
  type: Semestral
