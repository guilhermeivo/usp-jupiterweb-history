    \ and Green\x94"
  course_name: 'EAD0765 - Gestão de Operações Sustentáveis

    Sustainable Operations Management'
  deactivation: ''
  lecture_credits: '2'
  objectives: A disciplina tem por objetivo discutir como as operações podem ser geridas
    de maneira que a sustentabilidade faça parte de sua estratégia e como (e se) esta
    questão pode ser uma fonte de vantagem competitiva. Visa estender o entendimento
    do sistema de produção e do ciclo de vida dos produtos/serviços, de modo a incluir
    as variáveis de perdas, resíduos e outros impactos ambientais em sua análise.
  practical_credits: '0'
  total_workload: 30 h
