  course: "1. Conceito de Gestão de Operações Sustentáveis\n- O que é desenvolvimento\
    \ sustentável /diferentes conceitos e \tinterpretações\n- O que é Gestão de Operações\
    \ Sustentáveis\n- Sustentabilidade como fonte de competitividade\n2. Estágios\
    \ da gestão ambiental:\n- Controle de poluição;\n- Prevenção da poluição;\n- Eco\
    \ estratégia de negócios.\n3. Inovação e Sustentabilidade\n- Papel da Inovação\
    \ na Gestão Operações Sustentáveis\n- Desenvolvimento de produtos e sustentabilidade\n\
    4. Conceito de ciclo de vida de produto ampliado\n- Ciclo de vida fechado\n- Novas\
    \ oportunidades de negócio/ desafios\n- Política Nacional de resíduos sólidos\n\
    - Logística Reversa\n5. Cadeia de Suprimentos Sustentável - \x93Green Supply Chain\x94\
    \n- Modelos de \x93Green procurement\x94e \x93cadeia verde\n6. Sistemas de Gestão\
