  course: '· Surgimento da Sociologia, condições históricas e evolução

    · Método, objetivo e conceitos básicos

    · Textos Clássicos da Sociologia

    · O fenômeno organizacional como fenômeno sociológico

    · O conceito e o significado social do trabalho humano

    · Conceitos de relações, processo e organização do trabalho

    · Organização do processo de trabalho na indústria clássica

    · Organização do processo de trabalho - novos modelos de gestão

    · As relações de trabalho como relações sindicais

    · Relações sindicais no Brasil - evolução histórica

    · Relações sindicais no Brasil - conjuntura atual'
  course_name: 'EAD0623 - Relações de Trabalho

    Labor Relations'
  deactivation: ''
  lecture_credits: '2'
  objectives: 'Específicos

    Desenvolver sensibilidade, competências e habilidades que permitam aos alunos:

    · Compreender o ambiente de inserção da Empresa enquanto um espaço social em permanente
    movimento de mudança.

    · Conhecer as principais abordagens teóricas sobre os temas de interface entre
    a Sociologia e a Administração tais como: O Trabalho Humano e as Relações Sociais,
    a Organização e o Processo de Trabalho, Estratificação e Organização Social, a
    Cultura e o Poder na Sociedade e nas Organizações'
