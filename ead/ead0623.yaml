  course_name: 'EAD0623 - Relações de Trabalho

    Labor Relations'
  deactivation: ''
  instructors: '65712 - Arnaldo Jose Franca Mazzei Nogueira

    1963351 - Wilson Aparecido Costa de Amorim'
  lecture_credits: '2'
  objectives: 'Conhecer abordagens teóricas sobre relações de trabalho

    Construir as bases da competência de análise de relações de trabalho visando às
    atividades de planejamento, assessoria a negociadores e participação em negociações
    trabalhistas

    Aplicar os conceitos de relações do trabalho identificando o processo e os padrões
    de organização do trabalho adotados pelas empresas

    Compreender as situações organizacionais, aplicando os conceitos de ciências sociais
    com ênfase nas questões do trabalho e das relações sociais

    Conhecer aspectos sobre a formação e evolução do mercado de trabalho brasileiro,
    identificando os conceitos a partir de exemplos e questões práticas;

    Pesquisar e debater temas contemporâneos relacionados com as transformações do
    trabalho, das relações de trabalho e das organizações.

    Analisar os marcos mais significativos da trajetória do sindicalismo em geral
    e no Brasil avaliando a situação atual das entidades dos trabalhadores

    Colaborar na pesquisa e escrita para um trabalho em formato de artigo acadêmico
    sobre um estudo de caso envolvendo ética e organizações de acordo com a estrutura
    proposta

    Escrever um trabalho em formato de artigo acadêmico sobre um estudo de caso envolvendo
    ética e organizações de acordo com a estrutura proposta'
