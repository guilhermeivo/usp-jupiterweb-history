  course_name: 'EAD0624 - Cultura e Poder nas Organizações

    Culture and Power in Organizations'
  deactivation: ''
  instructors: '65712 - Arnaldo Jose Franca Mazzei Nogueira

    1093406 - Liliana Vasconcellos'
  lecture_credits: '2'
  objectives: 'Explicar o conceito de cultura organizacional, com base na Sociologia

    Investigar traços da cultura organizacional de uma empresa, aplicando um modelo
    de diagnóstico

    Analisar relações de poder no contexto organizacional, considerando um caso prático

    Reconhecer os traços de uma cultura organizacional, identificando características
    que apoiam a inovação

    Colaborar na realização de uma pesquisa sobre traços da cultura organizacional,
    produzindo um relatório

    Avaliar diferenças interculturais, refletindo sobre suas implicações no contexto
    organizacional

    Escrever um relatório sobre a cultura organizacional da empresa pesquisada, de
    acordo com a estrutura proposta

    Pesquisar informações sobre a cultura organizacional de uma empresa, produzindo
    um relatório'
  practical_credits: '0'
  total_workload: 30 h
