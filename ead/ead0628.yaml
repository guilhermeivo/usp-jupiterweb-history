  course: 'Módulo 1. Perspectiva socio-histórica e a construção do Brasil

    1. O início de tudo: a constituição da história do Brasil e o perigo da história
    única

    2. Como ficam os povos originários nesta história? Cenário dos povos originários
    (indígenas) ao longo dos anos, desde o período de invasão do território brasileiro
    até os dias de hoje

    3. Por que negros africanos como escravizados e como isso impacta os dias de hoje

    Convidada: Adriana Barbosa, da PretaHub

    4. O sistema judiciário e seu papel na desigualdade: as leis de exclusão

    Como as leis criadas ao longo dos anos tornaram a sociedade brasileira desigual.
    A importância das políticas públicas de reparação. Compliance como instrumento
    de inclusão nas organizações.

    Convidada: Advogada Fayda Belo

    5. Território diferente, cultura diferente

    Preconceito de CEP e Preconceito Regional (Sudestino; São Paulo a Capital do Nordeste).

    As diferenças territoriais, as diferentes culturas dentro do mesmo Brasil, Reprodução
    midiática do que é o Brasil, o Brasil exótico e a concentração de oportunidades.

    Módulo 2. Identidade e diversidade

    6. História do movimento feminista no Brasil, suas conquistas e impactos na sociedade

    7. Pessoas com deficiência: acessibilidade, cidadania e inclusão

    A luta pela acessibilidade, a forma como a pessoa com deficiência é vista hoje
    na sociedade, acesso ao mercado de trabalho, à espaços e à cidadania.

    8. Pessoas Trans e Travestis: além da organização binária e cisgênera

    A luta por visibilidade e inclusão de pessoas trans e travestis. O não-lugar que
    mulheres trans são colocadas. O cenário social e a realidade de pessoas trans
    e travestis no Brasil e o que cada pessoa pode fazer a respeito disso

    Convidada: Agata Pauer

    9. LGBTQIA+ não é sopa de letrinhas: diversidade na orientação sexual

    O que é orientação sexual e seus espectros.

    Convidados: Iran Giusti, Fundador da Casa 1, Samuel Gomes, consultor de diversidade
    e escritor, Maíra Reis, fundadora da Camaleao.co e palestrante de diversidade
    e inclusão

    Módulo 3. Desafios e práticas de gestão inclusiva

    10. Gestão inclusiva e o acúmulo de conhecimento dos movimentos sociais: diálogo
    necessário

    11. Riscos de uma exclusão repaginada: como o uso de tecnologias de informação
    e a gestão algorítmica ameaçam a inclusão

    12. O papel da comunicação para que a inclusão de fato aconteça

    Linguagem neutra, termos e expressões,  influencers da inclusão, comunicação como
    aliada e inimiga de uma sociedade mais equitativa e justa, infoinclusão; Os riscos
    da retórica desvinculada da prática

    12. Processos seletivos inclusivos, atração de talentos diversos. Etarismo.

    13. Para além do corpo: subjetividades, culturas e experiências diversas

    14. Ameaças à permanência e retenção de talentos diversos

    15. Carreira e promoção de talentos diversos.

    Convidadas: Talita Matos, Singuê, Vitor Martins, Nubank'
