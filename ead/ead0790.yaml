  course: "O programa da disciplina consiste em duas partes: comunicação empresarial\
    \ e desenvolvimento de relatório de pesquisa científica.\n1.\tPostura Profissional\
    \ e Ética Empresarial (2 aulas)\na.\tPontos Fortes e Fracos usualmente percebidos\n\
    2.\tComunicação Escrita (4 aulas)\na.\tEstrutura de um Relatório de Consultoria\
    \ Empresarial\ni.\tObjetivo do estudos\nii.\tJustificativa\niii.\tPúblico Alvo\n\
    iv.\tReferência\nv.\tLevantamento de Dados\nvi.\tOrganização dos Dados\nvii.\t\
    Análise dos Dados\nviii.\tConclusões\nb.\tAnálise de Relatórios de Consultoria\n\
    c.\tAnálise de Relatórios e Desempenho Corporativo\nd.\tAnálise de Relatório de\
    \ Comunicação Empresarial\n3.\tApresentação Oral (4 aulas)\na.\tPostura Corporal\n\
    b.\tDesenvolvimento da Apresentação\nc.\tObjetividade\nd.\tApresentação em Powerpoint\n\
    4.\tMetodologia de Pesquisa (4 aulas)\na.\tEstrutura\nb.\tObjetivo\nc.\tFontes\
    \ de Informações\nd.\tMetodologia\ne.\tResultados\nf.\tConclusões/Discussão dos\
    \ Resultados\ng.\tBibliografia\nh.\tNormas ABNT"
