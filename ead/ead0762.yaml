  course_name: 'EAD0762 - Fundamentos de Excelência em Operações

    Fundamentals of Excellence in Operations'
  deactivation: ''
  lecture_credits: '4'
  objectives: A gestão de operações cuida dos processos operacionais. Tais processos
    estão na base da atuação do gestor de qualquer unidade organizacional. A disciplina
    visa apresentar ao aluno o sistema de produção e operações e modelos, conceitos
    e técnicas de gestão voltados à excelência e melhoria contínua nos processos de
    produção de bens e prestação de serviços.
