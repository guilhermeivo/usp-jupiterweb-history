    Compreender o uso da imaginação no processo empreendedor;

    Estar equipado de uma série de conceitos e ferramentas para suportar as decisões
    ligadas à fundação da start-up;

    Compreender e aplicar as técnicas de design thinking ao desenvolvimento de inovações;

    Entender as principais abordagens para o desenvolvimento de produtos;

    Definir, modelar e projetar modelos de negócios para inovações;

    Compreender os principais modelos de operações para startups;

    Aplicar técnicas para modelagem financeira de novos empreendimentos;

    Aplicar conceitos de marketing para novos negócios.

