  course: "Tópicos\nIntrodução ao empreendedorismo\nOportunidades: reconhecimento\
    \ e criação de oportunidades\nUso da imaginação da imaginação na criação de novos\
    \ negócios\nFundação da empresa: quem incluir no time, como contratar e motivar\
    \ funcionários e como envolver investidores externos\nDesign thinking & projeto\
    \ da inovação (produto, serviço, processo)\nModelo de negócios: conceitos, cases,\
    \ abordagens de projeto de modelos de negócios\nOperações empreendedoras\nMarketing\n\
    Finanças empreendedoras: quanto investimento deve ser levantado, tipos de investidores,\
    \ quando buscar investidores, valoração, decisões de saída\nTotal de créditos:\
    \ Quatro créditos aula, dois créditos trabalho.\nOs dois créditos trabalho envolverão:\n\
    1.\tPlanejamento e pesquisa sobre necessidades de clientes e mercados\n2.\tPlanejamento\
    \ e pesquisa sobre tecnologias e opções tecnológicas\n3.\tPlanejamento e pesquisa\
    \ sobre modelos de negócio, tipologias e arquiteturas\n4.\tVisitas a startups\n\
    5.\tVisitas a incubadoras de empresas\n6.\tVisitas a aceleradoras\n7.\tTrabalho\
    \ especial de estruturação de um projeto de um startup\n8.\tTrabalho especial\
    \ de desenvolvimento de um protótipo de uma inovação\n9.\tConjunto de leituras\
    \ fundamentais sobre teorias, conceitos e ferramentas do empreendedorismo."
  course_name: 'EAD0910 - Empreendedorismo e Inovação

    Entrepreneurship and innovation'
  deactivation: ''
  instructors: 403396 - Andres Rodriguez Veloso
  lecture_credits: '4'
  objectives: O objetivo da disciplina é capacitar o aluno no desenvolvimento de novos
    negócios. Espera-se que ao final do curso o aluno desenvolva sua capacidade empreendedora.
    O aluno estará apto para desenvolver atividades empreendedoras por meio do trabalho
    em equipe, capacidade de comunicação e inovação.
  practical_credits: '2'
  total_workload: 120 h
  type: Semestral
