    Os alunos desenvolvem projeto para solucionar um problema existente, ou seja,
    uma inovação

    Entrepreneurship Thinking, Business Thinking e Design THinking

    Os alunos devem identificar a associação dos seus projetos com os objetivos da
    ODS

    Os alunos são organizados em equipes

    Os alunos formam equipess multidisciplinares incorporando diversidade de gênero,
    raça, cor

    Apresentações para professores e banca de investidores

    Desenvolvimento do Projeto de Empreendedorismo

    Desenvolvimento do protótipo do produto tecnológico'
