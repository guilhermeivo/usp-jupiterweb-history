  course_name: 'EAD0850 - Ciências Comportamentais e Tomada de Decisão

    Behavioral Science and Decision Making'
  deactivation: ''
  instructors: '3532378 - Daielly Melina Nassif Mantovani

    94701 - Fernando Carvalho de Almeida'
  lecture_credits: '2'
  objectives: '-Explicar o conceito Ciências Comportamentais e sua influência na tomada
    de decisão

    -Identificar os principais vieses cognitivos

    -Entender as técnicas de influência no processo decisório

    -Entender como são tomadas as decisões e o comportamento humano

    -Entender como os problemas são identificados e buscadas alternativas de decisão

    -Entender novas ferramentas de apoio à tomada de decisão

    -Entender as influências inconscientes no comportamento ético

    -Entender como as técnicas de Ciências Comportamentais ajudam a engajar o indivíduos
    em práticas socioambientais responsáveis

    -Identificar uma decisão, descrevendo os vieses que impactam na decisão em um
    caso real

    -Entender como as técnicas de Ciências Comportamentais ajudam a engajar o indivíduos
    em práticas de diversidade e influência

    - Interação com equipes no curso

    -Escrever uma análise de processo decisório

    -Buscas na Internet'
