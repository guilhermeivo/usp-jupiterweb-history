  course: '- Saúde: definições e escopo.

    - Introdução: o que é modelo de negócios. Componentes do modelo de negócios. Formas
    de representação (arquitetura) do modelo de negócios. Projeto (desenho) da empresa
    segundo o conceito de modelo de negócios.

    - Contextualização do setor de saúde: escopo da gestão no setor de saúde. Cadeia
    de valor da saúde. Organização do sistema de saúde do Brasil.

    - Tipologia de modelos de negócios em saúde. Segmentos-alvo de clientes.

    - Proposta de valor e posicionamento estratégico em saúde.

    - Modelo de operações em saúde.

    - Modelo de relacionamento com clientes em saúde.

    - Modelo de inovação e conhecimento em saúde.

    - Modelo econômico em saúde.

    - Modelo de gestão em saúde.'
  course_name: 'EAD0766 - Modelo de Negócios na Saúde

    Operations Management in Health'
  deactivation: ''
  instructors: 1617538 - Marcelo Caldeira Pedroso
  lecture_credits: '2'
  objectives: 'específicos:

    Estudar o conceito de modelo de negócios no contexto do setor de saúde.

    Abordar a utilização do conceito de modelo de negócios para: (1) análise de modelos
    de negócios atuais; (2) concepção (desenho) de novos modelos de negócios; e (3)
    inovação de modelo de negócios.

    Fornecer referencial conceitual, ferramental técnico e templates para modelagem
    de negócios.

    Abordar a integração entre modelo de negócios e gestão estratégica.'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
