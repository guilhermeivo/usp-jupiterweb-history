  course_name: 'EAD0714 - Governança Corporativa

    Corporate Governance'
  deactivation: ''
  lecture_credits: '2'
  objectives: "O aluno deverá aprofundar o conhecimento dos conceitos e práticas de\
    \ Governança Corporativa em um ambiente de crescente pressão por resultados financeiros,\
    \ transparência, prestação de contas associada à pressão por práticas sustentáveis\
    \ no ambiente de negócios. Este paradoxo em algumas situações pode levar a convergência\
    \ ou conflitos. Tendo como pano de fundo esta problemática, a disciplina aprofunda\
    \ o entendimento dos processos de tomada de decisão envolvendo as instâncias decisórias\
    \ e de controle da empresa (conselhos, diretorias, auditorias) e a moderna dinâmica\
    \ do capitalismo. Esta disciplina relaciona os conceitos de Governança Corporativa,\
    \ Sustentabilidade, Ética e suas implicações práticas no ambiente de negócios\
    \ contemporâneo.\nEspecificamente os objetivos da disciplina são:\n\x95\tCaracterizar\
    \ a natureza e os propósitos das organizações.\n\x95\tApresentar a fundamentação\
    \ teórica da governança corporativa.\n\x95\tCaracterizar o histórico, importância,\
    \ conceitos, questões centrais e ferramentas de governança corporativa e sua aplicação\
    \ em diferentes tipos de organizações.\n\x95\tIntegrar os fundamentos de Governança\
    \ e Ética nos negócios com as práticas de gestão empresarial.\n\x95\tCaracterizar\
    \ os processos de Governança Corporativa\n\x95\tDiscutir a evolução da Governança\
    \ corporativa no Brasil e tendências."
