  objectives: 'O Departamento de Administração realiza diversas atividades de Cultura
    e Extensão. Essas atividades proporcionam aos organizadores uma oportunidade única
    para desenvolver habilidades de gestão de projetos e eventos. Desta forma, seria
    muito proveitoso incluir alunos de graduação nestas iniciativas para que desenvolvam
    habilidades comportamentais relacionadas ao processo de realização de atividades
    de Cultura e Extensão.

    Oferecer ao aluno a oportunidade de participar do Planejamento e Operacionalização
    de Atividades de Cultura e Extensão;

    Desenvolver competências gerencias em alunos de graduação;

    Fomentar a iniciativa e autonomia na condução de atividades de Cultura e Extensão.

