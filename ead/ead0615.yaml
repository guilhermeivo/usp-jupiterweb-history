  course: '· Visão de conjunto do PMBOK - Project Management Body of Knowledge

    · Conceituação de projeto, programa, subprojeto e sistema

    · Ciclo de vida do projeto

    · Administração do ciclo de vida

    · Técnicas de preparação de projetos: gestão de escopo, prazo, custo, qualidade
    e risco

    · Programação de projetos: atividades, diagrama de precedências e cronograma

    · Elaboração do orçamento

    · Sistemas organizacionais de gestão de projetos

    · Estrutura organizacional

    · Papel do gerente de projetos

    · Negociação de projetos'
  course_name: 'EAD0615 - Gerenciamento de Projetos

