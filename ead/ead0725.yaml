  course: 'Syllabus.

    Contemporary Career Models and Theories. Self knowledge for Career Planning. Personality
    theories. Topics on careers theories: Boundaryless Careers, Protean Careers, Opt-out,
    Dual Careers and Work Life Integration. Career success around the world.

    A final paper and a theory presentation are required.'
  course_name: 'EAD0725 - Careers: new theories and aplications'
