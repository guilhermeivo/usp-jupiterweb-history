  course: 'Características do planejamento e controle financeiro

    Integração entre o plano estratégico e o planejamento e controle financeiro

    Elaboração do Orçamento

    Plano de vendas e Orçamento de contas a receber

    Plano de produção e de estoques - Plano de compras

    Plano de produção e custos industriais

    Plano de recursos humanos e despesas operacionais

    Orçamento de capital – Investimentos de longo prazo

    Orçamento das necessidades de capital de giro

    Orçamento de Caixa

    Preparação do plano global de resultados: Balanço, Demonstração de Resultados

    Controle Financeiro – Análise das variações orçamentárias

    Relatórios de desempenho e sistema de apoio às decisões

    Métricas de Desempenho'
  course_name: 'EAD0338 - Planejamento e Controle Financeiro

    Financial Planning and Control'
  deactivation: ''
  instructors: 5355200 - Rosana Tavares
  lecture_credits: '2'
  objectives: 'Aplicar técnicas de planejamento, orçamento e controle financeiro para
    o suporte na tomada de decisão em administração.

    Desenvolver uma estrutura completa de planejamento e orçamento financeiro para
    uma organização

    Identificar variáveis internas e externas às organizações que podem interferir
    na formação de resultados, e estruturar os planos orçamentários que permitam apurar
    os resultados esperados.

    Conhecer as ferramentas de controle orçamentário, que permitam identificar as
    causas dos desvios e realimentar o processo decisório

    Analisar o impacto das variáveis orçadas sobre a formação de resultados;

    Comparar e analisar os resultados obtidos, explicando as variáveis envolvidas.

    Desenvolverá a capacidade de trabalho em equipe através de atividades práticas,
    da mesma forma que as decisões financeiras são tomadas nos ambientes corporativos.

    Desenvolver habilidade de expor de forma oral o diagnóstico de planejamento e
    controle, de maneira organizada e focalizando os pontos de destaque.

    Desenvolver habilidade de expor de forma escrita o diagnóstico de planejamento
    e controle, de maneira organizada e focalizando os pontos de destaque.

    Desenvolver a capacidade de pesquisa em bancos de dados e sites especializados.

    Desenvolver a capacidade de utilização de ferramentas digitais como suporte à
    tomada de decisão financeira.'
  practical_credits: '0'
  total_workload: 30 h
  type: Semestral
