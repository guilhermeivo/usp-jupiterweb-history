  course_name: 'EAD0742 - Fundamentos de Marketing e Comportamento do Consumidor

    Fundamentals of Marketing and Consumer Behavior'
  deactivation: ''
  lecture_credits: '4'
  objectives: 'A disciplina tem como enfoque principal o bem fazer as trocas de Marketing,
    envolvendo empresas, instituições sem fins lucrativos, consumidores, stakeholders
    e a sociedade. Para isso utilizam-se inúmeras técnicas e conceitos que tem como
    objetivo permitir um melhor funcionamento do processo da troca. Esta disciplina
    apresenta um panorama geral do processo de marketing, visando da base para o aluno
    aprofundar esse conhecimento nas outras disciplinas da área que virão na sequencia
    do programa. É possível considerar essa disciplina como uma visão geral da floresta
    que compõem o conhecimento de marketing.

    The main focus of this course is to understand the importance of Marketing in
    facilitating market exchanges that involve companies, non-profit institutions,
    consumers, stakeholders and society in general. For that, several techniques and
    concepts are studied with the objective of enabling a better exchange process.
    This course provides an overview of the marketing process, in order to be a base
    for students to deepen their knowledge in following marketing courses. This course
    can be considered as an overview of marketing knowledge.'
  practical_credits: '0'
